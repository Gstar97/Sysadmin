# Glosario general de la carrera.
# Cada término se agrega junto con la lección que lo explica.

# Nivel 0 · Módulo 0.1
- id: cpu
  termino: CPU (procesador)
  alias: [procesador, microprocesador]
  definicion: Componente que ejecuta las instrucciones de los programas. Se describe por su cantidad de núcleos e hilos, su frecuencia y su caché.
  leccion: n0-m1-l1
- id: ram
  termino: RAM
  alias: [memoria, memoria principal]
  definicion: Memoria rápida donde están los programas y datos en uso. Es volátil, se borra al apagar el equipo.
  leccion: n0-m1-l1
- id: placa-madre
  termino: Placa madre
  alias: [motherboard, placa base]
  definicion: Placa principal donde se conectan el procesador, la memoria, los discos y las placas de expansión. Define qué componentes son compatibles.
  leccion: n0-m1-l1
- id: chipset
  termino: Chipset
  definicion: Circuito de la placa madre que concentra los dispositivos más lentos (SATA, USB, red integrada) y los comunica con la CPU por un único enlace compartido.
  leccion: n0-m1-l1
- id: pcie
  termino: PCIe (PCI Express)
  alias: [PCI Express]
  definicion: Bus de las placas de expansión y los discos NVMe. Se mide en generaciones (3.0, 4.0, 5.0) y líneas (x1, x4, x8, x16); cada generación duplica la velocidad por línea.
  leccion: n0-m1-l1
- id: bmc
  termino: BMC
  alias: [iDRAC, iLO, IPMI, Redfish, controlador de gestión]
  definicion: Computadora independiente dentro de un servidor, con su propio puerto de red, que permite encenderlo, apagarlo, ver su pantalla y leer sus sensores a distancia aunque el sistema operativo no responda.
  leccion: n0-m1-l1
- id: unidad-rack
  termino: Unidad de rack (U)
  alias: [rack, 1U, 2U]
  definicion: Medida de altura de los equipos que se montan en un rack. 1U son 44,45 mm; un rack estándar tiene 42U.
  leccion: n0-m1-l1
- id: registro
  termino: Registro (de la CPU)
  definicion: Celda de memoria dentro del procesador, la más rápida de la computadora. El contador de programa es un registro que indica cuál es la próxima instrucción.
  leccion: n0-m1-l2
- id: cache
  termino: Caché
  alias: [caché L1, caché L2, caché L3]
  definicion: Memoria pequeña y rápida que guarda copias de lo usado recientemente para no esperar a una memoria más lenta. En la CPU hay tres niveles (L1, L2 y L3).
  leccion: n0-m1-l2
- id: nucleo
  termino: Núcleo
  alias: [core]
  definicion: Unidad de procesamiento completa dentro de una CPU. Cada núcleo ejecuta su propio programa al mismo tiempo que los demás.
  leccion: n0-m1-l2
- id: smt
  termino: SMT (Hyper-Threading)
  alias: [Hyper-Threading, hilo, thread]
  definicion: Técnica que permite a un núcleo ejecutar dos hilos a la vez aprovechando sus tiempos de espera. El sistema ve cada hilo como una CPU, pero el rendimiento sube un 10 a 30%, no el doble.
  leccion: n0-m1-l2
- id: x86-64
  termino: x86-64
  alias: [amd64, x86_64, x86-64-v3]
  definicion: Arquitectura de 64 bits de los procesadores Intel y AMD. Se divide en niveles (v1 a v4) según las instrucciones disponibles; Rocky Linux 10 exige v3.
  leccion: n0-m1-l2
- id: arm64
  termino: ARM64
  alias: [aarch64, arm64]
  definicion: Arquitectura ARM de 64 bits, usada en celulares, Mac con Apple Silicon y servidores de nube como AWS Graviton. No es compatible con x86-64.
  leccion: n0-m1-l2
- id: latencia
  termino: Latencia
  definicion: Tiempo que tarda en llegar una respuesta desde que se hace el pedido. Se usa para memorias, discos y redes.
  leccion: n0-m1-l3
- id: dimm
  termino: DIMM
  alias: [UDIMM, RDIMM, SO-DIMM, módulo de memoria]
  definicion: Módulo de memoria RAM. UDIMM es el de PC, RDIMM el de servidor (con registro) y SO-DIMM el de notebook; no se pueden mezclar entre sí.
  leccion: n0-m1-l3
- id: ecc
  termino: ECC
  alias: [memoria ECC]
  definicion: Memoria con bits de control que corrige errores de un bit y detecta los de dos. Es estándar en servidores.
  leccion: n0-m1-l3
- id: hdd
  termino: HDD (disco rígido)
  alias: [disco rígido, disco duro]
  definicion: Disco que guarda los datos en platos magnéticos que giran. Barato por TB y bueno en lectura secuencial, pero lento en accesos al azar (unos 150 IOPS).
  leccion: n0-m1-l4
- id: ssd
  termino: SSD
  alias: [disco de estado sólido]
  definicion: Disco que guarda los datos en memoria flash, sin partes móviles. Puede conectarse por SATA (hasta unos 550 MB/s) o por NVMe.
  leccion: n0-m1-l4
- id: nvme
  termino: NVMe
  alias: [M.2, U.2, E3.S]
  definicion: Protocolo para SSD conectados por PCIe, con miles de colas en paralelo. Logra latencias de decenas de microsegundos y cientos de miles o millones de IOPS.
  leccion: n0-m1-l4
- id: iops
  termino: IOPS
  definicion: Operaciones de entrada y salida por segundo. Mide cuántas lecturas o escrituras pequeñas al azar puede hacer un disco.
  leccion: n0-m1-l4
- id: throughput
  termino: Throughput
  alias: [rendimiento secuencial, ancho de banda]
  definicion: Cantidad de datos que se mueven por segundo (MB/s o GB/s). En discos se mide leyendo o escribiendo datos seguidos.
  leccion: n0-m1-l4
- id: tbw
  termino: TBW y DWPD
  alias: [TBW, DWPD, durabilidad]
  definicion: Durabilidad declarada de un SSD. TBW son los terabytes que se pueden escribir en total; DWPD, las escrituras completas por día durante la garantía.
  leccion: n0-m1-l4
- id: smart
  termino: SMART
  alias: [smartctl, smartmontools]
  definicion: Datos de salud que registra cada disco (sectores dañados, desgaste, temperatura, errores). En Linux se leen con smartctl.
  leccion: n0-m1-l4
- id: firmware
  termino: Firmware
  alias: [BIOS]
  definicion: Programa guardado en un chip de la placa madre que se ejecuta al encender, prueba el hardware y busca el sistema operativo. Puede ser BIOS heredado o UEFI.
  leccion: n0-m1-l5
- id: post
  termino: POST
  definicion: Prueba que hace el firmware al encender (Power-On Self-Test). Si encuentra una falla grave, avisa con pitidos o luces porque todavía no hay video.
  leccion: n0-m1-l5
- id: uefi
  termino: UEFI
  definicion: Firmware moderno que arranca archivos .efi desde la partición EFI, soporta discos GPT grandes y Secure Boot. Reemplaza al BIOS heredado.
  leccion: n0-m1-l5
- id: gpt
  termino: GPT
  alias: [MBR, tabla de particiones]
  definicion: Formato de tabla de particiones de los discos actuales. Admite discos enormes y 128 particiones y guarda una copia de la tabla. Reemplaza a MBR, limitado a 2 TiB.
  leccion: n0-m1-l5
- id: particion-efi
  termino: Partición EFI
  alias: [ESP, EFI System Partition]
  definicion: Partición pequeña con formato FAT32 donde cada sistema operativo deja su cargador de arranque para que UEFI lo encuentre.
  leccion: n0-m1-l5
- id: secure-boot
  termino: Secure Boot
  alias: [arranque seguro, shim, MOK]
  definicion: Función de UEFI que solo deja arrancar cargadores firmados con claves registradas en el firmware. Linux lo cumple con shim, firmado por Microsoft.
  leccion: n0-m1-l5
- id: cargador-arranque
  termino: Cargador de arranque
  alias: [GRUB, bootloader, Windows Boot Manager]
  definicion: Programa que carga el kernel del sistema operativo. En Linux suele ser GRUB; en Windows, el Windows Boot Manager.
  leccion: n0-m1-l5

# Nivel 0 · Módulo 0.2
- id: sistema-operativo
  termino: Sistema operativo
  definicion: Programa que reparte el hardware entre las aplicaciones, esconde los detalles de cada dispositivo, protege a unos programas de otros y ofrece servicios comunes (archivos, red, usuarios).
  leccion: n0-m2-l1
- id: kernel
  termino: Kernel
  alias: [núcleo]
  definicion: Parte central del sistema operativo, la única con acceso completo al hardware. Corre en modo privilegiado; un error en el kernel detiene toda la máquina.
  leccion: n0-m2-l1
- id: llamada-sistema
  termino: Llamada al sistema
  alias: [syscall, system call]
  definicion: Pedido de un programa al kernel para hacer algo que no puede hacer solo, como abrir un archivo o usar la red. Se pueden ver con strace.
  leccion: n0-m2-l1
- id: driver
  termino: Driver
  alias: [controlador, módulo del kernel]
  definicion: Código del kernel que sabe comunicarse con un dispositivo concreto. En Linux suelen venir incluidos como módulos; en Windows muchos los provee el fabricante.
  leccion: n0-m2-l1
- id: distribucion
  termino: Distribución de Linux
  alias: [distro]
  definicion: Sistema operativo completo armado sobre el kernel Linux, con herramientas, instalador, paquetes, actualizaciones y soporte. Por ejemplo Rocky Linux, Ubuntu o Debian.
  leccion: n0-m2-l1
- id: proceso
  termino: Proceso
  definicion: Programa en ejecución, con su propia memoria, un usuario dueño y un número único (PID).
  leccion: n0-m2-l2
- id: pid
  termino: PID
  alias: [PPID, identificador de proceso]
  definicion: Número que identifica a un proceso. El PPID es el PID de su proceso padre; en Linux el PID 1 es systemd.
  leccion: n0-m2-l2
- id: hilo
  termino: Hilo
  alias: [thread]
  definicion: Línea de ejecución dentro de un proceso. Los hilos de un proceso comparten su memoria y pueden ejecutarse en núcleos distintos al mismo tiempo.
  leccion: n0-m2-l2
- id: planificador
  termino: Planificador
  alias: [scheduler, nice]
  definicion: Parte del kernel que decide qué proceso usa cada CPU y durante cuánto tiempo. En Linux la prioridad se ajusta con el valor nice.
  leccion: n0-m2-l2
- id: senal
  termino: Señal
  alias: [SIGTERM, SIGKILL, kill]
  definicion: Aviso que se envía a un proceso con kill. SIGTERM le pide terminar ordenadamente; SIGKILL lo termina en el acto.
  leccion: n0-m2-l2
- id: load-average
  termino: Load average
  alias: [carga del sistema]
  definicion: Promedio de procesos que usan la CPU o esperan para usarla (en Linux, también los que esperan al disco), en 1, 5 y 15 minutos. Se compara con la cantidad de CPU.
  leccion: n0-m2-l2
- id: memoria-virtual
  termino: Memoria virtual
  definicion: Espacio de direcciones propio de cada proceso, que el kernel traduce a posiciones reales en la RAM o en el swap. Aísla a los procesos entre sí.
  leccion: n0-m2-l3
- id: pagina
  termino: Página (de memoria)
  alias: [page fault, fallo de página]
  definicion: Bloque de memoria de tamaño fijo, normalmente 4 KiB. Cuando un proceso usa una página que no está en la RAM se produce un fallo de página.
  leccion: n0-m2-l3
- id: swap
  termino: Swap
  alias: [archivo de paginación, pagefile.sys]
  definicion: Espacio en el disco donde el sistema mueve páginas de memoria poco usadas cuando la RAM no alcanza. Usarlo todo el tiempo vuelve muy lento al servidor.
  leccion: n0-m2-l3
- id: oom-killer
  termino: OOM killer
  alias: [Out Of Memory, systemd-oomd]
  definicion: Mecanismo del kernel de Linux que, cuando se agotan la RAM y el swap, termina un proceso (casi siempre el que más memoria ocupa) para recuperar memoria.
  leccion: n0-m2-l3
- id: cache-disco
  termino: Caché de disco
  alias: [page cache, buff/cache]
  definicion: Copias de archivos leídos recientemente que el sistema guarda en la RAM libre. Se liberan en cuanto un programa necesita esa memoria.
  leccion: n0-m2-l3
- id: ruta-absoluta
  termino: Ruta absoluta y relativa
  alias: [ruta, path, ruta relativa]
  definicion: Una ruta absoluta indica un archivo desde la raíz (/var/log en Linux, C:\Users en Windows); una relativa, desde la carpeta actual.
  leccion: n0-m2-l4
- id: sistema-archivos
  termino: Sistema de archivos
  alias: [filesystem, XFS, ext4, NTFS, FAT32, exFAT]
  definicion: Organización que se escribe sobre una partición para guardar archivos y carpetas con sus metadatos. Formatear es crear uno vacío.
  leccion: n0-m2-l4
- id: montaje
  termino: Montar
  alias: [punto de montaje, fstab]
  definicion: Conectar un sistema de archivos a una carpeta del árbol de Linux para poder usarlo. /etc/fstab lista lo que se monta al arrancar.
  leccion: n0-m2-l4
- id: inodo
  termino: Inodo
  alias: [inode]
  definicion: Estructura del sistema de archivos que guarda los metadatos de un archivo (dueño, grupo, permisos, tamaño, fechas y ubicación). El nombre está en la carpeta.
  leccion: n0-m2-l4
- id: extension
  termino: Extensión
  definicion: Parte final del nombre de un archivo (.pdf, .exe). Windows la usa para elegir con qué abrirlo; no garantiza el tipo real, que se ve con file.
  leccion: n0-m2-l4
- id: root
  termino: root
  alias: [superusuario, UID 0, Administrador]
  definicion: Cuenta de superusuario de Linux, con UID 0. Puede hacer cualquier cosa en el sistema. En Windows, el equivalente es la cuenta Administrador y el grupo Administradores.
  leccion: n0-m2-l5
- id: cuenta-servicio
  termino: Cuenta de servicio
  alias: [nologin, gMSA]
  definicion: Cuenta con la que corre un servicio (nginx, mysql), con permisos limitados y sin posibilidad de iniciar sesión.
  leccion: n0-m2-l5
- id: minimo-privilegio
  termino: Mínimo privilegio
  definicion: Principio de seguridad según el cual cada persona, servicio o tarea recibe solo los permisos que necesita, y solo mientras los necesita.
  leccion: n0-m2-l5
- id: sudo
  termino: sudo
  alias: [sudoers, wheel, visudo]
  definicion: Comando de Linux que ejecuta otro comando como root (u otro usuario) si /etc/sudoers lo permite. Pide la contraseña propia y registra cada uso.
  leccion: n0-m2-l5
- id: uac
  termino: UAC
  alias: [Control de cuentas de usuario, ejecutar como administrador]
  definicion: Mecanismo de Windows por el que incluso los administradores trabajan sin privilegios hasta confirmar una acción que los requiere.
  leccion: n0-m2-l5
