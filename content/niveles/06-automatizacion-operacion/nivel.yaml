id: n6
titulo: Automatización y operación
descripcion: 'Dejar de hacer las cosas a mano: Git para versionar configuraciones, Python para herramientas
  propias, Ansible para configurar flotas de servidores de forma repetible, y monitoreo, alertas y centralización
  de logs para enterarse de los problemas antes que las personas usuarias.'
perfil_salida: Mantener la infraestructura como código en Git, automatizar configuraciones con Ansible,
  escribir herramientas en Python y operar un sistema de monitoreo, alertas y logs centralizados.
insignia:
  nombre: Automatización y operación
  color: '#15803d'
proyecto_plan:
  titulo: Infraestructura como código y observabilidad
  horas: 24
  entregables:
  - Repositorio Git con roles de Ansible que despliegan desde cero servidores web, de base de datos y
    de monitoreo.
  - Zabbix o Prometheus con Grafana y alertas configuradas.
  - Loki con logs centralizados de toda la infraestructura.
  - Herramienta en Python que genera un reporte de estado, programada.
  - Prueba de reconstrucción completa del entorno desde el repositorio.
