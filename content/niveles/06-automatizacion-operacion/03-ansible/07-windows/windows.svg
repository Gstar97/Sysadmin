<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="an-win" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">El mismo Ansible, dos formas de llegar a Windows</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="230" height="226" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="590" y="40" width="250" height="78" rx="8" fill="var(--surface-2, #f1f3f6)"/>
    <rect x="590" y="132" width="250" height="134" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="20" y="282" width="400" height="84" rx="8" fill="var(--surface, #fff)"/>
    <rect x="440" y="282" width="400" height="84" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#an-win)">
    <path d="M250 79 L588 79"/>
    <path d="M250 170 L588 170"/>
    <path d="M250 230 L588 230"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="62" font-weight="700">nodo de control (Linux)</text>
    <g font-size="11">
      <text x="34" y="84">ansible-core</text>
      <text x="34" y="102">colecciones ansible.windows,</text>
      <text x="34" y="118">community.windows, microsoft.ad</text>
      <text x="34" y="142">pywinrm (para WinRM)</text>
      <text x="34" y="166">inventario: grupo windows con</text>
      <text x="34" y="182">ansible_connection y su usuario</text>
      <text x="34" y="206">la contraseña, en Vault</text>
      <text x="34" y="230">no hay nodo de control en</text>
      <text x="34" y="246">Windows (WSL sí sirve)</text>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="419" y="70">SSH, puerto 22, y Python en el equipo</text>
      <text x="419" y="161">WinRM: HTTPS 5986 (NTLM o Kerberos)</text>
      <text x="419" y="221">SSH: OpenSSH de Windows, puerto 22</text>
      <text x="419" y="246">ansible_shell_type: powershell</text>
    </g>
    <text x="604" y="62" font-weight="700">web01 (Rocky Linux)</text>
    <g font-size="11"><text x="604" y="84">módulos en Python</text><text x="604" y="102">become con sudo</text></g>
    <text x="604" y="154" font-weight="700">win01 (Windows Server 2025)</text>
    <g font-size="11">
      <text x="604" y="176">módulos en PowerShell, sin Python</text>
      <g font-family="ui-monospace, monospace">
        <text x="604" y="198">win_feature</text><text x="704" y="198">win_service</text>
        <text x="604" y="214">win_copy</text><text x="704" y="214">win_user</text>
        <text x="604" y="230">win_updates</text><text x="704" y="230">win_regedit</text>
        <text x="604" y="246">win_package</text><text x="704" y="246">win_firewall_rule</text>
      </g>
    </g>
    <text x="34" y="304" font-weight="700">lo que no cambia</text>
    <g font-size="11">
      <text x="34" y="324">inventario, playbooks, roles, variables, handlers,</text>
      <text x="34" y="340">--check, --diff, Vault, ansible-lint y Git:</text>
      <text x="34" y="356">todo lo de este módulo vale igual</text>
    </g>
    <text x="454" y="304" font-weight="700">lo que sí cambia</text>
    <g font-size="11">
      <text x="454" y="324">módulos win_* (copy, service y file no sirven)</text>
      <text x="454" y="340">rutas C:\... · become con runas, no sudo</text>
      <text x="454" y="356">reinicios con win_reboot · sin facts de Linux</text>
    </g>
  </g>
</svg>
