- { id: t1, frente: "Ansible y Windows", dorso: "Nodo de control Linux (o WSL). En Windows no hace falta Python: los módulos son de PowerShell." }
- { id: t2, frente: "WinRM para Ansible", dorso: "HTTPS 5986, pywinrm en el nodo de control, NTLM o Kerberos (usuario@DOMINIO en mayúsculas)." }
- { id: t3, frente: "SSH con Windows", dorso: "OpenSSH incluido en Windows Server 2025. ansible_connection=ssh, ansible_shell_type=powershell, ansible-core 2.18+." }
- { id: t4, frente: "Módulos de Windows", dorso: "win_feature, win_service, win_copy, win_template, win_user, win_updates, win_reboot, win_regedit, win_firewall_rule." }
- { id: t5, frente: "Active Directory en Ansible", dorso: "Colección microsoft.ad: user, group, ou, membership, domain (antes win_domain_*)." }
- { id: t6, frente: "become en Windows", dorso: "Método runas, no sudo. Casi nunca hace falta: el usuario ya es administrador." }
- { id: t7, frente: "Probar la conexión con Windows", dorso: "ansible windows -m ansible.windows.win_ping" }
