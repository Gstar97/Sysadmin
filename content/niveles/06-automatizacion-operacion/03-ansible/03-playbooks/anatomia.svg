<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="an-pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Un playbook y lo que muestra al correrlo</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="420" height="346" rx="8" fill="var(--surface-2, #f1f3f6)"/>
    <rect x="30" y="50" width="400" height="58" rx="5" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="30" y="116" width="400" height="76" rx="5" fill="var(--surface, #fff)"/>
    <rect x="30" y="200" width="400" height="96" rx="5" fill="var(--surface, #fff)"/>
    <rect x="30" y="304" width="400" height="74" rx="5" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="480" y="40" width="360" height="346" rx="8" fill="var(--term-bg, #0d1117)"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="11">
    <text x="40" y="70">- name: Servidores web</text>
    <text x="54" y="86">hosts: web</text>
    <text x="54" y="102">become: true</text>
    <text x="54" y="134">tasks:</text>
    <text x="68" y="150">- name: Instalar nginx</text>
    <text x="82" y="166">ansible.builtin.package:</text>
    <text x="96" y="182">name: nginx</text>
    <text x="68" y="218">- name: Sitio</text>
    <text x="82" y="234">ansible.builtin.template:</text>
    <text x="96" y="250">src: tienda.conf.j2</text>
    <text x="96" y="266">dest: /etc/nginx/conf.d/tienda.conf</text>
    <text x="82" y="284">notify: Recargar nginx</text>
    <text x="54" y="322">handlers:</text>
    <text x="68" y="338">- name: Recargar nginx</text>
    <text x="82" y="354">ansible.builtin.service:</text>
    <text x="96" y="370">name: nginx  state: reloaded</text>
  </g>
  <g fill="var(--term-fg, #e6edf3)" font-family="ui-monospace, monospace" font-size="10.5">
    <text x="492" y="66">PLAY [Servidores web] ******</text>
    <text x="492" y="92">TASK [Gathering Facts] *****</text>
    <text x="492" y="108" fill="var(--ok, #2f9e5a)">ok: [web01]</text>
    <text x="492" y="134">TASK [Instalar nginx] ******</text>
    <text x="492" y="150" fill="var(--warn, #d98e04)">changed: [web01]</text>
    <text x="492" y="176">TASK [Sitio] ***************</text>
    <text x="492" y="192" fill="var(--warn, #d98e04)">changed: [web01]</text>
    <text x="492" y="218">RUNNING HANDLER [Recargar nginx]</text>
    <text x="492" y="234" fill="var(--warn, #d98e04)">changed: [web01]</text>
    <text x="492" y="262">PLAY RECAP *****************</text>
    <text x="492" y="280">web01 : ok=4 changed=3</text>
    <text x="492" y="296">        unreachable=0 failed=0</text>
    <text x="492" y="322" fill="var(--muted, #8b949e)">y la segunda vez:</text>
    <text x="492" y="340">web01 : ok=3 changed=0</text>
    <text x="492" y="356" fill="var(--muted, #8b949e)">(el handler no corre: no</text>
    <text x="492" y="372" fill="var(--muted, #8b949e)">cambió nada que lo avise)</text>
  </g>
</svg>
