- { id: t1, frente: "Estructura de un playbook", dorso: "Lista de plays: name, hosts, become, vars, tasks, handlers. Cada tarea: name, módulo (FQCN) y argumentos con más sangría." }
- { id: t2, frente: "Handler", dorso: "Tarea que corre solo si otra la avisó con notify y cambió algo; una vez, al final del play." }
- { id: t3, frente: "Antes de aplicar", dorso: "--syntax-check, --check --diff, -l un servidor, todos, y otra vez para ver changed=0." }
- { id: t4, frente: "validate y backup", dorso: "validate prueba el archivo nuevo (sshd -t -f %s, visudo -cf %s); backup guarda el anterior." }
- { id: t5, frente: "Límite de --check", dorso: "No ejecuta comandos ni instala: una tarea que depende de otra puede fallar solo en la prueba." }
- { id: t6, frente: "Leer un error", dorso: "fatal: [equipo]: FAILED! => {... \"msg\": ...}: el msg dice qué pasó. ERROR! ... line X: problema de escritura del YAML." }
