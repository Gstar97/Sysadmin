<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Un inventario: grupos, grupos de grupos y variables</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="380" height="286" rx="8" fill="var(--surface-2, #f1f3f6)"/>
    <rect x="460" y="40" width="380" height="60" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="460" y="114" width="180" height="56" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="660" y="114" width="180" height="56" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="460" y="184" width="180" height="62" rx="8" fill="var(--surface, #fff)"/>
    <rect x="660" y="184" width="180" height="62" rx="8" fill="var(--surface, #fff)"/>
    <rect x="460" y="262" width="380" height="64" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <path d="M650 100 L550 114"/><path d="M650 100 L750 114"/>
    <path d="M550 170 L550 184"/><path d="M750 170 L750 184"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="60" font-weight="700">inventario.ini</text>
    <g font-family="ui-monospace, monospace" font-size="11">
      <text x="34" y="86">[web]</text>
      <text x="34" y="104">web01</text>
      <text x="34" y="122">web02  ansible_host=192.168.10.22</text>
      <text x="34" y="146">[db]</text>
      <text x="34" y="164">db01   ansible_user=admin</text>
      <text x="34" y="188">[produccion:children]</text>
      <text x="34" y="206">web</text>
      <text x="34" y="224">db</text>
      <text x="34" y="248">[web:vars]</text>
      <text x="34" y="266">http_port=80</text>
      <text x="34" y="296" font-family="system-ui, sans-serif" font-size="11">all incluye a todos; ungrouped, a los que</text>
      <text x="34" y="312" font-family="system-ui, sans-serif" font-size="11">no están en ningún grupo</text>
    </g>
    <g text-anchor="middle">
      <text x="650" y="64" font-weight="700">all → produccion</text>
      <text x="650" y="84" font-size="11">el grupo padre: sus variables valen para los hijos</text>
      <text x="550" y="138" font-weight="700">web</text>
      <text x="550" y="156" font-size="11">http_port: 80</text>
      <text x="750" y="138" font-weight="700">db</text>
      <text x="750" y="156" font-size="11">(sin variables)</text>
      <g font-family="ui-monospace, monospace" font-size="11">
        <text x="550" y="206">web01</text>
        <text x="550" y="226">web02 → 192.168.10.22</text>
        <text x="750" y="216">db01 (usuario admin)</text>
      </g>
      <text x="650" y="284" font-weight="700">quién gana si una variable está en varios lados</text>
      <text x="650" y="306" font-size="11">all &lt; grupo padre &lt; grupo hijo &lt; el equipo &lt; -e en la línea de comandos</text>
    </g>
  </g>
</svg>
