- { id: t1, frente: "Variables de conexión", dorso: "ansible_host (IP o nombre real), ansible_user, ansible_port, ansible_become." }
- { id: t2, frente: "Grupos de grupos", dorso: "[produccion:children] en INI; children: en YAML." }
- { id: t3, frente: "group_vars y host_vars", dorso: "Carpetas al lado del inventario. Gana lo más específico: equipo > grupo hijo > padre > all; -e por encima de todo." }
- { id: t4, frente: "Revisar el inventario", dorso: "ansible-inventory --graph, --host EQUIPO, --list; ansible PATRÓN --list-hosts." }
- { id: t5, frente: "Patrones", dorso: "all, grupo, a:b (unión), a:&b (intersección), a:!b (menos), web0*; --limit achica." }
- { id: t6, frente: "Ad hoc", dorso: "ansible PATRÓN -m módulo -a \"args\" -b -K -o. command (por defecto) no usa shell; shell sí." }
