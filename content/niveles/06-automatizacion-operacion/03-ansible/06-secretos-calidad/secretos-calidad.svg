<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="an-sc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Secretos fuera de la vista y cambios que se prueban antes de llegar</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="380" height="140" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="20" y="192" width="180" height="74" rx="8" fill="var(--bad-soft, #fde2e1)"/>
    <rect x="220" y="192" width="180" height="74" rx="8" fill="var(--surface-2, #f1f3f6)"/>
    <rect x="20" y="278" width="380" height="88" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="460" y="40" width="380" height="56" rx="8" fill="var(--surface, #fff)"/>
    <rect x="460" y="108" width="380" height="56" rx="8" fill="var(--surface, #fff)"/>
    <rect x="460" y="176" width="380" height="110" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="460" y="298" width="380" height="68" rx="8" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="62" font-weight="700">en el repositorio</text>
    <g font-family="ui-monospace, monospace" font-size="11">
      <text x="34" y="86">group_vars/db/vars.yml       (legible)</text>
      <text x="50" y="104">db_password: "{{ vault_db_password }}"</text>
      <text x="34" y="128">group_vars/db/vault.yml      (cifrado)</text>
      <text x="50" y="146">$ANSIBLE_VAULT;1.1;AES256</text>
      <text x="50" y="164">6236346265...</text>
    </g>
    <text x="34" y="214" font-weight="700">afuera del repositorio</text>
    <g font-size="11"><text x="34" y="234">~/.vault_pass (600), o un</text><text x="34" y="250">script que la pide al gestor</text></g>
    <text x="234" y="214" font-weight="700">en el servidor</text>
    <g font-size="11"><text x="234" y="234">el archivo final, con</text><text x="234" y="250">permisos 0600</text></g>
    <text x="34" y="300" font-weight="700">en la salida de Ansible</text>
    <g font-family="ui-monospace, monospace" font-size="11">
      <text x="34" y="324">no_log: true</text>
      <text x="34" y="344">changed: [db01] => {"censored": "the output</text>
      <text x="34" y="360">has been hidden ..."}</text>
    </g>
    <text x="474" y="62" font-weight="700">1. en tu equipo: pre-commit</text>
    <text x="474" y="82" font-size="11">ansible-lint, yamllint y gitleaks antes de cada commit</text>
    <text x="474" y="130" font-weight="700">2. el pull request</text>
    <text x="474" y="150" font-size="11">alguien revisa el cambio y la salida de --check --diff</text>
    <text x="474" y="198" font-weight="700">3. integración continua</text>
    <g font-size="11">
      <text x="474" y="218">ansible-lint y --syntax-check</text>
      <text x="474" y="236">Molecule: crea un contenedor, aplica el rol, lo aplica</text>
      <text x="474" y="252">otra vez (tiene que dar changed=0), verifica y lo borra</text>
      <text x="474" y="272">--check --diff contra el entorno de pruebas</text>
    </g>
    <text x="474" y="320" font-weight="700">4. pruebas, después producción</text>
    <text x="474" y="340" font-size="11">el mismo commit, primero -i inventarios/pruebas</text>
    <text x="474" y="356" font-size="11">y después -i inventarios/produccion</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M650 96 L650 106" marker-end="url(#an-sc)"/>
    <path d="M650 164 L650 174" marker-end="url(#an-sc)"/>
    <path d="M650 286 L650 296" marker-end="url(#an-sc)"/>
  </g>
</svg>
