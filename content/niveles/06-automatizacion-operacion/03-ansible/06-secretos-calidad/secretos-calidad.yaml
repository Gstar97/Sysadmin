tipo: diagrama
titulo: Secretos y calidad
puntos:
  - id: repo
    titulo: Los secretos en el repositorio
    area: { x: 2.3, y: 10.5, ancho: 44.2, alto: 36.8 }
    texto: >-
      Dos archivos por grupo: vars.yml, legible, donde db_password apunta a vault_db_password, y
      vault.yml, cifrado con ansible-vault, que tiene el valor real. Así se puede buscar dónde se usa
      cada variable sin descifrar nada, y el cifrado se puede commitear sin riesgo.
  - id: clave
    titulo: La contraseña de Vault
    area: { x: 2.3, y: 50.5, ancho: 20.9, alto: 19.5 }
    texto: >-
      Afuera del repositorio: un archivo con permisos 600 (vault_password_file en ansible.cfg), o
      mejor, un script ejecutable que la saca de un gestor de contraseñas. En la integración
      continua, de un secreto del sistema de CI. Si se filtra, se cambia con ansible-vault rekey.
  - id: servidor
    titulo: En el servidor
    area: { x: 25.6, y: 50.5, ancho: 20.9, alto: 19.5 }
    texto: >-
      Ansible descifra el valor en el nodo de control y lo deja donde lo necesita la aplicación,
      con permisos restrictivos (0600, del usuario del servicio).
  - id: salida
    titulo: no_log
    area: { x: 2.3, y: 73.2, ancho: 44.2, alto: 23.2 }
    texto: >-
      Sin no_log, una tarea que usa el secreto lo puede mostrar en la salida (con -v, con --diff o
      si falla), y esa salida termina en los logs de la integración continua. Con no_log: true,
      Ansible muestra "censored" en su lugar.
  - id: precommit
    titulo: pre-commit
    area: { x: 53.5, y: 10.5, ancho: 44.2, alto: 14.7 }
    texto: >-
      Los mismos ganchos del módulo 6.1, con ansible-lint, yamllint y gitleaks: un playbook con
      errores o un secreto sin cifrar no llega ni a commitearse.
  - id: ci
    titulo: Integración continua y Molecule
    area: { x: 53.5, y: 46.3, ancho: 44.2, alto: 29 }
    texto: >-
      Molecule prueba un rol de punta a punta: crea un servidor descartable (un contenedor o una VM),
      aplica el rol, lo aplica de nuevo para comprobar que no cambia nada (idempotencia), corre
      verificaciones y lo borra. Junto con ansible-lint y una corrida en --check, es lo que hace
      confiable un cambio antes de que alguien lo apruebe.
  - id: entornos
    titulo: De pruebas a producción
    area: { x: 53.5, y: 78.4, ancho: 44.2, alto: 17.9 }
    texto: >-
      El mismo commit, sin cambios, se aplica primero en pruebas y después en producción. Si algo
      falla, falla donde no hace daño.
