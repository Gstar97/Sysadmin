- { id: t1, frente: "Idempotencia", dorso: "Correr la automatización una o cien veces deja el mismo resultado; solo cambia lo que falta." }
- { id: t2, frente: "Imperativo y declarativo", dorso: "Imperativo: qué hacer, paso por paso (un script). Declarativo: cómo tiene que quedar (Ansible)." }
- { id: t3, frente: "Deriva de configuración", dorso: "Cambios a mano que separan un servidor de cómo debería estar. Volver a correr Ansible los detecta y corrige." }
- { id: t4, frente: "Sin agente", dorso: "Ansible entra por SSH, copia el módulo, lo ejecuta con python3 y lo borra. En el servidor no queda nada instalado." }
- { id: t5, frente: "ansible-core y ansible", dorso: "ansible-core: motor y ansible.builtin. ansible: motor más unas cien colecciones." }
- { id: t6, frente: "Qué ansible.cfg se usa", dorso: "ANSIBLE_CONFIG, ./ansible.cfg, ~/.ansible.cfg, /etc/ansible/ansible.cfg. ansible --version lo muestra." }
