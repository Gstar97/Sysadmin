<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="an-arq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Cómo trabaja Ansible: un nodo de control, SSH y nada instalado en los servidores</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="44" width="300" height="296" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="36" y="84" width="268" height="54" rx="6" fill="var(--surface, #fff)"/>
    <rect x="36" y="148" width="268" height="54" rx="6" fill="var(--surface, #fff)"/>
    <rect x="36" y="212" width="268" height="54" rx="6" fill="var(--surface, #fff)"/>
    <rect x="36" y="276" width="268" height="50" rx="6" fill="var(--surface, #fff)"/>
    <rect x="560" y="44" width="280" height="140" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="560" y="200" width="280" height="140" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="170" y="68" text-anchor="middle" font-weight="700">nodo de control (admin01)</text>
    <text x="48" y="106" font-weight="700">ansible.cfg</text>
    <text x="48" y="126" font-size="11">cómo conectarse, dónde está el inventario</text>
    <text x="48" y="170" font-weight="700">inventario</text>
    <text x="48" y="190" font-size="11">qué servidores hay y en qué grupos</text>
    <text x="48" y="234" font-weight="700">playbooks y roles</text>
    <text x="48" y="254" font-size="11">el estado deseado, en YAML (en Git)</text>
    <text x="48" y="298" font-weight="700">ansible-core</text>
    <text x="48" y="316" font-size="11">Python, con los módulos</text>
    <text x="700" y="68" text-anchor="middle" font-weight="700">web01 (Rocky)</text>
    <text x="700" y="220" text-anchor="middle" font-weight="700">web02 (Ubuntu)</text>
    <g font-size="11" text-anchor="middle">
      <text x="700" y="92">solo sshd y python3</text>
      <text x="700" y="112">1. llega el módulo a ~/.ansible/tmp</text>
      <text x="700" y="130">2. python3 lo ejecuta</text>
      <text x="700" y="148">3. compara y cambia lo necesario</text>
      <text x="700" y="166">4. devuelve JSON y se borra</text>
      <text x="700" y="244">sin agente instalado</text>
      <text x="700" y="264">ni puertos nuevos</text>
      <text x="700" y="290">el mismo playbook sirve para</text>
      <text x="700" y="308">las dos distribuciones</text>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="440" y="86">SSH con tu clave</text>
      <text x="440" y="101">(y sudo para become)</text>
      <text x="430" y="292">resultado: ok, changed,</text>
      <text x="430" y="308">failed, unreachable</text>
    </g>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <path d="M320 130 L558 110" marker-end="url(#an-arq)"/>
    <path d="M320 150 L558 260" marker-end="url(#an-arq)"/>
    <path d="M558 290 L322 230" marker-end="url(#an-arq)" stroke-dasharray="4 3"/>
  </g>
</svg>
