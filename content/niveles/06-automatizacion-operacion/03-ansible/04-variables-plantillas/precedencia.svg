<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="system-ui, sans-serif" font-size="12">
  <defs><marker id="an-prec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Si una variable está en varios lugares, gana la de más arriba</text>
  <rect x="120" y="40" width="560" height="34" rx="6" fill="var(--bad-soft, #fde2e1)" stroke="currentColor" stroke-width="1.1"/>
  <text x="136" y="62" font-weight="700" fill="currentColor">-e en la línea de comandos</text>
  <text x="664" y="62" text-anchor="end" font-size="11" fill="currentColor">gana siempre</text>
  <rect x="120" y="80" width="560" height="34" rx="6" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1.1"/>
  <text x="136" y="102" font-weight="700" fill="currentColor">vars de bloque y tarea, set_fact, register</text>
  <text x="664" y="102" text-anchor="end" font-size="11" fill="currentColor">durante la corrida</text>
  <rect x="120" y="120" width="560" height="34" rx="6" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1.1"/>
  <text x="136" y="142" font-weight="700" fill="currentColor">vars del rol</text>
  <text x="664" y="142" text-anchor="end" font-size="11" fill="currentColor">roles/web/vars/main.yml</text>
  <rect x="120" y="160" width="560" height="34" rx="6" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1.1"/>
  <text x="136" y="182" font-weight="700" fill="currentColor">vars y vars_files del play</text>
  <text x="664" y="182" text-anchor="end" font-size="11" fill="currentColor">en el playbook</text>
  <rect x="120" y="200" width="560" height="34" rx="6" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-width="1.1"/>
  <text x="136" y="222" font-weight="700" fill="currentColor">facts</text>
  <text x="664" y="222" text-anchor="end" font-size="11" fill="currentColor">ansible_facts del servidor</text>
  <rect x="120" y="240" width="560" height="34" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.1"/>
  <text x="136" y="262" font-weight="700" fill="currentColor">host_vars/&lt;equipo&gt;</text>
  <text x="664" y="262" text-anchor="end" font-size="11" fill="currentColor">lo propio de un servidor</text>
  <rect x="120" y="280" width="560" height="34" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.1"/>
  <text x="136" y="302" font-weight="700" fill="currentColor">group_vars/&lt;grupo&gt;</text>
  <text x="664" y="302" text-anchor="end" font-size="11" fill="currentColor">padres antes que hijos</text>
  <rect x="120" y="320" width="560" height="34" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.1"/>
  <text x="136" y="342" font-weight="700" fill="currentColor">group_vars/all</text>
  <text x="664" y="342" text-anchor="end" font-size="11" fill="currentColor">lo común a todos</text>
  <rect x="120" y="360" width="560" height="34" rx="6" fill="var(--surface-2, #f1f3f6)" stroke="currentColor" stroke-width="1.1"/>
  <text x="136" y="382" font-weight="700" fill="currentColor">defaults del rol</text>
  <text x="664" y="382" text-anchor="end" font-size="11" fill="currentColor">roles/web/defaults/main.yml</text>
  <path d="M80 390 L80 44" stroke="currentColor" stroke-width="1.8" fill="none" marker-end="url(#an-prec)"/>
  <text x="60" y="220" text-anchor="middle" font-size="11" fill="currentColor" transform="rotate(-90 60 220)">más prioridad</text>
  <text x="720" y="380" font-size="11" fill="currentColor">la de más abajo es</text>
  <text x="720" y="396" font-size="11" fill="currentColor">la más fácil de pisar</text>
</svg>
