- { id: t1, frente: "Dónde va cada variable", dorso: "Lo que cambia entre servidores: group_vars/host_vars. Defaults de un rol: defaults/. Una corrida: -e. Secretos: Vault." }
- { id: t2, frente: "Precedencia (simplificada)", dorso: "defaults del rol < inventario (all < grupo < equipo) < facts < vars del play < vars del rol < tarea/set_fact/register < -e." }
- { id: t3, frente: "Facts más usados", dorso: "ansible_facts['os_family'], ['distribution'], ['default_ipv4']['address'], ['memtotal_mb'], ['hostname']." }
- { id: t4, frente: "Variables mágicas", dorso: "inventory_hostname, group_names, groups['web'], hostvars['db01']." }
- { id: t5, frente: "register y when", dorso: "register: r guarda el resultado (rc, stdout, changed...); when: r.rc == 0, sin llaves." }
- { id: t6, frente: "loop", dorso: "loop: \"{{ lista }}\", cada elemento en item; loop_control.label para mostrar menos; dict2items para diccionarios." }
- { id: t7, frente: "Jinja2", dorso: "{{ var }}, {% if %}{% endif %}, {% for x in lista %}{% endfor %}, filtros con | (default, join, upper), {{ ansible_managed }}." }
