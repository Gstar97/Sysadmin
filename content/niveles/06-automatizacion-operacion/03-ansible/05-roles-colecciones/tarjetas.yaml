- { id: t1, frente: "Estructura de un rol", dorso: "defaults, vars, tasks, handlers, templates, files, meta, README. ansible-galaxy role init lo crea." }
- { id: t2, frente: "defaults y vars de un rol", dorso: "defaults: lo configurable (prioridad más baja). vars: lo interno (prioridad alta)." }
- { id: t3, frente: "Usar un rol", dorso: "roles: [web] en el play (antes de tasks); import_role o include_role entre tareas." }
- { id: t4, frente: "Colección", dorso: "Paquete de módulos y roles: namespace.coleccion (ansible.posix, community.general)." }
- { id: t5, frente: "requirements.yml", dorso: "collections: con name y version. ansible-galaxy collection install -r requirements.yml." }
- { id: t6, frente: "Varios entornos", dorso: "inventarios/produccion e inventarios/pruebas con sus group_vars; los mismos roles y playbooks; -i elige." }
