<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Un repositorio de Ansible para varios entornos</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="400" height="80" rx="8" fill="var(--surface-2, #f1f3f6)"/>
    <rect x="20" y="132" width="400" height="244" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="440" y="40" width="400" height="336" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="11">
    <text x="34" y="62">infra-ansible/</text>
    <text x="50" y="80">ansible.cfg       requirements.yml</text>
    <text x="50" y="98">site.yml          (importa web.yml y db.yml)</text>
    <text x="50" y="114">web.yml   db.yml</text>
    <text x="34" y="154">inventarios/</text>
    <text x="50" y="174">produccion/</text>
    <text x="66" y="192">hosts.yml</text>
    <text x="66" y="210">group_vars/</text>
    <text x="82" y="228">all.yml    web.yml</text>
    <text x="82" y="246">db/   main.yml   vault.yml</text>
    <text x="50" y="274">pruebas/</text>
    <text x="66" y="292">hosts.yml</text>
    <text x="66" y="310">group_vars/   (los mismos nombres,</text>
    <text x="66" y="328">              otros valores)</text>
    <text x="34" y="360" font-family="system-ui, sans-serif">-i inventarios/pruebas  o  -i inventarios/produccion</text>
    <text x="454" y="62">roles/</text>
    <text x="470" y="82">base/      postgresql/</text>
    <text x="470" y="104">web/</text>
    <text x="486" y="124">defaults/main.yml</text>
    <text x="486" y="142">vars/main.yml</text>
    <text x="486" y="160">tasks/main.yml</text>
    <text x="486" y="178">handlers/main.yml</text>
    <text x="486" y="196">templates/sitio.conf.j2</text>
    <text x="486" y="214">files/logo.png</text>
    <text x="486" y="232">meta/main.yml</text>
    <text x="486" y="250">README.md</text>
    <text x="454" y="286">collections/          (opcional)</text>
    <text x="454" y="314" font-family="system-ui, sans-serif">las colecciones de requirements.yml se instalan</text>
    <text x="454" y="330" font-family="system-ui, sans-serif">con ansible-galaxy collection install -r</text>
    <text x="454" y="346" font-family="system-ui, sans-serif">y no se versionan (como un venv de Python)</text>
  </g>
</svg>
