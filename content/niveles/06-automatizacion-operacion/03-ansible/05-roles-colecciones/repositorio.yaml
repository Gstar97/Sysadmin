tipo: diagrama
titulo: Un repositorio de Ansible
puntos:
  - id: raiz
    titulo: La raíz
    area: { x: 2.3, y: 10.3, ancho: 46.5, alto: 20.5 }
    texto: >-
      ansible.cfg (configuración del proyecto), requirements.yml (colecciones y roles de afuera, con
      versiones) y los playbooks. site.yml suele importar a los demás (import_playbook) para poder
      configurar todo con un solo comando, o solo una parte con su playbook.
  - id: inventarios
    titulo: Un inventario por entorno
    area: { x: 2.3, y: 33.8, ancho: 46.5, alto: 62.6 }
    texto: >-
      Cada entorno tiene su inventario con sus group_vars: los mismos nombres de grupos y de
      variables, con otros valores (otro dominio, otra IP de la base, menos memoria en pruebas). Los
      playbooks y roles son los mismos para todos: lo que se prueba en pruebas es exactamente lo que
      después llega a producción, cambiando solo -i.
  - id: roles
    titulo: Los roles
    area: { x: 51.2, y: 10.3, ancho: 46.5, alto: 59 }
    texto: >-
      Cada rol hace una cosa (base, web, postgresql) y la hace completa: sus tareas, handlers,
      plantillas, archivos y valores por defecto. Un rol bien hecho no sabe nada de tu inventario:
      todo lo que cambia entra por variables, documentadas en su README.
  - id: colecciones
    titulo: Las colecciones
    area: { x: 51.2, y: 70.5, ancho: 46.5, alto: 25.9 }
    texto: >-
      Paquetes de módulos, roles y plugins con nombre namespace.coleccion (ansible.posix,
      community.general, community.postgresql). Se instalan con ansible-galaxy desde Ansible Galaxy
      (o Automation Hub, en la versión con soporte de Red Hat). Si están en collections/ dentro del
      proyecto, Ansible las encuentra solo.
