tipo: diagrama
titulo: Qué monitorear
puntos:
  - id: sintoma
    titulo: El síntoma
    area: { x: 2.3, y: 10.5, ancho: 29.1, alto: 31.6 }
    texto: >-
      Lo que importa es lo que nota quien usa el servicio: que no cargue, que tarde, que dé error.
      Las alertas que despiertan a alguien tienen que ser de síntomas, porque son las que siempre
      significan un problema real.
  - id: red
    titulo: Servicios con RED
    area: { x: 35.5, y: 10.5, ancho: 29.1, alto: 60.5 }
    texto: >-
      Para cada servicio: cuántos pedidos recibe (rate), cuántos fallan (errors) y cuánto tardan
      (duration, mejor en percentiles: el p95 es lo que tarda el 95 % de los pedidos). Sumando la
      saturación son las cuatro señales doradas de Google. Con un SLI y un SLO se define cuánto
      tiene que andar bien, y el presupuesto de error es cuánto puede fallar.
  - id: use
    titulo: Recursos con USE
    area: { x: 68.6, y: 10.5, ancho: 29.1, alto: 60.5 }
    texto: >-
      Para cada recurso: cuánto se usa (utilization), cuánto trabajo queda esperando (saturation:
      la carga, la cola del disco, el swap) y cuántos errores da. Son las causas: sirven para
      encontrar por qué pasa algo, y para alertar con tiempo cuando la tendencia termina en un
      síntoma (un disco que se va a llenar).
  - id: caja-negra
    titulo: Caja negra
    area: { x: 2.3, y: 46.3, ancho: 29.1, alto: 24.7 }
    texto: >-
      Además de mirar adentro de los servidores, conviene probar desde afuera, como un cliente: si
      la web responde, si el puerto está abierto, si el certificado está por vencer, si el DNS
      resuelve. Detecta problemas que adentro no se ven (un firewall, el DNS público).
  - id: tipos
    titulo: Métricas, logs y trazas
    area: { x: 2.3, y: 76.3, ancho: 95.3, alto: 20 }
    texto: >-
      Las métricas son números a lo largo del tiempo: livianas, ideales para alertas y tendencias.
      Los logs cuentan qué pasó con detalle (módulo 6.5). Las trazas siguen un pedido a través de
      varios servicios; aparecen cuando hay muchos microservicios y no son tema de este nivel.
