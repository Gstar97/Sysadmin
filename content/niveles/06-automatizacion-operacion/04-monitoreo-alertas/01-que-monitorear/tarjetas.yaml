- { id: t1, frente: "Síntoma vs. causa", dorso: "Síntoma: lo que nota el usuario (errores, lentitud). Causa: lo de adentro (CPU, disco). Alertar por síntomas." }
- { id: t2, frente: "RED", dorso: "Servicios: Rate (tasa), Errors (errores), Duration (duración, en percentiles)." }
- { id: t3, frente: "USE", dorso: "Recursos: Utilization (uso), Saturation (lo que espera), Errors." }
- { id: t4, frente: "Cuatro señales doradas", dorso: "Latencia, tráfico, errores y saturación." }
- { id: t5, frente: "SLI, SLO, presupuesto de error", dorso: "SLI: lo que se mide. SLO: el objetivo (99,5 % en 30 días). Presupuesto: lo que se puede fallar." }
- { id: t6, frente: "Caja negra", dorso: "Chequear desde afuera, como un cliente: web, puerto, certificado, DNS." }
- { id: t7, frente: "Cardinalidad", dorso: "Cantidad de series (combinaciones de etiquetas). Nada de usuarios ni IDs como etiqueta." }
