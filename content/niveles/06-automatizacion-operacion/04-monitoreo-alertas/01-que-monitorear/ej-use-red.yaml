tipo: emparejar
consigna: ¿Qué señal mide cada dato?
pares:
  - { a: "La CPU de db01 está al 92 % hace una hora", b: "Utilización (USE)" }
  - { a: "La carga de web01 es 14 con 4 CPU: hay procesos esperando", b: "Saturación (USE)" }
  - { a: "smartctl informa 38 sectores reasignados en sdb", b: "Errores de un recurso (USE)" }
  - { a: "La API recibe 240 pedidos por segundo", b: "Tasa (RED)" }
  - { a: "El 3 % de las respuestas de la API son 500", b: "Errores de un servicio (RED)" }
  - { a: "El 95 % de los pedidos tarda menos de 300 ms", b: "Duración (RED)" }
explicacion: >-
  USE es para los recursos de un equipo y RED para los servicios que usan las personas. Las
  alertas que despiertan a alguien conviene que sean de RED (síntomas); las de USE sirven para
  diagnosticar y para avisar con tiempo de algo que va a terminar en síntoma.
