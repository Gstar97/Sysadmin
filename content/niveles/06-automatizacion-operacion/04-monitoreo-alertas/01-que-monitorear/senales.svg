<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="an-sen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Qué mirar: síntomas del servicio y recursos de los servidores</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="250" height="120" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="305" y="40" width="250" height="230" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="590" y="40" width="250" height="230" rx="8" fill="var(--surface-2, #f1f3f6)"/>
    <rect x="20" y="176" width="250" height="94" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="20" y="290" width="820" height="76" rx="8" fill="var(--surface, #fff)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#an-sen)">
    <path d="M270 100 L303 100"/>
    <path d="M555 155 L588 155"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="62" font-weight="700">lo que ve la persona usuaria</text>
    <g font-size="11"><text x="34" y="84">"la tienda no carga", "tarda mucho",</text><text x="34" y="100">"me da error al pagar"</text><text x="34" y="124">el síntoma: lo que importa avisar</text><text x="34" y="140">a cualquier hora</text></g>
    <text x="319" y="62" font-weight="700">servicio: método RED</text>
    <g font-size="11">
      <text x="319" y="86">Rate (tasa): pedidos por segundo</text>
      <text x="319" y="106">Errors (errores): % de respuestas 5xx</text>
      <text x="319" y="126">Duration (duración): latencia p95, p99</text>
      <text x="319" y="156">+ saturación = las 4 señales doradas</text>
      <text x="319" y="180">SLI: lo que se mide (99,5 % de pedidos OK)</text>
      <text x="319" y="198">SLO: el objetivo (en 30 días)</text>
      <text x="319" y="216">presupuesto de error: lo que se puede</text>
      <text x="319" y="232">fallar sin incumplir el objetivo</text>
      <text x="319" y="256">la API, la web, la base, el DNS...</text>
    </g>
    <text x="604" y="62" font-weight="700">recursos: método USE</text>
    <g font-size="11">
      <text x="604" y="86">Utilization: % de CPU, disco, red en uso</text>
      <text x="604" y="106">Saturation: lo que espera (carga,</text>
      <text x="604" y="122">  swap, cola del disco)</text>
      <text x="604" y="142">Errors: errores de disco, de red, OOM</text>
      <text x="604" y="172">la causa: sirve para diagnosticar;</text>
      <text x="604" y="188">avisa solo si va a terminar en síntoma</text>
      <text x="604" y="212">CPU, memoria, disco, red, procesos,</text>
      <text x="604" y="228">servicios de systemd, certificados</text>
    </g>
    <text x="34" y="198" font-weight="700">desde afuera (caja negra)</text>
    <g font-size="11"><text x="34" y="220">¿responde la web? ¿el puerto 443?</text><text x="34" y="236">¿vence el certificado? ¿resuelve el DNS?</text><text x="34" y="256">lo mismo que vería un cliente</text></g>
    <text x="34" y="312" font-weight="700">tres tipos de datos</text>
    <g font-size="11">
      <text x="34" y="334">métricas: números en el tiempo, baratos de guardar, ideales para alertas y tendencias (Zabbix, Prometheus)</text>
      <text x="34" y="352">logs: qué pasó exactamente, con detalle (Loki, módulo 6.5) · trazas: el recorrido de un pedido entre servicios</text>
    </g>
  </g>
</svg>
