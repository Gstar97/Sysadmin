<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="an-zbx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Zabbix: un servidor central, agentes en cada equipo y todo guardado en una base</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="300" y="40" width="260" height="150" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="300" y="210" width="125" height="70" rx="8" fill="var(--surface-2, #f1f3f6)"/>
    <rect x="435" y="210" width="125" height="70" rx="8" fill="var(--surface-2, #f1f3f6)"/>
    <rect x="20" y="40" width="230" height="70" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="20" y="125" width="230" height="70" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="20" y="210" width="230" height="70" rx="8" fill="var(--surface, #fff)"/>
    <rect x="610" y="40" width="230" height="110" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="610" y="165" width="230" height="115" rx="8" fill="var(--surface, #fff)"/>
    <rect x="20" y="296" width="820" height="72" rx="8" fill="var(--surface, #fff)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#an-zbx)">
    <path d="M298 70 L252 70"/>
    <path d="M252 160 L298 160"/>
    <path d="M298 245 L252 245"/>
    <path d="M362 190 L362 208"/>
    <path d="M497 208 L497 190"/>
    <path d="M562 95 L608 95"/>
  </g>
  <g fill="currentColor">
    <text x="314" y="62" font-weight="700">zabbix_server (mon01)</text>
    <g font-size="11">
      <text x="314" y="84">pide datos a los agentes (pasivos)</text>
      <text x="314" y="100">recibe los que mandan (activos, 10051)</text>
      <text x="314" y="120">evalúa los triggers: ¿hay un problema?</text>
      <text x="314" y="136">ejecuta las acciones: avisa</text>
      <text x="314" y="160">hosts, plantillas, items, triggers,</text>
      <text x="314" y="176">macros y descubrimiento automático</text>
    </g>
    <text x="314" y="232" font-weight="700">base de datos</text>
    <g font-size="11"><text x="314" y="252">PostgreSQL/MySQL:</text><text x="314" y="268">config e historia</text></g>
    <text x="449" y="232" font-weight="700">interfaz web</text>
    <g font-size="11"><text x="449" y="252">PHP con nginx:</text><text x="449" y="268">configurar y ver</text></g>
    <text x="34" y="62" font-weight="700">chequeo pasivo</text>
    <g font-size="11"><text x="34" y="82">el servidor le pregunta al agente</text><text x="34" y="98">en el 10050 (Server=)</text></g>
    <text x="34" y="147" font-weight="700">chequeo activo</text>
    <g font-size="11"><text x="34" y="167">el agente manda solo al 10051</text><text x="34" y="183">(ServerActive=, Hostname=)</text></g>
    <text x="34" y="232" font-weight="700">sin agente</text>
    <g font-size="11"><text x="34" y="252">SNMP (switches, UPS), ping,</text><text x="34" y="268">HTTP, puertos, certificados</text></g>
    <text x="624" y="62" font-weight="700">acciones y medios</text>
    <g font-size="11"><text x="624" y="84">un trigger pasa a PROBLEM:</text><text x="624" y="100">correo, Telegram, Slack, Teams,</text><text x="624" y="116">un script; y avisa cuando vuelve</text><text x="624" y="132">a OK</text></g>
    <text x="624" y="187" font-weight="700">proxy (opcional)</text>
    <g font-size="11"><text x="624" y="207">para otra sede o red: junta los</text><text x="624" y="223">datos de esos equipos y se los</text><text x="624" y="239">pasa al servidor (y aguanta si se</text><text x="624" y="255">corta el enlace)</text></g>
    <text x="34" y="318" font-weight="700">ejemplo de trigger</text>
    <g font-family="ui-monospace, monospace" font-size="11">
      <text x="34" y="340">last(/web01/vfs.fs.size[/,pused])&gt;90</text>
      <text x="34" y="358">timeleft(/web01/vfs.fs.size[/,pused],1h,100)&lt;1d</text>
    </g>
    <g font-size="11">
      <text x="420" y="340">el último valor del % usado de / supera 90</text>
      <text x="420" y="358">al ritmo de la última hora, se llena en menos de un día</text>
    </g>
  </g>
</svg>
