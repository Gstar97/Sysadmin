tipo: emparejar
consigna: ¿Qué es cada cosa en Zabbix?
pares:
  - { a: "web01, con su IP y los grupos a los que pertenece", b: "Host" }
  - { a: "vfs.fs.size[/,pfree], medido cada minuto", b: "Item" }
  - { a: "last(/web01/vfs.fs.size[/,pfree])<10", b: "Trigger" }
  - { a: "Mandar un correo a la guardia cuando un trigger de severidad alta pasa a PROBLEM", b: "Acción" }
  - { a: "\"Linux by Zabbix agent\", con cientos de items y triggers listos", b: "Plantilla" }
  - { a: "{$VFS.FS.PFREE.MIN.WARN}, que se cambia por host sin tocar la plantilla", b: "Macro" }
  - { a: "Encontrar solos todos los discos y placas de red y crear un item por cada uno", b: "Descubrimiento (LLD)" }
explicacion: >-
  Casi nunca se crean items y triggers a mano: se le asigna una plantilla al host y se ajustan los
  umbrales con macros. El descubrimiento de bajo nivel (LLD) crea los items de cada disco o interfaz
  que encuentra, incluidos los que se agreguen después.
