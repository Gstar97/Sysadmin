- { id: t1, frente: "Partes de Zabbix", dorso: "Servidor, base de datos, interfaz web, agente 2 en cada equipo y proxies opcionales." }
- { id: t2, frente: "Pasivo y activo", dorso: "Pasivo: el servidor pregunta al 10050 (Server=). Activo: el agente manda al 10051 (ServerActive=, Hostname=)." }
- { id: t3, frente: "Host, item, trigger", dorso: "Host: el equipo. Item: un dato (una clave). Trigger: expresión que detecta un problema." }
- { id: t4, frente: "Plantillas y macros", dorso: "Linux/Windows by Zabbix agent traen todo; los umbrales se cambian con macros en el host." }
- { id: t5, frente: "Funciones de triggers", dorso: "last(), min()/avg() en un período, nodata() y timeleft() para tendencias." }
- { id: t6, frente: "zabbix_get", dorso: "zabbix_get -s equipo -k clave: prueba un agente sin pasar por la web." }
