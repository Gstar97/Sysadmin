- { id: t1, frente: "Modelo de Prometheus", dorso: "Pull: va a buscar /metrics de cada objetivo cada scrape_interval. up = 0 si no pudo." }
- { id: t2, frente: "Exporters", dorso: "node_exporter :9100 (Linux), windows_exporter, blackbox_exporter (desde afuera), y /metrics de cada app." }
- { id: t3, frente: "Tipos de métricas", dorso: "counter (_total, con rate), gauge (tal cual), histogram (cubetas le, histogram_quantile)." }
- { id: t4, frente: "promtool", dorso: "promtool check config /etc/prometheus/prometheus.yml (y check rules)." }
- { id: t5, frente: "PromQL básico", dorso: "Selector {etiqueta=\"x\"}, rango [5m], rate(), sum by (), operaciones entre series." }
- { id: t6, frente: "Tendencia en PromQL", dorso: "predict_linear(node_filesystem_avail_bytes[1h], 4*3600) < 0" }
