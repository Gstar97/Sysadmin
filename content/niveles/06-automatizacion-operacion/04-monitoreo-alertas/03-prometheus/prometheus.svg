<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="an-prom" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Prometheus: va a buscar las métricas, las guarda y las consulta con PromQL</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="230" height="64" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="20" y="114" width="230" height="64" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="20" y="188" width="230" height="64" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="310" y="40" width="250" height="212" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="620" y="40" width="220" height="64" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="620" y="114" width="220" height="64" rx="8" fill="var(--surface-2, #f1f3f6)"/>
    <rect x="620" y="188" width="220" height="64" rx="8" fill="var(--surface-2, #f1f3f6)"/>
    <rect x="20" y="268" width="820" height="100" rx="8" fill="var(--surface, #fff)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#an-prom)">
    <path d="M308 72 L252 72"/>
    <path d="M308 146 L252 146"/>
    <path d="M308 220 L252 220"/>
    <path d="M562 72 L618 72"/>
    <path d="M618 146 L562 146"/>
    <path d="M618 220 L562 220"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="62" font-weight="700">node_exporter :9100</text>
    <g font-size="11"><text x="34" y="82">CPU, memoria, discos, red de</text><text x="34" y="96">cada servidor Linux</text></g>
    <text x="34" y="136" font-weight="700">la propia aplicación /metrics</text>
    <g font-size="11"><text x="34" y="156">pedidos, errores, latencia</text><text x="34" y="170">(la tienda, Grafana, Loki...)</text></g>
    <text x="34" y="210" font-weight="700">otros exporters</text>
    <g font-size="11"><text x="34" y="230">blackbox (desde afuera), windows,</text><text x="34" y="244">postgres, mysqld, snmp...</text></g>
    <text x="324" y="62" font-weight="700">prometheus (mon01 :9090)</text>
    <g font-size="11">
      <text x="324" y="84">cada 15 s pide /metrics a cada objetivo</text>
      <text x="324" y="100">(pull) según prometheus.yml</text>
      <text x="324" y="124">guarda las series en su base (TSDB),</text>
      <text x="324" y="140">15 días por defecto</text>
      <text x="324" y="164">evalúa las reglas: de grabación y</text>
      <text x="324" y="180">de alerta</text>
      <text x="324" y="204">up = 1 si pudo leer el objetivo, 0 si no</text>
      <text x="324" y="228">promtool revisa config y reglas</text>
    </g>
    <text x="634" y="62" font-weight="700">Alertmanager :9093</text>
    <g font-size="11"><text x="634" y="82">agrupa, silencia y avisa</text><text x="634" y="96">(correo, chat): lección 6.4.5</text></g>
    <text x="634" y="136" font-weight="700">Grafana :3000</text>
    <g font-size="11"><text x="634" y="156">tableros con consultas PromQL</text><text x="634" y="170">(lección 6.4.4)</text></g>
    <text x="634" y="210" font-weight="700">curl, scripts, promtool</text>
    <g font-size="11"><text x="634" y="230">la API HTTP: /api/v1/query,</text><text x="634" y="244">/api/v1/targets</text></g>
    <text x="34" y="290" font-weight="700">una serie = nombre + etiquetas</text>
    <g font-family="ui-monospace, monospace" font-size="11">
      <text x="34" y="312">http_requests_total{code="500", handler="/api/pagar", instance="api01:8080", job="api"}  14523</text>
      <text x="34" y="334">node_filesystem_avail_bytes{instance="web01:9100", job="node", mountpoint="/"}  1.2e10</text>
    </g>
    <g font-size="11"><text x="34" y="356">counter: solo sube (_total), se mira con rate() · gauge: sube y baja (memoria, temperatura) · histogram: cubetas para percentiles</text></g>
  </g>
</svg>
