<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="an-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Grafana: consultas a varios orígenes, paneles y tableros que viven en Git</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="180" height="210" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="250" y="40" width="360" height="210" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="270" y="96" width="155" height="66" rx="6" fill="var(--surface, #fff)"/>
    <rect x="435" y="96" width="155" height="66" rx="6" fill="var(--surface, #fff)"/>
    <rect x="270" y="170" width="155" height="66" rx="6" fill="var(--surface, #fff)"/>
    <rect x="435" y="170" width="155" height="66" rx="6" fill="var(--surface, #fff)"/>
    <rect x="660" y="40" width="180" height="210" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="20" y="268" width="820" height="100" rx="8" fill="var(--surface-2, #f1f3f6)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#an-gr)">
    <path d="M202 140 L248 140"/>
    <path d="M658 140 L612 140"/>
    <path d="M430 266 L430 252"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="62" font-weight="700">orígenes de datos</text>
    <g font-size="11">
      <text x="34" y="86">Prometheus (PromQL)</text>
      <text x="34" y="106">Loki (LogQL, módulo 6.5)</text>
      <text x="34" y="126">Zabbix (con su plugin)</text>
      <text x="34" y="146">PostgreSQL, MySQL (SQL)</text>
      <text x="34" y="166">Elasticsearch, la nube...</text>
      <text x="34" y="196">Grafana no guarda datos:</text>
      <text x="34" y="212">pregunta cada vez que se</text>
      <text x="34" y="228">abre o refresca un panel</text>
    </g>
    <text x="264" y="62" font-weight="700">tablero "Servidores"</text>
    <g font-size="11"><text x="264" y="82">variable: instance = web01, web02 ▾   rango: últimas 6 h ▾</text></g>
    <g font-size="11">
      <text x="280" y="116" font-weight="700">CPU en uso</text><text x="280" y="134">serie de tiempo, %</text><text x="280" y="150">una línea por {{instance}}</text>
      <text x="445" y="116" font-weight="700">Disco usado</text><text x="445" y="134">indicador, umbrales</text><text x="445" y="150">verde · amarillo 80 · rojo 90</text>
      <text x="280" y="190" font-weight="700">Más memoria</text><text x="280" y="208">tabla con topk</text><text x="280" y="224">ordenada</text>
      <text x="445" y="190" font-weight="700">Errores de login</text><text x="445" y="208">logs desde Loki,</text><text x="445" y="224">al lado de las métricas</text>
    </g>
    <text x="674" y="62" font-weight="700">quién lo usa</text>
    <g font-size="11">
      <text x="674" y="86">Viewer: solo mira</text>
      <text x="674" y="106">Editor: arma tableros</text>
      <text x="674" y="126">Admin: usuarios y orígenes</text>
      <text x="674" y="156">login local, LDAP o</text>
      <text x="674" y="172">Active Directory</text>
      <text x="674" y="202">pantalla de guardia en</text>
      <text x="674" y="218">modo kiosco</text>
    </g>
    <text x="34" y="290" font-weight="700">tableros como código (provisioning)</text>
    <g font-size="11">
      <text x="34" y="312">/etc/grafana/provisioning/datasources/*.yaml: los orígenes de datos, con sus URL</text>
      <text x="34" y="330">/etc/grafana/provisioning/dashboards/*.yaml: de qué carpeta leer los tableros, en JSON</text>
      <text x="34" y="350">todo en el repositorio de Git y repartido con Ansible: si se pierde el servidor, se reconstruye igual</text>
    </g>
  </g>
</svg>
