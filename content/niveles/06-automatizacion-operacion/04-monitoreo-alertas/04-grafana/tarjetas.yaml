- { id: t1, frente: "Qué guarda Grafana", dorso: "Usuarios, tableros y configuración (SQLite en /var/lib/grafana). Las métricas no: pregunta al origen de datos cada vez." }
- { id: t2, frente: "Panel y tablero", dorso: "Panel: consulta + visualización (unidad, umbrales, leyenda). Tablero: paneles, rango de tiempo y variables." }
- { id: t3, frente: "Provisioning", dorso: "/etc/grafana/provisioning/datasources/*.yaml y dashboards/*.yaml (con los JSON): todo en Git." }
- { id: t4, frente: "Variables en un tablero", dorso: "label_values(up{job=\"node\"}, instance) arma el menú; la consulta filtra con instance=~\"$instance\"." }
- { id: t5, frente: "Seguridad de Grafana", dorso: "Puerto 3000; grafana cli admin reset-admin-password; roles Viewer, Editor, Admin; nginx con HTTPS; login con el AD." }
- { id: t6, frente: "Tablero de la comunidad para Linux", dorso: "Node Exporter Full, ID 1860: Dashboards, New, Import." }
