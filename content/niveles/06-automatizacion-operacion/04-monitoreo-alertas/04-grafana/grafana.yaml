tipo: diagrama
titulo: Grafana
puntos:
  - id: origenes
    titulo: Orígenes de datos
    area: { x: 2.3, y: 10.5, ancho: 20.9, alto: 55.3 }
    texto: >-
      Grafana no guarda métricas: le pregunta a cada origen de datos en su propio lenguaje (PromQL a
      Prometheus, LogQL a Loki, SQL a una base) cada vez que se abre o se refresca un panel. Por eso
      un mismo tablero puede mezclar métricas, logs y datos de negocio.
  - id: tablero
    titulo: Tableros y paneles
    area: { x: 29.1, y: 10.5, ancho: 41.9, alto: 55.3 }
    texto: >-
      Un tablero tiene paneles; cada panel es una consulta más una forma de mostrarla (serie de
      tiempo, indicador, tabla, logs) con su unidad, sus umbrales y su leyenda. Las variables de
      arriba (el servidor, el entorno) cambian todas las consultas a la vez, y el rango de tiempo se
      elige para todo el tablero.
  - id: usuarios
    titulo: Usuarios y roles
    area: { x: 76.7, y: 10.5, ancho: 20.9, alto: 55.3 }
    texto: >-
      Viewer solo mira, Editor arma y cambia tableros, Admin maneja usuarios y orígenes de datos. El
      login puede ser local, por LDAP o con el Active Directory. Para una pantalla en la oficina de
      guardia, el modo kiosco oculta los menús.
  - id: provisioning
    titulo: Tableros como código
    area: { x: 2.3, y: 70.5, ancho: 95.3, alto: 26.3 }
    texto: >-
      Los orígenes de datos y los tableros se pueden definir en archivos (YAML y JSON) que Grafana
      carga al arrancar. Así quedan en el repositorio de Git, revisados por pull request como el
      resto de la infraestructura, y un servidor nuevo queda igual que el anterior.
