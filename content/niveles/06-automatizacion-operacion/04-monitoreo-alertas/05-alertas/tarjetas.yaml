- { id: t1, frente: "Partes de una regla de alerta", dorso: "alert, expr (lo que está mal), for (cuánto tiempo), labels (severity) y annotations (summary, runbook_url)." }
- { id: t2, frente: "Estados de una alerta", dorso: "inactive → pending (se cumple, sin el for) → firing (se manda a Alertmanager)." }
- { id: t3, frente: "Alertmanager en cuatro verbos", dorso: "Agrupa (group_by), enruta (routes con matchers), inhibe (inhibit_rules) y silencia (amtool silence add)." }
- { id: t4, frente: "Tiempos de Alertmanager", dorso: "group_wait 30s (espera compañeras), group_interval 5m (novedades), repeat_interval 4h (recordatorio)." }
- { id: t5, frente: "Revisar configuraciones", dorso: "promtool check rules / check config; amtool check-config; amtool config routes test severity=critical." }
- { id: t6, frente: "Alerta que sirve", dorso: "Accionable, de síntomas (errores, lentitud), con tendencia (predict_linear), con runbook y dueño, revisada seguido." }
