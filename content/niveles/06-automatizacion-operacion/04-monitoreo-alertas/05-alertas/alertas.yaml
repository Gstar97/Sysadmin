tipo: diagrama
titulo: De la regla al aviso
puntos:
  - id: reglas
    titulo: Reglas en Prometheus
    area: { x: 2.3, y: 10, ancho: 27.9, alto: 55 }
    texto: >-
      Una regla de alerta es una expresión PromQL que devuelve las series que están mal. Si la
      condición se cumple, la alerta pasa a pending; si se sigue cumpliendo durante el for, pasa a
      firing y Prometheus se la manda a Alertmanager. Las etiquetas (severity) sirven para enrutar;
      las anotaciones (summary, runbook_url) son el texto del aviso.
  - id: alertmanager
    titulo: Alertmanager
    area: { x: 34.9, y: 10, ancho: 38.4, alto: 55 }
    texto: >-
      Recibe las alertas de uno o varios Prometheus y decide qué hacer con ellas: las agrupa para
      mandar un solo mensaje, las enruta según sus etiquetas, inhibe las que son consecuencia de
      otra (el servicio de un servidor caído), respeta los silencios y repite el aviso mientras el
      problema siga.
  - id: receptores
    titulo: Receptores
    area: { x: 77.4, y: 10, ancho: 20.2, alto: 55 }
    texto: >-
      A dónde llega el aviso: correo, un canal de chat, un sistema de guardias como PagerDuty o
      cualquier cosa que reciba un webhook. Lo urgente va a un lugar que alguien mira (o que suena);
      lo que puede esperar, a un correo o un ticket.
  - id: buenas
    titulo: Una alerta que sirve
    area: { x: 2.3, y: 69.5, ancho: 95.3, alto: 27.5 }
    texto: >-
      Cada aviso tiene que pedir una acción. Las alertas que suenan siempre y nadie atiende enseñan a
      ignorar las alertas, y un día se ignora la importante: eso es la fatiga de alertas.
