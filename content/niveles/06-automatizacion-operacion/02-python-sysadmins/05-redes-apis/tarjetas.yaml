- { id: t1, frente: "Pedido seguro con requests", dorso: "requests.get(url, params=..., headers=..., timeout=5) y r.raise_for_status() antes de r.json()." }
- { id: t2, frente: "Token de una API", dorso: "En una variable de entorno o un archivo 600, en el encabezado Authorization. Nunca en el código." }
- { id: t3, frente: "Certificado de una CA interna", dorso: "verify=\"/ruta/ca.pem\". Nunca verify=False." }
- { id: t4, frente: "Qué se reintenta", dorso: "Timeout, ConnectionError, 429, 502, 503, 504, con esperas crecientes. No 400, 401, 403 ni 404." }
- { id: t5, frente: "Paginación", dorso: "Pedir páginas mientras la respuesta diga que hay una siguiente." }
- { id: t6, frente: "Muchos servidores a la vez", dorso: "ThreadPoolExecutor(max_workers=10) y ex.map(revisar, urls)." }
- { id: t7, frente: "SSH desde Python", dorso: "subprocess con ssh -o BatchMode=yes -o ConnectTimeout=5, o paramiko. Para dejar servidores iguales, Ansible." }
