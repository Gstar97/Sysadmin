- { id: t1, frente: "Función", dorso: "def nombre(a, b=valor): ... return resultado. Sin return devuelve None." }
- { id: t2, frente: "Valor por defecto mutable", dorso: "Nunca lista=[] ni dict={} por defecto: se comparten entre llamadas. Usá None." }
- { id: t3, frente: "if __name__ == \"__main__\":", dorso: "El código principal corre al ejecutar el archivo, no al importarlo." }
- { id: t4, frente: "Leer un traceback", dorso: "De abajo hacia arriba: la última línea es el tipo de error y el mensaje; arriba, dónde pasó." }
- { id: t5, frente: "try / except / else / finally", dorso: "Lo que puede fallar; qué hacer con cada error con nombre; si no falló; siempre." }
- { id: t6, frente: "except: a secas", dorso: "Esconde todo, incluso errores de programación. Atrapá solo lo que sabés manejar." }
- { id: t7, frente: "sys.exit", dorso: "sys.exit(0) bien, sys.exit(1) problema, sys.exit(\"mensaje\") avisa por stderr y sale con 1." }
