tipo: diagrama
titulo: Cómo leer un traceback
puntos:
  - id: final
    titulo: La última línea
    area: { x: 3.5, y: 81.2, ancho: 62.8, alto: 10 }
    texto: >-
      Es lo primero que hay que leer: el tipo de error (ValueError) y el mensaje (no se puede
      convertir 'x' en un número entero). Muchas veces alcanza con eso para entender qué pasó. Los
      tipos más comunes: NameError (un nombre que no existe), TypeError (una operación con el tipo
      equivocado), KeyError e IndexError (una clave o posición que no está), FileNotFoundError y
      PermissionError.
  - id: camino
    titulo: El camino de llamadas
    area: { x: 3.5, y: 22.4, ancho: 62.8, alto: 39.4 }
    texto: >-
      Cada bloque File es una llamada a función, de la más externa (arriba) a la que falló
      (abajo): el programa llamó a main en la línea 22, y main falló en la línea 15. La línea que
      importa casi siempre es la última que es de tu código; si más abajo aparecen archivos de
      /usr/lib/python3, son bibliotecas que llamaste con algo que no esperaban.
  - id: marcas
    titulo: Las marcas
    area: { x: 3.5, y: 52.4, ancho: 62.8, alto: 7 }
    texto: >-
      Desde Python 3.11, las marcas ^ y ~ señalan la parte exacta de la línea que falló: acá, el
      int(usado), no el int(total). En versiones anteriores solo se ve la línea.
  - id: encabezado
    titulo: El encabezado
    area: { x: 70.9, y: 11.8, ancho: 26.7, alto: 21.8 }
    texto: >-
      Traceback (most recent call last) quiere decir que la llamada más reciente está al final.
      Por eso un traceback se lee de abajo hacia arriba.
