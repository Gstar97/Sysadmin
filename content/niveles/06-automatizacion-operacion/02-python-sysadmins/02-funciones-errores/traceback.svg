<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Cómo leer un traceback: de abajo hacia arriba</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="560" height="284" rx="8" fill="var(--term-bg, #0d1117)"/>
    <rect x="30" y="76" width="540" height="58" rx="5" fill="none" stroke-dasharray="4 3"/>
    <rect x="30" y="144" width="540" height="66" rx="5" fill="none" stroke-dasharray="4 3"/>
    <rect x="30" y="276" width="540" height="34" rx="5" fill="var(--bad-soft, #fde2e1)" fill-opacity="0.25"/>
    <rect x="610" y="40" width="230" height="74" rx="8" fill="var(--surface-2, #f1f3f6)"/>
    <rect x="610" y="126" width="230" height="110" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="610" y="248" width="230" height="76" rx="8" fill="var(--bad-soft, #fde2e1)"/>
  </g>
  <g fill="var(--term-fg, #e6edf3)" font-family="ui-monospace, monospace" font-size="11">
    <text x="40" y="64">Traceback (most recent call last):</text>
    <text x="53" y="94">File "/opt/infra/discos.py", line 22, in &lt;module&gt;</text>
    <text x="66" y="112">main()</text>
    <text x="66" y="126">~~~~^^</text>
    <text x="53" y="162">File "/opt/infra/discos.py", line 15, in main</text>
    <text x="66" y="180">pct = porcentaje(int(usado), int(total))</text>
    <text x="179" y="198">^^^^^^^^^^</text>
    <text x="40" y="298">ValueError: invalid literal for int() with base 10: 'x'</text>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="725" y="64" font-weight="700">1. El encabezado</text>
    <g font-size="11"><text x="725" y="84">“la llamada más reciente,</text><text x="725" y="100">al final”</text></g>
    <text x="725" y="150" font-weight="700">2. El camino</text>
    <g font-size="11"><text x="725" y="170">de afuera hacia adentro:</text><text x="725" y="186">archivo, línea y función</text><text x="725" y="202">de cada llamada; las marcas ^</text><text x="725" y="218">señalan la parte exacta</text></g>
    <text x="725" y="272" font-weight="700">3. Qué pasó</text>
    <g font-size="11"><text x="725" y="292">el tipo de error y el mensaje:</text><text x="725" y="308">empezá a leer por acá</text></g>
  </g>
</svg>
