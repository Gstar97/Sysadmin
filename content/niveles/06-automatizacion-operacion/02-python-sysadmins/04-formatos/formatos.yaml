tipo: diagrama
titulo: Cuatro formatos de datos
puntos:
  - id: json
    titulo: JSON
    area: { x: 2.3, y: 11.1, ancho: 46.5, alto: 41.7 }
    texto: >-
      El idioma de las APIs. Tiene objetos (que en Python son diccionarios), listas, texto,
      números, true, false y null (que en Python son True, False y None). Es estricto: comillas
      dobles siempre, sin comas al final y sin comentarios. json.load lee un archivo, json.loads un
      texto, y json.dump y json.dumps escriben.
  - id: yaml
    titulo: YAML
    area: { x: 51.2, y: 11.1, ancho: 46.5, alto: 41.7 }
    texto: >-
      Lo mismo que JSON, pero pensado para que lo escriban personas: la sangría reemplaza a las
      llaves y se permiten comentarios. Lo usan Ansible, Docker Compose, Kubernetes y muchas
      configuraciones. Necesita la biblioteca PyYAML, y siempre con yaml.safe_load: yaml.load con
      un archivo de origen dudoso puede ejecutar código.
  - id: csv
    titulo: CSV
    area: { x: 2.3, y: 57.2, ancho: 46.5, alto: 38.9 }
    texto: >-
      Una tabla en texto: una fila por línea y columnas separadas por coma (o punto y coma, en las
      planillas configuradas en castellano). Es lo que exporta una planilla o un sistema de
      inventario. csv.DictReader devuelve cada fila como un diccionario con los nombres de la
      primera línea; todos los valores llegan como texto.
  - id: ini
    titulo: INI
    area: { x: 51.2, y: 57.2, ancho: 46.5, alto: 38.9 }
    texto: >-
      El formato de muchas configuraciones (php.ini, smb.conf, las unidades de systemd se le
      parecen): secciones entre corchetes y clave = valor. configparser lo lee y escribe; los
      valores son texto, y getint, getfloat y getboolean los convierten (getboolean entiende yes,
      on, true y 1).
