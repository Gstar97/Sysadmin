<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Los mismos dos servidores en cuatro formatos</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="400" height="150" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="440" y="40" width="400" height="150" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="20" y="206" width="400" height="140" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="440" y="206" width="400" height="140" rx="8" fill="var(--surface-2, #f1f3f6)"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="60" font-weight="700">JSON</text><text x="406" y="60" text-anchor="end" font-size="10.5">APIs · json.load / json.dump</text>
    <g font-family="ui-monospace, monospace" font-size="10.5">
      <text x="34" y="82">[</text>
      <text x="46" y="98">{"nombre": "web01", "ip": "10.0.10.11",</text>
      <text x="58" y="114">"puertos": [80, 443], "activo": true},</text>
      <text x="46" y="130">{"nombre": "db01", "ip": "10.0.20.21",</text>
      <text x="58" y="146">"puertos": [5432], "activo": false}</text>
      <text x="34" y="162">]</text>
    </g>
    <text x="454" y="60" font-weight="700">YAML</text><text x="826" y="60" text-anchor="end" font-size="10.5">Ansible, Compose · yaml.safe_load</text>
    <g font-family="ui-monospace, monospace" font-size="10.5">
      <text x="454" y="82">- nombre: web01</text>
      <text x="466" y="98">ip: 10.0.10.11</text>
      <text x="466" y="114">puertos: [80, 443]</text>
      <text x="466" y="130">activo: true</text>
      <text x="454" y="146">- nombre: db01</text>
      <text x="466" y="162">ip: 10.0.20.21   # y así sigue</text>
    </g>
    <text x="34" y="226" font-weight="700">CSV</text><text x="406" y="226" text-anchor="end" font-size="10.5">planillas · csv.DictReader</text>
    <g font-family="ui-monospace, monospace" font-size="10.5">
      <text x="34" y="250">nombre,ip,puertos,activo</text>
      <text x="34" y="266">web01,10.0.10.11,"80 443",si</text>
      <text x="34" y="282">db01,10.0.20.21,5432,no</text>
    </g>
    <g font-size="10.5"><text x="34" y="310">Una tabla: todo es texto y no hay listas ni anidamiento.</text><text x="34" y="326">Las comillas protegen las comas dentro de un campo.</text></g>
    <text x="454" y="226" font-weight="700">INI</text><text x="826" y="226" text-anchor="end" font-size="10.5">configuraciones · configparser</text>
    <g font-family="ui-monospace, monospace" font-size="10.5">
      <text x="454" y="250">[web01]</text>
      <text x="454" y="266">ip = 10.0.10.11</text>
      <text x="454" y="282">puertos = 80, 443</text>
      <text x="454" y="298">[db01]</text>
      <text x="454" y="314">ip = 10.0.20.21</text>
    </g>
    <g font-size="10.5"><text x="660" y="266">Secciones con clave = valor.</text><text x="660" y="282">Todo es texto: getint,</text><text x="660" y="298">getboolean convierten.</text></g>
  </g>
</svg>
