- { id: t1, frente: "JSON en Python", dorso: "json.load(f) y json.loads(texto) leen; json.dump(datos, f, indent=2) y json.dumps(datos) escriben." }
- { id: t2, frente: "CSV", dorso: "csv.DictReader(f) con open(..., newline=\"\"). Todo llega como texto; delimiter=\";\" en planillas en castellano." }
- { id: t3, frente: "YAML", dorso: "PyYAML, siempre yaml.safe_load. Valores dudosos (no, 010, 22:22) entre comillas." }
- { id: t4, frente: "INI y TOML", dorso: "configparser con getint, getboolean y fallback; tomllib.load(open(ruta, \"rb\")) desde 3.11." }
- { id: t5, frente: "Fechas en JSON", dorso: "No existen: se guardan como texto ISO con isoformat()." }
- { id: t6, frente: "re", dorso: "search (primera), findall (todas), sub (reemplazar), compile (reusar). Siempre r\"...\" y grupos (?P<nombre>...)." }
