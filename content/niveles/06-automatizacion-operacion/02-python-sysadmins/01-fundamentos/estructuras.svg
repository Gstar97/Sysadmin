<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="py-est" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Un inventario en Python: una lista de diccionarios</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="44" width="500" height="200" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="40" y="84" width="460" height="40" rx="6" fill="var(--surface, #fff)"/>
    <rect x="40" y="134" width="460" height="40" rx="6" fill="var(--surface, #fff)"/>
    <rect x="40" y="184" width="460" height="40" rx="6" fill="var(--surface, #fff)"/>
    <rect x="580" y="44" width="260" height="96" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="580" y="160" width="260" height="84" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="20" y="268" width="820" height="76" rx="8" fill="var(--surface-2, #f1f3f6)"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="10.5">
    <text x="36" y="70">servidores = [</text>
    <text x="52" y="109">{"nombre": "web01", "rol": "web", "disco": 72, "activo": True},</text>
    <text x="52" y="159">{"nombre": "db01", "rol": "base", "disco": 91, "activo": True},</text>
    <text x="52" y="209">{"nombre": "bkp01", "rol": "backup", "disco": 40, "activo": False},</text>
    <text x="36" y="238">]</text>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="710" y="66" font-weight="700">acceder</text>
    <g font-family="ui-monospace, monospace" font-size="11">
      <text x="710" y="88">servidores[1]["disco"]  → 91</text>
      <text x="710" y="108">servidores[0]["nombre"] → "web01"</text>
      <text x="710" y="128">len(servidores)        → 3</text>
    </g>
    <text x="710" y="182" font-weight="700">tipos de los valores</text>
    <g font-family="ui-monospace, monospace" font-size="11">
      <text x="710" y="204">"web01" str · 72 int</text>
      <text x="710" y="222">91.5 float · True bool</text>
      <text x="710" y="240">None: “no hay valor”</text>
    </g>
  </g>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="11.5">
    <text x="36" y="292">for s in servidores:</text>
    <text x="52" y="310">if s["activo"] and s["disco"] &gt; 80:</text>
    <text x="68" y="328">print(f"{s['nombre']}: disco al {s['disco']}%")       # db01: disco al 91%</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <path d="M520 150 L578 100" marker-end="url(#py-est)"/>
  </g>
</svg>
