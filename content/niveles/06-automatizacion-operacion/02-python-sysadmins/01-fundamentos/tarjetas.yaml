- { id: t1, frente: "¿Bash o Python?", dorso: "Bash para encadenar comandos; Python para datos con estructura, JSON, APIs y programas que crecen." }
- { id: t2, frente: "Tipos básicos", dorso: "str, int, float, bool (True/False) y None. Lo que llega de afuera es texto: int() y float() convierten." }
- { id: t3, frente: "Lista", dorso: "[a, b, c]: en orden, desde la posición 0. append agrega, len cuenta, in pregunta si está." }
- { id: t4, frente: "Diccionario", dorso: "{clave: valor}. d[\"clave\"] lee (KeyError si falta); d.get(\"clave\", defecto) es seguro; items() recorre pares." }
- { id: t5, frente: "f-string", dorso: "f\"{nombre}: {disco}%\" reemplaza lo que va entre llaves. {x:.1f}: un decimal." }
- { id: t6, frente: "Bloques", dorso: "Dos puntos al final de if/for/while/def y sangría de cuatro espacios adentro." }
- { id: t7, frente: "Primera línea de un script", dorso: "#!/usr/bin/env python3, y chmod +x para correrlo como ./script.py." }
