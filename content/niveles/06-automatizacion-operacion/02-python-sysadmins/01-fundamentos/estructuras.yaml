tipo: diagrama
titulo: Un inventario en Python
puntos:
  - id: lista
    titulo: La lista
    area: { x: 2.3, y: 12.2, ancho: 58.2, alto: 55.6 }
    texto: >-
      Entre corchetes y separados por comas: una secuencia ordenada de valores. Se recorre con
      for, se agrega con append, se cuenta con len y se accede por posición empezando de 0
      (servidores[0] es el primero y servidores[-1], el último).
  - id: dicc
    titulo: El diccionario
    area: { x: 4.6, y: 23.3, ancho: 53.5, alto: 11.1 }
    texto: >-
      Entre llaves: pares clave: valor. Es la forma natural de describir una cosa con varios datos
      (un servidor con su nombre, su rol y su disco). Se lee con s["disco"]; si la clave puede no
      estar, s.get("disco") devuelve None en vez de un error, y s.get("disco", 0), un valor por
      defecto. Un JSON se convierte justo en esto: listas y diccionarios.
  - id: acceso
    titulo: Acceder a los datos
    area: { x: 67.4, y: 12.2, ancho: 30.2, alto: 26.7 }
    texto: >-
      Se encadenan los accesos: servidores[1] es el segundo diccionario y ["disco"], su valor.
      Pedir una posición que no existe da IndexError y una clave que no existe, KeyError: son los
      dos errores más comunes de la primera semana.
  - id: tipos
    titulo: Los tipos
    area: { x: 67.4, y: 44.4, ancho: 30.2, alto: 23.3 }
    texto: >-
      Texto (str), enteros (int), con decimales (float), verdadero o falso (bool) y None. A
      diferencia de Bash, donde todo es texto, en Python "72" y 72 son cosas distintas: "72" + 1
      es un error, y int("72") + 1 da 73. type(valor) dice de qué tipo es.
  - id: bucle
    titulo: Recorrer y filtrar
    area: { x: 2.3, y: 74.4, ancho: 95.3, alto: 21.1 }
    texto: >-
      for recorre la lista, if filtra con and, or y not, y la sangría (cuatro espacios) marca qué
      está adentro de qué: no hay do, done ni fi. La f antes de las comillas (f-string) reemplaza
      lo que va entre llaves por su valor.
