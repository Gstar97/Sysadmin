- consigna: 'Ahora la consulta. `consultar_api(srv)` pide `url + "/salud"` con timeout y devuelve `(estado, disco)`:
    `("ok", 71)`, `("error 503", None)`, `("sin conexión", None)` o `("no responde", None)`. `consultar_ssh(srv)`
    corre exactamente `ssh -o BatchMode=yes -o ConnectTimeout=5 <host> df -P /` y devuelve `("ok", 80)` con el porcentaje
    de la quinta columna, o `("ssh falló", None)` si el código de salida no es 0. Y `consultar(srv)` elige según
    el tipo y devuelve un diccionario con nombre, descripcion, estado y disco. Armá `resultados` y mostrá `nas01:
    ssh falló`.'
  verificar:
  - prueba: |
      assert [(r["nombre"], r["estado"], r["disco"]) for r in resultados] == [("web01", "ok", 71), ("web02", "error 503", None), ("db01", "ok", 80), ("nas01", "ssh falló", None)]
    mensaje: resultados tiene el estado y el disco correctos de los cuatro
  - prueba: 'assert consultar({"nombre": "x", "tipo": "api", "url": "https://web01.lab"})["descripcion"] == ""'
    mensaje: consultar funciona aunque un servidor no tenga descripción
  - salida_contiene: 'nas01: ssh falló'
  - usa: BatchMode=yes
    mensaje: ssh corre con BatchMode=yes
  - sin_error: true
  pistas:
  - 'Para SSH, el comando como lista: `["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=5", srv["host"], "df",
    "-P", "/"]` con `capture_output=True, text=True, timeout=20`.'
  - De la salida de df, `r.stdout.splitlines()[1].split()[4]` es `"80%"`; `int(uso.rstrip("%"))` lo vuelve número.
  - 'Para la descripción que puede faltar: `srv.get("descripcion", "")`.'
  solucion: |
    import configparser
    import subprocess

    import requests

    CONFIG = "/etc/estado/servidores.ini"


    def leer_servidores(ruta=CONFIG):
        cfg = configparser.ConfigParser()
        cfg.read(ruta)
        return [{"nombre": nombre, **cfg[nombre]} for nombre in cfg.sections()]


    def consultar_api(srv):
        try:
            r = requests.get(srv["url"] + "/salud", timeout=5)
            r.raise_for_status()
        except requests.HTTPError as e:
            return f"error {e.response.status_code}", None
        except requests.Timeout:
            return "no responde", None
        except requests.ConnectionError:
            return "sin conexión", None
        datos = r.json()
        return ("ok" if datos.get("estado") == "ok" else "con problemas"), datos.get("disco")


    def consultar_ssh(srv):
        cmd = ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=5", srv["host"], "df", "-P", "/"]
        try:
            r = subprocess.run(cmd, capture_output=True, text=True, timeout=20)
        except subprocess.TimeoutExpired:
            return "no responde", None
        if r.returncode != 0:
            return "ssh falló", None
        uso = r.stdout.splitlines()[1].split()[4]
        return "ok", int(uso.rstrip("%"))


    def consultar(srv):
        if srv["tipo"] == "api":
            estado, disco = consultar_api(srv)
        else:
            estado, disco = consultar_ssh(srv)
        return {"nombre": srv["nombre"], "descripcion": srv.get("descripcion", ""), "estado": estado, "disco": disco}


    servidores = leer_servidores()
    resultados = [consultar(s) for s in servidores]
    for r in resultados:
        print(f"{r['nombre']}: {r['estado']}")
- consigna: 'Guardá el reporte en /srv/reportes/estado.json (creá la carpeta) con una función `guardar_json(resultados,
    ruta)`: las claves `generado` (fecha y hora en ISO), `total`, `con_problemas` y `servidores` (la lista de resultados),
    con sangría 2.'
  verificar:
  - archivo: /srv/reportes/estado.json
    contenido_incluye: '"con_problemas": 2'
  - prueba: |
      import json
      rep = json.load(open("/srv/reportes/estado.json"))
      assert rep["total"] == 4 and len(rep["servidores"]) == 4
      assert rep["servidores"][2] == {"nombre": "db01", "descripcion": "PostgreSQL de la tienda", "estado": "ok", "disco": 80}
      assert rep["generado"][:2] == "20" and "T" in rep["generado"]
    mensaje: El JSON tiene el total, los cuatro servidores y la fecha en ISO
  - sin_error: true
  pistas:
  - '`datetime.now().isoformat(timespec="seconds")` da algo como `2026-11-22T14:05:00`.'
  - '`sum(1 for r in resultados if r["estado"] != "ok")` cuenta los que tienen problemas.'
  solucion: |
    import configparser
    import json
    import subprocess
    from datetime import datetime
    from pathlib import Path

    import requests

    CONFIG = "/etc/estado/servidores.ini"
    SALIDA = Path("/srv/reportes")


    def leer_servidores(ruta=CONFIG):
        cfg = configparser.ConfigParser()
        cfg.read(ruta)
        return [{"nombre": nombre, **cfg[nombre]} for nombre in cfg.sections()]


    def consultar_api(srv):
        try:
            r = requests.get(srv["url"] + "/salud", timeout=5)
            r.raise_for_status()
        except requests.HTTPError as e:
            return f"error {e.response.status_code}", None
        except requests.Timeout:
            return "no responde", None
        except requests.ConnectionError:
            return "sin conexión", None
        datos = r.json()
        return ("ok" if datos.get("estado") == "ok" else "con problemas"), datos.get("disco")


    def consultar_ssh(srv):
        cmd = ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=5", srv["host"], "df", "-P", "/"]
        try:
            r = subprocess.run(cmd, capture_output=True, text=True, timeout=20)
        except subprocess.TimeoutExpired:
            return "no responde", None
        if r.returncode != 0:
            return "ssh falló", None
        uso = r.stdout.splitlines()[1].split()[4]
        return "ok", int(uso.rstrip("%"))


    def consultar(srv):
        if srv["tipo"] == "api":
            estado, disco = consultar_api(srv)
        else:
            estado, disco = consultar_ssh(srv)
        return {"nombre": srv["nombre"], "descripcion": srv.get("descripcion", ""), "estado": estado, "disco": disco}


    def guardar_json(resultados, ruta):
        reporte = {
            "generado": datetime.now().isoformat(timespec="seconds"),
            "total": len(resultados),
            "con_problemas": sum(1 for r in resultados if r["estado"] != "ok"),
            "servidores": resultados,
        }
        ruta.write_text(json.dumps(reporte, indent=2, ensure_ascii=False))


    servidores = leer_servidores()
    resultados = [consultar(s) for s in servidores]
    for r in resultados:
        print(f"{r['nombre']}: {r['estado']}")
    SALIDA.mkdir(parents=True, exist_ok=True)
    guardar_json(resultados, SALIDA / "estado.json")
