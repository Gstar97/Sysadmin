tipo: python
titulo: Reporte de estado de los servidores
descripcion: Una herramienta que lee la lista de servidores de un archivo de configuración, consulta cada uno por
  su API o por SSH, y deja un reporte en JSON (para otras herramientas) y en HTML (para las personas). Dos servidores
  tienen problemas, como pasa siempre.
archivos:
  /etc/estado/servidores.ini: |
    [web01]
    tipo = api
    url = https://web01.lab
    descripcion = Tienda (frontend)

    [web02]
    tipo = api
    url = https://web02.lab
    descripcion = Tienda (frontend)

    [db01]
    tipo = ssh
    host = db01
    descripcion = PostgreSQL de la tienda

    [nas01]
    tipo = ssh
    host = nas01
    descripcion = NAS de backups <a reemplazar en 2027>
api:
  https://web01.lab/salud:
    json:
      estado: ok
      disco: 71
  https://web02.lab/salud:
    estado: 503
    texto: <html><body>Service Unavailable</body></html>
comandos:
  ssh -o BatchMode=yes -o ConnectTimeout=5 db01 df -P /:
    salida: |
      Filesystem          1024-blocks     Used Available Capacity Mounted on
      /dev/mapper/rl-root    52403200 41922560  10480640      80% /
  ssh -o BatchMode=yes -o ConnectTimeout=5 nas01 df -P /:
    error: |
      ssh: connect to host nas01 port 22: Connection timed out
    codigo: 255
