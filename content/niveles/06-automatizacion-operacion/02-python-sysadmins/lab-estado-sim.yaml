    import configparser
    import html
    import json
    import subprocess
    from datetime import datetime
    from pathlib import Path

    import requests

    CONFIG = "/etc/estado/servidores.ini"
    SALIDA = Path("/srv/reportes")


    def leer_servidores(ruta=CONFIG):
        cfg = configparser.ConfigParser()
        cfg.read(ruta)
        return [{"nombre": nombre, **cfg[nombre]} for nombre in cfg.sections()]


    def consultar_api(srv):
        try:
            r = requests.get(srv["url"] + "/salud", timeout=5)
            r.raise_for_status()
        except requests.HTTPError as e:
            return f"error {e.response.status_code}", None
        except requests.Timeout:
            return "no responde", None
        except requests.ConnectionError:
            return "sin conexión", None
        datos = r.json()
        return ("ok" if datos.get("estado") == "ok" else "con problemas"), datos.get("disco")


    def consultar_ssh(srv):
        cmd = ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=5", srv["host"], "df", "-P", "/"]
        try:
            r = subprocess.run(cmd, capture_output=True, text=True, timeout=20)
        except subprocess.TimeoutExpired:
            return "no responde", None
        if r.returncode != 0:
            return "ssh falló", None
        uso = r.stdout.splitlines()[1].split()[4]
        return "ok", int(uso.rstrip("%"))


    def consultar(srv):
        if srv["tipo"] == "api":
            estado, disco = consultar_api(srv)
        else:
            estado, disco = consultar_ssh(srv)
        return {"nombre": srv["nombre"], "descripcion": srv.get("descripcion", ""), "estado": estado, "disco": disco}


    def guardar_json(resultados, ruta):
        reporte = {
            "generado": datetime.now().isoformat(timespec="seconds"),
            "total": len(resultados),
            "con_problemas": sum(1 for r in resultados if r["estado"] != "ok"),
            "servidores": resultados,
        }
        ruta.write_text(json.dumps(reporte, indent=2, ensure_ascii=False))


    def guardar_html(resultados, ruta):
        filas = []
        for r in resultados:
            clase = "ok" if r["estado"] == "ok" else "problema"
            disco = f"{r['disco']}%" if r["disco"] is not None else "-"
            celdas = [r["nombre"], r["descripcion"], r["estado"], disco]
            filas.append(f'<tr class="{clase}">' + "".join(f"<td>{html.escape(str(c))}</td>" for c in celdas) + "</tr>")
        pagina = (
            "<!doctype html>\n<html lang=\"es\"><meta charset=\"utf-8\"><title>Estado de los servidores</title>\n"
            "<style>.ok{background:#dcf5e4}.problema{background:#fde2e1}td,th{padding:4px 8px}</style>\n"
            "<table>\n<tr><th>Servidor</th><th>Descripción</th><th>Estado</th><th>Disco</th></tr>\n"
            + "\n".join(filas)
            + "\n</table></html>\n"
        )
        ruta.write_text(pagina)


    servidores = leer_servidores()
    resultados = [consultar(s) for s in servidores]
    for r in resultados:
        print(f"{r['nombre']}: {r['estado']}")
    SALIDA.mkdir(parents=True, exist_ok=True)
    guardar_json(resultados, SALIDA / "estado.json")
    guardar_html(resultados, SALIDA / "estado.html")
  explicacion: Escapar todo lo que va a un HTML, aunque hoy parezca inofensivo, evita que un dato raro rompa la
    página o, peor, que alguien inyecte un script en un reporte que abren los administradores.
- consigna: Para terminar, llevá el trabajo a `main()`, con `if __name__ == "__main__":` y `sys.exit(main())`, y
    que el programa termine con código 1 si algún servidor no está ok (0 si todos lo están), para que el timer y
    el monitoreo se enteren.
