<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="py-dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Una herramienta de Python instalada en un servidor</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="380" height="296" rx="8" fill="var(--surface-2, #f1f3f6)"/>
    <rect x="36" y="76" width="348" height="74" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="36" y="160" width="348" height="70" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="36" y="240" width="348" height="82" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="460" y="40" width="380" height="140" rx="8" fill="var(--surface, #fff)"/>
    <rect x="460" y="196" width="380" height="64" rx="8" fill="var(--surface, #fff)"/>
    <rect x="460" y="276" width="380" height="60" rx="8" fill="var(--surface-2, #f1f3f6)"/>
  </g>
  <g fill="currentColor">
    <text x="36" y="62" font-weight="700">/opt/limpieza/ y /etc/limpieza/</text>
    <g font-family="ui-monospace, monospace" font-size="10.5">
      <text x="48" y="96">limpieza.py</text><text x="170" y="96">el programa (del repositorio Git)</text>
      <text x="48" y="114">requirements.txt</text><text x="170" y="114">requests==2.32.5</text>
      <text x="48" y="132">tests/</text><text x="170" y="132">pruebas con pytest</text>
      <text x="48" y="180">venv/</text><text x="170" y="180">entorno virtual: su propio</text>
      <text x="61" y="198">bin/python</text><text x="170" y="198">python y sus bibliotecas,</text>
      <text x="61" y="216">lib/...</text><text x="170" y="216">aparte de las del sistema</text>
      <text x="48" y="262">/etc/limpieza/limpieza.ini</text><text x="290" y="262">config</text>
      <text x="48" y="280">/etc/limpieza/secretos.env</text><text x="290" y="280">(600) token</text>
      <text x="48" y="304">no van al repositorio ni al venv</text>
    </g>
    <text x="474" y="62" font-weight="700">limpieza.service</text>
    <g font-family="ui-monospace, monospace" font-size="10.5">
      <text x="474" y="84">[Service]</text>
      <text x="474" y="102">Type=oneshot</text>
      <text x="474" y="120">User=limpieza</text>
      <text x="474" y="138">EnvironmentFile=/etc/limpieza/secretos.env</text>
      <text x="474" y="156">ExecStart=/opt/limpieza/venv/bin/python \</text>
      <text x="487" y="172">/opt/limpieza/limpieza.py --dias 14</text>
    </g>
    <text x="474" y="216" font-weight="700">limpieza.timer</text>
    <g font-family="ui-monospace, monospace" font-size="10.5">
      <text x="474" y="236">OnCalendar=*-*-* 03:15</text><text x="660" y="236">Persistent=true</text>
      <text x="474" y="252">RandomizedDelaySec=10min</text>
    </g>
    <text x="474" y="296" font-weight="700">los mensajes</text>
    <g font-size="11"><text x="474" y="316">logging escribe en stderr → journalctl -u limpieza</text></g>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M460 156 L402 196" marker-end="url(#py-dep)"/>
    <path d="M650 196 L650 182" marker-end="url(#py-dep)"/>
  </g>
</svg>
