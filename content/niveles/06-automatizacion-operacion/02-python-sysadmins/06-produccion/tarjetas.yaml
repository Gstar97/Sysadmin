- { id: t1, frente: "argparse", dorso: "add_argument(\"--dias\", type=int, default=14), action=\"store_true\" para interruptores; --help y validación gratis." }
- { id: t2, frente: "logging", dorso: "basicConfig(level=..., format=...), getLogger(nombre), log.info(\"%s\", valor). A stderr: con systemd, al journal." }
- { id: t3, frente: "Entorno virtual", dorso: "python3 -m venv /opt/app/venv; /opt/app/venv/bin/pip install -r requirements.txt; ExecStart con /opt/app/venv/bin/python." }
- { id: t4, frente: "externally-managed-environment", dorso: "Debian y Ubuntu bloquean sudo pip en el Python del sistema. La salida: venv, pipx o el paquete de la distribución." }
- { id: t5, frente: "requirements.txt", dorso: "Bibliotecas con versión exacta (requests==2.32.5). pip freeze lo genera." }
- { id: t6, frente: "uv", dorso: "Crea entornos e instala rápido (uv venv, uv pip install) e instala otras versiones de Python (uv python install 3.13)." }
- { id: t7, frente: "pytest", dorso: "Archivos test_*.py con funciones test_* que usan assert; tmp_path da una carpeta temporal." }
