tipo: diagrama
titulo: Remotos y pull requests
puntos:
  - id: local
    titulo: Tu copia
    area: { x: 2.3, y: 11.9, ancho: 25.6, alto: 35.1 }
    texto: >-
      Un clon tiene la historia completa: podés hacer commits, ramas y ver todo sin red. Además
      guarda dónde estaba cada rama del remoto la última vez que hablaste con él (origin/main).
      Esas "ramas de seguimiento" se actualizan con git fetch o git pull, no solas.
  - id: central
    titulo: El repositorio central
    area: { x: 37.2, y: 11.9, ancho: 25.6, alto: 35.1 }
    texto: >-
      Un repositorio más, que el equipo acuerda usar como referencia. Puede ser un servidor propio
      (git init --bare en una carpeta, accesible por ssh) o una plataforma: GitHub, GitLab,
      Gitea o Forgejo (estas dos se instalan en un servidor propio). Las plataformas agregan los
      pull requests, permisos, ramas protegidas y pruebas automáticas.
  - id: pablo
    titulo: Otras copias
    area: { x: 72.1, y: 11.9, ancho: 25.6, alto: 35.1 }
    texto: >-
      Cada persona (y cada servidor que tome la configuración) tiene su copia. Nadie pisa el
      trabajo de otro: si el central avanzó, tu push se rechaza hasta que traigas lo nuevo con
      git pull y lo fusiones con lo tuyo.
  - id: pr
    titulo: El camino con pull request
    area: { x: 2.3, y: 61.1, ancho: 95.4, alto: 17.3 }
    texto: >-
      Un pull request (en GitLab, merge request) es un pedido de fusionar una rama en main, con
      los cambios a la vista para que otra persona los revise, comente y apruebe. En
      infraestructura es oro: dos pares de ojos sobre un cambio de firewall o de nginx antes de que
      llegue a producción. Con main protegida, es la única forma de que algo entre.
