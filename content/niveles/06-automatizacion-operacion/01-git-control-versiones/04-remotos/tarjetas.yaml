- { id: t1, frente: "Remotos", dorso: "git clone, git remote -v, git fetch, git pull (fetch + merge), git push (-u la primera vez)." }
- { id: t2, frente: "Push rechazado", dorso: "El central tiene commits que no tenés: git pull, resolver, git push. Nunca --force." }
- { id: t3, frente: "Pull request", dorso: "Pedido de fusionar una rama en main, con revisión y aprobación. En GitLab, merge request." }
- { id: t4, frente: "main protegida", dorso: "Sin push directo ni force; fusión solo con pull request aprobado y pruebas en verde." }
- { id: t5, frente: "Servidor propio", dorso: "git init --bare por ssh (simple) o Gitea/Forgejo (con pull requests)." }
