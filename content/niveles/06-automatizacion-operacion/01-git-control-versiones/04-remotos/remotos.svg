<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="fl-rem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Un repositorio central, dos copias y el camino de un cambio</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="44" width="220" height="130" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="320" y="44" width="220" height="130" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="620" y="44" width="220" height="130" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="130" y="68" font-weight="700">tu copia (admin01)</text>
    <g font-size="10.5"><text x="130" y="88">la historia completa</text><text x="130" y="104">tus ramas locales</text><text x="130" y="120">origin/main: lo último</text><text x="130" y="136">que trajiste del central</text></g>
    <text x="430" y="68" font-weight="700">repositorio central</text>
    <g font-size="10.5"><text x="430" y="88">git01, GitHub, GitLab o Gitea</text><text x="430" y="104">"origin" para las copias</text><text x="430" y="120">la referencia de todos</text><text x="430" y="136">(sin archivos sueltos: bare)</text></g>
    <text x="730" y="68" font-weight="700">la copia de Pablo</text>
    <g font-size="10.5"><text x="730" y="88">otra copia completa,</text><text x="730" y="104">que avanza por su lado</text></g>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <path d="M240 84 L318 84" marker-end="url(#fl-rem)"/>
    <path d="M318 120 L242 120" marker-end="url(#fl-rem)"/>
    <path d="M620 84 L542 84" marker-end="url(#fl-rem)"/>
    <path d="M542 120 L618 120" marker-end="url(#fl-rem)"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="10.5" text-anchor="middle">
    <text x="279" y="78">push</text>
    <text x="279" y="138">pull</text>
    <text x="279" y="152">clone</text>
    <text x="581" y="78">push</text>
    <text x="581" y="138">pull</text>
  </g>
  <text x="430" y="210" text-anchor="middle" font-weight="700" fill="currentColor">el camino de un cambio con pull request</text>
  <g stroke="currentColor" stroke-width="1" fill="var(--surface, #fff)">
    <rect x="20" y="226" width="126" height="64" rx="6"/>
    <rect x="160" y="226" width="126" height="64" rx="6"/>
    <rect x="300" y="226" width="126" height="64" rx="6"/>
    <rect x="440" y="226" width="126" height="64" rx="6"/>
    <rect x="580" y="226" width="126" height="64" rx="6"/>
    <rect x="720" y="226" width="120" height="64" rx="6"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <path d="M146 258 L158 258" marker-end="url(#fl-rem)"/><path d="M286 258 L298 258" marker-end="url(#fl-rem)"/><path d="M426 258 L438 258" marker-end="url(#fl-rem)"/><path d="M566 258 L578 258" marker-end="url(#fl-rem)"/><path d="M706 258 L718 258" marker-end="url(#fl-rem)"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="10.5">
    <text x="83" y="250" font-weight="700">1. git pull</text><text x="83" y="266">y una rama</text><text x="83" y="280">nueva</text>
    <text x="223" y="250" font-weight="700">2. commits</text><text x="223" y="266">en la rama</text>
    <text x="363" y="250" font-weight="700">3. git push -u</text><text x="363" y="266">la rama al</text><text x="363" y="280">central</text>
    <text x="503" y="250" font-weight="700">4. pull request</text><text x="503" y="266">alguien revisa,</text><text x="503" y="280">comenta, aprueba</text>
    <text x="643" y="250" font-weight="700">5. fusión en</text><text x="643" y="266">main (en la web)</text><text x="643" y="280">y se borra la rama</text>
    <text x="780" y="250" font-weight="700">6. git pull</text><text x="780" y="266">todos traen</text><text x="780" y="280">el main nuevo</text>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="10.5">
    <text x="430" y="320">main protegida: nadie sube directo, se fusiona solo con un pull request aprobado</text>
    <text x="430" y="338">y con las pruebas automáticas en verde (lección 6.1.5)</text>
  </g>
</svg>
