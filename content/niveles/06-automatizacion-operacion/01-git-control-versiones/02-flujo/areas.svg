<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="fl-areas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Las tres zonas de Git y los comandos que mueven cambios entre ellas</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="44" width="200" height="200" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="330" y="44" width="200" height="200" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="640" y="44" width="200" height="200" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="120" y="68" font-weight="700">directorio de trabajo</text>
    <g font-size="10.5"><text x="120" y="88">los archivos que editás</text><text x="120" y="104">(nano, sed, cp...)</text></g>
    <text x="430" y="68" font-weight="700">área de preparación</text>
    <g font-size="10.5"><text x="430" y="88">lo que va a entrar</text><text x="430" y="104">en el próximo commit</text><text x="430" y="120">(staging o índice)</text></g>
    <text x="740" y="68" font-weight="700">repositorio (.git)</text>
    <g font-size="10.5"><text x="740" y="88">los commits:</text><text x="740" y="104">la historia</text></g>
    <g font-family="ui-monospace, monospace" font-size="10.5">
      <text x="120" y="150">tienda.conf  modificado</text><text x="120" y="168">respaldo.sh  modificado</text><text x="120" y="186">.env    sin versionar</text>
      <text x="430" y="160">tienda.conf</text>
      <text x="740" y="150">a41c9e2 Límite 20 MB</text><text x="740" y="168">7d03b1f Caché /img</text><text x="740" y="186">0f91d3c Primera</text>
    </g>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <path d="M220 200 L328 200" marker-end="url(#fl-areas)"/>
    <path d="M530 200 L638 200" marker-end="url(#fl-areas)"/>
    <path d="M328 226 L222 226" marker-end="url(#fl-areas)" stroke-dasharray="4 3"/>
    <path d="M420 246 C 380 300, 160 300, 120 248" marker-end="url(#fl-areas)" stroke-dasharray="4 3"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="10.5" text-anchor="middle">
    <text x="275" y="194">git add</text>
    <text x="585" y="194">git commit</text>
    <text x="275" y="242">restore --staged</text>
    <text x="270" y="300">git restore archivo</text>
  </g>
  <g fill="currentColor" font-size="10.5" text-anchor="middle">
    <text x="270" y="315">(descarta lo que no preparaste)</text>
    <text x="680" y="290">git diff: trabajo contra preparación</text>
    <text x="680" y="308">git diff --staged: preparación contra</text>
    <text x="680" y="322">el último commit</text>
  </g>
</svg>
