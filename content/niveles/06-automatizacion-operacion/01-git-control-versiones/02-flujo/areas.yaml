tipo: diagrama
titulo: Las tres zonas de Git
puntos:
  - id: trabajo
    titulo: Directorio de trabajo
    area: { x: 2.3, y: 12.9, ancho: 23.3, alto: 58.8 }
    texto: >-
      Los archivos tal como están en el disco, que editás con cualquier programa. Git los compara
      con lo último guardado y te dice cuáles cambiaron (modified) y cuáles nunca versionaste
      (untracked). Lo que está solo acá se pierde si lo pisás: todavía no está en ningún commit.
  - id: preparacion
    titulo: Área de preparación (staging)
    area: { x: 38.4, y: 12.9, ancho: 23.3, alto: 58.8 }
    texto: >-
      Una zona intermedia donde armás el próximo commit: con git add elegís qué cambios entran.
      Sirve para que un commit tenga un solo cambio con sentido aunque hayas tocado varias cosas.
      git add -p deja elegir incluso partes de un mismo archivo.
  - id: repositorio
    titulo: Repositorio
    area: { x: 74.4, y: 12.9, ancho: 23.3, alto: 58.8 }
    texto: >-
      Los commits, guardados en .git. Lo que llega acá ya no se pierde: se puede ver, comparar y
      volver a cualquier punto. git log muestra la historia y git show, un commit con sus cambios.
  - id: restore
    titulo: Deshacer
    area: { x: 11.6, y: 73.5, ancho: 37, alto: 22 }
    texto: >-
      git restore archivo descarta los cambios que no preparaste y deja el archivo como en el área
      de preparación (o como en el último commit). git restore --staged archivo saca un archivo de
      la preparación sin tocar lo que editaste. Cuidado: lo que descartás con restore no estaba
      guardado en ningún lado.
