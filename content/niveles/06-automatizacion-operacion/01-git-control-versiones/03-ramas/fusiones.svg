<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Dos formas de fusionar una rama en main</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="400" height="205" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="440" y="40" width="400" height="205" rx="8" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="220" y="62" font-weight="700">avance rápido (fast-forward)</text>
    <text x="640" y="62" font-weight="700">commit de fusión</text>
  </g>
  <g stroke="currentColor" stroke-width="1.8" fill="none">
    <path d="M60 110 L300 110"/>
    <path d="M480 100 L560 100 L640 100 L760 130"/>
    <path d="M560 100 C 590 100, 600 165, 640 165 L700 165 L760 132"/>
  </g>
  <g fill="var(--surface, #fff)" stroke="currentColor" stroke-width="1.5">
    <circle cx="60" cy="110" r="9"/><circle cx="140" cy="110" r="9"/><circle cx="220" cy="110" r="9"/><circle cx="300" cy="110" r="9"/>
    <circle cx="480" cy="100" r="9"/><circle cx="560" cy="100" r="9"/><circle cx="640" cy="100" r="9"/><circle cx="640" cy="165" r="9"/><circle cx="700" cy="165" r="9"/>
  </g>
  <circle cx="760" cy="131" r="11" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="2"/>
  <g fill="currentColor" font-size="10.5" text-anchor="middle">
    <text x="140" y="94" font-weight="700">main estaba acá</text>
    <text x="300" y="94" font-weight="700">main y tls13</text>
    <text x="260" y="136">los commits de la rama</text>
    <text x="220" y="175">main no tenía nada nuevo: git merge</text>
    <text x="220" y="191">solo mueve main hasta la punta de la rama.</text>
    <text x="220" y="207">La historia queda en una línea, sin</text>
    <text x="220" y="223">commit nuevo.</text>
    <text x="640" y="86" font-weight="700">main</text>
    <text x="670" y="190">tls13</text>
    <text x="790" y="116" font-weight="700">fusión</text>
    <text x="640" y="212">las dos avanzaron: git crea un commit con</text>
    <text x="640" y="228">dos padres. Si tocaron las mismas líneas, conflicto.</text>
  </g>
</svg>
