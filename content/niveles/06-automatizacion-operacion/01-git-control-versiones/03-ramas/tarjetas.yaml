- { id: t1, frente: "Rama y HEAD", dorso: "Rama: nombre que apunta a un commit y avanza. HEAD: dónde estás parado." }
- { id: t2, frente: "Comandos de ramas", dorso: "git switch -c, git switch, git branch, git branch -d, git merge, git log --oneline --graph." }
- { id: t3, frente: "Avance rápido o fusión", dorso: "Si main no avanzó, se mueve (fast-forward). Si las dos avanzaron, commit con dos padres." }
- { id: t4, frente: "Conflicto", dorso: "Editar hasta que quede bien, sin marcas, git add y git commit; o git merge --abort." }
- { id: t5, frente: "revert o reset", dorso: "revert: commit nuevo, para lo compartido. reset --hard: reescribe, solo para lo local. reflog para rescatar." }
