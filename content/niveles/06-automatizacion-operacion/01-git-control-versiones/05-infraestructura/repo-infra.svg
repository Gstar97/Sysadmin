<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="fl-infra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Un repositorio de infraestructura y el camino de un cambio hasta los servidores</text>
  <rect x="20" y="40" width="330" height="305" rx="8" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1.1"/>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="11.5">
    <text x="40" y="66" font-weight="700">infra/</text>
    <text x="56" y="92">LEEME.txt</text><text x="200" y="92" font-family="system-ui, sans-serif" font-size="10.5">qué hay y cómo se usa</text>
    <text x="56" y="116">.gitignore</text><text x="200" y="116" font-family="system-ui, sans-serif" font-size="10.5">secretos, logs</text>
    <text x="56" y="140">hooks/</text><text x="200" y="140" font-family="system-ui, sans-serif" font-size="10.5">validaciones del equipo</text>
    <text x="56" y="164">nginx/  dns/  firewall/</text><text x="56" y="180" font-family="system-ui, sans-serif" font-size="10.5">configuraciones, por servicio</text>
    <text x="56" y="204">scripts/</text><text x="200" y="204" font-family="system-ui, sans-serif" font-size="10.5">tareas programadas</text>
    <text x="56" y="228">inventario/</text><text x="200" y="228" font-family="system-ui, sans-serif" font-size="10.5">qué servidores hay</text>
    <text x="56" y="252">ansible/</text><text x="200" y="252" font-family="system-ui, sans-serif" font-size="10.5">módulo 6.3</text>
    <text x="56" y="276">docs/</text><text x="200" y="276" font-family="system-ui, sans-serif" font-size="10.5">procedimientos, planes</text>
    <text x="56" y="312" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">sin contraseñas, sin claves privadas,</text>
    <text x="56" y="328" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">sin archivos generados</text>
  </g>
  <g stroke="currentColor" stroke-width="1" fill="var(--surface, #fff)">
    <rect x="390" y="44" width="450" height="44" rx="6"/>
    <rect x="390" y="104" width="450" height="44" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="390" y="164" width="450" height="44" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="390" y="224" width="450" height="44" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="390" y="284" width="450" height="56" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <path d="M615 88 L615 102" marker-end="url(#fl-infra)"/><path d="M615 148 L615 162" marker-end="url(#fl-infra)"/><path d="M615 208 L615 222" marker-end="url(#fl-infra)"/><path d="M615 268 L615 282" marker-end="url(#fl-infra)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="615" y="64" font-weight="700">1. commit en una rama</text><text x="615" y="80" font-size="10.5">un cambio con sentido, con su mensaje</text>
    <text x="615" y="124" font-weight="700">2. pre-commit en tu equipo</text><text x="615" y="140" font-size="10.5">sintaxis, secretos: ataja los errores tontos al instante</text>
    <text x="615" y="184" font-weight="700">3. pull request</text><text x="615" y="200" font-size="10.5">otra persona revisa y aprueba</text>
    <text x="615" y="244" font-weight="700">4. integración continua (CI)</text><text x="615" y="260" font-size="10.5">las mismas validaciones y más, en el servidor; no se saltean</text>
    <text x="615" y="304" font-weight="700">5. fusión en main, etiqueta y despliegue</text><text x="615" y="320" font-size="10.5">los servidores toman main (git pull, Ansible): lo que está en</text><text x="615" y="334" font-size="10.5">el repositorio es lo que está en producción</text>
  </g>
</svg>
