- { id: t1, frente: "Repositorio de infraestructura", dorso: "Configuraciones, scripts, inventario, playbooks, docs y hooks. Sin secretos ni claves." }
- { id: t2, frente: "Regla de oro", dorso: "Los servidores no se editan a mano: los cambios van por el repositorio." }
- { id: t3, frente: "Validaciones en tres lugares", dorso: "Pre-commit (core.hooksPath), pull request (revisión) e integración continua (no se saltea)." }
- { id: t4, frente: "Secretos", dorso: "Archivo fuera del repo (600), variables de entorno, Ansible Vault o SOPS, o un gestor de secretos." }
- { id: t5, frente: "Investigar", dorso: "git blame, git log -S \"texto\", git log --since=\"1 week ago\" -- carpeta/." }
