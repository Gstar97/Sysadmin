tipo: diagrama
titulo: Sin versionar y con Git
puntos:
  - id: a-mano
    titulo: Versiones a mano
    area: { x: 2.3, y: 11.8, ancho: 45.3, alto: 83.8 }
    texto: >-
      Copiar el archivo antes de tocarlo es mejor que nada, pero a los meses nadie sabe cuál es la
      buena, quién cambió qué ni por qué. Y cuando el mismo archivo está en varios servidores, cada
      uno termina siendo distinto (la "deriva de configuración") sin que nadie lo haya decidido.
  - id: con-git
    titulo: Con Git
    area: { x: 52.3, y: 11.8, ancho: 45.3, alto: 83.8 }
    texto: >-
      Cada commit es una foto completa de los archivos, con autor, fecha y un mensaje que dice
      qué se hizo y por qué. Se puede ver qué cambió entre dos fotos, volver a cualquiera y, con un
      repositorio central, que todos los servidores tomen la misma versión. El historial deja de
      depender de la memoria de una persona.
