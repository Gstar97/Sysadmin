<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">La misma configuración, sin versionar y con Git</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="390" height="285" rx="8" fill="var(--bad-soft, #fbe0e0)"/>
    <rect x="450" y="40" width="390" height="285" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="215" y="64" text-anchor="middle" font-weight="700">/etc/nginx/sites-available/ a mano</text>
    <g font-family="ui-monospace, monospace" font-size="11.5">
      <text x="44" y="96">tienda.conf</text>
      <text x="44" y="118">tienda.conf.bak</text>
      <text x="44" y="140">tienda.conf.bak2</text>
      <text x="44" y="162">tienda.conf.viejo-anda</text>
      <text x="44" y="184">tienda.conf.20260312</text>
      <text x="44" y="206">tienda.conf.NO-TOCAR</text>
    </g>
    <g font-size="10.5">
      <text x="230" y="96">¿cuál es la buena?</text>
      <text x="230" y="140">¿quién cambió qué?</text>
      <text x="230" y="184">¿por qué?</text>
      <text x="230" y="206">¿cuándo se rompió?</text>
    </g>
    <text x="215" y="246" text-anchor="middle" font-size="10.5">y en el otro servidor, una copia distinta</text>
    <text x="215" y="264" text-anchor="middle" font-size="10.5">que alguien editó directamente</text>
    <text x="215" y="300" text-anchor="middle" font-weight="700" font-size="11">la historia está en la cabeza de alguien</text>

    <text x="645" y="64" text-anchor="middle" font-weight="700">el mismo archivo, en un repositorio</text>
  </g>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <path d="M490 96 L490 236"/>
  </g>
  <g fill="var(--surface, #fff)" stroke="currentColor" stroke-width="1.5">
    <circle cx="490" cy="96" r="7"/><circle cx="490" cy="142" r="7"/><circle cx="490" cy="188" r="7"/><circle cx="490" cy="234" r="7"/>
  </g>
  <g fill="currentColor" font-size="10.5">
    <text x="508" y="92" font-family="ui-monospace, monospace">a41c9e2</text><text x="566" y="92">Ana · hoy · Límite de subida a 20 MB</text>
    <text x="508" y="138" font-family="ui-monospace, monospace">7d03b1f</text><text x="566" y="138">Pablo · ayer · Caché para /img</text>
    <text x="508" y="184" font-family="ui-monospace, monospace">c2e8a55</text><text x="566" y="184">Ana · 12/3 · HTTPS con la CA interna</text>
    <text x="508" y="230" font-family="ui-monospace, monospace">0f91d3c</text><text x="566" y="230">Ana · 2/3 · Primera versión</text>
    <text x="645" y="272" text-anchor="middle">cada cambio: quién, cuándo, qué y por qué</text>
    <text x="645" y="290" text-anchor="middle">volver a cualquier punto con un comando</text>
    <text x="645" y="308" text-anchor="middle" font-weight="700" font-size="11">la historia está en el repositorio</text>
  </g>
</svg>
