- { id: t1, frente: "Repositorio y commit", dorso: "Repositorio: carpeta con su historia en .git. Commit: una foto con autor, fecha y mensaje." }
- { id: t2, frente: "Primera vez en un equipo", dorso: "git config --global user.name, user.email e init.defaultBranch main." }
- { id: t3, frente: "Lo básico", dorso: "git init, git status, git add, git commit -m, git diff, git log." }
- { id: t4, frente: "Ver una versión vieja", dorso: "git show HEAD~1:ruta/al/archivo (o cualquier identificador de commit)." }
- { id: t5, frente: "Lo que Git no es", dorso: "No es un respaldo de los servidores ni un lugar para contraseñas." }
