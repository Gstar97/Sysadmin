<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="an-lg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Logs centralizados: cada equipo manda lo suyo, un lugar guarda, busca y avisa</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="200" height="230" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="260" y="40" width="170" height="230" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="470" y="40" width="370" height="230" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="486" y="96" width="160" height="86" rx="6" fill="var(--surface, #fff)"/>
    <rect x="664" y="96" width="160" height="86" rx="6" fill="var(--surface, #fff)"/>
    <rect x="486" y="192" width="338" height="64" rx="6" fill="var(--surface, #fff)"/>
    <rect x="20" y="288" width="820" height="100" rx="8" fill="var(--surface-2, #f1f3f6)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#an-lg)">
    <path d="M222 155 L258 155"/>
    <path d="M432 155 L468 155"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="62" font-weight="700">de dónde salen</text>
    <g font-size="11">
      <text x="34" y="86">Linux: journald y /var/log</text>
      <text x="34" y="104">(sshd, sudo, cron, el kernel)</text>
      <text x="34" y="128">Windows: el Visor de eventos</text>
      <text x="34" y="146">(Security 4625, 4726...)</text>
      <text x="34" y="170">switches, routers, firewalls:</text>
      <text x="34" y="188">syslog por UDP 514</text>
      <text x="34" y="212">aplicaciones y nginx:</text>
      <text x="34" y="230">archivos, mejor en JSON</text>
      <text x="34" y="254">todos con la misma hora (NTP)</text>
    </g>
    <text x="274" y="62" font-weight="700">quién los manda</text>
    <g font-size="11">
      <text x="274" y="86">rsyslog (TCP 514,</text>
      <text x="274" y="104">o TLS en el 6514)</text>
      <text x="274" y="128">Grafana Alloy</text>
      <text x="274" y="146">(archivos y journal)</text>
      <text x="274" y="170">Windows Event</text>
      <text x="274" y="188">Forwarding</text>
      <text x="274" y="212">con cola: si el central</text>
      <text x="274" y="230">se cae, esperan</text>
      <text x="274" y="248">y no se pierden</text>
    </g>
    <text x="484" y="62" font-weight="700">la plataforma central</text>
    <g font-size="11">
      <text x="484" y="82">Loki, Elastic / OpenSearch o Graylog (lección 6.5.3)</text>
      <text x="496" y="116" font-weight="700">guarda</text>
      <text x="496" y="134">con retención: 30 días</text>
      <text x="496" y="150">a mano, un año archivado</text>
      <text x="496" y="166">(auditoría, leyes)</text>
      <text x="674" y="116" font-weight="700">busca y correlaciona</text>
      <text x="674" y="134">todo junto, por equipo,</text>
      <text x="674" y="150">programa y hora: qué</text>
      <text x="674" y="166">pasó antes y después</text>
      <text x="496" y="212" font-weight="700">avisa y audita</text>
      <text x="496" y="230">alertas por patrones (20 logins fallidos), y nadie puede</text>
      <text x="496" y="246">borrar lo que hizo: el atacante no llega al servidor central</text>
    </g>
    <text x="34" y="310" font-weight="700">una línea en formato syslog RFC 5424</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
      <text x="34" y="336">&lt;38&gt;1 2026-11-23T14:02:11.412-03:00 web01 sshd 1822 - - Failed password for ana from 203.0.113.50 port 51234 ssh2</text>
    </g>
    <g font-size="11">
      <text x="34" y="360">prioridad (auth.info) · versión · hora completa con zona · equipo · programa · PID · id del mensaje · datos estructurados · mensaje</text>
      <text x="34" y="378">en JSON cada dato es un campo con nombre: {"time": "...", "host": "web01", "app": "sshd", "user": "ana", "ip": "203.0.113.50"}</text>
    </g>
  </g>
</svg>
