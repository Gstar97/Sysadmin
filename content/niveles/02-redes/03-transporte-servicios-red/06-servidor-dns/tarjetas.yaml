- { id: t1, frente: "BIND en Rocky y en Ubuntu", dorso: "Rocky: /etc/named.conf y zonas en /var/named (de fábrica solo localhost). Ubuntu: /etc/bind/named.conf.options y named.conf.local. Servicio: named." }
- { id: t2, frente: "Reglas del archivo de zona", dorso: "@ = la zona. Nombres completos con punto final. Correo del SOA con punto en vez de @. Serial fecha+número, subirlo siempre." }
- { id: t3, frente: "Validar y aplicar en BIND", dorso: "named-checkzone zona archivo · sudo named-checkconf -z · sudo rndc reload · journalctl -u named." }
- { id: t4, frente: "Zona inversa", dorso: "Red al revés + in-addr.arpa: 192.168.10.0/24 → 10.168.192.in-addr.arpa. Registros PTR con el último octeto." }
- { id: t5, frente: "Para que BIND responda a la red (Rocky)", dorso: "listen-on port 53 { any; }; · allow-query { localhost; localnets; }; · firewall-cmd --permanent --add-service=dns." }
- { id: t6, frente: "Unbound", dorso: "interface 0.0.0.0 · access-control red allow · forward-zone para la zona interna hacia BIND · domain-insecure si no está firmada · unbound-checkconf." }
