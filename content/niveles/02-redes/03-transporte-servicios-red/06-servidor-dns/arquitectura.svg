<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <defs><marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="20" y="26" font-weight="700" fill="currentColor">El DNS de una empresa chica: un resolvedor para todos y un autoritativo para la zona interna</text>
  <g stroke="currentColor">
    <rect x="20" y="70" width="150" height="120" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="260" y="80" width="190" height="100" rx="10" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="560" y="44" width="280" height="90" rx="10" fill="var(--accent-soft, #d9efe9)"/>
    <rect x="560" y="170" width="280" height="80" rx="40" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="95" y="100" font-weight="700">Equipos</text><text x="95" y="120" font-size="11.5">resolv.conf →</text><text x="95" y="136" font-size="11.5">192.168.10.53</text><text x="95" y="160" font-size="11.5">(se lo da el DHCP)</text>
    <text x="355" y="106" font-weight="700">Unbound (resolvedor)</text><text x="355" y="124" font-family="ui-monospace, monospace" font-size="11.5">192.168.10.53</text><text x="355" y="144" font-size="11.5">caché · solo la red interna</text><text x="355" y="160" font-size="11.5">puede preguntarle</text>
    <text x="700" y="70" font-weight="700">BIND (autoritativo)</text><text x="700" y="88" font-family="ui-monospace, monospace" font-size="11.5">192.168.10.54</text><text x="700" y="108" font-size="11.5">zona empresa.internal y su inversa</text><text x="700" y="124" font-size="11.5">10.168.192.in-addr.arpa · sin recursión</text>
    <text x="700" y="206" font-weight="700">Internet</text><text x="700" y="224" font-size="11.5">raíz y autoritativos de todo el mundo</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#fd)"><line x1="170" y1="130" x2="256" y2="130"/><line x1="450" y1="110" x2="556" y2="90"/><line x1="450" y1="150" x2="556" y2="200"/></g>
  <g fill="currentColor" font-size="11.5"><text x="460" y="84">*.empresa.internal</text><text x="460" y="196">todo lo demás</text></g>
  <text x="20" y="282" font-size="11.5" fill="currentColor">En una oficina muy chica los dos pueden estar en el mismo servidor; separados es más seguro y más fácil de diagnosticar.</text>
</svg>
