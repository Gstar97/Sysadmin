tipo: terminal
shell: bash
titulo: BIND autoritativo para empresa.internal
descripcion: >-
  ns1 (192.168.10.54, Rocky) ya tiene BIND instalado con la configuración de fábrica y el
  archivo de zona listo en /var/named/db.empresa.internal. Falta declarar la zona, arrancar el
  servicio y hacer que la red pueda consultarlo. pc1 (192.168.10.101) es un cliente de la red.
estado_inicial:
  distro: rocky
  hostname: ns1
  usuario: admin
  usuarios: [{ nombre: admin, sudo: true, clave_ssh: true }]
  red:
    interfaces: [{ nombre: enp0s3, ip: 192.168.10.54/24 }]
    puerta_enlace: 192.168.10.1
    dns: [127.0.0.1]
  paquetes: { instalados: [bind, bind-utils] }
  archivos:
    /var/named/db.empresa.internal:
      contenido: |
        $TTL 1h
        @   IN  SOA ns1.empresa.internal. admin.empresa.internal. ( 2026110201 1h 15m 1w 5m )
            IN  NS  ns1.empresa.internal.
            IN  MX  10 mail
        ns1       IN  A     192.168.10.54
        mail      IN  A     192.168.10.25
        intranet  IN  A     192.168.10.80
        www       IN  CNAME intranet
  servidores:
    - { ip: 192.168.10.101, hostname: pc1, clave_conocida: si, usuarios: [{ nombre: admin, sudo: true, clave_ssh: true }], red: { interfaces: [{ nombre: enp0s3, ip: 192.168.10.101/24 }], puerta_enlace: 192.168.10.1, dns: [192.168.10.54] }, paquetes: { instalados: [bind-utils] } }
pasos:
  - consigna: Revisá el archivo de zona con named-checkzone (nombre de la zona y archivo).
    verificar:
      - { comando_usado: named-checkzone }
      - { salida_contiene: "loaded serial 2026110201" }
    pistas: ["named-checkzone empresa.internal /var/named/db.empresa.internal"]
    solucion: [named-checkzone empresa.internal /var/named/db.empresa.internal]
    explicacion: "OK y el serial: la zona está bien escrita. Revisala siempre antes de cargarla."
  - consigna: >-
      Declara la zona al final de /etc/named.conf: tipo primary, archivo db.empresa.internal
      (relativo a /var/named, el directorio de BIND en Rocky).
    verificar:
      - { archivo: /etc/named.conf, contenido_incluye: 'zone "empresa.internal"' }
    pistas:
      - "Con sudo tee -a /etc/named.conf y un heredoc, o con un editor (sudo vim /etc/named.conf)."
      - 'El bloque: zone "empresa.internal" IN { type primary; file "db.empresa.internal"; };'
    solucion:
      - |
        sudo tee -a /etc/named.conf > /dev/null <<'EOF'
        zone "empresa.internal" IN {
            type primary;
            file "db.empresa.internal";
        };
        EOF
    explicacion: Cada zona que el servidor publica se declara en named.conf con su tipo y su archivo.
  - consigna: Revisá toda la configuración, incluidas las zonas, antes de arrancar.
    verificar:
      - { comando_usado: named-checkconf }
      - { salida_contiene: "zone empresa.internal/IN: loaded serial" }
    pistas: ["sudo named-checkconf -z"]
    solucion: [sudo named-checkconf -z]
    explicacion: Sin errores de sintaxis y con todas las zonas cargadas. Es lo mismo que hace el servicio antes de arrancar.
  - consigna: Arranca named, dejalo habilitado y prueba localmente qué responde para www.empresa.internal.
    verificar:
      - { servicio: named, activo: true, habilitado: true }
      - { salida_contiene: "192.168.10.80" }
    pistas: ["sudo systemctl enable --now named, y después dig @127.0.0.1 www.empresa.internal"]
    solucion: [sudo systemctl enable --now named, dig @127.0.0.1 www.empresa.internal]
    explicacion: Respuesta autoritativa (flag aa) con el CNAME y la A de intranet.
  - consigna: Ahora desde pc1. ¿Responde ns1?
    verificar:
      - { comando_usado: ssh pc1 }
    pistas: ["ssh pc1 dig www.empresa.internal"]
    solucion: [ssh pc1 dig www.empresa.internal]
    explicacion: >-
      No: "communications error ... host unreachable". Dos cosas lo impiden en una instalación
      de fábrica de Rocky: named escucha solo en 127.0.0.1 (listen-on) y solo responde a
      localhost (allow-query), y además firewalld no deja pasar el puerto 53.
  - consigna: >-
      Hacé que named escuche en todas las interfaces y responda a la red local (listen-on con
      any y allow-query con localnets), abrí DNS en firewalld de forma permanente y reiniciá
      named.
    verificar:
      - { en: pc1, verificar: { resuelve: www.empresa.internal, responde: "192.168.10.80" } }
    pistas:
      - "sudo sed -i 's/listen-on port 53 { 127.0.0.1; };/listen-on port 53 { any; };/; s/allow-query     { localhost; };/allow-query { localhost; localnets; };/' /etc/named.conf"
      - "sudo firewall-cmd --permanent --add-service=dns y sudo firewall-cmd --reload"
      - "sudo systemctl restart named"
    solucion:
      - "sudo sed -i 's/listen-on port 53 { 127.0.0.1; };/listen-on port 53 { any; };/; s/allow-query     { localhost; };/allow-query { localhost; localnets; };/' /etc/named.conf"
      - sudo named-checkconf
      - sudo firewall-cmd --permanent --add-service=dns
      - sudo firewall-cmd --reload
      - sudo systemctl restart named
    explicacion: >-
      localnets son las redes de las interfaces del servidor. Con esto, cualquier equipo de
      192.168.10.0/24 puede consultar. Comprobá desde pc1 con ssh pc1 dig www.empresa.internal.
