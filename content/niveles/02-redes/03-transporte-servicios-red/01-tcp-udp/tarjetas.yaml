- { id: t1, frente: "Puerto y socket", dorso: "Puerto: el programa dentro del equipo (0 a 65535). Socket: IP + puerto. Una conexión: IP y puerto de origen y de destino." }
- { id: t2, frente: "Puertos efímeros", dorso: "Los que elige el cliente al azar para cada conexión (en Linux, de 32768 a 60999)." }
- { id: t3, frente: "Saludo de tres pasos", dorso: "SYN → SYN-ACK → ACK. Después, datos con confirmaciones. Cierre con FIN de cada lado." }
- { id: t4, frente: "TCP o UDP", dorso: "TCP: confiable, ordenado, retransmite (web, SSH, correo). UDP: liviano, sin confirmaciones (DNS, NTP, voz, QUIC)." }
- { id: t5, frente: "Respuesta al SYN", dorso: "SYN-ACK: abierto. RST: cerrado (refused). Nada: filtrado o sin camino (timed out)." }
- { id: t6, frente: "Estados en ss", dorso: "LISTEN (espera) · ESTAB (abierta) · TIME-WAIT (recién cerrada) · SYN-SENT (nadie contesta)." }
