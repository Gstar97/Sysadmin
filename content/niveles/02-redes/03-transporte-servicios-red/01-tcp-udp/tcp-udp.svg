<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12.5">
  <defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="200" y="26" text-anchor="middle" font-weight="700" fill="currentColor">TCP: primero se abre la conexión</text>
  <text x="640" y="26" text-anchor="middle" font-weight="700" fill="currentColor">UDP: se manda y listo</text>
  <g fill="currentColor" text-anchor="middle" font-weight="700"><text x="70" y="52">Cliente</text><text x="330" y="52">Servidor :443</text><text x="530" y="52">Cliente</text><text x="760" y="52">Servidor DNS :53</text></g>
  <g stroke="currentColor" stroke-width="2"><line x1="70" y1="60" x2="70" y2="380"/><line x1="330" y1="60" x2="330" y2="380"/><line x1="530" y1="60" x2="530" y2="250"/><line x1="760" y1="60" x2="760" y2="250"/></g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#fl)">
    <line x1="70" y1="84" x2="326" y2="108"/>
    <line x1="330" y1="122" x2="74" y2="146"/>
    <line x1="70" y1="160" x2="326" y2="184"/>
    <line x1="70" y1="214" x2="326" y2="238"/>
    <line x1="330" y1="252" x2="74" y2="276"/>
    <line x1="70" y1="316" x2="326" y2="340"/>
    <line x1="330" y1="348" x2="74" y2="372"/>
    <line x1="530" y1="100" x2="756" y2="124"/>
    <line x1="760" y1="150" x2="534" y2="174"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="200" y="90" text-anchor="middle">SYN (¿hablamos?)</text>
    <text x="200" y="128" text-anchor="middle">SYN-ACK (sí, ¿y tú?)</text>
    <text x="200" y="166" text-anchor="middle">ACK (sí): conexión abierta</text>
    <text x="200" y="220" text-anchor="middle">datos (el pedido)</text>
    <text x="200" y="258" text-anchor="middle">datos + ACK (recibido)</text>
    <text x="200" y="322" text-anchor="middle">FIN (terminé)</text>
    <text x="200" y="362" text-anchor="middle">FIN-ACK... y ACK final</text>
    <text x="645" y="106" text-anchor="middle">consulta (¿IP de www...?)</text>
    <text x="645" y="156" text-anchor="middle">respuesta</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="545" y="284">Sin conexión previa ni confirmaciones.</text>
    <text x="545" y="302">Si se pierde, el programa decide:</text>
    <text x="545" y="320">vuelve a preguntar (DNS) o sigue sin</text>
    <text x="545" y="338">ese pedacito (una llamada, un video).</text>
    <text x="545" y="366" font-weight="700">TCP: confiable y ordenado. UDP: liviano y rápido.</text>
  </g>
</svg>
