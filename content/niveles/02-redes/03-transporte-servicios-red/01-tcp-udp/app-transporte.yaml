tipo: emparejar
consigna: ¿Qué transporte usa cada aplicación, y por qué?
pares:
  - { a: "Navegar una página web (HTTPS hasta HTTP/2)", b: "TCP: no puede faltar ni un byte de la página" }
  - { a: "Una consulta DNS común", b: "UDP: una pregunta y una respuesta cortas; si se pierde, se vuelve a preguntar" }
  - { a: "Una llamada por voz IP", b: "UDP: un pedacito de audio que llega tarde ya no sirve" }
  - { a: "Copiar un archivo por SSH (scp)", b: "TCP: el archivo tiene que llegar completo y en orden" }
  - { a: "Sincronizar la hora (NTP)", b: "UDP: mensajes chicos y frecuentes" }
  - { a: "HTTP/3 (QUIC)", b: "UDP, con la confiabilidad resuelta dentro de QUIC" }
explicacion: >-
  La regla: TCP cuando todo tiene que llegar y en orden; UDP cuando importa más la velocidad
  o el mensaje es tan corto que repetirlo es más barato que abrir una conexión.
