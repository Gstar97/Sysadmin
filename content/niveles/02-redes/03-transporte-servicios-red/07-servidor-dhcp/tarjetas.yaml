- { id: t1, frente: "Kea en Rocky y en Ubuntu", dorso: "Rocky: paquete kea, servicio kea-dhcp4 (Kea 2.6). Ubuntu: kea-dhcp4-server (Kea 2.4). Configuración: /etc/kea/kea-dhcp4.conf." }
- { id: t2, frente: "Partes de kea-dhcp4.conf", dorso: "interfaces-config · valid-lifetime · option-data · subnet4 con id, subnet, pools, option-data y reservations." }
- { id: t3, frente: "Opciones DHCP más usadas", dorso: "routers (puerta de enlace) · domain-name-servers · domain-name · ntp-servers." }
- { id: t4, frente: "Revisar y probar Kea", dorso: "kea-dhcp4 -t archivo · systemctl enable --now kea-dhcp4 · ss -ulnp | grep :67 · /var/lib/kea/kea-leases4.csv." }
- { id: t5, frente: "Errores típicos de Kea", dorso: "interfaces-config vacío · falta el id (Kea 2.6) · comas en JSON · opción mal escrita (router en vez de routers)." }
- { id: t6, frente: "dnsmasq", dorso: "DHCP + DNS con caché en un archivo chico: interface, dhcp-range, dhcp-option, dhcp-host. Para redes chicas y laboratorios." }
