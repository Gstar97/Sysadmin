<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">Las partes de /etc/kea/kea-dhcp4.conf</text>
  <rect x="20" y="40" width="470" height="320" rx="10" fill="var(--surface-2, #f1f3f5)" stroke="currentColor"/>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="12">
    <text x="36" y="64">{ "Dhcp4": {</text>
    <text x="52" y="88">"interfaces-config": { "interfaces": [ "enp0s8" ] },</text>
    <text x="52" y="112">"valid-lifetime": 3600,</text>
    <text x="52" y="136">"option-data": [ { "name": "domain-name-servers",</text>
    <text x="68" y="154">"data": "192.168.10.53" } ],</text>
    <text x="52" y="178">"subnet4": [ {</text>
    <text x="68" y="198">"id": 1,</text>
    <text x="68" y="218">"subnet": "192.168.10.0/24",</text>
    <text x="68" y="238">"pools": [ { "pool": "192.168.10.100 - 192.168.10.199" } ],</text>
    <text x="68" y="258">"option-data": [ { "name": "routers",</text>
    <text x="84" y="276">"data": "192.168.10.1" } ],</text>
    <text x="68" y="296">"reservations": [ { "hw-address": "52:54:00:aa:10:30",</text>
    <text x="84" y="314">"ip-address": "192.168.10.30" } ]</text>
    <text x="52" y="334">} ]</text>
    <text x="36" y="350">} }</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="510" y="88"><tspan font-weight="700">En qué placas escucha.</tspan> Vacío = en ninguna.</text>
    <text x="510" y="112"><tspan font-weight="700">Duración del préstamo</tspan>, en segundos.</text>
    <text x="510" y="144"><tspan font-weight="700">Opciones globales:</tspan> valen para todas</text>
    <text x="510" y="160">las subredes (acá, el DNS).</text>
    <text x="510" y="198"><tspan font-weight="700">id:</tspan> obligatorio desde Kea 2.6, único.</text>
    <text x="510" y="218"><tspan font-weight="700">La red</tspan> que atiende esta subred.</text>
    <text x="510" y="238"><tspan font-weight="700">El rango</tspan> que presta (las fijas, afuera).</text>
    <text x="510" y="266"><tspan font-weight="700">Opciones de la subred:</tspan> la puerta de enlace.</text>
    <text x="510" y="304"><tspan font-weight="700">Reservas:</tspan> MAC → IP fija.</text>
    <text x="510" y="320">Mejor fuera del rango dinámico.</text>
    <text x="510" y="350" font-size="11.5">JSON: comas entre elementos, comillas dobles, sin coma al final.</text>
  </g>
</svg>
