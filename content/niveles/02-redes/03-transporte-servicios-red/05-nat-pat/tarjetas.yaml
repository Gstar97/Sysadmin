- { id: t1, frente: "NAT de origen y PAT", dorso: "El router cambia la IP privada de origen por su IP pública. PAT: muchos equipos con una IP, distinguidos por el puerto." }
- { id: t2, frente: "Tabla de NAT", dorso: "Anota adentro (IP:puerto) ⇄ afuera (IP pública:puerto) para cada conexión que sale, y así devuelve las respuestas." }
- { id: t3, frente: "Redirección de puertos (DNAT)", dorso: "Lo que llega a un puerto de la IP pública se manda a un equipo interno. Expone el servicio a todo internet." }
- { id: t4, frente: "CGNAT", dorso: "WAN con 100.64.0.0/10: el proveedor hace otro NAT. Una redirección en tu router no alcanza: IP pública, IPv6 o túnel saliente." }
- { id: t5, frente: "NAT no es un firewall", dorso: "No filtra lo que sale ni protege lo publicado, y en IPv6 no existe. La protección la da el firewall con estado." }
