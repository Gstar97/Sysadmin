tipo: emparejar
consigna: Uní cada tipo de traducción con lo que hace.
pares:
  - { a: "NAT de origen (SNAT, enmascaramiento)", b: "Cambia la IP de origen de lo que sale por la IP pública del router" }
  - { a: "PAT (NAT con sobrecarga)", b: "Muchos equipos detrás de una sola IP pública, distinguidos por el puerto" }
  - { a: "NAT de destino (DNAT, redirección de puertos)", b: "Lo que llega a un puerto de la IP pública se manda a un equipo de adentro" }
  - { a: "CGNAT", b: "El proveedor comparte una IP pública entre muchos clientes, con un NAT propio" }
  - { a: "NAT estático 1 a 1", b: "Una IP pública fija para un único equipo interno, en los dos sentidos" }
explicacion: >-
  En una oficina o una casa, lo normal es PAT para la salida y, si hace falta publicar un
  servicio, una redirección de puertos.
