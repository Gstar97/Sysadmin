- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Por qué hace falta NAT para que una PC con 192.168.1.10 navegue por internet?
  opciones:
    - { texto: "Porque las direcciones privadas no se enrutan en internet: el router las cambia por su IP pública", correcta: true, explicacion: "La respuesta vuelve a la IP pública y el router se la entrega a la PC." }
    - { texto: "Porque NAT acelera la conexión", explicacion: "NAT no acelera nada." }
    - { texto: "Porque NAT cifra el tráfico", explicacion: "NAT no cifra." }
    - { texto: "No hace falta", explicacion: "Sin NAT, la respuesta no sabría volver." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Qué permite PAT?
  opciones:
    - { texto: "Que muchos equipos salgan a internet con una sola IP pública, distinguidos por el puerto", correcta: true, explicacion: "Cada conexión se anota con su puerto en la tabla de traducciones." }
    - { texto: "Que un equipo tenga varias IP públicas", explicacion: "Es al revés." }
    - { texto: "Que se pueda entrar a cualquier equipo desde internet", explicacion: "Para entrar hace falta una redirección." }
    - { texto: "Elegir el puerto del servidor de destino", explicacion: "El destino no cambia." }
- id: p03
  tipo: opcion_multiple
  dificultad: 1
  enunciado: Querés que el servidor web interno 192.168.1.20 se vea desde internet. ¿Qué configurás en el router?
  opciones:
    - { texto: "Una redirección de puertos: TCP 443 de la IP pública hacia 192.168.1.20:443", correcta: true, explicacion: "Es NAT de destino (DNAT)." }
    - { texto: "Nada: con NAT ya se ve", explicacion: "Sin redirección, el router descarta lo que llega sin haberse pedido." }
    - { texto: "Una reserva de DHCP", explicacion: "Ayuda a que el servidor no cambie de IP, pero no lo publica." }
    - { texto: "Un registro MX", explicacion: "MX es para correo." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Dos PC de la misma red abren a la vez una conexión al mismo sitio, las dos desde el puerto 50123. ¿Qué hace el router con PAT?
  opciones:
    - { texto: "Le asigna a una de ellas otro puerto público, para distinguir las dos conexiones", correcta: true, explicacion: "La tabla de traducciones guarda cuál es cuál." }
    - { texto: "Rechaza la segunda conexión", explicacion: "PAT resuelve justo ese caso." }
    - { texto: "Las mezcla y una recibe la respuesta de la otra", explicacion: "La tabla lo evita." }
    - { texto: "Les da a las dos IP públicas distintas", explicacion: "Con PAT hay una sola IP pública." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Configuraste bien la redirección del puerto 443 en el router de la sucursal, pero desde internet no conecta. La WAN del router tiene 100.80.12.5. ¿Qué pasa?
  opciones:
    - { texto: "La sucursal está detrás de CGNAT: la conexión llega al NAT del proveedor, que no tiene ninguna regla hacia vos", correcta: true, explicacion: "100.64.0.0/10 es el rango de CGNAT. Hace falta una IP pública, IPv6 o un túnel saliente." }
    - { texto: "Falta reiniciar el router", explicacion: "No cambiaría nada." }
    - { texto: "El puerto 443 está prohibido", explicacion: "No hay nada especial en el 443." }
    - { texto: "Hay que poner la redirección en el puerto 80", explicacion: "El problema es el NAT del proveedor." }
- id: p06
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Te piden abrir el puerto 3389 (RDP) hacia internet para que un técnico externo entre a un servidor. ¿Qué proponés?
  opciones:
    - { texto: "Darle acceso por VPN y no exponer RDP con una redirección", correcta: true, explicacion: "RDP abierto a internet es atacado constantemente." }
    - { texto: "Abrirlo sin más", explicacion: "Es uno de los riesgos más explotados." }
    - { texto: "Abrirlo en el puerto 3390 para esconderlo", explicacion: "Cambiar el puerto no lo protege: los escaneos lo encuentran igual." }
    - { texto: "Abrir todos los puertos hacia ese servidor", explicacion: "Es mucho peor." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Por qué una conexión que alguien inicia desde internet hacia tu IP pública no llega a ningún equipo interno, si no configuraste nada?
  opciones:
    - { texto: "Porque no hay ninguna fila en la tabla de NAT para esa conexión, y el router no sabe a qué equipo mandarla", correcta: true, explicacion: "Solo las respuestas a conexiones que salieron tienen fila." }
    - { texto: "Porque internet no permite conexiones entrantes", explicacion: "Las permite si hay a dónde mandarlas." }
    - { texto: "Porque el DNS no está configurado", explicacion: "No tiene relación." }
    - { texto: "Porque NAT cifra el tráfico entrante", explicacion: "NAT no cifra." }
- id: p08
  tipo: respuesta_multiple
  enunciado: Un servicio publicado con redirección de puertos no responde desde internet. ¿Qué revisás? (Marcá todas las correctas.)
  opciones:
    - { texto: "Que el servicio escuche en el servidor (ss -tlnp)", correcta: true, explicacion: "Si no escucha, no hay nada que alcanzar." }
    - { texto: "Que el firewall del propio servidor lo permita", correcta: true, explicacion: "La redirección del router no abre el firewall del servidor." }
    - { texto: "Que la redirección apunte a la IP y el puerto correctos", correcta: true, explicacion: "Un error de tipeo es muy común." }
    - { texto: "Que la WAN del router no sea de CGNAT", correcta: true, explicacion: "Con CGNAT la redirección no alcanza." }
    - { texto: "Que el servidor tenga un registro MX", explicacion: "No interviene." }
- id: p09
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Un colega dice que "con NAT no hace falta firewall". ¿Qué le respondés?
  opciones:
    - { texto: "NAT no filtra lo que sale ni protege lo que publicás, y en IPv6 no existe: hace falta un firewall con reglas explícitas", correcta: true, explicacion: "Bloquear lo no pedido es un efecto secundario, no una política de seguridad." }
    - { texto: "Tiene razón", explicacion: "NAT no es un control de seguridad." }
    - { texto: "Tiene razón solo en IPv6", explicacion: "En IPv6 justamente no hay NAT." }
    - { texto: "NAT es un tipo de firewall de nueva generación", explicacion: "No lo es." }
