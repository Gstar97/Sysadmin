tipo: emparejar
consigna: Une cada puerto con su protocolo.
pares:
  - { a: "22", b: "SSH" }
  - { a: "53", b: "DNS" }
  - { a: "67/68", b: "DHCP" }
  - { a: "123", b: "NTP" }
  - { a: "443", b: "HTTPS" }
  - { a: "445", b: "SMB (carpetas compartidas de Windows)" }
  - { a: "3389", b: "Escritorio remoto de Windows (RDP)" }
  - { a: "389", b: "LDAP (directorio de usuarios)" }
explicacion: >-
  Vale la pena saberlos de memoria: aparecen en las reglas de firewall, en las salidas de ss y
  en cualquier diagnóstico.
