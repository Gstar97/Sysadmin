tipo: emparejar
consigna: Une cada protocolo inseguro con su reemplazo seguro.
pares:
  - { a: "Telnet (23)", b: "SSH (22)" }
  - { a: "FTP (21)", b: "SFTP (22) o FTPS" }
  - { a: "HTTP (80)", b: "HTTPS (443)" }
  - { a: "IMAP (143)", b: "IMAPS (993)" }
  - { a: "LDAP sin cifrar (389)", b: "LDAPS (636) o LDAP con StartTLS" }
  - { a: "SNMP v1/v2c", b: "SNMP v3 (con autenticación y cifrado)" }
explicacion: >-
  Los inseguros mandan todo, incluidas las contraseñas, en texto plano: cualquiera que capture
  el tráfico en el camino puede leerlas.
