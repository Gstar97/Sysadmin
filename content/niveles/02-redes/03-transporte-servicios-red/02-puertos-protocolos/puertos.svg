<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">Los puertos que vas a ver todos los días</text>
  <g stroke="currentColor">
    <rect x="20" y="40" width="200" height="190" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="232" y="40" width="200" height="190" rx="8" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="444" y="40" width="200" height="190" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="656" y="40" width="184" height="190" rx="8" fill="var(--accent-soft, #d9efe9)"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="62" font-weight="700">Acceso y web</text>
    <g font-family="ui-monospace, monospace" font-size="12.5"><text x="34" y="86">22   SSH, SFTP</text><text x="34" y="106">80   HTTP</text><text x="34" y="126">443  HTTPS</text><text x="34" y="146">3389 RDP</text><text x="34" y="166">8080 HTTP alternativo</text></g>
    <text x="246" y="62" font-weight="700">Infraestructura</text>
    <g font-family="ui-monospace, monospace" font-size="12.5"><text x="246" y="86">53   DNS (UDP y TCP)</text><text x="246" y="106">67/68 DHCP (UDP)</text><text x="246" y="126">123  NTP (UDP)</text><text x="246" y="146">161  SNMP (UDP)</text><text x="246" y="166">514  syslog (UDP)</text><text x="246" y="186">389/636 LDAP/LDAPS</text></g>
    <text x="458" y="62" font-weight="700">Correo y archivos</text>
    <g font-family="ui-monospace, monospace" font-size="12.5"><text x="458" y="86">25   SMTP (entre servidores)</text><text x="458" y="106">587  SMTP de usuarios</text><text x="458" y="126">993  IMAPS</text><text x="458" y="146">445  SMB (carpetas)</text><text x="458" y="166">2049 NFS</text></g>
    <text x="670" y="62" font-weight="700">Bases de datos</text>
    <g font-family="ui-monospace, monospace" font-size="12.5"><text x="670" y="86">3306 MySQL/MariaDB</text><text x="670" y="106">5432 PostgreSQL</text><text x="670" y="126">1433 SQL Server</text><text x="670" y="146">6379 Redis</text><text x="670" y="166">27017 MongoDB</text></g>
  </g>
  <text x="20" y="262" font-weight="700" fill="currentColor">Inseguros y su reemplazo</text>
  <g fill="currentColor" font-size="12.5">
    <text x="20" y="286">Telnet (23) → SSH (22)       FTP (21) → SFTP (22) o FTPS       HTTP (80) → HTTPS (443)</text>
    <text x="20" y="308">POP3 (110) e IMAP (143) → POP3S (995) e IMAPS (993)       LDAP (389) → LDAPS (636) o LDAP con StartTLS</text>
    <text x="20" y="338" font-size="11.5">Rangos: 0 a 1023 conocidos (en Linux, solo root puede escuchar ahí) · 1024 a 49151 registrados · 49152 a 65535 dinámicos.</text>
  </g>
</svg>
