tipo: ordenar
consigna: Ordena los mensajes con los que un equipo consigue su dirección por DHCP.
pasos:
  - "Discover: el cliente pregunta por broadcast si hay algún servidor"
  - "Offer: el servidor ofrece una dirección y las opciones"
  - "Request: el cliente pide la dirección que eligió"
  - "Ack: el servidor confirma y registra el préstamo"
explicacion: Discover, Offer, Request, Ack. Las iniciales forman DORA.
