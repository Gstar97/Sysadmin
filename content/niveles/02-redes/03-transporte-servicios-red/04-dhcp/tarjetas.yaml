- { id: t1, frente: "DORA", dorso: "Discover (broadcast, desde 0.0.0.0) → Offer → Request (broadcast) → Ack. Servidor UDP 67, cliente UDP 68." }
- { id: t2, frente: "Ámbito, rango, opciones", dorso: "Ámbito: la red. Rango: las direcciones que se prestan. Opciones: router (puerta de enlace), DNS, dominio." }
- { id: t3, frente: "Reserva", dorso: "IP fija para una MAC concreta, entregada por DHCP. Mejor que configurar a mano." }
- { id: t4, frente: "Préstamo y renovación", dorso: "A la mitad del préstamo, renueva con el mismo servidor; a los 7/8, con cualquiera; si vence, se queda sin IP." }
- { id: t5, frente: "Relay de DHCP", dorso: "El Discover es broadcast y no cruza routers. El relay (ip helper-address) lo reenvía al servidor por unicast." }
- { id: t6, frente: "Equipo sin IP", dorso: "Windows: 169.254 (APIPA). Linux: sin IPv4. ¿Uno o toda la red? Toda la red: servidor, rango agotado o relay." }
