<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="system-ui, sans-serif" font-size="12.5">
  <defs><marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="20" y="26" font-weight="700" fill="currentColor">El relay de DHCP: un solo servidor para muchas redes</text>
  <g stroke="currentColor">
    <rect x="20" y="50" width="220" height="150" rx="10" fill="var(--info-soft, #e0e9fd)" stroke-dasharray="6 4"/>
    <rect x="320" y="90" width="150" height="70" rx="8" fill="var(--surface, #fff)"/>
    <rect x="560" y="50" width="280" height="150" rx="10" fill="var(--ok-soft, #dcf3e6)" stroke-dasharray="6 4"/>
    <rect x="50" y="110" width="140" height="44" rx="6" fill="var(--surface, #fff)"/>
    <rect x="630" y="104" width="160" height="56" rx="6" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="130" y="72" font-weight="700">Ventas 192.168.20.0/24</text>
    <text x="120" y="137">PC nueva</text>
    <text x="395" y="118" font-weight="700">Router</text><text x="395" y="136" font-size="11.5">ip helper-address</text><text x="395" y="151" font-size="11.5">192.168.10.5</text>
    <text x="700" y="72" font-weight="700">Servidores 192.168.10.0/24</text>
    <text x="710" y="128" font-weight="700">Servidor DHCP</text><text x="710" y="146" font-size="11.5">192.168.10.5</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#fr)"><line x1="190" y1="125" x2="316" y2="112"/><line x1="470" y1="112" x2="626" y2="125"/><line x1="626" y1="142" x2="474" y2="140"/><line x1="316" y1="140" x2="194" y2="144"/></g>
  <g fill="currentColor" font-size="11.5">
    <text x="200" y="100">1. Discover por broadcast</text>
    <text x="480" y="100">2. El router lo reenvía, unicast</text>
    <text x="480" y="174">3. Oferta para la red de Ventas</text>
    <text x="150" y="182">4. Llega a la PC</text>
  </g>
  <text x="20" y="236" font-size="12" fill="currentColor">Los routers no reenvían broadcast. El relay escucha el Discover en la red de Ventas, lo manda al servidor y le dice de qué red</text>
  <text x="20" y="254" font-size="12" fill="currentColor">viene (su propia IP en esa red), para que el servidor elija el rango correcto.</text>
</svg>
