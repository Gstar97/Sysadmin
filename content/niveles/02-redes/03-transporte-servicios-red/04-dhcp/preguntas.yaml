- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Qué significan las letras de DORA?
  opciones:
    - { texto: "Discover, Offer, Request, Ack", correcta: true, explicacion: "Los cuatro mensajes con los que un equipo obtiene su dirección." }
    - { texto: "Domain, Organization, Router, Address", explicacion: "No son los mensajes de DHCP." }
    - { texto: "DNS, Offer, Route, ARP", explicacion: "No." }
    - { texto: "Discover, Open, Reply, Accept", explicacion: "Los nombres son Offer, Request y Ack." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: Una PC con Windows tiene la IP 169.254.12.7. ¿Qué pasó?
  opciones:
    - { texto: "Pidió una dirección por DHCP y nadie le contestó", correcta: true, explicacion: "Se puso sola una dirección APIPA." }
    - { texto: "El DHCP le dio una IP pública", explicacion: "169.254 no es pública ni la entrega un DHCP." }
    - { texto: "Tiene una IP duplicada", explicacion: "Es otro problema." }
    - { texto: "Está funcionando normalmente", explicacion: "Con 169.254 no sale de su red." }
- id: p03
  tipo: opcion_multiple
  dificultad: 1
  enunciado: ¿Cómo se asegura que la impresora reciba siempre la misma IP por DHCP?
  opciones:
    - { texto: "Con una reserva para la MAC de la impresora", correcta: true, explicacion: "El servidor le da siempre la misma dirección a esa MAC." }
    - { texto: "Con un préstamo muy largo", explicacion: "Ayuda, pero no lo garantiza." }
    - { texto: "Apagando el DHCP", explicacion: "Afectaría a todos." }
    - { texto: "Con un registro MX", explicacion: "MX es de DNS y es para correo." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Con qué direcciones de origen y destino sale el primer mensaje (Discover)?
  opciones:
    - { texto: "Origen 0.0.0.0 y destino 255.255.255.255", correcta: true, explicacion: "El equipo no tiene IP ni sabe quién es el servidor." }
    - { texto: "Origen su IP y destino el servidor DHCP", explicacion: "Todavía no tiene IP ni conoce al servidor." }
    - { texto: "Origen 169.254.x.x y destino el router", explicacion: "No." }
    - { texto: "Origen la MAC y destino el DNS", explicacion: "Las MAC están en la trama; en IP van 0.0.0.0 y 255.255.255.255." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Los equipos reciben IP por DHCP y se ven entre sí, pero ninguno sale de su red. ¿Qué opción del ámbito falta probablemente?
  opciones:
    - { texto: "La puerta de enlace (opción router)", correcta: true, explicacion: "Sin puerta de enlace no hay ruta por defecto." }
    - { texto: "El tiempo de préstamo", explicacion: "Siempre tiene un valor por defecto." }
    - { texto: "El dominio de búsqueda", explicacion: "Sin él siguen saliendo de la red." }
    - { texto: "La reserva", explicacion: "Las reservas no afectan a la salida." }
- id: p06
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Por qué hace falta un relay de DHCP cuando el servidor está en otra red?
  opciones:
    - { texto: "Porque el Discover es un broadcast y los routers no reenvían broadcast", correcta: true, explicacion: "El relay lo escucha y se lo manda al servidor por unicast." }
    - { texto: "Porque DHCP no funciona entre redes", explicacion: "Funciona con un relay." }
    - { texto: "Para cifrar los mensajes", explicacion: "El relay no cifra." }
    - { texto: "Para que el servidor tenga más direcciones", explicacion: "No cambia el rango." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Todas las PC de la red de Ventas tienen 169.254, y las de otras redes andan bien con el mismo servidor DHCP. ¿Qué sospechas primero?
  opciones:
    - { texto: "El relay de la interfaz de Ventas en el router", correcta: true, explicacion: "Lo común a esa red y no a las demás es el camino hasta el servidor." }
    - { texto: "El servidor DHCP está apagado", explicacion: "Las otras redes reciben direcciones de ese mismo servidor." }
    - { texto: "Los cables de cada PC", explicacion: "Fallarían de a una, no todas a la vez." }
    - { texto: "El DNS", explicacion: "Sin IP, el DNS ni siquiera interviene." }
- id: p08
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Varios usuarios reciben direcciones 192.168.0.x cuando la red de la empresa es 10.20.0.0/16, y no llegan a nada. ¿Qué es lo más probable?
  opciones:
    - { texto: "Alguien conectó un router hogareño y su DHCP está repartiendo direcciones (DHCP intruso)", correcta: true, explicacion: "Se busca el equipo; los switches administrables lo previenen con DHCP snooping." }
    - { texto: "El DHCP de la empresa se configuró solo", explicacion: "No cambia de rango por su cuenta." }
    - { texto: "Es APIPA", explicacion: "APIPA es 169.254." }
    - { texto: "Es CGNAT", explicacion: "CGNAT es 100.64.0.0/10 y lo hace el proveedor." }
- id: p09
  tipo: opcion_multiple
  dificultad: 3
  enunciado: En el Wi-Fi de invitados de un shopping, el rango se agota cada tarde aunque nunca hay más de 150 personas conectadas a la vez. El rango es de 200 direcciones y el préstamo dura 8 días. ¿Qué cambias?
  opciones:
    - { texto: "Bajar mucho el tiempo de préstamo (por ejemplo, a una hora)", correcta: true, explicacion: "Los préstamos de quienes ya se fueron siguen ocupando direcciones por días." }
    - { texto: "Agregar reservas para todos", explicacion: "Los invitados cambian todo el tiempo." }
    - { texto: "Subir el préstamo a 30 días", explicacion: "Empeoraría el problema." }
    - { texto: "Quitar la puerta de enlace", explicacion: "Los invitados no saldrían a internet." }
