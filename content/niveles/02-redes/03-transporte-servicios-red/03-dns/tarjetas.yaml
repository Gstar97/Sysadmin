- { id: t1, frente: "Resolvedor y autoritativo", dorso: "Resolvedor: recibe las preguntas de los equipos, recorre el árbol y guarda en caché. Autoritativo: tiene los datos oficiales de una zona." }
- { id: t2, frente: "Recursiva e iterativa", dorso: "Recursiva: la PC al resolvedor (tráeme la respuesta final). Iterativa: el resolvedor a la raíz, TLD y autoritativo (decime lo que sepas)." }
- { id: t3, frente: "TTL", dorso: "Cuántos segundos se guarda una respuesta en caché. Los cambios tardan eso en verse; bajalo antes de migrar." }
- { id: t4, frente: "Registros principales", dorso: "A (IPv4) · AAAA (IPv6) · CNAME (alias) · MX (correo) · TXT · NS · SOA · PTR (inversa) · SRV (servicio)." }
- { id: t5, frente: "status de dig", dorso: "NOERROR (respondió) · NXDOMAIN (no existe) · SERVFAIL (no pudo resolver) · REFUSED (no te responde)." }
- { id: t6, frente: "dig útiles", dorso: "dig nombre · dig nombre MX +short · dig @servidor nombre · dig -x IP · +noall +answer para ver solo la respuesta." }
- { id: t7, frente: "Reglas de CNAME y MX", dorso: "Un nombre con CNAME no tiene otros registros. El MX apunta a un nombre con registro A, nunca a una IP ni a un CNAME." }
