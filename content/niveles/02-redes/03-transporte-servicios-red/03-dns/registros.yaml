tipo: emparejar
consigna: Une cada tipo de registro con lo que guarda.
pares:
  - { a: "A", b: "La dirección IPv4 de un nombre" }
  - { a: "AAAA", b: "La dirección IPv6 de un nombre" }
  - { a: "CNAME", b: "Un alias: este nombre es otro nombre" }
  - { a: "MX", b: "El servidor que recibe el correo del dominio, con su prioridad" }
  - { a: "TXT", b: "Texto libre: SPF, verificaciones de dominio, DKIM" }
  - { a: "NS", b: "Los servidores autoritativos de la zona" }
  - { a: "SOA", b: "Los datos de la zona: servidor primario, responsable, serial y tiempos" }
  - { a: "PTR", b: "El nombre de una IP (resolución inversa)" }
  - { a: "SRV", b: "Dónde está un servicio: prioridad, peso, puerto y servidor" }
explicacion: >-
  Los que más vas a tocar: A, AAAA, CNAME y MX. Los TXT crecieron mucho con el correo
  (SPF, DKIM, DMARC) y las verificaciones de servicios en la nube.
