<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">El DNS es un árbol: cada nivel sabe quién maneja el nivel de abajo</text>
  <g stroke="currentColor">
    <rect x="370" y="44" width="120" height="40" rx="20" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="120" y="124" width="110" height="40" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="375" y="124" width="110" height="40" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="630" y="124" width="110" height="40" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="300" y="204" width="130" height="40" rx="8" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="470" y="204" width="130" height="40" rx="8" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="300" y="276" width="130" height="40" rx="8" fill="var(--accent-soft, #d9efe9)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="430" y="69" font-weight="700">. (raíz)</text>
    <text x="175" y="149" font-weight="700">.org</text><text x="430" y="149" font-weight="700">.com</text><text x="685" y="149" font-weight="700">.ar, .mx, .es...</text>
    <text x="365" y="229" font-weight="700">empresa.com</text><text x="535" y="229" font-weight="700">ejemplo.com</text>
    <text x="365" y="301" font-weight="700">www.empresa.com</text>
  </g>
  <g stroke="currentColor"><line x1="430" y1="84" x2="175" y2="124"/><line x1="430" y1="84" x2="430" y2="124"/><line x1="430" y1="84" x2="685" y2="124"/><line x1="430" y1="164" x2="365" y2="204"/><line x1="430" y1="164" x2="535" y2="204"/><line x1="365" y1="244" x2="365" y2="276"/></g>
  <g fill="currentColor" font-size="11.5">
    <text x="510" y="62">13 nombres de servidores raíz (cientos de equipos</text><text x="510" y="78">en todo el mundo): saben quién maneja cada TLD</text>
    <text x="20" y="190">Dominios de primer nivel (TLD):</text><text x="20" y="206">genéricos y de país</text>
    <text x="620" y="222">Cada empresa tiene sus servidores</text><text x="620" y="238">autoritativos para su dominio</text>
    <text x="450" y="298">El nombre completo se lee de derecha a izquierda:</text><text x="450" y="314">raíz → com → empresa → www</text>
  </g>
</svg>
