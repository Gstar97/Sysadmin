tipo: emparejar
consigna: Uní cada resultado con lo que te dice sobre dónde buscar.
pares:
  - { a: "La placa dice NO-CARRIER en ip link", b: "Capa 1: el cable, el puerto del switch o la placa" }
  - { a: "No responde el ping a la puerta de enlace y ip neigh la muestra FAILED", b: "Capa 2: la VLAN del puerto, el switch o una IP mal puesta" }
  - { a: "Responde el ping a la puerta de enlace, pero no a ninguna IP de afuera", b: "Capa 3: rutas, la puerta de enlace o el NAT" }
  - { a: "El ping a la IP del servidor responde, pero curl dice Connection refused", b: "Capa 4: nadie escucha en ese puerto" }
  - { a: "curl a la IP anda, pero con el nombre dice Could not resolve host", b: "DNS: la resolución de nombres" }
  - { a: "Todo responde, pero el programa muestra un error de usuario o contraseña", b: "La aplicación: la red ya hizo su parte" }
explicacion: >-
  Cada prueba que pasa descarta todas las capas de abajo. Por eso conviene empezar por la mitad:
  un ping a la IP del servidor divide el problema en dos de un solo golpe.
