- { id: t1, frente: "Las cinco preguntas para definir un problema", dorso: "¿Qué exactamente? ¿A quién le pasa? ¿Hacia dónde? ¿Desde cuándo (siempre o a veces)? ¿Qué cambió?" }
- { id: t2, frente: "El ciclo del diagnóstico", dorso: "Definir → evidencia → una hipótesis → probar sin cambiar → un cambio y verificar → documentar." }
- { id: t3, frente: "Recorrer por la mitad", dorso: "Ping a la IP del destino: si responde, capas 1 a 3 bien y seguís hacia arriba (puerto, DNS, aplicación); si no, hacia abajo." }
- { id: t4, frente: "Ping que no responde", dorso: "No siempre es falla: muchos firewalls bloquean ICMP. Probá el servicio (curl, nc) antes de decidir." }
- { id: t5, frente: "Comparar con uno que anda", dorso: "Dos equipos de la misma red: IP, máscara, puerta de enlace, DNS y VLAN del puerto. La diferencia suele ser la causa." }
- { id: t6, frente: "Causa raíz, arreglo y parche", dorso: "Causa raíz: lo que originó la falla. Arreglo: lo que la corrige. Parche: lo que la esquiva (y deja la causa)." }
