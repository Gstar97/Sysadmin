<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="mr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">El ciclo del diagnóstico</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="14" y="40" width="128" height="86" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="156" y="40" width="128" height="86" rx="10" fill="var(--surface, #fff)"/>
    <rect x="298" y="40" width="128" height="86" rx="10" fill="var(--surface, #fff)"/>
    <rect x="440" y="40" width="128" height="86" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="582" y="40" width="128" height="86" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="724" y="40" width="122" height="86" rx="10" fill="var(--surface, #fff)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.8" marker-end="url(#mr-a)">
    <line x1="142" y1="83" x2="154" y2="83"/><line x1="284" y1="83" x2="296" y2="83"/><line x1="426" y1="83" x2="438" y2="83"/><line x1="568" y1="83" x2="580" y2="83"/><line x1="710" y1="83" x2="722" y2="83"/>
  </g>
  <path d="M504 126 C504 160 362 160 362 128" fill="none" stroke="var(--warn, #a16207)" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mr-a)"/>
  <text x="433" y="166" text-anchor="middle" font-size="11.5" fill="var(--warn, #a16207)">no era eso: deshacer y otra hipótesis</text>
  <g fill="currentColor">
    <text x="24" y="62" font-weight="700">1. Definir</text>
    <text x="24" y="80" font-size="11.5">¿qué, a quién,</text>
    <text x="24" y="95" font-size="11.5">desde cuándo,</text>
    <text x="24" y="110" font-size="11.5">qué cambió?</text>
    <text x="166" y="62" font-weight="700">2. Evidencia</text>
    <text x="166" y="80" font-size="11.5">reproducirlo,</text>
    <text x="166" y="95" font-size="11.5">comparar con uno</text>
    <text x="166" y="110" font-size="11.5">que anda, registros</text>
    <text x="308" y="62" font-weight="700">3. Hipótesis</text>
    <text x="308" y="80" font-size="11.5">una sola, la más</text>
    <text x="308" y="95" font-size="11.5">probable o la más</text>
    <text x="308" y="110" font-size="11.5">fácil de descartar</text>
    <text x="450" y="62" font-weight="700">4. Probar</text>
    <text x="450" y="80" font-size="11.5">una prueba que</text>
    <text x="450" y="95" font-size="11.5">diga sí o no,</text>
    <text x="450" y="110" font-size="11.5">sin cambiar nada</text>
    <text x="592" y="62" font-weight="700">5. Arreglar</text>
    <text x="592" y="80" font-size="11.5">un cambio a la vez</text>
    <text x="592" y="95" font-size="11.5">y verificar con el</text>
    <text x="592" y="110" font-size="11.5">usuario que reportó</text>
    <text x="734" y="62" font-weight="700">6. Documentar</text>
    <text x="734" y="80" font-size="11.5">causa, arreglo</text>
    <text x="734" y="95" font-size="11.5">y cómo evitar</text>
    <text x="734" y="110" font-size="11.5">que se repita</text>
  </g>
  <text x="430" y="200" text-anchor="middle" font-weight="700" fill="currentColor">Tres formas de recorrer las capas</text>
  <g stroke="currentColor" stroke-width="1.2">
    <g fill="var(--surface-2, #eef1f5)">
      <rect x="40" y="216" width="170" height="24"/><rect x="40" y="240" width="170" height="24"/><rect x="40" y="264" width="170" height="24"/><rect x="40" y="288" width="170" height="24"/><rect x="40" y="312" width="170" height="24"/>
      <rect x="345" y="216" width="170" height="24"/><rect x="345" y="240" width="170" height="24"/><rect x="345" y="264" width="170" height="24"/><rect x="345" y="288" width="170" height="24"/><rect x="345" y="312" width="170" height="24"/>
      <rect x="650" y="216" width="170" height="24"/><rect x="650" y="240" width="170" height="24"/><rect x="650" y="288" width="170" height="24"/><rect x="650" y="312" width="170" height="24"/>
    </g>
    <rect x="650" y="264" width="170" height="24" fill="var(--accent-soft, #d5f0ec)"/>
  </g>
  <g font-size="11" fill="currentColor">
    <text x="48" y="232">7 · dig, curl -v, el programa</text>
    <text x="48" y="256">4 · ss, nc -zv, curl</text>
    <text x="48" y="280">3 · ip a, ip route, ping</text>
    <text x="48" y="304">2 · ip neigh, arping</text>
    <text x="48" y="328">1 · ip link, ethtool, luces</text>
    <text x="353" y="232">7 · dig, curl -v, el programa</text>
    <text x="353" y="256">4 · ss, nc -zv, curl</text>
    <text x="353" y="280">3 · ip a, ip route, ping</text>
    <text x="353" y="304">2 · ip neigh, arping</text>
    <text x="353" y="328">1 · ip link, ethtool, luces</text>
    <text x="658" y="232">7 · dig, curl -v, el programa</text>
    <text x="658" y="256">4 · ss, nc -zv, curl</text>
    <text x="658" y="280" font-weight="700">3 · ping a la IP: ¿llega?</text>
    <text x="658" y="304">2 · ip neigh, arping</text>
    <text x="658" y="328">1 · ip link, ethtool, luces</text>
  </g>
  <g stroke="var(--accent, #0f766e)" stroke-width="2.2" marker-end="url(#mr-a)">
    <line x1="222" y1="330" x2="222" y2="222"/>
    <line x1="527" y1="222" x2="527" y2="330"/>
    <line x1="832" y1="276" x2="832" y2="222"/>
    <line x1="832" y1="276" x2="832" y2="330"/>
  </g>
  <g font-size="11.5" fill="currentColor" font-weight="700">
    <text x="232" y="262">De abajo</text><text x="232" y="277">hacia arriba</text>
    <text x="537" y="262">De arriba</text><text x="537" y="277">hacia abajo</text>
  </g>
  <g font-size="10.5" fill="var(--muted, #5b6878)">
    <text x="232" y="294">si sospechás</text><text x="232" y="307">del cable</text>
    <text x="537" y="294">si falla un solo</text><text x="537" y="307">programa</text>
    <text x="650" y="352">Por la mitad: el ping dice para qué lado seguir</text>
  </g>
</svg>
