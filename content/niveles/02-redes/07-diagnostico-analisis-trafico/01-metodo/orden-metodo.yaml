tipo: ordenar
consigna: Ordená los pasos para atender el reclamo "no anda el sistema de pedidos".
pasos:
  - "Preguntar qué exactamente no anda, a quién le pasa, desde cuándo y si cambió algo"
  - "Reproducirlo desde un equipo afectado y compararlo con uno que funciona"
  - "Elegir una hipótesis: la más probable o la más fácil de descartar"
  - "Hacer una prueba que la confirme o la descarte, sin cambiar nada todavía"
  - "Hacer un solo cambio y verificar con la persona que reportó el problema"
  - "Documentar la causa, el arreglo y cómo evitar que se repita"
explicacion: >-
  El error más caro es saltar al paso 5: cambiar cosas "a ver si anda". Si cambiás tres cosas y
  se arregla, no sabés cuál fue, y si se rompe otra cosa, tampoco sabés cuál deshacer.
