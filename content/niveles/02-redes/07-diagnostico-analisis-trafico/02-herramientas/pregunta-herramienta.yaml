tipo: emparejar
consigna: Uní cada pregunta con la herramienta que la responde más rápido.
pares:
  - { a: "¿Responde ese equipo y cuánto tarda?", b: "ping -c 4 IP" }
  - { a: "¿En qué tramo del camino se pierden paquetes?", b: "mtr -rwc 100 destino" }
  - { a: "¿Por qué puerta de enlace sale el tráfico hacia esa IP?", b: "ip route get IP" }
  - { a: "¿Qué programa está escuchando en el puerto 443 de este servidor?", b: "sudo ss -tlnp" }
  - { a: "¿A qué IP resuelve este nombre, y quién responde?", b: "dig nombre" }
  - { a: "¿Está abierto el puerto 5432 de la base de datos?", b: "nc -zv IP 5432" }
  - { a: "¿Se va el tiempo en la red o en el servidor web?", b: "curl -w con los tiempos de cada etapa" }
explicacion: >-
  Cada herramienta mira una capa o un tramo distinto. Juntas, en el orden del método, te dicen
  dónde está el problema sin adivinar.
