<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Cómo leer un informe de mtr: mirá la última fila</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="14" y="40" width="410" height="200" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="436" y="40" width="410" height="200" rx="10" fill="var(--bad-soft, #fde2e2)"/>
  </g>
  <g fill="currentColor">
    <text x="28" y="62" font-weight="700">A. Pérdida en un salto que no sigue</text>
    <text x="450" y="62" font-weight="700">B. Pérdida que sigue hasta el destino</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">
    <text x="28" y="88">salto</text><text x="84" y="88">IP</text><text x="278" y="88" text-anchor="end">Loss%</text><text x="338" y="88" text-anchor="end">Avg</text>
    <text x="42" y="108">1.</text><text x="84" y="108">192.168.10.1</text><text x="278" y="108" text-anchor="end">0.0%</text><text x="338" y="108" text-anchor="end">0.5</text>
    <text x="42" y="128">2.</text><text x="84" y="128">203.0.113.1</text><text x="278" y="128" text-anchor="end">0.0%</text><text x="338" y="128" text-anchor="end">4.1</text>
    <text x="42" y="148" font-weight="700">3.</text><text x="84" y="148" font-weight="700">198.51.100.17</text><text x="278" y="148" text-anchor="end" font-weight="700">60.0%</text><text x="338" y="148" text-anchor="end" font-weight="700">6.8</text>
    <text x="42" y="168">4.</text><text x="84" y="168">198.51.100.94</text><text x="278" y="168" text-anchor="end">0.0%</text><text x="338" y="168" text-anchor="end">9.2</text>
    <text x="42" y="188" font-weight="700">5.</text><text x="84" y="188" font-weight="700">destino</text><text x="278" y="188" text-anchor="end" font-weight="700">0.0%</text><text x="338" y="188" text-anchor="end" font-weight="700">10.4</text>
    <text x="450" y="88">salto</text><text x="506" y="88">IP</text><text x="700" y="88" text-anchor="end">Loss%</text><text x="760" y="88" text-anchor="end">Avg</text>
    <text x="464" y="108">1.</text><text x="506" y="108">192.168.10.1</text><text x="700" y="108" text-anchor="end">0.0%</text><text x="760" y="108" text-anchor="end">0.5</text>
    <text x="464" y="128">2.</text><text x="506" y="128">203.0.113.1</text><text x="700" y="128" text-anchor="end">0.0%</text><text x="760" y="128" text-anchor="end">4.1</text>
    <text x="464" y="148" font-weight="700">3.</text><text x="506" y="148" font-weight="700">198.51.100.17</text><text x="700" y="148" text-anchor="end" font-weight="700">30.0%</text><text x="760" y="148" text-anchor="end" font-weight="700">6.9</text>
    <text x="464" y="168" font-weight="700">4.</text><text x="506" y="168" font-weight="700">198.51.100.94</text><text x="700" y="168" text-anchor="end" font-weight="700">31.0%</text><text x="760" y="168" text-anchor="end" font-weight="700">9.4</text>
    <text x="464" y="188" font-weight="700">5.</text><text x="506" y="188" font-weight="700">destino</text><text x="700" y="188" text-anchor="end" font-weight="700">30.0%</text><text x="760" y="188" text-anchor="end" font-weight="700">10.6</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="28" y="214">El destino tiene 0 %: el tráfico pasa. El router 3 solo</text>
    <text x="28" y="230">contesta pocos avisos ICMP (los limita). No es una falla.</text>
    <text x="450" y="214">La pérdida empieza en el 3 y llega al destino: se pierde</text>
    <text x="450" y="230">de verdad en el tramo 2 → 3. Es lo que hay que reportar.</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="14" y="270" font-weight="700">Con la demora pasa lo mismo:</text>
    <text x="14" y="290">un salto con más ms que los siguientes no importa; un salto que sube la demora y todos los que siguen</text>
    <text x="14" y="308">la mantienen, sí (un enlace largo o saturado). Mandá al menos 100 ciclos (-c 100) antes de concluir,</text>
    <text x="14" y="326">y si podés, hacé el mtr también desde el otro extremo: la vuelta puede ir por otro camino.</text>
  </g>
</svg>
