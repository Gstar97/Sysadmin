- { id: t1, frente: "Errores de ping", dorso: "Host Unreachable desde tu IP: ARP sin respuesta en tu red · sin respuesta: se pierde en el camino o bloquean ICMP · Network is unreachable: no hay ruta · Name or service not known: DNS." }
- { id: t2, frente: "Leer mtr", dorso: "Mirá la última fila: la pérdida real empieza en un salto y sigue hasta el destino. Un salto suelto con pérdida es un router que limita ICMP. Usá -rwc 100." }
- { id: t3, frente: "ip para diagnosticar", dorso: "ip -br a (placas) · ip route get IP (ruta elegida) · ip neigh (ARP) · ip -s link (errores y colisiones)." }
- { id: t4, frente: "ss para diagnosticar", dorso: "sudo ss -tulpn: qué escucha, dónde (127.0.0.1 o 0.0.0.0) y qué programa · SYN-SENT que no avanza: no hay respuesta al saludo." }
- { id: t5, frente: "curl -w", dorso: "time_namelookup (DNS) · time_connect (TCP) · time_appconnect (TLS) · time_starttransfer (primer byte) · time_total. Son acumulados." }
- { id: t6, frente: "nc -zv IP PUERTO", dorso: "Conecta: hay servicio · Connection refused: llegaste y no hay nada (o rechazo) · timeout: algo descarta en el camino. En Rocky es ncat; en Windows, Test-NetConnection -Port." }
- { id: t7, frente: "dig: tres cosas para mirar", dorso: "status (NOERROR, NXDOMAIN, SERVFAIL) · ANSWER SECTION · SERVER (quién respondió). Con @IP elegís el servidor; +short, solo la respuesta." }
