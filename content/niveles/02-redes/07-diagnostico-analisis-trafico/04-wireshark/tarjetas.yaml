- { id: t1, frente: "Ventana de Wireshark", dorso: "Barra de filtro (verde o roja) · lista de paquetes con colores · detalle por capas · bytes." }
- { id: t2, frente: "Captura contra visualización", dorso: "Captura: BPF (como tcpdump), antes, decide qué se guarda. Visualización: sintaxis propia, después, solo esconde." }
- { id: t3, frente: "Filtros de visualización frecuentes", dorso: "ip.addr == X · tcp.port == 443 · dns · tcp.flags.syn == 1 && tcp.flags.ack == 0 · tcp.analysis.flags · dns.flags.rcode != 0 · tls.handshake.type == 1." }
- { id: t4, frente: "Seguir flujo TCP", dorso: "Junta los dos sentidos de una conexión y muestra lo que se dijeron (si no va cifrado). Aplica tcp.stream == N." }
- { id: t5, frente: "Lo que Wireshark marca solo", dorso: "Retransmission y Dup ACK: pérdida · Zero Window: el receptor no da abasto · RST: corte o rechazo. Analizar, Información experta." }
- { id: t6, frente: "Medir la red en una captura", dorso: "Tiempo entre SYN y SYN-ACK: ida y vuelta sin la aplicación. frame.time_delta_displayed para encontrar esperas." }
- { id: t7, frente: "tshark", dorso: "tshark -r archivo -Y 'filtro de visualización' · -f 'filtro de captura' · -T fields -e campo." }
