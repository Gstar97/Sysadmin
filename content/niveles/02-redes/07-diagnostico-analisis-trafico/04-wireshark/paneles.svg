<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="20" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">La ventana de Wireshark, de arriba hacia abajo</text>
  <rect x="10" y="32" width="610" height="358" rx="8" fill="var(--surface, #fff)" stroke="currentColor" stroke-width="1.5"/>
  <rect x="22" y="44" width="586" height="24" rx="4" fill="var(--ok-soft, #dcf5e4)" stroke="var(--ok, #15803d)"/>
  <text x="30" y="60" font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">tcp.stream == 0</text>
  <g font-family="ui-monospace, monospace" font-size="10.5" fill="currentColor">
    <rect x="22" y="76" width="586" height="18" fill="var(--surface-2, #eef1f5)"/>
    <text x="28" y="89" font-weight="700">N.º</text><text x="62" y="89" font-weight="700">Origen</text><text x="172" y="89" font-weight="700">Destino</text><text x="282" y="89" font-weight="700">Protocolo</text><text x="360" y="89" font-weight="700">Info</text>
    <rect x="22" y="94" width="586" height="18" fill="var(--surface-2, #eef1f5)"/>
    <text x="28" y="107">13</text><text x="62" y="107">192.168.10.100</text><text x="172" y="107">93.184.215.14</text><text x="282" y="107">TCP</text><text x="360" y="107">51544 → 443 [SYN]</text>
    <rect x="22" y="112" width="586" height="18" fill="var(--surface-2, #eef1f5)"/>
    <text x="28" y="125">14</text><text x="62" y="125">93.184.215.14</text><text x="172" y="125">192.168.10.100</text><text x="282" y="125">TCP</text><text x="360" y="125">443 → 51544 [SYN, ACK]</text>
    <text x="28" y="143">15</text><text x="62" y="143">192.168.10.100</text><text x="172" y="143">93.184.215.14</text><text x="282" y="143">TCP</text><text x="360" y="143">51544 → 443 [ACK]</text>
    <rect x="22" y="148" width="586" height="18" fill="var(--ok-soft, #dcf5e4)" stroke="var(--accent, #0f766e)" stroke-width="2"/>
    <text x="28" y="161">16</text><text x="62" y="161">192.168.10.100</text><text x="172" y="161">93.184.215.14</text><text x="282" y="161">TLSv1.3</text><text x="360" y="161">Client Hello</text>
    <text x="28" y="179">17</text><text x="62" y="179">93.184.215.14</text><text x="172" y="179">192.168.10.100</text><text x="282" y="179">TCP</text><text x="360" y="179">443 → 51544 [ACK]</text>
  </g>
  <line x1="22" y1="194" x2="608" y2="194" stroke="var(--line, #d9dee6)" stroke-width="2"/>
  <g font-family="ui-monospace, monospace" font-size="10.5" fill="currentColor">
    <text x="28" y="212">▸ Frame 16: 571 bytes</text>
    <text x="28" y="228">▸ Ethernet II, Src: 52:54:00:3c:1a:7e, Dst: 52:54:00:aa:10:01</text>
    <text x="28" y="244">▸ Internet Protocol Version 4, Src: 192.168.10.100, Dst: 93.184.215.14</text>
    <text x="28" y="260">▸ Transmission Control Protocol, Src Port: 51544, Dst Port: 443</text>
    <text x="28" y="276">▾ Transport Layer Security</text>
    <text x="46" y="292">Handshake Type: Client Hello</text>
    <text x="46" y="308">Server Name: www.ejemplo.com.ar</text>
  </g>
  <line x1="22" y1="318" x2="608" y2="318" stroke="var(--line, #d9dee6)" stroke-width="2"/>
  <g font-family="ui-monospace, monospace" font-size="10.5" fill="var(--muted, #5b6878)">
    <text x="28" y="336">0000</text><text x="70" y="336">52 54 00 aa 10 01 52 54 00 3c 1a 7e 08 00 45 00</text><text x="440" y="336">RT....RT.&lt;.~..E.</text>
    <text x="28" y="352">0010</text><text x="70" y="352">02 2d 0f ab 40 00 40 06 00 00 c0 a8 0a 64 5d b8</text><text x="440" y="352">.-..@.@......d].</text>
    <text x="28" y="368">0020</text><text x="70" y="368">d7 0e c9 58 01 bb 77 4a 2b 46 00 00 00 01 50 18</text><text x="440" y="368">...X..wJ+F....P.</text>
  </g>
  <g fill="currentColor" font-size="12">
    <circle cx="646" cy="56" r="11" fill="var(--accent, #0f766e)"/><text x="646" y="60" text-anchor="middle" fill="var(--accent-fg, #fff)" font-weight="700">1</text>
    <text x="664" y="52" font-weight="700">Filtro de visualización</text>
    <text x="664" y="68" font-size="11">verde: válido · rojo: con error</text>
    <circle cx="646" cy="130" r="11" fill="var(--accent, #0f766e)"/><text x="646" y="134" text-anchor="middle" fill="var(--accent-fg, #fff)" font-weight="700">2</text>
    <text x="664" y="126" font-weight="700">Lista de paquetes</text>
    <text x="664" y="142" font-size="11">una fila por paquete; el color</text>
    <text x="664" y="156" font-size="11">marca el protocolo (rojo y negro:</text>
    <text x="664" y="170" font-size="11">algo anduvo mal)</text>
    <circle cx="646" cy="258" r="11" fill="var(--accent, #0f766e)"/><text x="646" y="262" text-anchor="middle" fill="var(--accent-fg, #fff)" font-weight="700">3</text>
    <text x="664" y="254" font-weight="700">Detalle por capas</text>
    <text x="664" y="270" font-size="11">del paquete elegido: de la trama</text>
    <text x="664" y="284" font-size="11">Ethernet a la aplicación</text>
    <circle cx="646" cy="350" r="11" fill="var(--accent, #0f766e)"/><text x="646" y="354" text-anchor="middle" fill="var(--accent-fg, #fff)" font-weight="700">4</text>
    <text x="664" y="346" font-weight="700">Bytes</text>
    <text x="664" y="362" font-size="11">el paquete tal cual viajó,</text>
    <text x="664" y="376" font-size="11">en hexadecimal y en texto</text>
  </g>
</svg>
