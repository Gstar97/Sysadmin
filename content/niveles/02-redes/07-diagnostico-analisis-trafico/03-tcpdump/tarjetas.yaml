- { id: t1, frente: "Dónde capturar", dorso: "Cliente (¿sale?), servidor (¿llega?), los dos extremos (lo más fuerte), router o firewall (¿lo reenvía o lo traduce?), puerto espejo (equipos que no podés tocar)." }
- { id: t2, frente: "tcpdump básico", dorso: "sudo tcpdump -i PLACA -nn -c N 'filtro' · -D lista interfaces · -i any todas · Ctrl+C corta." }
- { id: t3, frente: "Banderas en tcpdump", dorso: "[S] SYN · [S.] SYN-ACK · [.] ACK · [P.] datos · [F.] FIN · [R]/[R.] RST. El punto es el ACK." }
- { id: t4, frente: "Filtros BPF", dorso: "host, src/dst host, net, port, portrange, tcp/udp/icmp/arp, 'tcp[tcpflags] & tcp-syn != 0'; and, or, not; entre comillas simples." }
- { id: t5, frente: "Guardar y leer", dorso: "-w /tmp/caso.pcap guarda (no muestra) · -r archivo lee (sin sudo), con cualquier filtro · -C y -W rotan archivos." }
- { id: t6, frente: "Por SSH", dorso: "Agregá not port 22: si no, lo que tcpdump te muestra genera más tráfico SSH que se captura." }
- { id: t7, frente: "Capturas y privacidad", dorso: "Pueden tener contraseñas y datos de lo que no va cifrado: con autorización, filtradas, protegidas y borradas al terminar." }
