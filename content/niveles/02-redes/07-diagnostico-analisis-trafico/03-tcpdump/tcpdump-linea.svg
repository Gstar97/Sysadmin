<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Anatomía de una línea de tcpdump (el primer paso del saludo TCP)</text>
  <rect x="10" y="96" width="840" height="58" rx="8" fill="var(--term-bg, #0d1117)"/>
  <g font-family="ui-monospace, monospace" font-size="12.5" fill="var(--term-fg, #d6dde6)">
    <text x="22" y="120" textLength="644" lengthAdjust="spacingAndGlyphs">09:41:02.520612 IP 192.168.10.100.51544 &gt; 93.184.215.14.443: Flags [S], seq 2001361477,</text>
    <text x="22" y="142" textLength="570" lengthAdjust="spacingAndGlyphs">win 64240, options [mss 1460,sackOK,TS val 1209 ecr 0,nop,wscale 7], length 0</text>
  </g>
  <g stroke="var(--accent, #0f766e)" stroke-width="1.6" fill="none">
    <path d="M22 92 V80 H131 V92"/>
    <path d="M140 92 V62 H154 V92"/>
    <path d="M163 92 V80 H309 V92"/>
    <path d="M333 92 V62 H457 V92"/>
    <path d="M473 92 V80 H538 V92"/>
    <path d="M555 92 V62 H656 V92"/>
    <path d="M22 158 V170 H87 V158"/>
    <path d="M103 158 V186 H227 V158"/>
    <path d="M533 158 V170 H590 V158"/>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="22" y="74">hora</text>
    <text x="140" y="56">IPv4</text>
    <text x="163" y="74">origen: IP . puerto</text>
    <text x="333" y="56">destino: IP . puerto</text>
    <text x="473" y="74">banderas TCP</text>
    <text x="555" y="56">número de secuencia</text>
    <text x="22" y="184">ventana</text>
    <text x="103" y="202">opciones: el MSS que anuncia</text>
    <text x="533" y="184">bytes de datos</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="10" y="232" font-weight="700">Banderas:</text>
    <text x="80" y="232">[S] SYN (abre) · [S.] SYN-ACK (acepta) · [.] ACK · [P.] datos (PSH+ACK) · [F.] FIN (cierra) · [R] o [R.] RST (corta)</text>
    <text x="10" y="256" font-weight="700">Sin -n,</text>
    <text x="62" y="256">tcpdump cambia IP por nombres y puertos por servicios (https): más lento, y con -n ves los números reales.</text>
    <text x="10" y="280" font-weight="700">Desde el segundo paquete</text>
    <text x="172" y="280">de una conexión, seq y ack aparecen relativos (1, 518...), para que se lean fácil.</text>
  </g>
</svg>
