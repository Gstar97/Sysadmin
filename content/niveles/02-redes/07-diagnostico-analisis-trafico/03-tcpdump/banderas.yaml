tipo: emparejar
consigna: Uní cada secuencia de banderas (vistas en tcpdump) con lo que está pasando.
pares:
  - { a: "[S], [S.], [.]", b: "Una conexión que se abre bien: el saludo en tres pasos" }
  - { a: "[S] y enseguida [R.] desde el servidor", b: "Puerto cerrado: el equipo responde que no hay nada ahí (refused)" }
  - { a: "[S], [S], [S] cada vez más espaciados, sin respuesta", b: "Algo descarta el SYN: un firewall o falta la ruta (timeout)" }
  - { a: "[P.] con length 517 y después [.] del otro lado", b: "Se mandan datos y el otro confirma que los recibió" }
  - { a: "[F.] de un lado, [F.] del otro y un [.] final", b: "La conexión se cierra de forma ordenada" }
explicacion: >-
  Con las banderas de los primeros paquetes ya sabés si una conexión se abrió, se rechazó o se
  perdió, sin necesidad de entender el resto de la línea.
