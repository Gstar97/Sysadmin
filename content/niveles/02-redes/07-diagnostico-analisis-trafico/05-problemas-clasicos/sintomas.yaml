tipo: emparejar
consigna: Uní cada síntoma con el problema clásico que más se le parece.
pares:
  - { a: "Lo chico anda (ping, una API) y lo grande se cuelga (páginas, archivos), sobre todo por VPN", b: "MTU: paquetes grandes que no entran en el camino" }
  - { a: "Por IP anda todo; por nombre, nada o con 5 segundos de demora", b: "DNS: el resolvedor falla o uno de ellos no contesta" }
  - { a: "Se llega a todo lo de la propia red, pero a nada de las otras", b: "La puerta de enlace (falta, está mal, o la máscara es incorrecta)" }
  - { a: "Un equipo se conecta y desconecta solo, a intervalos, sin patrón", b: "IP duplicada: otro equipo usa la misma dirección" }
  - { a: "Un solo puesto anda lento y su placa acumula errores o colisiones", b: "Dúplex mal negociado (o un cable malo)" }
  - { a: "Toda la red se pone lentísima de golpe y las luces del switch parpadean sin parar", b: "Un bucle de capa 2: tormenta de broadcast" }
explicacion: >-
  Reconocer el patrón ahorra horas, pero sigue siendo una hipótesis: confirmala con una prueba
  antes de cambiar nada.
