- { id: t1, frente: "Síntoma de MTU", dorso: "Anda lo chico (ping, una API, el saludo TLS) y se cuelga lo grande (páginas, archivos), sobre todo por VPN o PPPoE." }
- { id: t2, frente: "Probar el MTU del camino", dorso: "ping -M do -s 1472 destino (1472 + 28 = 1500); bajar hasta que pase. Windows: ping -f -l 1472." }
- { id: t3, frente: "Arreglar un agujero negro de MTU", dorso: "Dejar pasar ICMP tipo 3 código 4 · MSS clamping en el túnel (MTU − 40) · MTU correcto en la interfaz del túnel." }
- { id: t4, frente: "DNS: tres respuestas distintas", dorso: "NXDOMAIN: no existe (mal escrito) · SERVFAIL: el resolvedor no pudo averiguarlo · sin respuesta: caído o bloqueado (5 s por consulta)." }
- { id: t5, frente: "La red propia sí, las demás no", dorso: "Puerta de enlace ausente o equivocada, máscara mal (cree que todo es local) o falta la ruta de vuelta del otro lado." }
- { id: t6, frente: "IP duplicada", dorso: "Cortes intermitentes. sudo arping -D -I PLACA IP antes de asignar; IP fijas fuera del rango del DHCP o reservas." }
- { id: t7, frente: "Dúplex mal negociado", dorso: "Un lado automático y el otro fijo: el automático cae en half. Lento y con errores. ethtool e ip -s link; los dos en automático." }
- { id: t8, frente: "Bucle de capa 2", dorso: "Toda la red se cae de golpe, luces que parpadean, MAC que saltan de puerto. Desconectar; prevenir con STP y BPDU Guard." }
