<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="mu-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="20" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Por qué un túnel achica el paquete más grande que pasa</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="14" y="44" width="120" height="54" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="250" y="44" width="150" height="54" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="530" y="44" width="150" height="54" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="730" y="44" width="116" height="54" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="74" y="66" font-weight="700">Servidor</text><text x="74" y="84" font-size="11">10.2.0.50 · MTU 1500</text>
    <text x="325" y="66" font-weight="700">Router de la VPN</text><text x="325" y="84" font-size="11">sucursal</text>
    <text x="605" y="66" font-weight="700">Router de la VPN</text><text x="605" y="84" font-size="11">central · 10.99.0.1</text>
    <text x="788" y="66" font-weight="700">PC</text><text x="788" y="84" font-size="11">MTU 1500</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="134" y1="71" x2="250" y2="71"/>
    <line x1="680" y1="71" x2="730" y2="71"/>
  </g>
  <rect x="400" y="58" width="130" height="26" rx="13" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="465" y="75" text-anchor="middle" font-size="11" fill="currentColor">túnel WireGuard</text>
  <text x="430" y="122" text-anchor="middle" font-weight="700" fill="currentColor">Dentro del túnel, cada paquete lleva un "sobre" extra de hasta 80 bytes:</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="140" y="134" width="80" height="34" fill="var(--warn, #a16207)" fill-opacity="0.35"/>
    <rect x="220" y="134" width="500" height="34" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor" font-size="11.5" text-anchor="middle">
    <text x="180" y="155">sobre: 80</text>
    <text x="470" y="155">el paquete original: como mucho 1420 bytes</text>
  </g>
  <text x="430" y="186" text-anchor="middle" font-size="11.5" fill="currentColor">80 + 1420 = 1500, lo máximo que entra en el enlace de internet. Por eso el MTU del túnel es 1420.</text>
  <g fill="currentColor">
    <text x="14" y="218" font-weight="700">Lo que debería pasar (descubrimiento del MTU del camino):</text>
    <text x="14" y="238" font-size="11.5">1. El servidor manda 1500 bytes con la marca "no fragmentar" (DF).</text>
    <text x="14" y="256" font-size="11.5">2. El router de la VPN no puede meterlo en el túnel y le avisa por ICMP: "hay que fragmentar, el máximo es 1420".</text>
    <text x="14" y="274" font-size="11.5">3. El servidor achica sus paquetes a 1420 y todo sigue andando.</text>
    <text x="14" y="304" font-weight="700" fill="var(--bad, #b91c1c)">Lo que pasa cuando un firewall bloquea todo el ICMP (agujero negro):</text>
    <text x="14" y="324" font-size="11.5">el aviso no llega, el servidor reintenta con 1500 una y otra vez, y los paquetes grandes desaparecen. Lo chico (un ping,</text>
    <text x="14" y="342" font-size="11.5">una API que responde poco, el saludo de TLS) anda; lo grande (una página, un archivo) se queda esperando para siempre.</text>
  </g>
</svg>
