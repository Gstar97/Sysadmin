- { id: t1, frente: "Tormenta de broadcast", dorso: "Un bucle en capa 2: las tramas no tienen TTL, dan vueltas sin fin y saturan la red en segundos." }
- { id: t2, frente: "Elección de la raíz", dorso: "Menor identificador de puente: prioridad (32768 + VLAN de fábrica, de a 4096) y, si empatan, la MAC más baja." }
- { id: t3, frente: "Roles de puerto", dorso: "Raíz: el camino más barato a la raíz (uno por switch). Designado: uno por enlace. Bloqueado/alternativo: el resto, en espera." }
- { id: t4, frente: "Costos de STP", dorso: "10 Gb/s = 2 · 1 Gb/s = 4 · 100 Mb/s = 19." }
- { id: t5, frente: "PortFast + BPDU Guard", dorso: "En puertos de equipos finales: reenvía al instante; si llega una BPDU, el puerto pasa a err-disabled." }
- { id: t6, frente: "STP, RSTP, Rapid PVST+", dorso: "802.1D tarda 30-50 s; RSTP (802.1w) uno o dos. Rapid PVST+ es RSTP con un árbol por VLAN (Cisco)." }
