<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="210" y="24" text-anchor="middle" font-weight="700" fill="currentColor">Sin Spanning Tree: tormenta de broadcast</text>
  <text x="650" y="24" text-anchor="middle" font-weight="700" fill="currentColor">Con Spanning Tree: un enlace bloqueado</text>
  <line x1="430" y1="36" x2="430" y2="330" stroke="currentColor" stroke-dasharray="4 5" opacity="0.5"/>
  <defs>
    <marker id="st-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--bad, #c0392b)"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="3">
    <line x1="210" y1="80" x2="90" y2="220"/>
    <line x1="210" y1="80" x2="330" y2="220"/>
    <line x1="90" y1="230" x2="330" y2="230"/>
    <line x1="650" y1="80" x2="530" y2="220"/>
    <line x1="650" y1="80" x2="770" y2="220"/>
  </g>
  <line x1="530" y1="230" x2="770" y2="230" stroke="var(--bad, #c0392b)" stroke-width="3" stroke-dasharray="10 6"/>
  <g fill="none" stroke="var(--bad, #c0392b)" stroke-width="2" marker-end="url(#st-a)">
    <path d="M178 104 L118 176"/>
    <path d="M130 210 L290 210"/>
    <path d="M304 176 L242 104"/>
    <path d="M242 112 L300 186" opacity="0.6"/>
    <path d="M286 250 L136 250" opacity="0.6"/>
    <path d="M110 186 L172 112" opacity="0.6"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="160" y="54" width="100" height="40" rx="8" fill="var(--surface, #fff)"/>
    <rect x="40" y="208" width="100" height="40" rx="8" fill="var(--surface, #fff)"/>
    <rect x="280" y="208" width="100" height="40" rx="8" fill="var(--surface, #fff)"/>
    <rect x="600" y="54" width="100" height="40" rx="8" fill="var(--warn-soft, #fbf0d0)" stroke-width="3"/>
    <rect x="480" y="208" width="100" height="40" rx="8" fill="var(--surface, #fff)"/>
    <rect x="720" y="208" width="100" height="40" rx="8" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-weight="700">
    <text x="210" y="79">SW1</text><text x="90" y="233">SW2</text><text x="330" y="233">SW3</text>
    <text x="650" y="79">SW1 ★ raíz</text><text x="530" y="233">SW2</text><text x="770" y="233">SW3</text>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="210" y="160">da vueltas</text>
    <text x="210" y="175">y se multiplica</text>
    <text x="650" y="150">un solo camino entre</text>
    <text x="650" y="165">cada par de switches</text>
    <text x="650" y="222" fill="var(--bad, #c0392b)" font-weight="700">bloqueado</text>
    <text x="650" y="262">si se corta otro enlace, este se activa solo</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="20" y="300">Ethernet no tiene TTL: las tramas no se mueren solas.</text>
    <text x="20" y="318">En segundos, la red entera queda saturada.</text>
    <text x="450" y="300">Gana la raíz el switch con el identificador más bajo</text>
    <text x="450" y="318">(prioridad + VLAN, y si empatan, la MAC más baja).</text>
  </g>
</svg>
