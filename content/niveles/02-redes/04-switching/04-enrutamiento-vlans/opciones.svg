<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="200" y="26" text-anchor="middle" font-weight="700" fill="currentColor">Router-on-a-stick</text>
  <text x="640" y="26" text-anchor="middle" font-weight="700" fill="currentColor">Switch de capa 3 (SVI)</text>
  <line x1="430" y1="40" x2="430" y2="320" stroke="currentColor" stroke-dasharray="4 5" opacity="0.5"/>
  <g stroke="currentColor">
    <rect x="130" y="46" width="140" height="62" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="130" y="150" width="140" height="44" rx="8" fill="var(--surface, #fff)"/>
    <rect x="40" y="244" width="120" height="40" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="240" y="244" width="120" height="40" rx="6" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="560" y="120" width="160" height="90" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="480" y="254" width="120" height="40" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="680" y="254" width="120" height="40" rx="6" fill="var(--ok-soft, #dcf3e6)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="200" y="66" font-weight="700">R1</text>
    <text x="200" y="84" font-family="ui-monospace, monospace" font-size="11">Gi0/0.10 · 192.168.10.1</text>
    <text x="200" y="100" font-family="ui-monospace, monospace" font-size="11">Gi0/0.20 · 192.168.20.1</text>
    <text x="200" y="177" font-weight="700">SW1</text>
    <text x="100" y="268">VLAN 10</text><text x="300" y="268">VLAN 20</text>
    <text x="640" y="142" font-weight="700">SW-NÚCLEO</text>
    <text x="640" y="160" font-size="11">ip routing</text>
    <text x="640" y="178" font-family="ui-monospace, monospace" font-size="11">Vlan10 · 192.168.10.1</text>
    <text x="640" y="196" font-family="ui-monospace, monospace" font-size="11">Vlan20 · 192.168.20.1</text>
    <text x="540" y="278">VLAN 10</text><text x="740" y="278">VLAN 20</text>
  </g>
  <line x1="200" y1="108" x2="200" y2="150" stroke="currentColor" stroke-width="4"/>
  <text x="210" y="134" font-size="11" fill="currentColor">un troncal: todo sube y baja por este cable</text>
  <g stroke="currentColor" stroke-width="2"><line x1="170" y1="194" x2="100" y2="244"/><line x1="230" y1="194" x2="300" y2="244"/><line x1="600" y1="210" x2="540" y2="254"/><line x1="680" y1="210" x2="740" y2="254"/></g>
  <g fill="currentColor" font-size="11.5">
    <text x="20" y="312">Barato: sirve casi cualquier router. Pero el troncal es un cuello de botella.</text>
    <text x="450" y="312">Rápido: enruta dentro del switch, a velocidad de cable.</text>
  </g>
</svg>
