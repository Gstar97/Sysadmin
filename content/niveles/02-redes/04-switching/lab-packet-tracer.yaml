tipo: pasos
titulo: La misma oficina en Cisco Packet Tracer
descripcion: >-
  Packet Tracer es gratis con una cuenta de Cisco Networking Academy (netacad.com) y corre en
  Windows, Linux y macOS. Vas a armar la misma red que en la parte 1, con dos enlaces entre los
  switches para ver Spanning Tree en acción.
pasos:
  - titulo: Los equipos y los cables
    detalle: >-
      Creá un proyecto nuevo. Agregá dos switches 2960 (SW1 y SW2), un router 2911 (R1) y seis
      PC. Conectá con cable directo (cobre): las PC a Fa0/1, Fa0/2 y Fa0/3 de cada switch, R1
      Gi0/0 a SW1 Gi0/2, y SW1 con SW2 dos veces: Gi0/1 con Gi0/1 y Fa0/24 con Fa0/24.
    comprobar: Las luces de los enlaces entre switches se ponen verdes; una de las dos queda naranja (bloqueada por STP) después de unos segundos.
  - titulo: IP de las PC
    detalle: >-
      En cada PC, Desktop → IP Configuration: 192.168.10.11 y .12 para Administración,
      192.168.20.11 y .12 para Ventas, 192.168.30.11 y .12 para Invitados, máscara
      255.255.255.0 y como puerta de enlace la .1 de su red.
    comprobar: Desde Desktop → Command Prompt de cada PC, ipconfig muestra la IP y la puerta de enlace correctas.
  - titulo: VLAN, troncales y router
    detalle: >-
      En la pestaña CLI de cada equipo, escribe la misma configuración de la parte 1. En SW1 y
      SW2, configura también Fa0/24 como troncal con las VLAN 10, 20 y 30.
    comandos:
      - "enable"
      - "configure terminal"
      - "vlan 10"
      - "name ADMIN"
      - "interface range fa0/23 - 24"
      - "switchport mode trunk"
      - "switchport trunk allowed vlan 10,20,30"
    comprobar: show interfaces trunk en los dos switches muestra Gi0/1 y Fa0/24 con las VLAN 10, 20 y 30; ping desde Admin-PB a Ventas-P1 funciona (el primero puede fallar mientras se resuelve ARP).
  - titulo: Spanning Tree
    detalle: >-
      En SW1: spanning-tree vlan 10,20,30 priority 4096. En los dos switches, PortFast y BPDU
      Guard en Fa0/1 a Fa0/3. Mirá show spanning-tree vlan 10 en SW2: el puerto raíz tiene que
      ser Gi0/1 (costo 4) y Fa0/24 tiene que quedar bloqueado (Altn BLK, costo 19).
    comandos:
      - "spanning-tree vlan 10,20,30 priority 4096"
      - "show spanning-tree vlan 10"
    comprobar: En SW1, show spanning-tree vlan 10 dice "This bridge is the root"; en SW2, Fa0/24 está en BLK.
  - titulo: Romper y mirar
    detalle: >-
      Pasá al modo Simulation (abajo a la derecha), hacé un ping continuo de Admin-PB a Admin-P1 y
      borra el cable Gi0/1 entre los switches. Mirá cómo Fa0/24 pasa a reenviar. Después, en SW2,
      ejecuta no spanning-tree vlan 10 y mira qué pasa con un broadcast (ARP) en la VLAN 10 con
      los dos cables conectados. Volvé a activarlo con spanning-tree vlan 10.
    comprobar: Con STP, el ping vuelve tras unos segundos por Fa0/24. Sin STP en la VLAN 10, ves el ARP multiplicarse entre los dos switches.
  - titulo: Guardar
    detalle: Guardá la configuración en cada equipo (copy running-config startup-config) y el proyecto (.pkt).
    comprobar: show startup-config en cada equipo muestra tu configuración.
