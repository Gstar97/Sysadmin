- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: El prompt dice Switch(config-if)#. ¿En qué modo estás?
  opciones:
    - { texto: "Configuración de una interfaz", correcta: true, explicacion: "Los cambios se aplican al puerto que elegiste con interface." }
    - { texto: "EXEC de usuario", explicacion: "Ese se ve como Switch>." }
    - { texto: "EXEC privilegiado", explicacion: "Ese se ve como Switch#." }
    - { texto: "Configuración global", explicacion: "Ese se ve como Switch(config)#." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Qué pasa con los cambios de configuración si reiniciás el switch sin haberlos guardado?
  opciones:
    - { texto: "Se pierden: el switch carga la startup-config, que no los tiene", correcta: true, explicacion: "Los cambios estaban solo en la running-config, en memoria." }
    - { texto: "Se guardan solos al apagar", explicacion: "IOS no guarda automáticamente." }
    - { texto: "Quedan a medias", explicacion: "Vuelve todo a la startup-config." }
    - { texto: "El switch no arranca", explicacion: "Arranca normalmente, con la configuración anterior." }
- id: p03
  tipo: completar_comando
  enunciado: Escribí el comando que guarda la configuración activa para que se cargue al reiniciar.
  aceptadas: [copy running-config startup-config, copy run start, write memory, wr, write, copy running-config startup-config, wr mem, write mem]
  explicacion: copy running-config startup-config (o write memory) copia la configuración de la RAM a la NVRAM.
- id: p04
  tipo: opcion_multiple
  dificultad: 1
  enunciado: Te llega un switch nuevo de fábrica. ¿Cómo te conectás por primera vez?
  opciones:
    - { texto: "Por el puerto de consola, con un cable de consola y un programa de terminal a 9600 baudios", correcta: true, explicacion: "Sin IP ni usuario configurados, la consola es la única entrada." }
    - { texto: "Por SSH a su IP de fábrica", explicacion: "Un switch Cisco de fábrica no tiene IP ni SSH configurado." }
    - { texto: "Por la web en 192.168.1.1", explicacion: "Algunos equipos hogareños lo hacen; un switch Cisco administrable no." }
    - { texto: "No se puede sin software especial del fabricante", explicacion: "Alcanza con PuTTY o screen." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Cambiaste la configuración de las líneas vty y quedaste sin acceso por SSH. Todavía no guardaste. ¿Qué podés hacer?
  opciones:
    - { texto: "Entrar por consola y corregir, o reiniciar el switch para volver a la startup-config", correcta: true, explicacion: "Lo no guardado se pierde al reiniciar: en este caso, es una ventaja." }
    - { texto: "Nada: el switch quedó inutilizable", explicacion: "La consola siempre está disponible." }
    - { texto: "Hacer copy running-config startup-config", explicacion: "Guardaría el error." }
    - { texto: "Restablecer de fábrica sí o sí", explicacion: "No hace falta." }
- id: p06
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Dónde se pone la IP de administración de un switch de capa 2?
  opciones:
    - { texto: "En una interfaz VLAN (SVI), por ejemplo interface vlan 1", correcta: true, explicacion: "Los puertos de un switch de capa 2 no llevan IP." }
    - { texto: "En el puerto Fa0/1", explicacion: "Los puertos de capa 2 no aceptan ip address." }
    - { texto: "En la línea de consola", explicacion: "La consola no usa IP." }
    - { texto: "No se puede: un switch de capa 2 no tiene IP", explicacion: "Tiene una para administrarlo, en una SVI." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Por qué hay que preferir enable secret frente a enable password?
  opciones:
    - { texto: "enable secret guarda un hash; enable password queda en texto plano o con un cifrado reversible", correcta: true, explicacion: "Si existen las dos, se usa secret." }
    - { texto: "enable secret es más corto de escribir", explicacion: "No es esa la razón." }
    - { texto: "enable password no funciona en switches", explicacion: "Funciona, pero es inseguro." }
    - { texto: "Son lo mismo", explicacion: "Se guardan de forma muy distinta." }
- id: p08
  tipo: respuesta_multiple
  enunciado: ¿Qué hace falta para habilitar SSH en un switch Cisco? (Marcá todas las correctas.)
  opciones:
    - { texto: "Un hostname distinto del de fábrica y un ip domain-name", correcta: true, explicacion: "Se usan para generar las claves RSA." }
    - { texto: "Generar las claves RSA (crypto key generate rsa)", correcta: true, explicacion: "Con 2048 bits como mínimo." }
    - { texto: "Un usuario local y login local en las líneas vty", correcta: true, explicacion: "Así cada administrador entra con su usuario." }
    - { texto: "Una IP de administración alcanzable", correcta: true, explicacion: "Sin IP no hay forma de conectarse por la red." }
    - { texto: "Desactivar la consola", explicacion: "La consola sigue siendo la entrada de emergencia." }
- id: p09
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Estás en Switch(config-if)# y querés ver la tabla de VLAN sin salir de la configuración. ¿Qué escribís?
  opciones:
    - { texto: "do show vlan brief", correcta: true, explicacion: "do ejecuta comandos del modo privilegiado desde cualquier modo de configuración." }
    - { texto: "show vlan brief", explicacion: "En modo de configuración, show solo funciona con do adelante." }
    - { texto: "exit show vlan", explicacion: "No es un comando válido." }
    - { texto: "vlan brief", explicacion: "No existe." }
