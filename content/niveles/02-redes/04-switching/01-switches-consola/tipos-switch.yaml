tipo: emparejar
consigna: Une cada tipo de switch con dónde conviene usarlo.
pares:
  - { a: "No administrable", b: "Una casa o un escritorio: se enchufa y funciona, sin VLAN ni monitoreo" }
  - { a: "Administrable de capa 2", b: "El acceso de una oficina: VLAN, troncales, STP, seguridad por puerto y SNMP" }
  - { a: "De capa 3 (multicapa)", b: "El núcleo de la red: además de conmutar, enruta entre VLAN a gran velocidad" }
  - { a: "Con PoE", b: "Donde hay teléfonos, cámaras o puntos de acceso que se alimentan por el cable" }
explicacion: >-
  En una empresa, todo lo que no sea un switch administrable es una zona sin control: no se
  puede ver qué pasa en sus puertos ni separar tráfico.
