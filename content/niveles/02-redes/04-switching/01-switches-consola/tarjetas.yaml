- { id: t1, frente: "Modos de IOS", dorso: "> usuario · # privilegiado (enable) · (config)# global (configure terminal) · (config-if)# interfaz (interface X). exit sube, end vuelve al #." }
- { id: t2, frente: "running-config y startup-config", dorso: "running: en memoria, se aplica al instante. startup: la que carga al arrancar. Guardar: copy running-config startup-config." }
- { id: t3, frente: "Acceso a un switch nuevo", dorso: "Cable de consola + PuTTY o screen a 9600 baudios. Después, IP de administración y SSH." }
- { id: t4, frente: "IP de administración", dorso: "interface vlan 1 + ip address + no shutdown, e ip default-gateway en configuración global." }
- { id: t5, frente: "SSH en IOS", dorso: "hostname + ip domain-name + username X secret Y + crypto key generate rsa modulus 2048 + ip ssh version 2 + line vty 0 15: login local, transport input ssh." }
- { id: t6, frente: "Ayudás de IOS", dorso: "? (qué escribir) · Tab (completa) · abreviar (conf t, sh ip int br) · do show desde configuración." }
