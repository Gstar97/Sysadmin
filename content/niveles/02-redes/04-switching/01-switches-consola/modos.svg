<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <defs><marker id="fm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="20" y="26" font-weight="700" fill="currentColor">Los modos de Cisco IOS: se baja un escalón por vez</text>
  <g stroke="currentColor">
    <rect x="20" y="44" width="250" height="62" rx="8" fill="var(--surface-2, #f1f3f5)"/>
    <rect x="110" y="122" width="270" height="62" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="200" y="200" width="290" height="62" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="290" y="270" width="300" height="52" rx="8" fill="var(--ok-soft, #dcf3e6)"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="68" font-weight="700">EXEC de usuario</text><text x="186" y="68" font-family="ui-monospace, monospace">Switch&gt;</text>
    <text x="34" y="90" font-size="11.5">Mirar un poco (ping, show básicos). No cambia nada.</text>
    <text x="124" y="146" font-weight="700">EXEC privilegiado</text><text x="290" y="146" font-family="ui-monospace, monospace">Switch#</text>
    <text x="124" y="168" font-size="11.5">Todos los show, guardar, reiniciar. Se entra con enable.</text>
    <text x="214" y="224" font-weight="700">Configuración global</text><text x="378" y="224" font-family="ui-monospace, monospace">Switch(config)#</text>
    <text x="214" y="246" font-size="11.5">Cambios de todo el equipo: hostname, VLAN, SSH.</text>
    <text x="304" y="292" font-weight="700">Interfaz</text><text x="420" y="292" font-family="ui-monospace, monospace">Switch(config-if)#</text>
    <text x="304" y="312" font-size="11.5">Cambios de un puerto: VLAN, modo, descripción.</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#fm)"><path d="M150 106 L150 120"/><path d="M240 184 L240 198"/><path d="M330 262 L330 268"/></g>
  <g fill="currentColor" font-size="11.5">
    <text x="160" y="117">enable</text><text x="250" y="195">configure terminal</text><text x="340" y="266">interface Fa0/1</text>
    <text x="620" y="68" font-weight="700">Para volver:</text>
    <text x="620" y="88">exit → un escalón arriba</text>
    <text x="620" y="108">end (o Ctrl+Z) → directo al #</text>
    <text x="620" y="128">disable → al &gt;</text>
    <text x="620" y="160" font-weight="700">Desde cualquier modo de config:</text>
    <text x="620" y="180">do show ip interface brief</text>
    <text x="620" y="212" font-weight="700">Ayuda:</text>
    <text x="620" y="232">? (qué puedo escribir acá)</text>
    <text x="620" y="252">Tab (completa) · abreviar: conf t</text>
  </g>
</svg>
