<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="210" y="24" text-anchor="middle" font-weight="700" fill="currentColor">EtherChannel: varios cables, un enlace</text>
  <text x="650" y="24" text-anchor="middle" font-weight="700" fill="currentColor">HSRP: dos routers, una puerta de enlace</text>
  <line x1="430" y1="36" x2="430" y2="320" stroke="currentColor" stroke-dasharray="4 5" opacity="0.5"/>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="160" y="52" width="100" height="40" rx="8" fill="var(--surface, #fff)"/>
    <rect x="160" y="212" width="100" height="40" rx="8" fill="var(--surface, #fff)"/>
    <rect x="490" y="52" width="130" height="50" rx="8" fill="var(--warn-soft, #fbf0d0)" stroke-width="3"/>
    <rect x="680" y="52" width="130" height="50" rx="8" fill="var(--surface, #fff)"/>
    <rect x="600" y="160" width="100" height="36" rx="8" fill="var(--surface, #fff)"/>
    <rect x="600" y="240" width="100" height="36" rx="6" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g stroke="currentColor" stroke-width="3">
    <line x1="190" y1="92" x2="190" y2="212"/>
    <line x1="210" y1="92" x2="210" y2="212"/>
    <line x1="230" y1="92" x2="230" y2="212"/>
  </g>
  <ellipse cx="210" cy="152" rx="44" ry="14" fill="none" stroke="var(--accent, #2a6df4)" stroke-width="2.5"/>
  <g stroke="currentColor" stroke-width="2">
    <line x1="555" y1="102" x2="630" y2="160"/>
    <line x1="745" y1="102" x2="670" y2="160"/>
    <line x1="650" y1="196" x2="650" y2="240"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="210" y="77" font-weight="700">SW1</text>
    <text x="210" y="237" font-weight="700">SW2</text>
    <text x="555" y="73" font-weight="700">R1 · activo</text>
    <text x="555" y="92" font-size="11" font-family="ui-monospace, monospace">.2 · prioridad 110</text>
    <text x="745" y="73" font-weight="700">R2 · en espera</text>
    <text x="745" y="92" font-size="11" font-family="ui-monospace, monospace">.3 · prioridad 100</text>
    <text x="650" y="183" font-weight="700">SW</text>
    <text x="650" y="263">PC · gw .254</text>
  </g>
  <g fill="currentColor" font-size="11">
    <text x="262" y="148">Po1: 3 × 1 Gb/s</text>
    <text x="262" y="163">STP lo ve como uno</text>
    <text x="440" y="140">IP virtual 192.168.1.254</text>
    <text x="440" y="155">la tiene el activo</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="20" y="290">Si se corta un cable, el canal sigue con los otros.</text>
    <text x="20" y="308">Los dos extremos tienen que coincidir (LACP active/passive).</text>
    <text x="450" y="300">Si R1 se cae, R2 toma la IP virtual en segundos.</text>
    <text x="450" y="318">Las PC no cambian nada.</text>
  </g>
</svg>
