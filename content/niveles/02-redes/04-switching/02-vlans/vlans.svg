<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">Un switch físico, dos switches lógicos</text>
  <rect x="200" y="50" width="460" height="70" rx="10" fill="var(--surface-2, #f1f3f5)" stroke="currentColor"/>
  <rect x="214" y="62" width="210" height="46" rx="8" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <rect x="436" y="62" width="210" height="46" rx="8" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="319" y="82" font-weight="700">VLAN 10 · ADMIN</text><text x="319" y="99" font-size="11.5">Fa0/1 a Fa0/12</text>
    <text x="541" y="82" font-weight="700">VLAN 20 · VENTAS</text><text x="541" y="99" font-size="11.5">Fa0/13 a Fa0/24</text>
  </g>
  <g stroke="currentColor" fill="var(--surface, #fff)">
    <rect x="200" y="190" width="100" height="44" rx="6"/><rect x="320" y="190" width="100" height="44" rx="6"/>
    <rect x="440" y="190" width="100" height="44" rx="6"/><rect x="560" y="190" width="100" height="44" rx="6"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="12"><text x="250" y="216">Contable</text><text x="370" y="216">RR. HH.</text><text x="490" y="216">Vendedor 1</text><text x="610" y="216">Vendedor 2</text></g>
  <g stroke="var(--info, #3b6fd8)" stroke-width="3"><line x1="250" y1="190" x2="280" y2="108"/><line x1="370" y1="190" x2="360" y2="108"/></g>
  <g stroke="var(--warn, #b7791f)" stroke-width="3"><line x1="490" y1="190" x2="500" y2="108"/><line x1="610" y1="190" x2="580" y2="108"/></g>
  <g fill="currentColor" font-size="12">
    <text x="20" y="262">Los de la VLAN 10 se ven entre sí; los de la 20, también. Entre una VLAN y otra no pasa nada, ni siquiera un</text>
    <text x="20" y="282">broadcast: son redes distintas (cada una con su subred), y para unirlas hace falta un router (lección 4).</text>
  </g>
</svg>
