- { id: t1, frente: "VLAN", dorso: "Divide un switch en switches lógicos. Cada VLAN es su dominio de broadcast. Entre VLAN, solo con un router." }
- { id: t2, frente: "Crear una VLAN", dorso: "vlan 10 → name ADMIN. Revisar con show vlan brief." }
- { id: t3, frente: "Puerto de acceso", dorso: "switchport mode access + switchport access vlan N. Una sola VLAN; las tramas salen sin marca." }
- { id: t4, frente: "Una VLAN, una subred", dorso: "VLAN 10 → 192.168.10.0/24. Para hablar directo: misma VLAN y misma subred." }
- { id: t5, frente: "VLAN 1 y puertos libres", dorso: "VLAN 1 (fábrica) no se usa para datos. Puertos libres: VLAN sin salida + shutdown." }
