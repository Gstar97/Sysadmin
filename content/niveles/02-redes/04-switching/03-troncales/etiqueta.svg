<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">Entre switches, cada trama lleva una etiqueta con su VLAN</text>
  <g stroke="currentColor">
    <rect x="20" y="44" width="120" height="44" rx="8" fill="var(--surface, #fff)"/>
    <rect x="720" y="44" width="120" height="44" rx="8" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-weight="700"><text x="80" y="71">SW1</text><text x="780" y="71">SW2</text></g>
  <line x1="140" y1="66" x2="720" y2="66" stroke="currentColor" stroke-width="4"/>
  <text x="430" y="58" text-anchor="middle" fill="currentColor" font-size="12">troncal 802.1Q: lleva las VLAN 10, 20 y 99</text>
  <g stroke="currentColor">
    <rect x="120" y="120" width="110" height="44" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="230" y="120" width="110" height="44" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="340" y="120" width="110" height="44" fill="var(--warn, #b7791f)"/>
    <rect x="450" y="120" width="80" height="44" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="530" y="120" width="160" height="44" fill="var(--accent-soft, #d9efe9)"/>
    <rect x="690" y="120" width="60" height="44" fill="var(--surface-2, #f1f3f5)"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="12">
    <text x="175" y="140" font-weight="700">MAC destino</text><text x="175" y="156">6 bytes</text>
    <text x="285" y="140" font-weight="700">MAC origen</text><text x="285" y="156">6 bytes</text>
    <text x="395" y="140" font-weight="700" fill="var(--accent-fg, #fff)">802.1Q</text><text x="395" y="156" fill="var(--accent-fg, #fff)">4 bytes: VLAN 20</text>
    <text x="490" y="140" font-weight="700">Tipo</text><text x="490" y="156">0800</text>
    <text x="610" y="140" font-weight="700">Datos</text><text x="610" y="156">el paquete IP</text>
    <text x="720" y="146" font-weight="700">FCS</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="20" y="196">• La etiqueta se agrega al salir por un troncal y se quita al llegar al switch del otro lado: las PC nunca la ven.</text>
    <text x="20" y="218">• Tiene 12 bits para el número de VLAN: de 1 a 4094.</text>
    <text x="20" y="240">• La VLAN nativa viaja SIN etiqueta. Si cada extremo tiene una nativa distinta, las tramas sin etiqueta "cambian" de VLAN</text>
    <text x="34" y="258">al cruzar el troncal: un error de seguridad y de conectividad.</text>
    <text x="20" y="282">• Allowed: solo pasan las VLAN de la lista. Una VLAN que falta en la lista no cruza, aunque exista en los dos switches.</text>
  </g>
</svg>
