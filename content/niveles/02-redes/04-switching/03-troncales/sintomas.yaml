tipo: emparejar
consigna: Une cada síntoma con la falla más probable del troncal.
pares:
  - { a: "Una VLAN se ve entre pisos y otra no", b: "La VLAN que falla no está en la lista allowed de un extremo" }
  - { a: "Ninguna VLAN cruza y el puerto de un lado está en modo acceso", b: "Un extremo es troncal y el otro de acceso" }
  - { a: "Los equipos sin VLAN asignada aparecen en otra red al cruzar", b: "VLAN nativa distinta en cada extremo" }
  - { a: "La VLAN 30 existe en SW1 pero no cruza aunque está permitida", b: "La VLAN 30 no existe en SW2" }
explicacion: >-
  show interfaces trunk en los dos extremos responde casi todo: modo, nativa y VLAN
  permitidas y activas.
