- { id: t1, frente: "Troncal 802.1Q", dorso: "Un enlace con muchas VLAN. Etiqueta de 4 bytes con la VLAN (12 bits: 1 a 4094); se pone al salir y se saca al llegar." }
- { id: t2, frente: "VLAN nativa", dorso: "Viaja sin etiqueta. Misma en los dos extremos; mejor una sin datos (99) que la 1." }
- { id: t3, frente: "Configurar un troncal", dorso: "switchport mode trunk · switchport trunk native vlan 99 · switchport trunk allowed vlan 10,20,99 · switchport nonegotiate." }
- { id: t4, frente: "add y remove", dorso: "switchport trunk allowed vlan add 30 (suma) / remove 30 (saca). Sin add, se reemplaza toda la lista." }
- { id: t5, frente: "Diagnosticar un troncal", dorso: "show interfaces trunk en los dos extremos: modo, nativa, permitidas y activas. Comparar." }
