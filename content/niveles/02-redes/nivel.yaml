id: n2
titulo: Redes
descripcion: 'Redes desde el cable hasta la VPN: modelos de capas, Ethernet, IPv4 con mucha práctica de
  subnetting, IPv6, servicios de red (DNS, DHCP, NAT), switching, routing, firewalls, VPN, Wi-Fi empresarial
  y diagnóstico con capturas de tráfico. La configuración de equipos se practica con sintaxis tipo Cisco
  IOS (la más pedida en el mercado y en CCNA) y con Linux como router y firewall.'
perfil_salida: Diseñar el direccionamiento de una empresa, configurar VLANs, routing estático y OSPF,
  montar DNS, DHCP, firewall y VPN, y diagnosticar fallas de red con método y con capturas de tráfico.
  Cubre la mayor parte de los temas de CCNA y Network+.
insignia:
  nombre: Redes
  color: '#7c3aed'
proyecto_plan:
  titulo: Red de una empresa con dos sedes
  horas: 24
  entregables:
  - Plan de direccionamiento VLSM en IPv4 y de prefijos IPv6, documentado.
  - VLANs por área, troncales, enrutamiento entre VLANs y STP protegido.
  - OSPF entre sedes, OPNsense con DMZ y VPN WireGuard sitio a sitio.
  - DNS y DHCP en Linux.
  - Diagramas lógico y físico y pruebas de conectividad respaldadas con capturas.
