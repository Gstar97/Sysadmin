tipo: emparejar
consigna: Une cada protocolo con su descripción.
pares:
  - { a: "RIP", b: "Vector distancia; cuenta saltos y no pasa de 15. Hoy casi solo se ve en redes viejas o en laboratorios" }
  - { a: "OSPF", b: "Estado de enlace, estándar abierto; el IGP más usado en empresas" }
  - { a: "EIGRP", b: "Vector distancia avanzado, creado por Cisco; se ve en redes con mucho equipo Cisco" }
  - { a: "IS-IS", b: "Estado de enlace, muy usado dentro de las redes de los proveedores de internet" }
  - { a: "BGP", b: "Entre sistemas autónomos: el protocolo que une las redes que forman internet" }
explicacion: >-
  En una empresa típica vas a ver OSPF adentro y, si tiene dos proveedores de internet con sus
  propias direcciones públicas, BGP hacia afuera. RIP sirve para entender la idea de vector
  distancia, pero no conviene en una red nueva.
