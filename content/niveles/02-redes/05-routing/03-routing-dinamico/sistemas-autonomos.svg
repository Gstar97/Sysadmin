<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Adentro de cada red, un IGP; entre redes, BGP</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="50" width="250" height="180" rx="14" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="320" y="50" width="220" height="180" rx="14" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="590" y="50" width="250" height="180" rx="14" fill="var(--ok-soft, #dcf3e6)"/>
  </g>
  <g fill="currentColor" font-weight="700" text-anchor="middle">
    <text x="145" y="72">Tu empresa</text>
    <text x="430" y="72">Proveedor de internet</text>
    <text x="715" y="72">Otro proveedor</text>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="11">
    <text x="145" y="88">(un sistema autónomo)</text>
    <text x="430" y="88">AS 64500 (ejemplo)</text>
    <text x="715" y="88">AS 64510 (ejemplo)</text>
  </g>
  <g stroke="currentColor" stroke-width="2">
    <line x1="70" y1="130" x2="150" y2="110"/><line x1="150" y1="110" x2="220" y2="150"/><line x1="70" y1="130" x2="130" y2="185"/><line x1="130" y1="185" x2="220" y2="150"/>
    <line x1="380" y1="120" x2="480" y2="120"/><line x1="380" y1="120" x2="430" y2="185"/><line x1="480" y1="120" x2="430" y2="185"/>
    <line x1="650" y1="120" x2="780" y2="120"/><line x1="650" y1="120" x2="715" y2="185"/><line x1="780" y1="120" x2="715" y2="185"/>
  </g>
  <g fill="var(--surface, #fff)" stroke="currentColor" stroke-width="1.5">
    <circle cx="70" cy="130" r="12"/><circle cx="150" cy="110" r="12"/><circle cx="220" cy="150" r="12"/><circle cx="130" cy="185" r="12"/>
    <circle cx="380" cy="120" r="12"/><circle cx="480" cy="120" r="12"/><circle cx="430" cy="185" r="12"/>
    <circle cx="650" cy="120" r="12"/><circle cx="780" cy="120" r="12"/><circle cx="715" cy="185" r="12"/>
  </g>
  <g stroke="var(--accent, #2a6df4)" stroke-width="3.5" stroke-dasharray="9 5">
    <line x1="232" y1="150" x2="368" y2="120"/>
    <line x1="492" y1="120" x2="638" y2="120"/>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="145" y="215">OSPF: rutas internas, rápido</text>
    <text x="430" y="215">OSPF o IS-IS adentro</text>
    <text x="715" y="215">OSPF o IS-IS adentro</text>
    <text x="300" y="112" fill="var(--accent, #2a6df4)" font-weight="700">BGP</text>
    <text x="565" y="110" fill="var(--accent, #2a6df4)" font-weight="700">BGP</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="20" y="262">IGP (OSPF, IS-IS, EIGRP, RIP): busca el camino más corto dentro de una organización.</text>
    <text x="20" y="282">EGP (BGP): intercambia rutas entre organizaciones según acuerdos y políticas, no solo por distancia.</text>
  </g>
</svg>
