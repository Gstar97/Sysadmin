- { id: t1, frente: "Vector distancia", dorso: "Cada router repite lo que le cuentan sus vecinos (destino, costo, vecino). Lento ante cambios. RIP, EIGRP." }
- { id: t2, frente: "Estado de enlace", dorso: "Todos conocen el mapa completo y calculan con Dijkstra. Rápido ante cambios. OSPF, IS-IS." }
- { id: t3, frente: "Convergencia", dorso: "El momento en que todas las tablas están al día después de un cambio." }
- { id: t4, frente: "IGP y EGP", dorso: "IGP: dentro de un sistema autónomo (OSPF, IS-IS, EIGRP, RIP). EGP: entre sistemas autónomos (BGP)." }
- { id: t5, frente: "BGP", dorso: "Une los sistemas autónomos de internet. Elige por políticas y AS_PATH. Hace falta con dos proveedores y direcciones propias." }
