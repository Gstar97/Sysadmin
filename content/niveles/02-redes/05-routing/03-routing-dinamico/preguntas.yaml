- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Qué ventaja principal tiene un protocolo de enrutamiento dinámico sobre las rutas estáticas?
  opciones:
    - { texto: "Los routers arman y corrigen sus tablas solos cuando algo cambia", correcta: true, explicacion: "Sin tocar cada equipo a mano." }
    - { texto: "Es más seguro", explicacion: "No necesariamente: hay que protegerlo." }
    - { texto: "No usa tabla de rutas", explicacion: "Escribe rutas en la misma tabla." }
    - { texto: "Hace los enlaces más rápidos", explicacion: "No cambia la velocidad del enlace." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: En un protocolo de estado de enlace, ¿qué conoce cada router?
  opciones:
    - { texto: "El mapa completo de la red, y calcula él mismo los caminos", correcta: true, explicacion: "Con el algoritmo de Dijkstra." }
    - { texto: "Solo lo que le cuentan sus vecinos", explicacion: "Eso es vector distancia." }
    - { texto: "Solo sus redes conectadas", explicacion: "Conoce todo el mapa de su área." }
    - { texto: "Las rutas de internet", explicacion: "Eso es BGP." }
- id: p03
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Cuál de estos es un protocolo de vector distancia?
  opciones:
    - { texto: "RIP", correcta: true, explicacion: "Cuenta saltos y repite lo que oye de sus vecinos." }
    - { texto: "OSPF", explicacion: "Es de estado de enlace." }
    - { texto: "IS-IS", explicacion: "Es de estado de enlace." }
    - { texto: "STP", explicacion: "No es un protocolo de enrutamiento." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué es la convergencia?
  opciones:
    - { texto: "El momento en que todos los routers tienen la tabla correcta después de un cambio", correcta: true, explicacion: "Mientras no converge, se pierden paquetes." }
    - { texto: "La velocidad del enlace más lento", explicacion: "No tiene relación." }
    - { texto: "Juntar dos redes en una", explicacion: "Eso sería sumarización." }
    - { texto: "El tiempo que tarda un ping", explicacion: "No." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Entre dos sedes hay un camino de un salto por un enlace de 10 Mb/s y otro de dos saltos por enlaces de 1 Gb/s. ¿Cuál elige RIP?
  opciones:
    - { texto: "El de un salto, aunque sea el lento: RIP solo cuenta saltos", correcta: true, explicacion: "Por eso no conviene en redes con enlaces de velocidades distintas." }
    - { texto: "El de 1 Gb/s, porque es más rápido", explicacion: "RIP no mira la velocidad; OSPF sí (por el costo)." }
    - { texto: "Los dos, repartiendo el tráfico", explicacion: "Solo reparte entre caminos con la misma cantidad de saltos." }
    - { texto: "Ninguno", explicacion: "Elige uno." }
- id: p06
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué es un sistema autónomo (AS)?
  opciones:
    - { texto: "Una red bajo una misma administración y política de enrutamiento, con su número (ASN)", correcta: true, explicacion: "Un proveedor, una nube, una universidad." }
    - { texto: "Un router que funciona sin configuración", explicacion: "No." }
    - { texto: "Una VLAN aislada", explicacion: "No." }
    - { texto: "Un servidor DHCP", explicacion: "No." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué protocolo intercambia rutas entre los sistemas autónomos de internet?
  opciones:
    - { texto: "BGP", correcta: true, explicacion: "Es el único EGP en uso." }
    - { texto: "OSPF", explicacion: "Es un IGP." }
    - { texto: "RIP", explicacion: "Es un IGP." }
    - { texto: "DNS", explicacion: "Resuelve nombres, no rutas." }
- id: p08
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Una empresa tiene un solo proveedor de internet. ¿Necesita BGP?
  opciones:
    - { texto: "No: con una ruta por defecto hacia el proveedor alcanza", correcta: true, explicacion: "BGP tiene sentido con dos proveedores y direcciones propias." }
    - { texto: "Sí, siempre para salir a internet", explicacion: "El proveedor se encarga." }
    - { texto: "Sí, para que funcione el DNS", explicacion: "No tiene relación." }
    - { texto: "Solo si usa IPv6", explicacion: "No depende de eso." }
- id: p09
  tipo: opcion_multiple
  dificultad: 3
  enunciado: ¿En qué se diferencia la forma de elegir rutas de BGP de la de OSPF?
  opciones:
    - { texto: "BGP elige según políticas y la lista de AS; OSPF, por el costo más bajo", correcta: true, explicacion: "Lo que conviene no siempre es lo más corto." }
    - { texto: "BGP siempre elige el camino más corto", explicacion: "Elige por políticas." }
    - { texto: "Son iguales, pero BGP es más rápido", explicacion: "BGP converge más lento." }
    - { texto: "OSPF elige por la lista de AS", explicacion: "Eso es BGP." }
