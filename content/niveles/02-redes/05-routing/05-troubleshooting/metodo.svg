<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="mt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Seguir el paquete salto por salto, de ida y de vuelta</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="50" width="150" height="90" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="200" y="50" width="200" height="90" rx="10" fill="var(--surface, #fff)"/>
    <rect x="430" y="50" width="200" height="90" rx="10" fill="var(--surface, #fff)"/>
    <rect x="660" y="50" width="180" height="90" rx="10" fill="var(--ok-soft, #dcf3e6)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.8" marker-end="url(#mt-a)">
    <line x1="170" y1="80" x2="198" y2="80"/><line x1="400" y1="80" x2="428" y2="80"/><line x1="630" y1="80" x2="658" y2="80"/>
  </g>
  <g stroke="var(--warn, #a16207)" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mt-a)">
    <line x1="660" y1="118" x2="632" y2="118"/><line x1="430" y1="118" x2="402" y2="118"/><line x1="200" y1="118" x2="172" y2="118"/>
  </g>
  <g fill="currentColor">
    <text x="32" y="72" font-weight="700">1. El origen</text>
    <text x="32" y="92" font-size="11.5">IP, máscara y</text>
    <text x="32" y="108" font-size="11.5">puerta de enlace</text>
    <text x="32" y="124" font-size="11.5">¿llega a su gateway?</text>
    <text x="212" y="72" font-weight="700">2. Cada router de ida</text>
    <text x="212" y="92" font-size="11.5">show ip route IP-DESTINO</text>
    <text x="212" y="108" font-size="11.5">¿hay ruta? ¿al vecino correcto?</text>
    <text x="212" y="124" font-size="11.5">¿la interfaz está arriba?</text>
    <text x="442" y="72" font-weight="700">3. Cada router de vuelta</text>
    <text x="442" y="92" font-size="11.5">show ip route IP-ORIGEN</text>
    <text x="442" y="108" font-size="11.5">el mismo control, al revés</text>
    <text x="442" y="124" font-size="11.5">(la vuelta puede ir por otro lado)</text>
    <text x="672" y="72" font-weight="700">4. El destino</text>
    <text x="672" y="92" font-size="11.5">su puerta de enlace</text>
    <text x="672" y="108" font-size="11.5">y su firewall</text>
    <text x="672" y="124" font-size="11.5">¿responde a otros?</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="20" y="175" font-weight="700" font-size="12.5">Lo que dice traceroute</text>
    <text x="20" y="195">• Asteriscos desde un salto en adelante: el último que respondió tiene la ruta mala o no tiene ruta de vuelta.</text>
    <text x="20" y="213">• Un salto que no esperabas (otra sede, internet): una ruta equivocada en el salto anterior.</text>
    <text x="20" y="231">• Las mismas IP repitiéndose (A, B, A, B...): un bucle de enrutamiento entre esos dos routers.</text>
    <text x="20" y="249">• Un salto con * en el medio pero el destino llega: ese router no contesta traceroute; no es una falla.</text>
    <text x="20" y="275" font-weight="700" font-size="12.5">Ruta asimétrica: ida por un camino y vuelta por otro. Funciona... salvo que haya un firewall con estado en uno solo.</text>
  </g>
</svg>
