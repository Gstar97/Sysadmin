- { id: t1, frente: "Método de routing", dorso: "Origen (IP, máscara, gateway) → cada router de ida (show ip route DESTINO) → cada router de vuelta (show ip route ORIGEN) → destino." }
- { id: t2, frente: "Leer traceroute", dorso: "Se corta: mirar el último que respondió y el siguiente. Salto inesperado: ruta mala antes. IP repetidas: bucle." }
- { id: t3, frente: "traceroute en cada sistema", dorso: "Linux: traceroute -n / mtr -n · Windows: tracert -d · IOS: traceroute." }
- { id: t4, frente: "Ruta asimétrica", dorso: "Ida por un camino, vuelta por otro. Rompe firewalls con estado que ven un solo sentido." }
- { id: t5, frente: "Rutas viejas", dorso: "Una estática olvidada gana a OSPF (1 contra 110) o una más específica se lleva tráfico. Llevar inventario de rutas y rangos." }
