- { id: t1, frente: "Tabla de rutas", dorso: "Por cada red: interfaz de salida y siguiente salto. Fuentes: conectadas (C/L), estáticas (S), dinámicas (O, D, B, R)." }
- { id: t2, frente: "Por dónde sale un paquete", dorso: "Gana el prefijo más largo de las rutas que contienen el destino. Sin coincidencia ni por defecto: se descarta." }
- { id: t3, frente: "Qué ruta entra a la tabla", dorso: "Misma red y prefijo: menor distancia administrativa; en el mismo protocolo, menor métrica." }
- { id: t4, frente: "Distancias de Cisco", dorso: "Conectada 0 · estática 1 · eBGP 20 · EIGRP 90 · OSPF 110 · RIP 120 · iBGP 200." }
- { id: t5, frente: "Leer [110/3]", dorso: "Distancia administrativa 110 (OSPF) / métrica 3 (costo del camino)." }
- { id: t6, frente: "Ver la ruta para una IP", dorso: "IOS: show ip route 10.2.10.25 · Linux: ip route get 10.2.10.25 · Windows: Find-NetRoute -RemoteIPAddress." }
