<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="dr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Dos momentos distintos: armar la tabla y usarla</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="44" width="390" height="130" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="450" y="44" width="390" height="130" rx="10" fill="var(--ok-soft, #dcf3e6)"/>
  </g>
  <g fill="currentColor">
    <text x="36" y="66" font-weight="700">1. Qué ruta entra a la tabla</text>
    <text x="36" y="88">Varias fuentes ofrecen la misma red con el mismo prefijo:</text>
    <text x="36" y="106" font-family="ui-monospace, monospace" font-size="11.5">172.16.5.0/24  estática (1) · OSPF (110) · RIP (120)</text>
    <text x="36" y="128">• Gana la menor distancia administrativa (confianza).</text>
    <text x="36" y="146">• Si es el mismo protocolo, gana la menor métrica.</text>
    <text x="36" y="164">• Pasa antes de que llegue ningún paquete.</text>
    <text x="466" y="66" font-weight="700">2. Por dónde sale un paquete</text>
    <text x="466" y="88">Llega un paquete para 10.20.5.140. Lo contienen:</text>
    <text x="466" y="106" font-family="ui-monospace, monospace" font-size="11.5">0.0.0.0/0 · 10.20.0.0/16 · 10.20.5.0/24 · 10.20.5.128/25</text>
    <text x="466" y="128">• Gana el prefijo más largo (la más específica): /25.</text>
    <text x="466" y="146">• La distancia y la métrica no se comparan aquí.</text>
    <text x="466" y="164">• Si nada coincide (ni la por defecto): se descarta.</text>
  </g>
  <line x1="410" y1="110" x2="448" y2="110" stroke="currentColor" stroke-width="2" marker-end="url(#dr-a)"/>
  <g stroke="currentColor" stroke-width="1.5" fill="var(--surface, #fff)">
    <rect x="20" y="200" width="820" height="112" rx="10"/>
  </g>
  <g fill="currentColor">
    <text x="36" y="222" font-weight="700">Cómo se lee una línea de show ip route</text>
    <text x="36" y="250" font-family="ui-monospace, monospace" font-size="13">O     10.20.5.0/24 [110/3] via 10.0.13.2, 00:05:12, GigabitEthernet0/2</text>
    <text x="36" y="280" font-size="11.5">código (O = OSPF)</text>
    <text x="170" y="280" font-size="11.5">red y prefijo</text>
    <text x="290" y="280" font-size="11.5">[distancia/métrica]</text>
    <text x="440" y="280" font-size="11.5">siguiente salto</text>
    <text x="560" y="280" font-size="11.5">hace cuánto</text>
    <text x="680" y="280" font-size="11.5">interfaz de salida</text>
    <text x="36" y="302" font-size="11.5">Otros códigos: C conectada · L la IP propia · S estática · S* estática por defecto · D EIGRP · R RIP · B BGP</text>
  </g>
</svg>
