<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="os-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>
  <text x="20" y="24" font-weight="700" fill="currentColor">1. De desconocidos a vecinos completos (adyacencia)</text>
  <g stroke="currentColor" stroke-width="1.5" fill="var(--surface, #fff)">
    <rect x="20" y="40" width="88" height="34" rx="6"/>
    <rect x="128" y="40" width="88" height="34" rx="6"/>
    <rect x="236" y="40" width="88" height="34" rx="6"/>
    <rect x="344" y="40" width="88" height="34" rx="6"/>
    <rect x="452" y="40" width="88" height="34" rx="6"/>
    <rect x="560" y="40" width="88" height="34" rx="6"/>
    <rect x="668" y="40" width="88" height="34" rx="6" fill="var(--ok-soft, #dcf3e6)" stroke-width="2.5"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-weight="700">
    <text x="64" y="62">Down</text><text x="172" y="62">Init</text><text x="280" y="62">2-Way</text><text x="388" y="62">ExStart</text><text x="496" y="62">Exchange</text><text x="604" y="62">Loading</text><text x="712" y="62">Full</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#os-a)">
    <line x1="108" y1="57" x2="126" y2="57"/><line x1="216" y1="57" x2="234" y2="57"/><line x1="324" y1="57" x2="342" y2="57"/><line x1="432" y1="57" x2="450" y2="57"/><line x1="540" y1="57" x2="558" y2="57"/><line x1="648" y1="57" x2="666" y2="57"/>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="172" y="92">oyó un saludo</text>
    <text x="280" y="92">se oyen los dos</text>
    <text x="442" y="92">intercambian lo que conoce cada uno</text>
    <text x="604" y="92">piden lo que falta</text>
    <text x="712" y="92">mismo mapa</text>
  </g>
  <text x="20" y="114" font-size="11.5" fill="currentColor">Para pasar de Init hacen falta: misma subred, misma área, mismos tiempos de saludo (10 s / 40 s), misma autenticación y MTU, y router-id distintos.</text>

  <text x="20" y="150" font-weight="700" fill="currentColor">2. En un segmento con switch: DR y BDR</text>
  <g stroke="currentColor" stroke-width="2">
    <line x1="80" y1="215" x2="190" y2="250"/><line x1="190" y1="190" x2="190" y2="250"/><line x1="300" y1="215" x2="190" y2="250"/><line x1="190" y1="290" x2="190" y2="262"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="30" y="195" width="100" height="36" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="140" y="160" width="100" height="36" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="250" y="195" width="100" height="36" rx="8" fill="var(--surface, #fff)"/>
    <rect x="140" y="280" width="100" height="36" rx="8" fill="var(--surface, #fff)"/>
    <rect x="160" y="244" width="60" height="22" rx="4" fill="var(--surface-2, #eef0f3)"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="11.5">
    <text x="80" y="217" font-weight="700">R1 · DR</text>
    <text x="190" y="182" font-weight="700">R2 · BDR</text>
    <text x="300" y="217">R3 · DROTHER</text>
    <text x="190" y="302">R4 · DROTHER</text>
    <text x="190" y="259" font-size="10.5">switch</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="380" y="180">• Todos le cuentan los cambios al DR, y el DR los reparte:</text>
    <text x="392" y="198">no hace falta que cada uno hable con cada uno.</text>
    <text x="380" y="220">• Gana la prioridad de interfaz más alta (1 de fábrica; 0 = nunca),</text>
    <text x="392" y="238">y si empatan, el router-id más alto. El BDR reemplaza al DR.</text>
    <text x="380" y="260">• Entre dos DROTHER el estado queda en 2-WAY: es normal.</text>
    <text x="380" y="282">• En un enlace punto a punto (/30, /31) no hay DR.</text>
  </g>
  <text x="20" y="334" font-size="11.5" fill="currentColor">Costo de un enlace = ancho de banda de referencia (100 Mb/s de fábrica) ÷ ancho de banda: FastEthernet 1, Gigabit 1, 10 Gigabit 1. Por eso se sube la referencia.</text>
</svg>
