- { id: t1, frente: "Saludos de OSPF", dorso: "Hello cada 10 s a 224.0.0.5; vecino caído a los 40 s (dead interval)." }
- { id: t2, frente: "Estados de una adyacencia", dorso: "Down → Init → 2-Way → ExStart → Exchange → Loading → Full." }
- { id: t3, frente: "Para que dos routers sean vecinos", dorso: "Misma subred, área, tiempos, autenticación y MTU; router ID distintos; interfaz no pasiva." }
- { id: t4, frente: "DR y BDR", dorso: "En segmentos con switch. Gana la prioridad más alta (1 de fábrica, 0 = nunca) y después el router ID. Entre DROTHER: 2-WAY." }
- { id: t5, frente: "Costo de OSPF", dorso: "Referencia ÷ ancho de banda (100 Mb/s de fábrica). Subir con auto-cost reference-bandwidth en todos." }
- { id: t6, frente: "OSPF en IOS", dorso: "router ospf 1 · router-id · network RED WILDCARD area 0 · passive-interface · default-information originate." }
- { id: t7, frente: "OSPF en FRR", dorso: "ospfd=yes en /etc/frr/daemons · frr.conf con network RED/PREFIJO area 0 y ospf router-id · vtysh · ip_forward." }
