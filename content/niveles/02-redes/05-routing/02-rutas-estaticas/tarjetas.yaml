- { id: t1, frente: "Ruta estática en IOS", dorso: "ip route RED MÁSCARA SIGUIENTE-SALTO [distancia]. Por defecto: ip route 0.0.0.0 0.0.0.0 IP." }
- { id: t2, frente: "Ruta de vuelta", dorso: "Cada router decide con su tabla: el otro lado también necesita saber volver (ruta o ruta por defecto)." }
- { id: t3, frente: "Ruta flotante", dorso: "La misma red con distancia mayor que la principal. Entra solo si la principal desaparece. Para respaldar OSPF: más de 110." }
- { id: t4, frente: "Rutas en Linux", dorso: "ip route add/del/get. Permanente: nmcli connection modify IF +ipv4.routes \"RED VIA\" o routes (to/via) en netplan." }
- { id: t5, frente: "Linux como router", dorso: "net.ipv4.ip_forward = 1 (sysctl -w para ahora; /etc/sysctl.d/ para siempre) y revisar el firewall." }
