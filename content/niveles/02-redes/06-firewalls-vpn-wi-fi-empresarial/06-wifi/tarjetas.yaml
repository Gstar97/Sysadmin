- { id: t2, frente: "Canales de 2,4 GHz", dorso: "Solo 1, 6 y 11 no se pisan. Mismo canal: se turnan. Canales que se pisan: se hacen ruido." }
- { id: t3, frente: "Personal y Enterprise", dorso: "Personal: clave compartida (invitados). Enterprise: 802.1X con RADIUS, cada uno con lo suyo (empleados)." }
- { id: t4, frente: "802.1X", dorso: "Suplicante (equipo) → autenticador (AP) → RADIUS (FreeRADIUS o NPS). PEAP con validación de certificado o EAP-TLS." }
- { id: t5, frente: "SSID y VLAN", dorso: "Cada SSID a su VLAN por un troncal. RADIUS puede asignar la VLAN por usuario. Pocos SSID." }
