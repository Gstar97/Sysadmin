- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Cuáles son los canales de 2,4 GHz que no se pisan entre sí?
  opciones:
    - { texto: "1, 6 y 11", correcta: true, explicacion: "Cada canal ocupa 20 MHz y están separados 5 MHz." }
    - { texto: "1, 2 y 3", explicacion: "Se pisan entre sí." }
    - { texto: "Todos", explicacion: "Solo tres no se pisan." }
    - { texto: "36, 40 y 44", explicacion: "Esos son de 5 GHz." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Por qué en una empresa se usa WPA3-Enterprise y no una clave compartida para los empleados?
  opciones:
    - { texto: "Porque cada persona entra con sus credenciales y, si se va, alcanza con desactivar su cuenta", correcta: true, explicacion: "Con una clave compartida habría que cambiarla para todos." }
    - { texto: "Porque es más rápido", explicacion: "No cambia la velocidad." }
    - { texto: "Porque no necesita servidor", explicacion: "Necesita RADIUS." }
    - { texto: "Porque funciona solo en 6 GHz", explicacion: "No." }
- id: p03
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué agrega Wi-Fi 6E respecto de Wi-Fi 6?
  opciones:
    - { texto: "La banda de 6 GHz, más limpia, donde se exige WPA3", correcta: true, explicacion: "Según lo habilite cada país." }
    - { texto: "Canales de 320 MHz", explicacion: "Eso es Wi-Fi 7." }
    - { texto: "Solo cambia el nombre", explicacion: "Agrega una banda." }
    - { texto: "Quita la banda de 2,4 GHz", explicacion: "No." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Dos puntos de acceso vecinos usan los canales 1 y 3 de 2,4 GHz. ¿Qué pasa?
  opciones:
    - { texto: "Sus canales se pisan: cada uno es ruido para el otro, peor que si compartieran el mismo canal", correcta: true, explicacion: "En el mismo canal se turnan; en canales que se pisan, se interfieren." }
    - { texto: "Nada: son canales distintos", explicacion: "Distintos, pero superpuestos." }
    - { texto: "Se suman las velocidades", explicacion: "No." }
    - { texto: "Se apaga uno", explicacion: "No." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: En 802.1X, ¿quién decide si un usuario puede entrar?
  opciones:
    - { texto: "El servidor RADIUS, que consulta el directorio; el punto de acceso solo pasa los mensajes", correcta: true, explicacion: "Por eso el AP no guarda credenciales." }
    - { texto: "El punto de acceso", explicacion: "Solo es el intermediario." }
    - { texto: "El switch", explicacion: "No en Wi-Fi." }
    - { texto: "El DHCP", explicacion: "Entrega la IP después." }
- id: p06
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Cómo se separa la red de invitados de la de empleados si los dos SSID salen del mismo punto de acceso?
  opciones:
    - { texto: "Cada SSID va a su VLAN por un troncal, y el firewall solo deja a los invitados salir a internet", correcta: true, explicacion: "Es la misma idea que con cable." }
    - { texto: "Con claves distintas alcanza", explicacion: "Sin VLAN distintas, quedarían en la misma red." }
    - { texto: "No se puede: hacen falta dos AP", explicacion: "Un AP emite varios SSID." }
    - { texto: "Con canales distintos", explicacion: "El canal no separa redes." }
- id: p07
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Con PEAP-MSCHAPv2, ¿por qué es importante que los equipos validen el certificado del servidor RADIUS?
  opciones:
    - { texto: "Porque si no, un punto de acceso falso puede hacerse pasar por la red y recibir las credenciales", correcta: true, explicacion: "La validación prueba que el servidor es el de la empresa." }
    - { texto: "Porque si no, la conexión es más lenta", explicacion: "No." }
    - { texto: "Para que funcione el DHCP", explicacion: "No." }
    - { texto: "No es importante", explicacion: "Es clave para la seguridad de PEAP." }
- id: p08
  tipo: opcion_multiple
  dificultad: 2
  enunciado: En una oficina con muchos puntos de acceso en 5 GHz, ¿qué ancho de canal conviene?
  opciones:
    - { texto: "20 o 40 MHz: quedan más canales para repartir entre vecinos", correcta: true, explicacion: "Con 80 MHz hay pocos bloques y los vecinos chocan." }
    - { texto: "Siempre 80 MHz, es más rápido", explicacion: "Para un AP solo; en conjunto, peor." }
    - { texto: "160 MHz", explicacion: "Todavía menos canales." }
    - { texto: "Da igual", explicacion: "No." }
- id: p09
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Para qué sirve una controladora de Wi-Fi?
  opciones:
    - { texto: "Para administrar todos los AP juntos (SSID, seguridad, canales) y ayudar al roaming", correcta: true, explicacion: "Puede ser un equipo, una máquina virtual o un servicio en la nube." }
    - { texto: "Para dar internet", explicacion: "No." }
    - { texto: "Para reemplazar al RADIUS", explicacion: "Trabaja con él." }
    - { texto: "Para alimentar los AP", explicacion: "Eso lo hace el PoE." }
