<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="dx-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">WPA3-Enterprise: cada usuario entra con lo suyo, y el AP le pregunta a RADIUS</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="50" width="160" height="70" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="350" y="50" width="160" height="70" rx="10" fill="var(--surface, #fff)"/>
    <rect x="680" y="50" width="160" height="70" rx="10" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="100" y="78" font-weight="700">Notebook</text><text x="100" y="96" font-size="11">suplicante</text><text x="100" y="110" font-size="11">(Windows, macOS, Android)</text>
    <text x="430" y="78" font-weight="700">Punto de acceso</text><text x="430" y="96" font-size="11">autenticador</text><text x="430" y="110" font-size="11">no sabe las contraseñas</text>
    <text x="760" y="78" font-weight="700">Servidor RADIUS</text><text x="760" y="96" font-size="11">FreeRADIUS o NPS</text><text x="760" y="110" font-size="11">consulta el directorio</text>
  </g>
  <g stroke="currentColor" stroke-width="1.6" marker-end="url(#dx-a)" fill="none">
    <line x1="180" y1="140" x2="348" y2="140"/>
    <line x1="510" y1="140" x2="678" y2="140"/>
    <line x1="678" y1="175" x2="512" y2="175"/>
    <line x1="348" y1="210" x2="182" y2="210"/>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="265" y="133">1. "Quiero entrar" (EAP)</text>
    <text x="595" y="133">2. Se lo pasa a RADIUS</text>
    <text x="595" y="168">3. Aceptado: usuario de Ventas, VLAN 20</text>
    <text x="265" y="203">4. Claves propias y VLAN 20</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="20" y="246">• PEAP-MSCHAPv2: usuario y contraseña del dominio, dentro de un túnel TLS. El equipo tiene que validar el certificado del servidor.</text>
    <text x="20" y="266">• EAP-TLS: un certificado por equipo o usuario, sin contraseñas. El más seguro; necesita repartir certificados.</text>
    <text x="20" y="286">• Si alguien se va de la empresa, se desactiva su cuenta y deja de entrar. Con una clave compartida, habría que cambiarla para todos.</text>
  </g>
</svg>
