- { id: t1, frente: "ACL estándar y extendida", dorso: "Estándar (1-99): solo origen. Extendida (100-199): protocolo, origen, destino y puertos. Las dos pueden ir con nombre." }
- { id: t2, frente: "Direcciones en una ACL", dorso: "RED WILDCARD (192.168.1.0 0.0.0.255) · host A · any. Puertos: eq, gt, lt, range." }
- { id: t3, frente: "Deny implícito", dorso: "Al final de toda ACL: deny ip any any. Para dejar pasar el resto, permit ip any any." }
- { id: t4, frente: "Aplicar una ACL", dorso: "ip access-group NOMBRE in|out, visto desde el router. Extendida cerca del origen; estándar cerca del destino." }
- { id: t5, frente: "Diagnosticar ACL", dorso: "show access-lists (contadores por línea) · show ip interface IF (qué ACL tiene)." }
