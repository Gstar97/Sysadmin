<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="se-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent, #2a6df4)"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">"in" y "out" se miran desde el router</text>
  <g stroke="currentColor" stroke-width="2">
    <line x1="160" y1="120" x2="340" y2="120"/>
    <line x1="520" y1="120" x2="700" y2="120"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="95" width="140" height="50" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="340" y="80" width="180" height="80" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="700" y="95" width="140" height="50" rx="8" fill="var(--ok-soft, #dcf3e6)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="90" y="116" font-weight="700">LAN</text><text x="90" y="133" font-size="11">192.168.1.0/24</text>
    <text x="430" y="104" font-weight="700">R1</text>
    <text x="370" y="148" font-size="11" font-family="ui-monospace, monospace">Gi0/0</text>
    <text x="490" y="148" font-size="11" font-family="ui-monospace, monospace">Gi0/1</text>
    <text x="770" y="116" font-weight="700">DMZ</text><text x="770" y="133" font-size="11">web 172.16.0.10</text>
  </g>
  <path d="M170 90 L330 90" stroke="var(--accent, #2a6df4)" stroke-width="2.5" marker-end="url(#se-a)" fill="none"/>
  <path d="M530 90 L690 90" stroke="var(--accent, #2a6df4)" stroke-width="2.5" marker-end="url(#se-a)" fill="none"/>
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="250" y="80">entra a R1 por Gi0/0: "in" en Gi0/0</text>
    <text x="610" y="80">sale de R1 por Gi0/1: "out" en Gi0/1</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="20" y="200" font-weight="700" font-size="12.5">Para filtrar lo que va de la LAN a la DMZ, sirve cualquiera de las dos:</text>
    <text x="20" y="220">• in en Gi0/0: se descarta apenas entra (no gasta trabajo del router), pero afecta todo lo que sale de la LAN.</text>
    <text x="20" y="238">• out en Gi0/1: afecta solo lo que va hacia la DMZ, venga de donde venga.</text>
    <text x="20" y="262" font-weight="700" font-size="12.5">Una por interfaz, por sentido y por protocolo (IPv4/IPv6). Estándar: cerca del destino. Extendida: cerca del origen.</text>
    <text x="20" y="284">Y al final de toda ACL, invisible: deny ip any any. Lo que no está permitido, se descarta.</text>
  </g>
</svg>
