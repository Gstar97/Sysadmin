<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="215" y="30" text-anchor="middle" font-weight="700" fill="currentColor">Sitio a sitio</text>
  <text x="645" y="30" text-anchor="middle" font-weight="700" fill="currentColor">Acceso remoto</text>
  <line x1="430" y1="44" x2="430" y2="185" stroke="currentColor" stroke-dasharray="4 5" opacity="0.5"/>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="60" width="140" height="66" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="270" y="60" width="140" height="66" rx="8" fill="var(--ok-soft, #dcf3e6)"/>
    <ellipse cx="215" cy="160" rx="70" ry="20" fill="var(--surface-2, #eef0f3)"/>
    <rect x="450" y="60" width="130" height="66" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="700" y="60" width="140" height="66" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <ellipse cx="640" cy="160" rx="70" ry="20" fill="var(--surface-2, #eef0f3)"/>
  </g>
  <g stroke="var(--accent, #2a6df4)" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M160 93 C200 120, 230 120, 270 93"/>
    <path d="M580 93 C620 120, 660 120, 700 93"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="90" y="86" font-weight="700">Central</text><text x="90" y="104" font-size="11">192.168.10.0/24</text><text x="90" y="118" font-size="11">firewall con VPN</text>
    <text x="340" y="86" font-weight="700">Sucursal</text><text x="340" y="104" font-size="11">10.2.0.0/24</text><text x="340" y="118" font-size="11">firewall con VPN</text>
    <text x="215" y="164" font-size="11">internet</text>
    <text x="515" y="86" font-weight="700">Portátil</text><text x="515" y="104" font-size="11">en un café</text><text x="515" y="118" font-size="11">app de VPN</text>
    <text x="770" y="86" font-weight="700">Central</text><text x="770" y="104" font-size="11">servidor VPN</text><text x="770" y="118" font-size="11">en el firewall</text>
    <text x="640" y="164" font-size="11">internet</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="200" width="400" height="110" rx="10" fill="var(--surface, #fff)"/>
    <rect x="440" y="200" width="400" height="110" rx="10" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor">
    <text x="36" y="224" font-weight="700">Túnel completo (AllowedIPs = 0.0.0.0/0)</text>
    <text x="36" y="246" font-size="11.5">Todo el tráfico del cliente va por la VPN, también internet.</text>
    <text x="36" y="264" font-size="11.5">+ la empresa filtra y registra todo lo que hace el equipo</text>
    <text x="36" y="282" font-size="11.5">− más carga en la central y más lento para navegar</text>
    <text x="456" y="224" font-weight="700">Túnel dividido (solo las redes de la empresa)</text>
    <text x="456" y="246" font-size="11.5">Por la VPN va solo lo de la empresa; internet sale directo.</text>
    <text x="456" y="264" font-size="11.5">+ rápido y liviano para la central</text>
    <text x="456" y="282" font-size="11.5">− lo que hace en internet no pasa por los controles</text>
  </g>
</svg>
