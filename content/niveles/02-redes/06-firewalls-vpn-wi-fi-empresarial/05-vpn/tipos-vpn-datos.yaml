tipo: diagrama
titulo: Tipos de VPN
puntos:
  - id: sitio
    titulo: Sitio a sitio
    area: { x: 2, y: 15, ancho: 47, alto: 42 }
    texto: >-
      Une dos redes completas a través de internet. El túnel lo arman los dos firewalls (o
      routers), y los equipos de cada sede no saben que existe: para ellos, la otra sede es una
      red más, con su ruta. Es lo que reemplazó a los enlaces dedicados entre sucursales.
  - id: remoto
    titulo: Acceso remoto
    area: { x: 51, y: 15, ancho: 47, alto: 42 }
    texto: >-
      Une un equipo suelto (una portátil, un teléfono) con la red de la empresa. El usuario usa
      una aplicación de VPN, que se autentica y le da una IP de la red del túnel. Es la forma
      segura de administrar o trabajar desde afuera sin publicar servicios en internet.
  - id: completo
    titulo: Túnel completo
    area: { x: 2, y: 60, ancho: 47, alto: 34 }
    texto: >-
      Todo el tráfico del cliente entra al túnel, también el de internet, que sale por la
      central. La empresa puede filtrar y registrar todo, pero la central carga con ese tráfico
      y la navegación del usuario se vuelve más lenta. En WireGuard es AllowedIPs = 0.0.0.0/0.
  - id: dividido
    titulo: Túnel dividido
    area: { x: 51, y: 60, ancho: 47, alto: 34 }
    texto: >-
      Por el túnel va solo lo que es para las redes de la empresa; el resto sale directo por la
      conexión del usuario. Es más liviano, pero lo que el equipo hace en internet no pasa por
      los controles de la empresa. En WireGuard, AllowedIPs lista solo las redes internas.
