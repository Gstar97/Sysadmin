- { id: t1, frente: "Tipos de VPN", dorso: "Sitio a sitio (dos redes, firewalls) · acceso remoto (un equipo). Túnel completo (todo) o dividido (solo la empresa)." }
- { id: t2, frente: "IPsec, WireGuard, OpenVPN", dorso: "IPsec/IKEv2: estándar entre fabricantes, UDP 500/4500. WireGuard: simple, UDP 51820. OpenVPN: TLS, UDP/TCP 1194." }
- { id: t3, frente: "Archivo de WireGuard", dorso: "[Interface] PrivateKey, Address, ListenPort · [Peer] PublicKey, AllowedIPs, Endpoint, PersistentKeepalive." }
- { id: t4, frente: "AllowedIPs", dorso: "Ruta y filtro a la vez: qué va por ese peer y qué se le acepta. Cada dirección, en un solo peer." }
- { id: t5, frente: "Comandos de WireGuard", dorso: "wg genkey | wg pubkey · wg-quick up wg0 · wg show (latest handshake) · systemctl enable --now wg-quick@wg0." }
