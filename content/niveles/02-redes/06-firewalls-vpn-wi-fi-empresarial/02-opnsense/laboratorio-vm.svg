<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">El laboratorio: OPNsense como firewall de tus máquinas virtuales</text>
  <g stroke="currentColor" stroke-width="2">
    <line x1="170" y1="150" x2="330" y2="150"/>
    <line x1="510" y1="120" x2="620" y2="80"/>
    <line x1="510" y1="180" x2="620" y2="225"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="105" width="150" height="90" rx="45" fill="var(--bad-soft, #fbe0dd)"/>
    <rect x="330" y="90" width="180" height="120" rx="10" fill="var(--warn-soft, #fbf0d0)" stroke-width="2.5"/>
    <rect x="620" y="40" width="220" height="80" rx="10" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="620" y="185" width="220" height="80" rx="10" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="95" y="140" font-weight="700">Tu casa / internet</text>
    <text x="95" y="158" font-size="11">adaptador NAT</text>
    <text x="95" y="174" font-size="11">(o puente)</text>
    <text x="420" y="114" font-weight="700">fw01 · OPNsense 26.7</text>
    <text x="420" y="136" font-size="11" font-family="ui-monospace, monospace">vtnet0 / em0 → WAN (DHCP)</text>
    <text x="420" y="154" font-size="11" font-family="ui-monospace, monospace">em1 → LAN 192.168.10.1/24</text>
    <text x="420" y="172" font-size="11" font-family="ui-monospace, monospace">em2 → DMZ 172.16.0.1/24</text>
    <text x="420" y="196" font-size="11">2 vCPU · 2 GiB · 20 GiB</text>
    <text x="730" y="64" font-weight="700">LAN · red interna "labred"</text>
    <text x="730" y="84" font-size="11">rocky01 .53 · ubuntu01 .54</text>
    <text x="730" y="102" font-size="11">gateway y DNS: 192.168.10.1</text>
    <text x="730" y="209" font-weight="700">DMZ · red interna "labdmz"</text>
    <text x="730" y="229" font-size="11">web01 (clon de ubuntu01) 172.16.0.10</text>
    <text x="730" y="247" font-size="11">gateway: 172.16.0.1</text>
  </g>
  <text x="20" y="288" font-size="11.5" fill="currentColor">El administrador entra a la interfaz web desde la LAN: https://192.168.10.1. Nunca se publica la administración en la WAN.</text>
</svg>
