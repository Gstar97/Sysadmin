tipo: emparejar
consigna: Uní cada sección de OPNsense con lo que se configura ahí.
pares:
  - { a: "Interfaces, Assignments", b: "Qué placa física o virtual es WAN, LAN, DMZ (y las VLAN)" }
  - { a: "Firewall, Aliases", b: "Nombres para grupos de redes, equipos o puertos, para usar en las reglas" }
  - { a: "Firewall, Rules, LAN", b: "Qué puede hacer el tráfico que entra desde la LAN" }
  - { a: "Firewall, NAT, Port Forward (Destination NAT)", b: "Publicar un servidor interno en un puerto de la IP pública" }
  - { a: "Firewall, NAT, Outbound (Source NAT)", b: "Cómo salen a internet las redes internas con la IP pública (automático de fábrica)" }
  - { a: "Firewall, Log Files, Live View", b: "Ver en tiempo real qué se permite y qué se bloquea, y qué regla lo decidió" }
explicacion: >-
  En las versiones más nuevas, algunas pantallas cambiaron de nombre al pasar al nuevo motor de
  la interfaz (por ejemplo, Port Forward aparece como Destination NAT y Outbound como Source NAT).
  Las ideas son las mismas.
