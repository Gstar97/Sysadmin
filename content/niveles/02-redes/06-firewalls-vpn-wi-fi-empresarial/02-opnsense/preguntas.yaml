- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Desde dónde se administra un OPNsense?
  opciones:
    - { texto: "Desde la LAN (o por VPN), nunca publicando la interfaz web en la WAN", correcta: true, explicacion: "La administración expuesta a internet es un blanco." }
    - { texto: "Desde la WAN, con una buena contraseña", explicacion: "Sigue siendo un riesgo innecesario." }
    - { texto: "Solo desde la consola", explicacion: "La web es lo habitual." }
    - { texto: "Desde la DMZ", explicacion: "No." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: Agregaste la interfaz DMZ (OPT1) y la activaste. ¿Qué tráfico deja salir de ella OPNsense?
  opciones:
    - { texto: "Ninguno: una interfaz OPT nueva no tiene reglas y todo se bloquea", correcta: true, explicacion: "Hay que permitir lo necesario." }
    - { texto: "Todo, como la LAN", explicacion: "Solo la LAN trae la regla de permitir todo." }
    - { texto: "Solo HTTP", explicacion: "No hay reglas." }
    - { texto: "Solo DNS", explicacion: "No hay reglas." }
- id: p03
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Para qué sirve un alias como PUERTOS_WEB (80, 443)?
  opciones:
    - { texto: "Para usar un nombre en las reglas y cambiar los valores en un solo lugar", correcta: true, explicacion: "Las reglas quedan más legibles." }
    - { texto: "Para abrir esos puertos en la WAN", explicacion: "Un alias no abre nada solo." }
    - { texto: "Para cambiar el puerto del servidor", explicacion: "No." }
    - { texto: "Para el DNS", explicacion: "No." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: En el laboratorio, la WAN de OPNsense está en la red de tu casa (192.168.0.0/24). Pruebas la redirección de puertos desde tu computadora y no llega nada a las reglas. ¿Qué revisas?
  opciones:
    - { texto: "La casilla Block private networks de la WAN, que descarta lo que llega desde direcciones privadas", correcta: true, explicacion: "En una WAN real con IP pública, se deja activada." }
    - { texto: "El DNS del firewall", explicacion: "No interviene." }
    - { texto: "La regla anti-lockout", explicacion: "Es de la LAN." }
    - { texto: "El NAT de salida", explicacion: "Afecta lo que sale, no lo que entra." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Publicaste la web de la DMZ con una redirección del puerto 443. ¿Qué destino tiene la regla asociada en la WAN?
  opciones:
    - { texto: "La IP interna del servidor en la DMZ (172.16.0.10), puerto 443", correcta: true, explicacion: "La redirección se aplica antes que las reglas." }
    - { texto: "WAN address puerto 443", explicacion: "Ese es el destino original, antes de traducirse." }
    - { texto: "LAN net", explicacion: "No." }
    - { texto: "This Firewall", explicacion: "No va al firewall, va al servidor." }
- id: p06
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Dónde ves qué regla permitió o bloqueó un paquete en particular?
  opciones:
    - { texto: "En Firewall, Log Files, Live View (si la regla tiene registro activado)", correcta: true, explicacion: "Muestra cada paquete y la regla." }
    - { texto: "En System, Firmware", explicacion: "Es para actualizar." }
    - { texto: "En Interfaces, Assignments", explicacion: "Es para asignar placas." }
    - { texto: "En el DNS", explicacion: "No." }
- id: p07
  tipo: opcion_multiple
  dificultad: 3
  enunciado: El disco del firewall murió. ¿Qué te permite tenerlo igual que antes en minutos?
  opciones:
    - { texto: "Reinstalar OPNsense y subir la copia del XML de configuración", correcta: true, explicacion: "Toda la configuración está en ese archivo." }
    - { texto: "Volver a escribir las reglas mirando capturas", explicacion: "Lento y propenso a errores." }
    - { texto: "Nada: hay que empezar de cero", explicacion: "No si hay copia." }
    - { texto: "Copiar el disco de otro firewall", explicacion: "No." }
- id: p08
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Te bloqueaste el acceso web desde la LAN con una regla mal hecha. ¿Cómo lo arreglas?
  opciones:
    - { texto: "Desde la consola del equipo: shell (opción 8) y pfctl -d para desactivar el filtrado un momento, y corregir la regla", correcta: true, explicacion: "Después, el filtrado vuelve al aplicar las reglas." }
    - { texto: "Reinstalar todo", explicacion: "Innecesario." }
    - { texto: "Entrar desde la WAN", explicacion: "La WAN no permite administración." }
    - { texto: "Esperar a que se desbloquee solo", explicacion: "No pasa." }
