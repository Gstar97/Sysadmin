tipo: ordenar
consigna: Ordená los pasos para poner en marcha un firewall OPNsense nuevo.
pasos:
  - Crear la máquina virtual con tres adaptadores de red (WAN, LAN y DMZ) e instalar desde la imagen
  - En la consola, asignar cada interfaz (WAN, LAN, OPT1) y la IP de la LAN
  - Entrar a la interfaz web desde la LAN, completar el asistente y cambiar la contraseña de root
  - Actualizar el sistema (System, Firmware) antes de seguir
  - Renombrar OPT1 como DMZ, activarla y darle su IP
  - Crear los alias (redes, servidores, grupos de puertos)
  - Escribir las reglas de cada interfaz, de lo más específico a lo más general
  - Probar desde cada zona y revisar el registro del firewall (Live View)
  - Exportar una copia de la configuración (System, Configuration, Backups)
explicacion: >-
  El orden importa: la administración se entra siempre desde la LAN (por eso se configura
  primero), se actualiza antes de exponer nada y se guarda una copia de la configuración al
  terminar, porque es un solo archivo XML que restaura el firewall entero.
