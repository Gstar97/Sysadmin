- { id: t1, frente: "Cómo se evalúan las reglas", dorso: "De arriba hacia abajo, gana la primera que coincide; al final, bloquear todo (denegación por defecto)." }
- { id: t2, frente: "Con estado", dorso: "Recuerda las conexiones permitidas (tabla de estados): las respuestas vuelven solas." }
- { id: t3, frente: "DMZ", dorso: "Red aparte para servidores públicos. Recibe de internet solo su servicio y nunca inicia hacia la LAN." }
- { id: t4, frente: "Principios", dorso: "Denegación por defecto, mínimo privilegio y zonas por nivel de confianza." }
- { id: t5, frente: "Redirección y reglas", dorso: "El NAT de destino se aplica antes: la regla de WAN apunta a la IP interna del servidor." }
