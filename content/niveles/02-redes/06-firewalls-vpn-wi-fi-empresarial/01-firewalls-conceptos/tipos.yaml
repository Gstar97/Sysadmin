tipo: emparejar
consigna: Une cada tipo de firewall con lo que puede decidir.
pares:
  - { a: "Sin estado (ACL de un router)", b: "Mira cada paquete por separado: IP, protocolo y puerto. Para dejar volver las respuestas hay que escribir reglas para ellas" }
  - { a: "Con estado (OPNsense, nftables, firewalld)", b: "Recuerda las conexiones abiertas: con permitir la ida, las respuestas pasan solas" }
  - { a: "De nueva generación (NGFW)", b: "Además reconoce aplicaciones y usuarios, y puede inspeccionar el contenido (prevención de intrusiones, filtrado web)" }
  - { a: "Del propio servidor (firewalld, ufw, Windows Defender Firewall)", b: "Protege un solo equipo, aunque el atacante ya esté dentro de la misma red" }
explicacion: >-
  No son excluyentes: una empresa típica tiene un firewall perimetral con estado (a veces NGFW),
  ACL en los equipos de red y el firewall de cada servidor. Es la defensa en capas.
