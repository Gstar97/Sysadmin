<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Zonas: cada una con su nivel de confianza, y el firewall en el medio</text>
  <g stroke="currentColor" stroke-width="2">
    <line x1="170" y1="160" x2="350" y2="160"/>
    <line x1="510" y1="140" x2="640" y2="80"/>
    <line x1="510" y1="180" x2="640" y2="240"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="115" width="150" height="90" rx="45" fill="var(--bad-soft, #fbe0dd)"/>
    <rect x="350" y="110" width="160" height="100" rx="10" fill="var(--warn-soft, #fbf0d0)" stroke-width="2.5"/>
    <rect x="640" y="40" width="200" height="90" rx="10" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="640" y="200" width="200" height="90" rx="10" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="95" y="150" font-weight="700">Internet (WAN)</text>
    <text x="95" y="168" font-size="11">confianza: ninguna</text>
    <text x="95" y="184" font-size="11">no se inicia nada hacia adentro</text>
    <text x="430" y="138" font-weight="700">Firewall</text>
    <text x="430" y="156" font-size="11">reglas por interfaz</text>
    <text x="430" y="172" font-size="11">tabla de estados</text>
    <text x="430" y="188" font-size="11">denegación por defecto</text>
    <text x="740" y="66" font-weight="700">LAN (empleados)</text>
    <text x="740" y="84" font-size="11">confianza: alta</text>
    <text x="740" y="100" font-size="11">sale a internet y a la DMZ</text>
    <text x="740" y="116" font-size="11">(solo a lo que necesita)</text>
    <text x="740" y="226" font-weight="700">DMZ (servidores públicos)</text>
    <text x="740" y="244" font-size="11">confianza: media</text>
    <text x="740" y="260" font-size="11">recibe de internet solo su servicio</text>
    <text x="740" y="276" font-size="11">NUNCA inicia hacia la LAN</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="20" y="250">Si un servidor de la DMZ es atacado,</text>
    <text x="20" y="268">el atacante queda en la DMZ: la LAN</text>
    <text x="20" y="286">sigue protegida por el firewall.</text>
  </g>
</svg>
