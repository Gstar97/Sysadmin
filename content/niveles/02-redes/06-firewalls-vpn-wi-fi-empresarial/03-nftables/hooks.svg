<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="hk-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Por dónde pasa un paquete dentro de Linux (los hooks de nftables)</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="120" width="110" height="44" rx="8" fill="var(--surface-2, #eef0f3)"/>
    <rect x="160" y="120" width="120" height="44" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="310" y="120" width="120" height="44" rx="22" fill="var(--surface, #fff)"/>
    <rect x="470" y="50" width="120" height="44" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="470" y="190" width="120" height="44" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="620" y="50" width="120" height="44" rx="8" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="620" y="190" width="120" height="44" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="760" y="190" width="80" height="44" rx="8" fill="var(--surface-2, #eef0f3)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.8" marker-end="url(#hk-a)" fill="none">
    <line x1="130" y1="142" x2="158" y2="142"/>
    <line x1="280" y1="142" x2="308" y2="142"/>
    <path d="M430 132 L468 80"/>
    <path d="M430 152 L468 206"/>
    <line x1="590" y1="72" x2="618" y2="72"/>
    <path d="M680 94 L680 120 L530 120 L530 188" />
    <line x1="590" y1="212" x2="618" y2="212"/>
    <line x1="740" y1="212" x2="758" y2="212"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="75" y="140" font-weight="700">Entra</text><text x="75" y="155" font-size="10.5">por una placa</text>
    <text x="220" y="140" font-weight="700">prerouting</text><text x="220" y="155" font-size="10.5">dnat va aquí</text>
    <text x="370" y="140" font-weight="700">¿es para mí?</text><text x="370" y="155" font-size="10.5">decisión de ruta</text>
    <text x="530" y="70" font-weight="700">input</text><text x="530" y="85" font-size="10.5">para este equipo</text>
    <text x="530" y="210" font-weight="700">forward</text><text x="530" y="225" font-size="10.5">lo atraviesa</text>
    <text x="680" y="70" font-weight="700">Programa local</text><text x="680" y="85" font-size="10.5">sshd, nginx...</text>
    <text x="680" y="210" font-weight="700">postrouting</text><text x="680" y="225" font-size="10.5">masquerade va aquí</text>
    <text x="800" y="210" font-weight="700">Sale</text>
    <text x="605" y="114" font-size="10.5">output (lo que genera el equipo)</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="20" y="266">Un servidor: lo importante es input (qué servicios le pueden llegar).</text>
    <text x="20" y="284">Un router o firewall Linux: además forward (qué puede atravesarlo) y los NAT de prerouting y postrouting.</text>
  </g>
</svg>
