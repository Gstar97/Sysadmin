- { id: t1, frente: "Hooks de netfilter", dorso: "prerouting (dnat) → input (para mí) / forward (me atraviesa) → output (lo mío) → postrouting (masquerade)." }
- { id: t2, frente: "Cadena base de nftables", dorso: "type filter hook input priority filter; policy drop; — con los punto y coma." }
- { id: t3, frente: "Las tres líneas de siempre", dorso: "ct state established,related accept · iifname \"lo\" accept · SSH permitido antes de policy drop." }
- { id: t4, frente: "Router Linux con NAT", dorso: "ip_forward = 1 · forward permitido de LAN a WAN · masquerade en nat/postrouting por la WAN." }
- { id: t5, frente: "Comandos de nft", dorso: "nft -c -f ARCHIVO (revisar) · nft -f (aplicar) · nft list ruleset (ver) · systemctl enable --now nftables." }
