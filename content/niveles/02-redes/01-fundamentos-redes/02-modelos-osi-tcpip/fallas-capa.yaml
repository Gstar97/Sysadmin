tipo: emparejar
consigna: Cada síntoma apunta a una capa. Une el síntoma con la capa del modelo OSI donde está el problema.
pares:
  - { a: "El cable está cortado y la luz del puerto está apagada", b: "1 · Física" }
  - { a: "Dos equipos con la misma MAC en la red local", b: "2 · Enlace de datos" }
  - { a: "La PC tiene mal la puerta de enlace y no sale de su red", b: "3 · Red" }
  - { a: "Un firewall bloquea el puerto 443", b: "4 · Transporte" }
  - { a: "El certificado TLS del sitio venció", b: "6 · Presentación" }
  - { a: "El servidor web responde 500 Internal Server Error", b: "7 · Aplicación" }
explicacion: >-
  Ubicar la capa te dice dónde buscar y a quién llamar: una luz apagada no se arregla
  reiniciando nginx, y un error 500 no se arregla cambiando el cable.
