<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="130" y="26" text-anchor="middle" font-weight="700" fill="currentColor">Modelo OSI (7 capas)</text>
  <text x="400" y="26" text-anchor="middle" font-weight="700" fill="currentColor">Modelo TCP/IP (4 capas)</text>
  <text x="560" y="26" font-weight="700" fill="currentColor">Unidad de datos</text>
  <text x="690" y="26" font-weight="700" fill="currentColor">Ejemplos</text>
  <g stroke="currentColor">
    <rect x="30" y="40" width="200" height="50" rx="6" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="30" y="96" width="200" height="50" rx="6" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="30" y="152" width="200" height="50" rx="6" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="30" y="208" width="200" height="50" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="30" y="264" width="200" height="50" rx="6" fill="var(--accent-soft, #d9efe9)"/>
    <rect x="30" y="320" width="200" height="50" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="30" y="376" width="200" height="50" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="300" y="40" width="200" height="162" rx="6" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="300" y="208" width="200" height="50" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="300" y="264" width="200" height="50" rx="6" fill="var(--accent-soft, #d9efe9)"/>
    <rect x="300" y="320" width="200" height="106" rx="6" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="130" y="70"><tspan font-weight="700">7</tspan> Aplicación</text>
    <text x="130" y="126"><tspan font-weight="700">6</tspan> Presentación</text>
    <text x="130" y="182"><tspan font-weight="700">5</tspan> Sesión</text>
    <text x="130" y="238"><tspan font-weight="700">4</tspan> Transporte</text>
    <text x="130" y="294"><tspan font-weight="700">3</tspan> Red</text>
    <text x="130" y="350"><tspan font-weight="700">2</tspan> Enlace de datos</text>
    <text x="130" y="406"><tspan font-weight="700">1</tspan> Física</text>
    <text x="400" y="126" font-weight="700">Aplicación</text>
    <text x="400" y="238" font-weight="700">Transporte</text>
    <text x="400" y="294" font-weight="700">Internet (red)</text>
    <text x="400" y="368" font-weight="700">Acceso a la red</text>
    <text x="400" y="386" font-size="11.5">(enlace + física)</text>
  </g>
  <g stroke="currentColor" stroke-dasharray="4 4"><line x1="230" y1="121" x2="300" y2="121"/><line x1="230" y1="233" x2="300" y2="233"/><line x1="230" y1="289" x2="300" y2="289"/><line x1="230" y1="373" x2="300" y2="373"/></g>
  <g fill="currentColor">
    <text x="560" y="126">Datos</text>
    <text x="560" y="238">Segmento (TCP)</text>
    <text x="560" y="254" font-size="11">datagrama (UDP)</text>
    <text x="560" y="294">Paquete</text>
    <text x="560" y="350">Trama</text>
    <text x="560" y="406">Bits</text>
    <text x="690" y="118">HTTP, DNS, SSH, SMTP</text>
    <text x="690" y="136" font-size="11.5">cifrado TLS, formatos</text>
    <text x="690" y="238">TCP, UDP · puertos</text>
    <text x="690" y="294">IP, ICMP · direcciones IP</text>
    <text x="690" y="350">Ethernet, Wi-Fi · MAC</text>
    <text x="690" y="368" font-size="11.5">switches</text>
    <text x="690" y="406">cable, fibra, radio</text>
  </g>
  <text x="430" y="456" text-anchor="middle" font-size="11.5" fill="currentColor">Al enviar, cada capa agrega su encabezado (encapsula); al recibir, cada capa saca el suyo (desencapsula).</text>
</svg>
