tipo: ordenar
consigna: Ordena las capas del modelo OSI de arriba (la más cercana al usuario) hacia abajo (el cable).
pasos:
  - "Aplicación"
  - "Presentación"
  - "Sesión"
  - "Transporte"
  - "Red"
  - "Enlace de datos"
  - "Física"
explicacion: >-
  Una frase para recordarlas de abajo hacia arriba es "Física, Enlace, Red, Transporte...",
  o la que inventes tú: lo que importa es saber qué se resuelve en cada una.
