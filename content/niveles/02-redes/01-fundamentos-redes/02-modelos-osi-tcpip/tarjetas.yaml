- { id: t1, frente: "Capas de OSI (de abajo hacia arriba)", dorso: "1 física · 2 enlace · 3 red · 4 transporte · 5 sesión · 6 presentación · 7 aplicación." }
- { id: t2, frente: "Capas de TCP/IP", dorso: "Acceso a la red (OSI 1-2) · Internet (OSI 3) · Transporte (OSI 4) · Aplicación (OSI 5-7)." }
- { id: t3, frente: "Unidades de datos (PDU)", dorso: "Datos (aplicación) → segmento (TCP) → paquete (IP) → trama (Ethernet) → bits (cable)." }
- { id: t4, frente: "Dirección de cada capa", dorso: "Capa 2: MAC. Capa 3: IP. Capa 4: puerto." }
- { id: t5, frente: "Qué equipo trabaja en qué capa", dorso: "Switch: capa 2 (tramas, MAC). Router: capa 3 (paquetes, IP). Firewall de puertos: hasta la 4." }
- { id: t6, frente: "Encapsular", dorso: "Al enviar, cada capa agrega su encabezado a lo que le da la de arriba. Al recibir, cada capa saca el suyo." }
- { id: t7, frente: "Tres formas de diagnosticar por capas", dorso: "De abajo hacia arriba (sospecha física), de arriba hacia abajo (falla un servicio), o por la mitad con un ping." }
