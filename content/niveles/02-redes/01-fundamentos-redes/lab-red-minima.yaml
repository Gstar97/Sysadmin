tipo: pasos
titulo: Dos máquinas virtuales en la misma red
descripcion: >-
  Vas a conectar rocky01 y ubuntu01 por una red interna del hipervisor (un switch virtual que
  solo ven ellas dos) y a mirar, con tus propios ojos, el ARP y las tramas.
pasos:
  - titulo: Tomá instantáneas y agregá una placa en red interna
    detalle: >-
      Con las dos máquinas apagadas, tomá una instantánea de cada una (antes-de-redes). Después
      agregá a cada una una segunda placa de red conectada a una red interna con el mismo
      nombre, por ejemplo "labred". Esa red interna funciona como un switch al que solo están
      conectadas las dos máquinas.
    variantes:
      - nombre: VirtualBox
        detalle: Configuración → Red → Adaptador 2 → Habilitar → Conectado a "Red interna" → Nombre "labred". En las dos máquinas.
      - nombre: virt-manager (KVM)
        detalle: Creá primero una red aislada (Editar → Detalles de la conexión → Redes virtuales → + , modo "aislada", sin DHCP) y agregala como segunda placa en las dos máquinas.
    comprobar: Al encender, ip -br link muestra una placa nueva en cada máquina (en VirtualBox suele ser enp0s8), en estado UP o DOWN.
  - titulo: Ponele una IP a cada máquina en la red nueva
    detalle: >-
      Usá la red 10.10.10.0/24, que no se superpone con las que ya tenés. Reemplazá enp0s8 por
      el nombre de tu placa. Con ip addr la configuración dura hasta reiniciar, que para este
      laboratorio alcanza.
    variantes:
      - nombre: rocky01
        detalle: La primera máquina, con la IP .1.
        comandos:
          - sudo ip link set enp0s8 up
          - sudo ip addr add 10.10.10.1/24 dev enp0s8
      - nombre: ubuntu01
        detalle: La segunda, con la IP .2.
        comandos:
          - sudo ip link set enp0s8 up
          - sudo ip addr add 10.10.10.2/24 dev enp0s8
    comprobar: ip -br a muestra 10.10.10.1/24 en rocky01 y 10.10.10.2/24 en ubuntu01.
  - titulo: Mirá las MAC de las dos placas
    comandos:
      - ip -br link
    detalle: >-
      Anotá la MAC de enp0s8 de cada máquina. En VirtualBox empiezan con 08:00:27 (el OUI de
      VirtualBox); en KVM, con 52:54:00.
    comprobar: Tenés anotadas las dos MAC.
  - titulo: Prepará una captura de ARP en ubuntu01
    detalle: >-
      tcpdump muestra el tráfico que pasa por una placa (lo verás a fondo en el módulo 2.7).
      Con -e muestra las MAC y con "arp" filtra solo ARP. Dejalo corriendo en ubuntu01.
    comandos:
      - sudo apt install -y tcpdump
      - sudo tcpdump -e -n -i enp0s8 arp
    comprobar: tcpdump dice "listening on enp0s8" y espera.
  - titulo: Hacé ping desde rocky01 y mirá la captura
    comandos:
      - ip neigh show dev enp0s8
      - ping -c 3 10.10.10.2
      - ip neigh show dev enp0s8
    detalle: >-
      Antes del ping, la tabla de vecinos de enp0s8 está vacía. En la captura de ubuntu01
      aparece primero una solicitud ("Request who-has 10.10.10.2 tell 10.10.10.1") con destino
      ff:ff:ff:ff:ff:ff, y después la respuesta ("Reply 10.10.10.2 is-at ..."), ya dirigida a
      la MAC de rocky01.
    comprobar: La tabla de vecinos de rocky01 muestra 10.10.10.2 con la MAC que anotaste de ubuntu01.
  - titulo: Vaciá la tabla y repetí
    comandos:
      - sudo ip neigh flush dev enp0s8
      - ping -c 1 10.10.10.2
    detalle: >-
      Al vaciar la tabla, el siguiente ping vuelve a necesitar ARP, y en la captura aparece de
      nuevo el par solicitud y respuesta.
    comprobar: Ves una segunda solicitud y respuesta ARP en tcpdump.
  - titulo: Provocá una IP duplicada
    detalle: >-
      En ubuntu01 corta tcpdump (Ctrl+C) y agregale también la IP de rocky01. Después, desde
      ubuntu01, pregunta quién tiene esa IP. Verás que contesta la otra máquina: la IP está
      repetida. Ojo: al agregar una IP con ip addr, Linux no comprueba si otro la usa; por eso
      conviene probar con arping -D antes.
    variantes:
      - nombre: ubuntu01
        detalle: En Ubuntu, arping viene en el paquete iputils-arping.
        comandos:
          - sudo ip addr add 10.10.10.1/24 dev enp0s8
          - sudo apt install -y iputils-arping
          - sudo arping -D -c 2 -I enp0s8 10.10.10.1
    comprobar: arping muestra una respuesta ("Unicast reply from 10.10.10.1 [MAC de rocky01]") y termina con código distinto de 0 (echo $? da 1).
  - titulo: Dejá todo como estaba
    comandos:
      - sudo ip addr del 10.10.10.1/24 dev enp0s8
    detalle: >-
      En ubuntu01 quita la IP repetida. Si preferís, volvé a las instantáneas: la
      configuración con ip addr se borra igual al reiniciar.
    comprobar: ip -br a en ubuntu01 muestra solo 10.10.10.2/24 en enp0s8.
