<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="28" font-weight="700" fill="currentColor">Hasta dónde llega cada medio a la velocidad indicada</text>
  <g font-size="11.5" fill="currentColor"><text x="200" y="52">0</text><text x="335" y="52">100 m</text><text x="470" y="52">500 m</text><text x="600" y="52">2 km</text><text x="740" y="52">10 km o más</text></g>
  <g stroke="currentColor" stroke-dasharray="3 4" opacity="0.5"><line x1="202" y1="58" x2="202" y2="300"/><line x1="350" y1="58" x2="350" y2="300"/><line x1="485" y1="58" x2="485" y2="300"/><line x1="612" y1="58" x2="612" y2="300"/><line x1="760" y1="58" x2="760" y2="300"/></g>
  <g fill="currentColor">
    <text x="20" y="84">Cat5e · 1 Gb/s</text>
    <text x="20" y="114">Cat6 · 10 Gb/s</text>
    <text x="20" y="144">Cat6A · 10 Gb/s</text>
    <text x="20" y="174">Cat8 · 25/40 Gb/s</text>
    <text x="20" y="214">Multimodo OM4 · 10 Gb/s</text>
    <text x="20" y="244">Multimodo OM4 · 100 Gb/s</text>
    <text x="20" y="284">Monomodo OS2 · 10 Gb/s</text>
  </g>
  <g>
    <rect x="202" y="72" width="148" height="16" rx="4" fill="var(--info, #3b6fd8)"/>
    <rect x="202" y="102" width="81" height="16" rx="4" fill="var(--info, #3b6fd8)"/>
    <rect x="202" y="132" width="148" height="16" rx="4" fill="var(--info, #3b6fd8)"/>
    <rect x="202" y="162" width="44" height="16" rx="4" fill="var(--info, #3b6fd8)"/>
    <rect x="202" y="202" width="248" height="16" rx="4" fill="var(--ok, #1f8a5b)"/>
    <rect x="202" y="232" width="138" height="16" rx="4" fill="var(--ok, #1f8a5b)"/>
    <rect x="202" y="272" width="610" height="16" rx="4" fill="var(--warn, #b7791f)"/>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="356" y="85">100 m</text><text x="289" y="115">55 m</text><text x="356" y="145">100 m</text><text x="252" y="175">30 m</text>
    <text x="456" y="215">400 m</text><text x="346" y="245">100 m</text><text x="818" y="285">10 km</text>
  </g>
  <rect x="20" y="312" width="820" height="56" rx="10" fill="var(--surface-2, #f1f3f5)" stroke="currentColor"/>
  <g fill="currentColor" font-size="12">
    <text x="36" y="335"><tspan font-weight="700">Cobre (par trenzado, RJ45):</tspan> barato, lleva electricidad (PoE), hasta 100 m. Para puestos de trabajo y teléfonos.</text>
    <text x="36" y="355"><tspan font-weight="700">Fibra (LC en módulos SFP):</tspan> más distancia, no le afectan las interferencias. Entre switches, pisos y edificios.</text>
  </g>
</svg>
