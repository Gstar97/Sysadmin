tipo: emparejar
consigna: Elegí el medio adecuado para cada situación.
pares:
  - { a: "Puestos de trabajo de una oficina, a 40 m del switch", b: "Cobre Cat6 con conectores RJ45" }
  - { a: "Unir a 10 Gb/s dos switches de pisos distintos, a 90 m", b: "Cobre Cat6A o fibra multimodo" }
  - { a: "Unir dos edificios de un campus a 1,5 km", b: "Fibra monomodo (OS2)" }
  - { a: "Un punto de acceso en el techo, sin enchufe cerca", b: "Cobre con PoE desde el switch" }
  - { a: "Servidor y switch en el mismo rack, a 2 m, a 25 Gb/s", b: "Cable DAC (cobre twinax con los SFP ya incluidos)" }
  - { a: "Un tendido junto a motores de una fábrica, con mucha interferencia", b: "Fibra óptica, que no le afecta la interferencia eléctrica" }
explicacion: >-
  La regla práctica: cobre hasta 100 m y donde haga falta PoE; fibra para más distancia,
  mucha velocidad o ambientes con interferencia. Dentro del rack, DAC sale más barato que
  dos módulos ópticos y una fibra.
