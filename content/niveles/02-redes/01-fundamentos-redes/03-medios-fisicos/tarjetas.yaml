- { id: t1, frente: "Categorías de cobre", dorso: "Cat5e 1 Gb/s · Cat6 1 Gb/s (10 Gb/s hasta 55 m) · Cat6A 10 Gb/s a 100 m · Cat8 25/40 Gb/s a 30 m. Límite del cobre: 100 m." }
- { id: t2, frente: "Multimodo o monomodo", dorso: "Multimodo (OM3/OM4): cientos de metros, dentro de edificios. Monomodo (OS2, amarilla): kilómetros." }
- { id: t3, frente: "SFP, SFP+, SR, LR", dorso: "SFP 1 Gb/s, SFP+ 10 Gb/s. SR: multimodo, distancia corta. LR: monomodo, hasta 10 km. El módulo tiene que coincidir con la fibra." }
- { id: t4, frente: "Normas PoE (por puerto)", dorso: "af 15,4 W (12,95 al equipo) · at 30 W (25,5) · bt Tipo 3 60 W (51) · bt Tipo 4 90 W (71,3). Y el switch tiene un presupuesto total." }
- { id: t5, frente: "Full y half dúplex", dorso: "Full: los dos hablan a la vez. Half: de a uno (hubs). Un extremo en full y otro en half: anda, pero lento y con errores." }
- { id: t6, frente: "ethtool", dorso: "ethtool tarjeta → Speed, Duplex, Auto-negotiation, Link detected. Autonegociación activada en los dos extremos." }
- { id: t7, frente: "1 Gb/s que negocia 100 Mb/s", dorso: "Casi siempre un cable dañado: 1 Gb/s usa los 4 pares y 100 Mb/s solo 2." }
