tipo: terminal
shell: bash
titulo: La tabla ARP y una IP duplicada
descripcion: >-
  Estás en pc-admin (192.168.10.50). En la red están el servidor (192.168.10.20) y la
  impresora (192.168.10.30). Desde ayer, la impresora "a veces" no imprime.
estado_inicial:
  distro: rocky
  hostname: pc-admin
  usuario: admin
  usuarios: [{ nombre: admin, sudo: true }]
  red:
    interfaces: [{ nombre: enp0s3, ip: 192.168.10.50/24, mac: "52:54:00:aa:10:50" }]
    puerta_enlace: 192.168.10.1
    dns: [192.168.10.1]
  servidores:
    - { ip: 192.168.10.20, hostname: srv01, red: { interfaces: [{ nombre: enp0s3, ip: 192.168.10.20/24, mac: "52:54:00:aa:10:20" }] } }
    - { ip: 192.168.10.30, hostname: impresora, red: { interfaces: [{ nombre: eth0, ip: 192.168.10.30/24, mac: "00:1b:a9:30:30:30" }] } }
    - { ip: 192.168.10.31, hostname: camara-entrada, red: { interfaces: [{ nombre: eth0, ip: 192.168.10.30/24, mac: "9c:8e:cd:0c:ca:01" }] } }
pasos:
  - consigna: Mirá la tabla ARP (los vecinos que este equipo ya conoce).
    verificar:
      - { comando_usado: ip neigh }
    pistas: ["ip neigh (o ip n)."]
    solucion: [ip neigh]
    explicacion: >-
      Solo aparece la puerta de enlace: es con quien más se habla. REACHABLE quiere decir que
      la entrada se confirmó hace poco; STALE, que es vieja y se va a volver a confirmar la
      próxima vez que se use.
  - consigna: Hacé dos pings al servidor 192.168.10.20 y volvé a mirar la tabla ARP.
    verificar:
      - { comando_usado: ping }
      - { salida_contiene: "52:54:00:aa:10:20" }
    pistas: ["ping -c 2 192.168.10.20 y después ip neigh."]
    solucion: [ping -c 2 192.168.10.20, ip neigh]
    explicacion: Antes del primer ping hubo una consulta ARP; ahora la MAC del servidor está en la tabla.
  - consigna: Vaciá la tabla ARP (hace falta sudo) y comprobá que el servidor ya no figura.
    verificar:
      - { comando_usado: ip neigh flush }
      - { salida_no_contiene: "52:54:00:aa:10:20" }
    pistas: ["sudo ip neigh flush all y después ip neigh."]
    solucion: [sudo ip neigh flush all, ip neigh]
    explicacion: >-
      Vaciar la tabla es útil cuando un equipo cambió de placa o de IP y los demás siguen
      usando la MAC vieja. Las entradas se vuelven a aprender solas.
  - consigna: >-
      Ahora la impresora. Usá arping para preguntar varias veces quién tiene la IP
      192.168.10.30 (con -c 3 y la interfaz enp0s3). ¿Cuántos equipos contestan?
    verificar:
      - { comando_usado: arping }
      - { salida_contiene: "00:1B:A9:30:30:30" }
      - { salida_contiene: "9C:8E:CD:0C:CA:01" }
    pistas: ["sudo arping -c 3 -I enp0s3 192.168.10.30"]
    solucion: [sudo arping -c 3 -I enp0s3 192.168.10.30]
    explicacion: >-
      Contestan dos MAC distintas para la misma IP: hay una IP duplicada. La que empieza con
      9c:8e:cd es la cámara de la entrada, que alguien configuró con la IP de la impresora.
      Según qué respuesta llegue última, los trabajos de impresión van a la impresora o a la
      cámara: por eso falla "a veces". Se arregla cambiando la IP de uno de los dos (y
      anotando las IP fijas en un inventario, o mejor, con reservas de DHCP).
