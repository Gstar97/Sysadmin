- { id: t1, frente: "ARP en dos pasos", dorso: "Solicitud por broadcast: ¿quién tiene esta IP? Respuesta directa: soy yo, esta es mi MAC. Se guarda unos minutos." }
- { id: t2, frente: "ARP para otra red", dorso: "No se pregunta por el destino: se pregunta por la MAC de la puerta de enlace. IP = destino final; MAC = próximo salto." }
- { id: t3, frente: "ip neigh", dorso: "Tabla de vecinos. REACHABLE (confirmada), STALE (vieja), FAILED (nadie contestó). sudo ip neigh flush all para vaciarla. Windows: arp -a." }
- { id: t4, frente: "Síntomas de IP duplicada", dorso: "Falla intermitente con un equipo, aviso de clave SSH cambiada, aviso de conflicto en Windows." }
- { id: t5, frente: "arping", dorso: "sudo arping -c 3 -I placa IP: dos MAC distintas = IP duplicada. -D: comprobar que una IP está libre antes de usarla." }
- { id: t6, frente: "ARP gratuito", dorso: "Anuncio sin pregunta: esta IP está en mi MAC. Al levantar una placa y cuando una IP pasa a otro equipo (clúster)." }
