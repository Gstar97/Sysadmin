- { id: t1, frente: "Partes de una trama Ethernet", dorso: "MAC destino · MAC origen · tipo (0800 IPv4, 86DD IPv6, 0806 ARP) · datos (hasta 1500 bytes) · FCS." }
- { id: t2, frente: "OUI", dorso: "Los 3 primeros bytes de la MAC: el fabricante. 08:00:27 VirtualBox · 52:54:00 KVM · 00:50:56 VMware." }
- { id: t3, frente: "Broadcast", dorso: "ff:ff:ff:ff:ff:ff: para todos los equipos de la red local. El switch lo inunda; el router no lo pasa." }
- { id: t4, frente: "Qué hace un switch con una trama", dorso: "Aprende MAC de origen + puerto. Destino conocido en otro puerto: reenvía. Desconocido o broadcast: inunda. En el mismo puerto: descarta." }
- { id: t5, frente: "Dominio de colisión y de broadcast", dorso: "Colisión: lo divide el switch (uno por puerto). Broadcast: solo un router o VLAN." }
- { id: t6, frente: "MTU de Ethernet", dorso: "1500 bytes de datos por trama. Se ve en ip link (mtu 1500)." }
