<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">Una trama Ethernet II</text>
  <g stroke="currentColor">
    <rect x="20" y="40" width="90" height="56" fill="var(--surface-2, #f1f3f5)"/>
    <rect x="110" y="40" width="130" height="56" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="240" y="40" width="130" height="56" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="370" y="40" width="80" height="56" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="450" y="40" width="300" height="56" fill="var(--accent-soft, #d9efe9)"/>
    <rect x="750" y="40" width="90" height="56" fill="var(--surface-2, #f1f3f5)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="65" y="64" font-weight="700">Preámbulo</text><text x="65" y="82" font-size="11">8 bytes</text>
    <text x="175" y="64" font-weight="700">MAC destino</text><text x="175" y="82" font-size="11">6 bytes</text>
    <text x="305" y="64" font-weight="700">MAC origen</text><text x="305" y="82" font-size="11">6 bytes</text>
    <text x="410" y="64" font-weight="700">Tipo</text><text x="410" y="82" font-size="11">2 bytes</text>
    <text x="600" y="64" font-weight="700">Datos (el paquete IP)</text><text x="600" y="82" font-size="11">46 a 1500 bytes (MTU)</text>
    <text x="795" y="64" font-weight="700">FCS</text><text x="795" y="82" font-size="11">4 bytes</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="20" y="116">Sincroniza al receptor</text>
    <text x="110" y="116">Va primero: el switch decide apenas la lee</text>
    <text x="370" y="132">0800 = IPv4 · 86DD = IPv6 · 0806 = ARP</text>
    <text x="640" y="116">Suma de control: si no coincide, la trama se descarta</text>
  </g>
  <text x="20" y="176" font-weight="700" fill="currentColor">Una dirección MAC: 48 bits, escrita en hexadecimal</text>
  <g stroke="currentColor">
    <rect x="20" y="190" width="300" height="52" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="320" y="190" width="300" height="52" rx="6" fill="var(--ok-soft, #dcf3e6)"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20">
    <text x="170" y="224">08:00:27</text><text x="470" y="224">:4a:91:0e</text>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="170" y="262" font-weight="700">OUI: el fabricante (3 bytes)</text>
    <text x="170" y="280" font-size="11.5">08:00:27 = VirtualBox (Oracle)</text>
    <text x="470" y="262" font-weight="700">Número de la placa (3 bytes)</text>
    <text x="470" y="280" font-size="11.5">lo asigna el fabricante</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="640" y="200" font-weight="700">Bits especiales del primer byte:</text>
    <text x="640" y="220">bit más bajo en 1 → multicast</text>
    <text x="640" y="238">(ff:ff:ff:ff:ff:ff = broadcast)</text>
    <text x="640" y="256">segundo bit en 1 → asignada</text>
    <text x="640" y="274">localmente (VM, aleatoria)</text>
  </g>
  <text x="20" y="316" font-size="11.5" fill="currentColor">En Linux: ip link · en Windows: getmac o ipconfig /all · en el switch: show mac address-table</text>
</svg>
