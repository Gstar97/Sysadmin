tipo: topologia
titulo: Red mínima de la oficina
consigna: >-
  Tienes dos PC, un servidor de archivos y un switch sin cablear. Conecta cada equipo a un
  puerto del switch y configúrale al servidor la IP 192.168.50.10/24 (las PC ya tienen la
  suya). Después prueba que todos se vean entre sí.
editable: { equipos: false, enlaces: true, configuracion: true }
dispositivos:
  - { id: PC1, nombre: PC-Recepcion, tipo: pc, x: 0, y: 240, interfaces: [{ nombre: eth0, ip: 192.168.50.11/24 }] }
  - { id: PC2, nombre: PC-Contable, tipo: pc, x: 220, y: 240, interfaces: [{ nombre: eth0, ip: 192.168.50.12/24 }] }
  - { id: SRV, nombre: Servidor, tipo: servidor, x: 440, y: 240, interfaces: [{ nombre: eth0 }] }
  - { id: SW1, nombre: SW1, tipo: switch, x: 220, y: 60 }
objetivos:
  - { desde: PC1, hacia: 192.168.50.10, descripcion: PC-Recepcion llega al servidor }
  - { desde: PC2, hacia: 192.168.50.10, descripcion: PC-Contable llega al servidor }
  - { desde: PC1, hacia: PC2, descripcion: Las dos PC se ven entre sí }
