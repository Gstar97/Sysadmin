tipo: emparejar
consigna: Uní cada equipo con lo que hace en la red.
pares:
  - { a: "Placa de red (NIC)", b: "Conecta un equipo a la red; tiene una dirección MAC grabada" }
  - { a: "Switch", b: "Conecta equipos de la misma red local y manda cada mensaje solo a su destino" }
  - { a: "Router", b: "Une redes distintas y decide por dónde sigue cada paquete" }
  - { a: "Punto de acceso", b: "Conecta equipos por Wi-Fi a la red cableada" }
  - { a: "Firewall", b: "Decide qué tráfico pasa y cuál se bloquea" }
  - { a: "Servidor", b: "Espera pedidos y ofrece un servicio (archivos, web, DNS)" }
explicacion: >-
  En una oficina chica el router, el firewall y hasta el punto de acceso pueden venir en el
  mismo aparato, pero siguen siendo funciones distintas. Separarlas en la cabeza ayuda a
  diagnosticar: "¿falla la red local o la salida a internet?".
