<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="system-ui, sans-serif" font-size="12.5">
  <rect x="16" y="96" width="676" height="318" rx="14" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-dasharray="6 4"/>
  <text x="32" y="120" font-weight="700" fill="currentColor">LAN de la oficina (un edificio)</text>
  <!-- Internet -->
  <path d="M735 74 q-28 0 -28 -22 q0 -22 30 -22 q8 -18 34 -16 q20 -14 44 0 q30 -4 34 20 q22 4 20 22 q-2 20 -28 18 z" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="790" y="56" text-anchor="middle" font-weight="700" fill="currentColor">Internet</text>
  <!-- Sucursal por WAN -->
  <rect x="726" y="318" width="160" height="70" rx="10" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="806" y="346" text-anchor="middle" font-weight="700" fill="currentColor">Sucursal</text>
  <text x="806" y="364" text-anchor="middle" font-size="11.5" fill="currentColor">otra LAN, en otra ciudad</text>
  <!-- Router / firewall -->
  <rect x="540" y="136" width="136" height="56" rx="8" fill="var(--surface, #fff)" stroke="currentColor"/>
  <text x="608" y="160" text-anchor="middle" font-weight="700" fill="currentColor">Router + firewall</text>
  <text x="608" y="177" text-anchor="middle" font-size="11.5" fill="currentColor">puerta de enlace</text>
  <!-- Switch -->
  <rect x="270" y="212" width="250" height="40" rx="6" fill="var(--surface, #fff)" stroke="currentColor"/>
  <g fill="currentColor"><rect x="290" y="236" width="10" height="7"/><rect x="306" y="236" width="10" height="7"/><rect x="322" y="236" width="10" height="7"/><rect x="338" y="236" width="10" height="7"/><rect x="354" y="236" width="10" height="7"/><rect x="370" y="236" width="10" height="7"/><rect x="386" y="236" width="10" height="7"/><rect x="402" y="236" width="10" height="7"/></g>
  <text x="470" y="237" text-anchor="middle" font-weight="700" fill="currentColor">Switch</text>
  <!-- Punto de acceso -->
  <rect x="70" y="160" width="130" height="44" rx="22" fill="var(--surface, #fff)" stroke="currentColor"/>
  <text x="135" y="187" text-anchor="middle" font-weight="700" fill="currentColor">Punto de acceso</text>
  <g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M118 152 q17 -14 34 0"/><path d="M110 144 q25 -22 50 0"/></g>
  <!-- Inalámbricos -->
  <rect x="36" y="300" width="96" height="44" rx="6" fill="var(--surface, #fff)" stroke="currentColor"/>
  <text x="84" y="327" text-anchor="middle" fill="currentColor">Notebook</text>
  <rect x="150" y="300" width="80" height="44" rx="6" fill="var(--surface, #fff)" stroke="currentColor"/>
  <text x="190" y="327" text-anchor="middle" fill="currentColor">Teléfono</text>
  <g stroke="currentColor" stroke-dasharray="3 4" stroke-width="1.5"><line x1="110" y1="204" x2="84" y2="300"/><line x1="160" y1="204" x2="190" y2="300"/></g>
  <!-- Cableados -->
  <rect x="270" y="310" width="90" height="48" rx="6" fill="var(--surface, #fff)" stroke="currentColor"/>
  <text x="315" y="339" text-anchor="middle" fill="currentColor">PC</text>
  <rect x="378" y="310" width="90" height="48" rx="6" fill="var(--surface, #fff)" stroke="currentColor"/>
  <text x="423" y="339" text-anchor="middle" fill="currentColor">Impresora</text>
  <rect x="486" y="300" width="110" height="64" rx="6" fill="var(--ok-soft, #dcf3e6)" stroke="currentColor"/>
  <text x="541" y="326" text-anchor="middle" font-weight="700" fill="currentColor">Servidor</text>
  <text x="541" y="343" text-anchor="middle" font-size="11.5" fill="currentColor">archivos, intranet</text>
  <g stroke="currentColor" stroke-width="2.5">
    <line x1="315" y1="252" x2="315" y2="310"/><line x1="423" y1="252" x2="423" y2="310"/><line x1="500" y1="252" x2="530" y2="300"/>
    <line x1="270" y1="232" x2="200" y2="190"/><line x1="520" y1="222" x2="560" y2="192"/>
    <line x1="676" y1="150" x2="730" y2="80"/>
  </g>
  <line x1="676" y1="182" x2="760" y2="318" stroke="currentColor" stroke-width="2.5" stroke-dasharray="10 5"/>
  <text x="728" y="250" font-size="11.5" fill="currentColor" transform="rotate(58 728 250)">enlace WAN</text>
  <text x="300" y="404" font-size="11.5" fill="currentColor">Línea llena: cable. Punteada fina: Wi-Fi. Punteada gruesa: enlace contratado entre sedes.</text>
</svg>
