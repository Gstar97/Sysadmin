- { id: t1, frente: "LAN, WAN e internet", dorso: "LAN: equipos propios en un mismo lugar. WAN: enlace contratado entre lugares lejanos. Internet: la red de redes." }
- { id: t2, frente: "Switch o router", dorso: "Switch: conecta equipos de la misma red local. Router: une redes distintas y es la puerta de enlace." }
- { id: t3, frente: "Punto de acceso", dorso: "Conecta equipos por Wi-Fi a la red cableada. No es un router: es la misma LAN sin cables." }
- { id: t4, frente: "Cliente-servidor", dorso: "El cliente inicia; el servidor escucha en un puerto conocido. Se abre el puerto del servidor, no el de los clientes." }
- { id: t5, frente: "Topología física y lógica", dorso: "Física: cómo están los cables. Lógica: cómo viajan los datos. LAN de hoy: estrella (o estrella extendida)." }
- { id: t6, frente: "Ancho de banda y latencia", dorso: "Ancho de banda: cuántos datos por segundo (Mb/s). Latencia: cuánto tarda en llegar (ms). Más megas no bajan la latencia." }
