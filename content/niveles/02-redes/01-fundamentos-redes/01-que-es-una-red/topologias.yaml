tipo: emparejar
consigna: Uní cada topología física con su descripción.
pares:
  - { a: "Estrella", b: "Todos los equipos van a un punto central (el switch). Es la de casi todas las LAN de hoy" }
  - { a: "Estrella extendida", b: "Varios switches en estrella colgados de un switch central (un switch por piso)" }
  - { a: "Malla", b: "Cada equipo se une con varios otros: si un enlace se corta, hay otro camino" }
  - { a: "Bus", b: "Todos comparten un mismo cable: si se corta, cae toda la red (es historia)" }
  - { a: "Anillo", b: "Cada equipo pasa el mensaje al siguiente hasta volver al primero" }
explicacion: >-
  La topología física es cómo están los cables; la lógica es cómo viajan los datos. Una red
  con forma de estrella puede comportarse como un bus (todos reciben todo) si en el centro
  hay un hub en lugar de un switch.
