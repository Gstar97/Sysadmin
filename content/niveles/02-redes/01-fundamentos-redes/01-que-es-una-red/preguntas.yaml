- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: Una empresa une su oficina central con un depósito en otra ciudad mediante un enlace que contrata a un proveedor. ¿Qué tipo de red es ese enlace?
  opciones:
    - { texto: "Una WAN", correcta: true, explicacion: "Une lugares lejanos con un enlace que no es de la empresa: la alquila al proveedor." }
    - { texto: "Una LAN", explicacion: "La LAN es la red de un mismo lugar, con equipos propios." }
    - { texto: "Internet", explicacion: "Internet es la red de redes; el enlace contratado es una WAN, aunque a veces se arme como túnel sobre internet." }
    - { texto: "Una red entre pares", explicacion: "Entre pares describe cómo se reparten los roles de cliente y servidor, no el alcance." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Qué equipo une la red local con otras redes y es la puerta de enlace de los equipos de la oficina?
  opciones:
    - { texto: "El router", correcta: true, explicacion: "El router une redes y decide por dónde sigue cada paquete que va afuera de la LAN." }
    - { texto: "El switch", explicacion: "El switch conecta equipos de la misma red; no une redes distintas." }
    - { texto: "El punto de acceso", explicacion: "Conecta equipos por Wi-Fi a la misma LAN." }
    - { texto: "La placa de red", explicacion: "Conecta un equipo a la red, pero no reenvía tráfico de otros." }
- id: p03
  tipo: opcion_multiple
  dificultad: 1
  enunciado: En el modelo cliente-servidor, ¿quién inicia la conversación?
  opciones:
    - { texto: "El cliente; el servidor espera pedidos en un puerto conocido", correcta: true, explicacion: "Por eso el puerto que hay que abrir en un firewall es el del servidor." }
    - { texto: "El servidor; avisa a los clientes cuando hay datos", explicacion: "El servidor escucha; los clientes llegan cuando quieren." }
    - { texto: "El que tenga la IP más baja", explicacion: "Las direcciones no definen el rol." }
    - { texto: "El router", explicacion: "El router reenvía tráfico, no inicia conversaciones de los programas." }
- id: p04
  tipo: respuesta_multiple
  enunciado: El aparato que el proveedor instala en una casa suele cumplir varias funciones a la vez. ¿Cuáles? (Marca todas las que correspondan.)
  opciones:
    - { texto: "Router", correcta: true, explicacion: "Une la red de la casa con internet." }
    - { texto: "Switch", correcta: true, explicacion: "Los 4 puertos de atrás son un switch chico." }
    - { texto: "Punto de acceso Wi-Fi", correcta: true, explicacion: "Da el Wi-Fi de la casa." }
    - { texto: "Firewall", correcta: true, explicacion: "Por defecto bloquea las conexiones que llegan de internet." }
    - { texto: "Servidor de correo", explicacion: "El correo lo da un servicio en internet, no el aparato." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Los usuarios de la oficina pueden imprimir y abrir las carpetas del servidor local, pero no entra ninguna página de internet. ¿Dónde conviene empezar a buscar?
  opciones:
    - { texto: "En el router o en el enlace con el proveedor", correcta: true, explicacion: "La LAN funciona (se ven la impresora y el servidor): lo que falla es la salida de la red local." }
    - { texto: "En el switch", explicacion: "Si el switch fallara, tampoco andarían la impresora ni el servidor local." }
    - { texto: "En las placas de red de las PC", explicacion: "Las PC llegan a la impresora y al servidor: sus placas funcionan." }
    - { texto: "En el punto de acceso", explicacion: "Afecta a todos, incluidos los cableados; el punto de acceso solo da el Wi-Fi." }
- id: p06
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Una notebook conectada por Wi-Fi tiene la IP 192.168.1.40 y una PC cableada la 192.168.1.15, en la misma oficina. ¿Qué es lo más probable?
  opciones:
    - { texto: "Están en la misma LAN: el punto de acceso conecta el Wi-Fi a la red cableada", correcta: true, explicacion: "Por eso se pueden hablar directo, aunque una use cable y la otra no." }
    - { texto: "El Wi-Fi es siempre otra red", explicacion: "Solo si se arma a propósito (por ejemplo, una red de invitados)." }
    - { texto: "La notebook sale a internet por otro camino", explicacion: "Sale por el mismo router que todos." }
    - { texto: "No pueden comunicarse porque usan medios distintos", explicacion: "El medio (cable o aire) no impide que estén en la misma red." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué topología física tiene casi cualquier LAN moderna, con cada equipo cableado a un switch?
  opciones:
    - { texto: "Estrella", correcta: true, explicacion: "Cada equipo tiene su cable hasta un punto central; con varios switches, estrella extendida." }
    - { texto: "Bus", explicacion: "Un único cable compartido: se usaba en los 80 y 90." }
    - { texto: "Anillo", explicacion: "Se usó en redes viejas (Token Ring) y en algunos enlaces de fibra, no en la LAN de oficina." }
    - { texto: "Malla completa", explicacion: "Unir cada equipo con todos sería carísimo; se usa malla parcial solo entre equipos clave." }
- id: p08
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Una sede tiene un enlace de 300 Mb/s por satélite con 600 ms de latencia. ¿Qué va a andar peor?
  opciones:
    - { texto: "Las videollamadas y el acceso remoto interactivo", correcta: true, explicacion: "Con mucha latencia todo lo interactivo se siente con retraso, aunque sobre ancho de banda." }
    - { texto: "Descargar un archivo grande", explicacion: "Para descargar importa sobre todo el ancho de banda, que es bueno." }
    - { texto: "Nada: 300 Mb/s es mucho", explicacion: "El ancho de banda no compensa la latencia." }
    - { texto: "Solo el correo", explicacion: "El correo tolera bien la latencia." }
- id: p09
  tipo: opcion_multiple
  dificultad: 3
  enunciado: En una red con forma de estrella hay un hub (no un switch) en el centro, y todos los equipos reciben todos los mensajes. ¿Cómo se describe?
  opciones:
    - { texto: "Topología física de estrella con topología lógica de bus", correcta: true, explicacion: "Los cables forman una estrella, pero los datos viajan como en un cable compartido." }
    - { texto: "Topología física y lógica de estrella", explicacion: "Con un switch sí sería estrella también en lo lógico; con un hub, no." }
    - { texto: "Topología de malla", explicacion: "No hay caminos alternativos entre equipos." }
    - { texto: "No tiene topología lógica", explicacion: "Toda red la tiene: es cómo viajan los datos." }
- id: p10
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Un compañero propone que diez PC de la oficina compartan carpetas entre sí, sin servidor. ¿Cuál es el problema principal a medida que crece la empresa?
  opciones:
    - { texto: "No hay un lugar central para controlar permisos, copias de seguridad y accesos", correcta: true, explicacion: "En una red entre pares cada equipo administra lo suyo; con muchos equipos se vuelve inmanejable." }
    - { texto: "Las redes entre pares no funcionan con switch", explicacion: "Funcionan con cualquier LAN." }
    - { texto: "Es más lenta que con servidor", explicacion: "No necesariamente: el problema es de administración, no de velocidad." }
    - { texto: "Necesita una WAN", explicacion: "Funciona en la LAN." }
