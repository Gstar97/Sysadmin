tipo: diagrama
titulo: La red de una oficina, equipo por equipo
puntos:
  - id: lan
    titulo: LAN (red local)
    area: { x: 1.8, y: 23.3, ancho: 31.5, alto: 7 }
    texto: >-
      Todo lo que está dentro del recuadro es la red local: los equipos de un mismo lugar
      (una oficina, un piso, una casa), conectados con cables o Wi-Fi a equipos propios. La
      administra la empresa, es rápida (1 Gb/s o más por equipo) y no se paga por lo que se
      transmite.
  - id: switch
    titulo: Switch
    area: { x: 30, y: 49.3, ancho: 27.8, alto: 9.3 }
    texto: >-
      Conecta los equipos cableados de la LAN entre sí. Aprende en qué puerto está cada
      equipo y manda cada mensaje solo por el puerto que corresponde (lo vas a ver en la
      lección 4). No sabe nada de internet: trabaja dentro de la red local.
  - id: router
    titulo: Router y firewall
    area: { x: 60, y: 31.6, ancho: 15.1, alto: 13 }
    texto: >-
      El router une redes distintas: la LAN con internet y con la sucursal. Para los equipos
      de la oficina es la puerta de enlace: todo lo que va afuera de la red local pasa por él.
      En las oficinas chicas el mismo aparato hace de firewall, que decide qué tráfico se
      deja pasar y cuál no.
  - id: ap
    titulo: Punto de acceso
    area: { x: 7.8, y: 32.6, ancho: 14.4, alto: 14.9 }
    texto: >-
      Es el "switch inalámbrico": conecta por Wi-Fi a notebooks y teléfonos con la misma red
      cableada. Se conecta al switch con un cable (y muchas veces recibe la electricidad por
      ese mismo cable, con PoE).
  - id: inalambricos
    titulo: Equipos inalámbricos
    area: { x: 4, y: 69.8, ancho: 21.6, alto: 10.2 }
    texto: >-
      Notebooks y teléfonos usan Wi-Fi a través del punto de acceso. Para la red son equipos
      iguales a los cableados: tienen su tarjeta de red (inalámbrica), su dirección MAC y su IP.
  - id: clientes
    titulo: Clientes cableados
    area: { x: 30, y: 72.1, ancho: 22, alto: 11.2 }
    texto: >-
      Cada equipo tiene una tarjeta de red (NIC) con un conector para el cable. La PC y la
      impresora son clientes: piden servicios. La impresora es un caso curioso: para imprimir
      recibe pedidos, o sea que también ofrece un servicio.
  - id: servidor
    titulo: Servidor
    area: { x: 54, y: 69.8, ancho: 12.2, alto: 14.9 }
    texto: >-
      Ofrece servicios a los clientes: archivos compartidos, la intranet, el DNS. En el modelo
      cliente-servidor, el servidor espera pedidos y los clientes los inician.
  - id: internet
    titulo: Internet
    area: { x: 78.3, y: 3.3, ancho: 19.5, alto: 15.3 }
    texto: >-
      La red de redes: millones de redes de empresas, proveedores y hogares unidas por
      routers. Nadie la administra entera. Se llega a ella a través del proveedor (ISP).
  - id: sucursal
    titulo: Sucursal por WAN
    area: { x: 80.7, y: 74, ancho: 17.8, alto: 16.3 }
    texto: >-
      Una WAN une redes que están lejos entre sí, por enlaces que se contratan a un proveedor
      (fibra, MPLS) o por túneles cifrados sobre internet (VPN, en el módulo 2.6). Es más
      lenta y más cara que la LAN.
