- { id: t1, frente: "Valores de un octeto de máscara", dorso: "0, 128, 192, 224, 240, 248, 252, 254, 255 (0 a 8 unos seguidos)." }
- { id: t2, frente: "/24, /25, /26, /27, /28, /30", dorso: "255.255.255.0 (254 hosts) · .128 (126) · .192 (62) · .224 (30) · .240 (14) · .252 (2)." }
- { id: t3, frente: "Dirección de red y broadcast", dorso: "Red: IP AND máscara (bits de host en 0). Broadcast: bits de host en 1. Ninguna se usa para equipos." }
- { id: t4, frente: "Hosts utilizables", dorso: "2^(bits de host) − 2. Ejemplo: /27 → 2⁵ − 2 = 30." }
- { id: t5, frente: "Tamaño de bloque", dorso: "256 − valor de la máscara en el octeto del corte. /26 → 64: redes en 0, 64, 128, 192." }
- { id: t6, frente: "/31 y /32", dorso: "/31: 2 direcciones, ambas utilizables (enlace entre routers). /32: un solo equipo." }
