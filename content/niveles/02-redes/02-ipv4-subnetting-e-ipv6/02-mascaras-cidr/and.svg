<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">192.168.10.77/26: red, broadcast y rango con el último octeto en binario</text>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="15">
    <text x="20" y="68">IP        192.168.10.</text><text x="300" y="68">01</text><text x="324" y="68">001101</text><text x="430" y="68" font-family="system-ui" font-size="12.5">= 77</text>
    <text x="20" y="100">Máscara   255.255.255.</text><text x="300" y="100">11</text><text x="324" y="100">000000</text><text x="430" y="100" font-family="system-ui" font-size="12.5">= 192 (/26: 24 + 2 bits)</text>
    <text x="20" y="150">Red       192.168.10.</text><text x="300" y="150">01</text><text x="324" y="150">000000</text><text x="430" y="150" font-family="system-ui" font-size="12.5">= 64   IP AND máscara: los bits de host en 0</text>
    <text x="20" y="182">Broadcast 192.168.10.</text><text x="300" y="182">01</text><text x="324" y="182">111111</text><text x="430" y="182" font-family="system-ui" font-size="12.5">= 127  los bits de host en 1</text>
  </g>
  <line x1="20" y1="120" x2="420" y2="120" stroke="currentColor"/>
  <rect x="296" y="46" width="24" height="146" fill="var(--info-soft, #e0e9fd)" opacity="0.6"/>
  <rect x="322" y="46" width="76" height="146" fill="var(--ok-soft, #dcf3e6)" opacity="0.6"/>
  <g fill="currentColor" font-size="11.5" text-anchor="middle"><text x="308" y="210">red</text><text x="360" y="210">host (6 bits)</text></g>
  <rect x="20" y="232" width="820" height="84" rx="10" fill="var(--surface-2, #f1f3f5)" stroke="currentColor"/>
  <g fill="currentColor">
    <text x="36" y="256" font-weight="700">Resultado</text>
    <text x="36" y="278">Red: 192.168.10.64/26 · Broadcast: 192.168.10.127 · Rango utilizable: .65 a .126</text>
    <text x="36" y="300">Hosts: 2⁶ − 2 = 62 (se restan la dirección de red y la de broadcast)</text>
  </g>
</svg>
