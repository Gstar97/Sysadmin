- { id: t1, frente: "VLSM", dorso: "Subnetting con un prefijo distinto para cada subred, el justo para sus hosts." }
- { id: t2, frente: "Método VLSM", dorso: "Ordenar de mayor a menor → prefijo justo (2ʰ − 2 ≥ hosts) → ubicar en la primera dirección libre múltiplo del tamaño → documentar." }
- { id: t3, frente: "Por qué de mayor a menor", dorso: "Cada subred empieza en un múltiplo de su tamaño; empezando por las grandes, todas encajan sin huecos." }
- { id: t4, frente: "Tabla de direccionamiento", dorso: "Área, red/prefijo, puerta de enlace, rango de IP fijas, rango de DHCP, VLAN, observaciones y espacio libre." }
- { id: t5, frente: "Margen", dorso: "Planificar con el crecimiento esperado (muchas empresas, el doble). Un área llena el primer día obliga a rehacer todo." }
