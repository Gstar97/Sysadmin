<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">192.168.30.0/24 repartida con VLSM, de la subred más grande a la más chica</text>
  <g stroke="currentColor">
    <rect x="20" y="44" width="410" height="70" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="430" y="44" width="205" height="70" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="635" y="44" width="102" height="70" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="737" y="44" width="51" height="70" fill="var(--accent-soft, #d9efe9)"/>
    <rect x="788" y="44" width="13" height="70" fill="var(--surface-2, #f1f3f5)"/>
    <rect x="801" y="44" width="13" height="70" fill="var(--surface-2, #f1f3f5)"/>
    <rect x="814" y="44" width="26" height="70" fill="none" stroke-dasharray="4 3"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="225" y="74" font-weight="700">Ventas · /25</text><text x="225" y="94" font-size="11.5">.0 a .127 · 126 hosts</text>
    <text x="532" y="74" font-weight="700">Administración · /26</text><text x="532" y="94" font-size="11.5">.128 a .191 · 62</text>
    <text x="686" y="74" font-weight="700">IT · /27</text><text x="686" y="94" font-size="11.5">.192 a .223</text>
    <text x="762" y="74" font-weight="700" font-size="11">Ger.</text><text x="762" y="94" font-size="10">/28</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="760" y="140">↑ .224/28 Gerencia</text>
    <text x="700" y="160">↑ .240/30 y .244/30: enlaces WAN</text>
    <text x="700" y="180">↑ .248/29 libre para crecer</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="20" y="150">1. Ordenar de mayor a menor: 100, 50, 25, 10, 2, 2 hosts.</text>
    <text x="20" y="172">2. A cada una, el prefijo más chico que alcanza (con su −2).</text>
    <text x="20" y="194">3. Ubicar cada bloque justo después del anterior, en un múltiplo de su tamaño.</text>
    <text x="20" y="216">4. Anotar todo en la tabla de direccionamiento, incluido lo que queda libre.</text>
    <text x="20" y="244" font-size="11.5">Con subredes iguales (/25 para todas) no habrían entrado ni las seis: VLSM aprovecha el espacio.</text>
  </g>
</svg>
