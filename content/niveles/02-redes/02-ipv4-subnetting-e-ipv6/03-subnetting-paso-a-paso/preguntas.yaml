- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: Si divides un /24 tomando 2 bits prestados, ¿cuántas subredes obtienes y con qué prefijo?
  opciones:
    - { texto: "4 subredes /26", correcta: true, explicacion: "2² = 4 subredes; 24 + 2 = 26." }
    - { texto: "2 subredes /25", explicacion: "Eso es con 1 bit prestado." }
    - { texto: "4 subredes /22", explicacion: "Los bits prestados se suman al prefijo, no se restan." }
    - { texto: "8 subredes /27", explicacion: "Eso es con 3 bits prestados." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Cuántos bits hay que tomar prestados para obtener al menos 6 subredes?
  opciones:
    - { texto: "3 (dan 8 subredes)", correcta: true, explicacion: "2 bits dan 4, que no alcanza; 3 dan 8." }
    - { texto: "2", explicacion: "2² = 4 subredes: faltan." }
    - { texto: "6", explicacion: "Serían 64 subredes, muchísimas más de las necesarias." }
    - { texto: "1", explicacion: "Solo 2 subredes." }
- id: p03
  tipo: opcion_multiple
  dificultad: 1
  enunciado: ¿Cuál es la razón más importante para separar a los invitados en una subred propia?
  opciones:
    - { texto: "Poder poner reglas de firewall entre ellos y el resto de la red", correcta: true, explicacion: "Si están en la misma red que los servidores, no hay un punto donde filtrar." }
    - { texto: "Que el Wi-Fi sea más rápido", explicacion: "La velocidad no depende de la subred." }
    - { texto: "Ahorrar direcciones IP", explicacion: "Dividir no ahorra direcciones; las organiza." }
    - { texto: "Que no necesiten DNS", explicacion: "Lo siguen necesitando." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Divides 192.168.20.0/24 en subredes /27. ¿Cuál es la tercera subred?
  opciones:
    - { texto: "192.168.20.64/27", correcta: true, explicacion: "Bloques de 32: .0, .32, .64. La tercera es .64." }
    - { texto: "192.168.20.96/27", explicacion: "Esa es la cuarta." }
    - { texto: "192.168.20.3/27", explicacion: "Las subredes avanzan por el tamaño de bloque, no de a uno." }
    - { texto: "192.168.20.32/27", explicacion: "Esa es la segunda." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: En 192.168.20.0/24 dividida en /27, ¿cuál es el broadcast de la subred 192.168.20.96?
  opciones:
    - { texto: "192.168.20.127", correcta: true, explicacion: "La siguiente subred es .128; su broadcast es la anterior: .127." }
    - { texto: "192.168.20.255", explicacion: "Ese es el broadcast de toda la /24." }
    - { texto: "192.168.20.96", explicacion: "Esa es la dirección de red." }
    - { texto: "192.168.20.128", explicacion: "Esa es la red siguiente." }
- id: p06
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Necesitas subredes de al menos 500 hosts. ¿Qué prefijo usas?
  opciones:
    - { texto: "/23 (510 hosts)", correcta: true, explicacion: "Hacen falta 9 bits de host: 2⁹ − 2 = 510." }
    - { texto: "/24", explicacion: "254 hosts: no alcanza." }
    - { texto: "/22", explicacion: "1022 hosts: alcanza, pero sobra mucho." }
    - { texto: "/25", explicacion: "126 hosts." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Divides 10.10.0.0/16 en subredes /23. ¿Cuántas subredes salen?
  opciones:
    - { texto: "128", correcta: true, explicacion: "Se prestaron 23 − 16 = 7 bits: 2⁷ = 128." }
    - { texto: "23", explicacion: "23 es el nuevo prefijo." }
    - { texto: "7", explicacion: "7 son los bits prestados, no las subredes." }
    - { texto: "256", explicacion: "Serían 8 bits prestados (/24)." }
- id: p08
  tipo: opcion_multiple
  dificultad: 3
  enunciado: En la subred 10.10.4.0/23, ¿se le puede asignar a un equipo la dirección 10.10.4.255?
  opciones:
    - { texto: "Sí: la subred va de 10.10.4.0 a 10.10.5.255, y .4.255 está en el medio", correcta: true, explicacion: "En una /23 el rango cruza el tercer octeto; solo 10.10.4.0 (red) y 10.10.5.255 (broadcast) no se usan." }
    - { texto: "No: todo lo que termina en .255 es broadcast", explicacion: "Solo es broadcast la última dirección de la subred." }
    - { texto: "No: es la dirección de red", explicacion: "La de red es 10.10.4.0." }
    - { texto: "Solo si el equipo es un router", explicacion: "Cualquier equipo puede tenerla." }
- id: p09
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Alguien configuró una subred como 192.168.20.40/27. ¿Qué está mal?
  opciones:
    - { texto: "Una /27 tiene que empezar en un múltiplo de 32; .40 está dentro de la subred .32/27", correcta: true, explicacion: "La red correcta es 192.168.20.32/27; .40 sería un equipo de esa subred." }
    - { texto: "Nada", explicacion: ".40 no es una dirección de red válida para una /27." }
    - { texto: "/27 no existe", explicacion: "Existe: 30 hosts." }
    - { texto: "Falta la máscara en decimal", explicacion: "El prefijo alcanza." }
- id: p10
  tipo: ordenar_pasos
  enunciado: Ordena los pasos para resolver "dividir 172.16.0.0/16 en subredes de 1000 hosts".
  pasos:
    - "Buscar los bits de host: 2¹⁰ − 2 = 1022 alcanza (2⁹ − 2 = 510 no)"
    - "Nuevo prefijo: 32 − 10 = /22"
    - "Tamaño de bloque: 1024 direcciones, 4 en el tercer octeto"
    - "Listar: 172.16.0.0/22, 172.16.4.0/22, 172.16.8.0/22..."
    - "Anotar red, rango y broadcast de las que se van a usar"
  explicacion: El mismo método de siempre; cuando partes de los hosts, empiezas por los bits de host.
