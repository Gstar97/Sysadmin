tipo: ordenar
consigna: Ordena los pasos para dividir una red en subredes iguales.
pasos:
  - "Averiguar cuántas subredes (o cuántos hosts por subred) hacen falta"
  - "Calcular cuántos bits hay que tomar prestados de la parte de host"
  - "Escribir el nuevo prefijo (prefijo original + bits prestados)"
  - "Calcular el tamaño de bloque (2 elevado a los bits de host que quedan)"
  - "Listar las subredes sumando el tamaño de bloque desde la red original"
  - "Para cada subred, anotar red, primera, última y broadcast"
explicacion: >-
  Siempre el mismo orden. Los primeros tres pasos deciden el tamaño; los últimos tres son
  sumar y restar.
