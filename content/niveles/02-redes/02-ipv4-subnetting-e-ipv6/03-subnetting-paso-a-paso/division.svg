<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">192.168.20.0/24 dividida en 4 subredes /26 (se toman 2 bits prestados)</text>
  <rect x="20" y="42" width="820" height="40" rx="6" fill="var(--surface-2, #f1f3f5)" stroke="currentColor"/>
  <text x="430" y="67" text-anchor="middle" font-weight="700" fill="currentColor">192.168.20.0/24 · 256 direcciones</text>
  <g stroke="currentColor">
    <rect x="20" y="104" width="202" height="112" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="226" y="104" width="202" height="112" rx="6" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="432" y="104" width="202" height="112" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="638" y="104" width="202" height="112" rx="6" fill="var(--accent-soft, #d9efe9)"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="126" font-weight="700">Subred 1 · bits 00</text>
    <text x="34" y="146" font-family="ui-monospace, monospace" font-size="12">red   .0/26</text>
    <text x="34" y="164" font-family="ui-monospace, monospace" font-size="12">hosts .1 a .62</text>
    <text x="34" y="182" font-family="ui-monospace, monospace" font-size="12">bcast .63</text>
    <text x="34" y="204" font-size="11.5">Ventas</text>
    <text x="240" y="126" font-weight="700">Subred 2 · bits 01</text>
    <text x="240" y="146" font-family="ui-monospace, monospace" font-size="12">red   .64/26</text>
    <text x="240" y="164" font-family="ui-monospace, monospace" font-size="12">hosts .65 a .126</text>
    <text x="240" y="182" font-family="ui-monospace, monospace" font-size="12">bcast .127</text>
    <text x="240" y="204" font-size="11.5">Administración</text>
    <text x="446" y="126" font-weight="700">Subred 3 · bits 10</text>
    <text x="446" y="146" font-family="ui-monospace, monospace" font-size="12">red   .128/26</text>
    <text x="446" y="164" font-family="ui-monospace, monospace" font-size="12">hosts .129 a .190</text>
    <text x="446" y="182" font-family="ui-monospace, monospace" font-size="12">bcast .191</text>
    <text x="446" y="204" font-size="11.5">Depósito</text>
    <text x="652" y="126" font-weight="700">Subred 4 · bits 11</text>
    <text x="652" y="146" font-family="ui-monospace, monospace" font-size="12">red   .192/26</text>
    <text x="652" y="164" font-family="ui-monospace, monospace" font-size="12">hosts .193 a .254</text>
    <text x="652" y="182" font-family="ui-monospace, monospace" font-size="12">bcast .255</text>
    <text x="652" y="204" font-size="11.5">Servidores</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="20" y="246">Cada subred: 2⁶ = 64 direcciones, 62 hosts. Las redes avanzan de 64 en 64 (el tamaño de bloque).</text>
    <text x="20" y="268">Cada una es su propio dominio de broadcast: para pasar de una a otra hace falta un router.</text>
    <text x="20" y="290">Los 2 bits prestados son los primeros del último octeto: 00, 01, 10 y 11 dan las cuatro subredes.</text>
  </g>
</svg>
