- { id: t1, frente: "Bits prestados", dorso: "Se pasan bits de host a la red. Cada bit duplica las subredes y divide por dos su tamaño." }
- { id: t2, frente: "Por cantidad de subredes", dorso: "Menor n con 2ⁿ ≥ subredes. 6 subredes → 3 bits (8). Nuevo prefijo = original + n." }
- { id: t3, frente: "Por cantidad de hosts", dorso: "Menor h con 2ʰ − 2 ≥ hosts. 500 hosts → 9 bits (510) → /23." }
- { id: t4, frente: "Listar subredes", dorso: "Empezar en la red original y sumar el tamaño de bloque. Broadcast de cada una = siguiente red − 1." }
- { id: t5, frente: "Dónde empieza una subred", dorso: "En un múltiplo de su tamaño de bloque. Una /27 empieza en .0, .32, .64... nunca en .40." }
- { id: t6, frente: "Rangos que cruzan octetos", dorso: "Con prefijos menores a /24 (como /23), direcciones como x.x.4.255 son equipos normales." }
