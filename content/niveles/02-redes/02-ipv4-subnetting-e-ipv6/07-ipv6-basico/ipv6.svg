<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">Una IPv6: 128 bits en 8 grupos de 4 dígitos hexadecimales</text>
  <text x="430" y="62" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="currentColor">2001:0db8:0a10:0005:0000:0000:0000:0020</text>
  <g stroke="currentColor">
    <rect x="96" y="76" width="226" height="40" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="326" y="76" width="70" height="40" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="400" y="76" width="366" height="40" rx="6" fill="var(--ok-soft, #dcf3e6)"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="12">
    <text x="209" y="94" font-weight="700">Prefijo del sitio (48 bits)</text><text x="209" y="109" font-size="11">lo asigna el proveedor</text>
    <text x="361" y="94" font-weight="700">Subred</text><text x="361" y="109" font-size="11">16 bits</text>
    <text x="583" y="94" font-weight="700">Identificador de interfaz (64 bits)</text><text x="583" y="109" font-size="11">el equipo, dentro de la subred</text>
  </g>
  <text x="430" y="140" text-anchor="middle" font-size="12" fill="currentColor">Los primeros 64 bits son la red (/64): así es en todas las LAN, y SLAAC lo necesita.</text>
  <text x="20" y="176" font-weight="700" fill="currentColor">Cómo se abrevia (RFC 5952)</text>
  <g fill="currentColor" font-size="12.5">
    <text x="20" y="200">1. Se sacan los ceros a la izquierda de cada grupo: 0db8 → db8, 0a10 → a10, 0005 → 5, 0020 → 20.</text>
    <text x="20" y="222">2. La secuencia más larga de grupos en 0 se reemplaza por :: (una sola vez por dirección).</text>
    <text x="20" y="244">3. Minúsculas.</text>
  </g>
  <text x="430" y="274" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" font-weight="700" fill="currentColor">2001:db8:a10:5::20/64</text>
  <g fill="currentColor" font-size="12">
    <text x="20" y="310"><tspan font-weight="700">Tipos:</tspan> 2000::/3 global (pública) · fe80::/10 enlace local (todas las interfaces tienen una) · fc00::/7 ULA (privada; en la práctica fd00::/8)</text>
    <text x="20" y="332">ff00::/8 multicast (no hay broadcast) · ::1 loopback · :: sin especificar · 2001:db8::/32 documentación</text>
  </g>
</svg>
