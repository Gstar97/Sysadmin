- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Cuántos bits tiene una dirección IPv6?
  opciones:
    - { texto: "128", correcta: true, explicacion: "8 grupos de 16 bits." }
    - { texto: "32", explicacion: "Esa es IPv4." }
    - { texto: "64", explicacion: "64 es el tamaño típico del prefijo de red (o del identificador de interfaz)." }
    - { texto: "48", explicacion: "48 es el prefijo que suele recibir una empresa." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Cuál es la forma abreviada correcta de 2001:0db8:0000:0000:0000:0000:0000:0001?
  opciones:
    - { texto: "2001:db8::1", correcta: true, explicacion: "Se sacan los ceros a la izquierda y la secuencia de grupos en 0 se reemplaza por ::." }
    - { texto: "2001:db8:0:0:0:0:0:1", explicacion: "Es válida, pero no es la forma abreviada: falta usar ::." }
    - { texto: "2001:db8::0001", explicacion: "Faltan sacar los ceros a la izquierda del último grupo." }
    - { texto: "21:db8::1", explicacion: "Solo se sacan ceros a la izquierda, no del medio: 2001 queda igual." }
- id: p03
  tipo: opcion_multiple
  dificultad: 1
  enunciado: Toda interfaz con IPv6 tiene una dirección que empieza con fe80. ¿Qué es?
  opciones:
    - { texto: "La dirección de enlace local: sirve para hablar con los equipos de la misma red", correcta: true, explicacion: "Se configura sola y no se enruta fuera de la red." }
    - { texto: "Una dirección pública", explicacion: "Las globales empiezan con 2 o 3 (2000::/3)." }
    - { texto: "La puerta de enlace", explicacion: "Es una dirección del propio equipo (aunque los routers también usan las suyas fe80 como puerta de enlace)." }
    - { texto: "Un error de configuración", explicacion: "Es normal y necesaria." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Cuál es el equivalente IPv6 de las direcciones privadas de IPv4?
  opciones:
    - { texto: "Las ULA (fc00::/7; en la práctica fd00::/8)", correcta: true, explicacion: "Son para redes internas y no se enrutan en internet." }
    - { texto: "Las de enlace local (fe80::/10)", explicacion: "Esas no salen de la propia red; las ULA sí se enrutan dentro de la empresa." }
    - { texto: "Las de documentación (2001:db8::/32)", explicacion: "Son solo para ejemplos." }
    - { texto: "No existe", explicacion: "Existe: ULA." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué prefijo se usa en una red local IPv6 de clientes?
  opciones:
    - { texto: "/64", correcta: true, explicacion: "Es el estándar, y SLAAC lo necesita." }
    - { texto: "/24", explicacion: "Es un prefijo típico de IPv4." }
    - { texto: "/128", explicacion: "/128 es un solo equipo." }
    - { texto: "El que haga falta según los hosts", explicacion: "En IPv6 no se calcula por hosts: todas las LAN son /64." }
- id: p06
  tipo: opcion_multiple
  dificultad: 2
  enunciado: El proveedor le asignó a la empresa el prefijo 2001:db8:a10::/48. ¿Cuántas subredes /64 puede armar?
  opciones:
    - { texto: "65.536", correcta: true, explicacion: "Quedan 16 bits entre el /48 y el /64: 2¹⁶." }
    - { texto: "256", explicacion: "Eso sería con un /56." }
    - { texto: "16", explicacion: "16 son los bits, no las subredes." }
    - { texto: "Una sola", explicacion: "Un /48 se divide en muchas /64." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué hace un equipo con SLAAC?
  opciones:
    - { texto: "Toma el prefijo /64 del anuncio del router y arma él solo los 64 bits de su parte", correcta: true, explicacion: "Sin servidor DHCP: por eso es autoconfiguración sin estado." }
    - { texto: "Le pide la dirección a un servidor DHCPv6", explicacion: "Eso es DHCPv6." }
    - { texto: "Usa siempre su IPv4 convertida", explicacion: "No hay conversión de IPv4." }
    - { texto: "Elige una dirección fe80 y nada más", explicacion: "La de enlace local la tiene siempre; SLAAC le agrega la global." }
- id: p08
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué protocolo reemplaza a ARP en IPv6?
  opciones:
    - { texto: "NDP (descubrimiento de vecinos), que va dentro de ICMPv6", correcta: true, explicacion: "Usa solicitudes y anuncios de vecino por multicast." }
    - { texto: "DHCPv6", explicacion: "DHCPv6 reparte direcciones; no resuelve MAC." }
    - { texto: "ARPv6", explicacion: "No existe." }
    - { texto: "DNS", explicacion: "El DNS traduce nombres." }
- id: p09
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Un firewall bloquea todo ICMPv6 "por seguridad" y los equipos dejan de tener IPv6. ¿Por qué?
  opciones:
    - { texto: "Porque NDP y los anuncios de router van por ICMPv6: sin ellos no hay vecinos ni autoconfiguración", correcta: true, explicacion: "En IPv6, ICMPv6 es parte del funcionamiento básico; se filtra con cuidado, no se bloquea entero." }
    - { texto: "Porque IPv6 necesita ping para funcionar", explicacion: "No es el ping: son los mensajes de NDP." }
    - { texto: "Porque el firewall bloquea también IPv4", explicacion: "IPv4 no se ve afectado." }
    - { texto: "No tiene relación", explicacion: "Tiene relación directa." }
- id: p10
  tipo: opcion_multiple
  dificultad: 3
  enunciado: ¿Por qué 2001:db8::5::1 no es una dirección válida?
  opciones:
    - { texto: "Porque usa :: dos veces y no se puede saber cuántos grupos en 0 hay en cada lugar", correcta: true, explicacion: ":: se usa una sola vez por dirección." }
    - { texto: "Porque tiene menos de 8 grupos", explicacion: "Con :: se pueden escribir menos grupos." }
    - { texto: "Porque empieza con 2001", explicacion: "2001 es un comienzo normal." }
    - { texto: "Sí es válida", explicacion: "Es ambigua." }
