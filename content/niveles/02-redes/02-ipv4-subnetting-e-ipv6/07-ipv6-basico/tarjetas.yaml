- { id: t1, frente: "Abreviar una IPv6", dorso: "Sacar ceros a la izquierda de cada grupo y reemplazar UNA vez la secuencia más larga de grupos en 0 por ::. Minúsculas." }
- { id: t2, frente: "Tipos de IPv6", dorso: "2000::/3 global · fe80::/10 enlace local · fc00::/7 ULA (fd00::/8) · ff00::/8 multicast · ::1 loopback · 2001:db8::/32 documentación." }
- { id: t3, frente: "/64, /56, /48", dorso: "Cada LAN es /64. Un hogar recibe /56 (256 subredes) y una empresa /48 (65.536 subredes)." }
- { id: t4, frente: "SLAAC y DHCPv6", dorso: "SLAAC: el equipo arma su dirección con el prefijo del anuncio del router. DHCPv6: la reparte un servidor." }
- { id: t5, frente: "NDP", dorso: "Reemplaza a ARP: solicitud y anuncio de vecino por multicast, anuncios de router y detección de duplicados. Va en ICMPv6." }
- { id: t6, frente: "Doble pila", dorso: "IPv4 e IPv6 a la vez. Firewall, DNS y servicios tienen que contemplar las dos." }
- { id: t7, frente: "Comandos IPv6 en Linux", dorso: "ip -6 addr · ip -6 route · ping -6 · ip -6 neigh · ping fe80::1%enp0s3 para enlace local." }
