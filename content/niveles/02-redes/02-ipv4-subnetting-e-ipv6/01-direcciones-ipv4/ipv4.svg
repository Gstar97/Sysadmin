<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">Una IPv4: 32 bits en cuatro octetos</text>
  <g stroke="currentColor">
    <rect x="20" y="40" width="190" height="62" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="215" y="40" width="190" height="62" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="410" y="40" width="190" height="62" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="605" y="40" width="190" height="62" rx="6" fill="var(--ok-soft, #dcf3e6)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="115" y="66" font-size="20" font-weight="700">192</text><text x="310" y="66" font-size="20" font-weight="700">168</text><text x="505" y="66" font-size="20" font-weight="700">10</text><text x="700" y="66" font-size="20" font-weight="700">37</text>
    <g font-family="ui-monospace, monospace" font-size="12"><text x="115" y="90">11000000</text><text x="310" y="90">10101000</text><text x="505" y="90">00001010</text><text x="700" y="90">00100101</text></g>
  </g>
  <line x1="20" y1="114" x2="600" y2="114" stroke="currentColor" stroke-width="2"/>
  <line x1="605" y1="114" x2="795" y2="114" stroke="currentColor" stroke-width="2"/>
  <g fill="currentColor" text-anchor="middle"><text x="310" y="132" font-weight="700">Parte de red (24 bits): 192.168.10</text><text x="700" y="132" font-weight="700">Parte de host (8 bits): 37</text></g>
  <text x="430" y="152" text-anchor="middle" font-size="11.5" fill="currentColor">El /24 dice dónde está el corte. Cada octeto va de 0 a 255 (8 bits).</text>
  <text x="20" y="190" font-weight="700" fill="currentColor">Rangos que tienes que reconocer de memoria</text>
  <g stroke="currentColor">
    <rect x="20" y="200" width="270" height="88" rx="8" fill="var(--ok-soft, #dcf3e6)"/>
    <rect x="300" y="200" width="270" height="88" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="580" y="200" width="260" height="88" rx="8" fill="var(--surface-2, #f1f3f5)"/>
    <rect x="20" y="296" width="270" height="88" rx="8" fill="var(--accent-soft, #d9efe9)"/>
    <rect x="300" y="296" width="270" height="88" rx="8" fill="var(--surface-2, #f1f3f5)"/>
    <rect x="580" y="296" width="260" height="88" rx="8" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="222" font-weight="700">Privadas (RFC 1918)</text>
    <text x="34" y="242" font-family="ui-monospace, monospace" font-size="12">10.0.0.0/8</text>
    <text x="34" y="259" font-family="ui-monospace, monospace" font-size="12">172.16.0.0/12 (172.16 a 172.31)</text>
    <text x="34" y="276" font-family="ui-monospace, monospace" font-size="12">192.168.0.0/16</text>
    <text x="314" y="222" font-weight="700">CGNAT (RFC 6598)</text>
    <text x="314" y="242" font-family="ui-monospace, monospace" font-size="12">100.64.0.0/10 (100.64 a 100.127)</text>
    <text x="314" y="262" font-size="11.5">La usa el proveedor para compartir</text>
    <text x="314" y="278" font-size="11.5">una IP pública entre muchos clientes</text>
    <text x="594" y="222" font-weight="700">Loopback</text>
    <text x="594" y="242" font-family="ui-monospace, monospace" font-size="12">127.0.0.0/8</text>
    <text x="594" y="262" font-size="11.5">El propio equipo (127.0.0.1)</text>
    <text x="34" y="318" font-weight="700">Enlace local (APIPA)</text>
    <text x="34" y="338" font-family="ui-monospace, monospace" font-size="12">169.254.0.0/16</text>
    <text x="34" y="358" font-size="11.5">Se la pone un equipo que no recibió</text>
    <text x="34" y="374" font-size="11.5">respuesta de DHCP</text>
    <text x="314" y="318" font-weight="700">Multicast y reservadas</text>
    <text x="314" y="338" font-family="ui-monospace, monospace" font-size="12">224.0.0.0/4 (224 a 239)</text>
    <text x="314" y="356" font-family="ui-monospace, monospace" font-size="12">240.0.0.0/4 · 255.255.255.255</text>
    <text x="594" y="318" font-weight="700">Documentación (RFC 5737)</text>
    <text x="594" y="338" font-family="ui-monospace, monospace" font-size="12">192.0.2.0/24</text>
    <text x="594" y="355" font-family="ui-monospace, monospace" font-size="12">198.51.100.0/24</text>
    <text x="594" y="372" font-family="ui-monospace, monospace" font-size="12">203.0.113.0/24</text>
  </g>
</svg>
