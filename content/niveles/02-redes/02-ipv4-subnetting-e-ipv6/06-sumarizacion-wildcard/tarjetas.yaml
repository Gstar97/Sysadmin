- { id: t1, frente: "Sumarizar", dorso: "Varias redes contiguas en una sola ruta. Se cuentan los bits en común desde la izquierda." }
- { id: t2, frente: "Atajo para sumarizar", dorso: "2ⁿ redes seguidas del mismo tamaño → prefijo − n, solo si la primera es múltiplo de 2ⁿ. 4 /24 desde .20 → /22." }
- { id: t3, frente: "Wildcard", dorso: "255.255.255.255 − máscara. 0 = tiene que coincidir; 1 = no importa. /24 → 0.0.0.255 · /30 → 0.0.0.3." }
- { id: t4, frente: "Dónde se usa la wildcard", dorso: "ACL y OSPF de Cisco. 0.0.0.0 = un equipo (host); 255.255.255.255 = cualquiera (any)." }
- { id: t5, frente: "Resumen demasiado amplio", dorso: "Abarca redes que están en otro lado y manda su tráfico al lugar equivocado." }
