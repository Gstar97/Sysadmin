<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">Cuatro redes de la sucursal, resumidas en una sola ruta</text>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="14">
    <text x="20" y="64">172.16.</text><text x="92" y="64">000101</text><text x="152" y="64">00</text><text x="176" y="64">.0/24   (172.16.20.0)</text>
    <text x="20" y="90">172.16.</text><text x="92" y="90">000101</text><text x="152" y="90">01</text><text x="176" y="90">.0/24   (172.16.21.0)</text>
    <text x="20" y="116">172.16.</text><text x="92" y="116">000101</text><text x="152" y="116">10</text><text x="176" y="116">.0/24   (172.16.22.0)</text>
    <text x="20" y="142">172.16.</text><text x="92" y="142">000101</text><text x="152" y="142">11</text><text x="176" y="142">.0/24   (172.16.23.0)</text>
  </g>
  <rect x="88" y="46" width="62" height="104" fill="var(--ok-soft, #dcf3e6)" opacity="0.6"/>
  <rect x="150" y="46" width="24" height="104" fill="var(--warn-soft, #fbf0d0)" opacity="0.6"/>
  <g fill="currentColor" font-size="12">
    <text x="440" y="64">Los primeros 16 bits son iguales (172.16)</text>
    <text x="440" y="86">y en el tercer octeto coinciden 6 bits más (000101).</text>
    <text x="440" y="108">Los 2 últimos bits cambian: 00, 01, 10, 11.</text>
    <text x="440" y="136" font-weight="700">Bits en común: 16 + 6 = 22</text>
  </g>
  <rect x="20" y="166" width="820" height="46" rx="8" fill="var(--accent-soft, #d9efe9)" stroke="currentColor"/>
  <text x="430" y="195" text-anchor="middle" font-weight="700" fill="currentColor">Resumen: 172.16.20.0/22 (abarca de 172.16.20.0 a 172.16.23.255)</text>
  <text x="20" y="246" font-weight="700" fill="currentColor">La máscara wildcard es la máscara "dada vuelta"</text>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="13">
    <text x="20" y="272">máscara  255.255.252.0   (/22)</text>
    <text x="20" y="296">wildcard   0.  0.  3.255  = 255.255.255.255 − máscara</text>
  </g>
  <text x="20" y="320" font-size="11.5" fill="currentColor">En la wildcard, 0 = "este bit tiene que coincidir" y 1 = "este bit no importa". La usan las ACL y OSPF de Cisco.</text>
</svg>
