- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Cuál es la wildcard de 255.255.255.0?
  opciones:
    - { texto: "0.0.0.255", correcta: true, explicacion: "255.255.255.255 − 255.255.255.0." }
    - { texto: "255.255.255.0", explicacion: "Esa es la máscara." }
    - { texto: "0.0.0.0", explicacion: "Esa es la wildcard de /32." }
    - { texto: "255.0.0.0", explicacion: "No es la resta." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Para qué sirve sumarizar rutas?
  opciones:
    - { texto: "Para anunciar varias redes contiguas con una sola ruta y achicar las tablas de los routers", correcta: true, explicacion: "Menos rutas: tablas más chicas y más fáciles de leer." }
    - { texto: "Para que las redes tengan más hosts", explicacion: "No cambia el tamaño de las redes." }
    - { texto: "Para cifrar el tráfico", explicacion: "No tiene relación." }
    - { texto: "Para unir dos redes en una sola subred", explicacion: "Las redes siguen siendo distintas; solo se resume la ruta." }
- id: p03
  tipo: opcion_multiple
  dificultad: 1
  enunciado: ¿Cuál es la wildcard de un /30?
  opciones:
    - { texto: "0.0.0.3", correcta: true, explicacion: "Máscara 255.255.255.252: 255 − 252 = 3." }
    - { texto: "0.0.0.252", explicacion: "252 está en la máscara, no en la wildcard." }
    - { texto: "0.0.0.4", explicacion: "4 es el tamaño de bloque; la wildcard es bloque − 1." }
    - { texto: "255.255.255.252", explicacion: "Esa es la máscara." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Cuál es el resumen exacto de 172.16.20.0/24, 172.16.21.0/24, 172.16.22.0/24 y 172.16.23.0/24?
  opciones:
    - { texto: "172.16.20.0/22", correcta: true, explicacion: "Cuatro /24 alineadas (20 es múltiplo de 4): 24 − 2 = /22." }
    - { texto: "172.16.20.0/23", explicacion: "Un /23 abarca solo dos /24 (20 y 21)." }
    - { texto: "172.16.0.0/16", explicacion: "Abarca mucho más de lo que hay." }
    - { texto: "172.16.23.0/22", explicacion: "La dirección de red del /22 es 172.16.20.0." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Por qué 10.1.6.0/24, 10.1.7.0/24, 10.1.8.0/24 y 10.1.9.0/24 no se pueden resumir exactamente en un solo /22?
  opciones:
    - { texto: "Porque no empiezan en un múltiplo de 4: el /22 que contiene al 6 es 10.1.4.0/22, que incluye el 4 y el 5", correcta: true, explicacion: "Hacen falta dos rutas: 10.1.6.0/23 y 10.1.8.0/23." }
    - { texto: "Porque son cuatro redes", explicacion: "Cuatro redes sí se pueden resumir si están alineadas." }
    - { texto: "Porque son de la red 10", explicacion: "La red no importa." }
    - { texto: "Sí se pueden: 10.1.6.0/22", explicacion: "10.1.6.0 no es una dirección de red válida para un /22." }
- id: p06
  tipo: opcion_multiple
  dificultad: 2
  enunciado: En una ACL de Cisco, ¿qué deja pasar "permit 192.168.10.0 0.0.0.255"?
  opciones:
    - { texto: "Todo lo que empiece con 192.168.10 (la red /24 completa)", correcta: true, explicacion: "Los ceros obligan a coincidir los tres primeros octetos; el 255 dice que el último no importa." }
    - { texto: "Solo 192.168.10.0", explicacion: "Eso sería con wildcard 0.0.0.0." }
    - { texto: "Solo 192.168.10.255", explicacion: "La wildcard no es una dirección." }
    - { texto: "Nada", explicacion: "Deja pasar la red completa." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué wildcard selecciona un único equipo?
  opciones:
    - { texto: "0.0.0.0 (todos los bits tienen que coincidir)", correcta: true, explicacion: "En Cisco también se escribe con la palabra host." }
    - { texto: "255.255.255.255", explicacion: "Esa selecciona cualquier dirección (any)." }
    - { texto: "0.0.0.1", explicacion: "Selecciona dos direcciones." }
    - { texto: "255.255.255.0", explicacion: "Interpretada como wildcard, ignora los tres primeros octetos." }
- id: p08
  tipo: opcion_multiple
  dificultad: 3
  enunciado: ¿Cuál es el resumen de 192.168.64.0/24 a 192.168.71.0/24 (ocho redes)?
  opciones:
    - { texto: "192.168.64.0/21", correcta: true, explicacion: "Ocho /24 alineadas (64 es múltiplo de 8): 24 − 3 = /21." }
    - { texto: "192.168.64.0/22", explicacion: "Un /22 abarca solo cuatro /24." }
    - { texto: "192.168.64.0/20", explicacion: "Un /20 abarca dieciséis /24." }
    - { texto: "192.168.71.0/21", explicacion: "La red del /21 es la primera: 192.168.64.0." }
- id: p09
  tipo: opcion_multiple
  dificultad: 3
  enunciado: La casa central resume hacia la sucursal A la ruta 10.0.0.0/8, pero la sucursal B usa 10.50.0.0/16. ¿Qué pasa con el tráfico hacia la sucursal B?
  opciones:
    - { texto: "Si no hay una ruta más específica hacia B, va a la sucursal A, que no la tiene", correcta: true, explicacion: "El resumen es demasiado amplio. (Con una ruta /16 hacia B, gana la más específica: lo vas a ver en el módulo 2.5.)" }
    - { texto: "Llega igual a B", explicacion: "Solo si existe una ruta más específica hacia B." }
    - { texto: "Se divide entre las dos", explicacion: "Los routers eligen una ruta, no reparten por igual en este caso." }
    - { texto: "El router rechaza el resumen", explicacion: "El router lo acepta: es una ruta válida." }
