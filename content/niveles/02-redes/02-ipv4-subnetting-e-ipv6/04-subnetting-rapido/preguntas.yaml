- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Cuál es el tamaño de bloque de un /28?
  opciones:
    - { texto: "16", correcta: true, explicacion: "/28 = 24 + 4: máscara 240 en el último octeto; 256 − 240 = 16." }
    - { texto: "28", explicacion: "28 es el prefijo." }
    - { texto: "14", explicacion: "14 son los hosts utilizables." }
    - { texto: "32", explicacion: "Ese es el bloque de /27." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Cuál es la dirección de red de 10.1.1.100/27?
  opciones:
    - { texto: "10.1.1.96", correcta: true, explicacion: "Bloque 32: 0, 32, 64, 96, 128. 100 cae en el que empieza en 96." }
    - { texto: "10.1.1.64", explicacion: "Ese bloque termina en 95." }
    - { texto: "10.1.1.100", explicacion: "Es la dirección del equipo." }
    - { texto: "10.1.1.0", explicacion: "Sería con /24 (o /25)." }
- id: p03
  tipo: opcion_multiple
  dificultad: 1
  enunciado: ¿En qué octeto cae el corte de un /19?
  opciones:
    - { texto: "En el tercero", correcta: true, explicacion: "/17 a /24 tienen el corte en el tercer octeto: /19 = 16 + 3." }
    - { texto: "En el segundo", explicacion: "Eso es para /9 a /16." }
    - { texto: "En el cuarto", explicacion: "Eso es para /25 a /32." }
    - { texto: "En el primero", explicacion: "Eso es para /1 a /8." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Están en la misma red 192.168.1.126/25 y 192.168.1.130/25?
  opciones:
    - { texto: "No: .126 está en la red .0 y .130 en la red .128", correcta: true, explicacion: "Bloque de 128: dos mitades del último octeto." }
    - { texto: "Sí: comparten 192.168.1", explicacion: "Con /25 el corte está dentro del último octeto." }
    - { texto: "Sí: están a solo 4 direcciones de distancia", explicacion: "La cercanía no importa: importa el bloque." }
    - { texto: "No se puede saber sin la puerta de enlace", explicacion: "Alcanza con la IP y el prefijo." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Cuántos hosts utilizables tiene un /20?
  opciones:
    - { texto: "4094", correcta: true, explicacion: "12 bits de host: 2¹² − 2 = 4094." }
    - { texto: "4096", explicacion: "Son las direcciones; los hosts son 2 menos." }
    - { texto: "2046", explicacion: "Eso es /21." }
    - { texto: "1022", explicacion: "Eso es /22." }
- id: p06
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Cuál es el broadcast de 172.16.45.200/21?
  opciones:
    - { texto: "172.16.47.255", correcta: true, explicacion: "Bloque 8 en el tercer octeto: la red empieza en 40 y la siguiente en 48. Broadcast: 47 y 255." }
    - { texto: "172.16.45.255", explicacion: "Sería con /24." }
    - { texto: "172.16.47.0", explicacion: "A la derecha del corte, el broadcast lleva 255." }
    - { texto: "172.16.63.255", explicacion: "Sería con bloque 16 (/20)." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué máscara necesitas como mínimo para 120 hosts?
  opciones:
    - { texto: "255.255.255.128 (/25)", correcta: true, explicacion: "2⁷ − 2 = 126 alcanza; 2⁶ − 2 = 62 no." }
    - { texto: "255.255.255.192 (/26)", explicacion: "Solo 62 hosts." }
    - { texto: "255.255.255.0 (/24)", explicacion: "Alcanza, pero no es la mínima." }
    - { texto: "255.255.255.120", explicacion: "120 no es un valor válido de máscara." }
- id: p08
  tipo: opcion_multiple
  dificultad: 3
  enunciado: ¿Cuál es la última dirección utilizable de 172.20.0.0/22?
  opciones:
    - { texto: "172.20.3.254", correcta: true, explicacion: "Bloque 4 en el tercer octeto: la red va de 172.20.0.0 a 172.20.3.255." }
    - { texto: "172.20.0.254", explicacion: "Sería con /24." }
    - { texto: "172.20.3.255", explicacion: "Esa es el broadcast." }
    - { texto: "172.20.4.254", explicacion: "Ya es de la red siguiente." }
- id: p09
  tipo: opcion_multiple
  dificultad: 3
  enunciado: ¿Qué red contiene a la dirección 10.130.200.5/10?
  opciones:
    - { texto: "10.128.0.0/10", correcta: true, explicacion: "/10: corte en el segundo octeto con bloque 64 (0, 64, 128, 192). 130 cae en el bloque de 128." }
    - { texto: "10.130.0.0/10", explicacion: "130 no es múltiplo de 64." }
    - { texto: "10.0.0.0/10", explicacion: "Ese bloque termina en 10.63.255.255." }
    - { texto: "10.130.200.0/10", explicacion: "A la derecha del corte, la red lleva 0." }
- id: p10
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Una PC tiene 10.20.5.33/28 y su puerta de enlace es 10.20.5.49. ¿Hay un problema?
  opciones:
    - { texto: "Sí: la PC está en la red .32 (de .33 a .46) y .49 pertenece a la red siguiente (.48)", correcta: true, explicacion: "La puerta de enlace tiene que estar en la misma red que el equipo." }
    - { texto: "No: las dos empiezan con 10.20.5", explicacion: "Con /28 el corte está en el último octeto, de 16 en 16." }
    - { texto: "No, mientras el router responda", explicacion: "La PC no la considera en su red." }
    - { texto: "Sí: .49 es un broadcast", explicacion: ".49 es la primera utilizable de la red .48; el problema es que no está en la red de la PC." }
