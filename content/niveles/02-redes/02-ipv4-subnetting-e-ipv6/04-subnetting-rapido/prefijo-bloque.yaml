tipo: emparejar
consigna: Uní cada prefijo con su tamaño de bloque en el octeto del corte.
pares:
  - { a: "/25", b: "128" }
  - { a: "/26", b: "64" }
  - { a: "/27", b: "32" }
  - { a: "/28", b: "16" }
  - { a: "/29", b: "8" }
  - { a: "/30", b: "4" }
explicacion: >-
  El patrón se repite en cada octeto: /17 es como /25 (bloque 128, pero en el tercer octeto),
  /18 como /26, /19 como /27, y así.
