<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="26" font-weight="700" fill="currentColor">La tabla que conviene tener en la cabeza (para el octeto donde cae el corte)</text>
  <g stroke="currentColor" fill="none"><rect x="20" y="40" width="820" height="128" rx="8"/></g>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="13">
    <text x="36" y="68" font-family="system-ui" font-weight="700">Bits de red en el octeto</text>
    <text x="250" y="68">1</text><text x="320" y="68">2</text><text x="390" y="68">3</text><text x="460" y="68">4</text><text x="530" y="68">5</text><text x="600" y="68">6</text><text x="670" y="68">7</text><text x="740" y="68">8</text>
    <text x="36" y="100" font-family="system-ui" font-weight="700">Valor de la máscara</text>
    <text x="244" y="100">128</text><text x="314" y="100">192</text><text x="384" y="100">224</text><text x="454" y="100">240</text><text x="524" y="100">248</text><text x="594" y="100">252</text><text x="664" y="100">254</text><text x="734" y="100">255</text>
    <text x="36" y="132" font-family="system-ui" font-weight="700">Tamaño de bloque</text>
    <text x="244" y="132">128</text><text x="318" y="132">64</text><text x="388" y="132">32</text><text x="458" y="132">16</text><text x="532" y="132">8</text><text x="602" y="132">4</text><text x="672" y="132">2</text><text x="742" y="132">1</text>
    <text x="36" y="158" font-family="system-ui" font-size="11.5">Prefijo si el corte está en el 4.º octeto: /25 a /32. En el 3.º: /17 a /24. En el 2.º: /9 a /16.</text>
  </g>
  <text x="20" y="204" font-weight="700" fill="currentColor">Ejemplo: 172.16.45.200/21</text>
  <g fill="currentColor">
    <text x="20" y="228">1. /21 = 16 + 5: el corte está en el 3.er octeto, con 5 bits de red → máscara 248, bloque 8.</text>
    <text x="20" y="250">2. ¿Qué múltiplo de 8 contiene a 45? 40 (el siguiente es 48).</text>
    <text x="20" y="272">3. Red: 172.16.40.0/21 · Broadcast: 172.16.47.255 (48 − 1 en el 3.º, 255 en el 4.º).</text>
    <text x="20" y="294">4. Rango: 172.16.40.1 a 172.16.47.254 · Hosts: 2¹¹ − 2 = 2046.</text>
  </g>
</svg>
