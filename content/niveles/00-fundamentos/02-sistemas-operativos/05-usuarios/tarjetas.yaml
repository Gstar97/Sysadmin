- { id: t1, frente: "¿Qué hace especial a root?", dorso: "Tener UID 0: el kernel le da todos los permisos." }
- { id: t2, frente: "¿Qué es una cuenta de servicio?", dorso: "Una cuenta para que un servicio corra con permisos propios y limitados (nginx, mysql). Tiene shell nologin: no permite iniciar sesión." }
- { id: t3, frente: "Principio de mínimo privilegio", dorso: "Cada persona, servicio o tarea recibe solo los permisos que necesita, solo mientras los necesita." }
- { id: t4, frente: "sudo frente a su", dorso: "sudo: un comando como root, con tu contraseña y registrado. su: abre sesión como otro usuario con la contraseña de ese usuario." }
- { id: t5, frente: "¿Dónde quedan registrados los usos de sudo?", dorso: "/var/log/secure en Rocky y /var/log/auth.log en Ubuntu (y en el journal)." }
- { id: t6, frente: "¿Qué grupo habilita sudo?", dorso: "wheel en Rocky, AlmaLinux y RHEL; sudo en Ubuntu y Debian." }
- { id: t7, frente: "¿Qué es UAC?", dorso: "Control de cuentas de usuario de Windows: hasta los administradores trabajan sin privilegios hasta confirmar una acción que los necesita." }
- { id: t8, frente: "¿Cómo se escribe un archivo de sistema con sudo y una redirección?", dorso: "echo texto | sudo tee /ruta/archivo (la redirección > de tu shell no tiene privilegios)." }
