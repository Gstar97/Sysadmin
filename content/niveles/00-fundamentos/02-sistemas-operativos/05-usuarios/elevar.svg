<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="currentColor" font-weight="700" font-size="14">
    <text x="20" y="26">Linux: sudo</text>
    <text x="20" y="186">Windows: UAC</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="40" width="120" height="56" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="175" y="40" width="130" height="56" rx="8" fill="var(--surface-2, #eef2f5)"/>
    <rect x="340" y="40" width="130" height="56" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="505" y="40" width="155" height="56" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="505" y="112" width="155" height="40" rx="8" fill="var(--surface, #fff)" stroke-dasharray="4 3"/>
    <rect x="20" y="200" width="120" height="56" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="175" y="200" width="130" height="56" rx="8" fill="var(--surface-2, #eef2f5)"/>
    <rect x="340" y="200" width="130" height="56" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="505" y="200" width="155" height="56" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.8" marker-end="url(#f)">
    <line x1="140" y1="68" x2="173" y2="68"/>
    <line x1="305" y1="68" x2="338" y2="68"/>
    <line x1="470" y1="68" x2="503" y2="68"/>
    <line x1="582" y1="96" x2="582" y2="110"/>
    <line x1="140" y1="228" x2="173" y2="228"/>
    <line x1="305" y1="228" x2="338" y2="228"/>
    <line x1="470" y1="228" x2="503" y2="228"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="11">
    <text x="80" y="64" font-weight="600" font-size="12">ana escribe</text>
    <text x="80" y="80">sudo dnf upgrade</text>
    <text x="240" y="64" font-weight="600" font-size="12">¿ana puede?</text>
    <text x="240" y="80">reglas de sudoers</text>
    <text x="240" y="92">(grupo wheel o sudo)</text>
    <text x="405" y="64" font-weight="600" font-size="12">Contraseña</text>
    <text x="405" y="80">de ana, no la de root</text>
    <text x="582" y="64" font-weight="600" font-size="12">Se ejecuta como root</text>
    <text x="582" y="80">solo ese comando</text>
    <text x="582" y="136">queda registrado: quién, qué, cuándo</text>
    <text x="80" y="224" font-weight="600" font-size="12">Juan (admin)</text>
    <text x="80" y="240">abre la consola</text>
    <text x="240" y="224" font-weight="600" font-size="12">Trabaja con</text>
    <text x="240" y="240">permisos de usuario</text>
    <text x="405" y="224" font-weight="600" font-size="12">Aviso de UAC</text>
    <text x="405" y="240">"¿Permitir cambios?"</text>
    <text x="582" y="224" font-weight="600" font-size="12">Ese programa corre</text>
    <text x="582" y="240">como administrador</text>
  </g>
  <text x="20" y="290" font-size="11" fill="currentColor">Un usuario estándar, en vez de confirmar, tiene que escribir el usuario y la contraseña de un administrador.</text>
  <text x="20" y="310" font-size="11" fill="currentColor">En los dos sistemas la idea es la misma: privilegios de administrador solo para la acción que los necesita.</text>
</svg>
