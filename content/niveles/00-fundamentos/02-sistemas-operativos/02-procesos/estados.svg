<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="40" width="110" height="50" rx="25" fill="var(--surface-2, #eef2f5)"/>
    <rect x="200" y="40" width="110" height="50" rx="25" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="400" y="40" width="120" height="50" rx="25" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="400" y="200" width="120" height="50" rx="25" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="200" y="200" width="110" height="50" rx="25" fill="var(--surface-2, #eef2f5)"/>
    <rect x="560" y="40" width="70" height="50" rx="25" fill="var(--bad-soft, #fde2e2)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.8" fill="none" marker-end="url(#f)">
    <line x1="130" y1="65" x2="198" y2="65"/>
    <path d="M310 55 C 350 30, 360 30, 398 55"/>
    <path d="M398 75 C 360 100, 350 100, 312 75"/>
    <line x1="460" y1="90" x2="460" y2="198"/>
    <path d="M400 225 C 330 225, 280 160, 255 92"/>
    <line x1="520" y1="65" x2="558" y2="65"/>
    <line x1="400" y1="232" x2="312" y2="232"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="75" y="70" font-weight="700">Nuevo</text>
    <text x="255" y="62" font-weight="700">Listo</text>
    <text x="255" y="78" font-size="11">espera la CPU</text>
    <text x="460" y="62" font-weight="700">Ejecutando</text>
    <text x="460" y="78" font-size="11">usa la CPU (R)</text>
    <text x="460" y="222" font-weight="700">Esperando</text>
    <text x="460" y="238" font-size="11">disco, red, teclado (S, D)</text>
    <text x="255" y="222" font-weight="700">Detenido</text>
    <text x="255" y="238" font-size="11">por una señal (T)</text>
    <text x="595" y="62" font-weight="700" font-size="11">Termina</text>
    <text x="595" y="78" font-size="10">(zombie: Z)</text>
    <text x="355" y="26" font-size="11">el planificador le da la CPU</text>
    <text x="355" y="112" font-size="11">se le acaba su turno</text>
    <text x="545" y="150" font-size="11">pide un dato</text>
    <text x="545" y="164" font-size="11">al disco o a la red</text>
    <text x="300" y="150" font-size="11">llegó el dato</text>
    <text x="355" y="270" font-size="11">SIGSTOP / SIGCONT</text>
  </g>
</svg>
