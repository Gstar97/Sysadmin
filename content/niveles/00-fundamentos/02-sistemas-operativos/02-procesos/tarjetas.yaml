- { id: t1, frente: "Programa, proceso e hilo", dorso: "Programa: el archivo. Proceso: el programa en ejecución, con PID y memoria propia. Hilo: línea de ejecución dentro de un proceso que comparte su memoria." }
- { id: t2, frente: "Estados en la columna STAT de ps", dorso: "R ejecutando, S esperando, D esperando al disco (sin interrupción), T detenido, Z zombie." }
- { id: t3, frente: "¿Cómo se interpreta el load average?", dorso: "Comparándolo con la cantidad de CPU: por encima de ese número hay procesos haciendo fila." }
- { id: t4, frente: "SIGTERM y SIGKILL", dorso: "SIGTERM (15, kill PID): pide terminar ordenadamente. SIGKILL (9, kill -9): el kernel lo corta sin limpiar. Primero 15, después 9." }
- { id: t5, frente: "¿Qué hace el valor nice?", dorso: "Ajusta la prioridad de CPU en Linux: de -20 (más prioridad) a 19 (menos). Se cambia con nice y renice." }
- { id: t6, frente: "¿Qué es un cambio de contexto?", dorso: "Cuando el planificador saca a un proceso de la CPU y pone a otro: guarda los registros de uno y carga los del otro. Tiene un pequeño costo." }
- { id: t7, frente: "Load alto con CPU libre y mucho 'wa' en top", dorso: "El cuello de botella es el disco o el almacenamiento: procesos en estado D esperando E/S." }
- { id: t8, frente: "Comandos para ver procesos en Linux y Windows", dorso: "Linux: ps aux, top, pgrep. Windows: Administrador de tareas, Get-Process." }
