- { id: t1, frente: "¿Qué es la memoria virtual?", dorso: "Un espacio de direcciones propio para cada proceso; el kernel traduce cada página a su lugar real (RAM, swap o todavía sin crear)." }
- { id: t2, frente: "¿De qué tamaño son normalmente las páginas de memoria?", dorso: "4 KiB." }
- { id: t3, frente: "¿Qué es un fallo de página?", dorso: "El aviso al kernel cuando un proceso usa una página que no está en la RAM. Es normal; es lento si hay que leerla del swap." }
- { id: t4, frente: "VSZ / VIRT frente a RSS / RES", dorso: "VSZ o VIRT: memoria virtual reservada. RSS o RES: memoria realmente ocupada en la RAM." }
- { id: t5, frente: "¿Qué hace el OOM killer?", dorso: "Cuando se agotan RAM y swap, termina con SIGKILL un proceso (casi siempre el más grande) y lo registra en los mensajes del kernel." }
- { id: t6, frente: "¿Dónde se busca si actuó el OOM killer?", dorso: "sudo journalctl -k | grep -i \"out of memory\" (o dmesg). La línea 'invoked oom-killer' dice quién pidió la memoria." }
- { id: t7, frente: "¿Más swap resuelve la falta de memoria?", dorso: "No: solo retrasa el problema volviendo lento al servidor. Hay que reducir el consumo o agregar RAM." }
