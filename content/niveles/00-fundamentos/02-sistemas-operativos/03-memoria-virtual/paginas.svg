<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="system-ui, sans-serif" font-size="12">
  <g fill="currentColor" font-weight="700" text-anchor="middle">
    <text x="90" y="24">Proceso A (virtual)</text>
    <text x="330" y="24">RAM (física)</text>
    <text x="570" y="24">Proceso B (virtual)</text>
    <text x="330" y="262">Swap (en el disco)</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="40" y="36" width="100" height="36" rx="4" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="40" y="78" width="100" height="36" rx="4" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="40" y="120" width="100" height="36" rx="4" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="40" y="162" width="100" height="36" rx="4" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="520" y="36" width="100" height="36" rx="4" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="520" y="78" width="100" height="36" rx="4" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="520" y="120" width="100" height="36" rx="4" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="270" y="36" width="120" height="30" rx="4" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="270" y="70" width="120" height="30" rx="4" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="270" y="104" width="120" height="30" rx="4" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="270" y="138" width="120" height="30" rx="4" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="270" y="172" width="120" height="30" rx="4" fill="var(--surface-2, #eef2f5)"/>
    <rect x="270" y="206" width="120" height="30" rx="4" fill="var(--surface, #fff)" stroke-dasharray="4 3"/>
    <rect x="270" y="272" width="120" height="30" rx="4" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="11">
    <text x="90" y="58">página 0</text>
    <text x="90" y="100">página 1</text>
    <text x="90" y="142">página 2</text>
    <text x="90" y="184">biblioteca</text>
    <text x="570" y="58">página 0</text>
    <text x="570" y="100">página 1</text>
    <text x="570" y="142">biblioteca</text>
    <text x="330" y="56">B · página 0</text>
    <text x="330" y="90">A · página 0</text>
    <text x="330" y="124">biblioteca (compartida)</text>
    <text x="330" y="158">A · página 2</text>
    <text x="330" y="192">caché de disco</text>
    <text x="330" y="226">libre</text>
    <text x="330" y="292">A · página 1</text>
  </g>
  <g stroke="currentColor" stroke-width="1.3" fill="none" opacity="0.85">
    <line x1="140" y1="54" x2="270" y2="85"/>
    <line x1="140" y1="96" x2="270" y2="287"/>
    <line x1="140" y1="138" x2="270" y2="153"/>
    <line x1="140" y1="180" x2="270" y2="119"/>
    <line x1="520" y1="54" x2="390" y2="51"/>
    <line x1="520" y1="96" x2="390" y2="228" stroke-dasharray="4 3"/>
    <line x1="520" y1="138" x2="390" y2="119"/>
  </g>
  <text x="455" y="200" font-size="10" fill="currentColor">todavía sin usar:</text>
  <text x="455" y="213" font-size="10" fill="currentColor">no ocupa RAM</text>
  <text x="330" y="322" text-anchor="middle" font-size="11" fill="currentColor">Cada proceso ve direcciones propias; el kernel decide dónde está de verdad cada página.</text>
</svg>
