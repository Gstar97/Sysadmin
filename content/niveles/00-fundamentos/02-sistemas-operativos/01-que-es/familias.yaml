tipo: emparejar
consigna: Une cada situación con el sistema operativo que normalmente se usa.
pares:
  - { a: "Servidor de bases de datos con soporte comercial de 10 años", b: "Red Hat Enterprise Linux (o Rocky / AlmaLinux sin soporte comercial)" }
  - { a: "Máquinas virtuales en la nube para aplicaciones web", b: "Ubuntu Server LTS o Debian" }
  - { a: "Usuarios, equipos y políticas de una empresa (dominio)", b: "Windows Server con Active Directory" }
  - { a: "Firewall perimetral de una pyme (pfSense u OPNsense)", b: "FreeBSD" }
  - { a: "Las PC de las oficinas", b: "Windows 11" }
  - { a: "Las notebooks del equipo de diseño", b: "macOS" }
explicacion: >-
  No hay un sistema "mejor": cada uno domina un tipo de trabajo. Un sysadmin de una empresa
  mediana trabaja a diario con Linux y Windows Server, y conoce lo suficiente de los demás para
  resolver problemas cuando aparecen.
