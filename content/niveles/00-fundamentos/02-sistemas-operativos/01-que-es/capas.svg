<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, sans-serif" font-size="12">
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="20" width="460" height="60" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="20" y="90" width="460" height="50" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="20" y="150" width="460" height="30" rx="6" fill="var(--surface, #fff)" stroke-dasharray="5 4"/>
    <rect x="20" y="190" width="460" height="130" rx="8" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="34" y="226" width="80" height="34" rx="4" fill="var(--surface, #fff)"/>
    <rect x="124" y="226" width="80" height="34" rx="4" fill="var(--surface, #fff)"/>
    <rect x="214" y="226" width="80" height="34" rx="4" fill="var(--surface, #fff)"/>
    <rect x="304" y="226" width="80" height="34" rx="4" fill="var(--surface, #fff)"/>
    <rect x="394" y="226" width="72" height="34" rx="4" fill="var(--surface, #fff)"/>
    <rect x="34" y="272" width="432" height="36" rx="4" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="20" y="330" width="460" height="50" rx="8" fill="var(--surface-2, #eef2f5)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="250" y="46" font-weight="700" font-size="14">Aplicaciones y servicios</text>
    <text x="250" y="66">navegador, base de datos, servidor web, la terminal (bash, PowerShell)</text>
    <text x="250" y="112" font-weight="700" font-size="14">Bibliotecas del sistema</text>
    <text x="250" y="130">glibc en Linux; kernel32.dll y ntdll.dll en Windows</text>
    <text x="250" y="170">llamadas al sistema: open, read, write, fork…</text>
    <text x="250" y="212" font-weight="700" font-size="14">Kernel</text>
    <text x="74" y="247" font-size="11">Procesos</text>
    <text x="164" y="247" font-size="11">Memoria</text>
    <text x="254" y="247" font-size="11">Archivos</text>
    <text x="344" y="247" font-size="11">Red</text>
    <text x="430" y="247" font-size="11">Seguridad</text>
    <text x="250" y="294" font-weight="600">Drivers (controladores de dispositivos)</text>
    <text x="250" y="352" font-weight="700" font-size="14">Hardware</text>
    <text x="250" y="370">CPU, memoria, discos, placas de red</text>
  </g>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <polyline points="495,22 505,22 505,138 495,138"/>
    <polyline points="495,192 505,192 505,318 495,318"/>
  </g>
  <g fill="currentColor" font-size="12" font-weight="600">
    <text x="512" y="76">Espacio</text>
    <text x="512" y="92">de usuario</text>
    <text x="512" y="250">Espacio</text>
    <text x="512" y="266">de kernel</text>
  </g>
</svg>
