- { id: t1, frente: "¿Qué es el kernel?", dorso: "El núcleo del sistema operativo: el único programa con acceso completo al hardware. Reparte CPU y memoria, maneja archivos, red y permisos." }
- { id: t2, frente: "Espacio de kernel y espacio de usuario", dorso: "Kernel y drivers corren en modo privilegiado; las aplicaciones en modo usuario. Un error en el kernel detiene toda la máquina." }
- { id: t3, frente: "¿Qué es una llamada al sistema?", dorso: "Un pedido de un programa al kernel (openat, read, write, fork). El kernel revisa permisos y hace el trabajo." }
- { id: t4, frente: "¿Con qué herramienta se ven las llamadas al sistema de un programa en Linux?", dorso: "strace" }
- { id: t5, frente: "Distribución de Linux", dorso: "Kernel Linux + herramientas + instalador + paquetes + actualizaciones + soporte. Ej.: Rocky, Ubuntu, Debian." }
- { id: t6, frente: "¿Dónde se ve la distribución y dónde la versión del kernel?", dorso: "Distribución: /etc/os-release. Kernel: uname -r." }
- { id: t7, frente: "Ciclo de vida de RHEL/Rocky/Alma y de Ubuntu LTS", dorso: "RHEL y compatibles: unos 10 años por versión mayor. Ubuntu LTS: 5 años gratis, hasta 12 con Ubuntu Pro." }
