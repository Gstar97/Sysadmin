tipo: pasos
titulo: Tres servidores en tu laboratorio
descripcion: >-
  Vas a completar el laboratorio que vas a usar durante toda la carrera. Si estás en una Mac con
  Apple Silicon, hacé los pasos de Linux con las imágenes ARM64 y dejá el de Windows Server para
  otra PC o para el nivel de nube.
pasos:
  - titulo: Armá la red de solo anfitrión
    detalle: >-
      Creá (o revisá que exista) una red de solo anfitrión en tu hipervisor. Todas las VMs del
      laboratorio van a tener dos placas: la primera en **NAT** (internet) y la segunda en esa red
      de **solo anfitrión** (para conectarte desde tu PC y para que se vean entre ellas).
    variantes:
      - nombre: VirtualBox
        detalle: '*Archivo > Herramientas > Administrador de red*, pestaña *Redes solo-anfitrión*. Por defecto existe una con la red `192.168.56.0/24` y servidor DHCP activado.'
      - nombre: VMware Workstation
        detalle: '*Edit > Virtual Network Editor*: la red **VMnet1** es de solo anfitrión y **VMnet8** es NAT.'
      - nombre: Hyper-V
        detalle: >-
          *Administrador de conmutadores virtuales > Nuevo conmutador virtual > Interno*. El
          **Default Switch** cumple el papel de NAT. Un conmutador interno no tiene DHCP: a las VMs
          en esa red vas a tener que ponerles IP fija (lo aprenderás en el nivel de redes; mientras
          tanto, conectate usando la IP del Default Switch).
      - nombre: virt-manager
        detalle: 'La red **default** ya es NAT y permite conectarse desde el anfitrión, así que con una sola placa alcanza.'
    comprobar: Sabés qué red es NAT y cuál es de solo anfitrión en tu hipervisor.
  - titulo: Agregá la segunda placa a ubuntu01 y conectate por SSH
    detalle: >-
      Con la VM apagada, agregá una segunda placa de red conectada a la red de solo anfitrión y
      encendela. Ubuntu configura la placa nueva automáticamente si recibe IP por DHCP; si no
      aparece con IP, lo resolverás en el nivel de Linux, y por ahora usa la otra placa. Mirá las
      IP con:
    comandos:
      - ip -br address
    comprobar: 'Desde tu PC (en Windows, PowerShell; en macOS y Linux, la terminal) te conectás con `ssh tu_usuario@IP` usando la IP de solo anfitrión, y ves el prompt de ubuntu01.'
    si_falla: >-
      La primera vez `ssh` pregunta si confiás en la huella del servidor: respondé `yes`. Si dice
      *Connection refused*, OpenSSH no está instalado en la VM (`sudo apt install openssh-server`).
      Si no responde, revisá que estés usando la IP de la red de solo anfitrión.
  - titulo: Instalá Rocky Linux 10 (o AlmaLinux 10)
    detalle: |-
      Descargá la imagen **minimal** para tu arquitectura desde rockylinux.org (o almalinux.org). Si tu procesador no cumple x86-64-v3, usá AlmaLinux 10 en su versión **x86_64_v2**. Creá la VM `rocky01` con 2 CPU, 2 GB de RAM, 25 GB de disco, UEFI y las dos placas de red. En el instalador:

      - Idioma y teclado.
      - *Destino de la instalación*: el disco virtual, con particionado automático.
      - *Red y nombre de equipo*: activá las dos placas y poné como nombre `rocky01`.
      - *Cuenta root*: dejala deshabilitada.
      - *Creación de usuario*: tu usuario, marcando que sea **administrador** (lo agrega al grupo wheel).
      - *Selección de software*: **Instalación mínima**.

      Comenzá la instalación, reiniciá al terminar y desconectá la ISO.
    comandos:
      - cat /etc/os-release
      - ip -br address
      - sudo dnf upgrade
    comprobar: Iniciás sesión, `os-release` dice Rocky (o AlmaLinux) 10, las dos placas tienen IP y la actualización termina bien. También te podés conectar por SSH desde tu PC.
    si_falla: >-
      Si el instalador se detiene con *CPU does not support x86-64-v3*, tu procesador (o tu hipervisor) no tiene AVX2: usá AlmaLinux 10 x86_64_v2 o revisá lo que viste sobre Hyper-V en la lección del procesador.
  - titulo: Instalá Windows Server 2025 de evaluación
    detalle: |-
      Descargá la ISO desde el **Microsoft Evaluation Center** (pide completar un formulario). La evaluación dura 180 días. Creá la VM `win2025` con 2 CPU, **4 GB de RAM**, **60 GB** de disco, UEFI y las dos placas de red. En Hyper-V usa Generación 2 (acá sí sirve la plantilla de arranque seguro de Windows). En el instalador:

      - Elegí **Windows Server 2025 Standard Evaluation (Experiencia de escritorio)**: la versión con interfaz gráfica.
      - Tipo de instalación: personalizada, sobre el disco vacío.
      - Al terminar, definí la contraseña del Administrador: tiene que ser compleja (mayúsculas, minúsculas, números y símbolos).

      Ya dentro de Windows, instalá las herramientas del hipervisor (VirtualBox Guest Additions o VMware Tools; Hyper-V no las necesita) y cambia el nombre del equipo desde PowerShell como administrador:
    comandos:
      - Rename-Computer -NewName win2025 -Restart
    comprobar: Después del reinicio, `hostname` en PowerShell responde `win2025` y el Administrador del servidor abre sin errores.
    si_falla: Si el instalador no encuentra el disco, el controlador de disco de la VM no es compatible con el instalador; en VirtualBox y VMware elige un controlador SATA o NVMe para el disco virtual.
  - titulo: Tomá instantáneas de las tres VMs
    detalle: Apagá cada VM y tomá una instantánea llamada `instalación limpia`. Es el punto al que vas a volver cada vez que quieras empezar un ejercicio desde cero.
    comprobar: Las tres VMs tienen su instantánea `instalación limpia`.
  - titulo: Probá restaurar
    detalle: 'Encendé `rocky01`, creá un archivo y un usuario de prueba, y verificá que existen:'
    comandos:
      - sudo touch /etc/archivo-de-prueba
      - sudo useradd prueba
      - ls /etc/archivo-de-prueba
      - id prueba
    comprobar: >-
      Apagá la VM, restaurá `instalación limpia` y encendela: `ls /etc/archivo-de-prueba` dice
      *No such file or directory* e `id prueba` dice *no such user*.
  - titulo: Documentá tu laboratorio
    detalle: |-
      En tu cuaderno técnico (o en un archivo de texto), armá una tabla con:

      - El nombre de cada VM, su sistema operativo y su versión.
      - Las IP de cada placa (NAT y solo anfitrión).
      - Los usuarios que creaste (sin las contraseñas, que van en un gestor de contraseñas).
      - Las instantáneas que existen y qué representa cada una.

      Esta documentación es parte del proyecto del nivel.
    comprobar: Alguien que no conoce tu laboratorio podría conectarse a cada VM con la información de tu tabla.
