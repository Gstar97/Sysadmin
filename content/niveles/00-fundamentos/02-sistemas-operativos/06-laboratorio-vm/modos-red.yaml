tipo: emparejar
consigna: Une cada necesidad con el modo de red de la máquina virtual que la resuelve.
pares:
  - { a: "La VM solo necesita descargar actualizaciones de internet", b: "NAT" }
  - { a: "Otras PC de tu casa tienen que poder entrar al servidor web de la VM", b: "Puente (bridged)" }
  - { a: "Tu PC tiene que conectarse por SSH a la VM, y la VM no necesita internet", b: "Solo anfitrión (host-only)" }
  - { a: "La VM necesita internet y además tu PC tiene que llegar a ella por SSH", b: "Dos placas: NAT y solo anfitrión" }
explicacion: >-
  Para el laboratorio de la carrera conviene la combinación de dos placas de red: una en NAT
  para tener internet y otra en solo anfitrión, con una IP fija, para conectarte desde tu PC.
  Funciona igual en casa, en la oficina o con el Wi-Fi de un bar, porque no depende de la red
  física.
