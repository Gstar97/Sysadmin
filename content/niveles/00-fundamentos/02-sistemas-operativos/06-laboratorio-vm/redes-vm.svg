<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 300" font-family="system-ui, sans-serif" font-size="11">
  <g font-weight="700" font-size="13" fill="currentColor" text-anchor="middle">
    <text x="115" y="22">NAT</text>
    <text x="345" y="22">Puente (bridged)</text>
    <text x="575" y="22">Solo anfitrión (host-only)</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="10" y="32" width="210" height="220" rx="10" fill="var(--surface-2, #eef2f5)"/>
    <rect x="240" y="32" width="210" height="220" rx="10" fill="var(--surface-2, #eef2f5)"/>
    <rect x="470" y="32" width="210" height="220" rx="10" fill="var(--surface-2, #eef2f5)"/>
    <rect x="65" y="44" width="100" height="30" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="25" y="110" width="180" height="120" rx="8" fill="var(--surface, #fff)"/>
    <rect x="45" y="170" width="70" height="34" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="125" y="170" width="70" height="34" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="295" y="44" width="100" height="30" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="255" y="110" width="180" height="120" rx="8" fill="var(--surface, #fff)"/>
    <rect x="275" y="170" width="70" height="34" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="355" y="170" width="70" height="34" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="485" y="110" width="180" height="120" rx="8" fill="var(--surface, #fff)"/>
    <rect x="505" y="170" width="70" height="34" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="585" y="170" width="70" height="34" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <line x1="115" y1="74" x2="115" y2="110"/>
    <line x1="80" y1="170" x2="80" y2="148"/>
    <line x1="345" y1="74" x2="345" y2="110"/>
    <path d="M285 170 C 262 140, 262 95, 296 64" stroke-dasharray="5 3"/>
    <line x1="390" y1="170" x2="390" y2="150"/>
    <line x1="540" y1="170" x2="540" y2="150"/>
    <line x1="540" y1="150" x2="620" y2="150"/>
    <line x1="620" y1="150" x2="620" y2="170"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="115" y="63" font-weight="600">Router de casa</text>
    <text x="115" y="126" font-weight="600">Tu PC (anfitrión)</text>
    <text x="115" y="141">traduce las direcciones (NAT)</text>
    <text x="80" y="191">VM</text>
    <text x="160" y="186">tu PC no</text>
    <text x="160" y="198">llega a la VM</text>
    <text x="345" y="63" font-weight="600">Router de casa</text>
    <text x="345" y="126" font-weight="600">Tu PC (anfitrión)</text>
    <text x="310" y="186">VM con IP</text>
    <text x="310" y="198">del router</text>
    <text x="390" y="186">tu PC</text>
    <text x="390" y="198">192.168.1.20</text>
    <text x="575" y="126" font-weight="600">Tu PC (anfitrión)</text>
    <text x="575" y="141">red privada sin salida</text>
    <text x="540" y="186">VM</text>
    <text x="540" y="198">192.168.56.10</text>
    <text x="620" y="186">tu PC</text>
    <text x="620" y="198">192.168.56.1</text>
  </g>
  <g fill="currentColor" font-size="11">
    <text x="20" y="270">Internet: sí. Desde tu PC: no</text>
    <text x="20" y="286">(salvo reenvío de puertos).</text>
    <text x="250" y="270">Internet: sí. Desde tu PC y la red: sí.</text>
    <text x="250" y="286">Puede fallar en Wi-Fi o redes de oficina.</text>
    <text x="480" y="270">Internet: no. Desde tu PC: sí.</text>
    <text x="480" y="286">Ideal para practicar entre VMs.</text>
  </g>
