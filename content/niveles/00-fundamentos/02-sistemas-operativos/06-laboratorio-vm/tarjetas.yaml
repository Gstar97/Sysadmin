- { id: t1, frente: "Hipervisor tipo 1 y tipo 2", dorso: "Tipo 1: sobre el hardware (ESXi, Proxmox, Hyper-V Server, KVM). Tipo 2: como programa sobre otro sistema (VirtualBox, VMware Workstation)." }
- { id: t2, frente: "Modo de red NAT", dorso: "La VM sale a internet a través del anfitrión; desde afuera no se llega a ella sin reenvío de puertos." }
- { id: t3, frente: "Modo de red puente", dorso: "La VM se conecta a la red física y recibe una IP del router; todos la ven. Puede fallar en Wi-Fi." }
- { id: t4, frente: "Modo de red solo anfitrión", dorso: "Red privada entre el anfitrión y las VMs, sin internet." }
- { id: t5, frente: "¿Una instantánea es una copia de seguridad?", dorso: "No: vive en el mismo disco que la VM y se pierde con él." }
- { id: t6, frente: "Recursos para una VM de práctica con Ubuntu Server", dorso: "2 CPU, 2 GB de RAM, 25 GB de disco dinámico, firmware UEFI." }
- { id: t7, frente: "Hyper-V Generación 2 con Linux no arranca (hash not allowed)", dorso: "Cambiar la plantilla de arranque seguro a Microsoft UEFI Certificate Authority." }
