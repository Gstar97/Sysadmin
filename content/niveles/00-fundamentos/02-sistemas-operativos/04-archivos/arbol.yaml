tipo: diagrama
titulo: El árbol de directorios de Linux
puntos:
  - id: etc
    titulo: "/etc: configuración"
    area: { x: 13.7, y: 12.0, ancho: 84.7, alto: 6.6 }
    texto: >-
      Los archivos de configuración del sistema y de los servicios, todos en texto: `/etc/hosts`, `/etc/fstab` (qué se monta al arrancar), `/etc/ssh/sshd_config`, `/etc/nginx/`. Es la carpeta que más vas a editar como sysadmin, y la que conviene respaldar siempre.
  - id: home
    titulo: "/home: carpetas de los usuarios"
    area: { x: 13.7, y: 19.1, ancho: 84.7, alto: 6.6 }
    texto: >-
      Cada usuario tiene su carpeta personal: `/home/ana`, `/home/estudiante`. Ahí guarda sus archivos y su configuración personal (en archivos ocultos que empiezan con punto, como `.bashrc`). El atajo `~` significa "mi carpeta personal".
  - id: root
    titulo: "/root: carpeta del administrador"
    area: { x: 13.7, y: 26.1, ancho: 84.7, alto: 6.6 }
    texto: >-
      La carpeta personal del usuario root. Está separada de `/home` para que root pueda trabajar aunque `/home` esté en otro disco que no se montó.
  - id: var
    titulo: "/var: datos que cambian"
    area: { x: 13.7, y: 33.2, ancho: 84.7, alto: 6.6 }
    texto: >-
      Datos variables: registros en `/var/log`, bases de datos y estado de los servicios en `/var/lib`, colas de correo e impresión en `/var/spool`, a veces sitios web en `/var/www`. Cuando un servidor se queda sin espacio, el culpable suele estar en `/var/log` o en `/var/lib`.
  - id: usr
    titulo: "/usr: programas"
    area: { x: 13.7, y: 40.2, ancho: 84.7, alto: 6.6 }
    texto: >-
      Los programas y sus archivos: `/usr/bin` (comandos), `/usr/lib` (bibliotecas), `/usr/share` (documentación, datos). En Rocky y Ubuntu, `/bin`, `/sbin` y `/lib` son enlaces a sus equivalentes dentro de `/usr`. Lo instala el gestor de paquetes: no se tocan archivos aquí a mano.
  - id: tmp
    titulo: "/tmp: temporales"
    area: { x: 13.7, y: 47.3, ancho: 84.7, alto: 6.6 }
    texto: >-
      Archivos temporales que cualquier usuario puede crear. Se borran al reiniciar (o periódicamente). Nunca se guarda ahí nada que haga falta conservar.
  - id: boot
    titulo: "/boot: arranque"
    area: { x: 13.7, y: 54.4, ancho: 84.7, alto: 6.6 }
    texto: >-
      El kernel, el initramfs y la configuración de GRUB. En equipos UEFI, la partición EFI se monta en `/boot/efi`. Si se llena (por acumular kernels viejos), las actualizaciones del kernel fallan.
  - id: dev
    titulo: "/dev: dispositivos"
    area: { x: 13.7, y: 61.4, ancho: 84.7, alto: 6.6 }
    texto: >-
      Cada dispositivo aparece como un archivo especial: `/dev/sda` (primer disco), `/dev/nvme0n1` (primer NVMe), `/dev/null` (un "agujero" que descarta todo lo que recibe). Es una idea central de Linux: casi todo se maneja como un archivo.
  - id: proc
    titulo: "/proc: información de procesos"
    area: { x: 13.7, y: 68.5, ancho: 84.7, alto: 6.6 }
    texto: >-
      No está en ningún disco: el kernel la genera en el momento. `/proc/cpuinfo` y `/proc/meminfo` son las fuentes de `lscpu` y `free`, y cada proceso tiene su carpeta `/proc/PID` con su información.
  - id: sys
    titulo: "/sys: información del hardware"
    area: { x: 13.7, y: 75.5, ancho: 84.7, alto: 6.6 }
    texto: >-
      También la genera el kernel: el estado de los dispositivos, los drivers y el firmware. Ya la usaste: `/sys/firmware/efi` existe solo si el equipo arrancó con UEFI.
  - id: opt
    titulo: "/opt: programas de terceros"
    area: { x: 13.7, y: 82.6, ancho: 84.7, alto: 6.6 }
    texto: >-
      Programas que no vienen del gestor de paquetes de la distribución, instalados completos en una carpeta propia: `/opt/empresa/aplicacion`.
  - id: srv
    titulo: "/srv: datos de servicios"
    area: { x: 13.7, y: 89.6, ancho: 84.7, alto: 6.6 }
    texto: >-
      Pensada para los datos que sirve el servidor: archivos compartidos, sitios web, repositorios. Su uso varía según la organización; lo importante es que cada equipo documente dónde guarda los datos.
