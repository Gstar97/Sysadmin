- { id: t1, frente: "Ruta absoluta y ruta relativa", dorso: "Absoluta: desde la raíz (/var/log). Relativa: desde la carpeta actual (log/messages)." }
- { id: t2, frente: "¿Qué significan . .. y ~?", dorso: ". la carpeta actual; .. la de arriba; ~ tu carpeta personal." }
- { id: t3, frente: "Carpetas clave de Linux", dorso: "/etc configuración, /home usuarios, /var datos variables y registros, /usr programas, /tmp temporales, /boot arranque." }
- { id: t4, frente: "XFS frente a ext4", dorso: "XFS: por defecto en Rocky/RHEL, no se puede achicar. ext4: por defecto en Ubuntu/Debian, se puede agrandar y achicar." }
- { id: t5, frente: "¿Cuál es el límite de FAT32?", dorso: "Archivos de hasta 4 GiB. Para archivos grandes en USB se usa exFAT." }
- { id: t6, frente: "¿Qué es un inodo?", dorso: "La estructura que guarda los metadatos de un archivo: dueño, grupo, permisos, tamaño, fechas y ubicación del contenido." }
- { id: t7, frente: "¿Cómo se sabe el tipo real de un archivo en Linux?", dorso: "Con file, que lee el contenido (números mágicos), no la extensión." }
- { id: t8, frente: "Comandos para ver sistemas de archivos montados", dorso: "df -hT (espacio y tipo) y lsblk -f (discos, particiones y sistema de archivos)." }
