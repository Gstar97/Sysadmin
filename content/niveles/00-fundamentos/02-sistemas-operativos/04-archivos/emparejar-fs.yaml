tipo: emparejar
consigna: Une cada sistema de archivos con su uso más común.
pares:
  - { a: XFS, b: "Opción por defecto de Rocky, AlmaLinux y RHEL; muy bueno con archivos grandes; no se puede achicar" }
  - { a: ext4, b: "Opción por defecto de Ubuntu y Debian; el más probado de Linux" }
  - { a: NTFS, b: "Discos de Windows y Windows Server, con permisos detallados y registro de cambios" }
  - { a: FAT32, b: "Partición EFI y dispositivos viejos; no admite archivos de más de 4 GiB" }
  - { a: exFAT, b: "Memorias USB y tarjetas para usar en cualquier sistema, con archivos grandes" }
explicacion: >-
  Los sistemas de archivos de servidor (XFS, ext4, NTFS) guardan permisos y tienen un registro de
  cambios (journal) que los protege ante cortes de luz. FAT32 y exFAT son simples y compatibles
  con todo, pero no guardan permisos: sirven para intercambiar archivos, no para un servidor.
