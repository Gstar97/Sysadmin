- { id: t1, frente: "HDD, SSD SATA y SSD NVMe: latencia típica", dorso: "~8 ms, ~100 µs y ~50-60 µs." }
- { id: t2, frente: "HDD, SSD SATA y SSD NVMe: IOPS típicos", dorso: "~150, ~90.000 y ~1.000.000 o más." }
- { id: t3, frente: "¿Qué relación hay entre IOPS y throughput?", dorso: "Throughput = IOPS × tamaño de cada operación." }
- { id: t4, frente: "¿Cuándo conviene SSD y cuándo disco rígido?", dorso: "SSD para trabajo al azar (bases de datos, VMs). Disco rígido para mucho volumen leído de corrido (backups, archivo, video)." }
- { id: t5, frente: "¿Cómo se pasa de DWPD a TBW?", dorso: "TBW = capacidad × DWPD × 365 × años de garantía." }
- { id: t6, frente: "Atributos SMART que anticipan la falla de un HDD", dorso: "Reallocated_Sector_Ct, Current_Pending_Sector y Offline_Uncorrectable (valor RAW distinto de 0 o creciente)." }
- { id: t7, frente: "¿Qué indica UDMA_CRC_Error_Count?", dorso: "Errores de transmisión por el cable o el conector, no del disco." }
- { id: t8, frente: "¿Qué es Percentage Used en un NVMe?", dorso: "El porcentaje de la vida útil declarada que ya se consumió por escrituras." }
