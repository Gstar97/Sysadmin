tipo: emparejar
consigna: Une cada necesidad con el almacenamiento más conveniente.
pares:
  - { a: "Base de datos de ventas con miles de consultas por minuto", b: "SSD NVMe de uso mixto" }
  - { a: "Copias de seguridad semanales que se guardan por un año", b: "Discos rígidos de gran capacidad" }
  - { a: "Disco de arranque de una PC de oficina", b: "SSD de PC (M.2 NVMe o SATA)" }
  - { a: "Servidor de 30 máquinas virtuales", b: "SSD de servidor con alto nivel de IOPS" }
  - { a: "Archivo de video de cámaras de seguridad", b: "Discos rígidos pensados para grabación continua" }
explicacion: >-
  Las cargas con muchas operaciones al azar (bases de datos, máquinas virtuales) necesitan IOPS
  y baja latencia: SSD. Las que escriben y leen grandes volúmenes seguidos y se consultan poco
  (backups, video, archivo) aprovechan el bajo costo por TB de los discos rígidos.
