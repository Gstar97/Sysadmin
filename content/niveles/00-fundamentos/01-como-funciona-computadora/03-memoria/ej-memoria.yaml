tipo: terminal
shell: bash
titulo: Revisar la memoria de un servidor
descripcion: >-
  Un compañero dice que el servidor "se está quedando sin memoria" porque casi no tiene memoria
  libre. Revisa los datos antes de pedir una ampliación.
estado_inicial:
  distro: rocky
  hostname: srv-app01
  usuario: estudiante
  usuarios:
    - { nombre: estudiante, sudo: true }
pasos:
  - consigna: Mira el uso de memoria con `free -h`.
    verificar:
      - { comando_usado: '^\s*free' }
    pistas:
      - "`free -h`"
    solucion: [free -h]
    explicacion: >-
      *free* (1,4 Gi) parece poco, pero *buff/cache* (1,3 Gi) es caché de disco que el sistema
      libera en cuanto un programa la necesita. La columna que importa es **available** (2,7 Gi):
      la memoria que los programas todavía pueden usar. El swap está en 0: el servidor no tuvo que
      usar el disco como memoria. No hace falta ampliar.
  - consigna: Mira los mismos datos en crudo con `cat /proc/meminfo`. Busca *MemTotal* y *MemAvailable*.
    verificar:
      - { comando_usado: '/proc/meminfo' }
    pistas:
      - "`cat /proc/meminfo`"
    solucion: [cat /proc/meminfo]
    explicacion: >-
      `free` y otras herramientas leen este archivo, que genera el kernel. Los valores están en kB
      (en realidad KiB: 1024 bytes).
  - consigna: >-
      Averigua si el equipo tiene memoria ECC y cuántos módulos tiene con
      `sudo dmidecode -t memory`. Busca *Error Correction Type* y la sección *Memory Device*.
    verificar:
      - { comando_usado: 'sudo\s+dmidecode.*memory|sudo\s+dmidecode.*-t\s*1[67]' }
    pistas:
      - "`sudo dmidecode -t memory`"
    solucion: [sudo dmidecode -t memory]
    explicacion: >-
      *Error Correction Type: Multi-bit ECC* indica memoria con corrección de errores. Hay un solo
      módulo (*Memory Device*) de 4 GB en la ranura *DIMM 0*. En un servidor físico aquí también
      aparecen la velocidad, el fabricante, el número de parte y las ranuras vacías, que es lo que
      hace falta para pedir una ampliación compatible.
