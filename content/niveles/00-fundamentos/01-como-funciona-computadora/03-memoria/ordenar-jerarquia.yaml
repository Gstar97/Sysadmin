tipo: ordenar
consigna: Ordena de la más rápida (arriba) a la más lenta (abajo).
pasos:
  - Registros de la CPU
  - Caché L1
  - Caché L3
  - Memoria RAM
  - SSD NVMe
  - Disco rígido
  - Un archivo en un servidor de otro continente
explicacion: >-
  Cada escalón es entre varias veces y miles de veces más lento que el anterior. El salto más
  grande está entre la RAM (unos 90 nanosegundos) y el SSD más rápido (decenas de
  microsegundos): unas mil veces. Por eso un servidor que se queda sin RAM y empieza a usar el
  disco como memoria se vuelve tan lento de golpe.
