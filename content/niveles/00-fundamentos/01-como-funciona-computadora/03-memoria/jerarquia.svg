<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui, sans-serif" font-size="13">
  <g stroke="currentColor" stroke-width="1.5">
    <polygon points="290,20 390,20 410,70 270,70" fill="var(--ok-soft, #dcf5e4)"/>
    <polygon points="270,76 410,76 440,126 240,126" fill="var(--ok-soft, #dcf5e4)"/>
    <polygon points="240,132 440,132 470,182 210,182" fill="var(--accent-soft, #d5f0ec)"/>
    <polygon points="210,188 470,188 500,238 180,238" fill="var(--warn-soft, #fbf0d0)"/>
    <polygon points="180,244 500,244 530,294 150,294" fill="var(--info-soft, #e0e9fd)"/>
    <polygon points="150,300 530,300 560,350 120,350" fill="var(--surface-2, #eef2f5)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="340" y="50" font-weight="700">Registros</text>
    <text x="340" y="106" font-weight="700">Caché L1 y L2</text>
    <text x="340" y="162" font-weight="700">Caché L3</text>
    <text x="340" y="218" font-weight="700">RAM</text>
    <text x="340" y="274" font-weight="700">SSD NVMe</text>
    <text x="340" y="330" font-weight="700">Disco rígido</text>
  </g>
  <g fill="currentColor" font-size="11">
    <text x="420" y="50">menos de 1 ns · bytes</text>
    <text x="450" y="106">1 a 4 ns · KB a MB</text>
    <text x="480" y="162">10 a 20 ns · decenas de MB</text>
    <text x="510" y="218">~90 ns · GB</text>
    <text x="540" y="274">~60 µs · TB</text>
    <text x="570" y="330">~8 ms · TB</text>
  </g>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="60" y1="330" x2="60" y2="40"/>
    <polyline points="52,52 60,40 68,52"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="72" y="70">más rápido</text>
    <text x="72" y="86">más caro por GB</text>
    <text x="72" y="102">más chico</text>
    <text x="72" y="300">más lento</text>
    <text x="72" y="316">más barato por GB</text>
    <text x="72" y="332">más grande</text>
  </g>
  <text x="340" y="372" text-anchor="middle" font-size="11" fill="currentColor">Solo la RAM y lo que está arriba de ella pierden su contenido al apagar.</text>
</svg>
