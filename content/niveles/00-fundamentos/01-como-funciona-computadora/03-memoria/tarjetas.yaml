- { id: t1, frente: "¿Qué es la latencia?", dorso: "El tiempo que tarda en llegar un dato desde que se lo pide." }
- { id: t2, frente: "Latencias de referencia: RAM, SSD NVMe y disco rígido", dorso: "RAM ~90 ns; SSD NVMe ~60 µs; disco rígido ~8 ms." }
- { id: t3, frente: "¿Qué columna de free importa para saber si falta memoria?", dorso: "available (y el uso de swap). free es baja en un servidor sano porque la caché de disco ocupa el resto." }
- { id: t4, frente: "¿Qué pasa cuando un servidor se queda sin RAM?", dorso: "Libera caché, usa swap (todo se vuelve muy lento) y, si se agota todo, el OOM killer termina un proceso." }
- { id: t5, frente: "¿Qué hace la memoria ECC?", dorso: "Corrige errores de un bit y detecta los de dos bits (en ese caso detiene el equipo)." }
- { id: t6, frente: "¿El on-die ECC de DDR5 reemplaza a la memoria ECC?", dorso: "No. Protege dentro del chip, pero no el camino al procesador; los servidores usan módulos ECC explícitos." }
- { id: t7, frente: "UDIMM, RDIMM y SO-DIMM", dorso: "UDIMM: PC. RDIMM: servidor, con registro. SO-DIMM: notebooks. No se mezclan entre sí." }
