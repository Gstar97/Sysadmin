<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="10" y="40" width="100" height="80" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="125" y="40" width="100" height="80" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="240" y="40" width="100" height="80" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="355" y="40" width="100" height="80" rx="8" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="470" y="40" width="100" height="80" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="585" y="40" width="105" height="80" rx="8" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g stroke="currentColor" stroke-width="2" marker-end="url(#flecha)">
    <line x1="110" y1="80" x2="123" y2="80"/>
    <line x1="225" y1="80" x2="238" y2="80"/>
    <line x1="340" y1="80" x2="353" y2="80"/>
    <line x1="455" y1="80" x2="468" y2="80"/>
    <line x1="570" y1="80" x2="583" y2="80"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="60" y="68" font-weight="700">1. Encendido</text>
    <text x="60" y="86" font-size="11">la fuente</text>
    <text x="60" y="100" font-size="11">estabiliza</text>
    <text x="175" y="68" font-weight="700">2. POST</text>
    <text x="175" y="86" font-size="11">el firmware prueba</text>
    <text x="175" y="100" font-size="11">el hardware</text>
    <text x="290" y="68" font-weight="700">3. Dispositivo</text>
    <text x="290" y="86" font-size="11">busca de dónde</text>
    <text x="290" y="100" font-size="11">arrancar</text>
    <text x="405" y="68" font-weight="700">4. Cargador</text>
    <text x="405" y="86" font-size="11">GRUB o Windows</text>
    <text x="405" y="100" font-size="11">Boot Manager</text>
    <text x="520" y="68" font-weight="700">5. Kernel</text>
    <text x="520" y="86" font-size="11">el núcleo</text>
    <text x="520" y="100" font-size="11">del sistema</text>
    <text x="637" y="68" font-weight="700">6. Servicios</text>
    <text x="637" y="86" font-size="11">systemd o</text>
    <text x="637" y="100" font-size="11">Windows; login</text>
    <text x="175" y="24" font-size="11" font-weight="600">firmware (UEFI o BIOS)</text>
    <text x="520" y="24" font-size="11" font-weight="600">sistema operativo</text>
  </g>
  <g fill="currentColor" font-size="11">
    <text x="10" y="155" font-weight="700">Si falla aquí, se ve…</text>
    <text x="10" y="178">1. Nada: ni luces ni ventiladores. Revisar cable, fuente, botón.</text>
    <text x="10" y="198">2. Ventiladores girando, pantalla negra, pitidos o códigos en LEDs: memoria, CPU o placa.</text>
    <text x="10" y="218">3. "No boot device", "Reboot and select proper boot device": orden o modo de arranque, disco.</text>
    <text x="10" y="238">4. Consola de GRUB ("grub rescue>") o "Verification failed": cargador dañado o Secure Boot.</text>
    <text x="10" y="258">5. "Kernel panic", "VFS: Unable to mount root fs" o pantalla azul: kernel, drivers, disco raíz.</text>
    <text x="10" y="278">6. Arranca pero un servicio falla, o queda en "emergency mode": configuración (por ejemplo, /etc/fstab).</text>
  </g>
  <rect x="10" y="296" width="680" height="26" rx="6" fill="var(--surface-2, #eef2f5)" stroke="none"/>
  <text x="350" y="313" text-anchor="middle" font-size="11" fill="currentColor">El último mensaje en pantalla indica en qué etapa se detuvo el arranque: por ahí se empieza a buscar.</text>
</svg>
