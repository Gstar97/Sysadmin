- { id: t1, frente: "Etapas del arranque", dorso: "Encendido, POST, búsqueda del dispositivo, cargador (GRUB / Windows Boot Manager), kernel y servicios." }
- { id: t2, frente: "Pantalla negra con pitidos: ¿qué etapa?", dorso: "El POST: falla de hardware (memoria, CPU, placa) antes de tener video." }
- { id: t3, frente: "¿Dónde busca UEFI el cargador de arranque?", dorso: "En la partición EFI (FAT32), un archivo .efi indicado por una entrada de arranque. Respaldo: \\EFI\\BOOT\\BOOTX64.EFI." }
- { id: t4, frente: "MBR frente a GPT", dorso: "MBR: hasta 2 TiB y 4 particiones primarias, para BIOS. GPT: discos enormes, 128 particiones, copia de la tabla, para UEFI." }
- { id: t5, frente: "¿Cómo saber en Linux si se arrancó con UEFI?", dorso: "Si existe /sys/firmware/efi. efibootmgr muestra las entradas y mokutil --sb-state el estado de Secure Boot." }
- { id: t6, frente: "¿Qué es shim?", dorso: "El primer cargador de las distribuciones Linux, firmado por Microsoft, que verifica GRUB y el kernel para que arranquen con Secure Boot." }
- { id: t7, frente: "¿Qué pasó con los certificados de Secure Boot de 2011?", dorso: "Vencieron entre junio y octubre de 2026; se reemplazan por los de 2023 mediante actualizaciones de Windows y de firmware." }
