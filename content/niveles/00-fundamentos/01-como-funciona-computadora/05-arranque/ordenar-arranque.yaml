tipo: ordenar
consigna: Ordena las etapas del arranque de un servidor Linux con UEFI, desde que se aprieta el botón.
pasos:
  - La fuente se estabiliza y la CPU empieza a ejecutar el firmware
  - El firmware hace el POST y prueba memoria, procesador y dispositivos
  - El firmware lee las entradas de arranque y carga el archivo .efi de la partición EFI
  - Shim y GRUB cargan el kernel y el initramfs
  - El kernel inicia el hardware y monta el sistema de archivos raíz
  - systemd arranca los servicios y aparece el login
explicacion: >-
  Las tres primeras etapas son del firmware y las tres últimas del sistema operativo. Saber en
  cuál se detuvo el arranque reduce el problema a la mitad antes de tocar nada: si nunca aparece
  el menú de GRUB, el sistema operativo ni siquiera llegó a cargarse.
