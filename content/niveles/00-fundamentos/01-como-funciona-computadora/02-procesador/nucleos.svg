<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui, sans-serif" font-size="12">
  <rect x="20" y="20" width="500" height="320" rx="14" fill="var(--surface-2, #eef2f5)" stroke="currentColor" stroke-width="2"/>
  <text x="36" y="44" font-size="14" font-weight="700" fill="currentColor">Procesador (un zócalo)</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="40" y="60" width="105" height="130" rx="8" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="160" y="60" width="105" height="130" rx="8" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="280" y="60" width="105" height="130" rx="8" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="400" y="60" width="105" height="130" rx="8" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="50" y="118" width="85" height="26" rx="4" fill="var(--surface, #fff)"/>
    <rect x="50" y="152" width="85" height="26" rx="4" fill="var(--surface, #fff)"/>
    <rect x="170" y="118" width="85" height="26" rx="4" fill="var(--surface, #fff)"/>
    <rect x="170" y="152" width="85" height="26" rx="4" fill="var(--surface, #fff)"/>
    <rect x="290" y="118" width="85" height="26" rx="4" fill="var(--surface, #fff)"/>
    <rect x="290" y="152" width="85" height="26" rx="4" fill="var(--surface, #fff)"/>
    <rect x="410" y="118" width="85" height="26" rx="4" fill="var(--surface, #fff)"/>
    <rect x="410" y="152" width="85" height="26" rx="4" fill="var(--surface, #fff)"/>
    <rect x="40" y="205" width="465" height="40" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="40" y="260" width="225" height="62" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="280" y="260" width="225" height="62" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="560" y="255" width="100" height="72" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="92" y="82" font-weight="700">Núcleo 0</text>
    <text x="92" y="100" font-size="11">2 hilos</text>
    <text x="92" y="136">L1 · 80 KB</text>
    <text x="92" y="170">L2 · 2 MB</text>
    <text x="212" y="82" font-weight="700">Núcleo 1</text>
    <text x="212" y="100" font-size="11">2 hilos</text>
    <text x="212" y="136">L1 · 80 KB</text>
    <text x="212" y="170">L2 · 2 MB</text>
    <text x="332" y="82" font-weight="700">Núcleo 2</text>
    <text x="332" y="100" font-size="11">2 hilos</text>
    <text x="332" y="136">L1 · 80 KB</text>
    <text x="332" y="170">L2 · 2 MB</text>
    <text x="452" y="82" font-weight="700">Núcleo 3</text>
    <text x="452" y="100" font-size="11">2 hilos</text>
    <text x="452" y="136">L1 · 80 KB</text>
    <text x="452" y="170">L2 · 2 MB</text>
    <text x="272" y="230" font-weight="700">Caché L3 compartida · 16 MB</text>
    <text x="152" y="287" font-weight="600">Líneas PCIe</text>
    <text x="152" y="305" font-size="11">NVMe, placas de expansión</text>
    <text x="392" y="287" font-weight="600">Controlador de memoria</text>
    <text x="392" y="305" font-size="11">conecta con la RAM</text>
    <text x="610" y="287" font-weight="700">RAM</text>
    <text x="610" y="305" font-size="11">fuera de la CPU</text>
  </g>
  <line x1="505" y1="291" x2="560" y2="291" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="540" y="45" font-size="11" fill="currentColor">El sistema operativo ve</text>
  <text x="540" y="61" font-size="11" fill="currentColor">4 núcleos × 2 hilos</text>
  <text x="540" y="77" font-size="11" fill="currentColor" font-weight="700">= 8 CPU lógicas</text>
</svg>
