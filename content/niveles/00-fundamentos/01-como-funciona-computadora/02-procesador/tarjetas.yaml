- { id: t1, frente: "¿Cuáles son las tres fases del ciclo de instrucción?", dorso: "Buscar la instrucción, decodificarla y ejecutarla." }
- { id: t2, frente: "¿Qué es un registro de la CPU?", dorso: "Una celda de memoria dentro del procesador, lo más rápido de la computadora. Ejemplo: el contador de programa." }
- { id: t3, frente: "¿Por qué existe la caché?", dorso: "Porque la RAM es decenas de veces más lenta que la CPU. La caché guarda copias de lo usado recientemente para no esperar." }
- { id: t4, frente: "¿Cómo se calculan las CPU lógicas?", dorso: "Zócalos × núcleos por zócalo × hilos por núcleo." }
- { id: t5, frente: "¿Cuánto rinde el segundo hilo de un núcleo con SMT?", dorso: "Suma entre un 10 y un 30% según el trabajo; no duplica." }
- { id: t6, frente: "¿Qué nivel de x86-64 exigen RHEL 10 y Rocky 10?", dorso: "x86-64-v3 (AVX2). AlmaLinux 10 tiene además una versión para v2." }
- { id: t7, frente: "amd64 y x86_64; arm64 y aarch64", dorso: "Son los mismos dos pares con distinto nombre: x86 de 64 bits y ARM de 64 bits (Debian/Ubuntu y Red Hat usan nombres distintos)." }
- { id: t8, frente: "¿Cómo se licencia Windows Server 2025?", dorso: "Por núcleo físico, con un mínimo de 8 por procesador y 16 por servidor." }
