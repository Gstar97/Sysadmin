tipo: emparejar
consigna: Une cada nombre con lo que significa. Los vas a ver en los nombres de las imágenes de instalación y de los paquetes.
pares:
  - { a: amd64, b: "x86 de 64 bits, como lo llaman Debian y Ubuntu" }
  - { a: x86_64, b: "x86 de 64 bits, como lo llaman Red Hat, Rocky y AlmaLinux" }
  - { a: arm64, b: "ARM de 64 bits, como lo llaman Debian y Ubuntu" }
  - { a: aarch64, b: "ARM de 64 bits, como lo llaman Red Hat, Rocky y AlmaLinux" }
  - { a: x86-64-v3, b: "Nivel de x86-64 con AVX2 que exigen RHEL 10 y Rocky 10" }
  - { a: x86-64-v2, b: "Nivel mínimo de RHEL 9; AlmaLinux 10 ofrece una versión para este nivel" }
explicacion: >-
  amd64 y x86_64 son lo mismo con distinto nombre (AMD diseñó la extensión de 64 bits, por eso
  Debian usa "amd64" incluso para procesadores Intel). Lo mismo pasa con arm64 y aarch64. Los
  niveles v2, v3 y v4 son conjuntos de instrucciones extra: un sistema compilado para v3 usa
  instrucciones que un procesador más viejo no tiene, y por eso directamente no arranca.
