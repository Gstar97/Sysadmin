<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui, sans-serif" font-size="13">
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="190" y1="110" x2="270" y2="110"/>
    <line x1="410" y1="90" x2="490" y2="60"/>
    <line x1="410" y1="130" x2="490" y2="160"/>
    <line x1="340" y1="160" x2="340" y2="250"/>
    <line x1="270" y1="290" x2="190" y2="250"/>
    <line x1="270" y1="300" x2="190" y2="300"/>
    <line x1="270" y1="310" x2="190" y2="350"/>
    <line x1="410" y1="290" x2="490" y2="270"/>
    <line x1="410" y1="310" x2="490" y2="340"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="270" y="60" width="140" height="100" rx="10" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="40" y="70" width="150" height="80" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="490" y="30" width="160" height="60" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="490" y="130" width="160" height="60" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="270" y="250" width="140" height="80" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="40" y="230" width="150" height="40" rx="6" fill="var(--surface, #fff)"/>
    <rect x="40" y="282" width="150" height="40" rx="6" fill="var(--surface, #fff)"/>
    <rect x="40" y="334" width="150" height="40" rx="6" fill="var(--surface, #fff)"/>
    <rect x="490" y="250" width="160" height="40" rx="6" fill="var(--surface, #fff)"/>
    <rect x="490" y="322" width="160" height="40" rx="6" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor">
    <text x="340" y="104" text-anchor="middle" font-weight="700" font-size="16">CPU</text>
    <text x="340" y="124" text-anchor="middle" font-size="12">controlador de memoria</text>
    <text x="340" y="140" text-anchor="middle" font-size="12">y líneas PCIe propias</text>
    <text x="115" y="104" text-anchor="middle" font-weight="700">RAM</text>
    <text x="115" y="124" text-anchor="middle" font-size="12">2 a 12 canales</text>
    <text x="230" y="100" text-anchor="middle" font-size="11">~45 GB/s</text>
    <text x="230" y="128" text-anchor="middle" font-size="11">por canal</text>
    <text x="570" y="56" text-anchor="middle" font-weight="600">SSD NVMe</text>
    <text x="570" y="74" text-anchor="middle" font-size="12">PCIe x4</text>
    <text x="570" y="156" text-anchor="middle" font-weight="600">Placa de red o video</text>
    <text x="570" y="174" text-anchor="middle" font-size="12">PCIe x8 o x16</text>
    <text x="348" y="212" font-size="11">enlace CPU–chipset</text>
    <text x="348" y="228" font-size="11">(compartido)</text>
    <text x="340" y="295" text-anchor="middle" font-weight="700">Chipset</text>
    <text x="340" y="314" text-anchor="middle" font-size="12">dispositivos lentos</text>
    <text x="115" y="255" text-anchor="middle">SATA (discos)</text>
    <text x="115" y="307" text-anchor="middle">USB</text>
    <text x="115" y="359" text-anchor="middle">Red integrada</text>
    <text x="570" y="275" text-anchor="middle">PCIe x1 o x4</text>
    <text x="570" y="347" text-anchor="middle">Audio, otros</text>
  </g>
</svg>
