- { id: t1, frente: "¿Qué diferencia hay entre la RAM y el almacenamiento?", dorso: "La RAM es rápida y se borra al apagar; el almacenamiento (SSD, HDD) es más lento pero guarda los datos de forma permanente." }
- { id: t2, frente: "¿Qué se conecta directamente a la CPU y qué pasa por el chipset?", dorso: "Directo a la CPU: RAM, NVMe y ranuras PCIe rápidas. Por el chipset: SATA, USB, red integrada y ranuras lentas, que comparten un enlace." }
- { id: t3, frente: "¿Cuánto rinde aproximadamente una línea PCIe 3.0, 4.0 y 5.0?", dorso: "1, 2 y 4 GB/s. Cada generación duplica la velocidad." }
- { id: t4, frente: "¿Qué es el BMC?", dorso: "Una computadora independiente dentro del servidor, con puerto de red propio, para encenderlo, apagarlo y ver su pantalla a distancia (iDRAC, iLO, XClarity)." }
- { id: t5, frente: "¿Qué significan RDIMM y ECC en una ficha de memoria?", dorso: "RDIMM: módulo con registro, propio de servidores (no compatible con UDIMM de PC). ECC: corrige errores de bits." }
- { id: t6, frente: "¿Cuánto mide una unidad de rack (1U)?", dorso: "44,45 mm de alto. Un rack estándar tiene 42U." }
- { id: t7, frente: "¿Con qué comandos de Linux se arma un inventario de hardware?", dorso: "lscpu, free -h, lsblk, lspci y sudo dmidecode." }
