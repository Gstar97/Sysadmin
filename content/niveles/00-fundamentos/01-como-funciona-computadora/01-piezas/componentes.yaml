tipo: emparejar
consigna: Une cada componente con lo que hace.
pares:
  - { a: CPU, b: Ejecuta las instrucciones de los programas }
  - { a: RAM, b: Guarda lo que se está usando ahora y se borra al apagar }
  - { a: Disco (SSD o HDD), b: Guarda los datos aunque el equipo se apague }
  - { a: Placa madre, b: Conecta todos los componentes entre sí }
  - { a: Fuente, b: Convierte la corriente del enchufe en las tensiones que usa el equipo }
  - { a: Chipset, b: "Concentra los dispositivos más lentos (SATA, USB) y los comunica con la CPU" }
  - { a: BMC, b: Permite administrar el servidor a distancia aunque el sistema operativo no responda }
explicacion: >-
  Una forma práctica de recordarlo: la CPU hace el trabajo, la RAM es la mesa donde trabaja, el
  disco es el archivo donde se guarda todo, la placa madre es el edificio que los une y la fuente
  es la instalación eléctrica. El BMC es exclusivo de los servidores y es lo que más se usa cuando
  algo sale mal y nadie está físicamente en el centro de datos.
