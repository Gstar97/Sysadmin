- id: p01
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Qué hace normalmente el nivel 1 de una mesa de ayuda?
  opciones:
    - { texto: "Recibe y registra los pedidos, resuelve lo conocido y deriva el resto", correcta: true, explicacion: "Es el primer contacto con los usuarios." }
    - { texto: "Diseña la arquitectura de los sistemas", explicacion: "Eso lo hacen arquitectos y especialistas." }
    - { texto: "Atiende solo los problemas más complejos", explicacion: "Eso es el nivel 3." }
    - { texto: "Escribe el código de las aplicaciones", explicacion: "Eso lo hace el equipo de desarrollo." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Qué significa escalar un caso?
  opciones:
    - { texto: "Pasarlo al nivel o al equipo siguiente, con toda la información de lo que ya se probó", correcta: true, explicacion: "Un buen escalamiento evita que el siguiente nivel empiece de cero." }
    - { texto: "Aumentar su prioridad sin motivo", explicacion: "La prioridad depende del impacto y la urgencia." }
    - { texto: "Cerrarlo sin resolver", explicacion: "Escalar es derivar, no cerrar." }
    - { texto: "Quejarse con el jefe del usuario", explicacion: "No tiene que ver con quejas." }
- id: p03
  tipo: opcion_multiple
  enunciado: ¿Qué rol se ocupa principalmente de switches, routers, VLAN y VPN?
  opciones:
    - { texto: "Administrador de redes", correcta: true, explicacion: "Es su área central." }
    - { texto: "DBA", explicacion: "El DBA administra bases de datos." }
    - { texto: "Mesa de ayuda", explicacion: "La mesa de ayuda recibe pedidos, pero no configura la red." }
    - { texto: "Desarrollador", explicacion: "Desarrolla aplicaciones." }
- id: p04
  tipo: opcion_multiple
  enunciado: ¿Qué caracteriza al rol de SRE?
  opciones:
    - { texto: "Aplica prácticas de programación a la operación: mide la disponibilidad y automatiza el trabajo repetitivo", correcta: true, explicacion: "Lo propuso Google; define objetivos medibles de disponibilidad." }
    - { texto: "Atiende llamadas de usuarios", explicacion: "Eso es la mesa de ayuda." }
    - { texto: "Solo instala cableado", explicacion: "No es su tarea." }
    - { texto: "Hace pruebas de penetración", explicacion: "Eso es un rol de seguridad ofensiva." }
- id: p05
  tipo: opcion_multiple
  diagnostico: true
  enunciado: Quieres trabajar en cloud. ¿Qué base conviene tener primero?
  opciones:
    - { texto: "Linux, redes y servicios: la nube se apoya en todo eso", correcta: true, explicacion: "Sin esa base, se usan las herramientas sin entender qué hacen ni cómo diagnosticar fallas." }
    - { texto: "Ninguna: la nube es independiente de todo lo demás", explicacion: "En la nube hay servidores, redes y servicios igual que en un centro de datos." }
    - { texto: "Solo una certificación de cloud", explicacion: "La certificación ayuda, pero sin la base técnica no alcanza." }
    - { texto: "Diseño gráfico", explicacion: "No es una base técnica para infraestructura." }
- id: p06
  tipo: respuesta_multiple
  enunciado: ¿Qué debería incluir un buen escalamiento de un caso?
  opciones:
    - { texto: "Qué pasa exactamente y desde cuándo", correcta: true, explicacion: "Define el problema." }
    - { texto: "Qué se probó y qué resultado dio", correcta: true, explicacion: "Evita repetir pruebas." }
    - { texto: "Los mensajes de error textuales", correcta: true, explicacion: "Un mensaje exacto se puede buscar; una descripción aproximada no." }
    - { texto: "Solo la frase 'no anda'", explicacion: "Sin datos, el siguiente nivel empieza de cero." }
- id: p07
  tipo: opcion_multiple
  enunciado: ¿Para qué sirven las certificaciones al empezar la carrera?
  opciones:
    - { texto: "Para ordenar el estudio y pasar los filtros de búsquedas laborales, junto con la práctica", correcta: true, explicacion: "Ayudan, pero no reemplazan la experiencia ni el laboratorio propio." }
    - { texto: "Reemplazan la experiencia práctica", explicacion: "En una entrevista técnica se nota la diferencia." }
    - { texto: "Son obligatorias para trabajar", explicacion: "No son obligatorias; muchas personas trabajan sin ellas." }
    - { texto: "No sirven para nada", explicacion: "Son útiles como guía de estudio y como señal para quien contrata." }
- id: p08
  tipo: encontrar_error
  enunciado: Marca la descripción de rol incorrecta.
  archivo: |
    DBA: administra bases de datos, sus copias y su rendimiento.
    Analista SOC: analiza alertas de seguridad y responde a incidentes.
    DevOps: automatiza la construcción y publicación de aplicaciones.
    Mesa de ayuda N3: primer contacto con los usuarios.
  lineas_con_error: [4]
  explicacion: El primer contacto es el nivel 1. El nivel 3 son los especialistas o el soporte del fabricante.
