tipo: emparejar
consigna: Une cada tarea con el rol que normalmente la hace.
pares:
  - { a: "Atender llamadas y resolver contraseñas olvidadas siguiendo procedimientos", b: "Mesa de ayuda (nivel 1)" }
  - { a: "Configurar switches, routers, VLAN y la VPN de la empresa", b: "Administrador de redes" }
  - { a: "Mantener los servidores Linux y Windows, sus servicios y sus backups", b: "Sysadmin" }
  - { a: "Automatizar las pruebas y las publicaciones de las aplicaciones", b: "DevOps" }
  - { a: "Definir objetivos de disponibilidad y medir cuánto se cumplen", b: "SRE" }
  - { a: "Analizar alertas de seguridad y responder a intrusiones", b: "Analista de seguridad (SOC)" }
  - { a: "Optimizar consultas y administrar las copias de las bases de datos", b: "DBA" }
explicacion: >-
  Los límites entre roles no son rígidos: en una empresa mediana, el sysadmin también configura
  la red y responde alertas de seguridad. Lo que cambia con la especialización es la profundidad
  en cada tema.
