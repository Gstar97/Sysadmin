<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="20" y="20" width="200" height="50" rx="8" fill="var(--surface-2, #eef2f5)"/>
    <rect x="20" y="100" width="200" height="50" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="20" y="180" width="200" height="50" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="20" y="260" width="200" height="50" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="300" y="260" width="170" height="50" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="300" y="100" width="170" height="130" rx="8" fill="var(--bad-soft, #fde2e2)"/>
    <rect x="500" y="100" width="160" height="130" rx="8" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none" marker-end="url(#f)">
    <line x1="120" y1="70" x2="120" y2="98"/>
    <line x1="120" y1="150" x2="120" y2="178"/>
    <line x1="120" y1="230" x2="120" y2="258"/>
    <line x1="220" y1="285" x2="298" y2="285"/>
    <line x1="220" y1="125" x2="298" y2="140"/>
    <line x1="220" y1="205" x2="298" y2="190"/>
    <line x1="470" y1="165" x2="498" y2="165"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="120" y="42" font-weight="700">Me piden acceder a datos</text>
    <text x="120" y="58">o hacer algo con privilegios</text>
    <text x="120" y="122" font-weight="600">¿Hay autorización por escrito</text>
    <text x="120" y="138" font-weight="600">de quien corresponde?</text>
    <text x="120" y="202" font-weight="600">¿Es lo mínimo necesario</text>
    <text x="120" y="218" font-weight="600">para el objetivo?</text>
    <text x="120" y="282" font-weight="600">¿Va a quedar registrado</text>
    <text x="120" y="298" font-weight="600">en el ticket?</text>
    <text x="385" y="280" font-weight="700">Sí a todo:</text>
    <text x="385" y="296">adelante</text>
    <text x="385" y="150" font-weight="700">No a alguna:</text>
    <text x="385" y="168">no lo hagas todavía</text>
    <text x="385" y="186">(aunque técnicamente</text>
    <text x="385" y="202">puedas)</text>
    <text x="580" y="140" font-weight="700">Pide el pedido</text>
    <text x="580" y="156">formal o consulta</text>
    <text x="580" y="172">a tu supervisor,</text>
    <text x="580" y="188">a seguridad o</text>
    <text x="580" y="204">a legales</text>
  </g>
  <text x="250" y="122" font-size="11" fill="currentColor">no</text>
  <text x="250" y="212" font-size="11" fill="currentColor">no</text>
  <text x="250" y="278" font-size="11" fill="currentColor">sí</text>
</svg>
