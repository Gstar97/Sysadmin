- id: p01
  tipo: opcion_multiple
  diagnostico: true
  enunciado: Como administrador puedes abrir cualquier carpeta del servidor de archivos. ¿Cuándo corresponde abrir una carpeta con datos de otra área?
  opciones:
    - { texto: "Solo cuando la tarea lo requiere y está autorizada por quien corresponde", correcta: true, explicacion: "El acceso técnico no es autorización para usarlo." }
    - { texto: "Siempre, porque tienes permiso técnico", explicacion: "Poder técnicamente no es lo mismo que estar autorizado." }
    - { texto: "Cuando nadie está mirando", explicacion: "Los accesos quedan registrados, y además no corresponde." }
    - { texto: "Nunca, bajo ninguna circunstancia", explicacion: "Con un pedido autorizado y un motivo de trabajo, sí corresponde." }
- id: p02
  tipo: respuesta_multiple
  diagnostico: true
  enunciado: Antes de usar un acceso privilegiado sobre datos de otra persona, ¿qué conviene confirmar?
  opciones:
    - { texto: "Que hay autorización por escrito de quien corresponde", correcta: true, explicacion: "Es la base de todo." }
    - { texto: "Que lo que vas a hacer es lo mínimo necesario", correcta: true, explicacion: "Si hay que recuperar un archivo, se recupera ese y nada más." }
    - { texto: "Que va a quedar registrado en el ticket", correcta: true, explicacion: "Permite revisar después qué se hizo y por qué, y te protege." }
    - { texto: "Que el pedido viene de alguien con un cargo alto", explicacion: "El cargo no reemplaza la autorización formal del área que corresponde." }
- id: p03
  tipo: opcion_multiple
  diagnostico: true
  enunciado: Un mensaje de un número desconocido dice ser del gerente general y pide urgente su contraseña nueva. ¿Qué haces?
  opciones:
    - { texto: "Verifico su identidad llamando al número que tiene la empresa y aviso a seguridad", correcta: true, explicacion: "Urgencia, autoridad y un canal nuevo son las señales típicas de la ingeniería social." }
    - { texto: "Se la reseteo y se la envío por ese mismo chat", explicacion: "Si es un ataque, le entregas el correo del gerente a un atacante." }
    - { texto: "Le pido que me diga su fecha de nacimiento para confirmar", explicacion: "Es un dato fácil de averiguar; la verificación tiene que ser por un canal conocido." }
    - { texto: "Lo ignoro y no le cuento a nadie", explicacion: "No caes, pero otros pueden estar recibiendo lo mismo: hay que avisar." }
- id: p04
  tipo: opcion_multiple
  diagnostico: true
  enunciado: Borraste por error archivos de un área. Tienes el backup de anoche. ¿Qué es lo correcto?
  opciones:
    - { texto: "Avisar enseguida al área y a tu supervisor, y restaurar el backup", correcta: true, explicacion: "Lo que el área hizo hoy se perdió y tiene que saberlo; ocultarlo empeora todo." }
    - { texto: "Restaurar en silencio, ya que nadie se dio cuenta", explicacion: "El área no sabría que perdió el trabajo de hoy." }
    - { texto: "Esperar a ver si alguien reclama", explicacion: "Mientras tanto se trabaja con datos incompletos." }
    - { texto: "Culpar a un fallo del sistema", explicacion: "Mentir sobre un error destruye la confianza y no ayuda a evitar que se repita." }
- id: p05
  tipo: opcion_multiple
  enunciado: Tu jefe te pide desactivar por un día el registro de accesos de un sistema "porque genera muchas alertas". ¿Qué haces?
  opciones:
    - { texto: "Pido que se formalice por escrito con el motivo, consulto a seguridad y propongo filtrar las alertas en lugar de apagar el registro", correcta: true, explicacion: "Apagar controles de auditoría es delicado; hay alternativas que resuelven el problema real." }
    - { texto: "Lo desactivo, porque es mi jefe", explicacion: "Un día sin registro es justo el que no se podría auditar." }
    - { texto: "Me niego y no ofrezco ninguna alternativa", explicacion: "El problema de las alertas es real; conviene proponer una solución que no elimine el control." }
    - { texto: "Lo desactivo y no lo anoto en ningún lado", explicacion: "Además de apagar el control, no deja rastro de quién lo hizo." }
- id: p06
  tipo: opcion_multiple
  enunciado: En los registros ves que una cuenta copia cada noche la base de clientes a un disco externo. ¿Qué haces?
  opciones:
    - { texto: "Lo reporto a mi supervisor o a seguridad con la evidencia, sin alterar los registros ni comentarlo con otros", correcta: true, explicacion: "Puede ser una fuga de datos; la investigación corresponde a quien defina la organización." }
    - { texto: "Le pregunto directamente al empleado", explicacion: "Si es una fuga, lo pones sobre aviso y puede borrar evidencias." }
    - { texto: "Borro los registros para no meter a nadie en problemas", explicacion: "Destruir evidencia es grave y puede ser ilegal." }
    - { texto: "No hago nada: no es mi tarea", explicacion: "Detectar y reportar actividad anómala sí es parte del trabajo." }
- id: p07
  tipo: opcion_multiple
  enunciado: ¿Cuál es la forma correcta de darle una contraseña inicial a un usuario nuevo?
  opciones:
    - { texto: "Una contraseña temporal que el sistema obliga a cambiar en el primer inicio de sesión, entregada por un canal acordado", correcta: true, explicacion: "Así nadie más conoce la contraseña definitiva." }
    - { texto: "Por WhatsApp, que es más rápido", explicacion: "Queda guardada en los teléfonos y en los servidores del servicio." }
    - { texto: "La misma contraseña para todos los usuarios nuevos", explicacion: "Cualquiera que la conozca podría entrar a las cuentas nuevas." }
    - { texto: "Anotada en un papel pegado al monitor", explicacion: "Cualquiera que pase la puede ver." }
- id: p08
  tipo: opcion_multiple
  enunciado: ¿Qué es la ingeniería social?
  opciones:
    - { texto: "Manipular a las personas para que entreguen información o hagan algo, usando urgencia, autoridad o confianza", correcta: true, explicacion: "Muchos ataques empiezan así, sin ninguna falla técnica." }
    - { texto: "Una rama de la ingeniería civil", explicacion: "En seguridad informática tiene otro significado." }
    - { texto: "El diseño de redes sociales", explicacion: "No tiene relación." }
    - { texto: "Un tipo de virus", explicacion: "No es software: es una técnica de engaño." }
- id: p09
  tipo: encontrar_error
  enunciado: Estas son reglas de trabajo de un equipo de sistemas. Marca la que es incorrecta.
  archivo: |
    Los accesos a datos de otras personas se hacen con un ticket aprobado.
    Si vemos información confidencial sin querer, no la usamos ni la comentamos.
    Para agilizar, las contraseñas se comparten por el grupo de chat del equipo.
    Los errores propios se avisan enseguida y se analizan sin buscar culpables.
  lineas_con_error: [3]
  explicacion: Las contraseñas no se comparten por chat; se usa un gestor de contraseñas con permisos por persona.
- id: p10
  tipo: opcion_multiple
  enunciado: ¿Por qué un pedido autorizado por escrito también protege al sysadmin?
  opciones:
    - { texto: "Porque si alguien pregunta después por qué accedió a esos datos, el pedido aprobado lo justifica", correcta: true, explicacion: "La autorización deja claro que se actuó a pedido de quien correspondía." }
    - { texto: "Porque así no tiene que hacer el trabajo", explicacion: "Lo hace igual; la diferencia es que está respaldado." }
    - { texto: "Porque le da acceso a más sistemas", explicacion: "No amplía accesos; documenta un uso concreto." }
    - { texto: "No lo protege; solo es burocracia", explicacion: "Es justamente lo que lo respalda ante una auditoría o un reclamo." }
