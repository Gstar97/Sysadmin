- { id: t1, frente: "Tres preguntas antes de usar un acceso privilegiado sobre datos de otros", dorso: "¿Hay autorización por escrito de quien corresponde? ¿Es lo mínimo necesario? ¿Va a quedar registrado?" }
- { id: t2, frente: "¿Cómo se responde a un pedido irregular?", dorso: "No se ejecuta en el momento: se pide el canal formal con autorización escrita y se consulta al supervisor, seguridad o Legales." }
- { id: t3, frente: "Señales de ingeniería social", dorso: "Urgencia, autoridad, un canal nuevo o inusual, pedido de contraseñas o de saltear el procedimiento. Se verifica por otro canal." }
- { id: t4, frente: "Qué hacer ante un error propio", dorso: "Avisar enseguida, ayudar a resolverlo y contar exactamente qué pasó." }
- { id: t5, frente: "Análisis sin culpables", dorso: "Analizar un incidente para entender por qué fue posible y cambiar el proceso, no para castigar a quien se equivocó." }
