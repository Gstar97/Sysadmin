tipo: emparejar
consigna: Une cada situación con el tipo de registro que corresponde en una mesa de ayuda.
pares:
  - { a: "El correo no funciona para ningún usuario desde las 10:15", b: "Incidente: algo dejó de funcionar" }
  - { a: "Una persona nueva necesita una cuenta y acceso a la carpeta de su área", b: "Solicitud de servicio: un pedido normal" }
  - { a: "Instalar las actualizaciones de seguridad en los servidores el jueves a la noche", b: "Cambio: una modificación planificada y aprobada" }
  - { a: "El servidor de archivos se cuelga todos los lunes y nadie sabe por qué", b: "Problema: la causa de fondo de incidentes repetidos" }
explicacion: >-
  Separar estos cuatro tipos ordena el trabajo: los incidentes se atienden según su prioridad,
  las solicitudes siguen un procedimiento, los cambios se planifican y aprueban antes, y los
  problemas se investigan para que los incidentes dejen de repetirse.
