tipo: ordenar
consigna: >-
  Lunes, 9:05. Encuentras esto en tu bandeja. Ordénalo por prioridad, de lo que atiendes primero
  (arriba) a lo que puede esperar (abajo).
pasos:
  - "El sistema de ventas no responde para nadie de la empresa"
  - "El backup de anoche del servidor de archivos terminó con error"
  - "Una persona empieza a trabajar mañana y necesita su cuenta y su equipo"
  - "La impresora del gerente no imprime (hay otra impresora en el mismo piso)"
  - "Un área pide instalar un programa nuevo para dentro de dos semanas"
explicacion: >-
  Primero lo que tiene más impacto ahora: si ventas no funciona, la empresa pierde dinero cada
  minuto. Después el backup fallido: todavía no hay daño, pero hoy los datos no tienen copia y
  hay que repetirlo. La cuenta del empleado nuevo tiene fecha límite mañana. La impresora afecta
  a una sola persona que tiene una alternativa al lado, y el programa nuevo es un pedido
  planificado. Que lo pida el gerente no lo vuelve más urgente que un sistema caído.
