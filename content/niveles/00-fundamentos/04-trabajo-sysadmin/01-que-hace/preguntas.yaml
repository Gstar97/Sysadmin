- id: p01
  tipo: respuesta_multiple
  diagnostico: true
  enunciado: ¿Cuáles de estas son tareas habituales de un sysadmin?
  opciones:
    - { texto: "Crear y dar de baja cuentas de usuarios", correcta: true, explicacion: "Altas, bajas y cambios de accesos son tarea diaria." }
    - { texto: "Revisar que los backups se hayan hecho y probar restaurarlos", correcta: true, explicacion: "Un backup que nunca se probó puede no servir cuando hace falta." }
    - { texto: "Instalar parches de seguridad", correcta: true, explicacion: "Es una de las tareas de mantenimiento más importantes." }
    - { texto: "Diseñar el logo de la empresa", explicacion: "Es trabajo de diseño, no de administración de sistemas." }
- id: p02
  tipo: opcion_multiple
  enunciado: ¿Por qué conviene empezar el día revisando alertas, backups y monitoreo?
  opciones:
    - { texto: "Para detectar y resolver problemas antes de que los usuarios los noten", correcta: true, explicacion: "Es mucho mejor encontrar un disco casi lleno a las 9 que a las 11 con el servicio caído." }
    - { texto: "Porque es lo que piden los usuarios", explicacion: "Los usuarios no suelen ver estas revisiones; se hacen para prevenir." }
    - { texto: "Porque a esa hora no hay tickets", explicacion: "Puede haber tickets; la revisión es para anticiparse." }
    - { texto: "Para llenar el tiempo libre", explicacion: "Es una tarea de prevención, no de relleno." }
- id: p03
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Qué es una ventana de mantenimiento?
  opciones:
    - { texto: "Un horario acordado y avisado en el que se hacen cambios que pueden causar cortes", correcta: true, explicacion: "Por ejemplo, los jueves de 22 a 24. Así los cortes no sorprenden a nadie." }
    - { texto: "Una ventana del sistema operativo para ver las actualizaciones", explicacion: "No se refiere a una ventana en pantalla." }
    - { texto: "El tiempo que tarda en reiniciarse un servidor", explicacion: "Es un horario de trabajo planificado, no una medida técnica." }
    - { texto: "El período de garantía de un equipo", explicacion: "No tiene relación con la garantía." }
- id: p04
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿De qué depende la prioridad de un incidente?
  opciones:
    - { texto: "Del impacto (a cuántos afecta) y la urgencia (qué tan rápido causa daño)", correcta: true, explicacion: "Es la combinación que se usa en casi todas las mesas de ayuda." }
    - { texto: "Del cargo de quien lo reporta", explicacion: "El cargo no cambia cuánto afecta el problema al negocio." }
    - { texto: "Del orden de llegada", explicacion: "El orden de llegada solo desempata entre incidentes de la misma prioridad." }
    - { texto: "De qué tan fácil es resolverlo", explicacion: "Algo fácil y sin impacto puede esperar; algo difícil y crítico, no." }
- id: p05
  tipo: opcion_multiple
  enunciado: El servidor de archivos se cuelga todos los lunes y cada vez se reinicia. ¿Qué tipo de registro hay que abrir, además de cada incidente?
  opciones:
    - { texto: "Un problema, para investigar la causa de fondo", correcta: true, explicacion: "Los incidentes restablecen el servicio; el problema busca que no se repita." }
    - { texto: "Una solicitud de servicio", explicacion: "Las solicitudes son pedidos normales, como un alta de usuario." }
    - { texto: "Ninguno: reiniciar alcanza", explicacion: "Si se repite cada semana, reiniciar es solo un parche." }
    - { texto: "Un cambio", explicacion: "El cambio puede llegar después, cuando se sepa qué hay que corregir." }
- id: p06
  tipo: opcion_multiple
  enunciado: Un usuario te pide por chat que le instales un programa y lo haces en dos minutos. ¿Hace falta registrarlo?
  opciones:
    - { texto: "Sí: queda historial, se puede medir y otro del equipo sabe qué se instaló y por qué", correcta: true, explicacion: "Lo que no se registra se pierde, aunque haya llevado dos minutos." }
    - { texto: "No, porque fue rápido", explicacion: "La duración no cambia la necesidad de dejar registro." }
    - { texto: "Solo si el programa es pago", explicacion: "Cualquier cambio en un equipo conviene registrarlo." }
    - { texto: "Solo si falla después", explicacion: "Si falla, el registro es justamente lo que permite saber qué se hizo." }
- id: p07
  tipo: opcion_multiple
  diagnostico: true
  enunciado: Un incidente afecta a una sola persona y tiene una alternativa disponible. ¿Qué prioridad corresponde en la tabla de impacto y urgencia?
  opciones:
    - { texto: "Baja (P4)", correcta: true, explicacion: "Impacto bajo y urgencia baja." }
    - { texto: "Crítica (P1)", explicacion: "P1 es para impacto alto y urgencia alta, como un sistema caído para toda la empresa." }
    - { texto: "Alta (P2)", explicacion: "Para P2 hace falta más impacto o más urgencia." }
    - { texto: "Depende de quién sea la persona", explicacion: "La prioridad depende del impacto y la urgencia, no de la persona." }
- id: p08
  tipo: ordenar_pasos
  enunciado: Ordena los pasos de un cambio bien hecho, como instalar parches en un servidor.
  pasos:
    - Probar los parches en un servidor de prueba
    - Pedir la aprobación del cambio y avisar a los usuarios
    - Preparar el plan para volver atrás si algo sale mal
    - Aplicarlos en la ventana de mantenimiento
    - Verificar que los servicios funcionan y cerrar el cambio
  explicacion: El plan para volver atrás se prepara antes de tocar nada; en medio de un problema no hay tiempo para pensarlo.
- id: p09
  tipo: opcion_multiple
  enunciado: ¿Por qué un equipo de sistemas debe reservar tiempo para proyectos aunque haya muchos tickets?
  opciones:
    - { texto: "Porque los proyectos (automatizar, mejorar el monitoreo) son los que reducen las interrupciones a futuro", correcta: true, explicacion: "Si todo el tiempo se va en apagar incendios, nunca se atacan las causas." }
    - { texto: "Porque los tickets no son importantes", explicacion: "Los tickets son importantes; se trata de equilibrar." }
    - { texto: "Porque así lo exige ITIL", explicacion: "Es una buena práctica de organización del trabajo, no un requisito de un marco." }
    - { texto: "No hace falta: primero se terminan los tickets", explicacion: "Los tickets nunca se terminan; sin reservar tiempo, los proyectos no avanzan." }
