- { id: t1, frente: "Tareas habituales de un sysadmin", dorso: "Usuarios, parches, backups, monitoreo, incidentes, proyectos, documentación y proveedores." }
- { id: t2, frente: "Incidente, solicitud, cambio y problema", dorso: "Incidente: algo dejó de funcionar. Solicitud: pedido normal. Cambio: modificación planificada y aprobada. Problema: causa de fondo de incidentes repetidos." }
- { id: t3, frente: "¿De qué depende la prioridad de un incidente?", dorso: "Del impacto (a cuántos afecta) y de la urgencia (qué tan rápido causa daño)." }
- { id: t4, frente: "Ventana de mantenimiento", dorso: "Horario acordado y avisado para hacer cambios que pueden causar cortes." }
- { id: t5, frente: "¿Por qué se registra todo en tickets?", dorso: "Para no perder pedidos, medir, tener historial y que cualquiera del equipo sepa qué se hizo." }
- { id: t6, frente: "Pasos de un cambio bien hecho", dorso: "Probar, aprobar y avisar, preparar la vuelta atrás, aplicar en la ventana, verificar y cerrar." }
