- id: p01
  tipo: ordenar_pasos
  diagnostico: true
  enunciado: Ordena los pasos del método de troubleshooting.
  pasos:
    - Definir el síntoma con precisión
    - Reunir información y preguntar qué cambió
    - Formular una hipótesis
    - Probarla cambiando una sola cosa
    - Sacar una conclusión
    - Registrar causa, solución y verificación
  explicacion: Si la conclusión no confirma la hipótesis, se vuelve a formular otra con lo aprendido.
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Cuál es una de las preguntas más útiles al empezar a investigar un incidente?
  opciones:
    - { texto: "¿Qué cambió?", correcta: true, explicacion: "La mayoría de los incidentes llega después de un cambio: una actualización, una configuración, un cable movido." }
    - { texto: "¿Quién tiene la culpa?", explicacion: "Buscar culpables no ayuda a encontrar la causa." }
    - { texto: "¿Cuánto cuesta un servidor nuevo?", explicacion: "Todavía no se sabe cuál es el problema." }
    - { texto: "¿Ya probaste reiniciar todo?", explicacion: "Reiniciar sin saber la causa puede ocultar pistas y no resolver nada." }
- id: p03
  tipo: opcion_multiple
  enunciado: ¿Por qué conviene cambiar una sola cosa por vez al probar?
  opciones:
    - { texto: "Para saber con certeza qué cambio resolvió el problema (o lo empeoró)", correcta: true, explicacion: "Con varios cambios juntos no se puede saber cuál tuvo efecto." }
    - { texto: "Porque los sistemas no aceptan dos cambios", explicacion: "Los aceptan; el problema es que después no se sabe cuál funcionó." }
    - { texto: "Para que el problema tarde más en resolverse", explicacion: "Al contrario: evita vueltas y diagnósticos equivocados." }
    - { texto: "Por una norma legal", explicacion: "Es una buena práctica de diagnóstico, no una ley." }
- id: p04
  tipo: opcion_multiple
  enunciado: A cinco personas de un área les falla lo mismo al mismo tiempo. ¿Qué hipótesis conviene priorizar?
  opciones:
    - { texto: "Algo que comparten: la red del área, un servidor o un recurso común", correcta: true, explicacion: "Es poco probable que cinco PC fallen por separado a la vez." }
    - { texto: "Un problema distinto en cada PC", explicacion: "Posible, pero mucho menos probable que una causa común." }
    - { texto: "Que los cinco usuarios hacen algo mal", explicacion: "Sin evidencia, no es una buena hipótesis inicial." }
    - { texto: "Un virus en cada PC", explicacion: "Sin evidencia de eso, una causa compartida es más probable y más fácil de comprobar." }
- id: p05
  tipo: completar_comando
  enunciado: En Linux, escribe el comando que busca en los manuales los comandos relacionados con la palabra "network".
  aceptadas: [apropos network, man -k network]
  explicacion: "`apropos palabra` y `man -k palabra` buscan la palabra en las descripciones de todos los manuales."
- id: p06
  tipo: respuesta_multiple
  diagnostico: true
  enunciado: Vas a buscar en internet un mensaje de error de un servidor. ¿Qué conviene hacer?
  opciones:
    - { texto: "Copiar el mensaje textual, en el idioma original", correcta: true, explicacion: "Es lo que coincide con lo que otros publicaron." }
    - { texto: "Quitar nombres de equipos, IP y otros datos propios", correcta: true, explicacion: "No aportan a la búsqueda y pueden exponer información interna." }
    - { texto: "Agregar el producto y la versión", correcta: true, explicacion: "Filtra resultados de otras versiones donde la solución es distinta." }
    - { texto: "Ejecutar la primera solución que aparezca, aunque no la entiendas", explicacion: "Puede ser para otra versión o directamente dañina." }
- id: p07
  tipo: opcion_multiple
  enunciado: Encuentras en un foro la solución `curl https://sitio-desconocido.com/fix.sh | sudo bash`. ¿Qué haces?
  opciones:
    - { texto: "No lo ejecuto así: descargo el script, lo leo y entiendo qué hace antes de decidir", correcta: true, explicacion: "Ese comando ejecuta como root lo que sea que haya en ese sitio, sin que lo veas." }
    - { texto: "Lo ejecuto, porque a otros les funcionó", explicacion: "Le estarías dando control total del servidor a un script desconocido." }
    - { texto: "Lo ejecuto sin sudo para que sea seguro", explicacion: "Sin entender qué hace, sigue siendo un riesgo; y quizás no funcione." }
    - { texto: "Lo ejecuto en producción para ver si arregla el problema", explicacion: "Es el peor lugar para probar algo desconocido." }
- id: p08
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Qué le falta a esta pregunta en un foro? "Instalé nginx y no funciona, ¿qué hago?"
  opciones:
    - { texto: "El sistema y su versión, el error textual, qué se esperaba y qué se probó", correcta: true, explicacion: "Sin esos datos, nadie puede ayudar más que adivinando." }
    - { texto: "Nada, está completa", explicacion: "No dice ni qué falla ni en qué sistema." }
    - { texto: "Un saludo más cordial", explicacion: "La cordialidad está bien, pero lo que falta son datos técnicos." }
    - { texto: "La contraseña del servidor", explicacion: "Nunca se publican contraseñas." }
- id: p09
  tipo: opcion_multiple
  enunciado: Alguien pregunta "¿cómo desactivo el firewall?", cuando en realidad necesita que un servicio sea accesible desde otra máquina. ¿Qué problema tiene la pregunta?
  opciones:
    - { texto: "Pregunta por la solución que se le ocurrió, no por su objetivo: le pueden responder lo que pide en vez de lo correcto (abrir un puerto)", correcta: true, explicacion: "Contar el objetivo real lleva a mejores respuestas." }
    - { texto: "Ninguno: desactivar el firewall es la solución correcta", explicacion: "Deja todo el servidor expuesto para resolver algo que se arregla abriendo un puerto." }
    - { texto: "Está escrita en español", explicacion: "El idioma no es el problema." }
    - { texto: "Es demasiado específica", explicacion: "El problema es que apunta a la solución equivocada." }
- id: p10
  tipo: encontrar_error
  enunciado: Esta nota del cuaderno técnico tiene una línea que no aporta lo necesario. Márcala.
  archivo: |
    Fecha: 2026-10-20 · rocky01 (Rocky Linux 10.0)
    Problema: >-
      sshd no arranca. Error: "Bad configuration option: PermitRootLogn"
    Causa: error de escritura en la línea 14 de /etc/ssh/sshd_config
    Solución: lo arreglé
    Verificación: systemctl status sshd → active (running); conexión SSH desde la PC OK
  lineas_con_error: [4]
  explicacion: La solución tiene que ser concreta y repetible, por ejemplo "corregí la línea 14 a PermitRootLogin no y ejecuté sudo sshd -t y sudo systemctl restart sshd".
