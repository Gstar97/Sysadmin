- { id: t1, frente: "Pasos del método de troubleshooting", dorso: "Síntoma, información (¿qué cambió?), hipótesis, prueba (un cambio por vez), conclusión y registro." }
- { id: t2, frente: "Tres estrategias para formular hipótesis", dorso: "Dividir el problema en partes, comparar con lo que funciona y reproducir el problema." }
- { id: t3, frente: "¿Cómo se buscan comandos por tema en Linux?", dorso: "man -k palabra o apropos palabra." }
- { id: t4, frente: "Cómo buscar un error en internet", dorso: "Mensaje textual en el idioma original, sin datos propios, con producto y versión, entre comillas; mirar fecha y fuente." }
- { id: t5, frente: "Partes de una buena pregunta técnica", dorso: "Contexto y versión, objetivo, error textual, lo esperado, lo probado y cómo reproducirlo." }
- { id: t6, frente: "Qué tiene una buena nota técnica", dorso: "Fecha y sistema, problema con el error, causa, solución con comandos exactos, verificación y fuentes." }
