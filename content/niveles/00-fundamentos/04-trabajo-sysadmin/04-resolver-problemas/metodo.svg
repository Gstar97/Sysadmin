<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.6" fill="none" marker-end="url(#f)">
    <path d="M465,46 Q595,46 595,96"/>
    <path d="M595,152 L595,226"/>
    <path d="M595,280 Q595,332 467,332"/>
    <path d="M255,332 Q125,332 125,282"/>
    <path d="M125,228 L125,154"/>
    <path d="M125,100 Q125,46 253,46"/>
    <path d="M230,254 L488,254" stroke-dasharray="6 4"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="255" y="20" width="210" height="52" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="490" y="100" width="210" height="52" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="490" y="228" width="210" height="52" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="255" y="306" width="210" height="52" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="20" y="228" width="210" height="52" rx="10" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="20" y="100" width="210" height="52" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="360" y="41" font-weight="700">1. Síntoma</text>
    <text x="360" y="59" font-size="11">qué falla, a quién, desde cuándo</text>
    <text x="595" y="121" font-weight="700">2. Información</text>
    <text x="595" y="139" font-size="11">registros, errores, ¿qué cambió?</text>
    <text x="595" y="249" font-weight="700">3. Hipótesis</text>
    <text x="595" y="267" font-size="11">la más probable y fácil de probar</text>
    <text x="360" y="327" font-weight="700">4. Prueba</text>
    <text x="360" y="345" font-size="11">un solo cambio por vez</text>
    <text x="125" y="249" font-weight="700">5. Conclusión</text>
    <text x="125" y="267" font-size="11">¿se confirmó la hipótesis?</text>
    <text x="125" y="121" font-weight="700">6. Registro</text>
    <text x="125" y="139" font-size="11">causa, solución, verificación</text>
    <text x="359" y="244" font-size="11" font-weight="600">no se confirmó: otra hipótesis</text>
  </g>
  <g fill="currentColor" font-size="11" font-weight="600">
    <text x="135" y="188">se confirmó:</text>
    <text x="135" y="202">corregir y verificar</text>
  </g>
</svg>
