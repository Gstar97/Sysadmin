tipo: paquetes
titulo: Qué viaja por la red al abrir https://tienda.example.com
descripcion: >-
  Una PC de una oficina abre una tienda en Internet. Primero averigua la IP con DNS, después abre
  una conexión TCP, hace el saludo TLS y recién entonces pide la página. Mira qué cambia en cada
  tramo y qué se mantiene.
nodos:
  - { id: pc, etiqueta: "PC 192.168.1.20", tipo: pc, x: 0, y: 160 }
  - { id: sw, etiqueta: Switch, tipo: switch, x: 150, y: 160 }
  - { id: dns, etiqueta: "DNS 192.168.1.53", tipo: dns, x: 150, y: 20 }
  - { id: r1, etiqueta: "Router con NAT", tipo: router, x: 300, y: 160 }
  - { id: inet, etiqueta: Internet, tipo: internet, x: 450, y: 160 }
  - { id: srv, etiqueta: "Servidor 198.51.100.20", tipo: servidor, x: 600, y: 160 }
enlaces:
  - { a: pc, b: sw }
  - { a: sw, b: dns }
  - { a: sw, b: r1 }
  - { a: r1, b: inet }
  - { a: inet, b: srv }
pasos:
  - desde: pc
    hacia: sw
    titulo: Consulta DNS
    explicacion: >-
      Para conectarse, la PC necesita la IP de tienda.example.com. Si no la tiene guardada, le
      pregunta a su servidor DNS, que está en la misma red local: la trama va directo a la MAC del
      DNS. Las consultas DNS viajan por UDP al puerto 53.
    capas:
      aplicacion: { protocolo: DNS, datos: "Consulta tipo A: tienda.example.com" }
      transporte: { protocolo: UDP, origen: 50123, destino: 53 }
      red: { origen: 192.168.1.20, destino: 192.168.1.53, ttl: 64, protocolo: UDP }
      enlace: { origen: "aa:aa:aa:00:00:20", destino: "dd:dd:dd:00:00:53" }
  - desde: sw
    hacia: dns
    titulo: El switch entrega la consulta
    explicacion: >-
      El switch busca la MAC de destino en su tabla y saca la trama solo por el puerto donde está
      el servidor DNS. No cambia nada del contenido.
    capas:
      aplicacion: { protocolo: DNS, datos: "Consulta tipo A: tienda.example.com" }
      transporte: { protocolo: UDP, origen: 50123, destino: 53 }
      red: { origen: 192.168.1.20, destino: 192.168.1.53, ttl: 64, protocolo: UDP }
      enlace: { origen: "aa:aa:aa:00:00:20", destino: "dd:dd:dd:00:00:53" }
  - desde: dns
    hacia: pc
    titulo: Respuesta DNS
    explicacion: >-
      Si el DNS no conocía la respuesta, antes la consultó a otros servidores de Internet (eso no
      se muestra aquí). Ahora la PC sabe a qué IP conectarse y guarda la respuesta un rato para no
      volver a preguntar. Los puertos se invierten: el origen es el 53.
    capas:
      aplicacion: { protocolo: DNS, datos: "Respuesta: tienda.example.com A 198.51.100.20" }
      transporte: { protocolo: UDP, origen: 53, destino: 50123 }
      red: { origen: 192.168.1.53, destino: 192.168.1.20, ttl: 64, protocolo: UDP }
      enlace: { origen: "dd:dd:dd:00:00:53", destino: "aa:aa:aa:00:00:20" }
  - desde: pc
    hacia: r1
    titulo: "TCP SYN: pedir una conexión al puerto 443"
    explicacion: >-
      El servidor está en otra red, así que la PC manda la trama a la MAC de su puerta de enlace
      (el router), aunque la IP de destino sea la del servidor. El SYN es el primer paso del saludo
      de TCP: "quiero abrir una conexión con tu puerto 443". El switch del medio la reenvía sin
      cambiar nada.
    capas:
      transporte: { protocolo: TCP, origen: 49832, destino: 443, flags: SYN }
      red: { origen: 192.168.1.20, destino: 198.51.100.20, ttl: 64, protocolo: TCP }
      enlace: { origen: "aa:aa:aa:00:00:20", destino: "11:11:11:00:00:01" }
  - desde: r1
    hacia: inet
    titulo: El router hace NAT
    explicacion: >-
      La IP 192.168.1.20 es privada y no sirve en Internet. El router la cambia por su IP pública
      (203.0.113.10), puede cambiar también el puerto de origen y anota la traducción en una tabla
      para saber a quién devolver la respuesta. Además baja el TTL en 1 y arma una trama nueva con
      sus propias MAC.
    capas:
      transporte: { protocolo: TCP, origen: 61002, destino: 443, flags: SYN }
      red: { origen: 203.0.113.10, destino: 198.51.100.20, ttl: 63, protocolo: TCP }
      enlace: { origen: "11:11:11:00:00:02", destino: "22:22:22:00:00:01" }
  - desde: inet
    hacia: srv
    titulo: Llega al servidor
    explicacion: >-
      El paquete pasó por varios routers de Internet: cada uno bajó el TTL en 1 y cambió las MAC,
      pero las IP y los puertos llegaron intactos. Si un firewall bloqueara el puerto 443, el
      paquete se descartaría aquí y el navegador terminaría mostrando que la conexión tardó
      demasiado en responder.
    capas:
      transporte: { protocolo: TCP, origen: 61002, destino: 443, flags: SYN }
      red: { origen: 203.0.113.10, destino: 198.51.100.20, ttl: 55, protocolo: TCP }
      enlace: { origen: "33:33:33:00:00:01", destino: "44:44:44:00:00:20" }
  - desde: srv
    hacia: r1
    titulo: "SYN-ACK: el servidor acepta"
    explicacion: >-
      El servidor responde que acepta la conexión. La respuesta va a la IP pública del router: el
      servidor nunca ve la IP privada de la PC.
    capas:
      transporte: { protocolo: TCP, origen: 443, destino: 61002, flags: "SYN, ACK" }
      red: { origen: 198.51.100.20, destino: 203.0.113.10, ttl: 64, protocolo: TCP }
  - desde: r1
    hacia: pc
    titulo: El router deshace el NAT
    explicacion: >-
      El router busca en su tabla a quién correspondía el puerto 61002 y le entrega la respuesta a
      la PC. La PC contesta con un ACK (no se muestra) y la conexión TCP queda establecida: es el
      saludo de tres pasos, SYN, SYN-ACK y ACK.
    capas:
      transporte: { protocolo: TCP, origen: 443, destino: 49832, flags: "SYN, ACK" }
      red: { origen: 198.51.100.20, destino: 192.168.1.20, ttl: 55, protocolo: TCP }
      enlace: { origen: "11:11:11:00:00:01", destino: "aa:aa:aa:00:00:20" }
  - desde: pc
    hacia: srv
    titulo: "TLS: el navegador saluda"
    explicacion: >-
      Con la conexión abierta empieza el saludo TLS. El navegador dice a qué sitio quiere entrar y
      qué versiones y cifrados entiende. Se muestra tal como sale de la PC; en el camino, el
      router vuelve a hacer NAT.
    capas:
      aplicacion: { protocolo: TLS 1.3, datos: "ClientHello: sitio tienda.example.com, cifrados que soporta" }
      transporte: { protocolo: TCP, origen: 49832, destino: 443, flags: "PSH, ACK" }
      red: { origen: 192.168.1.20, destino: 198.51.100.20, ttl: 64, protocolo: TCP }
  - desde: srv
    hacia: pc
    titulo: "TLS: el servidor presenta su certificado"
    explicacion: >-
      El servidor elige el cifrado y envía su certificado (en TLS 1.3 ya viaja cifrado). El
      navegador comprueba que lo firmó una autoridad de confianza, que no venció y que corresponde
      a tienda.example.com. Si algo no coincide, muestra la advertencia de que la conexión no es
      privada. Si todo está bien, desde aquí todo viaja cifrado.
    capas:
      aplicacion: { protocolo: TLS 1.3, datos: "ServerHello y, ya cifrado, el certificado de tienda.example.com" }
      transporte: { protocolo: TCP, origen: 443, destino: 49832, flags: "PSH, ACK" }
      red: { origen: 198.51.100.20, destino: 192.168.1.20, ttl: 55, protocolo: TCP }
  - desde: pc
    hacia: srv
    titulo: "HTTP dentro de TLS: el pedido"
    explicacion: >-
      Recién ahora viaja el pedido de la página. Quien mire la red ve una conexión cifrada hacia el
      puerto 443 de esa IP, pero no qué página se pide, ni las cookies ni las contraseñas. En el
      servidor, Nginx descifra el pedido y se lo pasa a la aplicación, que consulta la base de
      datos.
    capas:
      aplicacion: { protocolo: HTTPS, datos: "Cifrado. Dentro: GET / para el sitio tienda.example.com" }
      transporte: { protocolo: TCP, origen: 49832, destino: 443, flags: "PSH, ACK" }
      red: { origen: 192.168.1.20, destino: 198.51.100.20, ttl: 64, protocolo: TCP }
  - desde: srv
    hacia: pc
    titulo: "La respuesta: 200 OK"
    explicacion: >-
      La respuesta vuelve por el mismo camino. El navegador lee el HTML y descubre que necesita más
      cosas (estilos, imágenes, scripts): las pide por la misma conexión, a veces decenas de pedidos
      más. Todo el recorrido suele tardar menos de un segundo.
    capas:
      aplicacion: { protocolo: HTTPS, datos: "Cifrado. Dentro: 200 OK y el HTML de la página" }
      transporte: { protocolo: TCP, origen: 443, destino: 49832, flags: "PSH, ACK" }
      red: { origen: 198.51.100.20, destino: 192.168.1.20, ttl: 55, protocolo: TCP }
