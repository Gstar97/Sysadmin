<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="108" y1="226" x2="122" y2="226" marker-start="url(#f)" marker-end="url(#f)"/>
    <line x1="222" y1="226" x2="236" y2="226" marker-start="url(#f)" marker-end="url(#f)"/>
    <line x1="336" y1="226" x2="350" y2="226" marker-start="url(#f)" marker-end="url(#f)"/>
    <line x1="450" y1="226" x2="464" y2="226" marker-start="url(#f)" marker-end="url(#f)"/>
    <line x1="564" y1="226" x2="578" y2="226" marker-start="url(#f)" marker-end="url(#f)"/>
    <line x1="678" y1="226" x2="692" y2="226" marker-start="url(#f)" marker-end="url(#f)"/>
    <path d="M58,188 L58,68 L98,68" stroke-dasharray="5 4" marker-start="url(#f)" marker-end="url(#f)"/>
    <path d="M252,68 L286,68 L286,188" stroke-dasharray="5 4" marker-end="url(#f)"/>
    <line x1="340" y1="172" x2="786" y2="172" marker-end="url(#f)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="10" y="190" width="96" height="72" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="124" y="190" width="96" height="72" rx="10" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="238" y="190" width="96" height="72" rx="10" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="352" y="190" width="96" height="72" rx="10" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="466" y="190" width="96" height="72" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="580" y="190" width="96" height="72" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="694" y="190" width="96" height="72" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="100" y="40" width="150" height="56" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="10" y="300" width="780" height="40" rx="10" fill="var(--surface-2, #eef2f5)"/>
    <rect x="10" y="352" width="780" height="56" rx="10" fill="var(--surface-2, #eef2f5)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="58" y="214" font-weight="700">Tu PC</text>
    <text x="58" y="232" font-size="10">el navegador</text>
    <text x="58" y="280" font-size="10.5" font-weight="600" opacity="0.8">Niveles 1 y 3</text>
    <text x="172" y="214" font-weight="700">Router</text>
    <text x="172" y="232" font-size="10">puerta de enlace</text>
    <text x="172" y="246" font-size="10">y NAT</text>
    <text x="172" y="280" font-size="10.5" font-weight="600" opacity="0.8">Nivel 2</text>
    <text x="286" y="214" font-weight="700">Internet</text>
    <text x="286" y="232" font-size="10">routers de los</text>
    <text x="286" y="246" font-size="10">proveedores</text>
    <text x="286" y="280" font-size="10.5" font-weight="600" opacity="0.8">Nivel 2</text>
    <text x="400" y="214" font-weight="700">Firewall</text>
    <text x="400" y="232" font-size="10">solo deja pasar</text>
    <text x="400" y="246" font-size="10">el puerto 443</text>
    <text x="400" y="280" font-size="10.5" font-weight="600" opacity="0.8">Niveles 2 y 8</text>
    <text x="514" y="214" font-weight="700">Servidor web</text>
    <text x="514" y="232" font-size="10">Nginx, TLS,</text>
    <text x="514" y="246" font-size="10">proxy inverso</text>
    <text x="514" y="280" font-size="10.5" font-weight="600" opacity="0.8">Nivel 4</text>
    <text x="628" y="214" font-weight="700">Aplicación</text>
    <text x="628" y="232" font-size="10">PHP, Python,</text>
    <text x="628" y="246" font-size="10">Java, Node.js</text>
    <text x="628" y="280" font-size="10.5" font-weight="600" opacity="0.8">Niveles 1, 3 y 7</text>
    <text x="742" y="214" font-weight="700">Base de datos</text>
    <text x="742" y="232" font-size="10">MariaDB,</text>
    <text x="742" y="246" font-size="10">PostgreSQL</text>
    <text x="742" y="280" font-size="10.5" font-weight="600" opacity="0.8">Nivel 4</text>
    <text x="175" y="64" font-weight="700">Servidor DNS</text>
    <text x="175" y="82" font-size="10">traduce el nombre a una IP</text>
    <text x="564" y="162" font-size="11" font-weight="600">el pedido viaja hacia la derecha; la respuesta vuelve por el mismo camino</text>
    <text x="400" y="325" font-size="11.5">Dónde corre todo esto: servidores físicos (Nivel 4) · máquinas virtuales (Nivel 5) · contenedores y nube (Nivel 7)</text>
    <text x="400" y="376" font-size="11.5">Lo que lo mantiene funcionando: backups (Nivel 5) · monitoreo, logs y automatización (Nivel 6)</text>
    <text x="400" y="394" font-size="11.5">seguridad (Nivel 8) · documentación, cambios y guardias (Nivel 9)</text>
  </g>
  <g fill="currentColor" font-size="10">
    <text x="296" y="112">si no lo sabe,</text>
    <text x="296" y="126">pregunta a otros</text>
    <text x="296" y="140">DNS de Internet</text>
  </g>
</svg>
