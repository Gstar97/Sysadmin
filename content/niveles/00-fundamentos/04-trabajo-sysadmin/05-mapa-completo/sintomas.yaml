tipo: emparejar
consigna: Une cada síntoma con la parte del camino donde conviene empezar a investigar.
pares:
  - { a: "El navegador dice que no se encuentra la dirección del servidor; con la IP en lugar del nombre, la página abre", b: "DNS" }
  - { a: "Ninguna página carga y la PC no tiene puerta de enlace configurada", b: "Configuración de red de la PC" }
  - { a: "Aparece \"La conexión no es privada\": el certificado del sitio venció ayer", b: "TLS y certificados" }
  - { a: "El ping al servidor responde, pero la página se queda cargando hasta dar error de tiempo agotado", b: "Firewall (puerto bloqueado)" }
  - { a: "La página muestra \"502 Bad Gateway\"", b: "La aplicación detrás del servidor web" }
  - { a: "La página abre, pero dice \"Error al conectar con la base de datos\"", b: "Base de datos" }
explicacion: >-
  Conocer el camino completo permite descartar partes enteras con una sola prueba. Si la página
  abre con la IP pero no con el nombre, la red funciona y el problema es de DNS. Si responde el
  ping pero no el puerto 443, la red llega y algo bloquea o no escucha en ese puerto.
