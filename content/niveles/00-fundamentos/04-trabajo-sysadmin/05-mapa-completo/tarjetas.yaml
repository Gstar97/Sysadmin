- { id: t1, frente: "Recorrido de un pedido web", dorso: "DNS → puerta de enlace y NAT → Internet → firewall → TCP al 443 → TLS → HTTP → servidor web → aplicación → base de datos." }
- { id: t2, frente: "¿Qué hace el DNS?", dorso: "Traduce nombres (tienda.example.com) a direcciones IP." }
- { id: t3, frente: "Puertos de HTTPS, HTTP, SSH y DNS", dorso: "443, 80, 22 y 53." }
- { id: t4, frente: "Saludo de tres pasos de TCP", dorso: "SYN, SYN-ACK, ACK." }
- { id: t5, frente: "¿Qué verifica el navegador en un certificado?", dorso: "Que lo firmó una autoridad de confianza, que no venció y que corresponde al nombre del sitio." }
- { id: t6, frente: "Códigos HTTP 403, 404, 500, 502 y 503", dorso: "Sin permiso, no existe, falla la aplicación, el servidor web no llega a la aplicación, servicio no disponible." }
- { id: t7, frente: "Si con la IP funciona y con el nombre no…", dorso: "El problema es el DNS: la red está bien." }
- { id: t8, frente: "¿Por qué un ping exitoso no garantiza que la web funcione?", dorso: "El ping prueba la red, no el puerto 443, el certificado ni la aplicación." }
