<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="system-ui, sans-serif" font-size="13">
<text x="20" y="24" font-weight="700" fill="currentColor">Un byte: 8 bits, cada uno con su peso</text>
<rect x="20" y="58" width="70" height="46" rx="6" fill="var(--accent-soft, #d5f0ec)" stroke="currentColor" stroke-width="1.4"/>
<text x="55.0" y="50" text-anchor="middle" font-size="12" fill="currentColor">128</text>
<text x="55.0" y="88" text-anchor="middle" font-size="22" font-weight="700" font-family="ui-monospace, monospace" fill="currentColor">1</text>
<rect x="98" y="58" width="70" height="46" rx="6" fill="var(--accent-soft, #d5f0ec)" stroke="currentColor" stroke-width="1.4"/>
<text x="133.0" y="50" text-anchor="middle" font-size="12" fill="currentColor">64</text>
<text x="133.0" y="88" text-anchor="middle" font-size="22" font-weight="700" font-family="ui-monospace, monospace" fill="currentColor">1</text>
<rect x="176" y="58" width="70" height="46" rx="6" fill="var(--surface-2, #eef2f5)" stroke="currentColor" stroke-width="1.4"/>
<text x="211.0" y="50" text-anchor="middle" font-size="12" fill="currentColor">32</text>
<text x="211.0" y="88" text-anchor="middle" font-size="22" font-weight="700" font-family="ui-monospace, monospace" fill="currentColor">0</text>
<rect x="254" y="58" width="70" height="46" rx="6" fill="var(--surface-2, #eef2f5)" stroke="currentColor" stroke-width="1.4"/>
<text x="289.0" y="50" text-anchor="middle" font-size="12" fill="currentColor">16</text>
<text x="289.0" y="88" text-anchor="middle" font-size="22" font-weight="700" font-family="ui-monospace, monospace" fill="currentColor">0</text>
<rect x="332" y="58" width="70" height="46" rx="6" fill="var(--surface-2, #eef2f5)" stroke="currentColor" stroke-width="1.4"/>
<text x="367.0" y="50" text-anchor="middle" font-size="12" fill="currentColor">8</text>
<text x="367.0" y="88" text-anchor="middle" font-size="22" font-weight="700" font-family="ui-monospace, monospace" fill="currentColor">0</text>
<rect x="410" y="58" width="70" height="46" rx="6" fill="var(--surface-2, #eef2f5)" stroke="currentColor" stroke-width="1.4"/>
<text x="445.0" y="50" text-anchor="middle" font-size="12" fill="currentColor">4</text>
<text x="445.0" y="88" text-anchor="middle" font-size="22" font-weight="700" font-family="ui-monospace, monospace" fill="currentColor">0</text>
<rect x="488" y="58" width="70" height="46" rx="6" fill="var(--surface-2, #eef2f5)" stroke="currentColor" stroke-width="1.4"/>
<text x="523.0" y="50" text-anchor="middle" font-size="12" fill="currentColor">2</text>
<text x="523.0" y="88" text-anchor="middle" font-size="22" font-weight="700" font-family="ui-monospace, monospace" fill="currentColor">0</text>
<rect x="566" y="58" width="70" height="46" rx="6" fill="var(--surface-2, #eef2f5)" stroke="currentColor" stroke-width="1.4"/>
<text x="601.0" y="50" text-anchor="middle" font-size="12" fill="currentColor">1</text>
<text x="601.0" y="88" text-anchor="middle" font-size="22" font-weight="700" font-family="ui-monospace, monospace" fill="currentColor">0</text>
<text x="20" y="128" fill="currentColor">11000000 = 128 + 64 = <tspan font-weight="700">192</tspan>. Con los 8 bits en 1: 128+64+32+16+8+4+2+1 = <tspan font-weight="700">255</tspan>.</text>
<text x="20" y="180" font-weight="700" fill="currentColor">Una dirección IPv4: 4 bytes (octetos) = 32 bits</text>
<rect x="20" y="194" width="150" height="40" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.4"/>
<text x="95" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">192</text>
<text x="95" y="262" text-anchor="middle" font-size="15" font-family="ui-monospace, monospace" fill="currentColor">11000000</text>
<text x="177" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">.</text>
<rect x="185" y="194" width="150" height="40" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.4"/>
<text x="260" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">168</text>
<text x="260" y="262" text-anchor="middle" font-size="15" font-family="ui-monospace, monospace" fill="currentColor">10101000</text>
<text x="342" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">.</text>
<rect x="350" y="194" width="150" height="40" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.4"/>
<text x="425" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">1</text>
<text x="425" y="262" text-anchor="middle" font-size="15" font-family="ui-monospace, monospace" fill="currentColor">00000001</text>
<text x="507" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">.</text>
<rect x="515" y="194" width="150" height="40" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.4"/>
<text x="590" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">10</text>
<text x="590" y="262" text-anchor="middle" font-size="15" font-family="ui-monospace, monospace" fill="currentColor">00001010</text>
<text x="20" y="300" fill="currentColor">Cada octeto va de 0 (00000000) a 255 (11111111): por eso una IP como 192.168.1.300 no puede existir.</text>
</svg>
