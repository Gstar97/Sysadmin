- { id: t1, frente: "Pesos de los 8 bits de un byte", dorso: "128 64 32 16 8 4 2 1" }
- { id: t2, frente: "¿Cómo se pasa de binario a decimal?", dorso: "Sumando los pesos de las posiciones que tienen un 1." }
- { id: t3, frente: "¿Cómo se pasa de decimal a binario (hasta 255)?", dorso: "Recorriendo los pesos de 128 a 1: si el peso cabe en lo que queda, bit en 1 y se resta; si no, bit en 0." }
- { id: t4, frente: "Octetos de las máscaras de red", dorso: "128, 192, 224, 240, 248, 252, 254, 255 (unos seguidos desde la izquierda)." }
- { id: t5, frente: "¿Cuántos valores hay en n bits?", dorso: "2^n combinaciones, de 0 a 2^n − 1. 8 bits: 0 a 255. 16 bits: 0 a 65.535." }
- { id: t6, frente: "11000000 y 10101000", dorso: "192 y 168." }
- { id: t7, frente: "¿Por qué no existe la IP 192.168.1.300?", dorso: "Cada octeto tiene 8 bits: su máximo es 255." }
