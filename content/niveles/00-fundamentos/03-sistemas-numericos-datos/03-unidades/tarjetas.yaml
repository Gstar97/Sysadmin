- { id: t1, frente: "KB frente a KiB", dorso: "KB = 1000 bytes (decimal). KiB = 1024 bytes (binario)." }
- { id: t2, frente: "1 TB en GiB", dorso: "Unos 931 GiB. Por eso un disco de 1 TB aparece como 931 'GB' en Windows." }
- { id: t3, frente: "¿Cómo se pasa de Mbps a MB/s?", dorso: "Dividiendo por 8 (un byte son 8 bits)." }
- { id: t4, frente: "Velocidad real de copia en una red de 1 Gbps", dorso: "Unos 110 a 118 MB/s (máximo teórico 125 MB/s)." }
- { id: t5, frente: "Fórmula del tiempo de transferencia", dorso: "Tiempo = tamaño ÷ velocidad, con las dos en la misma unidad (por ejemplo, en bits)." }
- { id: t6, frente: "df -h frente a df -H", dorso: "df -h: potencias de 1024 (aunque escriba G). df -H: potencias de 1000." }
