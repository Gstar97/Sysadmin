<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui, sans-serif" font-size="13">
<text x="20" y="22" font-weight="700" fill="currentColor">Decimal (SI) y binario (IEC): la diferencia crece con cada escalón</text>
<text x="130" y="48" font-size="12" font-weight="600" fill="currentColor">decimal, en bytes</text><text x="300" y="48" font-size="12" font-weight="600" fill="currentColor">binario, en bytes</text><text x="500" y="48" font-size="12" font-weight="600" fill="currentColor">diferencia</text>
<text x="20" y="82" font-weight="700" fill="currentColor">kilo</text>
<text x="130" y="82" font-family="ui-monospace, monospace" fill="currentColor">KB = 1.000</text>
<text x="300" y="82" font-family="ui-monospace, monospace" fill="currentColor">KiB = 1.024</text>
<rect x="500" y="68" width="28.799999999999997" height="20" rx="4" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1"/>
<text x="534.8" y="82" font-size="12" fill="currentColor">2,4%</text>
<text x="20" y="126" font-weight="700" fill="currentColor">mega</text>
<text x="130" y="126" font-family="ui-monospace, monospace" fill="currentColor">MB = 1.000.000</text>
<text x="300" y="126" font-family="ui-monospace, monospace" fill="currentColor">MiB = 1.048.576</text>
<rect x="500" y="112" width="58.800000000000004" height="20" rx="4" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1"/>
<text x="564.8" y="126" font-size="12" fill="currentColor">4,9%</text>
<text x="20" y="170" font-weight="700" fill="currentColor">giga</text>
<text x="130" y="170" font-family="ui-monospace, monospace" fill="currentColor">GB = 10^9</text>
<text x="300" y="170" font-family="ui-monospace, monospace" fill="currentColor">GiB = 1.073.741.824</text>
<rect x="500" y="156" width="88.80000000000001" height="20" rx="4" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1"/>
<text x="594.8" y="170" font-size="12" fill="currentColor">7,4%</text>
<text x="20" y="214" font-weight="700" fill="currentColor">tera</text>
<text x="130" y="214" font-family="ui-monospace, monospace" fill="currentColor">TB = 10^12</text>
<text x="300" y="214" font-family="ui-monospace, monospace" fill="currentColor">TiB = 1,0995 × 10^12</text>
<rect x="500" y="200" width="120.0" height="20" rx="4" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1"/>
<text x="626.0" y="214" font-size="12" fill="currentColor">10,0%</text>
<text x="20" y="258" font-weight="700" fill="currentColor">peta</text>
<text x="130" y="258" font-family="ui-monospace, monospace" fill="currentColor">PB = 10^15</text>
<text x="300" y="258" font-family="ui-monospace, monospace" fill="currentColor">PiB = 1,1259 × 10^15</text>
<rect x="500" y="244" width="151.2" height="20" rx="4" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1"/>
<text x="657.2" y="258" font-size="12" fill="currentColor">12,6%</text>
<text x="20" y="290" font-size="12" fill="currentColor">Un disco de 1 TB (decimal) son 931 GiB (binario). Es la misma cantidad de bytes, contada en otra unidad.</text>
</svg>
