tipo: pasos
titulo: Verificar las imágenes de tu laboratorio
descripcion: Comprobá que las imágenes ISO que descargaste en el módulo anterior son exactamente las que publicó cada proveedor.
pasos:
  - titulo: Descargá la lista de hashes de Ubuntu
    detalle: >-
      En **releases.ubuntu.com**, entrá a la carpeta de tu versión (por ejemplo `26.04/`) y
      descargá el archivo `SHA256SUMS` a la misma carpeta donde está la ISO. Abrilo con un editor
      de texto: cada línea tiene un hash y el nombre de una imagen.
    comprobar: Tenés `SHA256SUMS` en la misma carpeta que la ISO de Ubuntu Server.
  - titulo: Verificá la ISO de Ubuntu
    variantes:
      - nombre: Windows
        detalle: 'En PowerShell, en la carpeta de la ISO. Reemplazá el nombre del archivo y pegá el valor de la línea correspondiente de `SHA256SUMS`; el resultado tiene que ser `True`:'
        comandos:
          - Get-FileHash .\ubuntu-26.04-live-server-amd64.iso -Algorithm SHA256
          - (Get-FileHash .\ubuntu-26.04-live-server-amd64.iso).Hash -eq "VALOR_DE_SHA256SUMS"
      - nombre: Linux
        detalle: '`--ignore-missing` evita errores por las imágenes de la lista que no descargaste:'
        comandos:
          - sha256sum -c SHA256SUMS --ignore-missing
      - nombre: macOS
        detalle: 'Compará el resultado con la línea de la ISO en `SHA256SUMS`:'
        comandos:
          - shasum -a 256 ubuntu-26.04-live-server-arm64.iso
    comprobar: El hash coincide (`True` en Windows, `OK` en Linux, el mismo valor en macOS).
    si_falla: Si no coincide, revisá que compares con la línea de la misma versión y arquitectura. Si sigue sin coincidir, borrá la ISO y descargala de nuevo.
  - titulo: Verificá la ISO de Rocky Linux o AlmaLinux
    detalle: >-
      En la misma página de descarga de Rocky (o de AlmaLinux) está el archivo `CHECKSUM` de cada
      versión. Su formato es distinto (`SHA256 (archivo.iso) = valor`), pero el valor se compara
      igual. En Linux, `sha256sum -c CHECKSUM --ignore-missing` entiende los dos formatos.
    comprobar: El hash de tu ISO coincide con el publicado.
  - titulo: Calculá el hash de la ISO de Windows Server
    detalle: >-
      Calculá el SHA-256 de la ISO de Windows Server 2025 con `Get-FileHash`. Si la página de
      descarga no muestra un hash para comparar, anotalo igual: te sirve para comprobar que una
      copia futura (por ejemplo, la que pases a un disco externo) es idéntica.
    comandos:
      - Get-FileHash .\WindowsServer2025.iso -Algorithm SHA256
    comprobar: El hash quedó anotado en tu cuaderno técnico.
  - titulo: Registrá los resultados
    detalle: 'En tu cuaderno técnico, anotá para cada imagen: nombre del archivo, fecha de descarga, hash SHA-256 y resultado de la verificación.'
    comprobar: Las tres imágenes tienen su hash y su resultado registrados.
