- { id: t1, frente: "Reglas de AND, OR, XOR y NOT", dorso: "AND: 1 si ambos son 1. OR: 1 si alguno es 1. XOR: 1 si son distintos. NOT: invierte." }
- { id: t2, frente: "¿Cómo se obtiene la red de una IP?", dorso: "IP AND máscara." }
- { id: t3, frente: "¿Cómo se obtiene el broadcast de una red?", dorso: "IP OR (NOT máscara)." }
- { id: t4, frente: "¿Cuándo dos IP están en la misma red?", dorso: "Cuando IP1 AND máscara = IP2 AND máscara." }
- { id: t5, frente: "Permisos de un archivo nuevo en Linux", dorso: "666 AND NOT umask. Con umask 022: 644. Con 002: 664." }
- { id: t6, frente: "¿Qué propiedad de XOR usa RAID 5?", dorso: "Si P = A XOR B, entonces A = P XOR B: con la paridad y un disco se reconstruye el otro." }
- { id: t7, frente: "Operadores de bits en bash", dorso: "& AND, | OR, ^ XOR, ~ NOT, dentro de $(( ))." }
