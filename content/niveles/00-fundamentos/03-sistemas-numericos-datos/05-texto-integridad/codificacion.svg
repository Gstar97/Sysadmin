<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui, sans-serif" font-size="13">
  <text x="20" y="22" font-weight="700" fill="currentColor">La palabra "año" en bytes</text>
  <g stroke="currentColor" stroke-width="1.3">
    <rect x="20" y="36" width="56" height="44" rx="6" fill="var(--surface-2, #eef2f5)"/>
    <rect x="82" y="36" width="56" height="44" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="144" y="36" width="56" height="44" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="206" y="36" width="56" height="44" rx="6" fill="var(--surface-2, #eef2f5)"/>
    <rect x="380" y="36" width="56" height="44" rx="6" fill="var(--surface-2, #eef2f5)"/>
    <rect x="442" y="36" width="56" height="44" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="504" y="36" width="56" height="44" rx="6" fill="var(--surface-2, #eef2f5)"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700">
    <text x="48" y="64">61</text><text x="110" y="64">C3</text><text x="172" y="64">B1</text><text x="234" y="64">6F</text>
    <text x="408" y="64">61</text><text x="470" y="64">F1</text><text x="532" y="64">6F</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="20" y="100">UTF-8: la ñ ocupa 2 bytes (C3 B1)</text>
    <text x="380" y="100">Latin-1 / Windows-1252: la ñ ocupa 1 byte (F1)</text>
  </g>
  <g stroke="currentColor" stroke-width="1.3">
    <rect x="20" y="130" width="300" height="120" rx="10" fill="var(--bad-soft, #fde2e2)"/>
    <rect x="360" y="130" width="300" height="120" rx="10" fill="var(--bad-soft, #fde2e2)"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="36" y="154" font-weight="700">Bytes UTF-8 leídos como Latin-1</text>
    <text x="36" y="176">cada byte se toma como una letra:</text>
    <text x="36" y="196">C3 = Ã y B1 = ±</text>
    <text x="36" y="232" font-size="22" font-weight="700" font-family="ui-monospace, monospace">aÃ±o</text>
    <text x="376" y="154" font-weight="700">Bytes Latin-1 leídos como UTF-8</text>
    <text x="376" y="176">F1 no es una secuencia UTF-8 válida:</text>
    <text x="376" y="196">se muestra el carácter de reemplazo</text>
    <text x="376" y="232" font-size="22" font-weight="700" font-family="ui-monospace, monospace">a�o</text>
  </g>
  <text x="20" y="285" font-size="12" fill="currentColor">El archivo no está "roto": los bytes son correctos, pero el programa los interpreta con otra codificación.</text>
</svg>
