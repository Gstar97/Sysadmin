- { id: t4, frente: "Fin de línea en Linux y en Windows", dorso: "Linux y macOS: LF (0A). Windows: CRLF (0D 0A)." }
- { id: t5, frente: "Cómo detectar y corregir CRLF en un script", dorso: "file script.sh o cat -A script.sh (muestra ^M$). Se corrige con dos2unix." }
- { id: t6, frente: "Verificar una descarga", dorso: "Linux: sha256sum -c SHA256SUMS. Windows: Get-FileHash archivo -Algorithm SHA256. macOS: shasum -a 256." }
- { id: t7, frente: "¿MD5 y SHA-1 son seguros?", dorso: "No: se pueden fabricar colisiones. Se usa SHA-256 o superior." }
- { id: t8, frente: "¿Base64 es cifrado?", dorso: "No: representa bytes como texto y se decodifica sin ninguna clave." }
