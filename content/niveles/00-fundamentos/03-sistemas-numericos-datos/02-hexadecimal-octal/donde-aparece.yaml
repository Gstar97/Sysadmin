tipo: emparejar
consigna: Une cada dato con lo que es. Todos están escritos en hexadecimal u octal.
pares:
  - { a: "52:54:00:4e:66:a1", b: "Dirección MAC de una placa de red" }
  - { a: "2001:db8:85a3::8a2e:370:7334", b: "Dirección IPv6" }
  - { a: "#0f766e", b: "Color en una página web (rojo, verde y azul)" }
  - { a: "chmod 750", b: "Permisos de Linux en octal" }
  - { a: "0x80070005", b: "Código de error de Windows (acceso denegado)" }
  - { a: "e3b0c44298fc1c149afbf4c8996fb924…", b: "Suma de verificación SHA-256 de un archivo" }
explicacion: >-
  El hexadecimal aparece cada vez que hay que mostrar bytes de forma compacta: direcciones,
  colores, códigos de error, sumas de verificación. El octal casi solo aparece en los permisos
  de Linux, porque cada grupo de permisos (rwx) son exactamente 3 bits.
