- id: p01
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Cuántos bits representa cada dígito hexadecimal?
  opciones:
    - { texto: "4", correcta: true, explicacion: "Con 4 bits hay 16 combinaciones, justo los 16 dígitos del 0 a la F." }
    - { texto: "8", explicacion: "8 bits (un byte) son dos dígitos hexadecimales." }
    - { texto: "3", explicacion: "3 bits es un dígito octal." }
    - { texto: "16", explicacion: "16 es la base, no la cantidad de bits." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Cuánto vale 0xFF en decimal?
  opciones:
    - { texto: "255", correcta: true, explicacion: "FF = 1111 1111 = 15 × 16 + 15 = 255." }
    - { texto: "1515", explicacion: "Se leyó cada F como 15 sin tener en cuenta la posición." }
    - { texto: "256", explicacion: "256 sería 0x100." }
    - { texto: "30", explicacion: "Se sumaron los dígitos (15 + 15) sin multiplicar por la posición." }
- id: p03
  tipo: opcion_multiple
  enunciado: ¿Cómo se escribe en hexadecimal el binario 1010 0111?
  opciones:
    - { texto: "A7", correcta: true, explicacion: "1010 = A (10) y 0111 = 7." }
    - { texto: "107", explicacion: "Se escribieron los valores decimales de cada grupo uno al lado del otro." }
    - { texto: "7A", explicacion: "Se invirtió el orden de los grupos." }
    - { texto: "167", explicacion: "167 es el valor en decimal, no en hexadecimal." }
- id: p04
  tipo: opcion_multiple
  enunciado: ¿Cómo se escribe 200 en hexadecimal?
  opciones:
    - { texto: "C8", correcta: true, explicacion: "200 = 1100 1000 = C8 (12 × 16 + 8 = 200)." }
    - { texto: "200", explicacion: "Ese es el valor en decimal." }
    - { texto: "8C", explicacion: "Se invirtieron los dígitos: 8C es 140." }
    - { texto: "CC", explicacion: "CC es 204." }
- id: p05
  tipo: opcion_multiple
  enunciado: En la red aparece una placa con MAC 08:00:27:3a:91:c4. ¿Qué es lo más probable?
  opciones:
    - { texto: "Una máquina virtual de VirtualBox", correcta: true, explicacion: "08:00:27 es el prefijo de fabricante (OUI) que usa VirtualBox para sus placas virtuales." }
    - { texto: "Un servidor con una placa de 27 Gbit/s", explicacion: "La MAC no dice nada de la velocidad." }
    - { texto: "Una dirección IPv6", explicacion: "Una IPv6 tiene 128 bits; una MAC tiene 48." }
    - { texto: "Un equipo sin fabricante", explicacion: "Los tres primeros bytes identifican justamente al fabricante." }
- id: p06
  tipo: respuesta_multiple
  diagnostico: true
  enunciado: ¿En cuáles de estos datos se usa normalmente el hexadecimal?
  opciones:
    - { texto: "Direcciones MAC", correcta: true, explicacion: "Por ejemplo 52:54:00:4e:66:a1." }
    - { texto: "Direcciones IPv6", correcta: true, explicacion: "Por ejemplo 2001:db8::1." }
    - { texto: "Sumas de verificación SHA-256", correcta: true, explicacion: "Se muestran como 64 dígitos hexadecimales." }
    - { texto: "Direcciones IPv4", explicacion: "IPv4 se escribe en decimal, con cuatro números de 0 a 255." }
- id: p07
  tipo: opcion_multiple
  enunciado: ¿Cuántos bits representa cada dígito octal?
  opciones:
    - { texto: "3", correcta: true, explicacion: "Con 3 bits hay 8 combinaciones: del 0 al 7." }
    - { texto: "8", explicacion: "8 es la base del octal, no la cantidad de bits." }
    - { texto: "4", explicacion: "4 bits es un dígito hexadecimal." }
    - { texto: "2", explicacion: "Con 2 bits solo hay 4 combinaciones." }
- id: p08
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Qué permisos deja `chmod 640 archivo`?
  opciones:
    - { texto: "rw-r-----", correcta: true, explicacion: "6 = rw- para el dueño, 4 = r-- para el grupo y 0 = --- para el resto." }
    - { texto: "rwxr-----", explicacion: "rwx sería 7 para el dueño." }
    - { texto: "r--rw----", explicacion: "Se leyeron los dígitos en otro orden." }
    - { texto: "rw-r--r--", explicacion: "Eso es 644: el resto tendría lectura." }
- id: p09
  tipo: opcion_multiple
  enunciado: Quieres que un script lo pueda leer, modificar y ejecutar su dueño, que el grupo lo pueda leer y ejecutar y que el resto no tenga acceso. ¿Qué número usas?
  opciones:
    - { texto: "750", correcta: true, explicacion: "rwx = 7, r-x = 5, --- = 0." }
    - { texto: "755", explicacion: "Le daría lectura y ejecución al resto." }
    - { texto: "570", explicacion: "Es el orden inverso entre dueño y grupo." }
    - { texto: "777", explicacion: "Daría todos los permisos a cualquier usuario." }
- id: p10
  tipo: completar_comando
  enunciado: En bash, escribe un comando que muestre el número 255 en hexadecimal.
  aceptadas: ['printf "%x\n" 255', 'printf "%X\n" 255', "printf '%x\\n' 255", "printf '%X\\n' 255", 'printf "%x" 255', 'printf "%X" 255']
  patrones: ['^printf\s+["'']%[xX](\\n)?["'']\s+255$']
  explicacion: "`printf \"%x\\n\" 255` muestra ff. `%X` lo muestra en mayúsculas y `%o`, en octal."
- id: p11
  tipo: interpretar_salida
  enunciado: Esta es la salida de `hexdump -C` de un archivo de texto. ¿Qué carácter es el byte 0a?
  salida: |
    00000000  48 6f 6c 61 0a                                    |Hola.|
  opciones:
    - { texto: "El salto de línea", correcta: true, explicacion: "0a (10 en decimal) es el carácter de nueva línea; hexdump lo muestra como un punto porque no es imprimible." }
    - { texto: "Un punto", explicacion: "hexdump usa el punto para mostrar los bytes que no son imprimibles; el punto real es 2e." }
    - { texto: "La letra a", explicacion: "La a minúscula es 61, el byte anterior." }
    - { texto: "Un espacio", explicacion: "El espacio es 20." }
- id: p12
  tipo: encontrar_error
  enunciado: Marca la línea con la conversión incorrecta.
  archivo: |
    0x0A = 10
    0x10 = 16
    0x80 = 128
    0xC0 = 160
    0xFF = 255
  lineas_con_error: [4]
  explicacion: 0xC0 = 12 × 16 = 192. 160 es 0xA0.
