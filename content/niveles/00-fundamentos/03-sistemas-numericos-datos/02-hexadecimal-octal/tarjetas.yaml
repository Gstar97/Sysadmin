- { id: t1, frente: "Dígitos hexadecimales del 10 al 15", dorso: "A = 10, B = 11, C = 12, D = 13, E = 14, F = 15." }
- { id: t2, frente: "¿Cuántos bits por dígito en hexadecimal y en octal?", dorso: "Hexadecimal: 4 bits. Octal: 3 bits." }
- { id: t3, frente: "¿Cómo se pasa de binario a hexadecimal?", dorso: "Agrupando los bits de a 4 desde la derecha y reemplazando cada grupo por su dígito." }
- { id: t4, frente: "0xC0, 0xA8, 0xFF", dorso: "192, 168, 255." }
- { id: t5, frente: "¿Qué indican los 3 primeros bytes de una MAC?", dorso: "El fabricante (OUI). 08:00:27 VirtualBox, 52:54:00 QEMU/KVM, 00:15:5d Hyper-V." }
- { id: t6, frente: "Valores de r, w y x en octal", dorso: "r = 4, w = 2, x = 1. rwx = 7, r-x = 5, rw- = 6, r-- = 4." }
- { id: t7, frente: "chmod 750 y chmod 644", dorso: "750 = rwxr-x---. 644 = rw-r--r--." }
