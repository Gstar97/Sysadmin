<text x="20" y="176" font-weight="700" fill="currentColor">Por eso un byte se escribe con dos dígitos hexadecimales</text>
<rect x="20" y="188" width="300" height="46" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.2"/>
<text x="170" y="217" text-anchor="middle" font-size="16" font-family="ui-monospace, monospace" fill="currentColor">1100 0000  =  C 0  =  0xC0  =  192</text>
<text x="20" y="262" font-weight="700" fill="currentColor">Una dirección MAC: 6 bytes, 12 dígitos hexadecimales</text>
<rect x="20" y="274" width="160" height="40" rx="6" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1.2"/>
<rect x="186" y="274" width="160" height="40" rx="6" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-width="1.2"/>
<text x="100" y="299" text-anchor="middle" font-size="16" font-family="ui-monospace, monospace" fill="currentColor">52:54:00</text>
<text x="266" y="299" text-anchor="middle" font-size="16" font-family="ui-monospace, monospace" fill="currentColor">4e:66:a1</text>
<text x="360" y="292" font-size="12" fill="currentColor">fabricante (OUI): 52:54:00 = QEMU/KVM</text>
<text x="360" y="308" font-size="12" fill="currentColor">el resto identifica a cada placa</text>
<text x="350" y="206" font-size="12" fill="currentColor">Se agrupan los bits de a 4 desde la derecha</text>
<text x="350" y="222" font-size="12" fill="currentColor">y cada grupo se reemplaza por su dígito.</text>
