id: n0
titulo: Fundamentos
descripcion: 'La base sobre la que se apoya todo lo demás: cómo funciona una computadora por dentro, qué
  hace un sistema operativo, cómo se representan los datos en binario y hexadecimal, y qué significa trabajar
  como sysadmin. Al final de este nivel queda armado el laboratorio personal (máquinas virtuales) que
  se usa durante toda la carrera.'
perfil_salida: Explicar cómo arranca y funciona una computadora, moverse con soltura entre decimal, binario
  y hexadecimal, entender el rol de un sysadmin y tener un laboratorio de máquinas virtuales funcionando.
insignia:
  nombre: Fundamentos
  color: '#0f766e'
proyecto_plan:
  titulo: Ficha técnica y laboratorio listo
  horas: 8
  entregables:
  - Inventario completo del equipo propio (hardware, firmware, sistema operativo).
  - Laboratorio con al menos una VM Linux y una VM Windows Server funcionando, con instantáneas.
  - Diagrama del laboratorio (red del hipervisor y direcciones).
  - Documento de una página sobre el rol de IT que interesa y por qué.
