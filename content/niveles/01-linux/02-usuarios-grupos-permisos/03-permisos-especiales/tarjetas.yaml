- { id: t1, frente: "Valores de los bits especiales", dorso: "SUID 4, SGID 2, sticky 1, como cuarto dígito adelante: 4755, 2770, 1777." }
- { id: t2, frente: "SUID", dorso: "El programa se ejecuta con los permisos de su dueño (ej.: passwd). Riesgo de seguridad: se audita." }
- { id: t3, frente: "SGID en una carpeta", dorso: "Lo que se crea adentro hereda el grupo de la carpeta. Base de las carpetas compartidas (2770)." }
- { id: t4, frente: "Sticky bit", dorso: "En una carpeta, cada uno solo puede borrar lo suyo (como /tmp, 1777)." }
- { id: t5, frente: "Buscar programas con SUID", dorso: "sudo find / -perm -4000 -type f 2>/dev/null" }
- { id: t6, frente: "s, t, S y T en ls -l", dorso: "s/t: bit especial con x. S/T mayúscula: bit especial sin x (casi siempre un error)." }
