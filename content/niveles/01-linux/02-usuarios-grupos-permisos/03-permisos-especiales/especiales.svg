<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif" font-size="12">
  <g stroke="currentColor" stroke-width="1.3">
    <rect x="16" y="20" width="220" height="260" rx="12" fill="var(--bad-soft, #fde2e2)"/>
    <rect x="250" y="20" width="220" height="260" rx="12" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="484" y="20" width="220" height="260" rx="12" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="126" y="48" font-weight="700" font-size="15">SUID · 4</text>
    <text x="360" y="48" font-weight="700" font-size="15">SGID · 2</text>
    <text x="594" y="48" font-weight="700" font-size="15">Sticky · 1</text>
    <text x="126" y="70" font-size="11">en programas</text>
    <text x="360" y="70" font-size="11">sobre todo en carpetas</text>
    <text x="594" y="70" font-size="11">en carpetas</text>
    <text x="126" y="110" font-family="ui-monospace, monospace" font-size="14" font-weight="700">-rwsr-xr-x</text>
    <text x="360" y="110" font-family="ui-monospace, monospace" font-size="14" font-weight="700">drwxrws---</text>
    <text x="594" y="110" font-family="ui-monospace, monospace" font-size="14" font-weight="700">drwxrwxrwt</text>
    <text x="126" y="132" font-size="11">/usr/bin/passwd</text>
    <text x="360" y="132" font-size="11">/srv/contabilidad</text>
    <text x="594" y="132" font-size="11">/tmp</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="30" y="170">El programa se ejecuta con los</text>
    <text x="30" y="187">permisos de su dueño (root), no</text>
    <text x="30" y="204">con los de quien lo usa.</text>
    <text x="30" y="236">Así passwd puede escribir en</text>
    <text x="30" y="253">/etc/shadow por ti.</text>
    <text x="264" y="170">Todo lo que se crea adentro</text>
    <text x="264" y="187">hereda el grupo de la carpeta,</text>
    <text x="264" y="204">no el grupo principal de quien</text>
    <text x="264" y="221">lo crea.</text>
    <text x="264" y="253">La base de una carpeta compartida.</text>
    <text x="498" y="170">Cualquiera puede crear archivos,</text>
    <text x="498" y="187">pero cada uno solo puede borrar</text>
    <text x="498" y="204">o renombrar los suyos.</text>
    <text x="498" y="236">Evita que en una carpeta común</text>
    <text x="498" y="253">alguien borre lo de los demás.</text>
  </g>
</svg>
