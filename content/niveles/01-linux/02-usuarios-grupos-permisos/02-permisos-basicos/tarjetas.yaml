- { id: t1, frente: "Orden en que Linux aplica los permisos", dorso: "Si sos el dueño, los del dueño; si no, si estás en el grupo, los del grupo; si no, los del resto." }
- { id: t2, frente: "r, w, x en una carpeta", dorso: "r ver la lista; w crear, borrar y renombrar adentro; x entrar." }
- { id: t3, frente: "644, 600, 755, 750, 770", dorso: "Archivo público; privado; programa o carpeta pública; del dueño y su grupo; compartida por un grupo." }
- { id: t4, frente: "chmod simbólico", dorso: "u/g/o/a, + - =, r w x. Ej.: chmod u+x, chmod g-w, chmod o=" }
- { id: t5, frente: "chown y chgrp", dorso: "sudo chown usuario:grupo archivo; sudo chgrp grupo archivo; -R para carpetas." }
- { id: t6, frente: "umask 002 y 022", dorso: "002: archivos 664, carpetas 775. 022: archivos 644, carpetas 755." }
- { id: t7, frente: "¿Qué hace falta para borrar un archivo?", dorso: "w y x en la carpeta que lo contiene (no en el archivo)." }
