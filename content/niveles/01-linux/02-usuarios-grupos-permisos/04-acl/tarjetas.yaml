- { id: t1, frente: "¿Para qué sirve una ACL?", dorso: "Para dar permisos a usuarios o grupos extra sin cambiar el dueño ni el grupo del archivo." }
- { id: t2, frente: "setfacl -m, -x, -b, -k, -d, -R", dorso: "Agregar o cambiar; quitar una entrada; quitar todas; quitar la por defecto; trabajar con la por defecto; recursivo." }
- { id: t3, frente: "El + en ls -l", dorso: "El archivo tiene ACL: hay que mirar getfacl." }
- { id: t4, frente: "Máscara de ACL", dorso: "Techo para las entradas con nombre y el grupo dueño. chmod sobre el grupo la cambia. getfacl muestra #effective." }
- { id: t5, frente: "ACL por defecto", dorso: "Modelo que heredan los archivos nuevos de una carpeta: setfacl -d -m g:grupo:rx carpeta." }
- { id: t6, frente: "¿ACL o grupo?", dorso: "Para un área entera y permanente, grupo y permisos básicos. Para un segundo grupo, una persona o algo temporal, ACL." }
