- { id: t1, frente: "su, su -, sudo, sudo -i", dorso: "Shell de root con tu entorno; sesión completa de root (contraseña de root); un comando como root; sesión de root (tu contraseña)." }
- { id: t2, frente: "Partes de una regla de sudo", dorso: "quién EQUIPOS=(como_quién) [ETIQUETA:] comandos. Ej.: %soporte ALL=(root) /usr/bin/systemctl restart nginx" }
- { id: t3, frente: "Reglas de oro de sudoers", dorso: "Rutas completas; nada de editores, shells ni less; NOPASSWD solo para tareas puntuales." }
- { id: t4, frente: "visudo -f /etc/sudoers.d/nombre", dorso: "Edita un archivo propio y valida la sintaxis al guardar. Sin puntos en el nombre, root, 440." }
- { id: t5, frente: "sudo -l -U usuario", dorso: "Muestra qué puede hacer ese usuario con sudo." }
- { id: t6, frente: "¿Dónde se registra sudo?", dorso: "Rocky: /var/log/secure. Ubuntu: /var/log/auth.log. Ambos: journalctl _COMM=sudo." }
- { id: t7, frente: "sudo-rs", dorso: "El sudo de Ubuntu 26.04: mismos archivos y reglas; la versión clásica queda como sudo.ws." }
