  <text x="24" y="24" font-weight="700" font-size="13" fill="currentColor">Una regla de /etc/sudoers.d/soporte</text>
  <text x="24" y="190" fill="currentColor">Se lee: "los del grupo soporte, en cualquier equipo, pueden ejecutar como root, sin volver a escribir su contraseña,</text>
  <text x="24" y="212" fill="currentColor">exactamente systemctl restart nginx". Cualquier otro comando con sudo se rechaza y queda registrado.</text>
  <text x="24" y="234" fill="currentColor">% marca un grupo (sin %, es un usuario). (ALL) en lugar de (root) permitiría ejecutar como cualquier usuario.</text>
  <text x="24" y="256" fill="currentColor">NOPASSWD es cómodo para tareas automáticas, pero nunca con ALL: dejaría todo el servidor sin pedir contraseña.</text>
