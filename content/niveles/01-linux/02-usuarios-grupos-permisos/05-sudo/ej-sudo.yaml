tipo: terminal
shell: bash
titulo: Delegar el reinicio del servidor web
descripcion: >-
  Laura entra al equipo de soporte. Tiene que poder reiniciar nginx sin pedírtelo cada vez, pero
  nada más. Prepará la regla, validala antes de instalarla y comprobá que funciona y que el resto
  sigue cerrado.
estado_inicial:
  distro: rocky
  hostname: web01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
    - { nombre: laura }
  servicios:
    nginx: { activo: true, habilitado: true, descripcion: "The nginx HTTP and reverse proxy server", puertos: [80] }
pasos:
  - consigna: Creá el grupo `soporte` y agregá a laura.
    verificar:
      - { grupo: soporte, miembros: [laura] }
    pistas:
      - "`sudo groupadd soporte` y `sudo usermod -aG soporte laura`"
    solucion: [sudo groupadd soporte, sudo usermod -aG soporte laura]
    explicacion: La regla va a ser para el grupo, así que cuando entre otra persona a soporte, alcanza con agregarla.
  - consigna: >-
      Escribí la regla en un archivo temporal, `/tmp/soporte`:
      `%soporte ALL=(root) /usr/bin/systemctl restart nginx, /usr/bin/systemctl status nginx`
    verificar:
      - { archivo: /tmp/soporte, contenido_incluye: "%soporte ALL=(root) /usr/bin/systemctl restart nginx" }
    pistas:
      - "Con comillas simples para que el shell no interprete nada: `echo '...' > /tmp/soporte`"
    solucion: ["echo '%soporte ALL=(root) /usr/bin/systemctl restart nginx, /usr/bin/systemctl status nginx' > /tmp/soporte"]
    explicacion: Trabajar sobre una copia permite validarla antes de que sudo la lea. Un error en un archivo de sudoers.d puede dejar sudo sin funcionar para todos.
  - consigna: Validá el archivo con `visudo` antes de instalarlo.
    verificar:
      - { comando_usado: 'visudo\s+(-c\s+-f|-cf|-f\s+\S+\s+-c)\s*/tmp/soporte|visudo\s+-c\s+-f\s+/tmp/soporte' }
      - { salida_contiene: parsed OK }
    pistas:
      - "-c solo revisa, -f indica el archivo"
      - "`sudo visudo -c -f /tmp/soporte`"
    solucion: [sudo visudo -c -f /tmp/soporte]
    explicacion: En el día a día se edita directamente con `sudo visudo -f /etc/sudoers.d/soporte`, que valida al guardar y no te deja salir con errores.
  - consigna: Instalalo en `/etc/sudoers.d/soporte` con permisos 440.
    verificar:
      - { archivo: /etc/sudoers.d/soporte, modo: "0440", dueno: root }
    pistas:
      - "`sudo cp /tmp/soporte /etc/sudoers.d/soporte` y `sudo chmod 440 /etc/sudoers.d/soporte`"
    solucion: [sudo cp /tmp/soporte /etc/sudoers.d/soporte, sudo chmod 440 /etc/sudoers.d/soporte]
    explicacion: El nombre no puede tener puntos (sudo ignora `soporte.conf` o `soporte.bak`) y el archivo tiene que ser de root y no tener permiso de escritura para nadie más.
  - consigna: Revisá qué puede hacer laura con sudo, sin convertirte en ella.
    verificar:
      - { comando_usado: 'sudo\s+-l\s+-U\s+laura' }
      - { salida_contiene: /usr/bin/systemctl restart nginx }
    pistas:
      - "`sudo -l -U laura`"
    solucion: [sudo -l -U laura]
    explicacion: Es la forma de auditar los permisos de sudo de cualquier cuenta.
  - consigna: Abrí una sesión como laura con `sudo su - laura` y reiniciá nginx con sudo.
    verificar:
      - { usuario_actual: laura }
      - { comando_usado: 'sudo\s+systemctl\s+restart\s+nginx' }
      - { servicio: nginx, activo: true }
    pistas:
      - "`sudo su - laura` y después `sudo systemctl restart nginx`"
    solucion: [sudo su - laura, sudo systemctl restart nginx]
    explicacion: Funcionó porque el comando coincide exactamente con la regla.
  - consigna: Todavía como laura, intenta leer /etc/shadow con sudo.
    verificar:
      - { comando_usado: 'sudo\s+cat\s+/etc/shadow' }
      - { salida_contiene: not allowed }
    pistas:
      - "`sudo cat /etc/shadow`"
    solucion: [sudo cat /etc/shadow]
    explicacion: Rechazado. La regla da exactamente lo necesario y nada más.
  - consigna: Volvé a tu usuario con `exit` y buscá en el registro de seguridad el intento rechazado de laura.
    verificar:
      - { usuario_actual: ana }
      - { salida_contiene: command not allowed }
    pistas:
      - "`exit` y después `sudo grep laura /var/log/secure`"
    solucion: [exit, sudo grep laura /var/log/secure]
    explicacion: Cada uso de sudo (permitido o no) queda registrado con el usuario, la carpeta y el comando. En Ubuntu está en `/var/log/auth.log`; en ambos, también en `journalctl`.
