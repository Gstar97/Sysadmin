- { id: t1, frente: "/etc/passwd, /etc/shadow, /etc/group", dorso: "Cuentas (7 campos); contraseñas cifradas y vencimiento (solo root); grupos y miembros." }
- { id: t2, frente: "Rangos de UID", dorso: "0 root; 1 a 999 sistema y servicios; 1000+ personas." }
- { id: t3, frente: "Crear un usuario completo", dorso: "sudo useradd -m -c \"Nombre\" -s /bin/bash usuario, y después sudo passwd usuario." }
- { id: t4, frente: "usermod -aG", dorso: "Agrega a un grupo secundario sin sacar de los otros. Sin -a, reemplaza la lista." }
- { id: t5, frente: "usermod -L / -U", dorso: "Bloquea / desbloquea la contraseña (agrega o quita un ! en /etc/shadow)." }
- { id: t6, frente: "userdel -r", dorso: "Borra la cuenta y su carpeta personal." }
- { id: t7, frente: "chage -l, -M, -d 0, -E", dorso: "Ver; vencimiento en días; obligar a cambiarla; fecha de vencimiento de la cuenta." }
- { id: t8, frente: "Grupo nuevo y sesión abierta", dorso: "Los grupos se cargan al iniciar sesión: hay que salir y volver a entrar." }
