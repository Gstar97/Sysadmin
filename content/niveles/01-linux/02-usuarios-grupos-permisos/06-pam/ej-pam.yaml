tipo: terminal
shell: bash
titulo: Política de contraseñas y bloqueo por intentos
descripcion: >-
  La auditoría pide dos controles en el servidor: contraseñas de al menos 12 caracteres con tres
  tipos distintos de caracteres, y bloqueo de la cuenta durante 15 minutos después de 5 intentos
  fallidos. Además, hay una usuaria que quedó bloqueada esta mañana.
estado_inicial:
  distro: rocky
  hostname: rocky01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
    - { nombre: laura }
  faillock:
    laura: 5
pasos:
  - consigna: Mirá qué perfil y qué funciones de authselect están activos.
    verificar:
      - { comando_usado: 'authselect\s+current' }
      - { salida_contiene: "Profile ID" }
    pistas:
      - "`sudo authselect current`"
    solucion: [sudo authselect current]
    explicacion: En la familia Red Hat, authselect genera los archivos de PAM. No se editan a mano, porque authselect los vuelve a escribir.
  - consigna: Activá el bloqueo por intentos fallidos (la función with-faillock).
    verificar:
      - { archivo: /etc/authselect/system-auth, contenido_incluye: pam_faillock.so }
    pistas:
      - "`sudo authselect enable-feature with-faillock`"
    solucion: [sudo authselect enable-feature with-faillock]
    explicacion: authselect agregó las líneas de pam_faillock en system-auth y password-auth. Podés verlas con `grep faillock /etc/pam.d/system-auth`.
  - consigna: >-
      Configurá el bloqueo: 5 intentos (`deny = 5`) y 15 minutos de bloqueo (`unlock_time = 900`)
      en `/etc/security/faillock.conf`. Las líneas vienen comentadas; podés descomentarlas con sed.
    verificar:
      - { archivo: /etc/security/faillock.conf, contenido_incluye: "\ndeny = 5" }
      - { archivo: /etc/security/faillock.conf, contenido_incluye: "\nunlock_time = 900" }
    pistas:
      - "`sudo sed -i 's/^# deny = 3/deny = 5/' /etc/security/faillock.conf`"
      - "`sudo sed -i 's/^# unlock_time = 600/unlock_time = 900/' /etc/security/faillock.conf`"
    solucion: ["sudo sed -i 's/^# deny = 3/deny = 5/' /etc/security/faillock.conf", "sudo sed -i 's/^# unlock_time = 600/unlock_time = 900/' /etc/security/faillock.conf"]
    explicacion: También podías abrirlo con `sudo vi` y editar las dos líneas. sed -i es útil cuando hay que repetir el mismo cambio en muchos servidores.
  - consigna: >-
      Creá la política de contraseñas en un archivo propio:
      `/etc/security/pwquality.conf.d/10-empresa.conf` con `minlen = 12` y `minclass = 3`.
    verificar:
      - { archivo: /etc/security/pwquality.conf.d/10-empresa.conf, contenido_incluye: "minlen = 12" }
      - { archivo: /etc/security/pwquality.conf.d/10-empresa.conf, contenido_incluye: "minclass = 3" }
    pistas:
      - "printf escribe varias líneas y sudo tee las guarda en el archivo protegido"
      - "`printf 'minlen = 12\\nminclass = 3\\n' | sudo tee /etc/security/pwquality.conf.d/10-empresa.conf`"
    solucion: ["printf 'minlen = 12\\nminclass = 3\\n' | sudo tee /etc/security/pwquality.conf.d/10-empresa.conf"]
    explicacion: >-
      Un archivo propio en la carpeta .d no se pisa con las actualizaciones del paquete y deja
      claro qué cambió la empresa. minclass = 3 exige tres tipos entre minúsculas, mayúsculas,
      números y símbolos.
  - consigna: Laura dice que no puede entrar. Revisá sus intentos fallidos con faillock.
    verificar:
      - { comando_usado: 'faillock\s+--user\s+laura' }
      - { salida_contiene: RHOST }
    pistas:
      - "`sudo faillock --user laura`"
    solucion: [sudo faillock --user laura]
    explicacion: Cinco intentos fallidos desde distintas IP en poco tiempo. Antes de desbloquear, conviene confirmar con laura que fue ella (y no alguien probando contraseñas).
  - consigna: Laura confirma que fue ella. Desbloqueala.
    verificar:
      - { comando_usado: 'faillock\s+--user\s+laura\s+--reset|faillock\s+--reset\s+--user\s+laura' }
    pistas:
      - "`sudo faillock --user laura --reset`"
    solucion: [sudo faillock --user laura --reset]
    explicacion: El contador vuelve a cero. Si el bloqueo se repite sin que ella haya fallado, es una señal de que alguien está intentando adivinar su contraseña.
