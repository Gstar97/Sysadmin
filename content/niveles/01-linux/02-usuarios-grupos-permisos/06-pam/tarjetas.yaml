- { id: t1, frente: "PAM", dorso: "Sistema de módulos que decide la autenticación de sshd, sudo, login y passwd. Configuración en /etc/pam.d/." }
- { id: t2, frente: "Tipos de PAM", dorso: "auth (¿quién eres?), account (¿puedes entrar?), password (¿la clave nueva sirve?), session (preparar la sesión)." }
- { id: t3, frente: "required, requisite, sufficient", dorso: "Tiene que aprobar y se sigue; tiene que aprobar y corta si falla; si aprueba, alcanza." }
- { id: t4, frente: "authselect (Rocky)", dorso: "Genera los archivos de PAM. authselect current; authselect enable-feature with-faillock." }
- { id: t5, frente: "pwquality", dorso: "minlen, minclass, dictcheck, enforce_for_root. En /etc/security/pwquality.conf o pwquality.conf.d/." }
- { id: t6, frente: "faillock", dorso: "deny, unlock_time, fail_interval en /etc/security/faillock.conf. faillock --user x [--reset]." }
- { id: t7, frente: "Antes de tocar PAM", dorso: "Dejar una sesión de root abierta y probar desde otra terminal." }
