<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.3">
    <rect x="16" y="40" width="150" height="70" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="16" y="130" width="150" height="70" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="16" y="220" width="150" height="70" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="230" y="110" width="150" height="110" rx="10" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="440" y="24" width="264" height="70" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="440" y="104" width="264" height="70" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="440" y="184" width="264" height="70" rx="10" fill="var(--bad-soft, #fde2e2)"/>
    <rect x="440" y="264" width="264" height="70" rx="10" fill="var(--surface-2, #eef2f5)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#f)">
    <line x1="166" y1="75" x2="228" y2="140"/>
    <line x1="166" y1="165" x2="228" y2="165"/>
    <line x1="166" y1="255" x2="228" y2="190"/>
    <line x1="380" y1="140" x2="438" y2="60"/>
    <line x1="380" y1="155" x2="438" y2="139"/>
    <line x1="380" y1="175" x2="438" y2="219"/>
    <line x1="380" y1="195" x2="438" y2="299"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="91" y="26" font-weight="700" font-size="13">Programas</text>
    <text x="91" y="70" font-weight="700">sshd</text>
    <text x="91" y="88" font-size="11">entrar por SSH</text>
    <text x="91" y="160" font-weight="700">sudo</text>
    <text x="91" y="178" font-size="11">confirmar tu contraseña</text>
    <text x="91" y="250" font-weight="700">passwd</text>
    <text x="91" y="268" font-size="11">cambiar la contraseña</text>
    <text x="305" y="150" font-weight="700" font-size="14">PAM</text>
    <text x="305" y="170" font-size="11">/etc/pam.d/sshd</text>
    <text x="305" y="186" font-size="11">/etc/pam.d/sudo ...</text>
    <text x="572" y="16" font-weight="700" font-size="13">Cuatro preguntas, en orden</text>
    <text x="572" y="52" font-weight="700">auth: ¿sos quien decís ser?</text>
    <text x="572" y="72" font-size="11">pam_unix (contraseña), pam_faillock (intentos)</text>
    <text x="572" y="132" font-weight="700">account: ¿podés entrar ahora?</text>
    <text x="572" y="152" font-size="11">cuenta vencida, bloqueada, horarios</text>
    <text x="572" y="212" font-weight="700">password: ¿la clave nueva es aceptable?</text>
    <text x="572" y="232" font-size="11">pam_pwquality (largo, tipos de caracteres)</text>
    <text x="572" y="292" font-weight="700">session: preparar la sesión</text>
    <text x="572" y="312" font-size="11">límites, registro, mensaje de bienvenida</text>
  </g>
</svg>
