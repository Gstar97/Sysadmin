- { id: t1, frente: "stdin, stdout, stderr", dorso: "0 entrada (teclado), 1 salida (pantalla), 2 errores (pantalla)." }
- { id: t2, frente: "> y >>", dorso: "> reemplaza el archivo; >> agrega al final." }
- { id: t3, frente: "2>, &>, 2>&1", dorso: "Errores a un archivo; salida y errores juntos; errores a donde va la salida." }
- { id: t4, frente: "/dev/null", dorso: "Descarta todo lo que recibe. 2>/dev/null oculta los errores." }
- { id: t5, frente: "| y tee", dorso: "| pasa la salida al siguiente comando; tee además guarda una copia en un archivo." }
- { id: t6, frente: "Receta para contar repeticiones", dorso: "... | sort | uniq -c | sort -rn | head" }
- { id: t7, frente: "cut -d: -f1 /etc/passwd", dorso: "Muestra la columna 1 (el nombre de usuario) usando : como separador." }
- { id: t8, frente: "Escribir en un archivo protegido con sudo", dorso: "echo texto | sudo tee archivo (o sudo tee -a para agregar)." }
