tipo: emparejar
consigna: Une cada operador con lo que hace.
pares:
  - { a: "comando > archivo", b: "Guarda la salida en el archivo, reemplazando lo que tenía" }
  - { a: "comando >> archivo", b: "Agrega la salida al final del archivo" }
  - { a: "comando 2> archivo", b: "Guarda solo los mensajes de error" }
  - { a: "comando &> archivo", b: "Guarda la salida y los errores juntos" }
  - { a: "comando < archivo", b: "Usa el archivo como entrada del comando" }
  - { a: "comando1 | comando2", b: "Pasa la salida del primero como entrada del segundo" }
  - { a: "comando 2> /dev/null", b: "Descarta los mensajes de error" }
explicacion: >-
  El número indica el canal: 1 es la salida normal (se puede omitir, > es lo mismo que 1>) y 2
  son los errores. /dev/null es un "agujero negro": todo lo que se manda ahí desaparece.
