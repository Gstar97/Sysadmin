<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="24" font-weight="700" font-size="13" fill="currentColor">Los tres canales de todo comando</text>
  <g stroke="currentColor" stroke-width="1.3">
    <rect x="20" y="70" width="150" height="56" rx="9" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="285" y="60" width="150" height="76" rx="10" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="550" y="40" width="150" height="50" rx="9" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="550" y="110" width="150" height="50" rx="9" fill="var(--bad-soft, #fde2e2)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#f)">
    <line x1="170" y1="98" x2="283" y2="98"/>
    <path d="M435,85 L500,85 L500,65 L548,65"/>
    <path d="M435,112 L500,112 L500,135 L548,135"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="95" y="93" font-weight="700">teclado</text>
    <text x="95" y="111" font-size="11">o un archivo con &lt;</text>
    <text x="360" y="94" font-weight="700" font-size="14">comando</text>
    <text x="360" y="114" font-size="11">por ejemplo, sort</text>
    <text x="625" y="62" font-weight="700">pantalla</text>
    <text x="625" y="79" font-size="11">o un archivo con &gt; y &gt;&gt;</text>
    <text x="625" y="132" font-weight="700">pantalla</text>
    <text x="625" y="149" font-size="11">o un archivo con 2&gt;</text>
    <text x="226" y="90" font-size="11" font-weight="600">0 · stdin</text>
    <text x="500" y="52" font-size="11" font-weight="600">1 · stdout (resultados)</text>
    <text x="500" y="176" font-size="11" font-weight="600">2 · stderr (errores)</text>
  </g>
  <text x="20" y="232" font-weight="700" font-size="13" fill="currentColor">Una tubería: la salida de cada comando es la entrada del siguiente</text>
  <g stroke="currentColor" stroke-width="1.3" fill="var(--warn-soft, #fbf0d0)">
    <rect x="20" y="255" width="150" height="46" rx="9"/>
    <rect x="205" y="255" width="150" height="46" rx="9"/>
    <rect x="390" y="255" width="120" height="46" rx="9"/>
    <rect x="545" y="255" width="155" height="46" rx="9"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#f)">
    <line x1="170" y1="278" x2="203" y2="278"/>
    <line x1="355" y1="278" x2="388" y2="278"/>
    <line x1="510" y1="278" x2="543" y2="278"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700">
    <text x="95" y="283">cat access.log</text>
    <text x="280" y="283">cut -d' ' -f1</text>
    <text x="450" y="283">sort</text>
    <text x="622" y="283">uniq -c</text>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="11">
    <text x="95" y="322">todas las líneas</text>
    <text x="280" y="322">solo la IP de cada línea</text>
    <text x="450" y="322">IP iguales juntas</text>
    <text x="622" y="322">cuántas veces aparece cada IP</text>
    <text x="186" y="270" font-weight="700" font-size="13">|</text>
    <text x="371" y="270" font-weight="700" font-size="13">|</text>
    <text x="527" y="270" font-weight="700" font-size="13">|</text>
  </g>
  <text x="20" y="370" font-size="12" fill="currentColor">Los errores (stderr) no pasan por la tubería: siguen saliendo en la pantalla, salvo que los redirijas con 2&gt;&amp;1.</text>
</svg>
