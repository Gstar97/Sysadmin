<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="250" y="110" width="220" height="90" rx="14" fill="var(--accent-soft, #d5f0ec)"/>
    <rect x="20" y="110" width="170" height="90" rx="14" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="530" y="110" width="170" height="90" rx="14" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#f)">
    <path d="M250,135 Q220,110 192,135"/>
    <path d="M192,175 Q220,200 250,175"/>
    <path d="M470,135 Q500,110 528,135"/>
    <path d="M528,175 Q500,200 470,175"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="360" y="145" font-weight="700" font-size="15">Modo normal</text>
    <text x="360" y="165" font-size="11">moverse, borrar, copiar, pegar</text>
    <text x="360" y="182" font-size="11">aquí arranca vim</text>
    <text x="105" y="145" font-weight="700" font-size="15">Modo inserción</text>
    <text x="105" y="165" font-size="11">escribir texto</text>
    <text x="105" y="182" font-size="11">abajo dice -- INSERT --</text>
    <text x="615" y="145" font-weight="700" font-size="15">Línea de comandos</text>
    <text x="615" y="165" font-size="11">guardar, salir, reemplazar</text>
    <text x="615" y="182" font-size="11">abajo se ve :</text>
    <text x="221" y="100" font-size="11" font-weight="600">i  a  o  A</text>
    <text x="221" y="222" font-size="11" font-weight="600">Esc</text>
    <text x="499" y="100" font-size="11" font-weight="600">:  o  /</text>
    <text x="499" y="222" font-size="11" font-weight="600">Enter o Esc</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="20" y="265" font-weight="700">Si no sabes en qué modo estás: aprieta Esc (una o dos veces). Siempre vuelve al modo normal.</text>
    <text x="20" y="290">Para salir: Esc, después :wq y Enter (guardar y salir) o :q! y Enter (salir sin guardar).</text>
  </g>
</svg>
