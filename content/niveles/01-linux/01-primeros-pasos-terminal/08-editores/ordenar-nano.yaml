tipo: ordenar
consigna: Ordená los pasos para cambiar el nombre del servidor en /etc/hostname con nano.
pasos:
  - Hacer una copia con sudo cp -a /etc/hostname /etc/hostname.bak
  - Abrir el archivo con sudo nano /etc/hostname
  - Cambiar el texto con el teclado y las flechas
  - Guardar con Ctrl+O y confirmar el nombre con Enter
  - Salir con Ctrl+X
  - Comprobar el resultado con cat /etc/hostname
explicacion: >-
  La copia antes de editar y la comprobación después de guardar son las que convierten un cambio
  rápido en un cambio seguro. En nano, el ^ de la barra inferior significa la tecla Ctrl.
