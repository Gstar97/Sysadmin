  <text x="30" y="30" font-weight="700" font-size="13" fill="currentColor">find DÓNDE CONDICIONES ACCIÓN</text>
  <text x="30" y="208" font-size="12" fill="currentColor">Las condiciones se cumplen todas a la vez: .log, más de 10 MiB y modificados en los últimos 7 días.</text>
  <text x="30" y="232" font-size="12" fill="currentColor">Sin acción, find solo muestra las rutas; -ls muestra los detalles, -delete borra y -exec ejecuta un comando.</text>
  <text x="30" y="256" font-size="12" fill="currentColor">Las comillas en '*.log' son necesarias: sin ellas, el shell expandiría el comodín antes de que find lo vea.</text>
