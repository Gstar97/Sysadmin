tipo: terminal
shell: bash
titulo: El archivo de configuración perdido
descripcion: >-
  Te piden revisar la aplicación de facturación, pero nadie recuerda dónde se instaló ni dónde
  guarda su configuración. Encontrala, mira qué hay en sus logs y averigua qué archivos de la
  carpeta compartida son de Carlos.
estado_inicial:
  distro: rocky
  hostname: srv-fact01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
    - { nombre: carlos }
  archivos:
    /opt/facturacion/etc/facturacion.ini: "[db]\nhost=10.0.0.5\nport=5432\nusuario=facturas\n\n[app]\nmoneda=USD\nlog=/var/log/facturacion/app.log\n"
    /opt/facturacion/bin/facturar: { contenido: "#!/bin/bash\n# Genera las facturas del día\n/opt/facturacion/bin/motor --config /opt/facturacion/etc/facturacion.ini\n", modo: "0755" }
    /var/log/facturacion/app.log: "2026-10-30 09:00:00 INFO factura 1000 generada para cliente 200\n2026-10-30 09:01:07 INFO factura 1001 generada para cliente 201\n2026-10-30 09:02:14 INFO factura 1002 generada para cliente 202\n2026-10-30 09:03:21 INFO factura 1003 generada para cliente 203\n2026-10-30 09:04:28 INFO factura 1004 generada para cliente 204\n2026-10-30 09:05:35 INFO factura 1005 generada para cliente 205\n2026-10-30 09:06:42 INFO factura 1006 generada para cliente 206\n2026-10-30 09:07:49 INFO factura 1007 generada para cliente 207\n2026-10-30 09:08:56 INFO factura 1008 generada para cliente 208\n2026-10-30 09:09:03 INFO factura 1009 generada para cliente 209\n2026-10-30 09:10:10 INFO factura 1010 generada para cliente 210\n2026-10-30 09:11:17 INFO factura 1011 generada para cliente 211\n2026-10-30 09:12:24 INFO factura 1012 generada para cliente 212\n2026-10-30 09:13:31 INFO factura 1013 generada para cliente 213\n2026-10-30 09:14:38 INFO factura 1014 generada para cliente 214\n2026-10-30 09:15:45 INFO factura 1015 generada para cliente 215\n2026-10-30 09:16:52 INFO factura 1016 generada para cliente 216\n2026-10-30 09:17:59 INFO factura 1017 generada para cliente 200\n2026-10-30 09:18:06 INFO factura 1018 generada para cliente 201\n2026-10-30 09:19:13 INFO factura 1019 generada para cliente 202\n2026-10-30 09:20:20 INFO factura 1020 generada para cliente 203\n2026-10-30 09:21:27 INFO factura 1021 generada para cliente 204\n2026-10-30 09:22:34 INFO factura 1022 generada para cliente 205\n2026-10-30 09:23:41 INFO factura 1023 generada para cliente 206\n2026-10-30 09:24:48 INFO factura 1024 generada para cliente 207\n2026-10-30 09:25:55 INFO factura 1025 generada para cliente 208\n2026-10-30 09:26:02 INFO factura 1026 generada para cliente 209\n2026-10-30 09:27:09 INFO factura 1027 generada para cliente 210\n2026-10-30 09:28:16 INFO factura 1028 generada para cliente 211\n2026-10-30 09:29:23 INFO factura 1029 generada para cliente 212\n2026-10-30 09:3