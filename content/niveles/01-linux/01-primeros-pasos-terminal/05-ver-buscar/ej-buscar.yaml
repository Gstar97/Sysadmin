    /var/log/facturacion/app.log.1: "2026-10-29 23:59:59 INFO cierre del día\n"
    /var/log/facturacion/error.log: "2026-10-30 08:58:02 ERROR no se pudo conectar a 10.0.0.5:5432\n2026-10-30 09:12:44 WARN reintento 1 de 3\n2026-10-30 09:12:49 WARN reintento 2 de 3\n2026-10-30 09:12:54 ERROR la base de datos no responde\n2026-10-30 09:13:00 INFO conexión restablecida\n"
