tipo: emparejar
consigna: Une cada tecla con lo que hace dentro de less.
pares:
  - { a: "Espacio", b: "Avanza una pantalla" }
  - { a: "b", b: "Retrocede una pantalla" }
  - { a: "/error", b: "Busca la palabra error hacia adelante" }
  - { a: "n", b: "Salta a la siguiente coincidencia de la búsqueda" }
  - { a: "G", b: "Va al final del archivo" }
  - { a: "q", b: "Sale de less" }
explicacion: >-
  Son las mismas teclas que usa man, porque man muestra los manuales con less. Con las flechas
  también te mueves de a una línea, y g (minúscula) vuelve al principio.
