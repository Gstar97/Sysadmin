tipo: terminal
shell: bash
titulo: Ordenar la carpeta de descargas
descripcion: >-
  Tu carpeta de descargas es un desorden. Armá una estructura de proyecto, mové cada cosa a su
  lugar, borrá lo que sobra sin llevarte nada por delante y dejá un acceso directo a los logs.
estado_inicial:
  distro: rocky
  hostname: rocky01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
  archivos:
    /home/ana/descargas/informe-enero.pdf: "PDF informe enero\n"
    /home/ana/descargas/informe-febrero.pdf: "PDF informe febrero\n"
    /home/ana/descargas/foto1.jpg: "JPG 1\n"
    /home/ana/descargas/foto2.jpg: "JPG 2\n"
    /home/ana/descargas/notas.txt: "Pendientes: revisar backups\n"
    /home/ana/descargas/instalador.tmp: "temporal 1\n"
    /home/ana/descargas/descarga.tmp: "temporal 2\n"
    /var/log/app/app.log: "inicio\n"
pasos:
  - consigna: >-
      Creá la carpeta `proyecto` con tres subcarpetas, `docs`, `img` y `logs`, en un solo comando:
      `mkdir -p proyecto/{docs,img,logs}`.
    verificar:
      - { archivo: /home/ana/proyecto/docs, tipo: directorio }
      - { archivo: /home/ana/proyecto/img, tipo: directorio }
      - { archivo: /home/ana/proyecto/logs, tipo: directorio }
    pistas:
      - "`-p` crea también las carpetas intermedias que falten, y las llaves generan los tres nombres"
    solucion: ['mkdir -p proyecto/{docs,img,logs}']
    explicacion: >-
      Las llaves se expanden antes de ejecutar el comando: es lo mismo que escribir
      `mkdir -p proyecto/docs proyecto/img proyecto/logs`.
  - consigna: Copiá todos los PDF de `descargas` a `proyecto/docs` usando un comodín.
    verificar:
      - { archivo: /home/ana/proyecto/docs/informe-enero.pdf }
      - { archivo: /home/ana/proyecto/docs/informe-febrero.pdf }
      - { archivo: /home/ana/descargas/informe-enero.pdf }
    pistas:
      - "`*.pdf` coincide con todos los nombres que terminan en .pdf"
      - "`cp descargas/*.pdf proyecto/docs/`"
    solucion: ['cp descargas/*.pdf proyecto/docs/']
    explicacion: cp deja el original donde estaba. Si el destino es una carpeta, los archivos se copian dentro con el mismo nombre.
  - consigna: Mové las fotos a `proyecto/img`.
    verificar:
      - { archivo: /home/ana/proyecto/img/foto1.jpg }
      - { archivo: /home/ana/proyecto/img/foto2.jpg }
      - { archivo: /home/ana/descargas/foto1.jpg, existe: false }
    pistas:
      - "`mv` mueve; `*.jpg` o `foto?.jpg` seleccionan las fotos"
    solucion: ['mv descargas/*.jpg proyecto/img/']
    explicacion: "`foto?.jpg` también funcionaba: `?` reemplaza exactamente un carácter."
  - consigna: Mové `notas.txt` al proyecto y cambiale el nombre a `LEEME.txt` en el mismo paso.
    verificar:
      - { archivo: /home/ana/proyecto/LEEME.txt, contenido_incluye: Pendientes }
      - { archivo: /home/ana/descargas/notas.txt, existe: false }
    pistas:
      - "Si el destino es un nombre de archivo nuevo, mv mueve y renombra a la vez"
      - "`mv descargas/notas.txt proyecto/LEEME.txt`"
    solucion: [mv descargas/notas.txt proyecto/LEEME.txt]
    explicacion: >-
      En Linux no hay un comando para renombrar aparte: renombrar es mover a un nombre nuevo.
  - consigna: >-
      Antes de borrar los temporales, mirá qué archivos coinciden con `descargas/*.tmp` usando `ls`.
      Después borralos con `rm`.
    verificar:
      - { comando_usado: 'ls\s+.*\*\.tmp' }
      - { archivo: /home/ana/descargas/instalador.tmp, existe: false }
      - { archivo: /home/ana/descargas/descarga.tmp, existe: false }
    pistas:
      - "Primero `ls descargas/*.tmp`; si la lista es la que esperás, `rm descargas/*.tmp`"
    solucion: ['ls descargas/*.tmp', 'rm descargas/*.tmp']
    explicacion: Probar el comodín con `ls` antes de usarlo con `rm` es un hábito que evita desastres. rm no tiene papelera.
  - consigna: >-
      En `descargas` solo quedan los PDF originales, que ya copiaste. Intentá borrar la carpeta con
      `rmdir descargas` y fijate qué pasa. Después borrala con todo su contenido usando `rm -r`.
    verificar:
      - { comando_usado: 'rm\s+(-\w*[rR]\w*\s+)+descargas' }
      - { archivo: /home/ana/descargas, existe: false }
    pistas:
      - "`rmdir` se niega porque la carpeta no está vacía: es su forma de protegerte"
      - "`rm -r descargas`"
    solucion: [rmdir descargas, rm -r descargas]
    explicacion: >-
      `rmdir` solo borra carpetas vacías, así que es la opción segura cuando creés que no queda
      nada. Cuando sabés que querés borrar todo, `rm -r`, revisando bien el nombre antes de
      apretar Enter.
  - consigna: Creá en `proyecto/logs` un enlace simbólico llamado `app` que apunte a `/var/log/app`.
    verificar:
      - { archivo: /home/ana/proyecto/logs/app, tipo: enlace, destino: /var/log/app }
    pistas:
      - "`ln -s DESTINO NOMBRE_DEL_ENLACE`: primero a dónde apunta, después cómo se llama"
      - "`ln -s /var/log/app proyecto/logs/app`"
    solucion: [ln -s /var/log/app proyecto/logs/app]
    explicacion: Ahora `ls proyecto/logs/app` muestra el contenido de `/var/log/app` sin tener que escribir la ruta completa.
  - consigna: Creá un enlace duro de `proyecto/LEEME.txt` llamado `LEEME-respaldo.txt` en tu carpeta personal.
    verificar:
      - { archivo: /home/ana/LEEME-respaldo.txt, tipo: archivo, enlaces: 2 }
    pistas:
      - "Sin `-s`, `ln` crea un enlace duro: `ln proyecto/LEEME.txt LEEME-respaldo.txt`"
    solucion: [ln proyecto/LEEME.txt LEEME-respaldo.txt]
    explicacion: >-
      Con `ls -li` verás que los dos nombres tienen el mismo número de inodo y un 2 en la columna
      de enlaces: son el mismo archivo. Ojo: no es un backup. Si editás uno, cambia el otro.
