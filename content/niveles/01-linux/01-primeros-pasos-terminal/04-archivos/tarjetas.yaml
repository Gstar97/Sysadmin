- { id: t1, frente: "mkdir -p", dorso: "Crea la carpeta y las intermedias que falten; no falla si ya existe." }
- { id: t2, frente: "cp -r y cp -a", dorso: "-r copia carpetas; -a además conserva dueño, permisos y fechas." }
- { id: t3, frente: "mv viejo nuevo", dorso: "Si nuevo es una carpeta existente, mueve adentro; si no, renombra." }
- { id: t4, frente: "rm -r, rmdir, rm -i", dorso: "Borra carpeta con contenido; borra solo si está vacía; pide confirmación." }
- { id: t5, frente: "Comodines *, ? y [ ]", dorso: "* cualquier cosa; ? un carácter; [abc] o [1-3] uno de la lista." }
- { id: t6, frente: "ln -s destino nombre", dorso: "Enlace simbólico (acceso directo). Se rompe si se borra el destino." }
- { id: t7, frente: "Enlace duro", dorso: "Otro nombre para el mismo inodo. El archivo existe mientras quede un nombre." }
- { id: t8, frente: "Antes de editar una configuración", dorso: "cp -a archivo archivo.bak" }
