<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="ui-monospace, monospace" font-size="13">
  <rect x="10" y="8" width="700" height="454" rx="10" fill="var(--surface-2, #eef2f5)" stroke="currentColor" stroke-width="1.2"/>
  <text x="26" y="34" xml:space="preserve" fill="currentColor" font-weight="700">CP(1)                    User Commands                    CP(1)</text>
  <text x="26" y="76" xml:space="preserve" fill="currentColor" font-weight="700">NAME</text>
  <text x="26" y="97" xml:space="preserve" fill="currentColor">       cp - copy files and directories</text>
  <text x="26" y="139" xml:space="preserve" fill="currentColor" font-weight="700">SYNOPSIS</text>
  <text x="26" y="160" xml:space="preserve" fill="currentColor">       cp [OPTION]... [-T] SOURCE DEST</text>
  <text x="26" y="181" xml:space="preserve" fill="currentColor">       cp [OPTION]... SOURCE... DIRECTORY</text>
  <text x="26" y="223" xml:space="preserve" fill="currentColor" font-weight="700">DESCRIPTION</text>
  <text x="26" y="244" xml:space="preserve" fill="currentColor">       Copy SOURCE to DEST, or multiple SOURCE(s) to DIRECTORY.</text>
  <text x="26" y="265" xml:space="preserve" fill="currentColor">       -a, --archive</text>
  <text x="26" y="286" xml:space="preserve" fill="currentColor">              same as -dR --preserve=all</text>
  <text x="26" y="307" xml:space="preserve" fill="currentColor">       -i, --interactive</text>
  <text x="26" y="328" xml:space="preserve" fill="currentColor">              prompt before overwrite</text>
  <text x="26" y="349" xml:space="preserve" fill="currentColor">       -r, -R, --recursive</text>
  <text x="26" y="370" xml:space="preserve" fill="currentColor">              copy directories recursively</text>
  <text x="26" y="412" xml:space="preserve" fill="currentColor" font-weight="700">SEE ALSO</text>
  <text x="26" y="433" xml:space="preserve" fill="currentColor">       mv(1), rm(1), ln(1)</text>
</svg>
