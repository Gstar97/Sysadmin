- id: p01
  tipo: opcion_multiple
  diagnostico: true
  enunciado: Querés leer cómo es el formato de las líneas de /etc/fstab. ¿Qué escribís?
  opciones:
    - { texto: "man 5 fstab", correcta: true, explicacion: "La sección 5 documenta formatos de archivos de configuración." }
    - { texto: "man 1 fstab", explicacion: "La sección 1 es para comandos; fstab es un archivo." }
    - { texto: "fstab --help", explicacion: "fstab no es un comando." }
    - { texto: "cat fstab", explicacion: "Mostraría el contenido (si estás en /etc), no su explicación." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  enunciado: No recordás qué comando sirve para cambiar la fecha de vencimiento de una contraseña. ¿Cómo lo buscás en el servidor?
  opciones:
    - { texto: "man -k password", correcta: true, explicacion: "Busca en las descripciones; aparece chage (change user password expiry information)." }
    - { texto: "man password", explicacion: "No hay una página llamada password." }
    - { texto: "password --help", explicacion: "No existe ese comando." }
    - { texto: "find / -name password", explicacion: "Busca archivos con ese nombre, no comandos por tema." }
- id: p03
  tipo: interpretar_salida
  enunciado: ¿Qué te dice esta salida?
  salida: |
    $ whatis crontab
    crontab (1)            - maintains crontab files for individual users
    crontab (5)            - tables for driving cron
  opciones:
    - { texto: "Que hay dos páginas: el comando crontab (sección 1) y el formato de los archivos (sección 5)", correcta: true, explicacion: "Para el formato de las líneas, man 5 crontab." }
    - { texto: "Que crontab está instalado dos veces", explicacion: "Son dos páginas de manual, no dos instalaciones." }
    - { texto: "Que hay que actualizar el manual", explicacion: "Es normal que un nombre aparezca en varias secciones." }
    - { texto: "Que crontab es un comando interno del shell", explicacion: "Los internos se consultan con help." }
- id: p04
  tipo: opcion_multiple
  enunciado: "La sinopsis dice `mkdir [OPTION]... DIRECTORY...`. ¿Cuál de estos comandos es válido?"
  opciones:
    - { texto: "mkdir -p datos logs", correcta: true, explicacion: "Una opción (opcional) y dos carpetas (DIRECTORY se puede repetir)." }
    - { texto: "mkdir -p", explicacion: "Falta al menos un DIRECTORY, que no está entre corchetes." }
    - { texto: "mkdir [datos]", explicacion: "Los corchetes de la sinopsis no se escriben: solo indican que algo es opcional." }
    - { texto: "mkdir OPTION DIRECTORY", explicacion: "Las palabras en mayúsculas se reemplazan por valores tuyos." }
- id: p05
  tipo: opcion_multiple
  enunciado: ¿Qué contiene la sección 8 del manual?
  opciones:
    - { texto: "Comandos de administración del sistema, como useradd y fdisk", correcta: true, explicacion: "Suelen necesitar privilegios de root." }
    - { texto: "Formatos de archivos de configuración", explicacion: "Esa es la 5." }
    - { texto: "Comandos de usuario como ls", explicacion: "Esa es la 1." }
    - { texto: "Los manuales en español", explicacion: "Las secciones no son idiomas." }
- id: p06
  tipo: opcion_multiple
  enunciado: "`man cd` responde \"No manual entry for cd\". ¿Por qué y qué hacés?"
  opciones:
    - { texto: "cd es un comando interno del shell; su ayuda está en help cd", correcta: true, explicacion: "Los builtins se documentan con help o dentro de man bash." }
    - { texto: "cd no existe en Rocky", explicacion: "cd existe en todos los shells." }
    - { texto: "Hay que instalar cd", explicacion: "No es un programa aparte." }
    - { texto: "Hay que usar man 5 cd", explicacion: "No está en ninguna sección: es parte de bash." }
- id: p07
  tipo: ordenar_pasos
  enunciado: Ordená los pasos para encontrar en el manual de rsync la opción que borra archivos del destino.
  pasos:
    - Abrir el manual con man rsync
    - Escribir /delete y Enter para buscar
    - Apretar n hasta llegar a la opción --delete
    - Leer la explicación y salir con q
  explicacion: Buscar dentro del manual es mucho más rápido que leerlo de arriba abajo.
- id: p08
  tipo: opcion_multiple
  enunciado: ¿Dónde suelen estar los archivos de ejemplo y las notas de versión que deja un paquete?
  opciones:
    - { texto: "En /usr/share/doc/nombre-del-paquete", correcta: true, explicacion: "Es la carpeta estándar para la documentación extra de cada paquete." }
    - { texto: "En /etc", explicacion: "Ahí va la configuración en uso, no la documentación." }
    - { texto: "En /var/log", explicacion: "Ahí van los registros." }
    - { texto: "En /tmp", explicacion: "Es para temporales." }
- id: p09
  tipo: opcion_multiple
  enunciado: Ya sabés usar grep, pero no recordás si la opción para ignorar mayúsculas es -i o -I. ¿Qué es lo más rápido?
  opciones:
    - { texto: "grep --help", correcta: true, explicacion: "Muestra un resumen de las opciones en la terminal, sin abrir el manual completo." }
    - { texto: "Buscar en internet", explicacion: "Funciona, pero la ayuda local es más rápida y corresponde a tu versión." }
    - { texto: "man -k grep", explicacion: "Busca comandos relacionados, no las opciones de grep." }
    - { texto: "whatis grep", explicacion: "Solo muestra la descripción de una línea." }
