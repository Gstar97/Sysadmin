tipo: diagrama
titulo: Las partes de una página de manual
puntos:
  - id: encabezado
    titulo: "Encabezado: nombre y sección"
    area: { x: 2.22, y: 3.83, ancho: 95.56, alto: 4.68 }
    texto: >-
      `CP(1)` dice el nombre y la sección del manual. La 1 es para comandos de usuarios, la 5
      para formatos de archivos de configuración y la 8 para comandos de administración. Cuando
      un nombre existe en varias secciones (como `passwd`, que es un comando y un archivo), se
      elegí con `man 5 passwd`.
  - id: nombre
    titulo: NAME
    area: { x: 2.22, y: 12.77, ancho: 95.56, alto: 9.15 }
    texto: >-
      Una línea que dice qué hace el comando. Es el texto en el que busca `man -k` (o
      `apropos`), así que acá está la palabra que conviene usar para buscar.
  - id: sinopsis
    titulo: "SYNOPSIS: cómo se escribe"
    area: { x: 2.22, y: 26.17, ancho: 95.56, alto: 13.62 }
    texto: >-
      Las formas válidas de usar el comando. Lo que está entre corchetes `[ ]` es opcional; los
      puntos suspensivos `...` indican que se puede repetir; lo que está en mayúsculas
      (`SOURCE`, `DEST`) se reemplaza por un valor tuyo. Acá se lee: cp, opciones si querés,
      un origen y un destino; o varios orígenes y una carpeta.
  - id: descripcion
    titulo: DESCRIPTION
    area: { x: 2.22, y: 44.04, ancho: 95.56, alto: 9.15 }
    texto: >-
      La explicación completa de lo que hace. En comandos complejos puede ser larga: no hace
      falta leerla entera, se busca con `/` lo que interesa.
  - id: opciones
    titulo: Opciones
    area: { x: 2.22, y: 52.98, ancho: 95.56, alto: 27.02 }
    texto: >-
      Cada opción con su forma corta y larga (`-i, --interactive`) y qué hace. Para encontrar
      una opción concreta, dentro de man escribe `/--archive` o `/-i` y Enter, y con `n` saltás
      a la siguiente coincidencia. Muchas páginas tienen además una sección EXAMPLES al final,
      que suele ser lo más útil: se llega con `/EXAMPLES`.
  - id: ver
    titulo: "SEE ALSO: páginas relacionadas"
    area: { x: 2.22, y: 84.26, ancho: 95.56, alto: 9.15 }
    texto: >-
      Otras páginas que conviene leer, con su sección entre paréntesis: `mv(1)` se abre con
      `man 1 mv` o simplemente `man mv`. Es una buena forma de descubrir comandos que no
      conocías.
