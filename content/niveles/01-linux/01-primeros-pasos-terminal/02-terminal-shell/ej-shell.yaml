tipo: terminal
shell: bash
titulo: Tus primeros comandos
descripcion: >-
  Practicá la estructura comando, opciones y argumentos, y el historial. No hace falta que
  memorices nada: fijate en qué cambia la salida al agregar cada parte.
estado_inicial:
  distro: rocky
  hostname: rocky01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
  archivos:
    /var/log/app.log: "inicio del servicio\nconexión aceptada\nconexión aceptada\n"
pasos:
  - consigna: Averiguá con qué usuario estás trabajando con `whoami`.
    verificar:
      - { comando_usado: '^\s*whoami' }
      - { salida_contiene: ana }
    pistas:
      - "`whoami` (who am I, ¿quién soy?)"
    solucion: [whoami]
    explicacion: Es un comando solo, sin opciones ni argumentos. El prompt ya lo decía, pero cuando trabajás con sudo o con varios usuarios conviene confirmarlo.
  - consigna: Lista los archivos de `/var/log` con el comando `ls` y el argumento `/var/log`.
    verificar:
      - { comando_usado: '^\s*ls\s+/var/log/?\s*$' }
    pistas:
      - "El argumento va después del comando, separado por un espacio: `ls /var/log`"
    solucion: [ls /var/log]
    explicacion: El argumento dice sobre qué trabaja el comando. Sin argumento, `ls` lista la carpeta en la que estás.
  - consigna: Ahora agregá la opción `-l` para ver los detalles de cada archivo.
    verificar:
      - { comando_usado: 'ls\s+(-\w*l\w*\s+)+/var/log|ls\s+/var/log\s+-\w*l' }
    pistas:
      - "La opción va entre el comando y el argumento: `ls -l /var/log`"
    solucion: [ls -l /var/log]
    explicacion: Cada línea muestra permisos, dueño, tamaño y fecha. Lo vas a leer a fondo en el módulo de permisos.
  - consigna: Agregá también `-h` para ver los tamaños en unidades legibles. Podés juntar las dos opciones como `-lh`.
    verificar:
      - { comando_usado: 'ls\s+(-(lh|hl)|-l\s+-h|-h\s+-l)\s+/var/log' }
    pistas:
      - "`ls -lh /var/log`: las opciones cortas de una letra se pueden juntar detrás de un solo guion"
    solucion: [ls -lh /var/log]
    explicacion: "`-lh` es lo mismo que `-l -h`. La forma larga de `-h` es `--human-readable`: más fácil de leer en un script, más larga de escribir."
  - consigna: Mirá tu historial de comandos con `history`.
    verificar:
      - { comando_usado: '^\s*history' }
    pistas:
      - "`history` muestra los comandos que ejecutaste, numerados"
    solucion: [history]
    explicacion: Cada comando queda numerado. Con la flecha arriba recorrés esa lista y con Ctrl+R buscás dentro de ella.
  - consigna: Repetí el último `ls` sin escribirlo de nuevo, usando `!ls` (repite el último comando que empezó con ls).
    verificar:
      - { comando_usado: '^\s*!(ls|\d+|!)' }
    pistas:
      - "Escribí `!ls` y Enter. El shell muestra el comando que va a ejecutar y lo ejecuta."
    solucion: ['!ls']
    explicacion: >-
      `!!` repite el último comando y `!texto` el último que empezó con ese texto. El más usado
      en el trabajo es `sudo !!`: repetir como administrador el comando que acaba de fallar por
      falta de permisos.
  - consigna: Averiguá si `cd` es un programa o una parte del shell con `type cd`.
    verificar:
      - { comando_usado: 'type\s+cd' }
      - { salida_contiene: builtin }
    pistas:
      - "`type cd`"
    solucion: [type cd]
    explicacion: >-
      `cd` es un comando interno (*builtin*): lo resuelve el propio shell, porque cambiar de
      carpeta solo tiene sentido dentro de él. Probá también `type ls`: es un programa guardado
      en `/usr/bin/ls`, y además tiene un alias.
