- { id: t1, frente: "Terminal, shell y kernel", dorso: "La terminal muestra y recibe texto; el shell (bash) interpreta los comandos; el kernel hace el trabajo." }
- { id: t2, frente: "$ y # al final del prompt", dorso: "$ usuario común; # root." }
- { id: t3, frente: "Forma de un comando", dorso: "comando opciones argumentos, separados por espacios. Ej.: ls -lh /var/log" }
- { id: t4, frente: "Tab y Tab Tab", dorso: "Tab completa; dos veces Tab muestra las opciones posibles." }
- { id: t5, frente: "!! y sudo !!", dorso: "!! repite el último comando; sudo !! lo repite como administrador." }
- { id: t6, frente: "Ctrl+C, Ctrl+L, Ctrl+R", dorso: "Cancelar; limpiar la pantalla; buscar en el historial." }
- { id: t7, frente: "PATH", dorso: "Lista de carpetas donde el shell busca los programas. which comando dice cuál encuentra." }
- { id: t8, frente: "type comando", dorso: "Dice si es un programa (con su ruta), un comando interno (builtin) o un alias." }
