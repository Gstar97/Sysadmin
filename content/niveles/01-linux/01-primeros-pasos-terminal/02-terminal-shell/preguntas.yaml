- id: p01
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Qué hace el shell?
  opciones:
    - { texto: "Lee lo que escribís, lo interpreta y le pide al sistema que lo ejecute", correcta: true, explicacion: "Es el intérprete entre vos y el sistema operativo; en Rocky y Ubuntu es bash." }
    - { texto: "Es la ventana donde se muestra el texto", explicacion: "Eso es la terminal." }
    - { texto: "Es el núcleo que maneja el hardware", explicacion: "Ese es el kernel." }
    - { texto: "Es un programa para editar archivos", explicacion: "Para eso están los editores como nano y vim." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  enunciado: "En el comando `ls -l /etc`, ¿qué es `/etc`?"
  opciones:
    - { texto: "Un argumento: sobre qué trabaja el comando", correcta: true, explicacion: "ls lista el contenido de /etc." }
    - { texto: "Una opción", explicacion: "Las opciones empiezan con guion, como -l." }
    - { texto: "El comando", explicacion: "El comando es ls." }
    - { texto: "El prompt", explicacion: "El prompt es lo que muestra el shell antes de que escribas." }
- id: p03
  tipo: opcion_multiple
  enunciado: "El prompt es `[root@rocky01 log]#`. ¿Qué te dice?"
  opciones:
    - { texto: "Que sos root, en el servidor rocky01, dentro de una carpeta llamada log", correcta: true, explicacion: "El usuario va antes de la arroba, el servidor después, la carpeta al final, y el # confirma que sos root." }
    - { texto: "Que sos un usuario común llamado log", explicacion: "log es la carpeta; el # indica root." }
    - { texto: "Que el comando anterior falló", explicacion: "El prompt no muestra eso." }
    - { texto: "Que estás en Ubuntu", explicacion: "Ese formato con corchetes es el de la familia Red Hat." }
- id: p04
  tipo: opcion_multiple
  enunciado: "¿Qué es equivalente a `ls -l -h /var/log`?"
  opciones:
    - { texto: "ls -lh /var/log", correcta: true, explicacion: "Las opciones cortas se pueden juntar detrás de un guion." }
    - { texto: "ls - lh /var/log", explicacion: "El espacio después del guion lo rompe: queda un argumento llamado -." }
    - { texto: "LS -lh /var/log", explicacion: "Los comandos distinguen mayúsculas: LS no existe." }
    - { texto: "ls /var/log lh", explicacion: "lh sin guion se toma como otro argumento." }
- id: p05
  tipo: completar_comando
  enunciado: Ejecutaste `cat /var/log/secure` y respondió "Permission denied". Escribí el atajo que repite ese mismo comando con sudo.
  aceptadas: ["sudo !!"]
  explicacion: "`!!` se reemplaza por el último comando; `sudo !!` lo repite como administrador."
- id: p06
  tipo: opcion_multiple
  diagnostico: true
  enunciado: "Escribís `systemctl` y aparece \"bash: systemclt: command not found\". ¿Qué pasó?"
  opciones:
    - { texto: "Hay un error de escritura: el comando se llama systemctl", correcta: true, explicacion: "El mensaje repite lo que escribiste: systemclt. Con Tab se evita." }
    - { texto: "systemctl no está instalado", explicacion: "Mira el nombre en el mensaje: está mal escrito." }
    - { texto: "Hace falta sudo", explicacion: "La falta de permisos da otro error, no \"command not found\"." }
    - { texto: "El servidor está apagado", explicacion: "Si el shell responde, el servidor está encendido." }
- id: p07
  tipo: opcion_multiple
  enunciado: ¿Qué es la variable PATH?
  opciones:
    - { texto: "La lista de carpetas donde el shell busca los programas", correcta: true, explicacion: "Las recorre en orden y ejecuta el primero que encuentra." }
    - { texto: "La carpeta en la que estás", explicacion: "Esa se ve con pwd o en la variable PWD." }
    - { texto: "Tu carpeta personal", explicacion: "Esa es HOME." }
    - { texto: "La contraseña del usuario", explicacion: "Las contraseñas no se guardan en variables." }
- id: p08
  tipo: opcion_multiple
  enunciado: Escribiste un comando y la terminal quedó sin prompt, sin mostrar nada. ¿Qué hacés primero?
  opciones:
    - { texto: "Ctrl+C para cancelar y recuperar el prompt", correcta: true, explicacion: "Detiene el comando que está esperando o trabajando." }
    - { texto: "Reiniciar el servidor", explicacion: "Es exagerado: casi siempre alcanza con Ctrl+C." }
    - { texto: "Cerrar la ventana y abrir otra", explicacion: "El comando podría seguir corriendo; primero se cancela con Ctrl+C." }
    - { texto: "Escribir exit", explicacion: "Mientras el comando no termina, exit no llega al shell." }
- id: p09
  tipo: interpretar_salida
  enunciado: ¿Qué te dice esta salida sobre el comando ll?
  salida: |
    $ type ll
    ll is aliased to `ls -l --color=auto'
  opciones:
    - { texto: "Que es un alias: un atajo que ejecuta ls -l", correcta: true, explicacion: "El sistema lo define al iniciar sesión." }
    - { texto: "Que es un programa en /usr/bin", explicacion: "Para un programa, type muestra su ruta." }
    - { texto: "Que es un comando interno del shell", explicacion: "Diría \"is a shell builtin\"." }
    - { texto: "Que no existe", explicacion: "Diría \"not found\"." }
- id: p10
  tipo: opcion_multiple
  enunciado: ¿Cuándo conviene usar la consola del hipervisor en lugar de SSH?
  opciones:
    - { texto: "Cuando la red de la VM no funciona y no se puede entrar por SSH", correcta: true, explicacion: "La consola no depende de la red." }
    - { texto: "Siempre: es más segura", explicacion: "SSH también es seguro, y mucho más cómodo para el trabajo diario." }
    - { texto: "Para copiar y pegar comandos", explicacion: "Justamente en la consola copiar y pegar suele no funcionar." }
    - { texto: "Nunca, la consola no sirve en servidores", explicacion: "Es la puerta de emergencia cuando falla la red." }
