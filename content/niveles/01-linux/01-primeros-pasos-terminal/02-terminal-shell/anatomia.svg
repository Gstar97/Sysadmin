  <line x1="288.0" y1="81" x2="288.0" y2="156" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <text x="288.0" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" stroke="var(--surface, #fff)" stroke-width="4" paint-order="stroke">$ usuario común · # root</text>
  <text x="40" y="218" font-weight="700" fill="currentColor">Ubuntu Server: el mismo dato, con otro formato</text>
  <text x="40" y="250" font-family="ui-monospace, monospace" font-size="20" fill="currentColor">ana@ubuntu01:~$ ls -lh /var/log</text>
  <text x="40" y="290" font-size="12" fill="currentColor">El prompt lo arma el shell: Rocky muestra solo el nombre de la carpeta y Ubuntu la ruta completa</text>
  <text x="40" y="310" font-size="12" fill="currentColor">(~ es tu carpeta personal). Lo que escribís después es igual en las dos: comando, opciones y argumentos.</text>
