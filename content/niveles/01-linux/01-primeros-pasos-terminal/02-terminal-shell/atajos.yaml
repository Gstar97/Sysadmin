tipo: emparejar
consigna: Une cada atajo de teclado con lo que hace en la terminal.
pares:
  - { a: "Tab", b: "Completa el nombre de un comando, archivo o carpeta" }
  - { a: "Flecha arriba", b: "Trae el comando anterior del historial" }
  - { a: "Ctrl+C", b: "Cancela el comando que se está ejecutando" }
  - { a: "Ctrl+R", b: "Busca hacia atrás en el historial mientras escribís" }
  - { a: "Ctrl+L", b: "Limpia la pantalla" }
  - { a: "Ctrl+D", b: "Cierra la sesión (en una línea vacía)" }
explicacion: >-
  Tab y la flecha arriba son los que más tiempo ahorran: casi nunca hace falta escribir un nombre
  completo ni repetir un comando largo. Ctrl+C es el freno de emergencia cuando algo tarda
  demasiado o te equivocaste.
