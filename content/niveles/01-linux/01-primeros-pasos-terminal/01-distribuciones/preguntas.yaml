- id: p01
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Qué tienen en común todas las distribuciones Linux?
  opciones:
    - { texto: "El kernel Linux", correcta: true, explicacion: "Es el núcleo compartido; todo lo demás puede cambiar entre distribuciones." }
    - { texto: "El gestor de paquetes", explicacion: "Cambia por familia: dnf en Red Hat, apt en Debian, zypper en SUSE." }
    - { texto: "Los años de soporte", explicacion: "Van de meses (Fedora) a diez años (RHEL)." }
    - { texto: "La empresa que las publica", explicacion: "Muchas no tienen empresa detrás, como Debian." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Cuál de estas distribuciones es una reconstrucción gratuita y compatible con RHEL?
  opciones:
    - { texto: "AlmaLinux", correcta: true, explicacion: "Igual que Rocky Linux y Oracle Linux, usa los mismos paquetes y comandos que RHEL." }
    - { texto: "Ubuntu", explicacion: "Es de la familia Debian." }
    - { texto: "Fedora", explicacion: "Es de la familia Red Hat, pero es donde se prueban novedades; RHEL se basa en ella, no al revés." }
    - { texto: "openSUSE", explicacion: "Es de la familia SUSE." }
- id: p03
  tipo: opcion_multiple
  enunciado: Un cliente quiere instalar un servidor nuevo con Ubuntu que va a funcionar al menos cuatro años. ¿Qué versión le recomiendas?
  opciones:
    - { texto: "La LTS más reciente, por ejemplo 26.04", correcta: true, explicacion: "Tiene 5 años de actualizaciones gratuitas, ampliables con Ubuntu Pro." }
    - { texto: "La versión intermedia más nueva, por ejemplo 25.10", explicacion: "Las intermedias duran nueve meses: tendría que actualizar enseguida." }
    - { texto: "Ubuntu 20.04, porque es la más probada", explicacion: "Su soporte estándar terminó en mayo de 2025." }
    - { texto: "Cualquiera, todas tienen el mismo soporte", explicacion: "El soporte cambia mucho entre LTS e intermedias." }
- id: p04
  tipo: opcion_multiple
  enunciado: ¿Qué significa que una versión llegó a su fin de vida (EOL)?
  opciones:
    - { texto: "Que ya no recibe actualizaciones de seguridad", correcta: true, explicacion: "Sigue funcionando, pero cada falla nueva queda sin corregir." }
    - { texto: "Que deja de arrancar", explicacion: "Sigue arrancando; el problema es que no recibe parches." }
    - { texto: "Que se borra automáticamente", explicacion: "No pasa nada visible en el servidor." }
    - { texto: "Que hay que pagar para seguir usándola", explicacion: "Algunos fabricantes venden soporte extendido, pero eso no es lo que significa el fin de vida." }
- id: p05
  tipo: respuesta_multiple
  diagnostico: true
  enunciado: ¿Qué cambia normalmente entre Rocky Linux y Ubuntu Server?
  opciones:
    - { texto: "El comando para instalar software (dnf o apt)", correcta: true, explicacion: "Cada familia tiene su gestor de paquetes." }
    - { texto: "El grupo de usuarios que puede usar sudo (wheel o sudo)", correcta: true, explicacion: "Rocky usa wheel; Ubuntu, sudo." }
    - { texto: "La seguridad adicional (SELinux o AppArmor)", correcta: true, explicacion: "Rocky trae SELinux; Ubuntu, AppArmor." }
    - { texto: "Los comandos básicos como ls, cp y cd", explicacion: "Son iguales en todas las distribuciones." }
- id: p06
  tipo: interpretar_salida
  enunciado: Ejecutas este comando en un servidor. ¿Qué sistema es?
  salida: |
    $ cat /etc/os-release
    NAME="AlmaLinux"
    VERSION="10.0 (Purple Lion)"
    ID="almalinux"
    ID_LIKE="rhel centos fedora"
    VERSION_ID="10.0"
  opciones:
    - { texto: "AlmaLinux 10, de la familia Red Hat", correcta: true, explicacion: "NAME y VERSION_ID dan la distribución; ID_LIKE muestra que es compatible con RHEL." }
    - { texto: "Fedora 10", explicacion: "Fedora aparece en ID_LIKE como antecesora, pero la distribución es AlmaLinux." }
    - { texto: "Un sistema de la familia Debian", explicacion: "Diría ID_LIKE=debian." }
    - { texto: "No se puede saber sin uname -r", explicacion: "uname -r muestra el kernel, no la distribución." }
- id: p07
  tipo: opcion_multiple
  enunciado: Al instalar Rocky Linux 10 en una PC de 2011 aparece "Fatal glibc error - CPU does not support x86-64-v3". ¿Qué opción es válida?
  opciones:
    - { texto: "Usar la edición x86-64-v2 de AlmaLinux 10", correcta: true, explicacion: "Está pensada justamente para procesadores que no llegan a v3." }
    - { texto: "Reinstalar Rocky 10 desde otro USB", explicacion: "El problema es el procesador, no la imagen." }
    - { texto: "Desactivar Secure Boot", explicacion: "No tiene relación con el error." }
    - { texto: "Agregar más memoria RAM", explicacion: "El error es por instrucciones del procesador, no por memoria." }
- id: p08
  tipo: opcion_multiple
  enunciado: ¿Por qué aparecieron Rocky Linux y AlmaLinux?
  opciones:
    - { texto: "Porque Red Hat anunció a fines de 2020 el fin anticipado de CentOS Linux, que era la versión gratuita compatible con RHEL", correcta: true, explicacion: "Muchas empresas usaban CentOS y necesitaban un reemplazo compatible." }
    - { texto: "Porque Ubuntu dejó de ser gratuito", explicacion: "Ubuntu sigue siendo gratuito." }
    - { texto: "Para reemplazar a Debian", explicacion: "Son de otra familia." }
    - { texto: "Para usar en escritorios", explicacion: "Están pensadas para servidores." }
- id: p09
  tipo: opcion_multiple
  enunciado: Encuentras un tutorial que dice "sudo apt install apache2". Tu servidor es Rocky Linux. ¿Qué ejecutas?
  opciones:
    - { texto: "sudo dnf install httpd", correcta: true, explicacion: "En la familia Red Hat se usa dnf y el paquete de Apache se llama httpd." }
    - { texto: "sudo apt install apache2", explicacion: "apt no existe en Rocky." }
    - { texto: "sudo dnf install apache2", explicacion: "En Rocky el paquete se llama httpd." }
    - { texto: "sudo yum install apt", explicacion: "No se instala un gestor de otra familia." }
- id: p10
  tipo: opcion_multiple
  enunciado: Una empresa necesita que, ante un problema grave, haya un fabricante al que llamar con un contrato. ¿Qué opción cumple eso?
  opciones:
    - { texto: "RHEL con su suscripción, o Ubuntu con Ubuntu Pro", correcta: true, explicacion: "Ambas incluyen soporte del fabricante cuando se contrata." }
    - { texto: "Rocky Linux sin contrato", explicacion: "Es gratuita; el soporte es de la comunidad, salvo que se contrate a un tercero." }
    - { texto: "Fedora", explicacion: "No tiene soporte comercial y su ciclo es corto." }
    - { texto: "Cualquier distribución, todas tienen soporte telefónico", explicacion: "El soporte del fabricante se paga aparte." }
