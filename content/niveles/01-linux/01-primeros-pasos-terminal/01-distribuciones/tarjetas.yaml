- { id: t1, frente: "Familia Red Hat", dorso: "Fedora → CentOS Stream → RHEL; Rocky, AlmaLinux y Oracle Linux son compatibles con RHEL. Paquetes rpm, dnf." }
- { id: t2, frente: "Familia Debian", dorso: "Debian y Ubuntu (y derivadas de escritorio como Linux Mint). Paquetes deb, apt." }
- { id: t3, frente: "¿Cuánto soporte tiene una versión de RHEL o Rocky?", dorso: "Unos 10 años. RHEL 10 salió en mayo de 2025: soporte hasta 2035." }
- { id: t4, frente: "Ubuntu LTS", dorso: "Una cada dos años, en abril. 5 años de actualizaciones gratuitas, hasta 10 con Ubuntu Pro." }
- { id: t5, frente: "Fin de vida (EOL)", dorso: "La versión deja de recibir parches de seguridad. Funciona, pero no debería estar expuesta." }
- { id: t6, frente: "¿Cómo saber qué distribución tiene un servidor?", dorso: "cat /etc/os-release (NAME, VERSION_ID e ID_LIKE)." }
- { id: t7, frente: "Requisito de CPU de RHEL 10 y Rocky 10", dorso: "x86-64-v3. AlmaLinux 10 publica también una edición x86-64-v2." }
