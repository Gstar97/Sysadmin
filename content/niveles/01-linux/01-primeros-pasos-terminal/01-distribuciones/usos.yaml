tipo: emparejar
consigna: Uní cada situación con la distribución que mejor encaja.
pares:
  - { a: "Un banco quiere servidores con soporte oficial del fabricante y certificación para su software contable", b: "Red Hat Enterprise Linux" }
  - { a: "Una empresa quiere un sistema compatible con RHEL, sin pagar licencias, para sus servidores web", b: "Rocky Linux o AlmaLinux" }
  - { a: "Un equipo de desarrollo quiere probar las versiones más nuevas de todo en sus notebooks", b: "Fedora" }
  - { a: "Una startup que trabaja en la nube y quiere la distribución con más tutoriales y paquetes", b: "Ubuntu Server LTS" }
  - { a: "Un servidor que tiene que funcionar años sin cambios grandes, con una comunidad sin empresa detrás", b: "Debian" }
  - { a: "Una empresa que ya usa SAP y servidores con soporte de SUSE", b: "SUSE Linux Enterprise" }
explicacion: >-
  No hay una distribución "mejor" en general: se elige por el soporte que hace falta, el software
  que se va a usar, lo que ya conoce el equipo y lo que ya existe en la empresa. Rocky y AlmaLinux
  son la opción típica cuando se quiere la familia Red Hat sin pagar; Ubuntu LTS, cuando se busca
  la mayor cantidad de documentación y de imágenes listas en la nube.
