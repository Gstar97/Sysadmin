  <text x="96.0" y="70" text-anchor="middle" font-size="11" fill="currentColor">configuración</text>
  <text x="96.0" y="86" text-anchor="middle" font-size="11" fill="currentColor">del servidor SSH</text>
  <rect x="188" y="16" width="168" height="88" rx="9" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.2"/>
  <text x="272.0" y="46" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="currentColor">/etc/hosts</text>
  <text x="272.0" y="70" text-anchor="middle" font-size="11" fill="currentColor">nombres de equipos</text>
  <text x="272.0" y="86" text-anchor="middle" font-size="11" fill="currentColor">sin pasar por DNS</text>
  <rect x="364" y="16" width="168" height="88" rx="9" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.2"/>
  <text x="448.0" y="46" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="currentColor">/etc/passwd</text>
  <text x="448.0" y="70" text-anchor="middle" font-size="11" fill="currentColor">lista de</text>
  <text x="448.0" y="86" text-anchor="middle" font-size="11" fill="currentColor">usuarios</text>
  <rect x="540" y="16" width="168" height="88" rx="9" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1.2"/>
