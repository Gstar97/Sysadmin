  <text x="96.0" y="170" text-anchor="middle" font-size="11" fill="currentColor">datos de</text>
  <text x="96.0" y="186" text-anchor="middle" font-size="11" fill="currentColor">los servicios</text>
  <rect x="188" y="116" width="168" height="88" rx="9" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1.2"/>
