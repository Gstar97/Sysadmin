  <text x="448.0" y="170" text-anchor="middle" font-size="11" fill="currentColor">trabajos</text>
  <text x="448.0" y="186" text-anchor="middle" font-size="11" fill="currentColor">en cola</text>
  <rect x="540" y="116" width="168" height="88" rx="9" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-width="1.2"/>
