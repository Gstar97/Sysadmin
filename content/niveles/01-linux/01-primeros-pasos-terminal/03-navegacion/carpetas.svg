  <text x="96.0" y="270" text-anchor="middle" font-size="11" fill="currentColor">programas de</text>
  <text x="96.0" y="286" text-anchor="middle" font-size="11" fill="currentColor">administración</text>
  <rect x="188" y="216" width="168" height="88" rx="9" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-width="1.2"/>
  <text x="272.0" y="246" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="currentColor">/usr/local</text>
  <text x="272.0" y="270" text-anchor="middle" font-size="11" fill="currentColor">software</text>
  <text x="272.0" y="286" text-anchor="middle" font-size="11" fill="currentColor">instalado a mano</text>
  <rect x="364" y="216" width="168" height="88" rx="9" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-width="1.2"/>
  <text x="448.0" y="246" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="currentColor">/usr/share</text>
  <text x="448.0" y="270" text-anchor="middle" font-size="11" fill="currentColor">documentación y</text>
  <text x="448.0" y="286" text-anchor="middle" font-size="11" fill="currentColor">datos compartidos</text>
  <rect x="540" y="216" width="168" height="88" rx="9" fill="var(--accent-soft, #d5f0ec)" stroke="currentColor" stroke-width="1.2"/>
  <text x="624.0" y="246" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="currentColor">/run</text>
  <text x="624.0" y="270" text-anchor="middle" font-size="11" fill="currentColor">estado desde</text>
  <text x="624.0" y="286" text-anchor="middle" font-size="11" fill="currentColor">el último arranque</text>
  <rect x="12" y="316" width="168" height="88" rx="9" fill="var(--accent-soft, #d5f0ec)" stroke="currentColor" stroke-width="1.2"/>
  <text x="96.0" y="346" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="currentColor">/mnt · /media</text>
  <text x="96.0" y="370" text-anchor="middle" font-size="11" fill="currentColor">montajes</text>
  <text x="96.0" y="386" text-anchor="middle" font-size="11" fill="currentColor">temporales</text>
  <rect x="188" y="316" width="168" height="88" rx="9" fill="var(--accent-soft, #d5f0ec)" stroke="currentColor" stroke-width="1.2"/>
  <text x="272.0" y="346" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="currentColor">/opt</text>
  <text x="272.0" y="370" text-anchor="middle" font-size="11" fill="currentColor">programas de</text>
  <text x="272.0" y="386" text-anchor="middle" font-size="11" fill="currentColor">terceros completos</text>
  <rect x="364" y="316" width="168" height="88" rx="9" fill="var(--accent-soft, #d5f0ec)" stroke="currentColor" stroke-width="1.2"/>
  <text x="448.0" y="346" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="currentColor">/srv</text>
  <text x="448.0" y="370" text-anchor="middle" font-size="11" fill="currentColor">datos que</text>
  <text x="448.0" y="386" text-anchor="middle" font-size="11" fill="currentColor">publica el servidor</text>
  <rect x="540" y="316" width="168" height="88" rx="9" fill="var(--surface-2, #eef2f5)" stroke="currentColor" stroke-width="1.2"/>
  <text x="624.0" y="346" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="currentColor">~/.bashrc</text>
  <text x="624.0" y="370" text-anchor="middle" font-size="11" fill="currentColor">configuración</text>
  <text x="624.0" y="386" text-anchor="middle" font-size="11" fill="currentColor">personal (oculta)</text>
