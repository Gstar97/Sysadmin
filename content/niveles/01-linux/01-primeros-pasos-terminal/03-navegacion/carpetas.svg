<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, sans-serif" font-size="12">
  <rect x="12" y="16" width="168" height="88" rx="9" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.2"/>
