  <text x="624.0" y="86" text-anchor="middle" font-size="11" fill="currentColor">(logs)</text>
  <rect x="12" y="116" width="168" height="88" rx="9" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1.2"/>
