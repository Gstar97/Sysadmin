id: n1
titulo: Linux
descripcion: 'Administración de servidores Linux desde cero hasta un nivel profesional. Se trabaja con
  dos distribuciones de referencia: Rocky Linux 10 o AlmaLinux 10 (familia Red Hat) y Ubuntu Server LTS
  (familia Debian). Cada vez que un comando o archivo cambia entre familias o versiones, la lección lo
  aclara.'
perfil_salida: Instalar, configurar, asegurar y mantener un servidor Linux; administrar usuarios, permisos,
  software, servicios, discos y procesos; acceder de forma remota y segura, y automatizar tareas con scripts
  de Bash. Es el nivel que prepara la base de RHCSA y LPIC-1.
insignia:
  nombre: Linux
  color: '#1d4ed8'
proyecto_plan:
  titulo: Servidor Linux para una pequeña oficina
  horas: 16
  entregables:
  - Rocky Linux o AlmaLinux 10, o Ubuntu Server LTS, instalado con LVM.
  - Usuarios y grupos por departamento con carpetas compartidas y permisos correctos.
  - SSH solo con claves, firewall mínimo y SELinux o AppArmor activo.
  - Backup diario automático con rotación, verificación y registro.
  - Documento de entrega con qué se hizo, cómo se opera y cómo se recupera.
