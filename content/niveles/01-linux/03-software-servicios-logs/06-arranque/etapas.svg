<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="250" height="110" rx="10" fill="var(--surface-2, #eef2f5)" stroke="currentColor"/>
<circle cx="42" cy="44" r="12" fill="currentColor"/><text x="42" y="48.5" text-anchor="middle" font-weight="700" font-size="12" fill="var(--surface, #fff)">1</text>
<text x="62" y="49" font-weight="700" font-size="14" fill="currentColor">Firmware</text>
<text x="62" y="68" font-size="11.5" fill="currentColor">UEFI o BIOS</text>
<text x="38" y="96" fill="currentColor">revisa el hardware y</text>
<text x="38" y="115" fill="currentColor">busca el cargador</text>
<rect x="305" y="20" width="250" height="110" rx="10" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
<circle cx="327" cy="44" r="12" fill="currentColor"/><text x="327" y="48.5" text-anchor="middle" font-weight="700" font-size="12" fill="var(--surface, #fff)">2</text>
<text x="347" y="49" font-weight="700" font-size="14" fill="currentColor">GRUB</text>
<text x="347" y="68" font-size="11.5" fill="currentColor">el cargador</text>
<text x="323" y="96" fill="currentColor">muestra el menú y carga</text>
<text x="323" y="115" fill="currentColor">kernel + initramfs</text>
<rect x="590" y="20" width="250" height="110" rx="10" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
<circle cx="612" cy="44" r="12" fill="currentColor"/><text x="612" y="48.5" text-anchor="middle" font-weight="700" font-size="12" fill="var(--surface, #fff)">3</text>
<text x="632" y="49" font-weight="700" font-size="14" fill="currentColor">Kernel</text>
<text x="632" y="68" font-size="11.5" fill="currentColor">el núcleo</text>
<text x="608" y="96" fill="currentColor">detecta el hardware</text>
<text x="608" y="115" fill="currentColor">y arranca initramfs</text>
<rect x="590" y="190" width="250" height="110" rx="10" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
<circle cx="612" cy="214" r="12" fill="currentColor"/><text x="612" y="218.5" text-anchor="middle" font-weight="700" font-size="12" fill="var(--surface, #fff)">4</text>
<text x="632" y="219" font-weight="700" font-size="14" fill="currentColor">initramfs</text>
<text x="632" y="238" font-size="11.5" fill="currentColor">sistema mínimo en RAM</text>
<text x="608" y="266" fill="currentColor">encuentra y monta</text>
<text x="608" y="285" fill="currentColor">el disco raíz real</text>
<rect x="305" y="190" width="250" height="110" rx="10" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
<circle cx="327" cy="214" r="12" fill="currentColor"/><text x="327" y="218.5" text-anchor="middle" font-weight="700" font-size="12" fill="var(--surface, #fff)">5</text>
<text x="347" y="219" font-weight="700" font-size="14" fill="currentColor">systemd</text>
<text x="347" y="238" font-size="11.5" fill="currentColor">PID 1</text>
<text x="323" y="266" fill="currentColor">arranca los servicios</text>
<text x="323" y="285" fill="currentColor">hasta el target</text>
<rect x="20" y="190" width="250" height="110" rx="10" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
<circle cx="42" cy="214" r="12" fill="currentColor"/><text x="42" y="218.5" text-anchor="middle" font-weight="700" font-size="12" fill="var(--surface, #fff)">6</text>
<text x="62" y="219" font-weight="700" font-size="14" fill="currentColor">Login</text>
<text x="62" y="238" font-size="11.5" fill="currentColor">multi-user.target</text>
<text x="38" y="266" fill="currentColor">consola y SSH</text>
<text x="38" y="285" fill="currentColor">listos para entrar</text>
<line x1="272" y1="75" x2="303" y2="75" stroke="currentColor" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="557" y1="75" x2="588" y2="75" stroke="currentColor" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="715" y1="132" x2="715" y2="188" stroke="currentColor" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="588" y1="245" x2="557" y2="245" stroke="currentColor" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="303" y1="245" x2="272" y2="245" stroke="currentColor" stroke-width="1.6" marker-end="url(#a)"/>
<text x="430" y="322" text-anchor="middle" fill="currentColor">Si una etapa falla, el arranque se detiene ahí: el mensaje que ves en pantalla dice en cuál.</text>
</svg>
