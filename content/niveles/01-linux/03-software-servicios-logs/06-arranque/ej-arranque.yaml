tipo: terminal
shell: bash
titulo: Parámetros del kernel y tiempo de arranque
descripcion: >-
  El equipo de virtualización necesita que los mensajes del arranque de este servidor salgan
  también por la consola serie, para verlos desde su panel aunque la red no funcione. Además, te
  piden revisar qué demora el arranque.
estado_inicial:
  distro: rocky
  hostname: web01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
pasos:
  - consigna: Mirá con qué parámetros arrancó el kernel esta vez.
    verificar:
      - { comando_usado: 'cat\s+/proc/cmdline' }
    pistas:
      - "El kernel los publica en un archivo de /proc."
      - "`cat /proc/cmdline`"
    solucion: [cat /proc/cmdline]
    explicacion: root= dice cuál es el disco raíz y ro que se monta primero en solo lectura (systemd lo pasa a lectura y escritura más adelante). Los rd.lvm.lv son para el initramfs.
  - consigna: Comprobá con qué target arranca el servidor por defecto.
    verificar:
      - { comando_usado: 'systemctl\s+get-default' }
      - { salida_contiene: multi-user.target }
    pistas:
      - "`systemctl get-default`"
    solucion: [systemctl get-default]
    explicacion: multi-user.target es el modo normal de un servidor, sin escritorio gráfico.
  - consigna: Mirá la entrada de arranque por defecto con grubby.
    verificar:
      - { comando_usado: 'grubby\s+--info(=|\s+)(DEFAULT|ALL)' }
    pistas:
      - "grubby necesita sudo."
      - "`sudo grubby --info=DEFAULT`"
    solucion: [sudo grubby --info=DEFAULT]
    explicacion: Muestra el kernel, el initramfs y los parámetros (args) que se van a usar en el próximo arranque.
  - consigna: Agregá los parámetros `console=tty0 console=ttyS0,115200` a todos los kernels.
    verificar:
      - { archivo: "/boot/loader/entries/4b0c2f1e9a7d4c55b1e2f30a8d6c7e91-6.12.0-55.el10.x86_64.conf", contenido_incluye: "console=ttyS0,115200" }
      - { archivo: "/boot/loader/entries/4b0c2f1e9a7d4c55b1e2f30a8d6c7e91-6.12.0-55.el10.x86_64.conf", contenido_incluye: "console=tty0" }
    pistas:
      - "grubby --update-kernel=ALL --args=\"...\""
      - "`sudo grubby --update-kernel=ALL --args=\"console=tty0 console=ttyS0,115200\"`"
    solucion: ['sudo grubby --update-kernel=ALL --args="console=tty0 console=ttyS0,115200"']
    explicacion: >-
      Con dos console=, los mensajes salen por la pantalla (tty0) y por el puerto serie (ttyS0)
      a 115200 baudios. ALL hace que se aplique a todos los kernels instalados, incluidos los que
      se instalen en futuras actualizaciones.
  - consigna: Comprobá que el cambio quedó guardado, y que /proc/cmdline todavía no lo tiene.
    verificar:
      - { comando_usado: 'grubby\s+--info' }
      - { comando_usado: 'cat\s+/proc/cmdline' }
    pistas:
      - "`sudo grubby --info=DEFAULT` y `cat /proc/cmdline`"
    solucion: [sudo grubby --info=DEFAULT, cat /proc/cmdline]
    explicacion: Los parámetros se aplican en el próximo arranque. Hasta que reinicies (en una ventana de mantenimiento), el kernel que está corriendo sigue con los de antes.
  - consigna: Averiguá cuánto tardó el arranque y qué servicio demoró más.
    verificar:
      - { comando_usado: 'systemd-analyze(\s+time)?$|systemd-analyze\s+blame' }
      - { salida_contiene: NetworkManager-wait-online }
    pistas:
      - "systemd-analyze da el total y systemd-analyze blame la lista por servicio."
      - "`systemd-analyze` y `systemd-analyze blame`"
    solucion: [systemd-analyze, systemd-analyze blame]
    explicacion: >-
      NetworkManager-wait-online espera a que la red esté lista, así que casi siempre encabeza la
      lista. No significa que esté mal: blame mide cuánto tardó cada uno, y varios arrancan al
      mismo tiempo.
  - consigna: Revisá si hubo errores durante este arranque.
    verificar:
      - { comando_usado: 'journalctl\s+.*-b.*-p\s*(err|3)|journalctl\s+.*-p\s*(err|3).*-b' }
    pistas:
      - "`journalctl -b -p err`"
    solucion: [journalctl -b -p err]
    explicacion: Es la primera revisión después de cualquier reinicio planificado.
