- { id: t1, frente: "Etapas del arranque", dorso: "Firmware → GRUB → kernel → initramfs → systemd → login." }
- { id: t2, frente: "initramfs", dorso: "Sistema mínimo en memoria que encuentra y monta el disco raíz. Se regenera con dracut -f (Rocky) o update-initramfs -u (Ubuntu)." }
- { id: t3, frente: "/proc/cmdline", dorso: "Los parámetros con los que arrancó el kernel actual." }
- { id: t4, frente: "Cambiar parámetros del kernel", dorso: "Una vez: en GRUB, e y Ctrl+X. Siempre: grubby --update-kernel=ALL --args=... (Rocky); /etc/default/grub + update-grub (Ubuntu)." }
- { id: t5, frente: "rescue.target vs emergency.target", dorso: "rescue: todos los discos, servicios básicos. emergency: solo la raíz en solo lectura. Los dos piden contraseña de root." }
- { id: t6, frente: "Arrancar en rescate una vez", dorso: "En GRUB, agregar systemd.unit=rescue.target a la línea linux." }
- { id: t7, frente: "Recuperar root en Rocky", dorso: "rd.break → mount -o remount,rw /sysroot → chroot /sysroot → passwd → touch /.autorelabel → exit, exit." }
- { id: t8, frente: "Recuperar acceso en Ubuntu", dorso: "En GRUB: ro → rw y agregar init=/bin/bash. passwd usuario, sync, exec /sbin/init." }
- { id: t9, frente: "Arranque lento o con errores", dorso: "systemd-analyze · systemd-analyze blame · journalctl -b -p err" }
