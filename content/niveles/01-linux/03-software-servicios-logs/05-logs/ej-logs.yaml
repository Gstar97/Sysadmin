tipo: terminal
shell: bash
titulo: Revisar los logs del inventario
descripcion: >-
  El sistema de inventario de la oficina tuvo cortes esta madrugada, y su archivo de log no deja
  de crecer. Investigá qué pasó con journalctl, revisá los intentos de acceso por SSH y configurá
  la rotación de su log.
estado_inicial:
  distro: rocky
  hostname: app01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
    - { nombre: inventario }
  servicios:
    inventario: { activo: true, habilitado: true, descripcion: "Inventario de la oficina", hace_minutos: 300 }
  archivos:
    /var/log/inventario: { tipo: directorio, modo: "0775", dueno: inventario, grupo: inventario }
    /var/log/inventario/app.log:
      contenido: |
        2026-11-01 01:00:01 INFO servidor iniciado en el puerto 8080
        2026-11-01 03:10:12 ERROR no se pudo conectar a la base de datos
        2026-11-01 03:10:42 WARN reintentando la conexión (2/5)
      dueno: inventario
      grupo: inventario
      modo: "0640"
  journal:
    - { unidad: inventario.service, prioridad: info, mensaje: "Servidor escuchando en el puerto 8080", hace_minutos: 300 }
    - { unidad: sshd.service, prioridad: info, mensaje: "Failed password for root from 203.0.113.45 port 52144 ssh2", hace_minutos: 120 }
    - { unidad: sshd.service, prioridad: info, mensaje: "Failed password for invalid user admin from 203.0.113.45 port 52150 ssh2", hace_minutos: 119 }
    - { unidad: sshd.service, prioridad: info, mensaje: "Failed password for invalid user test from 203.0.113.45 port 52158 ssh2", hace_minutos: 118 }
    - { unidad: inventario.service, prioridad: err, mensaje: "No se pudo conectar a la base de datos: tiempo de espera agotado", hace_minutos: 45 }
    - { unidad: inventario.service, prioridad: warning, mensaje: "Reintentando la conexión (2/5)", hace_minutos: 44 }
pasos:
  - consigna: Empezá por lo grave. Mostrá solo los errores desde el último arranque.
    verificar:
      - { comando_usado: 'journalctl\s+.*-p\s*(err|3)' }
      - { salida_contiene: base de datos }
    pistas:
      - "-p filtra por prioridad y -b se queda con el arranque actual."
      - "`journalctl -p err -b`"
    solucion: [journalctl -p err -b]
    explicacion: Con -p err ves los errores y lo más grave. Es una buena primera mirada a un servidor que no conocés.
  - consigna: Ahora mirá todo lo que dijo el servicio inventario en la última hora.
    verificar:
      - { comando_usado: 'journalctl\s+.*-u\s*inventario.*--since|journalctl\s+.*--since.*-u\s*inventario' }
      - { salida_contiene: Reintentando }
    pistas:
      - "-u para el servicio y --since para el momento de inicio."
      - "`journalctl -u inventario --since \"1 hour ago\"`"
    solucion: ['journalctl -u inventario --since "1 hour ago"']
    explicacion: El servicio perdió la conexión con la base de datos y está reintentando. El próximo paso sería revisar el servidor de la base de datos.
  - consigna: Revisá si hubo intentos fallidos de acceso por SSH, buscando el texto "Failed password" en los mensajes de sshd.
    verificar:
      - { comando_usado: 'journalctl\s+.*(-g|--grep)|grep\s+.*Failed password' }
      - { salida_contiene: Failed password }
    pistas:
      - "journalctl -u sshd con -g busca un texto. También sirve sudo grep sobre /var/log/secure."
      - "`journalctl -u sshd -g \"Failed password\"`"
    solucion: ['journalctl -u sshd -g "Failed password"']
    explicacion: >-
      Tres intentos desde la misma IP en un minuto, con usuarios típicos (root, admin, test): es un
      robot probando contraseñas. Es habitual en servidores expuestos a internet; en el módulo 1.6
      vas a ver cómo protegerte.
  - consigna: Mirá los permisos de la carpeta del log del inventario.
    verificar:
      - { comando_usado: 'ls\s+-\w*l\w*d?\w*\s+/var/log/inventario' }
    pistas:
      - "`ls -ld /var/log/inventario`"
    solucion: [ls -ld /var/log/inventario]
    explicacion: La carpeta es del usuario inventario y su grupo puede escribir (rwxrwxr-x). Vas a ver por qué importa en el próximo paso.
  - consigna: >-
      Creá `/etc/logrotate.d/inventario` para rotar `/var/log/inventario/*.log` todos los días,
      guardando 7 copias comprimidas (con delaycompress), sin quejarse si falta o está vacío, y
      creando el log nuevo con `create 0640 inventario inventario`.
    verificar:
      - { archivo: /etc/logrotate.d/inventario, contenido_incluye: "/var/log/inventario/*.log" }
      - { archivo: /etc/logrotate.d/inventario, contenido_incluye: "rotate 7" }
      - { archivo: /etc/logrotate.d/inventario, contenido_incluye: "create 0640 inventario inventario" }
    pistas:
      - "Podés usar sudo nano /etc/logrotate.d/inventario."
      - |-
        Contenido:
        /var/log/inventario/*.log {
            daily
            rotate 7
            compress
            delaycompress
            missingok
            notifempty
            create 0640 inventario inventario
        }
    solucion:
      - "printf '/var/log/inventario/*.log {\\n    daily\\n    rotate 7\\n    compress\\n    delaycompress\\n    missingok\\n    notifempty\\n    create 0640 inventario inventario\\n}\\n' | sudo tee /etc/logrotate.d/inventario"
    explicacion: Cada opción va en su línea, dentro de las llaves. Lo que no pongas se toma de /etc/logrotate.conf.
  - consigna: Probá la configuración en modo de prueba, que no cambia nada. Leé el error.
    verificar:
      - { comando_usado: 'logrotate\s+(-d|--debug)\s+/etc/logrotate\.d/inventario' }
      - { salida_contiene: insecure permissions }
    pistas:
      - "`sudo logrotate -d /etc/logrotate.d/inventario`"
    solucion: [sudo logrotate -d /etc/logrotate.d/inventario]
    explicacion: >-
      logrotate trabaja como root, y no quiere hacerlo en una carpeta donde otro usuario puede
      escribir: podría usarse para engañarlo y pisar archivos del sistema. La solución es decirle
      con qué cuenta trabajar ahí, con la opción su.
  - consigna: Agregá la línea `su inventario inventario` dentro del bloque y volvé a probar.
    verificar:
      - { archivo: /etc/logrotate.d/inventario, contenido_incluye: "su inventario inventario" }
      - { comando_usado: 'logrotate\s+(-d|--debug)\s+/etc/logrotate\.d/inventario' }
    pistas:
      - "Con sudo nano, o con sed: `sudo sed -i 's/daily/daily\\n    su inventario inventario/' /etc/logrotate.d/inventario`"
    solucion:
      - "sudo sed -i 's/    daily/    daily\\n    su inventario inventario/' /etc/logrotate.d/inventario"
      - sudo logrotate -d /etc/logrotate.d/inventario
    explicacion: Ya no hay error. Dice que el log no necesita rotarse todavía porque es la primera vez que logrotate lo ve.
  - consigna: Forzá una rotación para comprobar que funciona y mirá cómo quedó la carpeta.
    verificar:
      - { archivo: /var/log/inventario/app.log.1 }
      - { archivo: /var/log/inventario/app.log, dueno: inventario, modo: "0640" }
    pistas:
      - "-f fuerza la rotación aunque no haga falta."
      - "`sudo logrotate -f /etc/logrotate.d/inventario` y `ls -l /var/log/inventario`"
    solucion: [sudo logrotate -f /etc/logrotate.d/inventario, ls -l /var/log/inventario]
    explicacion: >-
      El log viejo pasó a app.log.1 (sin comprimir todavía, por delaycompress) y hay un app.log
      nuevo y vacío, con el dueño y los permisos de create. A partir de ahora, logrotate.timer lo
      hace solo todos los días.
