tipo: emparejar
consigna: Une cada comando con lo que muestra.
pares:
  - { a: "journalctl -u nginx", b: "Solo los mensajes del servicio nginx" }
  - { a: "journalctl -p err", b: "Solo los mensajes de error o más graves" }
  - { a: "journalctl -b", b: "Lo que pasó desde el último encendido" }
  - { a: "journalctl --since \"1 hour ago\"", b: "Lo de la última hora" }
  - { a: "journalctl -f", b: "Los mensajes nuevos a medida que llegan" }
  - { a: "journalctl -n 20", b: "Las últimas 20 líneas" }
  - { a: "journalctl -g \"Failed password\"", b: "Las líneas que contienen un texto" }
explicacion: >-
  Las opciones se combinan: journalctl -u nginx -p warning --since today muestra las advertencias
  y errores de nginx de hoy.
