<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- Fuentes -->
  <text x="100" y="30" text-anchor="middle" font-weight="700" fill="currentColor">Quién escribe</text>
  <rect x="20" y="44" width="160" height="34" rx="6" fill="var(--surface-2, #eef2f5)" stroke="currentColor"/>
  <text x="100" y="66" text-anchor="middle" fill="currentColor">El kernel</text>
  <rect x="20" y="88" width="160" height="34" rx="6" fill="var(--surface-2, #eef2f5)" stroke="currentColor"/>
  <text x="100" y="110" text-anchor="middle" fill="currentColor">Servicios (sshd, nginx...)</text>
  <rect x="20" y="132" width="160" height="34" rx="6" fill="var(--surface-2, #eef2f5)" stroke="currentColor"/>
  <text x="100" y="154" text-anchor="middle" fill="currentColor">sudo, inicios de sesión</text>
  <rect x="20" y="176" width="160" height="34" rx="6" fill="var(--surface-2, #eef2f5)" stroke="currentColor"/>
  <text x="100" y="198" text-anchor="middle" fill="currentColor">Scripts (logger, echo)</text>

  <line x1="182" y1="61" x2="268" y2="118" stroke="currentColor" stroke-width="1.3" marker-end="url(#f)"/>
  <line x1="182" y1="105" x2="268" y2="124" stroke="currentColor" stroke-width="1.3" marker-end="url(#f)"/>
  <line x1="182" y1="149" x2="268" y2="132" stroke="currentColor" stroke-width="1.3" marker-end="url(#f)"/>
  <line x1="182" y1="193" x2="268" y2="138" stroke="currentColor" stroke-width="1.3" marker-end="url(#f)"/>

  <!-- journald -->
  <rect x="270" y="92" width="170" height="70" rx="10" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="355" y="122" text-anchor="middle" font-weight="700" fill="currentColor">systemd-journald</text>
  <text x="355" y="142" text-anchor="middle" font-size="11.5" fill="currentColor">recibe todo, con fecha y origen</text>

  <!-- journal -->
  <line x1="442" y1="112" x2="528" y2="74" stroke="currentColor" stroke-width="1.3" marker-end="url(#f)"/>
  <rect x="530" y="40" width="310" height="70" rx="10" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="545" y="64" font-weight="700" fill="currentColor">El journal</text>
  <text x="545" y="83" font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">/var/log/journal (si existe)</text>
  <text x="545" y="100" fill="currentColor">Se lee con journalctl</text>

  <!-- rsyslog -->
  <line x1="442" y1="142" x2="528" y2="176" stroke="currentColor" stroke-width="1.3" marker-end="url(#f)"/>
  <rect x="530" y="140" width="310" height="110" rx="10" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="545" y="164" font-weight="700" fill="currentColor">rsyslog → archivos de texto</text>
  <text x="545" y="186" font-size="11.5" fill="currentColor">Rocky:</text>
  <text x="600" y="186" font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">/var/log/messages, secure, cron</text>
  <text x="545" y="206" font-size="11.5" fill="currentColor">Ubuntu:</text>
  <text x="600" y="206" font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">/var/log/syslog, auth.log</text>
  <text x="545" y="230" fill="currentColor">Se leen con less, tail, grep</text>

  <!-- apps propias -->
  <rect x="20" y="270" width="160" height="34" rx="6" fill="var(--surface-2, #eef2f5)" stroke="currentColor"/>
  <text x="100" y="292" text-anchor="middle" fill="currentColor">Algunas aplicaciones</text>
  <line x1="182" y1="287" x2="528" y2="287" stroke="currentColor" stroke-width="1.3" marker-end="url(#f)"/>
  <rect x="530" y="266" width="310" height="44" rx="10" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="545" y="286" font-weight="700" fill="currentColor">Sus propios archivos</text>
  <text x="545" y="302" font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">/var/log/nginx/error.log</text>

  <text x="430" y="346" text-anchor="middle" fill="currentColor">El journal y los archivos de /var/log muestran casi lo mismo, en dos formatos.</text>
  <text x="430" y="366" text-anchor="middle" fill="currentColor">Los archivos de texto crecen sin parar: logrotate los recorta.</text>
</svg>
