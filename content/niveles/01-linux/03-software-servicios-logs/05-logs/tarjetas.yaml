- { id: t1, frente: "journald y rsyslog", dorso: "journald guarda todo en el journal (journalctl). rsyslog escribe copias en archivos de texto de /var/log." }
- { id: t2, frente: "Prioridades", dorso: "0 emerg · 1 alert · 2 crit · 3 err · 4 warning · 5 notice · 6 info · 7 debug. -p err = err y más graves." }
- { id: t3, frente: "Filtros de journalctl", dorso: "-u servicio · -p prioridad · --since/--until · -b arranque · -g texto · -n líneas · -f en vivo · -k kernel" }
- { id: t4, frente: "journalctl -xeu servicio", dorso: "Final del registro de un servicio, con explicaciones. La receta para un servicio que falla." }
- { id: t5, frente: "Journal persistente", dorso: "Existe /var/log/journal → sobrevive a reinicios. journalctl --list-boots, --disk-usage, --vacuum-size." }
- { id: t6, frente: "Archivos por familia", dorso: "Rocky: messages, secure, cron. Ubuntu: syslog, auth.log, kern.log." }
- { id: t7, frente: "logrotate", dorso: "Rota según /etc/logrotate.d/: daily, rotate N, compress, delaycompress, missingok, notifempty, create. Lo lanza logrotate.timer." }
- { id: t8, frente: "Probar logrotate", dorso: "sudo logrotate -d archivo (prueba) · sudo logrotate -f archivo (forzar)." }
- { id: t9, frente: "La app sigue escribiendo en el log viejo", dorso: "postrotate ... endscript con un reload, o copytruncate." }
