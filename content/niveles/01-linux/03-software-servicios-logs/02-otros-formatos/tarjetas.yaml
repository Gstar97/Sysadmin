- { id: t1, frente: "Snap", dorso: "Formato de Canonical, común en Ubuntu. Se actualiza solo (snap refresh --hold para pausar). Cada snap es un disco loop." }
- { id: t2, frente: "Flatpak y AppImage", dorso: "Formatos para aplicaciones de escritorio. Flatpak usa Flathub; AppImage es un único archivo ejecutable." }
- { id: t3, frente: "Binario suelto", dorso: "Verificar con sha256sum -c, instalar en /usr/local/bin (install -m 755) y documentarlo." }
- { id: t4, frente: "make install", dorso: "Compilar desde el código: ningún gestor lo registra ni lo actualiza. Último recurso." }
- { id: t5, frente: "Orden de preferencia", dorso: "Repositorio oficial → repositorio confiable del fabricante → Snap/Flatpak → binario suelto → compilar." }
- { id: t6, frente: "curl ... | sudo bash", dorso: "Ejecuta como root un script sin leerlo. Bajalo, léelo y recién ahí decide." }
