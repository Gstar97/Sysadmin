tipo: emparejar
consigna: Uní cada formato con lo que lo caracteriza.
pares:
  - { a: "Paquete .rpm o .deb del repositorio", b: "Usa las bibliotecas del sistema y se actualiza con dnf o apt" }
  - { a: "Snap", b: "Lo publica la tienda de Canonical, se actualiza solo y aparece como discos loop en lsblk" }
  - { a: "Flatpak", b: "Pensado para aplicaciones de escritorio, con su tienda principal en Flathub" }
  - { a: "AppImage", b: "Un único archivo ejecutable: se le da permiso de ejecución y se abre" }
  - { a: "Binario en un .tar.gz", b: "Se copia a /usr/local/bin y vos te encargas de actualizarlo" }
  - { a: "Compilado con make install", b: "Queda en /usr/local sin que ningún gestor sepa que existe" }
explicacion: >-
  En un servidor, lo ideal es que todo lo instalado se pueda listar, verificar y actualizar con
  una sola herramienta. Cada formato extra es un lugar más que hay que revisar.
