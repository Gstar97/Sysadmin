<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="currentColor">De dónde sacar un programa, en orden de preferencia para un servidor</text>
  <!-- filas -->
  <g>
    <rect x="20" y="44" width="820" height="54" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
    <text x="40" y="67" font-weight="700" fill="currentColor">1. Repositorios oficiales</text>
    <text x="40" y="86" fill="currentColor">dnf / apt · firmados · se actualizan con el resto del sistema</text>
    <text x="820" y="76" text-anchor="end" font-size="12" fill="currentColor">primera opción</text>
  </g>
  <g>
    <rect x="20" y="106" width="820" height="54" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-dasharray="5 3"/>
    <text x="40" y="129" font-weight="700" fill="currentColor">2. Repositorio extra confiable o el del fabricante</text>
    <text x="40" y="148" fill="currentColor">EPEL, el repositorio oficial de nginx, PostgreSQL o Docker · también con dnf / apt</text>
  </g>
  <g>
    <rect x="20" y="168" width="820" height="54" rx="8" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
    <text x="40" y="191" font-weight="700" fill="currentColor">3. Formatos que traen todo adentro: Snap, Flatpak, AppImage</text>
    <text x="40" y="210" fill="currentColor">incluyen sus propias bibliotecas · Snap es común en Ubuntu; Flatpak y AppImage, en escritorios</text>
  </g>
  <g>
    <rect x="20" y="230" width="820" height="54" rx="8" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
    <text x="40" y="253" font-weight="700" fill="currentColor">4. Binario suelto del fabricante (.tar.gz)</text>
    <text x="40" y="272" fill="currentColor">se copia a /usr/local/bin · verificar el hash · las actualizaciones quedan a tu cargo</text>
  </g>
  <g>
    <rect x="20" y="292" width="820" height="54" rx="8" fill="var(--bad-soft, #fde2e2)" stroke="currentColor"/>
    <text x="40" y="315" font-weight="700" fill="currentColor">5. Compilar desde el código fuente</text>
    <text x="40" y="334" fill="currentColor">./configure, make, make install · nadie lo registra ni lo actualiza · último recurso</text>
    <text x="820" y="324" text-anchor="end" font-size="12" fill="currentColor">último recurso</text>
  </g>
  <text x="430" y="378" text-anchor="middle" fill="currentColor">Cuanto más abajo, más trabajo y más responsabilidad para ti: actualizar, verificar y documentar.</text>
</svg>
