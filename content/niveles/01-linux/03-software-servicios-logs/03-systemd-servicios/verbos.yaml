tipo: emparejar
consigna: Uní cada comando con lo que hace.
pares:
  - { a: "systemctl start nginx", b: "Lo arranca ahora, pero no al encender el servidor" }
  - { a: "systemctl enable nginx", b: "Hace que arranque al encender el servidor, pero no lo arranca ahora" }
  - { a: "systemctl enable --now nginx", b: "Lo arranca ahora y también en cada encendido" }
  - { a: "systemctl restart nginx", b: "Lo detiene y lo vuelve a arrancar (corta las conexiones)" }
  - { a: "systemctl reload nginx", b: "Le pide que relea su configuración sin detenerse" }
  - { a: "systemctl mask nginx", b: "Lo bloquea: nadie puede arrancarlo, ni a mano ni otro servicio" }
  - { a: "systemctl --failed", b: "Lista los servicios que se cayeron o no pudieron arrancar" }
explicacion: >-
  Hay dos preguntas distintas: ¿está funcionando ahora? (start, stop, restart) y ¿arranca solo al
  encender? (enable, disable). Un servicio puede estar habilitado y detenido, o funcionando sin
  estar habilitado.
