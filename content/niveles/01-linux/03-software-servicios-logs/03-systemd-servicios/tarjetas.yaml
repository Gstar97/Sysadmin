- { id: t1, frente: "Servicio", dorso: "Programa que funciona en segundo plano esperando pedidos (sshd, nginx, chronyd)." }
- { id: t2, frente: "systemd", dorso: "PID 1. Arranca, vigila y detiene los servicios; guarda sus mensajes en el journal. Se maneja con systemctl." }
- { id: t3, frente: "start / enable", dorso: "start: ahora. enable: al encender. enable --now: las dos cosas." }
- { id: t4, frente: "restart / reload", dorso: "restart detiene y vuelve a arrancar (corta conexiones). reload relee la configuración sin detenerse." }
- { id: t5, frente: "disable / mask", dorso: "disable: no arranca solo. mask: no puede arrancar de ninguna forma (unmask lo revierte)." }
- { id: t6, frente: "Estados de Active", dorso: "active (running): funcionando · inactive (dead): detenido · failed: falló." }
- { id: t7, frente: "Revisión rápida", dorso: "systemctl --failed · is-active · is-enabled · list-units --type=service" }
- { id: t8, frente: "multi-user.target", dorso: "El modo normal de un servidor. systemctl get-default dice cuál usa el tuyo." }
- { id: t9, frente: "Servicio que no arranca", dorso: "status → journalctl -xeu → probar config (nginx -t) → corregir → start → comprobar." }
