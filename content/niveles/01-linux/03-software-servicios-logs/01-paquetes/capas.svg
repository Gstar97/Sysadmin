<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- Repositorios -->
  <rect x="20" y="40" width="190" height="210" rx="10" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="115" y="66" text-anchor="middle" font-weight="700" fill="currentColor">Repositorios</text>
  <text x="115" y="84" text-anchor="middle" font-size="11.5" fill="currentColor">(servidores en internet)</text>
  <rect x="40" y="100" width="150" height="30" rx="5" fill="var(--surface, #fff)" stroke="currentColor"/>
  <text x="115" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="currentColor">baseos · appstream</text>
  <rect x="40" y="140" width="150" height="30" rx="5" fill="var(--surface, #fff)" stroke="currentColor"/>
  <text x="115" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="currentColor">epel</text>
  <rect x="40" y="180" width="150" height="30" rx="5" fill="var(--surface, #fff)" stroke="currentColor"/>
  <text x="115" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="currentColor">noble · noble-updates</text>
  <text x="115" y="236" text-anchor="middle" font-size="11.5" fill="currentColor">paquetes firmados</text>

  <line x1="212" y1="145" x2="262" y2="145" stroke="currentColor" stroke-width="1.6" marker-end="url(#fl)"/>

  <!-- dnf / apt -->
  <rect x="265" y="40" width="200" height="210" rx="10" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="365" y="66" text-anchor="middle" font-weight="700" fill="currentColor">dnf · apt</text>
  <text x="365" y="84" text-anchor="middle" font-size="11.5" fill="currentColor">(lo que usas a diario)</text>
  <text x="285" y="114" font-size="12.5" fill="currentColor">• busca en el catálogo</text>
  <text x="285" y="138" font-size="12.5" fill="currentColor">• calcula las dependencias</text>
  <text x="285" y="162" font-size="12.5" fill="currentColor">• descarga los paquetes</text>
  <text x="285" y="186" font-size="12.5" fill="currentColor">• revisa la firma</text>
  <text x="285" y="210" font-size="12.5" fill="currentColor">• anota el historial</text>

  <line x1="467" y1="145" x2="517" y2="145" stroke="currentColor" stroke-width="1.6" marker-end="url(#fl)"/>

  <!-- rpm / dpkg -->
  <rect x="520" y="40" width="150" height="210" rx="10" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="595" y="66" text-anchor="middle" font-weight="700" fill="currentColor">rpm · dpkg</text>
  <text x="595" y="84" text-anchor="middle" font-size="11.5" fill="currentColor">(nivel bajo)</text>
  <text x="535" y="122" font-size="12.5" fill="currentColor">• copia los</text>
  <text x="545" y="140" font-size="12.5" fill="currentColor">archivos</text>
  <text x="535" y="166" font-size="12.5" fill="currentColor">• lleva la lista</text>
  <text x="545" y="184" font-size="12.5" fill="currentColor">de lo instalado</text>

  <line x1="672" y1="145" x2="722" y2="145" stroke="currentColor" stroke-width="1.6" marker-end="url(#fl)"/>

  <!-- Sistema -->
  <rect x="725" y="40" width="120" height="210" rx="10" fill="var(--surface-2, #eef2f5)" stroke="currentColor"/>
  <text x="785" y="66" text-anchor="middle" font-weight="700" fill="currentColor">Tu servidor</text>
  <text x="785" y="110" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="currentColor">/usr/bin</text>
  <text x="785" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="currentColor">/etc</text>
  <text x="785" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="currentColor">/usr/share/doc</text>
  <text x="785" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="currentColor">/usr/lib/systemd</text>

  <text x="430" y="290" text-anchor="middle" font-size="12.5" fill="currentColor">Rocky: dnf usa rpm por debajo. Ubuntu: apt usa dpkg por debajo.</text>
  <text x="430" y="312" text-anchor="middle" font-size="12.5" fill="currentColor">Si usas rpm o dpkg directamente, nadie resuelve las dependencias por ti.</text>
</svg>
