- { id: t1, frente: "Paquete", dorso: "Archivo con un programa, su configuración, su documentación y la lista de sus dependencias. .rpm (Rocky) o .deb (Ubuntu)." }
- { id: t2, frente: "Repositorio", dorso: "Servidor con un catálogo de paquetes firmados para tu distribución." }
- { id: t3, frente: "dnf / apt frente a rpm / dpkg", dorso: "dnf y apt: repositorios y dependencias (uso diario). rpm y dpkg: instalan archivos sueltos y consultan lo instalado." }
- { id: t4, frente: "apt update vs apt upgrade", dorso: "update baja el catálogo (no instala nada). upgrade instala las versiones nuevas." }
- { id: t5, frente: "¿De qué paquete es este archivo?", dorso: "rpm -qf /ruta (Rocky) · dpkg -S /ruta (Ubuntu)" }
- { id: t6, frente: "¿Qué archivos instaló el paquete?", dorso: "rpm -ql paquete (Rocky) · dpkg -L paquete (Ubuntu)" }
- { id: t7, frente: "EPEL", dorso: "Repositorio extra para la familia Red Hat, del proyecto Fedora. sudo dnf install epel-release." }
- { id: t8, frente: "Instalar un archivo suelto", dorso: "sudo dnf install ./archivo.rpm · sudo apt install ./archivo.deb (resuelven dependencias)." }
- { id: t9, frente: "Historial de cambios", dorso: "Rocky: dnf history, history info N, history undo N. Ubuntu: /var/log/apt/history.log." }
