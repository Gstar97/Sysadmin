tipo: terminal
shell: bash
titulo: Herramientas para el equipo de soporte
descripcion: >-
  Pablo, de soporte, te pide tree y htop en el servidor para revisar carpetas y procesos.
  Instalalos con cuidado: primero averigua qué hay, después instala, y al final deja todo
  documentado.
estado_inicial:
  distro: rocky
  hostname: app01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
pasos:
  - consigna: Comprobá si `tree` ya está instalado, consultando la lista de paquetes con rpm.
    verificar:
      - { comando_usado: 'rpm\s+-q\s+tree' }
    pistas:
      - "rpm -q seguido del nombre del paquete."
      - "`rpm -q tree`"
    solucion: [rpm -q tree]
    explicacion: >-
      "package tree is not installed": no está. Con un paquete instalado, rpm -q muestra el nombre
      con la versión, por ejemplo tree-2.1.0-1.el10.x86_64.
  - consigna: Mirá la información del paquete antes de instalarlo (descripción, versión y repositorio).
    verificar:
      - { comando_usado: 'dnf\s+info\s+tree' }
      - { salida_contiene: File system tree viewer }
    pistas:
      - "`dnf info tree`"
    solucion: [dnf info tree]
    explicacion: Es un buen hábito revisar qué vas a instalar, sobre todo con nombres que no conocés.
  - consigna: Instalá `tree` sin que pregunte la confirmación.
    verificar:
      - { paquete: tree, instalado: true }
    pistas:
      - "Instalar cambia el sistema: necesita sudo. La opción -y responde que sí."
      - "`sudo dnf install -y tree`"
    solucion: [sudo dnf install -y tree]
    explicacion: Sin -y, dnf muestra la lista de lo que va a instalar y pregunta. En un servidor real conviene leer esa lista.
  - consigna: Ahora intentá instalar `htop` de la misma forma. Va a fallar; lee el mensaje.
    verificar:
      - { comando_usado: 'dnf\s+install.*htop' }
      - { salida_contiene: No match for argument }
    pistas:
      - "`sudo dnf install -y htop`"
    solucion: [sudo dnf install -y htop]
    explicacion: htop no está en los repositorios oficiales de Rocky. Viene de EPEL, un repositorio extra.
  - consigna: Activá el repositorio EPEL instalando su paquete de configuración, y comprobá con `dnf repolist` que aparece.
    verificar:
      - { paquete: epel-release, instalado: true }
      - { comando_usado: 'dnf\s+repolist' }
      - { salida_contiene: epel }
    pistas:
      - "El paquete se llama epel-release."
      - "`sudo dnf install -y epel-release` y después `dnf repolist`"
    solucion: [sudo dnf install -y epel-release, dnf repolist]
    explicacion: El paquete solo deja un archivo .repo en /etc/yum.repos.d/ con la dirección del repositorio y su clave de firma.
  - consigna: Instalá `htop` otra vez.
    verificar:
      - { paquete: htop, instalado: true }
    pistas:
      - "`sudo dnf install -y htop`"
    solucion: [sudo dnf install -y htop]
    explicacion: >-
      Fijate en la columna Repository del resumen: dice epel.
  - consigna: Averiguá de qué paquete viene el comando `journalctl` (archivo `/usr/bin/journalctl`).
    verificar:
      - { comando_usado: 'rpm\s+-qf\s+(/usr/bin/journalctl|\$\(which journalctl\)|`which journalctl`)' }
      - { salida_contiene: systemd }
    pistas:
      - "rpm -qf recibe la ruta de un archivo."
      - "`rpm -qf /usr/bin/journalctl`"
    solucion: [rpm -qf /usr/bin/journalctl]
    explicacion: Sirve para saber a quién pertenece un archivo antes de tocarlo o borrarlo.
  - consigna: Revisá el historial de dnf para ver las transacciones que hiciste.
    verificar:
      - { comando_usado: 'dnf\s+history' }
    pistas:
      - "`dnf history`"
    solucion: [dnf history]
    explicacion: >-
      Cada fila es una transacción con su número. Si algo falla después, `dnf history info N`
      muestra qué cambió y `sudo dnf history undo N` lo deshace.
