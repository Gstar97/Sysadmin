tipo: emparejar
consigna: Une cada tarea con el comando que la hace (algunos son de Rocky y otros de Ubuntu).
pares:
  - { a: "sudo apt update", b: "Bajar el catálogo nuevo de los repositorios (no instala nada)" }
  - { a: "sudo dnf upgrade", b: "Instalar las versiones nuevas de todo lo instalado, en Rocky" }
  - { a: "rpm -qf /usr/bin/ls", b: "Averiguar de qué paquete viene un archivo, en Rocky" }
  - { a: "dpkg -L nginx", b: "Listar los archivos que instaló un paquete, en Ubuntu" }
  - { a: "dnf provides /usr/bin/dig", b: "Saber qué paquete trae un comando que todavía no tienes" }
  - { a: "dnf history undo 7", b: "Deshacer la transacción número 7" }
  - { a: "sudo apt install ./agente.deb", b: "Instalar un archivo suelto resolviendo sus dependencias" }
explicacion: >-
  Las de dnf y apt trabajan con repositorios y dependencias; rpm y dpkg consultan lo que ya está
  instalado. Si dudas, man dnf o man apt tienen la lista completa.
