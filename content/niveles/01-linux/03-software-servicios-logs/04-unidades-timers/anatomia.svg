<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="system-ui, sans-serif" font-size="12.5">
<text x="20" y="24" font-weight="700" font-size="13" fill="currentColor" font-family="ui-monospace, monospace">/etc/systemd/system/inventario.service</text>
<rect x="14" y="29" width="440" height="100" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-opacity="0.5"/>
<rect x="14" y="149" width="440" height="172" rx="6" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-opacity="0.5"/>
<rect x="14" y="341" width="440" height="52" rx="6" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-opacity="0.5"/>
<text x="26" y="46" font-family="ui-monospace, monospace" font-weight="700" fill="currentColor">[Unit]</text>
<text x="26" y="70" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">Description</tspan>=Inventario de la oficina</text>
<text x="26" y="94" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">After</tspan>=network-online.target</text>
<text x="26" y="118" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">Wants</tspan>=network-online.target</text>
<text x="26" y="166" font-family="ui-monospace, monospace" font-weight="700" fill="currentColor">[Service]</text>
<text x="26" y="190" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">Type</tspan>=simple</text>
<text x="26" y="214" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">User</tspan>=inventario</text>
<text x="26" y="238" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">WorkingDirectory</tspan>=/opt/inventario</text>
<text x="26" y="262" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">ExecStart</tspan>=/opt/inventario/bin/servidor --puerto 8080</text>
<text x="26" y="286" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">Restart</tspan>=on-failure</text>
<text x="26" y="310" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">RestartSec</tspan>=5</text>
<text x="26" y="358" font-family="ui-monospace, monospace" font-weight="700" fill="currentColor">[Install]</text>
<text x="26" y="382" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">WantedBy</tspan>=multi-user.target</text>
<line x1="456" y1="79.0" x2="482" y2="79.0" stroke="currentColor" stroke-width="1.4"/>
<text x="490" y="52.0" font-weight="700" fill="currentColor">[Unit]: qué es y con quién se relaciona</text>
<text x="490" y="70.0" font-weight="400" fill="currentColor">Description aparece en systemctl status.</text>
<text x="490" y="88.0" font-weight="400" fill="currentColor">After= y Wants=: arrancar después de</text>
<text x="490" y="106.0" font-weight="400" fill="currentColor">que haya red (y pedir que la haya).</text>
<line x1="456" y1="235.0" x2="482" y2="235.0" stroke="currentColor" stroke-width="1.4"/>
<text x="490" y="190.0" font-weight="700" fill="currentColor">[Service]: cómo se ejecuta</text>
<text x="490" y="208.0" font-weight="400" fill="currentColor">Type=simple: el programa se queda corriendo.</text>
<text x="490" y="226.0" font-weight="400" fill="currentColor">User=: con qué cuenta (nunca root si no hace falta).</text>
<text x="490" y="244.0" font-weight="400" fill="currentColor">ExecStart=: el comando, con ruta completa.</text>
<text x="490" y="262.0" font-weight="400" fill="currentColor">Restart=on-failure: si se cae, volver a</text>
<text x="490" y="280.0" font-weight="400" fill="currentColor">arrancarlo a los 5 segundos (RestartSec).</text>
<line x1="456" y1="367.0" x2="482" y2="367.0" stroke="currentColor" stroke-width="1.4"/>
<text x="490" y="349.0" font-weight="700" fill="currentColor">[Install]: qué hace &quot;systemctl enable&quot;</text>
<text x="490" y="367.0" font-weight="400" fill="currentColor">WantedBy=multi-user.target: arrancar en</text>
<text x="490" y="385.0" font-weight="400" fill="currentColor">el modo normal del servidor.</text>
</svg>
