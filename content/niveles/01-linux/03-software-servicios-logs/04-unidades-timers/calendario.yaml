tipo: emparejar
consigna: Une cada valor de OnCalendar con cuándo se ejecuta.
pares:
  - { a: "OnCalendar=daily", b: "Todos los días a la medianoche" }
  - { a: "OnCalendar=*-*-* 02:30:00", b: "Todos los días a las 2:30" }
  - { a: "OnCalendar=Mon..Fri 08:00", b: "De lunes a viernes a las 8:00" }
  - { a: "OnCalendar=Sun 03:00", b: "Los domingos a las 3:00" }
  - { a: "OnCalendar=*-*-01 06:00", b: "El primer día de cada mes a las 6:00" }
  - { a: "OnCalendar=*:0/15", b: "Cada 15 minutos (en los minutos 0, 15, 30 y 45)" }
explicacion: >-
  El formato completo es día-de-la-semana año-mes-día hora:minuto:segundo, y * significa
  "cualquiera". Si tienes dudas, systemd-analyze calendar "expresión" te dice cuándo será la
  próxima vez.
