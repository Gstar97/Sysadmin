- { id: t1, frente: "/etc/systemd/system vs /usr/lib/systemd/system", dorso: "/etc: tus unidades (tienen prioridad, no se tocan al actualizar). /usr/lib: las de los paquetes (no se editan)." }
- { id: t2, frente: "Secciones de un .service", dorso: "[Unit] qué es (Description, After) · [Service] cómo se ejecuta (ExecStart, Type, User, Restart) · [Install] cuándo arranca solo (WantedBy)." }
- { id: t3, frente: "Type=simple vs Type=oneshot", dorso: "simple: el programa se queda corriendo. oneshot: hace su tarea y termina." }
- { id: t4, frente: "daemon-reload", dorso: "sudo systemctl daemon-reload: que systemd vuelva a leer las unidades después de crearlas o cambiarlas." }
- { id: t5, frente: "Drop-in", dorso: "sudo systemctl edit servicio → /etc/systemd/system/servicio.service.d/override.conf. Cambia solo algunas opciones." }
- { id: t6, frente: "Reemplazar ExecStart en un drop-in", dorso: "Primero una línea ExecStart= vacía, después el nuevo ExecStart=." }
- { id: t7, frente: "203/EXEC · 217/USER · 200/CHDIR", dorso: "No pudo ejecutar el programa · la cuenta de User= no existe · la carpeta de WorkingDirectory= no existe." }
- { id: t8, frente: "Timer", dorso: "nombre.timer lanza nombre.service. [Timer] OnCalendar=, Persistent=true · [Install] WantedBy=timers.target. Se habilita el timer." }
- { id: t9, frente: "Ver y probar timers", dorso: "systemctl list-timers · systemd-analyze calendar \"expresión\"" }
