tipo: terminal
shell: bash
titulo: Un respaldo que se hace solo
descripcion: >-
  El servidor de archivos guarda los datos de la oficina en /srv/datos. Ya hay un script de
  respaldo y un compañero dejó escrita la unidad en tu carpeta. Convertilo en un servicio de
  systemd y programalo para que se ejecute todos los días a las 2:30.
estado_inicial:
  distro: rocky
  hostname: files01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
  archivos:
    /usr/local/bin/respaldo.sh:
      contenido: |
        #!/bin/bash
        # Copia /srv/datos a /backup/AAAA-MM-DD
        fecha=$(date +%F)
        mkdir -p /backup/$fecha
        cp -r /srv/datos/. /backup/$fecha/
        echo "Respaldo de /srv/datos guardado en /backup/$fecha"
      modo: "0755"
    /srv/datos/clientes.csv: "id,nombre\n1,Laura\n"
    /srv/datos/pedidos.csv: "id,total\n1,100\n"
    /home/ana/respaldo.service: |
      [Unit]
      Description=Respaldo de /srv/datos

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/respaldo.sh
pasos:
  - consigna: Antes de automatizar, probá el script a mano (con sudo) y comprobá que creó una carpeta dentro de /backup.
    verificar:
      - { comando_usado: 'sudo\s+(bash\s+)?/usr/local/bin/respaldo\.sh' }
      - { archivo: /backup, tipo: directorio }
    pistas:
      - "`sudo /usr/local/bin/respaldo.sh` y después `ls /backup`"
    solucion: [sudo /usr/local/bin/respaldo.sh, ls /backup]
    explicacion: Si el script no funciona a mano, tampoco va a funcionar desde systemd, y ahí es más difícil ver por qué.
  - consigna: Leé la unidad que dejó tu compañero en tu carpeta personal.
    verificar:
      - { comando_usado: '(cat|less|head)\s+(~/|/home/ana/)?respaldo\.service' }
    pistas:
      - "`cat ~/respaldo.service`"
    solucion: [cat /home/ana/respaldo.service]
    explicacion: >-
      Es Type=oneshot: el script hace su trabajo y termina. No tiene sección [Install] porque no
      lo vas a habilitar directamente: lo va a lanzar un timer.
  - consigna: Copiá la unidad a la carpeta de unidades propias y hacé que systemd la lea.
    verificar:
      - { archivo: /etc/systemd/system/respaldo.service, contenido_incluye: "ExecStart=/usr/local/bin/respaldo.sh" }
      - { comando_usado: 'systemctl\s+daemon-reload' }
    pistas:
      - "Las unidades propias van en /etc/systemd/system/. Después, systemd tiene que volver a leer su configuración."
      - "`sudo cp ~/respaldo.service /etc/systemd/system/` y `sudo systemctl daemon-reload`"
    solucion: [sudo cp /home/ana/respaldo.service /etc/systemd/system/, sudo systemctl daemon-reload]
    explicacion: daemon-reload hace que systemd vuelva a leer los archivos de unidades. Hay que ejecutarlo cada vez que creás o cambiás uno.
  - consigna: Ejecutá el servicio una vez y mirá en el journal lo que escribió el script.
    verificar:
      - { comando_usado: 'systemctl\s+start\s+respaldo' }
      - { comando_usado: 'journalctl\s+.*-u\s*respaldo|journalctl\s+-u\s*respaldo' }
      - { salida_contiene: "Respaldo de /srv/datos guardado" }
    pistas:
      - "`sudo systemctl start respaldo` y después `journalctl -u respaldo`"
    solucion: [sudo systemctl start respaldo, journalctl -u respaldo]
    explicacion: >-
      Lo que el script muestra con echo queda en el journal, con el nombre del script y la hora.
      Así, si una noche falla, vas a poder ver por qué. systemctl status respaldo dice
      inactive (dead) con status=0/SUCCESS: terminó bien.
  - consigna: >-
      Creá el timer `/etc/systemd/system/respaldo.timer` (por ejemplo con `sudo nano`) con una
      sección [Timer] que tenga `OnCalendar=*-*-* 02:30:00` y `Persistent=true`, y una sección
      [Install] con `WantedBy=timers.target`.
    verificar:
      - { archivo: /etc/systemd/system/respaldo.timer, contenido_incluye: "OnCalendar=*-*-* 02:30" }
      - { archivo: /etc/systemd/system/respaldo.timer, contenido_incluye: "WantedBy=timers.target" }
      - { archivo: /etc/systemd/system/respaldo.timer, contenido_incluye: "[Timer]" }
    pistas:
      - "El timer se llama igual que el servicio: respaldo.timer activa respaldo.service."
      - |-
        Contenido:
        [Unit]
        Description=Respaldo diario de /srv/datos

        [Timer]
        OnCalendar=*-*-* 02:30:00
        Persistent=true

        [Install]
        WantedBy=timers.target
    solucion:
      - "printf '[Unit]\\nDescription=Respaldo diario de /srv/datos\\n\\n[Timer]\\nOnCalendar=*-*-* 02:30:00\\nPersistent=true\\n\\n[Install]\\nWantedBy=timers.target\\n' | sudo tee /etc/systemd/system/respaldo.timer"
    explicacion: Persistent=true hace que, si el servidor estaba apagado a las 2:30, el respaldo se ejecute apenas vuelva a encenderse.
  - consigna: Comprobá con systemd-analyze que la expresión significa lo que querés.
    verificar:
      - { comando_usado: 'systemd-analyze\s+calendar' }
    pistas:
      - "`systemd-analyze calendar '*-*-* 02:30:00'`"
    solucion: ["systemd-analyze calendar '*-*-* 02:30:00'"]
    explicacion: Next elapse dice cuándo será la próxima ejecución. Es la forma más rápida de evitar sorpresas con las fechas.
  - consigna: Habilitá y arrancá el timer (no el servicio) con un solo comando.
    verificar:
      - { servicio: respaldo.timer, activo: true, habilitado: true }
    pistas:
      - "enable --now, con el nombre completo: respaldo.timer"
      - "`sudo systemctl enable --now respaldo.timer`"
    solucion: [sudo systemctl enable --now respaldo.timer]
    explicacion: >-
      Se habilita el timer porque es el que tiene que quedar activo después de cada reinicio. El
      servicio no se habilita: lo lanza el timer. Como el archivo es nuevo, systemd lo encuentra
      solo; si hubieras cambiado uno que ya estaba cargado, haría falta daemon-reload.
  - consigna: Mirá la lista de timers y comprobá cuándo se va a ejecutar el respaldo.
    verificar:
      - { comando_usado: 'systemctl\s+list-timers' }
      - { salida_contiene: respaldo.timer }
    pistas:
      - "`systemctl list-timers`"
    solucion: [systemctl list-timers]
    explicacion: La columna NEXT dice cuándo, LEFT cuánto falta y LAST cuándo fue la última vez. También aparecen los timers del sistema, como logrotate.timer.
