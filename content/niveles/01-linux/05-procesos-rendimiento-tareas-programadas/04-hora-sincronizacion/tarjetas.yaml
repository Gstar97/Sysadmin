- { id: t1, frente: "¿Por qué importa la hora?", dorso: "Kerberos (5 min), certificados, códigos de un solo uso, cron y comparar registros entre servidores." }
- { id: t2, frente: "Zona horaria", dorso: "El reloj va en UTC; la zona cambia cómo se muestra. timedatectl set-timezone ZONA; date -u." }
- { id: t3, frente: "Estratos de NTP", dorso: "0: referencia (atómico, GPS). 1: conectados a ella. 2: públicos o de la empresa. 3: tus servidores." }
- { id: t4, frente: "chronyc sources", dorso: "^* en uso · ^+ combinada · ^? no responde. Reach 377 = respondió las últimas 8." }
- { id: t5, frente: "chronyc tracking", dorso: "System time: segundos fast/slow. Leap status: Normal = sincronizado." }
- { id: t6, frente: "chrony.conf", dorso: "server HOST iburst / pool NOMBRE iburst · makestep 1.0 3. Rocky: /etc/chrony.conf (chronyd). Ubuntu: /etc/chrony/chrony.conf (chrony)." }
