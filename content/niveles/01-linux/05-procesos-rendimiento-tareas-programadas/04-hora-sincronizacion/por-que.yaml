tipo: emparejar
consigna: Une cada problema con la causa más probable si el reloj del servidor está corrido.
pares:
  - { a: "Los usuarios no pueden iniciar sesión en el dominio de Active Directory", b: "Kerberos rechaza diferencias de más de 5 minutos" }
  - { a: "El navegador dice que el certificado todavía no es válido", b: "El servidor cree que está antes de la fecha de inicio del certificado" }
  - { a: "Los logs de dos servidores cuentan el mismo incidente en distinto orden", b: "Cada reloj marca una hora diferente" }
  - { a: "El respaldo de las 2:00 arrancó a las 2:07", b: "cron usa la hora del servidor, que está 7 minutos atrasada" }
  - { a: "Los códigos de verificación de la app de autenticación nunca coinciden", b: "Los códigos cambian cada 30 segundos según la hora" }
explicacion: >-
  Un reloj corrido rara vez da un error que diga "la hora está mal": aparece como fallos de
  autenticación, certificados o registros que no cierran. Por eso se revisa al principio.
