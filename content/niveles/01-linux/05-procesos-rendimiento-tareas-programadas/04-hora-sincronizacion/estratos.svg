<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <g fill="currentColor">
    <text x="20" y="40" font-weight="700">Estrato 0</text>
    <text x="20" y="56" font-size="11.5">la referencia</text>
    <text x="20" y="130" font-weight="700">Estrato 1</text>
    <text x="20" y="146" font-size="11.5">conectados a la referencia</text>
    <text x="20" y="220" font-weight="700">Estrato 2</text>
    <text x="20" y="236" font-size="11.5">públicos o de la empresa</text>
    <text x="20" y="300" font-weight="700">Estrato 3</text>
    <text x="20" y="316" font-size="11.5">tus servidores</text>
  </g>
  <g stroke="currentColor" fill="var(--warn-soft, #fbf0d0)">
    <rect x="240" y="22" width="150" height="40" rx="8"/>
    <rect x="460" y="22" width="150" height="40" rx="8"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="315" y="47">Reloj atómico</text>
    <text x="535" y="47">Satélites GPS</text>
  </g>
  <g stroke="currentColor" fill="var(--info-soft, #e0e9fd)">
    <rect x="240" y="112" width="150" height="40" rx="8"/>
    <rect x="460" y="112" width="150" height="40" rx="8"/>
    <rect x="200" y="202" width="180" height="40" rx="8"/>
    <rect x="470" y="202" width="180" height="40" rx="8"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="315" y="137">Servidor NTP</text>
    <text x="535" y="137">Servidor NTP</text>
    <text x="290" y="227">pool.ntp.org</text>
    <text x="560" y="227">ntp.empresa.local</text>
  </g>
  <g stroke="currentColor" fill="var(--ok-soft, #dcf5e4)">
    <rect x="160" y="282" width="120" height="36" rx="8"/>
    <rect x="300" y="282" width="120" height="36" rx="8"/>
    <rect x="440" y="282" width="120" height="36" rx="8"/>
    <rect x="580" y="282" width="120" height="36" rx="8"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">
    <text x="220" y="305">web01</text>
    <text x="360" y="305">db01</text>
    <text x="500" y="305">app01</text>
    <text x="640" y="305">backup01</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4" marker-end="url(#fl)" fill="none">
    <line x1="315" y1="62" x2="315" y2="110"/>
    <line x1="535" y1="62" x2="535" y2="110"/>
    <line x1="315" y1="152" x2="295" y2="200"/>
    <line x1="535" y1="152" x2="555" y2="200"/>
    <line x1="400" y1="152" x2="510" y2="200" stroke-dasharray="4 3"/>
    <line x1="270" y1="242" x2="225" y2="280"/>
    <line x1="530" y1="242" x2="365" y2="280"/>
    <line x1="560" y1="242" x2="500" y2="280"/>
    <line x1="590" y1="242" x2="635" y2="280"/>
  </g>
  <text x="680" y="40" fill="currentColor" font-size="11.5">Cada nivel copia la</text>
  <text x="680" y="56" fill="currentColor" font-size="11.5">hora del de arriba.</text>
  <text x="680" y="137" fill="currentColor" font-size="11.5">Cuanto más lejos de</text>
  <text x="680" y="153" fill="currentColor" font-size="11.5">la referencia, mayor</text>
  <text x="680" y="169" fill="currentColor" font-size="11.5">el número de estrato.</text>
</svg>
