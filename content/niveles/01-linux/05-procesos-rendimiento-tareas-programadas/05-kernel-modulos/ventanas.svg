<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <rect x="300" y="140" width="240" height="84" rx="12" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1.5"/>
  <text x="420" y="172" text-anchor="middle" font-weight="700" font-size="15" fill="currentColor">Kernel</text>
  <text x="420" y="192" text-anchor="middle" fill="currentColor">procesos, memoria, discos, red</text>
  <text x="420" y="210" text-anchor="middle" fill="currentColor" font-size="11.5">y los módulos que tiene cargados</text>

  <g stroke="currentColor" fill="var(--info-soft, #e0e9fd)">
    <rect x="20" y="20" width="250" height="92" rx="10"/>
    <rect x="570" y="20" width="250" height="92" rx="10"/>
    <rect x="20" y="250" width="250" height="92" rx="10"/>
    <rect x="570" y="250" width="250" height="92" rx="10"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="44" font-weight="700" font-family="ui-monospace, monospace">/proc</text>
    <text x="34" y="64">Un archivo por dato: cada proceso</text>
    <text x="34" y="81">(/proc/PID), la memoria (meminfo),</text>
    <text x="34" y="98">la carga (loadavg), la CPU (cpuinfo).</text>

    <text x="584" y="44" font-weight="700" font-family="ui-monospace, monospace">/proc/sys  →  sysctl</text>
    <text x="584" y="64">Ajustes del kernel que se pueden</text>
    <text x="584" y="81">cambiar en marcha. Permanentes con</text>
    <text x="584" y="98">un archivo en /etc/sysctl.d.</text>

    <text x="34" y="274" font-weight="700" font-family="ui-monospace, monospace">/sys</text>
    <text x="34" y="294">Los dispositivos y su estado: placas</text>
    <text x="34" y="311">de red, discos, CPU, y los módulos</text>
    <text x="34" y="328">cargados con sus parámetros.</text>

    <text x="584" y="274" font-weight="700" font-family="ui-monospace, monospace">/lib/modules  →  modprobe</text>
    <text x="584" y="294">Piezas del kernel en archivos .ko:</text>
    <text x="584" y="311">se cargan cuando hacen falta y se</text>
    <text x="584" y="328">bloquean en /etc/modprobe.d.</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#fk)">
    <line x1="300" y1="160" x2="260" y2="114"/>
    <line x1="540" y1="160" x2="580" y2="114"/>
    <line x1="580" y1="114" x2="545" y2="156" stroke-dasharray="4 3"/>
    <line x1="300" y1="206" x2="260" y2="250"/>
    <line x1="610" y1="250" x2="545" y2="214"/>
  </g>
  <text x="420" y="122" text-anchor="middle" fill="currentColor" font-size="11.5">leer: el kernel informa · escribir en /proc/sys: el kernel cambia</text>
  <text x="420" y="246" text-anchor="middle" fill="currentColor" font-size="11.5">no son archivos en el disco: el kernel los arma al leerlos</text>
</svg>
