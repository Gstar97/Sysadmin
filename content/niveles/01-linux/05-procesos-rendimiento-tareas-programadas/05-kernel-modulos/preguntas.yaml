- id: p01
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Qué es /proc?
  opciones:
    - { texto: "Una carpeta que el kernel arma al momento de leerla, con el estado del sistema y de cada proceso", correcta: true, explicacion: "No ocupa lugar en el disco." }
    - { texto: "La carpeta donde se instalan los programas", explicacion: "Eso es /usr." }
    - { texto: "Una copia de seguridad de los procesos", explicacion: "Es el estado actual, no una copia." }
    - { texto: "La carpeta de los registros", explicacion: "Los registros están en /var/log." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  enunciado: Cambiás un valor con sudo sysctl -w y al día siguiente, después de un reinicio, volvió al anterior. ¿Por qué?
  opciones:
    - { texto: "sysctl -w es temporal: para que sea permanente va en un archivo de /etc/sysctl.d/", correcta: true, explicacion: "Y se aplica sin reiniciar con sysctl --system." }
    - { texto: "Alguien lo revirtió", explicacion: "No hace falta: -w no sobrevive al reinicio." }
    - { texto: "El kernel no acepta cambios", explicacion: "Los acepta, mientras está encendido." }
    - { texto: "Hay que reiniciar dos veces", explicacion: "No tiene relación." }
- id: p03
  tipo: completar_comando
  enunciado: Escribí el comando que aplica, sin reiniciar, todos los archivos de configuración de sysctl.
  aceptadas: [sudo sysctl --system, sysctl --system]
  explicacion: Lee /usr/lib/sysctl.d, /etc/sysctl.d y /etc/sysctl.conf en orden.
- id: p04
  tipo: opcion_multiple
  enunciado: ¿Qué hace la línea install usb-storage /bin/false en /etc/modprobe.d/?
  opciones:
    - { texto: "Hace que cualquier intento de cargar el módulo ejecute /bin/false y falle", correcta: true, explicacion: "Bloquea también la carga manual y como dependencia." }
    - { texto: "Instala el módulo", explicacion: "Reemplaza la carga por otro comando." }
    - { texto: "Borra el archivo del módulo", explicacion: "El archivo sigue en /lib/modules." }
    - { texto: "Lo carga en cada arranque", explicacion: "Eso es modules-load.d." }
- id: p05
  tipo: interpretar_salida
  enunciado: Intentás quitar un módulo y ves esto. ¿Qué pasa?
  salida: |
    $ sudo modprobe -r xfs
    modprobe: FATAL: Module xfs is in use.
  opciones:
    - { texto: "Hay un sistema de archivos XFS montado que lo está usando", correcta: true, explicacion: "No se puede quitar un módulo en uso." }
    - { texto: "El módulo está dañado", explicacion: "Está funcionando." }
    - { texto: "Falta sudo", explicacion: "Se usó sudo." }
    - { texto: "XFS no es un módulo", explicacion: "Sí lo es; por eso modprobe lo reconoce." }
- id: p06
  tipo: completar_comando
  enunciado: Escribí el comando que muestra la versión del kernel en ejecución.
  aceptadas: [uname -r]
  explicacion: uname -a muestra más datos, incluida la versión.
- id: p07
  tipo: opcion_multiple
  enunciado: ¿Dónde ves la dirección MAC de la placa enp0s3 sin usar ningún comando de red?
  opciones:
    - { texto: "/sys/class/net/enp0s3/address", correcta: true, explicacion: "/sys muestra los dispositivos." }
    - { texto: "/proc/net/enp0s3", explicacion: "Ese archivo no existe." }
    - { texto: "/etc/enp0s3", explicacion: "/etc es configuración." }
    - { texto: "/dev/enp0s3", explicacion: "Las placas de red no están en /dev." }
- id: p08
  tipo: opcion_multiple
  enunciado: ¿Cómo leés la línea de comandos completa del proceso 812?
  opciones:
    - { texto: "tr '\\0' ' ' < /proc/812/cmdline", correcta: true, explicacion: "Los argumentos están separados por el byte cero." }
    - { texto: "cat /proc/812", explicacion: "Es una carpeta." }
    - { texto: "sysctl 812", explicacion: "sysctl es para ajustes del kernel." }
    - { texto: "lsmod 812", explicacion: "lsmod muestra módulos." }
- id: p09
  tipo: opcion_multiple
  enunciado: Una guía dice que pongas net.ipv4.ip_forward = 1. ¿Qué hace ese ajuste?
  opciones:
    - { texto: "Permite que el servidor reenvíe paquetes entre redes, como un router", correcta: true, explicacion: "Lo necesitan los routers, las VPN y los contenedores. En un servidor común, dejalo en 0." }
    - { texto: "Acelera la red", explicacion: "No cambia la velocidad." }
    - { texto: "Activa IPv4", explicacion: "IPv4 ya está activo." }
    - { texto: "Abre el firewall", explicacion: "No toca el firewall." }
