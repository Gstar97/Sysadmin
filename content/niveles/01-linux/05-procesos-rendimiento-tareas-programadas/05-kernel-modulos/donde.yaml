tipo: emparejar
consigna: Uní cada pregunta con dónde (o con qué) encontrar la respuesta.
pares:
  - { a: "¿Qué versión del kernel está corriendo?", b: "uname -r" }
  - { a: "¿Con qué parámetros arrancó el kernel?", b: "/proc/cmdline" }
  - { a: "¿Cuánta memoria le queda disponible?", b: "/proc/meminfo" }
  - { a: "¿El servidor reenvía paquetes entre redes?", b: "sysctl net.ipv4.ip_forward" }
  - { a: "¿Está cargado el módulo de almacenamiento USB?", b: "lsmod | grep usb_storage" }
  - { a: "¿Cuál es la dirección MAC de la placa de red?", b: "/sys/class/net/enp0s3/address" }
explicacion: >-
  /proc y /sys no ocupan lugar en el disco: el kernel arma su contenido en el momento en que lo
  leés. Por eso siempre muestran el estado actual.
