- { id: t1, frente: "/proc", dorso: "Estado del sistema (meminfo, loadavg, cpuinfo, cmdline) y /proc/PID por proceso (status, cmdline, fd)." }
- { id: t2, frente: "/sys", dorso: "Dispositivos (/sys/class/net, /sys/block) y módulos cargados (/sys/module)." }
- { id: t3, frente: "sysctl", dorso: "sysctl clave (ver) · -w clave=valor (hasta el reinicio) · archivo en /etc/sysctl.d + sysctl --system (permanente)." }
- { id: t4, frente: "Módulos", dorso: "lsmod · modinfo · modprobe NOMBRE · modprobe -r NOMBRE. Archivos .ko en /lib/modules/VERSIÓN." }
- { id: t5, frente: "Bloquear un módulo", dorso: "/etc/modprobe.d/x.conf: blacklist NOMBRE + install NOMBRE /bin/false." }
- { id: t6, frente: "Cargar un módulo en el arranque", dorso: "Su nombre en un archivo de /etc/modules-load.d/." }
