<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <rect x="330" y="20" width="200" height="56" rx="10" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="430" y="44" text-anchor="middle" font-weight="700" fill="currentColor">R · corriendo</text>
  <text x="430" y="63" text-anchor="middle" font-size="11.5" fill="currentColor">usando la CPU o esperando turno</text>

  <rect x="40" y="140" width="210" height="56" rx="10" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="145" y="164" text-anchor="middle" font-weight="700" fill="currentColor">S · durmiendo</text>
  <text x="145" y="183" text-anchor="middle" font-size="11.5" fill="currentColor">espera algo (red, teclado, tiempo)</text>

  <rect x="325" y="140" width="210" height="56" rx="10" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="430" y="164" text-anchor="middle" font-weight="700" fill="currentColor">D · esperando el disco</text>
  <text x="430" y="183" text-anchor="middle" font-size="11.5" fill="currentColor">no atiende señales hasta que vuelve</text>

  <rect x="610" y="140" width="210" height="56" rx="10" fill="var(--surface-2, #eef2f5)" stroke="currentColor"/>
  <text x="715" y="164" text-anchor="middle" font-weight="700" fill="currentColor">T · detenido</text>
  <text x="715" y="183" text-anchor="middle" font-size="11.5" fill="currentColor">pausado (Ctrl+Z o SIGSTOP)</text>

  <rect x="330" y="252" width="200" height="56" rx="10" fill="var(--bad-soft, #fde2e2)" stroke="currentColor"/>
  <text x="430" y="276" text-anchor="middle" font-weight="700" fill="currentColor">Z · zombi</text>
  <text x="430" y="295" text-anchor="middle" font-size="11.5" fill="currentColor">ya terminó; su padre no lo "recogió"</text>

  <g stroke="currentColor" stroke-width="1.4" marker-end="url(#a)" fill="none">
    <path d="M360 78 Q250 100 190 138"/>
    <path d="M205 138 Q290 100 345 80"/>
    <line x1="430" y1="78" x2="430" y2="138"/>
    <path d="M500 78 Q610 100 680 138"/>
    <path d="M665 138 Q560 100 515 80"/>
    <path d="M530 50 Q720 60 760 250 Q700 300 532 282"/>
  </g>
  <text x="190" y="104" font-size="11" fill="currentColor">espera</text>
  <text x="285" y="128" font-size="11" fill="currentColor">llegó</text>
  <text x="438" y="114" font-size="11" fill="currentColor">lee o escribe</text>
  <text x="600" y="104" font-size="11" fill="currentColor">STOP</text>
  <text x="560" y="128" font-size="11" fill="currentColor">CONT</text>
  <text x="742" y="230" font-size="11" fill="currentColor">termina</text>
</svg>
