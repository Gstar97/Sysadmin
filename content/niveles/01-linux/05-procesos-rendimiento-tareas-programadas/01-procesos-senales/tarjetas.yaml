- { id: t1, frente: "Ver procesos", dorso: "ps aux --sort=-%cpu · ps -eo pid,ppid,stat,cmd · pgrep -a/-f · pstree -p · top (P, M, k, r)" }
- { id: t2, frente: "Estados", dorso: "R corriendo · S esperando · D esperando el disco (no atiende señales) · T detenido · Z zombi" }
- { id: t3, frente: "Señales principales", dorso: "TERM 15 (normal) · KILL 9 (último recurso) · HUP 1 (releer config) · INT 2 (Ctrl+C) · STOP 19 / CONT 18" }
- { id: t4, frente: "Orden para terminar", dorso: "kill PID → esperar → kill -9 PID solo si no respondió. Servicios: systemctl stop." }
- { id: t5, frente: "Zombi", dorso: "Ya terminó; no se puede matar. Desaparece cuando el padre (PPID) lo recoge o termina." }
- { id: t6, frente: "nice", dorso: "-20 (más prioridad) a 19 (menos). nice -n 10 comando · renice 10 -p PID. Subir prioridad: root." }
- { id: t7, frente: "Trabajos", dorso: "comando & · jobs · fg %1 · Ctrl+Z · bg %1 · kill %1. Mueren al cerrar la sesión (salvo nohup)." }
