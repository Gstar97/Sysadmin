tipo: emparejar
consigna: Une cada señal con lo que le pide al proceso.
pares:
  - { a: "SIGTERM (15)", b: "Que termine prolijamente: es lo que manda kill si no dices nada" }
  - { a: "SIGKILL (9)", b: "Que termine ya: el proceso no puede ignorarla ni limpiar nada" }
  - { a: "SIGHUP (1)", b: "Muchos servicios la usan para volver a leer su configuración" }
  - { a: "SIGINT (2)", b: "La que manda Ctrl+C a lo que está en primer plano" }
  - { a: "SIGSTOP (19)", b: "Pausarlo, sin terminarlo" }
  - { a: "SIGCONT (18)", b: "Que siga después de una pausa" }
explicacion: >-
  El orden correcto es TERM primero y esperar unos segundos; KILL solo si no responde. Con KILL el
  programa no cierra sus archivos ni termina lo que estaba escribiendo.
