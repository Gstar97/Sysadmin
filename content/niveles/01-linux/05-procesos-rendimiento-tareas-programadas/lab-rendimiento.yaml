tipo: pasos
titulo: Rendimiento, tareas programadas y hora en tus servidores
descripcion: >-
  Vas a provocar un problema de CPU en rocky01 y resolverlo sin cortar nada, dejar un reporte
  diario de uso programado con cron, y hacer que rocky01 tome la hora de ubuntu01, como en una
  empresa con un servidor de hora interno.
pasos:
  - titulo: Activa el historial de rendimiento
    detalle: >-
      En los dos servidores. Desde ahora, sar va a poder contarte qué pasó en cualquier momento
      (el historial empieza el día que lo activas).
    comandos:
      - sudo dnf install -y sysstat        # en ubuntu01, sudo apt install -y sysstat
      - sudo systemctl enable --now sysstat
      - nproc; uptime
    comprobar: systemctl status sysstat dice active y anotaste cuántas CPU tiene cada servidor.
  - titulo: Provoca un proceso que consume toda una CPU
    detalle: >-
      yes escribe "y" sin parar; mandando la salida a /dev/null, solo consume CPU. Es un
      reemplazo seguro de "el informe que se colgó".
    comandos:
      - yes > /dev/null &
      - uptime
      - top -b -n 1 | head -12
      - mpstat -P ALL 2 1
    comprobar: top muestra yes cerca de 100 % y mpstat muestra una CPU casi sin tiempo libre (idle) y la otra tranquila.
  - titulo: Bájale la prioridad sin cortarlo
    comandos:
      - pgrep -a yes
      - renice 19 -p $(pgrep -x yes)
      - ps -o pid,ni,stat,%cpu,cmd -p $(pgrep -x yes)
    comprobar: La columna NI muestra 19 y top lo muestra en la parte ni de la CPU en lugar de us.
    si_falla: Si renice responde "Permission denied", el proceso no es tuyo; con sudo funciona, pero en este caso es tuyo.
  - titulo: Termínalo como corresponde
    comandos:
      - kill %1          # o kill PID: manda TERM
      - jobs; pgrep yes || echo "ya no está"
    comprobar: pgrep no encuentra nada y uptime muestra la carga bajando en los minutos siguientes.
  - titulo: Escribe el script del reporte de uso
    detalle: >-
      Un script simple que junta lo que mirarías a la mañana. En el módulo 1.7 vas a aprender a
      escribirlos mejor; por ahora, copia este con nano.
    comandos:
      - sudo nano /usr/local/bin/reporte-uso.sh
      - sudo chmod 755 /usr/local/bin/reporte-uso.sh
      - sudo mkdir -p /var/log/reporte-uso
      - sudo /usr/local/bin/reporte-uso.sh && sudo ls /var/log/reporte-uso
    archivo:
      ruta: /usr/local/bin/reporte-uso.sh
      contenido: |
        #!/bin/bash
        # Reporte diario de uso: disco, memoria, carga y los procesos que más consumen.
        salida=/var/log/reporte-uso/$(date +%F).txt
        {
          echo "== Reporte de $(hostname) del $(date '+%F %R') =="
          echo; /usr/bin/uptime
          echo; /usr/bin/df -h -x tmpfs -x devtmpfs
          echo; /usr/bin/free -h
          echo; /usr/bin/ps aux --sort=-%cpu | head -6
        } > "$salida"
    comprobar: En /var/log/reporte-uso hay un archivo con la fecha de hoy y su contenido se lee bien.
  - titulo: Prográmalo con cron y pruébalo
    detalle: >-
      Primero lo programas para dentro de 2 o 3 minutos (mira la hora con date) y, cuando
      compruebes que funcionó, le pones el horario de verdad: de lunes a viernes a las 7:45.
    comandos:
      - date
      - sudo nano /etc/cron.d/reporte-uso
      - sudo tail -f /var/log/cron      # espera la hora; Ctrl+C para salir
    archivo:
      ruta: /etc/cron.d/reporte-uso
      contenido: |
        # Reporte diario de uso del servidor (ver /usr/local/bin/reporte-uso.sh).
        # Prueba: poner minuto y hora de dentro de 2 minutos. Definitivo: 45 7 * * 1-5
        45 7 * * 1-5  root  /usr/local/bin/reporte-uso.sh >> /var/log/reporte-uso/cron.log 2>&1
    comprobar: /var/log/cron muestra la línea CMD con reporte-uso.sh y cron.log quedó vacío (sin errores).
    si_falla: >-
      Si no aparece en el registro, revisa que la línea tenga la columna de usuario (root) y que el
      archivo de /etc/cron.d no tenga punto en el nombre. Si aparece pero no hay reporte, mira
      cron.log.
  - titulo: Convierte ubuntu01 en el servidor de hora del laboratorio
    detalle: >-
      En ubuntu01. Ubuntu 24.04 usa systemd-timesyncd: al instalar chrony, lo reemplaza. Busca la
      IP de ubuntu01 en la red solo-anfitrión con ip -4 addr (la de 192.168.56.x).
    comandos:
      - sudo apt install -y chrony
      - echo "allow 192.168.56.0/24" | sudo tee /etc/chrony/conf.d/laboratorio.conf
      - sudo systemctl restart chrony
      - chronyc sources
      - ip -4 addr
    comprobar: chronyc sources muestra una fuente con ^* (ubuntu01 tiene internet por la otra placa) y anotaste su IP.
  - titulo: Haz que rocky01 tome la hora de ubuntu01
    detalle: >-
      En rocky01. Reemplaza la línea pool por la IP de ubuntu01 (usa la tuya en lugar de
      192.168.56.102) y pon la zona horaria de tu ciudad.
    comandos:
      - sudo cp /etc/chrony.conf /etc/chrony.conf.bak
      - sudo sed -i 's/^pool .*/server 192.168.56.102 iburst/' /etc/chrony.conf
      - sudo systemctl restart chronyd
      - chronyc sources
      - chronyc tracking
      - timedatectl list-timezones | grep America
      - sudo timedatectl set-timezone America/Bogota
      - timedatectl
    comprobar: chronyc sources muestra la IP de ubuntu01 con ^*, y timedatectl dice System clock synchronized yes con tu zona.
    si_falla: >-
      Si queda en ^?, revisa desde rocky01 que llegas a ubuntu01 (ping) y que el archivo de
      ubuntu01 tiene la red correcta en allow. Si ubuntu01 tuviera activo el firewall (ufw), haría
      falta abrir el puerto 123/udp (módulo 1.6).
  - titulo: Mira el historial al día siguiente
    detalle: Después de unas horas (o al otro día), consulta lo que guardó sar.
    comandos:
      - sar -u | head -20
      - sar -q | tail -5
      - ls /var/log/reporte-uso
    comprobar: En sar -u se ve el pico de CPU de la hora en que corriste yes.
  - titulo: Documenta
    detalle: >-
      En tu cuaderno técnico: qué hace el reporte, dónde está el script, cuándo corre y dónde deja
      los archivos; qué servidor da la hora a cuál, y la zona horaria elegida.
    comprobar: Otra persona podría cambiar el horario del reporte o el servidor de hora leyendo solo tu documento.
