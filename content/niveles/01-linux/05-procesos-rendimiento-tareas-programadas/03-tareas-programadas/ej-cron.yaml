tipo: terminal
shell: bash
titulo: Programar el reporte diario
descripcion: >-
  Hay un script que genera un reporte de uso del disco. Tu jefa quiere que se ejecute todos los
  días hábiles a las 7:45 y que quede registro de cada ejecución. Además, el viernes a la noche
  hay que reiniciar un servicio una sola vez.
estado_inicial:
  distro: rocky
  hostname: app01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
  paquetes:
    instalados: [nginx]
  archivos:
    /usr/local/bin/reporte-disco.sh:
      contenido: |
        #!/bin/bash
        echo "Reporte del $(date +%F)"
        df -h /
      modo: "0755"
pasos:
  - consigna: Mirá si ya tenés tareas programadas en tu crontab.
    verificar:
      - { comando_usado: 'crontab\s+-l' }
    pistas:
      - "`crontab -l`"
    solucion: [crontab -l]
    explicacion: '"no crontab for ana": todavía no tenés ninguna.'
  - consigna: >-
      Intentá instalar esta línea, que tiene un error, para ver cómo responde crontab:
      `45 25 * * 1-5 /usr/local/bin/reporte-disco.sh`
    verificar:
      - { comando_usado: 'crontab\s+-\s*$|crontab\s+-$' }
      - { salida_contiene: bad hour }
    pistas:
      - "Podés pasarle la línea por una tubería: echo 'línea' | crontab -"
      - "`echo '45 25 * * 1-5 /usr/local/bin/reporte-disco.sh' | crontab -`"
    solucion: ["echo '45 25 * * 1-5 /usr/local/bin/reporte-disco.sh' | crontab -"]
    explicacion: La hora va de 0 a 23. crontab valida antes de guardar, igual que si usaras crontab -e.
  - consigna: >-
      Instalá la línea correcta: de lunes a viernes a las 7:45, guardando la salida y los errores
      al final de /home/ana/reporte.log.
    verificar:
      - { archivo: /var/spool/cron/ana, contenido_incluye: "45 7 * * 1-5" }
      - { archivo: /var/spool/cron/ana, contenido_incluye: ">> /home/ana/reporte.log 2>&1" }
    pistas:
      - "La línea: 45 7 * * 1-5 /usr/local/bin/reporte-disco.sh >> /home/ana/reporte.log 2>&1"
      - "`echo '45 7 * * 1-5 /usr/local/bin/reporte-disco.sh >> /home/ana/reporte.log 2>&1' | crontab -`"
    solucion: ["echo '45 7 * * 1-5 /usr/local/bin/reporte-disco.sh >> /home/ana/reporte.log 2>&1' | crontab -"]
    explicacion: >-
      Sin redirigir la salida, cron intenta mandarla por correo, y en la mayoría de los
      servidores eso no llega a nadie. Con el log, cada ejecución deja rastro. En el trabajo
      diario usarías crontab -e, que abre un editor.
  - consigna: Comprobá qué quedó en tu crontab.
    verificar:
      - { comando_usado: 'crontab\s+-l' }
      - { salida_contiene: reporte-disco.sh }
    pistas:
      - "`crontab -l`"
    solucion: [crontab -l]
    explicacion: Cuidado con echo ... | crontab -, que reemplaza el crontab entero. Para agregar una línea a lo que ya hay se usa (crontab -l; echo 'línea nueva') | crontab -.
  - consigna: Instalá at, arranca su servicio y programa un reinicio de nginx para hoy a las 23:30.
    verificar:
      - { paquete: at, instalado: true }
      - { servicio: atd, activo: true }
      - { comando_usado: '\|\s*(sudo\s+)?at\s+23:30' }
    pistas:
      - "at lee los comandos de la entrada estándar: echo 'comando' | at HORA. El reinicio necesita root, así que la tarea va en el at de root (sudo at)."
      - "`sudo dnf install -y at`, `sudo systemctl enable --now atd` y `echo 'systemctl restart nginx' | sudo at 23:30`"
    solucion: [sudo dnf install -y at, sudo systemctl enable --now atd, "echo 'systemctl restart nginx' | sudo at 23:30"]
    explicacion: at es para una sola vez; cron, para lo que se repite.
  - consigna: Mirá la cola de tareas de at de root.
    verificar:
      - { comando_usado: 'atq' }
      - { salida_contiene: '23:30' }
    pistas:
      - "`sudo atq`"
    solucion: [sudo atq]
    explicacion: El número de la izquierda sirve para cancelarla con atrm si cambian los planes.
