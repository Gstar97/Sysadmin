tipo: emparejar
consigna: Une cada línea de crontab con cuándo se ejecuta.
pares:
  - { a: "0 * * * *", b: "Al principio de cada hora" }
  - { a: "*/15 * * * *", b: "Cada 15 minutos" }
  - { a: "30 2 * * *", b: "Todos los días a las 2:30" }
  - { a: "0 8 * * 1-5", b: "De lunes a viernes a las 8:00" }
  - { a: "0 0 1 * *", b: "El primer día de cada mes a la medianoche" }
  - { a: "@reboot", b: "Una vez, cada vez que arranca el servidor" }
explicacion: >-
  Un error común: "* 2 * * *" no es "a las 2", es cada minuto entre las 2:00 y las 2:59 (60
  veces). Para una vez por día, el minuto tiene que ser un número.
