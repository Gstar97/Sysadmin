- { id: t1, frente: "Campos de crontab", dorso: "minuto hora día-del-mes mes día-de-la-semana comando. * cualquiera, , lista, - rango, / cada tanto." }
- { id: t2, frente: "crontab", dorso: "-l ver · -e editar (valida al guardar) · -r borrar todo, sin preguntar · -u USUARIO (root)." }
- { id: t3, frente: "/etc/cron.d", dorso: "Tareas del sistema, un archivo por tarea, con una columna de usuario después del horario." }
- { id: t4, frente: "Los tres errores de cron", dorso: "PATH mínima (rutas completas), % es salto de línea (\\%), salida perdida (>> log 2>&1)." }
- { id: t5, frente: "¿Corrió la tarea?", dorso: "Rocky: /var/log/cron o journalctl -u crond. Ubuntu: journalctl -u cron." }
- { id: t6, frente: "at", dorso: "Una sola vez: echo comando | at 23:30. atq lista, atrm N cancela. Paquete at, servicio atd." }
- { id: t7, frente: "cron o timer", dorso: "cron: una línea, en todos lados. Timer: journal, list-timers, Persistent=true, no se superpone." }
