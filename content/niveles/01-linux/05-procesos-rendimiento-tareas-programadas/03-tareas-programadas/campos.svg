<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="28" font-weight="700" font-size="14" fill="currentColor">Una línea de crontab</text>
  <g font-family="ui-monospace, monospace" font-size="20" fill="currentColor">
    <rect x="20" y="46" width="60" height="44" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
    <text x="50" y="76" text-anchor="middle">30</text>
    <rect x="90" y="46" width="60" height="44" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
    <text x="120" y="76" text-anchor="middle">2</text>
    <rect x="160" y="46" width="60" height="44" rx="6" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
    <text x="190" y="76" text-anchor="middle">*</text>
    <rect x="230" y="46" width="60" height="44" rx="6" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
    <text x="260" y="76" text-anchor="middle">*</text>
    <rect x="300" y="46" width="70" height="44" rx="6" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
    <text x="335" y="76" text-anchor="middle">1-5</text>
    <rect x="380" y="46" width="460" height="44" rx="6" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
    <text x="392" y="74" font-size="15">/usr/local/bin/respaldo.sh &gt;&gt; /var/log/respaldo.log 2&gt;&amp;1</text>
  </g>
  <g font-size="12" fill="currentColor" text-anchor="middle">
    <text x="50" y="112" font-weight="700">minuto</text><text x="50" y="128">0-59</text>
    <text x="120" y="112" font-weight="700">hora</text><text x="120" y="128">0-23</text>
    <text x="190" y="112" font-weight="700">día del</text><text x="190" y="128">mes 1-31</text>
    <text x="260" y="112" font-weight="700">mes</text><text x="260" y="128">1-12</text>
    <text x="335" y="112" font-weight="700">día de la</text><text x="335" y="128">semana 0-7</text>
    <text x="610" y="112" font-weight="700">el comando (con ruta completa y su salida a un log)</text>
  </g>
  <text x="20" y="168" fill="currentColor">Se lee: a las 2:30, cualquier día del mes, cualquier mes, de lunes a viernes.</text>
  <text x="20" y="194" fill="currentColor">*  cualquiera     ,  lista (1,15)     -  rango (1-5)     /  cada tanto (*/10 = cada 10)</text>
  <text x="20" y="220" fill="currentColor">El día de la semana: 0 y 7 son domingo, 1 lunes... 6 sábado (también acepta mon, tue...).</text>
  <text x="20" y="246" fill="currentColor">Abreviaturas: @reboot (al arrancar) · @hourly · @daily · @weekly · @monthly</text>
</svg>
