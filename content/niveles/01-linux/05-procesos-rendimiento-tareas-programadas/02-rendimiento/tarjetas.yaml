- { id: t1, frente: "Método", dorso: "Carga (uptime) → CPU (top, mpstat) → memoria (free, vmstat) → disco (iostat -x, iotop) → historial (sar)." }
- { id: t2, frente: "Load average", dorso: "Promedio de procesos que quieren CPU o esperan el disco (1, 5 y 15 min). Comparar con nproc." }
- { id: t3, frente: "Línea de CPU de top", dorso: "us/sy: trabajando · id: libre · wa: esperando el disco · st: robada por el hipervisor." }
- { id: t4, frente: "Memoria", dorso: "Mirar available, no free. buff/cache se devuelve sola. si/so ≠ 0 en vmstat = falta RAM." }
- { id: t5, frente: "Disco saturado", dorso: "wa alto, procesos en D, %util ≈ 100 y await alto en iostat -x. iotop dice quién." }
- { id: t6, frente: "sar", dorso: "Paquete sysstat; systemctl enable --now sysstat. sar -u (CPU), -r (memoria), -q (carga), -b (disco)." }
- { id: t7, frente: "Aliviar sin cortar", dorso: "renice 10 -p PID (CPU) · ionice -c 3 -p PID (disco) · tareas pesadas de madrugada." }
