tipo: emparejar
consigna: Une cada síntoma con el recurso que está en problemas.
pares:
  - { a: "us alto y un proceso al 100 % en top", b: "CPU: un programa la está usando toda" }
  - { a: "wa alto, procesos en estado D y %util cerca de 100 en iostat", b: "Disco: no da abasto con las lecturas y escrituras" }
  - { a: "available bajo y si/so distintos de 0 en vmstat", b: "Memoria: falta RAM y se está usando la swap" }
  - { a: "st alto de forma constante", b: "El anfitrión de la máquina virtual está sobrecargado" }
  - { a: "Load average alto con la CPU casi libre", b: "Procesos esperando el disco (en Linux también suman a la carga)" }
  - { a: "Mensajes de Out of memory en journalctl -k", b: "El kernel mató procesos porque se quedó sin memoria" }
explicacion: >-
  Casi siempre el problema es uno solo de los cuatro recursos (CPU, memoria, disco o red). La
  idea es descartar de a uno, con números, antes de cambiar nada.
