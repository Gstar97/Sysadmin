tipo: terminal
shell: bash
titulo: Repetir sin repetirte
descripcion: >-
  En app01 hay una carpeta ~/logs con registros de una aplicación, una lista de servidores con
  comentarios y un archivo con los tamaños de los respaldos de la semana. Vas a recorrerlos con
  bucles.
estado_inicial:
  distro: rocky
  hostname: app01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
  archivos:
    /home/ana/logs/ventas.log: "10:01 pedido 1\n10:05 pedido 2\n10:09 pedido 3\n"
    /home/ana/logs/stock.log: "09:00 inicio\n09:30 ajuste\n"
    /home/ana/logs/pagos.log: "11:00 pago 1\n"
    /home/ana/servidores.txt: "# servidores de producción\nweb01\nweb02\n\n# base de datos\ndb01\n"
    /home/ana/tamanos.txt: "120\n118\n125\n130\n0\n127\n122\n"
pasos:
  - consigna: Recorre una lista fija de servidores y muestra "Revisando NOMBRE" para cada uno (web01, web02 y db01).
    verificar:
      - { comando_usado: 'for\s+\w+\s+in\s+web01' }
      - { salida_contiene: Revisando db01 }
    pistas:
      - "`for s in web01 web02 db01; do echo \"Revisando $s\"; done`"
    solucion: ['for s in web01 web02 db01; do echo "Revisando $s"; done']
    explicacion: El for asigna cada palabra a la variable y ejecuta el cuerpo una vez por cada una.
  - consigna: Muestra cuántas líneas tiene cada .log de ~/logs.
    verificar:
      - { comando_usado: 'for\s+\w+\s+in\s+.*logs/\*\.log' }
      - { salida_contiene: "ventas.log: 3" }
    pistas:
      - "wc -l < archivo da solo el número."
      - "`for f in ~/logs/*.log; do echo \"$(basename \"$f\"): $(wc -l < \"$f\")\"; done`"
    solucion: ['for f in ~/logs/*.log; do echo "$(basename "$f"): $(wc -l < "$f")"; done']
    explicacion: El comodín arma la lista de archivos antes de empezar. basename deja solo el nombre.
  - consigna: Comprime cada .log con gzip en un bucle.
    verificar:
      - { archivo: /home/ana/logs/ventas.log.gz, existe: true }
      - { archivo: /home/ana/logs/pagos.log.gz, existe: true }
    pistas:
      - "`for f in ~/logs/*.log; do gzip \"$f\"; done`"
    solucion: ['for f in ~/logs/*.log; do gzip "$f"; done']
    explicacion: Así se hace a mano lo que hace logrotate. Las comillas en "$f" protegen nombres con espacios.
  - consigna: >-
      Recorre ~/servidores.txt línea por línea y muestra "ping a NOMBRE", sin procesar las líneas
      vacías y los comentarios con continue.
    verificar:
      - { comando_usado: 'while\s+.*read' }
      - { comando_usado: 'continue' }
      - { salida_contiene: ping a db01 }
      - { salida_no_contiene: "ping a #" }
    pistas:
      - "Dentro del bucle: [[ -z $s || $s == \\#* ]] && continue"
      - "`while read -r s; do [[ -z $s || $s == \\#* ]] && continue; echo \"ping a $s\"; done < ~/servidores.txt`"
    solucion: ['while read -r s; do [[ -z $s || $s == \#* ]] && continue; echo "ping a $s"; done < ~/servidores.txt']
    explicacion: continue pasa a la línea siguiente sin ejecutar el resto del cuerpo. Así el archivo puede tener comentarios.
  - consigna: >-
      Suma los tamaños de ~/tamanos.txt usando cat y una tubería hacia el while, y muestra el
      total después del bucle. Fíjate en el resultado.
    verificar:
      - { comando_usado: 'cat\s+.*tamanos\.txt\s*\|\s*while' }
      - { salida_contiene: "Total: 0" }
    pistas:
      - "`total=0; cat ~/tamanos.txt | while read -r n; do ((total += n)); done; echo \"Total: $total\"`"
    solucion: ['total=0; cat ~/tamanos.txt | while read -r n; do ((total += n)); done; echo "Total: $total"']
    explicacion: >-
      ¡0! Cada parte de una tubería corre aparte, así que el while sumó en su propia copia de
      total, que se perdió al terminar. Es una de las trampas más famosas de bash.
  - consigna: Hazlo bien, pasando el archivo al while con < en lugar de la tubería.
    verificar:
      - { comando_usado: 'done\s*<\s*~?/?\S*tamanos\.txt' }
      - { salida_contiene: "Total: 742" }
    pistas:
      - "`total=0; while read -r n; do ((total += n)); done < ~/tamanos.txt; echo \"Total: $total\"`"
    solucion: ['total=0; while read -r n; do ((total += n)); done < ~/tamanos.txt; echo "Total: $total"']
    explicacion: Con < el while corre en el mismo shell y la variable queda. (Si los datos vienen de un comando, usa done < <(comando).)
  - consigna: >-
      Ahora encuentra el día sin respaldo: recorre los tamaños con un contador y detén el bucle con break en el primer 0.
    verificar:
      - { comando_usado: 'break' }
      - { salida_contiene: "Día 5: respaldo vacío" }
    pistas:
      - "`dia=0; while read -r n; do ((dia++)); if (( n == 0 )); then echo \"Día $dia: respaldo vacío\"; break; fi; done < ~/tamanos.txt`"
    solucion: ['dia=0; while read -r n; do ((dia++)); if (( n == 0 )); then echo "Día $dia: respaldo vacío"; break; fi; done < ~/tamanos.txt']
    explicacion: break sale del bucle en cuanto encuentra lo que buscaba. Un 0 en una lista de tamaños de respaldo es justo lo que un script tiene que avisar.
