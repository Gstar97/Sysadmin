tipo: emparejar
consigna: Une cada tarea con el bucle que mejor la resuelve.
pares:
  - { a: "Comprimir cada .log de una carpeta", b: "for f in /var/log/app/*.log; do gzip \"$f\"; done" }
  - { a: "Procesar un archivo línea por línea, con espacios", b: "while read -r linea; do ...; done < archivo" }
  - { a: "Repetir 10 veces con un contador", b: "for ((i = 1; i <= 10; i++)); do ...; done" }
  - { a: "Esperar a que un servidor responda", b: "until ping -c1 -W1 db01; do sleep 5; done" }
  - { a: "Recorrer los elementos de un arreglo", b: "for s in \"${servidores[@]}\"; do ...; done" }
explicacion: >-
  Para recorrer líneas de un archivo, nunca for linea in $(cat archivo): parte también en los
  espacios. while read -r es la forma correcta.
