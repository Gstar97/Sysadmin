<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fb2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <g stroke="currentColor" fill="var(--info-soft, #e0e9fd)">
    <rect x="20" y="20" width="260" height="250" rx="10"/>
    <rect x="300" y="20" width="260" height="250" rx="10"/>
    <rect x="580" y="20" width="260" height="250" rx="10"/>
  </g>
  <g fill="currentColor">
    <text x="150" y="46" text-anchor="middle" font-weight="700">for: una vez por elemento</text>
    <text x="430" y="46" text-anchor="middle" font-weight="700">while read: una vez por línea</text>
    <text x="710" y="46" text-anchor="middle" font-weight="700">while / until: mientras…</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">
    <text x="34" y="80">for f in /var/log/*.log; do</text>
    <text x="34" y="98">  gzip "$f"</text>
    <text x="34" y="116">done</text>
    <text x="314" y="80">while read -r linea; do</text>
    <text x="314" y="98">  echo "$linea"</text>
    <text x="314" y="116">done &lt; servidores.txt</text>
    <text x="594" y="80">until ping -c1 -W1 db01; do</text>
    <text x="594" y="98">  sleep 5</text>
    <text x="594" y="116">done</text>
  </g>
  <g fill="var(--surface, #fff)" stroke="currentColor">
    <rect x="40" y="140" width="64" height="26" rx="5"/><rect x="112" y="140" width="64" height="26" rx="5"/><rect x="184" y="140" width="64" height="26" rx="5"/>
    <rect x="320" y="140" width="220" height="22" rx="4"/><rect x="320" y="166" width="220" height="22" rx="4"/><rect x="320" y="192" width="220" height="22" rx="4"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="10.5" fill="currentColor" text-anchor="middle">
    <text x="72" y="157">a.log</text><text x="144" y="157">b.log</text><text x="216" y="157">c.log</text>
    <text x="430" y="155">web01</text><text x="430" y="181">web02</text><text x="430" y="207">db01</text>
  </g>
  <g stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#fb2)">
    <path d="M72 170 C 72 200, 216 200, 216 172"/>
    <path d="M300 151 L 316 151"/>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="34" y="226">La lista se arma antes de empezar:</text>
    <text x="34" y="243">palabras, comodines, {1..10} o "${arr[@]}".</text>
    <text x="314" y="236">Lee hasta que se termina la entrada.</text>
    <text x="314" y="253">Respeta espacios en cada línea.</text>
    <text x="594" y="150">while: repite mientras la condición</text>
    <text x="594" y="167">salga bien. until: mientras falle.</text>
    <text x="594" y="200">break sale del bucle;</text>
    <text x="594" y="217">continue pasa a la vuelta siguiente.</text>
    <text x="594" y="250">Sin salida, Ctrl+C lo corta.</text>
  </g>
</svg>
