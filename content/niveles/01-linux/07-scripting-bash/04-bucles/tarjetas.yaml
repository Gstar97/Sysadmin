- { id: t1, frente: "for", dorso: "for x in a b c · *.log · {1..5} · \"${arr[@]}\" · for ((i=0; i<n; i++)). Variables entre comillas." }
- { id: t2, frente: "while read", dorso: "while read -r l; do ...; done < archivo. Con campos: while IFS=, read -r a b c. Desde un comando: done < <(cmd)." }
- { id: t3, frente: "Trampa de la tubería", dorso: "cmd | while ...: el while corre aparte y pierde las variables. Usa < archivo o < <(cmd)." }
- { id: t4, frente: "while / until", dorso: "while cond: mientras salga bien. until cond: mientras falle. Siempre con un límite." }
- { id: t5, frente: "break y continue", dorso: "continue: a la vuelta siguiente. break: salir del bucle." }
- { id: t6, frente: "nullglob", dorso: "shopt -s nullglob: un comodín sin coincidencias da una lista vacía (en lugar del patrón literal)." }
