tipo: emparejar
consigna: Uní cada pieza de una expresión regular con lo que significa.
pares:
  - { a: "^error", b: "Que la línea EMPIECE con error" }
  - { a: "\\.conf$", b: "Que TERMINE en .conf (el punto escapado es un punto literal)" }
  - { a: "[0-9]+", b: "Uno o más dígitos (con grep -E)" }
  - { a: "a.c", b: "a, cualquier carácter, c (abc, a-c, a c...)" }
  - { a: "(GET|POST)", b: "GET o POST (con grep -E)" }
  - { a: "^\\s*(#|$)", b: "Una línea de comentario o vacía (espacios opcionales al principio)" }
explicacion: >-
  En grep sin -E, + ? | ( ) se escriben con barra (\+, \|). Por eso conviene usar grep -E (y
  sed -E): las expresiones se leen igual que en casi cualquier otra herramienta.
