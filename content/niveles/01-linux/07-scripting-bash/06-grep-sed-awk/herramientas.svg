<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <g stroke="currentColor">
    <rect x="20" y="40" width="250" height="150" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="305" y="40" width="250" height="150" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="590" y="40" width="250" height="150" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="145" y="66" text-anchor="middle" font-weight="700" font-size="14">grep</text>
    <text x="145" y="84" text-anchor="middle">elige LÍNEAS</text>
    <text x="430" y="66" text-anchor="middle" font-weight="700" font-size="14">sed</text>
    <text x="430" y="84" text-anchor="middle">CAMBIA texto</text>
    <text x="715" y="66" text-anchor="middle" font-weight="700" font-size="14">awk</text>
    <text x="715" y="84" text-anchor="middle">trabaja con COLUMNAS</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="11" fill="currentColor">
    <text x="34" y="112">grep ' 404 ' access.log</text>
    <text x="34" y="130">grep -v '^#' app.conf</text>
    <text x="34" y="148">grep -c ERROR app.log</text>
    <text x="34" y="166">grep -rn puerto /etc/app/</text>
    <text x="319" y="112">sed 's/viejo/nuevo/g'</text>
    <text x="319" y="130">sed -i.bak 's/^x=.*/x=1/' f</text>
    <text x="319" y="148">sed '/^#/d' app.conf</text>
    <text x="319" y="166">sed -n '10,20p' f</text>
    <text x="604" y="112">awk '{print $1, $9}'</text>
    <text x="604" y="130">awk -F: '{print $1}' /etc/passwd</text>
    <text x="604" y="148">awk '$9 == 404'</text>
    <text x="604" y="166">awk '{s += $10} END {print s}'</text>
  </g>
  <text x="20" y="230" font-weight="700" fill="currentColor">Juntas, con una tubería: las 3 IP que más 404 generaron</text>
  <g font-family="ui-monospace, monospace" font-size="12" fill="currentColor">
    <text x="20" y="256">awk '$9 == 404 {print $1}' access.log | sort | uniq -c | sort -rn | head -3</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" marker-end="url(#fg)" fill="none">
    <line x1="270" y1="115" x2="303" y2="115"/>
    <line x1="555" y1="115" x2="588" y2="115"/>
  </g>
  <text x="20" y="286" font-size="11.5" fill="currentColor">awk elige las líneas y la columna; sort ordena; uniq -c cuenta las repetidas; sort -rn pone las más frecuentes arriba; head corta.</text>
</svg>
