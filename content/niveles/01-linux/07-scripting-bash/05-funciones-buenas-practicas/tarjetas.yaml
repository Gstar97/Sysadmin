- { id: t1, frente: "Función", dorso: "nombre() { local x=\"$1\"; ...; }. Datos con echo y $(nombre); código con return." }
- { id: t2, frente: "Estructura de un script", dorso: "Encabezado → set -euo pipefail → configuración → funciones → getopts → validación → trabajo." }
- { id: t3, frente: "getopts", dorso: "while getopts \"nd:\" o; do case $o in n)...;; d) x=$OPTARG;; *) uso;; esac; done; shift $((OPTIND-1))" }
- { id: t4, frente: "Registro", dorso: "log() { echo \"$(date '+%F %T') $*\" | tee -a \"$LOG\"; } · logger -t nombre \"mensaje\"" }
- { id: t5, frente: "Limpieza y bloqueo", dorso: "tmp=$(mktemp); trap 'rm -f \"$tmp\"' EXIT · flock -n archivo.lock comando" }
- { id: t6, frente: "Depurar", dorso: "bash -n (sintaxis) · bash -x (traza) · set -x / set +x · ShellCheck." }
