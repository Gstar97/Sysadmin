<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12.5">
  <g stroke="currentColor">
    <rect x="20" y="16" width="420" height="44" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="20" y="66" width="420" height="34" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="20" y="106" width="420" height="44" rx="6" fill="var(--surface, #fff)"/>
    <rect x="20" y="156" width="420" height="54" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="20" y="216" width="420" height="34" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="20" y="256" width="420" height="44" rx="6" fill="var(--surface, #fff)"/>
    <rect x="20" y="306" width="420" height="40" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">
    <text x="32" y="34">#!/bin/bash</text>
    <text x="32" y="52"># qué hace · uso · opciones · autor</text>
    <text x="32" y="88">set -euo pipefail</text>
    <text x="32" y="124">LOG=/var/log/limpiar.log</text>
    <text x="32" y="142">dias=7   prueba=0</text>
    <text x="32" y="174">log() { echo "$(date '+%F %T') $*" | tee -a "$LOG"; }</text>
    <text x="32" y="190">die() { log "ERROR: $*" &gt;&amp;2; exit 1; }</text>
    <text x="32" y="206">uso() { echo "Uso: $0 [-n] CARPETA" &gt;&amp;2; exit 2; }</text>
    <text x="32" y="238">while getopts "nd:" o; do ... done</text>
    <text x="32" y="274">[ $# -eq 1 ] || uso</text>
    <text x="32" y="292">[ -d "$1" ] || die "no existe $1"</text>
    <text x="32" y="324">log "inicio" ... el trabajo ...</text>
    <text x="32" y="340">log "fin"</text>
  </g>
  <g fill="currentColor">
    <text x="460" y="42" font-weight="700">1. Encabezado</text>
    <text x="600" y="42" font-size="11.5">para el que venga después</text>
    <text x="460" y="88" font-weight="700">2. Modo estricto</text>
    <text x="600" y="88" font-size="11.5">parar ante el primer error</text>
    <text x="460" y="132" font-weight="700">3. Configuración</text>
    <text x="600" y="132" font-size="11.5">valores por defecto, rutas, en un lugar</text>
    <text x="460" y="188" font-weight="700">4. Funciones</text>
    <text x="600" y="188" font-size="11.5">chicas, con nombre claro</text>
    <text x="460" y="238" font-weight="700">5. Opciones</text>
    <text x="600" y="238" font-size="11.5">getopts</text>
    <text x="460" y="282" font-weight="700">6. Validación</text>
    <text x="600" y="282" font-size="11.5">antes de tocar nada</text>
    <text x="460" y="330" font-weight="700">7. El trabajo</text>
    <text x="600" y="330" font-size="11.5">con registro de inicio y fin</text>
  </g>
</svg>
