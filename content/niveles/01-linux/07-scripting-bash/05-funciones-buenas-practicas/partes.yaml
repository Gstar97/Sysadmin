tipo: ordenar
consigna: Ordená las partes de un script bien armado, de arriba hacia abajo.
pasos:
  - "Shebang y comentario: qué hace, cómo se usa"
  - "set -euo pipefail"
  - "Configuración y valores por defecto"
  - "Funciones (log, die, uso...)"
  - "Lectura de opciones con getopts"
  - "Validación de argumentos y requisitos"
  - "El trabajo, con registro de inicio y fin"
explicacion: >-
  Las funciones van antes de usarse (bash lee de arriba hacia abajo). Y toda la validación va
  antes de cambiar cualquier cosa: un script que falla a mitad de camino deja todo a medias.
