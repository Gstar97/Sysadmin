tipo: ordenar
consigna: Ordena los pasos para llevar un script nuevo a producción.
pasos:
  - Escribirlo con encabezado, modo estricto, validación y registro
  - Probarlo con datos de prueba y en modo -n, también los casos de error
  - Revisarlo con bash -n y ShellCheck
  - Instalarlo en /usr/local/bin (o sbin) con dueño root y permisos 755
  - Guardarlo en el repositorio de scripts del equipo (git)
  - Programarlo con cron o un timer, con ruta completa y la salida a un log
  - Documentarlo y revisar el primer resultado al día siguiente
explicacion: >-
  La última línea es la que más se olvida: un script programado que nadie revisa puede fallar
  todas las noches durante meses.
