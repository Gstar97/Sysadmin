<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <g stroke="currentColor">
    <rect x="20" y="40" width="140" height="70" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="190" y="40" width="140" height="70" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="360" y="40" width="140" height="70" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="530" y="40" width="140" height="70" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="700" y="40" width="140" height="70" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="90" y="68" font-weight="700">Copiar</text>
    <text x="90" y="88" font-family="ui-monospace, monospace" font-size="11">tar czf</text>
    <text x="260" y="68" font-weight="700">Verificar</text>
    <text x="260" y="88" font-family="ui-monospace, monospace" font-size="11">tar tzf, no vacío</text>
    <text x="430" y="68" font-weight="700">Sellar</text>
    <text x="430" y="88" font-family="ui-monospace, monospace" font-size="11">sha256sum</text>
    <text x="600" y="68" font-weight="700">Rotar</text>
    <text x="600" y="88" font-family="ui-monospace, monospace" font-size="11">find -mtime +7 -delete</text>
    <text x="770" y="68" font-weight="700">Registrar</text>
    <text x="770" y="88" font-family="ui-monospace, monospace" font-size="11">log, logger, exit</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#fc)">
    <line x1="160" y1="75" x2="188" y2="75"/>
    <line x1="330" y1="75" x2="358" y2="75"/>
    <line x1="500" y1="75" x2="528" y2="75"/>
    <line x1="670" y1="75" x2="698" y2="75"/>
  </g>
  <rect x="190" y="160" width="480" height="70" rx="10" fill="var(--danger-soft, #fde2e1)" stroke="currentColor" stroke-dasharray="6 4"/>
  <text x="430" y="186" text-anchor="middle" font-weight="700" fill="currentColor">Si algo falla: exit 1 y un mensaje claro</text>
  <text x="430" y="206" text-anchor="middle" fill="currentColor">nada de terminar con 0 dejando un archivo inútil</text>
  <path d="M260 110 L 260 158" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#fc)" fill="none"/>
  <text x="20" y="270" fill="currentColor" font-weight="700">Y de vez en cuando, la prueba que importa:</text>
  <text x="20" y="290" fill="currentColor" font-family="ui-monospace, monospace" font-size="12">tar xzf respaldo.tar.gz -C /tmp/prueba &amp;&amp; diff -r /srv/datos /tmp/prueba/datos</text>
</svg>
