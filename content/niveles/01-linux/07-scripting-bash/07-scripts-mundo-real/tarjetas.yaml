- { id: t1, frente: "Respaldo confiable", dorso: "Copiar → verificar (tar tzf, no vacío) → sha256sum → rotar (find -mtime +N -delete) → registrar. Si falla, exit 1." }
- { id: t2, frente: "Probar la restauración", dorso: "tar xzf respaldo.tar.gz -C /tmp/prueba && diff -r /srv/datos /tmp/prueba/datos" }
- { id: t3, frente: "sudo y cron", dorso: "Ruta completa: sudo busca en secure_path y cron tiene una PATH mínima." }
- { id: t4, frente: "Alta desde CSV", dorso: "while IFS=, read -r u n g ... id u || useradd; clave con openssl rand; chpasswd; chage -d 0. Idempotente y con -n." }
- { id: t5, frente: "Script en producción", dorso: "/usr/local/bin o sbin, root y 755, git, cron o timer con log, y revisar el primer resultado." }
