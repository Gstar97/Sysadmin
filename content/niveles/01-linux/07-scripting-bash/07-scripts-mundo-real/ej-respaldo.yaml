tipo: terminal
shell: bash
titulo: Un respaldo en el que se puede confiar
descripcion: >-
  En archivos01 hay que respaldar /srv/datos todas las noches en /backup, guardar 7 días y,
  sobre todo, poder confiar en que cada respaldo sirve. Vas a instalar el script, probarlo,
  restaurar un respaldo de prueba, ver qué pasa cuando algo sale mal y programarlo.
estado_inicial:
  distro: rocky
  hostname: archivos01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
  archivos:
    /srv/datos/ventas/pedidos-octubre.csv: "pedido,cliente,total\n1001,Gómez,15200\n1002,Ruiz,8300\n"
    /srv/datos/ventas/clientes.csv: "id,nombre\n1,Gómez\n2,Ruiz\n"
    /srv/datos/contabilidad/balance-2026.txt: "Activo: 1250000\nPasivo: 480000\n"
    /srv/vacia: { tipo: directorio }
    /backup/datos-2026-10-20-0230.tar.gz: { contenido: "viejo\n", antiguedad_dias: 13 }
    /backup/datos-2026-10-20-0230.tar.gz.sha256: { contenido: "viejo\n", antiguedad_dias: 13 }
    /backup/datos-2026-10-30-0230.tar.gz: { contenido: "reciente\n", antiguedad_dias: 3 }
pasos:
  - consigna: >-
      Instalá el script en /usr/local/bin/respaldo.sh (con sudo tee y un here-document) y dale
      permisos 755. Léelo antes de seguir: cada bloque tiene un comentario.
    verificar:
      - { archivo: /usr/local/bin/respaldo.sh, contenido_incluye: "sha256sum" }
      - { archivo: /usr/local/bin/respaldo.sh, modo: "0755" }
    pistas:
      - "sudo tee /usr/local/bin/respaldo.sh > /dev/null <<'FIN' ... FIN, y después sudo chmod 755."
    solucion: ["sudo tee /usr/local/bin/respaldo.sh > /dev/null <<'FIN'\n#!/bin/bash\n# respaldo.sh: respalda una carpeta en un .tar.gz con fecha, lo verifica y borra los viejos.\n# Uso: respaldo.sh ORIGEN DESTINO [DÍAS_A_GUARDAR]   (0 bien, 1 falló)\nset -euo pipefail\n\norigen=\"${1:?Uso: respaldo.sh ORIGEN DESTINO [DÍAS]}\"\ndestino=\"${2:?Uso: respaldo.sh ORIGEN DESTINO [DÍAS]}\"\ndias=\"${3:-7}\"\nnombre=$(basename \"$origen\")\n\nlog() { echo \"$(date '+%F %T') respaldo: $*\"; logger -t respaldo \"$*\"; }\nfalla() { log \"ERROR: $*\"; exit 1; }\n\n[ -d \"$origen\" ] || falla \"no existe el origen $origen\"\nmkdir -p \"$destino\"\narchivo=\"$destino/$nombre-$(date +%F-%H%M).tar.gz\"\n\nlog \"inicio: $origen -> $archivo\"\ntar czf \"$archivo\" -C \"$(dirname \"$origen\")\" \"$nombre\" || falla \"tar terminó con error\"\n\n# Verificar: que se pueda leer y que no esté vacío. Si no sirve, no se guarda.\ncantidad=$(tar tzf \"$archivo\" | wc -l)\nif (( cantidad <= 1 )); then\n  rm -f \"$archivo\"\n  falla \"el respaldo de $origen no tiene archivos\"\nfi\nsha256sum \"$archivo\" > \"$archivo.sha256\"\nlog \"ok: $cantidad entradas, $(du -h \"$archivo\" | cut -f1)\"\n\n# Rotación: borrar los de más de N días (solo los de esta carpeta).\nfind \"$destino\" -name \"$nombre-*.tar.gz*\" -mtime +\"$dias\" -print -delete | while read -r f; do log \"borrado viejo: $f\"; done\nlog \"fin\"\nFIN", sudo chmod 755 /usr/local/bin/respaldo.sh]
    explicacion: >-
      Lo importante no es el tar: es la verificación (que el archivo se pueda leer y no esté
      vacío), la suma de control para comprobarlo después, la rotación y el registro.
  - consigna: Ejecutalo con sudo, usando solo el nombre (respaldo.sh), para ver qué pasa.
    verificar:
      - { comando_usado: 'sudo\s+respaldo\.sh' }
      - { salida_contiene: "command not found" }
    pistas:
      - "`sudo respaldo.sh /srv/datos /backup`"
    solucion: [sudo respaldo.sh /srv/datos /backup]
    explicacion: >-
      En Rocky, sudo busca los comandos en su propia lista de carpetas (secure_path, en
      /etc/sudoers), que no incluye /usr/local/bin. Con sudo, y en cron, usa siempre la ruta
      completa.
  - consigna: Ahora sí, ejecutalo con la ruta completa, guardando 7 días.
    verificar:
      - { comando_usado: 'sudo\s+/usr/local/bin/respaldo\.sh\s+/srv/datos' }
      - { salida_contiene: "respaldo: ok:" }
      - { archivo: /backup/datos-2026-10-20-0230.tar.gz, existe: false }
      - { archivo: /backup/datos-2026-10-30-0230.tar.gz, existe: true }
    pistas:
      - "`sudo /usr/local/bin/respaldo.sh /srv/datos /backup 7`"
    solucion: [sudo /usr/local/bin/respaldo.sh /srv/datos /backup 7]
    explicacion: Creó el respaldo nuevo, lo verificó y borró el de hace 13 días. El de hace 3 días queda.
  - consigna: Comprobá la suma de control del respaldo nuevo.
    verificar:
      - { comando_usado: 'sha256sum\s+-c' }
      - { salida_contiene: ": OK" }
    pistas:
      - "`sha256sum -c /backup/datos-*.sha256`"
    solucion: [sha256sum -c /backup/datos-*.sha256]
    explicacion: Si el archivo se dañara (un disco que falla, una copia cortada), esto daría FAILED.
  - consigna: >-
      La prueba que de verdad importa: restauralo en /tmp/prueba y comparalo con el original.
    verificar:
      - { comando_usado: 'tar\s+-?x' }
      - { comando_usado: 'diff\s+-r' }
      - { salida_contiene: "idénticos" }
    pistas:
      - "ls -t ordena por fecha (el más nuevo primero); head -1 deja ese."
      - "`mkdir -p /tmp/prueba && tar xzf \"$(ls -t /backup/datos-*.tar.gz | head -1)\" -C /tmp/prueba && diff -r /srv/datos /tmp/prueba/datos && echo idénticos`"
    solucion: ['mkdir -p /tmp/prueba && tar xzf "$(ls -t /backup/datos-*.tar.gz | head -1)" -C /tmp/prueba && diff -r /srv/datos /tmp/prueba/datos && echo idénticos']
    explicacion: Un respaldo que nunca se restauró es solo una esperanza. Esta prueba, hecha de vez en cuando, es lo que le da valor.
  - consigna: Ejecutá el script sobre /srv/vacia, una carpeta vacía, y mirá el código de salida.
    verificar:
      - { comando_usado: 'respaldo\.sh\s+/srv/vacia' }
      - { salida_contiene: "no tiene archivos" }
    pistas:
      - "`sudo /usr/local/bin/respaldo.sh /srv/vacia /backup; echo $?`"
    solucion: ["sudo /usr/local/bin/respaldo.sh /srv/vacia /backup; echo $?"]
    explicacion: >-
      Falla con 1 y no deja un archivo inútil en /backup. Un script que hubiera terminado con 0
      habría dejado durante semanas respaldos vacíos sin que nadie se entere.
  - consigna: >-
      Programalo todos los días a las 2:30 con un archivo /etc/cron.d/respaldo (usuario root, ruta
      completa, salida al log /var/log/respaldo.log).
    verificar:
      - { archivo: /etc/cron.d/respaldo, contenido_incluye: "30 2 * * * root /usr/local/bin/respaldo.sh /srv/datos /backup 7" }
      - { archivo: /etc/cron.d/respaldo, contenido_incluye: ">> /var/log/respaldo.log 2>&1" }
    pistas:
      - "`echo '30 2 * * * root /usr/local/bin/respaldo.sh /srv/datos /backup 7 >> /var/log/respaldo.log 2>&1' | sudo tee /etc/cron.d/respaldo`"
    solucion: ["echo '30 2 * * * root /usr/local/bin/respaldo.sh /srv/datos /backup 7 >> /var/log/respaldo.log 2>&1' | sudo tee /etc/cron.d/respaldo"]
    explicacion: Además del log, cada ejecución queda en el journal (journalctl -t respaldo) gracias a logger.
