<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <rect x="20" y="20" width="250" height="44" rx="8" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="145" y="47" text-anchor="middle" font-family="ui-monospace, monospace" fill="currentColor">uso=$(df ... /)  → 87</text>
  <polygon points="145,90 245,125 145,160 45,125" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="145" y="129" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="currentColor">(( uso &gt;= 90 ))</text>
  <polygon points="420,90 520,125 420,160 320,125" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="420" y="129" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="currentColor">(( uso &gt;= 80 ))</text>
  <g stroke="currentColor" fill="var(--surface, #fff)">
    <rect x="70" y="210" width="150" height="56" rx="8" fill="var(--danger-soft, #fde2e1)"/>
    <rect x="345" y="210" width="150" height="56" rx="8"/>
    <rect x="600" y="100" width="150" height="56" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="145" y="234" font-weight="700">CRÍTICO</text>
    <text x="145" y="252" font-family="ui-monospace, monospace" font-size="11.5">exit 2</text>
    <text x="420" y="234" font-weight="700">AVISO</text>
    <text x="420" y="252" font-family="ui-monospace, monospace" font-size="11.5">exit 1</text>
    <text x="675" y="124" font-weight="700">OK</text>
    <text x="675" y="142" font-family="ui-monospace, monospace" font-size="11.5">exit 0</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#fd)">
    <line x1="145" y1="64" x2="145" y2="88"/>
    <line x1="145" y1="160" x2="145" y2="208"/>
    <line x1="245" y1="125" x2="318" y2="125"/>
    <line x1="420" y1="160" x2="420" y2="208"/>
    <line x1="520" y1="125" x2="598" y2="128"/>
  </g>
  <g font-size="11.5" fill="currentColor">
    <text x="152" y="186">sí (then)</text>
    <text x="252" y="117">no (elif)</text>
    <text x="427" y="186">sí</text>
    <text x="528" y="117">no (else)</text>
  </g>
  <text x="20" y="300" font-size="11.5" fill="currentColor">if mira el código de salida de la condición: 0 es "verdadero". Se evalúan en orden y se ejecuta solo la primera rama que se cumple.</text>
</svg>
