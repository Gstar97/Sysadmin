tipo: emparejar
consigna: Une cada prueba con lo que pregunta.
pares:
  - { a: "[ -f \"$archivo\" ]", b: "¿Existe y es un archivo común?" }
  - { a: "[ -d \"$carpeta\" ]", b: "¿Existe y es una carpeta?" }
  - { a: "[ -z \"$nombre\" ]", b: "¿La variable está vacía?" }
  - { a: "[ \"$a\" = \"$b\" ]", b: "¿Los dos textos son iguales?" }
  - { a: "(( uso > 90 ))", b: "¿El número es mayor que 90?" }
  - { a: "[[ $archivo == *.log ]]", b: "¿El nombre termina en .log?" }
  - { a: "if grep -q error app.log", b: "¿El comando salió bien (encontró algo)?" }
explicacion: >-
  Para números, (( )) es lo más claro. Para textos y archivos, [ ] o [[ ]] (con [[ ]] podés usar
  comodines y && || adentro). Y cualquier comando sirve como condición: if mira su código de salida.
