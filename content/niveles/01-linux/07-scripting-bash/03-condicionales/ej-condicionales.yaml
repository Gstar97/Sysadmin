tipo: terminal
shell: bash
titulo: Un control de espacio con niveles
descripcion: >-
  Vas a escribir espacio.sh, un control de disco como los que usan los sistemas de monitoreo:
  responde OK, AVISO o CRÍTICO según el porcentaje usado de una partición, con códigos 0, 1 y 2.
estado_inicial:
  distro: rocky
  hostname: app01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
pasos:
  - consigna: Averiguá, solo como número, el porcentaje usado de la raíz.
    verificar:
      - { comando_usado: 'df\s+.*(--output=pcent|-P).*\|' }
      - { salida_regex: '^\s*\d+\s*$' }
    pistas:
      - "df --output=pcent / muestra solo el porcentaje; tail -1 deja la última línea y tr -dc '0-9' borra todo lo que no es un dígito."
      - "`df --output=pcent / | tail -1 | tr -dc '0-9'; echo`"
    solucion: ["df --output=pcent / | tail -1 | tr -dc '0-9'; echo"]
    explicacion: Así se consigue un número limpio para comparar. El echo del final solo agrega el salto de línea.
  - consigna: >-
      Creá ~/espacio.sh con el contenido de la solución: recibe la partición y los dos límites
      (por defecto /, 80 y 90) y responde según corresponda.
    verificar:
      - { archivo: /home/ana/espacio.sh, contenido_incluye: elif }
      - { archivo: /home/ana/espacio.sh, contenido_incluye: "exit 2" }
    pistas:
      - "La estructura: if (( uso >= critico )); then ... exit 2; elif (( uso >= aviso )); then ... exit 1; else ... exit 0; fi"
    solucion: ["cat > ~/espacio.sh <<'FIN'\n#!/bin/bash\n# espacio.sh: controla el uso de una partición.\n# Uso: espacio.sh [PARTICIÓN] [AVISO] [CRÍTICO]   (0 OK, 1 AVISO, 2 CRÍTICO, 3 error)\nparticion=\"${1:-/}\"\naviso=\"${2:-80}\"\ncritico=\"${3:-90}\"\nif [ ! -d \"$particion\" ]; then\n  echo \"No existe: $particion\" >&2\n  exit 3\nfi\nuso=$(df --output=pcent \"$particion\" | tail -1 | tr -dc '0-9')\nif (( uso >= critico )); then\n  echo \"CRÍTICO: $particion al $uso %\"\n  exit 2\nelif (( uso >= aviso )); then\n  echo \"AVISO: $particion al $uso %\"\n  exit 1\nelse\n  echo \"OK: $particion al $uso %\"\n  exit 0\nfi\nFIN", chmod +x ~/espacio.sh]
    explicacion: Primero se valida lo que entra (que la partición exista), después se decide. Solo una de las ramas se ejecuta.
  - consigna: Ejecutalo con los valores por defecto y mirá el código de salida.
    verificar:
      - { comando_usado: 'espacio\.sh' }
      - { salida_contiene: "OK: / al" }
    pistas:
      - "`~/espacio.sh; echo $?`"
    solucion: ["~/espacio.sh; echo $?"]
    explicacion: "OK y 0: por debajo del 80 %."
  - consigna: Probalo con una carpeta que no existe y con límites bajos (por ejemplo 10 y 20) para forzar el CRÍTICO.
    verificar:
      - { salida_contiene: "CRÍTICO" }
      - { comando_usado: 'espacio\.sh\s+/\S+' }
    pistas:
      - "`~/espacio.sh /no/existe; echo $?` y `~/espacio.sh / 10 20; echo $?`"
    solucion: ["~/espacio.sh /no/existe; echo $?", "~/espacio.sh / 10 20; echo $?"]
    explicacion: Probar todas las ramas, también las de error, es parte de escribir un script.
  - consigna: >-
      Ahora un case: creá ~/accion.sh que responda a "inicio", "fin" o "estado", y para
      cualquier otra cosa muestre el uso por stderr y salga con 2. Probalo con estado y con otra.
    verificar:
      - { archivo: /home/ana/accion.sh, contenido_incluye: esac }
      - { salida_contiene: "Uso:" }
    pistas:
      - "case \"$1\" in inicio) ... ;; fin) ... ;; estado) ... ;; *) echo \"Uso: $0 inicio|fin|estado\" >&2; exit 2 ;; esac"
    solucion: ["cat > ~/accion.sh <<'FIN'\n#!/bin/bash\ncase \"${1:-}\" in\n  inicio) echo \"Arrancando...\" ;;\n  fin) echo \"Deteniendo...\" ;;\n  estado) echo \"Todo en orden\" ;;\n  *) echo \"Uso: $0 inicio|fin|estado\" >&2; exit 2 ;;\nesac\nFIN", bash ~/accion.sh estado, bash ~/accion.sh otra]
    explicacion: case compara un valor con varios patrones (se pueden usar comodines como *.log o a|b). La rama *) atrapa todo lo demás.
