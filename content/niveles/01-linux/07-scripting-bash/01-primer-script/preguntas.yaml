- id: p01
  tipo: opcion_multiple
  diagnostico: true
  enunciado: >-
    ¿Para qué sirve la línea #!/bin/bash al principio de un script?
  opciones:
    - { texto: "Indica qué programa tiene que leer el archivo", correcta: true, explicacion: "Se llama shebang y va siempre en la primera línea." }
    - { texto: "Es un comentario sin efecto", explicacion: "Empieza con #, pero el sistema la lee al ejecutar." }
    - { texto: "Hace que el archivo sea ejecutable", explicacion: "Eso lo hace chmod +x." }
    - { texto: "Instala bash", explicacion: "Bash ya tiene que estar instalado." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  enunciado: "¿Qué pasa con limite = 90 en un script?"
  opciones:
    - { texto: "Bash intenta ejecutar un comando llamado limite y da command not found", correcta: true, explicacion: "Las asignaciones van sin espacios: limite=90." }
    - { texto: "Guarda 90 en limite", explicacion: "Con espacios no es una asignación." }
    - { texto: "Compara limite con 90", explicacion: "Para comparar se usa [ ] o (( ))." }
    - { texto: "Nada", explicacion: "Da un error." }
- id: p03
  tipo: opcion_multiple
  enunciado: Con nombre="Ana López", ¿qué muestra echo 'Hola $nombre'?
  opciones:
    - { texto: "Hola $nombre", correcta: true, explicacion: "Las comillas simples no expanden nada." }
    - { texto: "Hola Ana López", explicacion: "Eso sería con comillas dobles." }
    - { texto: "Hola", explicacion: "No." }
    - { texto: "Un error", explicacion: "Es válido." }
- id: p04
  tipo: opcion_multiple
  enunciado: archivo="reporte final.txt" y después rm $archivo. ¿Qué intenta borrar?
  opciones:
    - { texto: "Dos archivos: reporte y final.txt", correcta: true, explicacion: "Sin comillas, el espacio parte el valor. Lo correcto: rm \"$archivo\"." }
    - { texto: "reporte final.txt", explicacion: "Eso sería con comillas dobles." }
    - { texto: "Nada", explicacion: "Intenta borrar dos." }
    - { texto: "Todos los .txt", explicacion: "No hay comodines." }
- id: p05
  tipo: completar_comando
  enunciado: Escribí la línea que guarda en la variable hoy la fecha en formato AAAA-MM-DD.
  aceptadas: ["hoy=$(date +%F)", "hoy=$(date +%Y-%m-%d)", "hoy=\"$(date +%F)\"", "hoy=`date +%F`"]
  explicacion: $(comando) reemplaza el comando por lo que imprime.
- id: p06
  tipo: opcion_multiple
  enunciado: Tenés info.sh en tu carpeta, con permiso de ejecución. Escribís info.sh y responde command not found. ¿Por qué?
  opciones:
    - { texto: "Bash no busca en la carpeta actual: hay que escribir ./info.sh", correcta: true, explicacion: "O instalarlo en una carpeta del PATH." }
    - { texto: "Falta chmod +x", explicacion: "Ya tiene el permiso." }
    - { texto: "Falta el shebang", explicacion: "Eso no afecta a encontrarlo." }
    - { texto: "El archivo está dañado", explicacion: "No." }
- id: p07
  tipo: opcion_multiple
  enunciado: ¿Dónde conviene instalar un script que tienen que poder usar todos los usuarios del servidor?
  opciones:
    - { texto: "/usr/local/bin", correcta: true, explicacion: "Está en el PATH de todos y no lo toca el gestor de paquetes." }
    - { texto: "/usr/bin", explicacion: "Es de los paquetes: una actualización podría pisarlo." }
    - { texto: "/root", explicacion: "Solo root puede entrar." }
    - { texto: "/tmp", explicacion: "Se borra." }
- id: p08
  tipo: completar_comando
  enunciado: Escribí el comando que le da permiso de ejecución a respaldo.sh.
  aceptadas: [chmod +x respaldo.sh, chmod u+x respaldo.sh, chmod 755 respaldo.sh, chmod 750 respaldo.sh, chmod 700 respaldo.sh, chmod a+x respaldo.sh]
  explicacion: Después se ejecuta con ./respaldo.sh.
