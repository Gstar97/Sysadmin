<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <rect x="20" y="20" width="430" height="290" rx="10" fill="var(--term-bg, #1e1e2e)" stroke="currentColor"/>
  <g font-family="ui-monospace, monospace" font-size="13" fill="var(--term-fg, #e6e6e6)">
    <text x="36" y="52">#!/bin/bash</text>
    <text x="36" y="80" fill="#8fbf7f"># info.sh: datos básicos del servidor</text>
    <text x="36" y="108" fill="#8fbf7f"># Autora: Ana. Uso: ./info.sh</text>
    <text x="36" y="146">servidor=$(hostname)</text>
    <text x="36" y="170">hoy=$(date +%F)</text>
    <text x="36" y="208">echo "Servidor: $servidor"</text>
    <text x="36" y="232">echo "Fecha: $hoy"</text>
    <text x="36" y="256">df -h /</text>
    <text x="36" y="290">exit 0</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="160" y1="48" x2="490" y2="48"/>
    <line x1="350" y1="94" x2="490" y2="94"/>
    <line x1="230" y1="158" x2="490" y2="158"/>
    <line x1="260" y1="232" x2="490" y2="232"/>
    <line x1="110" y1="286" x2="490" y2="286"/>
  </g>
  <g fill="currentColor">
    <text x="500" y="44" font-weight="700">Shebang</text>
    <text x="500" y="61" font-size="11.5">Qué programa lee el archivo. Siempre la primera línea.</text>
    <text x="500" y="90" font-weight="700">Comentarios</text>
    <text x="500" y="107" font-size="11.5">Qué hace, quién, cómo se usa. Para el que venga después.</text>
    <text x="500" y="154" font-weight="700">Variables</text>
    <text x="500" y="171" font-size="11.5">nombre=valor, sin espacios. $(comando) guarda su salida.</text>
    <text x="500" y="228" font-weight="700">Comandos</text>
    <text x="500" y="245" font-size="11.5">Los mismos que escribirías a mano, uno por línea.</text>
    <text x="500" y="282" font-weight="700">Código de salida</text>
    <text x="500" y="299" font-size="11.5">0 = salió bien. Lo vas a ver en la próxima lección.</text>
  </g>
</svg>
