- { id: t1, frente: "Shebang", dorso: "#!/bin/bash en la primera línea: qué programa lee el script." }
- { id: t2, frente: "Ejecutar un script", dorso: "chmod +x script.sh y ./script.sh · o bash script.sh. Como comando: /usr/local/bin o ~/bin." }
- { id: t3, frente: "Variables", dorso: "nombre=valor (sin espacios) · $(comando) guarda la salida · ${nombre} con letras pegadas." }
- { id: t4, frente: "Comillas", dorso: "\"...\" expande y es una sola palabra · '...' todo literal · sin comillas: se parte en espacios." }
- { id: t5, frente: "Regla de oro", dorso: "Variables siempre entre comillas dobles: \"$archivo\"." }
