tipo: emparejar
consigna: Con nombre="Ana López", une cada línea con lo que muestra o hace.
pares:
  - { a: "echo \"Hola $nombre\"", b: "Hola Ana López (las comillas dobles expanden la variable)" }
  - { a: "echo 'Hola $nombre'", b: "Hola $nombre (las comillas simples muestran todo tal cual)" }
  - { a: "touch $nombre", b: "Crea dos archivos: Ana y López" }
  - { a: "touch \"$nombre\"", b: "Crea un archivo llamado Ana López" }
  - { a: "echo \"Hoy es $(date +%A)\"", b: "Hoy es y el día de la semana (sustitución de comandos)" }
explicacion: >-
  Regla práctica: pon siempre las variables entre comillas dobles ("$variable"). Sin comillas, un
  espacio en el valor parte la variable en dos, y eso causa errores difíciles de ver.
