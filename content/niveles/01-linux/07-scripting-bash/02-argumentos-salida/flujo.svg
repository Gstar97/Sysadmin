<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <rect x="320" y="90" width="220" height="140" rx="12" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.5"/>
  <text x="430" y="150" text-anchor="middle" font-weight="700" font-size="14" fill="currentColor">tu script</text>
  <text x="430" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">revisar.sh nginx</text>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#fa)">
    <line x1="170" y1="120" x2="316" y2="130"/>
    <line x1="170" y1="210" x2="316" y2="195"/>
    <line x1="540" y1="120" x2="690" y2="100"/>
    <line x1="540" y1="160" x2="690" y2="165"/>
    <line x1="540" y1="200" x2="690" y2="230"/>
  </g>
  <g fill="currentColor">
    <text x="20" y="100" font-weight="700">Argumentos</text>
    <text x="20" y="118" font-family="ui-monospace, monospace" font-size="11.5">$1 $2 ... "$@" $#</text>
    <text x="20" y="134" font-size="11.5">lo que va después del nombre</text>
    <text x="20" y="196" font-weight="700">Entrada (stdin)</text>
    <text x="20" y="214" font-family="ui-monospace, monospace" font-size="11.5">read, while read</text>
    <text x="20" y="230" font-size="11.5">teclado, tubería o archivo</text>
    <text x="700" y="88" font-weight="700">Salida (stdout)</text>
    <text x="700" y="106" font-size="11.5">el resultado: echo</text>
    <text x="700" y="160" font-weight="700">Errores (stderr)</text>
    <text x="700" y="178" font-family="ui-monospace, monospace" font-size="11.5">echo "..." &gt;&amp;2</text>
    <text x="700" y="226" font-weight="700">Código de salida</text>
    <text x="700" y="244" font-family="ui-monospace, monospace" font-size="11.5">exit 0 / exit 1 → $?</text>
    <text x="700" y="260" font-size="11.5">0 = bien; otro = problema</text>
  </g>
  <text x="430" y="300" text-anchor="middle" font-size="11.5" fill="currentColor">Un buen script separa el resultado (stdout) de los avisos (stderr) y siempre dice cómo le fue (código de salida).</text>
</svg>
