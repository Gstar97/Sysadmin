- { id: t1, frente: "Variables especiales", dorso: "$1 $2 argumentos · $# cantidad · \"$@\" todos · $0 nombre · $? último código · $$ PID." }
- { id: t2, frente: "Validar argumentos", dorso: "if [ $# -ne 2 ]; then echo \"Uso: $0 A B\" >&2; exit 2; fi" }
- { id: t3, frente: "read", dorso: "read -r -p \"Pregunta: \" var · read -r -s (sin eco) · while read -r linea; do ...; done < archivo" }
- { id: t4, frente: "Códigos de salida", dorso: "0 bien, otro valor problema. && si salió bien, || si falló. exit N termina el script." }
- { id: t5, frente: "stderr", dorso: "echo \"aviso\" >&2. Así se separa con 2> archivo." }
- { id: t6, frente: "Modo estricto", dorso: "set -euo pipefail: -e parar si falla, -u variables obligatorias, pipefail tuberías completas." }
