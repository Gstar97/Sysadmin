tipo: emparejar
consigna: Uní cada variable especial con lo que contiene.
pares:
  - { a: "$1", b: "El primer argumento" }
  - { a: "$#", b: "La cantidad de argumentos" }
  - { a: "\"$@\"", b: "Todos los argumentos, cada uno como palabra aparte" }
  - { a: "$0", b: "El nombre con el que se ejecutó el script" }
  - { a: "$?", b: "El código de salida del último comando" }
  - { a: "$$", b: "El número de proceso (PID) del script" }
explicacion: >-
  "$@" entre comillas es la forma correcta de pasar todos los argumentos a otro comando: respeta
  los que tienen espacios. $* los junta en una sola cadena.
