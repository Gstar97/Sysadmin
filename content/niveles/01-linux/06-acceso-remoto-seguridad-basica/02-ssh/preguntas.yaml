- id: p01
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Para qué sirve la huella que muestra ssh la primera vez que te conectas a un servidor?
  opciones:
    - { texto: "Para que confirmes que el servidor es el que crees, antes de darle tu contraseña", correcta: true, explicacion: "Es la identificación del servidor." }
    - { texto: "Es tu contraseña cifrada", explicacion: "Es del servidor, no tuya." }
    - { texto: "Es un código para activar la licencia", explicacion: "SSH no tiene licencias." }
    - { texto: "No sirve para nada, se responde yes", explicacion: "Es la defensa contra un impostor." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  enunciado: Te conectas a un servidor de siempre y aparece "REMOTE HOST IDENTIFICATION HAS CHANGED". ¿Qué haces primero?
  opciones:
    - { texto: "Averiguar si el servidor se reinstaló o cambió de IP, antes de borrar nada", correcta: true, explicacion: "Si no hay una explicación, puede ser un ataque." }
    - { texto: "Borrar ~/.ssh/known_hosts", explicacion: "Perderías la protección de todos los servidores." }
    - { texto: "Conectarte con -o StrictHostKeyChecking=no", explicacion: "Es pasar por alto la protección justo cuando importa." }
    - { texto: "Reiniciar tu equipo", explicacion: "No cambia nada." }
- id: p03
  tipo: completar_comando
  enunciado: Escribe el comando que borra de known_hosts la clave guardada para web02.
  aceptadas: [ssh-keygen -R web02, ssh-keygen -f ~/.ssh/known_hosts -R web02]
  explicacion: Deja una copia en known_hosts.old.
- id: p04
  tipo: completar_comando
  enunciado: Escribe el comando que ejecuta uptime en web01 como el usuario ana, sin abrir una sesión.
  aceptadas: [ssh ana@web01 uptime, "ssh ana@web01 'uptime'", "ssh ana@web01 \"uptime\"", ssh -l ana web01 uptime]
  explicacion: El comando se ejecuta en web01 y la salida vuelve a tu terminal.
- id: p05
  tipo: opcion_multiple
  enunciado: ¿Cómo se llama el servicio de SSH en Ubuntu y en Rocky?
  opciones:
    - { texto: "ssh en Ubuntu y sshd en Rocky", correcta: true, explicacion: "El programa es sshd en los dos; cambia el nombre de la unidad." }
    - { texto: "sshd en los dos", explicacion: "En Ubuntu la unidad es ssh." }
    - { texto: "openssh en los dos", explicacion: "Ese es el nombre del proyecto." }
    - { texto: "ssh en los dos", explicacion: "En Rocky es sshd." }
- id: p06
  tipo: interpretar_salida
  enunciado: ¿Qué muestra este registro de un servidor con SSH abierto a internet?
  salida: |
    Failed password for invalid user admin from 203.0.113.50 port 40112 ssh2
    Failed password for invalid user test from 203.0.113.50 port 40118 ssh2
    Failed password for root from 198.51.100.7 port 52210 ssh2
  opciones:
    - { texto: "Robots que prueban usuarios y contraseñas comunes", correcta: true, explicacion: "Pasa en todo servidor expuesto. Las claves SSH y no permitir contraseñas lo neutralizan." }
    - { texto: "Usuarios de la empresa que se olvidaron la contraseña", explicacion: "admin y test no son usuarios del servidor (invalid user)." }
    - { texto: "Un error de sshd", explicacion: "sshd está funcionando y rechazando." }
    - { texto: "Que alguien entró", explicacion: "Todos dicen Failed." }
- id: p07
  tipo: opcion_multiple
  enunciado: Estás en una sesión SSH en web01 y escribes exit. ¿Qué pasa?
  opciones:
    - { texto: "Se cierra la sesión en web01 y vuelves a la terminal de tu equipo", correcta: true, explicacion: "Aparece 'Connection to web01 closed.'." }
    - { texto: "Se apaga web01", explicacion: "exit cierra tu sesión, nada más." }
    - { texto: "Se detiene sshd en web01", explicacion: "El servicio sigue atendiendo a los demás." }
    - { texto: "Se borra tu usuario", explicacion: "No." }
- id: p08
  tipo: completar_comando
  enunciado: Escribe el comando para conectarte como ana a web01, cuyo sshd escucha en el puerto 2222.
  aceptadas: [ssh -p 2222 ana@web01, ssh ana@web01 -p 2222, ssh -p2222 ana@web01, ssh -l ana -p 2222 web01]
  explicacion: Con ssh la opción es -p minúscula (en scp es -P mayúscula).
