- { id: t1, frente: "Conectarse", dorso: "ssh usuario@servidor · ssh -p PUERTO ... · ssh servidor comando · exit o Ctrl+D para volver." }
- { id: t2, frente: "Orden de una conexión SSH", dorso: "Conexión al 22 → el servidor muestra su clave → cifrado → te identificas → sesión." }
- { id: t3, frente: "known_hosts", dorso: "~/.ssh/known_hosts guarda la clave de cada servidor. Si cambia: averiguar por qué, después ssh-keygen -R servidor." }
- { id: t4, frente: "sshd", dorso: "Rocky: servicio sshd, registro /var/log/secure. Ubuntu: servicio ssh, /var/log/auth.log. Config: /etc/ssh/sshd_config y sshd_config.d/." }
- { id: t5, frente: "Ver la huella en el servidor", dorso: "ssh-keygen -l -f /etc/ssh/ssh_host_ed25519_key.pub" }
