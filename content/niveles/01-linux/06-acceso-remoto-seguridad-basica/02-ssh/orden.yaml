tipo: ordenar
consigna: Ordena lo que pasa cuando escribes ssh ana@web01.
pasos:
  - Tu equipo abre una conexión al puerto 22 de web01
  - web01 presenta su clave de servidor
  - Tu equipo compara la huella con known_hosts (o te pregunta si es la primera vez)
  - Los dos acuerdan una clave para cifrar la conexión
  - web01 te pide que demuestres quién eres (contraseña o clave SSH)
  - Se abre tu sesión en web01
explicacion: >-
  Fíjate que el servidor se identifica antes de que tú escribas la contraseña. Así, si alguien se
  hiciera pasar por web01, te enterarías antes de darle tu contraseña.
