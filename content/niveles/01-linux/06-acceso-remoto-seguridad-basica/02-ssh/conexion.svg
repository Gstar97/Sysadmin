<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <rect x="20" y="20" width="190" height="340" rx="12" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <rect x="650" y="20" width="190" height="340" rx="12" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="115" y="46" text-anchor="middle" font-weight="700" fill="currentColor">Cliente (tu equipo)</text>
  <text x="115" y="64" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">ssh ana@web01</text>
  <text x="745" y="46" text-anchor="middle" font-weight="700" fill="currentColor">Servidor (web01)</text>
  <text x="745" y="64" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">sshd, puerto 22</text>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#fs)">
    <line x1="210" y1="100" x2="648" y2="100"/>
    <line x1="650" y1="150" x2="212" y2="150"/>
    <line x1="210" y1="215" x2="648" y2="215"/>
    <line x1="210" y1="270" x2="648" y2="270"/>
    <line x1="650" y1="320" x2="212" y2="320"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="430" y="92">1. Conexión al puerto 22</text>
    <text x="430" y="142">2. "Soy web01: esta es mi clave de servidor"</text>
    <text x="430" y="196">3. Acuerdan una clave para cifrar todo lo que sigue</text>
    <text x="430" y="207" font-size="11">(desde ahí, nadie en el medio puede leer ni cambiar nada)</text>
    <text x="430" y="262">4. Usuario y prueba: contraseña o clave SSH</text>
    <text x="430" y="312">5. "Bienvenida": se abre la sesión (un shell en web01)</text>
  </g>
  <rect x="30" y="160" width="170" height="44" rx="6" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="115" y="178" text-anchor="middle" font-size="11.5" fill="currentColor">Compara la huella con</text>
  <text x="115" y="194" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">~/.ssh/known_hosts</text>
  <rect x="660" y="240" width="170" height="44" rx="6" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="745" y="258" text-anchor="middle" font-size="11.5" fill="currentColor">Decide según</text>
  <text x="745" y="274" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">/etc/ssh/sshd_config</text>
</svg>
