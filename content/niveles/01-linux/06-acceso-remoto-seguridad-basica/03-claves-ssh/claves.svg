<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fk2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <rect x="20" y="20" width="300" height="290" rx="12" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="170" y="46" text-anchor="middle" font-weight="700" fill="currentColor">Tu equipo (admin01)</text>
  <rect x="40" y="66" width="260" height="62" rx="8" fill="var(--danger-soft, #fde2e1)" stroke="currentColor"/>
  <text x="56" y="88" font-family="ui-monospace, monospace" fill="currentColor">~/.ssh/id_ed25519</text>
  <text x="56" y="106" font-size="11.5" fill="currentColor">Clave PRIVADA: no sale nunca de aquí.</text>
  <text x="56" y="121" font-size="11.5" fill="currentColor">Permisos 600. Mejor con frase de paso.</text>
  <rect x="40" y="142" width="260" height="62" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="56" y="164" font-family="ui-monospace, monospace" fill="currentColor">~/.ssh/id_ed25519.pub</text>
  <text x="56" y="182" font-size="11.5" fill="currentColor">Clave PÚBLICA: se puede copiar a</text>
  <text x="56" y="197" font-size="11.5" fill="currentColor">todos los servidores donde quieras entrar.</text>
  <text x="40" y="236" font-size="11.5" fill="currentColor">Al conectarte, ssh firma un desafío del</text>
  <text x="40" y="252" font-size="11.5" fill="currentColor">servidor con la privada. El servidor lo</text>
  <text x="40" y="268" font-size="11.5" fill="currentColor">comprueba con la pública. La privada</text>
  <text x="40" y="284" font-size="11.5" fill="currentColor">nunca viaja por la red.</text>

  <rect x="540" y="20" width="300" height="290" rx="12" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="690" y="46" text-anchor="middle" font-weight="700" fill="currentColor">Servidor (web01)</text>
  <rect x="560" y="66" width="260" height="108" rx="8" fill="var(--surface, #fff)" stroke="currentColor"/>
  <text x="576" y="88" font-family="ui-monospace, monospace" fill="currentColor">/home/ana/.ssh/authorized_keys</text>
  <text x="576" y="108" font-size="11.5" fill="currentColor">Una clave pública por línea: quien</text>
  <text x="576" y="123" font-size="11.5" fill="currentColor">tenga la privada de alguna, entra</text>
  <text x="576" y="138" font-size="11.5" fill="currentColor">como ana.</text>
  <text x="576" y="160" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">ssh-ed25519 AAAAC3Nz... ana@admin01</text>
  <text x="560" y="204" font-size="11.5" fill="currentColor" font-weight="700">sshd exige (StrictModes):</text>
  <text x="560" y="222" font-size="11.5" fill="currentColor">• home y ~/.ssh que nadie más pueda modificar</text>
  <text x="560" y="240" font-size="11.5" fill="currentColor">  (~/.ssh con 700)</text>
  <text x="560" y="258" font-size="11.5" fill="currentColor">• authorized_keys con 600 y de ana</text>
  <text x="560" y="276" font-size="11.5" fill="currentColor">Si no, ignora la clave y pide contraseña.</text>

  <line x1="300" y1="173" x2="556" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#fk2)"/>
  <text x="428" y="146" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">ssh-copy-id web01</text>
  <text x="428" y="182" text-anchor="middle" font-size="11.5" fill="currentColor">copia solo la pública</text>
</svg>
