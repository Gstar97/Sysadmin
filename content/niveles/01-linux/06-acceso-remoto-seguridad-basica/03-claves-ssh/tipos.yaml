tipo: emparejar
consigna: Une cada archivo con lo que es.
pares:
  - { a: "~/.ssh/id_ed25519", b: "Tu clave privada: solo en tu equipo, con permisos 600" }
  - { a: "~/.ssh/id_ed25519.pub", b: "Tu clave pública: la copias a los servidores" }
  - { a: "~/.ssh/authorized_keys (en el servidor)", b: "Las claves públicas que pueden entrar como ese usuario" }
  - { a: "~/.ssh/known_hosts", b: "Las claves de los servidores que ya conoces" }
  - { a: "/etc/ssh/sshd_config.d/01-endurecido.conf", b: "Tus ajustes de sshd, en un archivo propio" }
explicacion: >-
  La confusión más común es entre authorized_keys (quién puede entrar a este servidor) y
  known_hosts (qué servidores conozco yo).
