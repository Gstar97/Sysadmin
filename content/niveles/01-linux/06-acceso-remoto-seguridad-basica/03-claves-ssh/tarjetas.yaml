- { id: t1, frente: "Par de claves", dorso: "Privada ~/.ssh/id_ed25519 (600, con frase, no se mueve). Pública .pub (se reparte)." }
- { id: t2, frente: "Instalar la clave", dorso: "ssh-copy-id servidor · a mano: ~/.ssh 700 y authorized_keys 600 en el servidor." }
- { id: t3, frente: "La clave se ignora", dorso: "Permisos (StrictModes): mirar el registro del servidor. En Rocky, también restorecon -Rv ~/.ssh." }
- { id: t4, frente: "ssh-agent", dorso: "eval \"$(ssh-agent -s)\" · ssh-add · ssh-add -l. La frase una vez por sesión." }
- { id: t5, frente: "Endurecer sshd", dorso: "sshd_config.d/01-....conf: PasswordAuthentication no, PermitRootLogin no. Gana el primer valor. sshd -T muestra el efectivo." }
- { id: t6, frente: "Orden seguro", dorso: "Clave probada → sesión abierta → sshd -t → reload → probar desde otra terminal → recién ahí cerrar." }
