- id: p01
  tipo: opcion_multiple
  diagnostico: true
  enunciado: En Rocky, nginx da 403 con un archivo que tiene permisos 644 y está en una carpeta 755. ¿Qué revisás?
  opciones:
    - { texto: "La etiqueta de SELinux con ls -Z y las denegaciones con ausearch -m avc", correcta: true, explicacion: "Con los permisos bien, el siguiente sospechoso es SELinux." }
    - { texto: "Darle chmod 777", explicacion: "Si los permisos ya alcanzan, no cambia nada." }
    - { texto: "Reinstalar nginx", explicacion: "nginx no es el problema." }
    - { texto: "Apagar SELinux", explicacion: "Es esconder el problema y quitar una protección." }
- id: p02
  tipo: opcion_multiple
  diagnostico: true
  enunciado: Movés (mv) un archivo de tu home a /var/www/html. ¿Qué etiqueta tiene?
  opciones:
    - { texto: "La que tenía en el home (user_home_t): mv conserva la etiqueta", correcta: true, explicacion: "Por eso después hace falta restorecon." }
    - { texto: "httpd_sys_content_t, la de /var/www/html", explicacion: "Eso pasaría con cp, que crea un archivo nuevo." }
    - { texto: "Ninguna", explicacion: "Todos los archivos tienen etiqueta." }
    - { texto: "root_t", explicacion: "No." }
- id: p03
  tipo: completar_comando
  enunciado: Escribí el comando que vuelve a poner las etiquetas correctas en /var/www/html y todo lo de adentro, mostrando lo que cambia.
  aceptadas: [sudo restorecon -Rv /var/www/html, restorecon -Rv /var/www/html, sudo restorecon -rv /var/www/html, sudo restorecon -vR /var/www/html]
  explicacion: -R recursivo, -v muestra cada cambio.
- id: p04
  tipo: completar_comando
  enunciado: Escribí el comando que permite a sshd usar el puerto 2222 en SELinux.
  aceptadas: [sudo semanage port -a -t ssh_port_t -p tcp 2222, semanage port -a -t ssh_port_t -p tcp 2222]
  explicacion: Además hay que abrir el 2222 en el firewall.
- id: p05
  tipo: interpretar_salida
  enunciado: ¿Qué dice esta denegación?
  salida: |
    type=AVC msg=audit(1793576586.008:1201): avc:  denied  { name_bind } for  pid=1156 comm="nginx" src=8090 scontext=system_u:system_r:httpd_t:s0 tcontext=system_u:object_r:unreserved_port_t:s0 tclass=tcp_socket permissive=0
  opciones:
    - { texto: "nginx no puede escuchar en el puerto 8090 porque no está etiquetado como puerto web", correcta: true, explicacion: "Se arregla con semanage port -a -t http_port_t -p tcp 8090." }
    - { texto: "nginx no puede leer un archivo", explicacion: "Sería { read } y tclass=file." }
    - { texto: "El firewall bloquea el 8090", explicacion: "Es SELinux (avc), no el firewall." }
    - { texto: "Otro programa usa el 8090", explicacion: "Eso daría Address already in use." }
- id: p06
  tipo: opcion_multiple
  enunciado: ¿Para qué sirve sudo setenforce 0?
  opciones:
    - { texto: "Para confirmar si un problema es de SELinux: lo pone en permissive hasta reiniciar, y después se vuelve con setenforce 1", correcta: true, explicacion: "Es una prueba, no un arreglo." }
    - { texto: "Para apagar SELinux para siempre", explicacion: "Es temporal y no lo apaga: queda en permissive." }
    - { texto: "Para reetiquetar el disco", explicacion: "Eso es otra cosa." }
    - { texto: "Para que nginx tenga más permisos", explicacion: "Afecta a todo el sistema." }
- id: p07
  tipo: opcion_multiple
  enunciado: ¿Por qué no conviene arreglar una etiqueta con chcon?
  opciones:
    - { texto: "Porque es temporal: el próximo restorecon o reetiquetado lo deshace", correcta: true, explicacion: "Lo permanente es semanage fcontext -a + restorecon." }
    - { texto: "Porque necesita reiniciar", explicacion: "Se aplica al momento." }
    - { texto: "Porque solo funciona en Ubuntu", explicacion: "chcon es de SELinux." }
    - { texto: "Porque borra el archivo", explicacion: "No." }
- id: p08
  tipo: opcion_multiple
  enunciado: nginx funciona como proxy hacia una aplicación en 127.0.0.1:3000 y devuelve 502. ausearch muestra name_connect denegado. ¿Qué hacés?
  opciones:
    - { texto: "sudo setsebool -P httpd_can_network_connect on", correcta: true, explicacion: "Es el booleano que permite a los servicios web conectarse a otros puertos." }
    - { texto: "semanage port -a -t http_port_t -p tcp 3000", explicacion: "Eso es para escuchar en un puerto; acá nginx se conecta a otro." }
    - { texto: "restorecon -Rv /etc/nginx", explicacion: "No es un problema de archivos." }
    - { texto: "setenforce 0", explicacion: "No es un arreglo." }
- id: p09
  tipo: opcion_multiple
  enunciado: En Ubuntu, ¿qué cumple un papel parecido al de SELinux?
  opciones:
    - { texto: "AppArmor, con perfiles por programa en /etc/apparmor.d", correcta: true, explicacion: "aa-status muestra qué está confinado." }
    - { texto: "ufw", explicacion: "ufw es el firewall." }
    - { texto: "sudo", explicacion: "sudo da privilegios; no confina programas." }
    - { texto: "Ninguno, Ubuntu no tiene", explicacion: "Tiene AppArmor." }
