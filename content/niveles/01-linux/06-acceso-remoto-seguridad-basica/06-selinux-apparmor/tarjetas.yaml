- { id: t1, frente: "SELinux en una frase", dorso: "Cada programa (por su tipo) solo puede tocar lo que su política permite, aunque los permisos digan que sí." }
- { id: t2, frente: "Modos", dorso: "Enforcing (así queda) · Permissive (setenforce 0, solo para diagnosticar) · Disabled (no)." }
- { id: t3, frente: "Ver etiquetas", dorso: "ls -Z (archivos) · ps -eZ (procesos). mv conserva la etiqueta; cp toma la del destino." }
- { id: t4, frente: "Encontrar la causa", dorso: "sudo ausearch -m avc -ts recent (| audit2why)." }
- { id: t5, frente: "Etiqueta de archivo", dorso: "restorecon -Rv RUTA. Lugar nuevo: semanage fcontext -a -t TIPO \"RUTA(/.*)?\" y después restorecon." }
- { id: t6, frente: "Puerto y booleano", dorso: "semanage port -a -t http_port_t -p tcp 8090 · setsebool -P httpd_can_network_connect on." }
- { id: t7, frente: "AppArmor", dorso: "Ubuntu. Perfiles en /etc/apparmor.d · sudo aa-status · denegaciones apparmor=\"DENIED\" en journalctl -k." }
