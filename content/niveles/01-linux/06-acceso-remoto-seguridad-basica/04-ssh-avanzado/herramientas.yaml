tipo: emparejar
consigna: Une cada necesidad con la herramienta que corresponde.
pares:
  - { a: "Copiar un archivo suelto a otro servidor", b: "scp archivo servidor:/ruta/" }
  - { a: "Mantener una carpeta igual en otro servidor, copiando solo lo que cambió", b: "rsync -av carpeta/ servidor:/ruta/" }
  - { a: "Entrar a un servidor de una red interna pasando por el de entrada", b: "ssh -J bastion servidor" }
  - { a: "No escribir cada vez usuario, IP, puerto y bastión", b: "Un bloque Host en ~/.ssh/config" }
  - { a: "Usar desde tu equipo una base de datos que solo escucha en 127.0.0.1 del servidor", b: "ssh -L 5432:localhost:5432 servidor" }
explicacion: >-
  Todas viajan por SSH: el mismo puerto 22, el mismo cifrado y las mismas claves.
