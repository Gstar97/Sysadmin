- { id: t1, frente: "~/.ssh/config", dorso: "Host alias / HostName / User / Port / IdentityFile / ProxyJump. Gana el primero. chmod 600. ssh -G servidor muestra lo efectivo." }
- { id: t2, frente: "Bastión", dorso: "Único punto de entrada a una red interna. ssh -J bastion servidor. La privada no sale de tu equipo." }
