  <path d="M115 166 C 115 215, 745 215, 745 170" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#fb)"/>
  <text x="430" y="226" text-anchor="middle" font-size="11.5" fill="currentColor">la sesión con db01 va cifrada de punta a punta: el bastión solo pasa los datos</text>
  <text x="430" y="272" text-anchor="middle" font-family="ui-monospace, monospace" fill="currentColor">ssh -J bastion db01</text>
  <text x="430" y="290" text-anchor="middle" font-size="11.5" fill="currentColor">(o ProxyJump bastion en ~/.ssh/config)</text>
  <text x="268" y="128" text-anchor="middle" font-size="11" fill="currentColor">puerto 22</text>
  <text x="588" y="128" text-anchor="middle" font-size="11" fill="currentColor">puerto 22</text>
