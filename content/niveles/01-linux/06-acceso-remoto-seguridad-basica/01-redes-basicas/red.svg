<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <rect x="20" y="40" width="560" height="270" rx="14" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-dasharray="6 4"/>
  <text x="36" y="64" font-weight="700" fill="currentColor">Red de la oficina: 192.168.10.0/24</text>
  <text x="36" y="82" font-size="11.5" fill="currentColor">Todas las direcciones empiezan con 192.168.10. y se hablan directo.</text>
  <line x1="60" y1="190" x2="540" y2="190" stroke="currentColor" stroke-width="3"/>
  <g stroke="currentColor" fill="var(--surface, #fff)">
    <rect x="50" y="110" width="110" height="50" rx="8"/>
    <rect x="190" y="110" width="110" height="50" rx="8"/>
    <rect x="330" y="110" width="110" height="50" rx="8"/>
    <rect x="190" y="230" width="110" height="50" rx="8"/>
    <rect x="440" y="230" width="120" height="50" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="105" y="132" font-weight="700">tu PC</text><text x="105" y="149" font-family="ui-monospace, monospace" font-size="11.5">192.168.10.50</text>
    <text x="245" y="132" font-weight="700">app01</text><text x="245" y="149" font-family="ui-monospace, monospace" font-size="11.5">192.168.10.15</text>
    <text x="385" y="132" font-weight="700">web01</text><text x="385" y="149" font-family="ui-monospace, monospace" font-size="11.5">192.168.10.20</text>
    <text x="245" y="252" font-weight="700">DNS</text><text x="245" y="269" font-family="ui-monospace, monospace" font-size="11.5">192.168.10.2</text>
    <text x="500" y="252" font-weight="700">puerta de enlace</text><text x="500" y="269" font-family="ui-monospace, monospace" font-size="11.5">192.168.10.1</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="105" y1="160" x2="105" y2="190"/><line x1="245" y1="160" x2="245" y2="190"/><line x1="385" y1="160" x2="385" y2="190"/>
    <line x1="245" y1="190" x2="245" y2="230"/><line x1="500" y1="190" x2="500" y2="230"/>
  </g>
  <line x1="560" y1="255" x2="650" y2="255" stroke="currentColor" stroke-width="1.5" marker-end="url(#fr)"/>
  <rect x="655" y="225" width="185" height="60" rx="30" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="747" y="251" text-anchor="middle" font-weight="700" fill="currentColor">Otras redes</text>
  <text x="747" y="268" text-anchor="middle" font-size="11.5" fill="currentColor">internet, la red de la base</text>
  <g fill="currentColor" font-size="11.5">
    <text x="620" y="96" font-weight="700">Para llegar a web01:</text>
    <text x="620" y="114">1. "web01" → DNS → 192.168.10.20</text>
    <text x="620" y="132">2. ¿Misma red? Sí: directo.</text>
    <text x="620" y="150">3. Puerto 22 (ssh) u 80 (web)</text>
    <text x="620" y="178" font-weight="700">Para llegar a otra red:</text>
    <text x="620" y="196">se manda a la puerta de enlace.</text>
  </g>
</svg>
