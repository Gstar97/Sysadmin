- { id: t1, frente: "IP, máscara y puerta de enlace", dorso: "ip -br a (IP/máscara) · ip route (default via = puerta de enlace). Misma red: directo; otra red: por la puerta de enlace." }
- { id: t2, frente: "Resolver un nombre", dorso: "getent hosts NOMBRE (como los programas: /etc/hosts y después DNS) · dig +short NOMBRE (solo DNS)." }
- { id: t3, frente: "Quién escucha", dorso: "sudo ss -tlnp. 0.0.0.0 = desde cualquier lado; 127.0.0.1 = solo desde el mismo servidor." }
- { id: t4, frente: "Puertos habituales", dorso: "22 SSH · 80/443 web · 53 DNS · 123 hora (UDP) · 3306 MariaDB · 5432 PostgreSQL." }
- { id: t5, frente: "Escalones del diagnóstico", dorso: "IP y ruta → nombre → equipo (ping) → puerto (nc -zv) → servicio (curl, ssh)." }
- { id: t6, frente: "refused o timed out", dorso: "Refused: llegaste, no hay servicio en ese puerto. Timed out: nadie respondió (sin camino o firewall que descarta)." }
