tipo: emparejar
consigna: Uní cada mensaje con lo que te está diciendo.
pares:
  - { a: "Could not resolve hostname web01", b: "El nombre no se pudo traducir a una IP (DNS o /etc/hosts)" }
  - { a: "Connection refused", b: "Llegaste al servidor, pero nada escucha en ese puerto" }
  - { a: "Connection timed out", b: "No hubo respuesta: no hay camino o un firewall descarta en silencio" }
  - { a: "No route to host", b: "Algo en el camino (o el firewall del servidor) rechazó la conexión" }
  - { a: "Destination Host Unreachable", b: "En tu misma red nadie responde con esa IP: equipo apagado o IP equivocada" }
explicacion: >-
  Cada mensaje te dice en qué escalón se cortó: el nombre, el camino, el firewall o el servicio.
  Leerlo bien te ahorra probar cosas al azar.
