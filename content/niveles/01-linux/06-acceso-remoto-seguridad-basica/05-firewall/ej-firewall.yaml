tipo: terminal
shell: bash
titulo: Abrir lo justo
descripcion: >-
  En web01 (Rocky) nginx funciona, pero nadie ve la web. En app02 (Ubuntu) todavía no hay
  firewall y hay que activarlo, dejando SSH y la base de datos solo para la red de oficina.
  Trabajas desde admin01, y tu clave ya está en los dos servidores.
estado_inicial:
  distro: rocky
  hostname: admin01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true, clave_ssh: true }
  red:
    interfaces:
      - { nombre: enp0s3, ip: 192.168.10.5/24 }
  servidores:
    - ip: 192.168.10.20
      hostname: web01
      usuarios: [{ nombre: ana, sudo: true, clave_ssh: true }]
      clave_conocida: si
      paquetes: { instalados: [nginx] }
      servicios: { nginx: { activo: true, habilitado: true } }
    - { ip: 192.168.10.25, hostname: app02, distro: ubuntu, usuarios: [{ nombre: ana, sudo: true, clave_ssh: true }], clave_conocida: si }
pasos:
  - consigna: Desde admin01, pide la página de web01 para ver el problema.
    verificar:
      - { comando_usado: 'curl\s+.*web01' }
      - { salida_contiene: No route to host }
    pistas:
      - "`curl -I http://web01`"
    solucion: [curl -I http://web01]
    explicacion: >-
      "No route to host" con un servidor que responde al ping y a SSH: es el firewall de web01
      rechazando el puerto 80.
  - consigna: Entra a web01 y mira qué permite el firewall.
    verificar:
      - { comando_usado: 'firewall-cmd\s+.*--list-(all|services)' }
      - { salida_contiene: ssh }
    pistas:
      - "`ssh web01` y `sudo firewall-cmd --list-all`"
    solucion: [ssh web01, sudo firewall-cmd --list-all]
    explicacion: Solo ssh, cockpit y dhcpv6-client. Falta http.
  - consigna: Permite el servicio http de forma permanente y aplica el cambio.
    verificar:
      - { comando_usado: 'firewall-cmd\s+.*--permanent.*--add-service=http|firewall-cmd\s+.*--add-service=http.*--permanent' }
      - { comando_usado: 'firewall-cmd\s+--reload' }
      - { en: web01, verificar: { firewall_permite: 80/tcp } }
    pistas:
      - "`sudo firewall-cmd --permanent --add-service=http` y `sudo firewall-cmd --reload`"
    solucion: [sudo firewall-cmd --permanent --add-service=http, sudo firewall-cmd --reload]
    explicacion: --permanent lo guarda; --reload lo aplica. Sin el reload, lo verías recién después de reiniciar.
  - consigna: Quita cockpit, que en este servidor no se usa, también de forma permanente.
    verificar:
      - { comando_usado: 'firewall-cmd\s+.*--remove-service=cockpit' }
      - { en: web01, verificar: { firewall_permite: 9090/tcp, permite: false } }
    pistas:
      - "`sudo firewall-cmd --permanent --remove-service=cockpit`, `sudo firewall-cmd --reload` y `sudo firewall-cmd --list-services`"
    solucion: [sudo firewall-cmd --permanent --remove-service=cockpit, sudo firewall-cmd --reload, sudo firewall-cmd --list-services]
    explicacion: Lo que no se usa, se cierra. Cada puerto abierto es algo más para vigilar.
  - consigna: Vuelve a admin01 y comprueba que la web ya se ve.
    verificar:
      - { comando_usado: 'curl\s+.*web01' }
      - { salida_contiene: 200 OK }
    pistas:
      - "`exit` y `curl -I http://web01`"
    solucion: [exit, curl -I http://web01]
    explicacion: Probar desde afuera es la única prueba que vale para un firewall.
  - consigna: >-
      Entra a app02 y activa ufw sin quedarte afuera: primero permite OpenSSH, después actívalo.
    verificar:
      - { en: app02, verificar: { ufw_activo: true } }
      - { en: app02, verificar: { firewall_permite: 22/tcp } }
    pistas:
      - "`ssh app02`, `sudo ufw allow OpenSSH` y `sudo ufw enable`"
    solucion: [ssh app02, sudo ufw allow OpenSSH, sudo ufw enable]
    explicacion: Con ufw, lo que no está permitido se descarta. Si lo activas sin permitir SSH, tu próxima conexión no entra.
  - consigna: Permite el puerto 5432 (PostgreSQL) solo desde la red de oficina, 192.168.10.0/24, y mira las reglas.
    verificar:
      - { comando_usado: 'ufw\s+allow\s+from\s+192\.168\.10\.0/24\s+to\s+any\s+port\s+5432' }
      - { en: app02, verificar: { firewall_permite: 5432/tcp, desde: 192.168.10.5 } }
      - { en: app02, verificar: { firewall_permite: 5432/tcp, desde: 203.0.113.10, permite: false } }
    pistas:
      - "`sudo ufw allow from 192.168.10.0/24 to any port 5432` y `sudo ufw status`"
    solucion: [sudo ufw allow from 192.168.10.0/24 to any port 5432, sudo ufw status]
    explicacion: Una regla con origen es mucho mejor que abrir el puerto a todo el mundo.
  - consigna: Vuelve a admin01 y prueba desde afuera el 22 y el 8080 de app02 (este último no está permitido).
    verificar:
      - { comando_usado: 'nc\s+-\w*z\w*\s+.*app02\s+8080' }
      - { salida_contiene: timed out }
    pistas:
      - "`exit`, `nc -zv app02 22` y `nc -zv app02 8080`"
    solucion: [exit, nc -zv app02 22, nc -zv app02 8080]
    explicacion: El 22 pasa; el 8080 no responde nada (timed out), porque ufw lo descarta en silencio.
