- { id: t1, frente: "Idea del firewall", dorso: "Todo cerrado salvo lo permitido. Segunda barrera: no reemplaza configurar bien los servicios." }
- { id: t2, frente: "firewalld", dorso: "--list-all · --permanent --add-service=http / --add-port=8090/tcp / --remove-service=X · --reload." }
- { id: t3, frente: "runtime y permanent", dorso: "Sin --permanent: dura hasta reiniciar. Con --permanent: se aplica con --reload. --runtime-to-permanent guarda lo actual." }
- { id: t4, frente: "ufw", dorso: "allow OpenSSH ANTES de enable · allow 80/tcp · allow from RED to any port N · status numbered · delete N." }
- { id: t5, frente: "Cómo responde un puerto cerrado", dorso: "firewalld: rechaza (No route to host). ufw: descarta (timed out). Sin firewall y sin servicio: refused." }
- { id: t6, frente: "Probar un firewall", dorso: "Desde OTRO equipo: nc -zv servidor puerto, curl -I http://servidor." }
