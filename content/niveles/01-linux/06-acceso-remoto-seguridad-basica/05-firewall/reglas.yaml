tipo: emparejar
consigna: Une cada tarea con el comando, en Rocky (firewalld) o en Ubuntu (ufw).
pares:
  - { a: "Rocky: ver qué está permitido", b: "sudo firewall-cmd --list-all" }
  - { a: "Rocky: permitir la web de forma permanente", b: "sudo firewall-cmd --permanent --add-service=http y después --reload" }
  - { a: "Rocky: abrir un puerto que no tiene nombre de servicio", b: "sudo firewall-cmd --permanent --add-port=8090/tcp" }
  - { a: "Ubuntu: dejar pasar SSH antes de activar", b: "sudo ufw allow OpenSSH" }
  - { a: "Ubuntu: permitir el 5432 solo desde la red de oficina", b: "sudo ufw allow from 192.168.10.0/24 to any port 5432" }
  - { a: "Ubuntu: ver las reglas numeradas para borrar una", b: "sudo ufw status numbered" }
explicacion: >-
  En firewalld, sin --permanent el cambio se pierde al reiniciar; con --permanent no se aplica
  hasta el --reload. En ufw cada regla queda guardada al momento.
