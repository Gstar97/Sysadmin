<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <text x="20" y="28" font-weight="700" fill="currentColor">Conexiones que llegan a web01</text>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="12">
    <text x="20" y="80">puerto 22 (ssh)</text>
    <text x="20" y="130">puerto 80 (web)</text>
    <text x="20" y="180">puerto 5432</text>
    <text x="20" y="230">puerto 9090</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#ff)" fill="none">
    <line x1="150" y1="76" x2="318" y2="76"/>
    <line x1="150" y1="126" x2="318" y2="126"/>
    <line x1="150" y1="176" x2="318" y2="176"/>
    <line x1="150" y1="226" x2="318" y2="226"/>
  </g>
  <rect x="320" y="50" width="160" height="200" rx="10" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="400" y="74" text-anchor="middle" font-weight="700" fill="currentColor">Firewall</text>
  <text x="400" y="92" text-anchor="middle" font-size="11.5" fill="currentColor">lista de lo permitido;</text>
  <text x="400" y="107" text-anchor="middle" font-size="11.5" fill="currentColor">lo demás, no pasa</text>
  <g font-size="12" fill="currentColor">
    <text x="340" y="140">ssh ✔</text>
    <text x="340" y="160">http ✔</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#ff)" fill="none">
    <line x1="480" y1="76" x2="618" y2="76"/>
    <line x1="480" y1="126" x2="618" y2="126"/>
  </g>
  <rect x="620" y="50" width="220" height="100" rx="10" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="730" y="80" text-anchor="middle" fill="currentColor">sshd (22)</text>
  <text x="730" y="130" text-anchor="middle" fill="currentColor">nginx (80)</text>
  <g fill="currentColor" font-size="11.5">
    <text x="500" y="180">5432 y 9090: se cortan antes de llegar.</text>
    <text x="500" y="198">firewalld responde "prohibido"</text>
    <text x="500" y="214">(el cliente ve No route to host);</text>
    <text x="500" y="230">ufw no responde nada (Connection timed out).</text>
  </g>
  <text x="20" y="284" font-size="11.5" fill="currentColor">El firewall no reemplaza la configuración de cada servicio: es una segunda barrera por si algo quedó escuchando sin querer.</text>
</svg>
