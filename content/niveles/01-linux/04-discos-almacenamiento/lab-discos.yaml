tipo: pasos
titulo: Almacenamiento con LVM en rocky01
descripcion: >-
  Vas a agregarle dos discos a rocky01, armar un grupo de volúmenes con ellos, crear volúmenes
  para /srv/datos y /var/log, montarlos por UUID y agrandarlos sin apagar nada. Al final repites
  la parte básica en ubuntu01.
pasos:
  - titulo: Toma una instantánea
    detalle: >-
      Vas a tocar fstab y a mover /var/log: si algo sale mal, el servidor puede no arrancar.
      Apaga rocky01 y toma una instantánea llamada antes-de-discos (con la VM apagada, la
      instantánea es más simple y segura).
    comprobar: La instantánea aparece en tu hipervisor.
  - titulo: Agrega dos discos virtuales
    detalle: >-
      En la configuración de la VM, agrega dos discos nuevos de 5 GiB cada uno (en VirtualBox:
      Configuración → Almacenamiento → agregar disco al controlador). Enciende la VM y entra por
      SSH.
    comandos:
      - lsblk
    comprobar: lsblk muestra sdb y sdc de 5G, sin particiones.
    si_falla: Si no aparecen, revisa que los discos estén conectados al mismo controlador que sda y reinicia la VM.
  - titulo: Particiona los dos discos para LVM
    comandos:
      - sudo parted -s /dev/sdb mklabel gpt mkpart lvm 1MiB 100% set 1 lvm on
      - sudo parted -s /dev/sdc mklabel gpt mkpart lvm 1MiB 100% set 1 lvm on
      - lsblk /dev/sdb /dev/sdc
    comprobar: Cada disco tiene una partición (sdb1 y sdc1) que ocupa todo el disco.
  - titulo: Arma el grupo y los volúmenes
    comandos:
      - sudo vgcreate datos /dev/sdb1 /dev/sdc1
      - sudo lvcreate -n srv -L 3G datos
      - sudo lvcreate -n logs -L 2G datos
      - sudo vgs; sudo lvs
    comprobar: "`vgs` muestra el grupo datos de casi 10 GiB con unos 5 GiB libres, y `lvs` los dos volúmenes."
  - titulo: Crea los sistemas de archivos y monta /srv/datos por UUID
    comandos:
      - sudo mkfs.xfs /dev/datos/srv
      - sudo mkfs.xfs /dev/datos/logs
      - sudo mkdir -p /srv/datos
      - sudo cp /etc/fstab /etc/fstab.bak
      - echo "UUID=$(sudo blkid -s UUID -o value /dev/datos/srv) /srv/datos xfs defaults 0 0" | sudo tee -a /etc/fstab
      - sudo findmnt --verify
      - sudo systemctl daemon-reload && sudo mount -a
      - df -h /srv/datos
    comprobar: findmnt --verify no da errores y df muestra /srv/datos con unos 3 GiB.
  - titulo: Mueve /var/log al volumen logs
    detalle: >-
      Mover /var/log con el sistema funcionando tiene una trampa: los servicios tienen abiertos
      los logs viejos. Por eso se copian los datos, se monta el volumen nuevo y se reinicia. En
      Rocky, además, hay que restaurar las etiquetas de SELinux (lo vas a ver en el módulo 1.6).
    comandos:
      - sudo mkdir /mnt/logs && sudo mount /dev/datos/logs /mnt/logs
      - sudo cp -a /var/log/. /mnt/logs/
      - sudo umount /mnt/logs
      - echo "UUID=$(sudo blkid -s UUID -o value /dev/datos/logs) /var/log xfs defaults 0 0" | sudo tee -a /etc/fstab
      - sudo findmnt --verify
      - sudo systemctl daemon-reload && sudo mount /var/log
      - sudo restorecon -R /var/log
      - sudo reboot
    comprobar: Después del reinicio, `findmnt /var/log` muestra /dev/mapper/datos-logs y `journalctl -b` funciona.
    si_falla: >-
      Si el servidor arranca en modo de emergencia, entra con la contraseña de root, revisa
      `journalctl -xb`, comenta la línea nueva de fstab, `systemctl daemon-reload` y
      `systemctl default`. Si no puedes entrar, vuelve a la instantánea.
  - titulo: Agranda /srv/datos en caliente
    detalle: Mientras escribes un archivo en /srv/datos, agranda el volumen con el espacio libre del grupo.
    comandos:
      - sudo fallocate -l 2G /srv/datos/relleno
      - df -h /srv/datos
      - sudo lvextend -r -L +2G datos/srv
      - df -h /srv/datos
      - sudo rm /srv/datos/relleno
    comprobar: df pasa de unos 3 GiB a unos 5 GiB sin desmontar nada.
  - titulo: Agranda un disco virtual y aprovecha el espacio
    detalle: >-
      En el hipervisor, agranda el disco sdc de 5 a 8 GiB con la VM encendida (si tu hipervisor
      no lo permite, apágala, agrándalo y enciéndela). Después, Linux tiene que enterarse en tres
      capas: el disco, la partición y el PV.
    comandos:
      - echo 1 | sudo tee /sys/class/block/sdc/device/rescan
      - lsblk /dev/sdc
      - sudo parted /dev/sdc resizepart 1 100%
      - sudo pvresize /dev/sdc1
      - sudo vgs
    comprobar: vgs muestra 3 GiB más libres en el grupo datos.
    si_falla: >-
      Si parted pregunta por la copia de la tabla GPT ("Fix/Ignore?"), responde Fix: la tabla de
      respaldo tiene que estar al final del disco, que se movió.
  - titulo: Agrega 1 GiB de swap en un archivo
    comandos:
      - sudo fallocate -l 1G /swapfile && sudo chmod 600 /swapfile
      - sudo mkswap /swapfile && sudo swapon /swapfile
      - echo '/swapfile none swap defaults 0 0' | sudo tee -a /etc/fstab
      - swapon --show
    comprobar: swapon --show muestra rl-swap y /swapfile.
  - titulo: Repite lo básico en ubuntu01
    detalle: |-
      Agrega un disco de 5 GiB a ubuntu01 y crea un volumen montado en /srv/datos. Ten en cuenta:
      - El sistema de archivos habitual es ext4 (mkfs.ext4), y en fstab el último campo va en 2.
      - Mira sudo vgs: si ubuntu-vg tiene espacio libre (VFree), puedes agrandar la raíz con sudo lvextend -r -l +100%FREE ubuntu-vg/ubuntu-lv.
      - Ubuntu no usa SELinux: no hace falta restorecon.
    comprobar: /srv/datos de ubuntu01 aparece en df -h y sobrevive a un reinicio.
  - titulo: Documenta
    detalle: >-
      En tu cuaderno técnico: discos, particiones, grupo y volúmenes con sus tamaños, qué se
      monta dónde (con el UUID), cómo se agranda cada volumen y dónde está la copia de fstab.
    comprobar: Otra persona podría agrandar /srv/datos leyendo solo tu documento.
