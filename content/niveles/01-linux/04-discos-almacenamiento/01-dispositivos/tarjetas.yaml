- { id: t1, frente: "Dispositivo de bloque", dorso: "Disco, partición o volumen; se lee y escribe en bloques. Aparece en /dev (ls -l muestra una b)." }
- { id: t2, frente: "Nombres de discos", dorso: "sda, sdb (SATA/SCSI/USB/virtual) · vda (virtio) · nvme0n1 (NVMe, particiones nvme0n1p1) · sr0 (CD)." }
- { id: t3, frente: "UUID", dorso: "Identificador del sistema de archivos que no cambia si el disco cambia de nombre. Se usa en /etc/fstab." }
- { id: t4, frente: "Capas del almacenamiento", dorso: "Disco → partición → (LVM) → sistema de archivos → carpeta." }
- { id: t5, frente: "Inventario de discos", dorso: "lsblk · lsblk -f · sudo blkid · sudo fdisk -l · df -h" }
- { id: t6, frente: "Disposición por defecto", dorso: "Rocky: /boot xfs + LVM rl-root (xfs) y rl-swap. Ubuntu: /boot ext4 + LVM ubuntu-lv (ext4) y /swap.img." }
