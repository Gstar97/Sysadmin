tipo: emparejar
consigna: Une cada comando con lo que te muestra.
pares:
  - { a: "lsblk", b: "El árbol de discos, particiones y volúmenes, con su tamaño y dónde están montados" }
  - { a: "lsblk -f", b: "El mismo árbol con el sistema de archivos, la etiqueta y el UUID" }
  - { a: "sudo blkid", b: "El UUID y el tipo de cada dispositivo que tiene una firma" }
  - { a: "sudo fdisk -l /dev/sdb", b: "La tabla de particiones de un disco, sector por sector" }
  - { a: "df -h", b: "Cuánto espacio libre queda en cada sistema de archivos montado" }
  - { a: "ls -l /dev/disk/by-uuid", b: "Los enlaces que relacionan cada UUID con su dispositivo" }
explicacion: >-
  lsblk es el primer comando a usar: no necesita sudo y da el panorama completo. df mira el
  espacio desde el lado de las carpetas; lsblk, desde el lado de los discos.
