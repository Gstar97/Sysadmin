<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <!-- etiquetas de capas -->
  <text x="20" y="44" font-weight="700" fill="currentColor">Disco</text>
  <text x="20" y="114" font-weight="700" fill="currentColor">Particiones</text>
  <text x="20" y="184" font-weight="700" fill="currentColor">LVM</text>
  <text x="20" y="200" font-size="11" fill="currentColor">(opcional)</text>
  <text x="20" y="264" font-weight="700" fill="currentColor">Sistema de</text>
  <text x="20" y="280" font-weight="700" fill="currentColor">archivos</text>
  <text x="20" y="344" font-weight="700" fill="currentColor">Carpeta</text>

  <!-- disco -->
  <rect x="130" y="22" width="710" height="40" rx="8" fill="var(--surface-2, #eef2f5)" stroke="currentColor"/>
  <text x="485" y="47" text-anchor="middle" font-family="ui-monospace, monospace" fill="currentColor">/dev/sda  (20 GiB)</text>

  <!-- particiones -->
  <rect x="130" y="92" width="160" height="40" rx="8" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="210" y="117" text-anchor="middle" font-family="ui-monospace, monospace" fill="currentColor">/dev/sda1  1 GiB</text>
  <rect x="300" y="92" width="540" height="40" rx="8" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="570" y="117" text-anchor="middle" font-family="ui-monospace, monospace" fill="currentColor">/dev/sda2  19 GiB  (para LVM)</text>

  <!-- LVM -->
  <rect x="300" y="162" width="390" height="40" rx="8" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="495" y="187" text-anchor="middle" font-family="ui-monospace, monospace" fill="currentColor">rl-root  17 GiB</text>
  <rect x="700" y="162" width="140" height="40" rx="8" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="770" y="187" text-anchor="middle" font-family="ui-monospace, monospace" fill="currentColor">rl-swap  2 GiB</text>

  <!-- fs -->
  <rect x="130" y="242" width="160" height="40" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="210" y="267" text-anchor="middle" fill="currentColor">xfs</text>
  <rect x="300" y="242" width="390" height="40" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="495" y="267" text-anchor="middle" fill="currentColor">xfs</text>
  <rect x="700" y="242" width="140" height="40" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="770" y="267" text-anchor="middle" fill="currentColor">swap</text>

  <!-- carpetas -->
  <text x="210" y="347" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="700" fill="currentColor">/boot</text>
  <text x="495" y="347" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="700" fill="currentColor">/</text>
  <text x="770" y="347" text-anchor="middle" font-size="12" fill="currentColor">(memoria extra,</text>
  <text x="770" y="363" text-anchor="middle" font-size="12" fill="currentColor">no se monta)</text>

  <g stroke="currentColor" stroke-width="1.4" marker-end="url(#a)">
    <line x1="210" y1="64" x2="210" y2="90"/>
    <line x1="570" y1="64" x2="570" y2="90"/>
    <line x1="495" y1="134" x2="495" y2="160"/>
    <line x1="770" y1="134" x2="770" y2="160"/>
    <line x1="210" y1="134" x2="210" y2="240"/>
    <line x1="495" y1="204" x2="495" y2="240"/>
    <line x1="770" y1="204" x2="770" y2="240"/>
    <line x1="210" y1="284" x2="210" y2="330"/>
    <line x1="495" y1="284" x2="495" y2="330"/>
  </g>
  <text x="430" y="392" text-anchor="middle" font-size="12" fill="currentColor">Así está armado el disco de rocky01: lsblk muestra exactamente este árbol.</text>
</svg>
