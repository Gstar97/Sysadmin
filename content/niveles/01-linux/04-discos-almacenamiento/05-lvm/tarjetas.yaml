- { id: t1, frente: "PV, VG y LV", dorso: "PV: disco o partición preparada. VG: la suma (depósito de espacio). LV: volumen que se usa como partición." }
- { id: t2, frente: "Crear", dorso: "pvcreate /dev/sdb · vgcreate datos /dev/sdb · lvcreate -n srv -L 4G datos → /dev/datos/srv" }
- { id: t3, frente: "Ver", dorso: "pvs · vgs (VFree = libre) · lvs · y pvdisplay/vgdisplay/lvdisplay para el detalle." }
- { id: t4, frente: "Agrandar", dorso: "lvextend -r -L +5G VG/LV · lvextend -r -l +100%FREE VG/LV (-r agranda el sistema de archivos)." }
- { id: t5, frente: "Sin espacio en el grupo", dorso: "vgextend VG /dev/disco_nuevo y después lvextend." }
- { id: t6, frente: "Olvidé -r", dorso: "xfs_growfs /punto/de/montaje (XFS) · resize2fs /dev/VG/LV (ext4)." }
- { id: t7, frente: "Achicar", dorso: "XFS: no se puede. ext4: desmontado, lvreduce -r -L TAMAÑO, con copia de seguridad antes." }
