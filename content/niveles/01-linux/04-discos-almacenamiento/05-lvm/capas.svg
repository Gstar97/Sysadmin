<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12.5">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <!-- PV -->
  <text x="20" y="40" font-weight="700" fill="currentColor">PV</text>
  <text x="20" y="56" font-size="11" fill="currentColor">volúmenes físicos</text>
  <rect x="150" y="22" width="300" height="44" rx="8" fill="var(--surface-2, #eef2f5)" stroke="currentColor"/>
  <text x="300" y="49" text-anchor="middle" font-family="ui-monospace, monospace" fill="currentColor">/dev/sdb  10 GiB</text>
  <rect x="470" y="22" width="300" height="44" rx="8" fill="var(--surface-2, #eef2f5)" stroke="currentColor"/>
  <text x="620" y="49" text-anchor="middle" font-family="ui-monospace, monospace" fill="currentColor">/dev/sdc  10 GiB  (agregado después)</text>

  <line x1="300" y1="68" x2="380" y2="118" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="620" y1="68" x2="540" y2="118" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- VG -->
  <text x="20" y="144" font-weight="700" fill="currentColor">VG</text>
  <text x="20" y="160" font-size="11" fill="currentColor">grupo de volúmenes</text>
  <rect x="150" y="120" width="620" height="54" rx="10" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="460" y="144" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace" fill="currentColor">datos  (≈ 20 GiB juntos)</text>
  <text x="460" y="163" text-anchor="middle" font-size="11.5" fill="currentColor">un solo depósito de espacio, en pedacitos de 4 MiB (extents)</text>

  <line x1="300" y1="176" x2="260" y2="226" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="500" y1="176" x2="520" y2="226" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- LV -->
  <text x="20" y="252" font-weight="700" fill="currentColor">LV</text>
  <text x="20" y="268" font-size="11" fill="currentColor">volúmenes lógicos</text>
  <rect x="150" y="228" width="240" height="44" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="270" y="255" text-anchor="middle" font-family="ui-monospace, monospace" fill="currentColor">srv  12 GiB</text>
  <rect x="400" y="228" width="200" height="44" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="500" y="255" text-anchor="middle" font-family="ui-monospace, monospace" fill="currentColor">logs  4 GiB</text>
  <rect x="610" y="228" width="160" height="44" rx="8" fill="none" stroke="currentColor" stroke-dasharray="5 3"/>
  <text x="690" y="255" text-anchor="middle" fill="currentColor">libre: 4 GiB</text>

  <line x1="270" y1="274" x2="270" y2="306" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="500" y1="274" x2="500" y2="306" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="270" y="326" text-anchor="middle" fill="currentColor">xfs en /srv/datos</text>
  <text x="500" y="326" text-anchor="middle" fill="currentColor">ext4 en /var/log/app</text>
  <text x="460" y="366" text-anchor="middle" fill="currentColor">Un LV se usa como una partición, pero se puede agrandar tomando del espacio libre, sin apagar nada.</text>
</svg>
