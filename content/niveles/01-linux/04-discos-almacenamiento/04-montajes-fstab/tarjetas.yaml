- { id: t1, frente: "mount / umount", dorso: "sudo mount /dev/sdb1 /srv/datos · sudo umount /srv/datos. Desmontar no borra: los archivos siguen en el disco." }
- { id: t2, frente: "Las 6 columnas de fstab", dorso: "Qué (UUID=) · dónde · tipo · opciones · dump (0) · fsck (0, 1 raíz, 2 resto)." }
- { id: t3, frente: "nofail", dorso: "Si el disco no está, el arranque sigue en lugar de caer en modo de emergencia." }
- { id: t4, frente: "Probar fstab", dorso: "sudo findmnt --verify · sudo systemctl daemon-reload · sudo mount -a" }
- { id: t5, frente: "target is busy", dorso: "Algo usa la carpeta: sal con cd y mira sudo lsof /carpeta." }
- { id: t6, frente: "Agregar a fstab sin editor", dorso: "echo \"UUID=... /srv/datos xfs defaults 0 0\" | sudo tee -a /etc/fstab (con -a: si no, se borra todo)." }
