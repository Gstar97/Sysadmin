tipo: emparejar
consigna: Une cada característica con el sistema de archivos (o la herramienta) que corresponde.
pares:
  - { a: "XFS", b: "Es el predeterminado de Rocky; se puede agrandar pero nunca achicar" }
  - { a: "ext4", b: "Es el predeterminado de Ubuntu; se puede achicar, pero solo desmontado" }
  - { a: "vfat (FAT32)", b: "Lo usa la partición EFI y lo entienden casi todos los sistemas operativos" }
  - { a: "mkfs.xfs -f", b: "Fuerza a crear un XFS aunque ya haya otro sistema de archivos" }
  - { a: "mkfs.ext4 -L logs", b: "Crea un ext4 con la etiqueta logs" }
  - { a: "wipefs -a", b: "Borra las firmas de sistemas de archivos de un dispositivo" }
explicacion: >-
  Para la mayoría de los usos, cualquiera de los dos principales sirve. Lo práctico es usar el
  de la distribución, salvo que necesites achicar volúmenes más adelante (ext4) o manejar
  archivos muy grandes con mucho paralelismo (XFS).
