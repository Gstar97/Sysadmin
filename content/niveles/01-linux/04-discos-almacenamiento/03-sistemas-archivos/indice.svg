<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="20" y="28" font-weight="700" font-size="14" fill="currentColor">Lo que guarda un sistema de archivos</text>
  <!-- directorio -->
  <rect x="20" y="48" width="230" height="150" rx="8" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="135" y="70" text-anchor="middle" font-weight="700" fill="currentColor">Carpeta /srv/datos</text>
  <text x="36" y="98" font-family="ui-monospace, monospace" fill="currentColor">informe.pdf  → inodo 131</text>
  <text x="36" y="122" font-family="ui-monospace, monospace" fill="currentColor">notas.txt    → inodo 132</text>
  <text x="36" y="146" font-family="ui-monospace, monospace" fill="currentColor">fotos/       → inodo 140</text>
  <text x="36" y="182" font-size="11.5" fill="currentColor">nombres y número de inodo</text>
  <!-- inodo -->
  <rect x="300" y="48" width="250" height="150" rx="8" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="425" y="70" text-anchor="middle" font-weight="700" fill="currentColor">Inodo 131</text>
  <text x="316" y="96" fill="currentColor">dueño, grupo y permisos</text>
  <text x="316" y="118" fill="currentColor">tamaño y fechas</text>
  <text x="316" y="140" fill="currentColor">dónde están sus bloques:</text>
  <text x="316" y="162" font-family="ui-monospace, monospace" fill="currentColor">  2048-2055, 9100-9103</text>
  <text x="316" y="186" font-size="11.5" fill="currentColor">todo menos el nombre y el contenido</text>
  <!-- bloques -->
  <g fill="var(--surface-2, #eef2f5)" stroke="currentColor">
    <rect x="600" y="58" width="36" height="28"/><rect x="640" y="58" width="36" height="28"/><rect x="680" y="58" width="36" height="28"/><rect x="720" y="58" width="36" height="28"/><rect x="760" y="58" width="36" height="28"/>
    <rect x="600" y="92" width="36" height="28"/><rect x="640" y="92" width="36" height="28"/><rect x="680" y="92" width="36" height="28"/><rect x="720" y="92" width="36" height="28"/><rect x="760" y="92" width="36" height="28"/>
    <rect x="600" y="126" width="36" height="28"/><rect x="640" y="126" width="36" height="28"/><rect x="680" y="126" width="36" height="28"/><rect x="720" y="126" width="36" height="28"/><rect x="760" y="126" width="36" height="28"/>
  </g>
  <g fill="var(--ok-soft, #dcf5e4)" stroke="currentColor">
    <rect x="600" y="58" width="36" height="28"/><rect x="640" y="58" width="36" height="28"/><rect x="720" y="126" width="36" height="28"/>
  </g>
  <text x="700" y="182" text-anchor="middle" font-size="11.5" fill="currentColor">bloques con el contenido</text>
  <line x1="252" y1="94" x2="298" y2="94" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="552" y1="150" x2="598" y2="75" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="552" y1="160" x2="718" y2="140" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="430" y="236" text-anchor="middle" fill="currentColor">Además lleva la cuenta de qué bloques están libres, y un registro (journal) de los cambios</text>
  <text x="430" y="256" text-anchor="middle" fill="currentColor">a medio hacer, para recuperarse rápido si se corta la luz.</text>
  <text x="430" y="286" text-anchor="middle" font-size="12" fill="currentColor">Crear el sistema de archivos (mkfs) es escribir estas estructuras vacías en la partición.</text>
</svg>
