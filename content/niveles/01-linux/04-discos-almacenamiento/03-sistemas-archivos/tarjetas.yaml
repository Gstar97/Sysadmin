- { id: t1, frente: "Sistema de archivos", dorso: "Carpetas, inodos y bloques. mkfs lo crea vacío (y borra el acceso a lo anterior)." }
- { id: t2, frente: "Journal", dorso: "Registro de cambios pendientes: permite recuperarse en segundos de un corte de luz." }
- { id: t3, frente: "XFS vs ext4", dorso: "XFS (Rocky): se agranda montado, NO se achica. ext4 (Ubuntu): se agranda montado, se achica desmontado." }
- { id: t4, frente: "Crear", dorso: "sudo mkfs.xfs /dev/sdb1 · sudo mkfs.ext4 -L etiqueta /dev/sdb2 · -f para pisar (XFS)." }
- { id: t5, frente: "Reparar", dorso: "Siempre desmontado: sudo xfs_repair /dev/X · sudo e2fsck -f /dev/X." }
- { id: t6, frente: "wipefs", dorso: "wipefs /dev/X muestra las firmas · wipefs -a /dev/X las borra." }
