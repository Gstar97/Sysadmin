- { id: t1, frente: "Partición", dorso: "Rango del disco reservado para un uso. La tabla de particiones (al principio del disco) las describe." }
- { id: t2, frente: "MBR vs GPT", dorso: "MBR: 4 primarias, 2 TiB, una sola copia. GPT: 128 particiones, sin límite práctico, copia al final, UEFI. Disco nuevo: GPT." }
- { id: t3, frente: "parted en una línea", dorso: "sudo parted -s /dev/sdb mklabel gpt mkpart datos 1MiB 100% · set N lvm on · print · rm N" }
- { id: t4, frente: "fdisk", dorso: "Interactivo: g (GPT), n (nueva), t (tipo), d (borrar), p (ver), w (guardar), q (salir sin guardar)." }
- { id: t5, frente: "Alineación", dorso: "Empezar en 1 MiB (sector 2048). Usar MiB/GiB, no MB/GB." }
- { id: t6, frente: "El kernel no ve la tabla nueva", dorso: "El disco estaba en uso: sudo partprobe /dev/sdX, o reiniciar." }
