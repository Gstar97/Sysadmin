tipo: ordenar
consigna: Ordena los pasos para particionar un disco nuevo de forma segura.
pasos:
  - Identificar el disco nuevo con lsblk (tamaño esperado, sin particiones ni montajes)
  - Crear la tabla de particiones (GPT)
  - Crear las particiones, empezando en 1 MiB
  - Marcar el tipo de cada partición (por ejemplo, lvm)
  - Revisar el resultado con parted print o lsblk
explicacion: >-
  El primer paso es el que evita desastres: particionar el disco equivocado borra todo lo que
  tenía. Después de crear las particiones vienen el sistema de archivos (o LVM) y el montaje.
