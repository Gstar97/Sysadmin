<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="20" y="30" font-weight="700" font-size="14" fill="currentColor">MBR (también llamada msdos o dos)</text>
  <rect x="20" y="44" width="70" height="50" rx="4" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="55" y="66" text-anchor="middle" font-size="11.5" fill="currentColor">tabla</text>
  <text x="55" y="82" text-anchor="middle" font-size="11.5" fill="currentColor">(1 sector)</text>
  <rect x="95" y="44" width="180" height="50" rx="4" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="185" y="74" text-anchor="middle" fill="currentColor">primaria 1</text>
  <rect x="280" y="44" width="180" height="50" rx="4" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="370" y="74" text-anchor="middle" fill="currentColor">primaria 2</text>
  <rect x="465" y="44" width="180" height="50" rx="4" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="555" y="74" text-anchor="middle" fill="currentColor">primaria 3</text>
  <rect x="650" y="44" width="190" height="50" rx="4" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="745" y="74" text-anchor="middle" fill="currentColor">primaria 4</text>
  <text x="20" y="118" fill="currentColor">• Hasta 4 particiones primarias (o 3 y una "extendida" con más adentro).</text>
  <text x="20" y="138" fill="currentColor">• Discos de hasta 2 TiB. Una sola copia de la tabla: si se daña, se pierde.</text>

  <text x="20" y="186" font-weight="700" font-size="14" fill="currentColor">GPT</text>
  <rect x="20" y="200" width="70" height="50" rx="4" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="55" y="222" text-anchor="middle" font-size="11.5" fill="currentColor">tabla</text>
  <text x="55" y="238" text-anchor="middle" font-size="11.5" fill="currentColor">principal</text>
  <rect x="95" y="200" width="120" height="50" rx="4" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="155" y="230" text-anchor="middle" fill="currentColor">partición 1</text>
  <rect x="220" y="200" width="120" height="50" rx="4" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="280" y="230" text-anchor="middle" fill="currentColor">partición 2</text>
  <rect x="345" y="200" width="120" height="50" rx="4" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="405" y="230" text-anchor="middle" fill="currentColor">partición 3</text>
  <rect x="470" y="200" width="295" height="50" rx="4" fill="var(--surface-2, #eef2f5)" stroke="currentColor" stroke-dasharray="5 3"/>
  <text x="617" y="230" text-anchor="middle" fill="currentColor">... hasta 128</text>
  <rect x="770" y="200" width="70" height="50" rx="4" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="805" y="222" text-anchor="middle" font-size="11.5" fill="currentColor">copia de</text>
  <text x="805" y="238" text-anchor="middle" font-size="11.5" fill="currentColor">la tabla</text>
  <text x="20" y="274" fill="currentColor">• Hasta 128 particiones, todas iguales. Discos de cualquier tamaño actual.</text>
  <text x="20" y="294" fill="currentColor">• Copia de la tabla al final del disco: si una se daña, se recupera con la otra.</text>
  <text x="20" y="314" fill="currentColor">• Es la que usan los equipos con UEFI. Para un disco nuevo, es la opción por defecto.</text>
</svg>
