- { id: t1, frente: "Swap", dorso: "Memoria de emergencia en disco. Un poco evita el OOM killer; si se usa siempre, falta RAM." }
- { id: t2, frente: "Archivo de swap", dorso: "fallocate -l 2G /swapfile · chmod 600 · mkswap · swapon · fstab: /swapfile none swap defaults 0 0" }
- { id: t3, frente: "Ver la swap", dorso: "swapon --show · free -h" }
- { id: t4, frente: "Disco lleno: método", dorso: "df -h → du -xh --max-depth=1 | sort -h → find -xdev -size +500M → preguntar antes de borrar." }
- { id: t5, frente: "Log en uso", dorso: "Se vacía (: > archivo o truncate -s 0), no se borra." }
- { id: t6, frente: "df y du no coinciden", dorso: "lsof +L1 (borrados abiertos) · archivos tapados por un montaje · df -i (inodos)." }
