- id: p01
  tipo: opcion_multiple
  diagnostico: true
  enunciado: Un servidor usa varios GiB de swap todo el tiempo y está lento. ¿Qué indica?
  opciones:
    - { texto: "Que le falta RAM: la swap es un colchón para picos, no un reemplazo", correcta: true, explicacion: "Leer y escribir en disco es mucho más lento que en RAM." }
    - { texto: "Que hay que agregar más swap", explicacion: "Sería más lento todavía." }
    - { texto: "Que el disco está fallando", explicacion: "Es un síntoma de memoria, no de disco." }
    - { texto: "Que todo está bien", explicacion: "El uso constante de swap es una señal de alerta." }
- id: p02
  tipo: ordenar_pasos
  enunciado: Ordena los pasos para agregar un archivo de swap de forma permanente.
  pasos: [sudo fallocate -l 2G /swapfile, sudo chmod 600 /swapfile, sudo mkswap /swapfile, sudo swapon /swapfile, Agregar /swapfile none swap defaults 0 0 a /etc/fstab]
  explicacion: Reservar, proteger, dar formato, activar y dejarlo en fstab.
- id: p03
  tipo: opcion_multiple
  diagnostico: true
  enunciado: ¿Por qué un archivo de swap tiene que tener permisos 600?
  opciones:
    - { texto: "Porque en la swap quedan pedazos de la memoria de los programas, que pueden incluir contraseñas", correcta: true, explicacion: "Solo root debe poder leerla." }
    - { texto: "Porque si no, no entra en el disco", explicacion: "Los permisos no cambian el tamaño." }
    - { texto: "Porque mkswap no funciona con otros permisos", explicacion: "Funciona, pero avisa que es inseguro." }
    - { texto: "Por costumbre", explicacion: "Hay una razón de seguridad concreta." }
- id: p04
  tipo: completar_comando
  enunciado: Escribe el comando que muestra, ordenadas de menor a mayor, cuánto ocupan las carpetas de primer nivel de /var, sin entrar en otros discos.
  aceptadas: ["sudo du -xh --max-depth=1 /var | sort -h", "du -xh --max-depth=1 /var | sort -h", "sudo du -hx --max-depth=1 /var | sort -h", "sudo du -xh -d 1 /var | sort -h", "sudo du -xh -d1 /var | sort -h"]
  explicacion: sort -h entiende las unidades (K, M, G) al ordenar.
- id: p05
  tipo: opcion_multiple
  enunciado: Una aplicación escribe en /var/log/app/app.log, que ocupa 8 GB. ¿Cómo liberas ese espacio sin detenerla?
  opciones:
    - { texto: "Vaciarlo con : > /var/log/app/app.log (o truncate -s 0) y configurar logrotate", correcta: true, explicacion: "El archivo sigue existiendo y la aplicación sigue escribiendo, desde cero." }
    - { texto: "rm /var/log/app/app.log", explicacion: "La aplicación lo tiene abierto: el espacio no se libera hasta que lo cierre." }
    - { texto: "Moverlo a /tmp", explicacion: "Si /tmp está en el mismo disco, no libera nada." }
    - { texto: "Comprimirlo con gzip", explicacion: "gzip crea otro archivo y borra el original, con el mismo problema." }
- id: p06
  tipo: interpretar_salida
  enunciado: df dice que /var/log está al 97 %, pero du suma solo 300 MB. Ejecutas esto. ¿Qué pasa?
  salida: |
    $ sudo lsof +L1
    COMMAND   PID USER   FD   TYPE DEVICE   SIZE/OFF NLINK  NODE NAME
    java     1873 app     4w   REG  253,2 7516192768     0 33554 /var/log/app/app.log (deleted)
  opciones:
    - { texto: "Alguien borró app.log mientras java lo tenía abierto; los 7 GB se liberan cuando el proceso lo cierre (reiniciando el servicio)", correcta: true, explicacion: "Es la causa más común de la diferencia entre df y du." }
    - { texto: "El disco está dañado", explicacion: "Es el funcionamiento normal de Linux." }
    - { texto: "Hay que borrar app.log otra vez", explicacion: "Ya no tiene nombre: no se puede borrar de nuevo." }
    - { texto: "du está mal", explicacion: "du suma lo que tiene nombre; el archivo borrado no lo tiene." }
- id: p07
  tipo: opcion_multiple
  enunciado: Una aplicación falla con "No space left on device", pero df -h muestra 40 % libre. ¿Qué revisas?
  opciones:
    - { texto: "df -i: pueden haberse agotado los inodos por tener millones de archivos chicos", correcta: true, explicacion: "En ext4 la cantidad de inodos es fija." }
    - { texto: "La swap", explicacion: "No tiene relación con el espacio del disco." }
    - { texto: "Que el disco sea SSD", explicacion: "No cambia nada." }
    - { texto: "Los permisos de la carpeta", explicacion: "Eso daría Permission denied." }
- id: p08
  tipo: completar_comando
  enunciado: Escribe el comando que busca, en la raíz y sin entrar en otros discos, los archivos de más de 1 GiB.
  aceptadas: ["sudo find / -xdev -type f -size +1G", "find / -xdev -type f -size +1G", "sudo find / -xdev -size +1G -type f", "sudo find / -type f -size +1G -xdev"]
  explicacion: Agregando -exec ls -lh {} + ves el tamaño y el dueño de cada uno.
- id: p09
  tipo: opcion_multiple
  enunciado: ¿Cuál de estos lugares conviene limpiar primero cuando falta espacio, porque se regenera solo?
  opciones:
    - { texto: "El caché de paquetes (dnf clean all o apt clean)", correcta: true, explicacion: "Se vuelve a descargar cuando hace falta." }
    - { texto: "/etc", explicacion: "Es la configuración del sistema." }
    - { texto: "/home de los usuarios", explicacion: "Son datos de otras personas." }
    - { texto: "/usr/bin", explicacion: "Son los programas del sistema." }
