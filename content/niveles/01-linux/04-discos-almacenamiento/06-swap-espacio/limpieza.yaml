tipo: emparejar
consigna: Une cada situación con lo que conviene hacer.
pares:
  - { a: "Hay logs viejos ya rotados (.gz) que nadie va a mirar", b: "Revisar la configuración de logrotate (rotate N) para guardar menos copias" }
  - { a: "El caché de paquetes ocupa varios GB", b: "sudo dnf clean all o sudo apt clean" }
  - { a: "El journal ocupa demasiado", b: "sudo journalctl --vacuum-size=500M" }
  - { a: "Un log enorme que la aplicación sigue escribiendo", b: "Vaciarlo con : > archivo en lugar de borrarlo" }
  - { a: "Un archivo grande que no sabes de quién es", b: "Preguntar antes de borrar: ls -l (dueño) y rpm -qf o dpkg -S" }
  - { a: "df muestra el disco lleno y du no encuentra nada", b: "sudo lsof +L1 para buscar archivos borrados que siguen abiertos" }
explicacion: >-
  Liberar espacio es fácil; lo difícil es no borrar algo que se necesitaba. Ante la duda, mover
  a otro disco es mejor que borrar.
