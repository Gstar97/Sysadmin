tipo: terminal
shell: bash
titulo: El disco del sistema está casi lleno
descripcion: >-
  El monitoreo avisa que la raíz de app01 está al 98 %. Encontrá qué ocupa el espacio, liberá
  lo que el equipo confirmó que se puede borrar y, ya que estás, agregá 1 GiB de swap en un
  archivo, porque el servidor anda justo de memoria.
estado_inicial:
  distro: rocky
  hostname: app01
  usuario: ana
  usuarios:
    - { nombre: ana, sudo: true }
  uso_raiz: 12G
  archivos:
    /var/tmp/backup-2025.tar: { contenido: "x", tamano: 2.5G }
    /var/log/app/app-2025-09.log: { contenido: "x", tamano: 900M }
    /home/ana/rocky.iso: { contenido: "x", tamano: 1.1G, dueno: ana }
pasos:
  - consigna: Confirmá cuánto espacio queda en la raíz.
    verificar:
      - { comando_usado: 'df\s+-h' }
    pistas:
      - "`df -h /`"
    solucion: [df -h /]
    explicacion: 98 % usado, unos 500 MiB libres. Con tan poco, cualquier log grande puede llenarlo y frenar los servicios.
  - consigna: Mirá qué carpetas de primer nivel ocupan más, sin entrar en otros discos, ordenadas de menor a mayor.
    verificar:
      - { comando_usado: 'du\s+.*(-x|--one-file-system).*(--max-depth=1|-d\s*1).*/|du\s+.*(--max-depth=1|-d\s*1).*(-x|--one-file-system).*/' }
      - { salida_contiene: /var }
    pistas:
      - "du con -x (no cruzar a otros discos), -h y --max-depth=1, y sort -h para ordenar tamaños."
      - "`sudo du -xh --max-depth=1 / | sort -h`"
    solucion: [sudo du -xh --max-depth=1 / | sort -h]
    explicacion: /var es la que más ocupa. Desde ahí se puede seguir bajando (du en /var) hasta encontrar al responsable.
  - consigna: Buscá directamente los archivos de más de 500 MiB, con su tamaño y su dueño.
    verificar:
      - { comando_usado: 'find\s+/\s+.*-size\s+\+\d+[MG]' }
      - { salida_contiene: backup-2025.tar }
    pistas:
      - "find con -xdev, -type f y -size +500M; -exec ls -lh {} + muestra el detalle."
      - "`sudo find / -xdev -type f -size +500M -exec ls -lh {} +`"
    solucion: ["sudo find / -xdev -type f -size +500M -exec ls -lh {} +"]
    explicacion: Hay tres candidatos. El equipo confirma que el .tar de /var/tmp es una copia vieja que ya está en el servidor de respaldos; los otros dos se quedan por ahora.
  - consigna: Borrá /var/tmp/backup-2025.tar y comprobá cuánto espacio quedó libre.
    verificar:
      - { archivo: /var/tmp/backup-2025.tar, existe: false }
      - { comando_usado: 'df\s+-h' }
    pistas:
      - "`sudo rm /var/tmp/backup-2025.tar` y `df -h /`"
    solucion: [sudo rm /var/tmp/backup-2025.tar, df -h /]
    explicacion: Bajó a un 84 %. Si df no hubiera cambiado, sospecharías de un proceso que tiene el archivo abierto (lsof +L1).
  - consigna: Creá un archivo de swap de 1 GiB en /swapfile, con permisos 600, y activalo.
    verificar:
      - { swap: /swapfile }
      - { archivo: /swapfile, modo: "0600" }
    pistas:
      - "fallocate -l 1G, chmod 600, mkswap y swapon, todos con sudo."
      - "`sudo fallocate -l 1G /swapfile`, `sudo chmod 600 /swapfile`, `sudo mkswap /swapfile` y `sudo swapon /swapfile`"
    solucion: [sudo fallocate -l 1G /swapfile, sudo chmod 600 /swapfile, sudo mkswap /swapfile, sudo swapon /swapfile]
    explicacion: Los permisos 600 importan, porque en la swap terminan pedazos de la memoria de los programas, incluidas contraseñas.
  - consigna: Dejá la swap nueva en fstab para que se active en cada arranque, y comprobá con swapon --show y free -h.
    verificar:
      - { archivo: /etc/fstab, contenido_incluye: "/swapfile" }
      - { comando_usado: 'swapon\s+--show|free\s+-h' }
    pistas:
      - "La línea es: /swapfile none swap defaults 0 0"
      - "`echo '/swapfile none swap defaults 0 0' | sudo tee -a /etc/fstab` y `swapon --show`"
    solucion: ["echo '/swapfile none swap defaults 0 0' | sudo tee -a /etc/fstab", swapon --show, free -h]
    explicacion: Ahora hay dos swaps (el volumen rl-swap y el archivo). free -h muestra 3 GiB en total.
