<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12.5">
  <rect x="20" y="20" width="390" height="150" rx="10" fill="var(--info-soft, #e0e9fd)" stroke="currentColor"/>
  <text x="215" y="46" text-anchor="middle" font-weight="700" font-size="14" fill="currentColor">df: lo que dice el sistema de archivos</text>
  <text x="40" y="76" fill="currentColor">Pregunta al sistema de archivos cuántos</text>
  <text x="40" y="96" fill="currentColor">bloques tiene ocupados. Es rápido y</text>
  <text x="40" y="116" fill="currentColor">cuenta todo, se vea o no.</text>
  <text x="40" y="150" font-family="ui-monospace, monospace" fill="currentColor">df -h · df -i</text>

  <rect x="450" y="20" width="390" height="150" rx="10" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="645" y="46" text-anchor="middle" font-weight="700" font-size="14" fill="currentColor">du: lo que suman los archivos que ve</text>
  <text x="470" y="76" fill="currentColor">Recorre las carpetas y suma el tamaño</text>
  <text x="470" y="96" fill="currentColor">de cada archivo. Es más lento y solo</text>
  <text x="470" y="116" fill="currentColor">cuenta lo que tiene nombre en el árbol.</text>
  <text x="470" y="150" font-family="ui-monospace, monospace" fill="currentColor">du -xh --max-depth=1 /</text>

  <text x="430" y="206" text-anchor="middle" font-weight="700" font-size="14" fill="currentColor">Cuando df dice mucho más que du, el espacio está en algo que du no ve:</text>
  <rect x="20" y="222" width="260" height="110" rx="8" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="150" y="246" text-anchor="middle" font-weight="700" fill="currentColor">Archivos borrados abiertos</text>
  <text x="34" y="270" fill="currentColor">Un programa sigue escribiendo</text>
  <text x="34" y="288" fill="currentColor">en un archivo que se borró.</text>
  <text x="34" y="316" font-family="ui-monospace, monospace" fill="currentColor">sudo lsof +L1</text>
  <rect x="300" y="222" width="260" height="110" rx="8" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="430" y="246" text-anchor="middle" font-weight="700" fill="currentColor">Archivos tapados</text>
  <text x="314" y="270" fill="currentColor">Se guardaron en una carpeta antes</text>
  <text x="314" y="288" fill="currentColor">de montar un disco encima.</text>
  <text x="314" y="316" font-family="ui-monospace, monospace" fill="currentColor">desmontar y mirar</text>
  <rect x="580" y="222" width="260" height="110" rx="8" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor"/>
  <text x="710" y="246" text-anchor="middle" font-weight="700" fill="currentColor">Inodos agotados</text>
  <text x="594" y="270" fill="currentColor">Millones de archivos chicos: hay</text>
  <text x="594" y="288" fill="currentColor">bytes libres pero no inodos (ext4).</text>
  <text x="594" y="316" font-family="ui-monospace, monospace" fill="currentColor">df -i</text>
</svg>
