id: n7
titulo: Contenedores y cloud
descripcion: 'Contenedores con Docker y Podman, fundamentos de Kubernetes, nube pública (AWS y Azure,
  con equivalencias entre ambos) e infraestructura como código con Terraform u OpenTofu. Todo con foco
  en la operación: redes, identidades, costos y seguridad.'
perfil_salida: Empaquetar y operar aplicaciones en contenedores, desplegar en Kubernetes a nivel inicial,
  administrar recursos básicos en AWS y Azure cuidando identidades y costos, y crear infraestructura reproducible
  con Terraform u OpenTofu.
insignia:
  nombre: Contenedores y cloud
  color: '#4338ca'
proyecto_plan:
  titulo: Aplicación en contenedores desplegada en la nube con infraestructura como código
  horas: 24
  entregables:
  - Aplicación de varios contenedores funcionando con Compose en local.
  - Red, cómputo y almacenamiento en AWS o Azure creados con Terraform u OpenTofu.
  - Despliegue automatizado con cloud-init o Ansible y monitoreo básico.
  - Presupuesto con alertas y destrucción completa del entorno al terminar.
