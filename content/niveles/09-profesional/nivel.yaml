id: n9
titulo: Profesional
descripcion: 'Lo que separa a alguien que sabe de alguien a quien le confían la infraestructura: documentación,
  inventario, gestión de cambios, ITIL, tickets y acuerdos de nivel de servicio, comunicación con personas
  usuarias y con la gerencia, guardias, incidentes mayores, y la preparación para certificaciones y entrevistas
  laborales.'
perfil_salida: Documentar y operar la infraestructura con procesos profesionales, comunicar con claridad
  bajo presión y presentarse al mercado laboral con un portfolio demostrable y un plan de certificaciones.
insignia:
  nombre: Profesional
  color: '#334155'
proyecto_plan:
  titulo: Carpeta profesional
  horas: 16
  entregables:
  - Documentación completa (arquitectura, inventario y procedimientos) de la infraestructura construida
    en la carrera.
  - Plan de cambio con vuelta atrás y análisis posterior de un incidente simulado.
  - CV, portfolio publicado y plan de certificaciones.
  - Entrevista técnica simulada completa.
