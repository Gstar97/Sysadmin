id: n8
titulo: Seguridad
descripcion: 'Seguridad desde la mirada de quien administra la infraestructura: fortalecimiento (hardening)
  de Linux, Windows y Active Directory, gestión de vulnerabilidades y parches, identidades y accesos,
  segmentación y monitoreo de seguridad, y respuesta a incidentes. Todo lo que se practica se hace sobre
  el laboratorio propio y con autorización.'
perfil_salida: Auditar y fortalecer servidores y dominios con referencias reconocidas (CIS, líneas base
  de Microsoft), gestionar vulnerabilidades por riesgo, aplicar mínimo privilegio, segmentar la red, detectar
  actividad sospechosa y actuar ante un incidente.
insignia:
  nombre: Seguridad
  color: '#b91c1c'
proyecto_plan:
  titulo: Auditoría y hardening de la infraestructura
  horas: 24
  entregables:
  - Escaneo de la infraestructura construida en la carrera con Greenbone, Lynis y PingCastle.
  - Priorización por riesgo y remediación documentada.
  - Líneas base CIS aplicadas y red de gestión segmentada.
  - Wazuh con alertas útiles.
  - Simulacro de incidente con informe final.
