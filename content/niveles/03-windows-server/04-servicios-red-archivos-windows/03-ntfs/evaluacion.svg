<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="215" y="24" text-anchor="middle" font-weight="700" fill="currentColor">El orden en que Windows decide</text>
  <text x="645" y="24" text-anchor="middle" font-weight="700" fill="currentColor">Los permisos básicos, uno dentro del otro</text>
  <g stroke="currentColor" stroke-width="1.3">
    <rect x="20" y="40" width="390" height="54" rx="9" fill="var(--bad-soft, #fde2e1)"/>
    <rect x="20" y="102" width="390" height="54" rx="9" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="20" y="164" width="390" height="54" rx="9" fill="var(--bad-soft, #fde2e1)" opacity="0.75"/>
    <rect x="20" y="226" width="390" height="54" rx="9" fill="var(--ok-soft, #dcf5e4)" opacity="0.75"/>
  </g>
  <g fill="currentColor">
    <text x="34" y="62" font-weight="700">1. Denegaciones explícitas</text>
    <text x="34" y="82" font-size="12">puestas en el mismo archivo o carpeta</text>
    <text x="34" y="124" font-weight="700">2. Permisos explícitos</text>
    <text x="34" y="144" font-size="12">puestas en el mismo archivo o carpeta</text>
    <text x="34" y="186" font-weight="700">3. Denegaciones heredadas</text>
    <text x="34" y="206" font-size="12">de la carpeta más cercana a la más lejana</text>
    <text x="34" y="248" font-weight="700">4. Permisos heredados</text>
    <text x="34" y="268" font-size="12">de la carpeta más cercana a la más lejana</text>
    <text x="20" y="304" font-size="12">Para cada derecho, la primera entrada que lo menciona decide.</text>
    <text x="20" y="322" font-size="12">Un permiso explícito le gana a una denegación heredada.</text>
    <text x="20" y="340" font-size="12">Si ninguna lo menciona, no se tiene.</text>
  </g>
  <g stroke="currentColor" stroke-width="1.3">
    <rect x="450" y="40" width="390" height="250" rx="12" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="470" y="78" width="350" height="200" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="490" y="116" width="310" height="150" rx="9" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="510" y="154" width="270" height="100" rx="8" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor">
    <text x="464" y="62" font-weight="700">Control total (F)</text>
    <text x="620" y="62" font-size="12">+ cambiar permisos y tomar posesión</text>
    <text x="484" y="100" font-weight="700">Modificar (M)</text>
    <text x="600" y="100" font-size="12">+ crear, escribir y borrar</text>
    <text x="504" y="138" font-weight="700">Lectura y ejecución (RX)</text>
    <text x="680" y="138" font-size="12">+ ejecutar</text>
    <text x="524" y="176" font-weight="700">Lectura (R)</text>
    <text x="524" y="196" font-size="12">ver archivos, carpetas y</text>
    <text x="524" y="214" font-size="12">su contenido</text>
    <text x="450" y="314" font-size="12">Escritura (W) va aparte: crear y escribir, sin leer.</text>
    <text x="450" y="332" font-size="12">Para la gente: Modificar. Control total, solo para</text>
    <text x="450" y="350" font-size="12">administradores y SYSTEM.</text>
  </g>
</svg>
