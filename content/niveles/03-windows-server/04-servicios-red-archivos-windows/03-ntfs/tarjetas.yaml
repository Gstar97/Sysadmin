- { id: t1, frente: "ACL y ACE", dorso: "Cada archivo y carpeta tiene una lista de entradas: quién, qué, permitir o denegar, y a qué se aplica. Más un dueño." }
- { id: t2, frente: "Permisos básicos", dorso: "Lectura ⊂ Lectura y ejecución ⊂ Modificar ⊂ Control total. Escritura aparte. Para la gente, Modificar." }
- { id: t3, frente: "Herencia", dorso: "Lo de arriba baja solo, con (I). Se corta convirtiendo lo heredado en explícito (icacls /inheritance:d)." }
- { id: t4, frente: "Orden de evaluación", dorso: "Denegar explícito, permitir explícito, denegar heredado, permitir heredado (de lo más cercano a lo más lejano). La primera que menciona el derecho decide." }
- { id: t5, frente: "Marcas de icacls", dorso: "(OI) archivos, (CI) subcarpetas, (IO) solo lo de adentro, (I) heredada. F, M, RX, R, W, D." }
- { id: t6, frente: "Raíz de D:", dorso: "Users tiene lectura y puede crear carpetas: cortá la herencia en la carpeta de datos antes de compartir." }
- { id: t7, frente: "Get-Acl / Set-Acl", dorso: "$acl = Get-Acl; $acl.SetAccessRuleProtection($true,$true); $acl.AddAccessRule((New-Object …FileSystemAccessRule(…))); Set-Acl ruta $acl." }
- { id: t8, frente: "takeown", dorso: "takeown /f ruta /a: el grupo Administradores pasa a ser dueño y puede volver a darse permisos. Con autorización." }
