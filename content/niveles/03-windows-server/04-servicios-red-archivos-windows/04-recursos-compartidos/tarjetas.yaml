- { id: t1, frente: "Recurso compartido", dorso: "New-SmbShare -Name … -Path … -FullAccess 'Authenticated Users'. Sin parámetros de acceso: Leer para Everyone." }
- { id: t2, frente: "Recurso + NTFS", dorso: "Por la red valen los dos: gana el más restrictivo. En el servidor, solo NTFS." }
- { id: t3, frente: "Práctica recomendada", dorso: "Recurso: Control total (o Cambiar) para Authenticated Users. Todo el detalle en NTFS." }
- { id: t4, frente: "Enumeración basada en acceso", dorso: "Oculta de la lista lo que la persona no puede abrir. -FolderEnumerationMode AccessBased." }
- { id: t5, frente: "Recursos con $", dorso: "Ocultos de la lista (C$, ADMIN$, IPC$ o los tuyos). No protegen: lo hacen los permisos." }
- { id: t6, frente: "FSRM", dorso: "Cuotas (estrictas o blandas, con plantillas y automáticas) y filtros de archivos (activos o pasivos, por extensión)." }
- { id: t7, frente: "DFS Namespaces", dorso: "\\\\empresa.local\\Empresa\\Datos → \\\\SRV-ARCH01\\Datos. Si cambia el servidor, se cambia el destino." }
- { id: t8, frente: "DFS Replication", dorso: "Mantiene iguales dos destinos copiando cambios. No es respaldo: replica borrados y cifrados." }
