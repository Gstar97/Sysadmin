<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Por la red, cada acceso pasa por dos controles</text>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="10" y="44" width="150" height="110" rx="10" fill="var(--surface-2, #eef1f5)"/>
    <rect x="210" y="44" width="200" height="110" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="460" y="44" width="200" height="110" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="710" y="44" width="140" height="110" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#fr)">
    <line x1="160" y1="99" x2="208" y2="99"/>
    <line x1="410" y1="99" x2="458" y2="99"/>
    <line x1="660" y1="99" x2="708" y2="99"/>
  </g>
  <g fill="currentColor">
    <text x="85" y="72" text-anchor="middle" font-weight="700">María en PC01</text>
    <text x="85" y="94" text-anchor="middle" font-size="12">\\SRV-ARCH01\Datos</text>
    <text x="85" y="110" text-anchor="middle" font-size="12">\Ventas\clientes.xlsx</text>
    <text x="310" y="72" text-anchor="middle" font-weight="700">1. Recurso compartido</text>
    <text x="310" y="94" text-anchor="middle" font-size="12">Control total / Cambiar / Leer</text>
    <text x="310" y="112" text-anchor="middle" font-size="12">para todo el recurso</text>
    <text x="310" y="138" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">Ej.: Authenticated Users, total</text>
    <text x="560" y="72" text-anchor="middle" font-weight="700">2. NTFS</text>
    <text x="560" y="94" text-anchor="middle" font-size="12">carpeta por carpeta,</text>
    <text x="560" y="112" text-anchor="middle" font-size="12">archivo por archivo</text>
    <text x="560" y="138" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">Ej.: DL-Ventas-Modificar en Ventas</text>
    <text x="780" y="72" text-anchor="middle" font-weight="700">Resultado</text>
    <text x="780" y="94" text-anchor="middle" font-size="12">lo que permiten</text>
    <text x="780" y="112" text-anchor="middle" font-size="12">los dos: gana el</text>
    <text x="780" y="130" text-anchor="middle" font-size="12">más restrictivo</text>
  </g>
  <rect x="10" y="168" width="840" height="40" rx="8" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1"/>
  <text x="24" y="193" fill="currentColor" font-size="12">Recurso: Leer + NTFS: Modificar = <tspan font-weight="700">Leer</tspan>.   Recurso: Control total + NTFS: Modificar = <tspan font-weight="700">Modificar</tspan>.   Sentada en el servidor, solo cuenta NTFS.</text>
  <text x="430" y="236" text-anchor="middle" font-weight="700" fill="currentColor">Un nombre que no depende del servidor: espacio de nombres DFS</text>
  <g stroke="currentColor" stroke-width="1.3">
    <rect x="10" y="252" width="250" height="100" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="320" y="252" width="250" height="44" rx="8" fill="var(--surface, #fff)"/>
    <rect x="320" y="308" width="250" height="44" rx="8" fill="var(--surface, #fff)"/>
    <rect x="630" y="252" width="220" height="44" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="630" y="308" width="220" height="44" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" marker-end="url(#fr)">
    <line x1="260" y1="290" x2="318" y2="276"/>
    <line x1="260" y1="314" x2="318" y2="330"/>
    <line x1="570" y1="274" x2="628" y2="274"/>
    <line x1="570" y1="330" x2="628" y2="330"/>
  </g>
  <g fill="currentColor">
    <text x="24" y="276" font-weight="700">\\empresa.local\Empresa</text>
    <text x="24" y="298" font-size="12">La raíz del espacio de nombres:</text>
    <text x="24" y="316" font-size="12">se guarda en AD y la atiende</text>
    <text x="24" y="334" font-size="12">cualquier servidor de la raíz.</text>
    <text x="334" y="279" font-size="12.5">carpeta Datos</text>
    <text x="334" y="335" font-size="12.5">carpeta Proyectos</text>
    <text x="644" y="279" font-size="12">\\SRV-ARCH01\Datos</text>
    <text x="644" y="335" font-size="12">\\SRV-ARCH02\Proyectos</text>
  </g>
</svg>
