tipo: emparejar
consigna: Uní cada salida con lo que significa.
pares:
  - { a: "nslookup → Server: UnKnown (y abajo la dirección correcta)", b: "Falta la zona inversa o el PTR del servidor DNS; la respuesta vale" }
  - { a: "nslookup → Non-authoritative answer", b: "La respuesta vino de la memoria del servidor o de otro servidor" }
  - { a: "Resolve-DnsName → DNS name does not exist", b: "El servidor sabe que ese nombre no existe" }
  - { a: "Resolve-DnsName → This operation returned because the timeout period expired", b: "El servidor no contestó: apagado, inalcanzable o sin el rol DNS" }
  - { a: "Get-DnsClientServerAddress → 8.8.8.8", b: "La PC le pregunta a un DNS público: no va a encontrar el dominio" }
  - { a: "Get-DnsServerResourceRecord → Timestamp 0", b: "Registro estático: la limpieza no lo borra" }
explicacion: >-
  Saber leer estas respuestas ahorra la mitad del diagnóstico: dicen si el problema es el
  servidor, el registro o la configuración de la PC.
