- { id: t1, frente: "Zona integrada en AD", dorso: "Se guarda en la base de AD y se replica con ella; se modifica en cualquier DC; acepta actualizaciones dinámicas seguras." }
- { id: t2, frente: "Orden de respuesta del DNS", dorso: "Sus zonas → reenviadores condicionales → memoria → reenviadores (o raíz)." }
- { id: t3, frente: "Zona inversa", dorso: "Registros PTR en in-addr.arpa, al revés: 192.168.10.10 es '10' en 10.168.192.in-addr.arpa. Add-DnsServerPrimaryZone -NetworkId 192.168.10.0/24." }
- { id: t4, frente: "CNAME", dorso: "Alias de un servicio: Add-DnsServerResourceRecordCName -ZoneName … -Name intranet -HostNameAlias srv-web01.empresa.local." }
- { id: t5, frente: "Reenviador condicional", dorso: "Para un dominio puntual: Add-DnsServerConditionalForwarderZone -Name socio.local -MasterServers 10.20.0.5." }
- { id: t6, frente: "Antigüedad y limpieza", dorso: "Borra registros dinámicos sin refrescar en 7 + 7 días. Los estáticos (Timestamp 0) no. En un solo servidor." }
- { id: t7, frente: "Server: UnKnown", dorso: "nslookup no encontró el nombre del servidor DNS (falta zona inversa o PTR). La respuesta vale igual." }
- { id: t8, frente: "Diagnóstico DNS", dorso: "¿A quién le pregunta la PC? ¿Qué contesta ese servidor (-Server)? ¿El registro existe? Al final, ipconfig /flushdns." }
