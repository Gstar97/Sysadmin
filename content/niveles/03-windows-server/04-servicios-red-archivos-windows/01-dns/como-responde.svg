<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Cómo contesta el DNS de un controlador de dominio</text>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="10" y="130" width="140" height="80" rx="10" fill="var(--surface-2, #eef1f5)"/>
    <rect x="200" y="40" width="300" height="300" rx="12" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="216" y="70" width="268" height="62" rx="8" fill="var(--surface, #fff)"/>
    <rect x="216" y="144" width="268" height="54" rx="8" fill="var(--surface, #fff)"/>
    <rect x="216" y="210" width="268" height="40" rx="8" fill="var(--surface, #fff)"/>
    <rect x="216" y="262" width="268" height="62" rx="8" fill="var(--surface, #fff)"/>
    <rect x="560" y="150" width="290" height="50" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="560" y="268" width="290" height="50" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="560" y="40" width="290" height="96" rx="10" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="currentColor">
    <text x="80" y="160" text-anchor="middle" font-weight="700">PC01</text>
    <text x="80" y="180" text-anchor="middle" font-size="12">DNS: los DC</text>
    <text x="80" y="198" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">pregunta por intranet</text>
    <text x="350" y="60" text-anchor="middle" font-weight="700">DNS de DC01: lo revisa en este orden</text>
    <text x="228" y="90" font-weight="700">1. Sus zonas (responde con autoridad)</text>
    <text x="228" y="108" font-size="12">empresa.local, _msdcs, 10.168.192.in-addr.arpa</text>
    <text x="228" y="124" font-size="12" fill="var(--muted, #5b6675)">Si es de su zona y no está: “no existe”</text>
    <text x="228" y="164" font-weight="700">2. Reenviadores condicionales</text>
    <text x="228" y="184" font-size="12">socio.local → preguntarle a 10.20.0.5</text>
    <text x="228" y="235" font-weight="700">3. Su memoria (caché)</text>
    <text x="228" y="282" font-weight="700">4. Reenviadores (o sugerencias de raíz)</text>
    <text x="228" y="300" font-size="12">Todo lo demás: internet, a través del DNS</text>
    <text x="228" y="316" font-size="12">del proveedor o uno público</text>
    <text x="574" y="172" font-weight="700">DNS de la empresa socia</text>
    <text x="574" y="190" font-size="12">10.20.0.5, por la VPN</text>
    <text x="574" y="290" font-weight="700">Internet</text>
    <text x="574" y="308" font-size="12">www.microsoft.com, el banco…</text>
    <text x="574" y="60" font-weight="700">Zona integrada en AD</text>
    <text x="574" y="80" font-size="12">Se guarda en la base de AD y viaja con</text>
    <text x="574" y="96" font-size="12">su replicación: todos los DC con DNS</text>
    <text x="574" y="112" font-size="12">tienen la misma copia, y se puede</text>
    <text x="574" y="128" font-size="12">escribir en cualquiera.</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#fd)">
    <line x1="150" y1="170" x2="198" y2="170"/>
    <line x1="484" y1="174" x2="558" y2="174"/>
    <line x1="484" y1="292" x2="558" y2="292"/>
  </g>
</svg>
