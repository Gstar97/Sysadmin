<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Escritorio remoto desde afuera: tres caminos</text>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="10" y="120" width="130" height="80" rx="10" fill="var(--surface-2, #eef1f5)"/>
    <rect x="700" y="120" width="150" height="80" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="200" y="40" width="440" height="66" rx="10" fill="var(--bad-soft, #fde2e2)"/>
    <rect x="200" y="128" width="440" height="66" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="200" y="216" width="440" height="66" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="75" y="150" text-anchor="middle" font-weight="700">Desde casa</text>
    <text x="75" y="170" text-anchor="middle" font-size="12">o un proveedor</text>
    <text x="775" y="150" text-anchor="middle" font-weight="700">SRV-APP01</text>
    <text x="775" y="170" text-anchor="middle" font-size="12">RDP 3389, con NLA</text>
    <text x="214" y="62" font-weight="700">No: abrir el 3389 en el router</text>
    <text x="214" y="82" font-size="12">Robots de todo el mundo prueban contraseñas en minutos.</text>
    <text x="214" y="98" font-size="12">Es una de las entradas más comunes de ransomware.</text>
    <text x="214" y="150" font-weight="700">Sí: VPN y después escritorio remoto adentro</text>
    <text x="214" y="170" font-size="12">Primero se entra a la red (con segundo factor),</text>
    <text x="214" y="186" font-size="12">y el 3389 nunca está expuesto a internet.</text>
    <text x="214" y="238" font-weight="700">Sí: Puerta de enlace de Escritorio remoto (RD Gateway)</text>
    <text x="214" y="258" font-size="12">RDP dentro de HTTPS (443), con autenticación y reglas</text>
    <text x="214" y="274" font-size="12">de quién puede llegar a qué servidor.</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4" marker-end="url(#fa)" fill="none">
    <path d="M140,140 L198,80"/>
    <path d="M640,73 L698,140" stroke-dasharray="5 4"/>
    <line x1="140" y1="160" x2="198" y2="160"/>
    <line x1="640" y1="160" x2="698" y2="160"/>
    <path d="M140,180 L198,248"/>
    <path d="M640,248 L698,182"/>
  </g>
  <text x="430" y="310" text-anchor="middle" fill="currentColor" font-size="12">Adentro también: solo los grupos que hacen falta en Remote Desktop Users, cuentas personales y bloqueo por intentos fallidos.</text>
</svg>
