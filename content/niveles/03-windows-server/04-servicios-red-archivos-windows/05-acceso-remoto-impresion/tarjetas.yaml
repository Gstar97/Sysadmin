- { id: t1, frente: "Escritorio remoto", dorso: "RDP, puerto 3389. fDenyTSConnections = 0, regla 'Remote Desktop' del firewall, NLA activada (UserAuthentication = 1)." }
- { id: t2, frente: "Quién entra por RDP", dorso: "Administrators y el grupo local Remote Desktop Users (de cada servidor). No hace falta ser administrador." }
- { id: t3, frente: "Desde afuera", dorso: "VPN con segundo factor o puerta de enlace de escritorio remoto (HTTPS 443). Nunca el 3389 en el router." }
- { id: t4, frente: "Evento 4625", dorso: "Inicio de sesión fallido. Cientos por minuto desde afuera: el RDP está expuesto." }
- { id: t5, frente: "RDS", dorso: "Servicios de Escritorio remoto: muchas sesiones en un servidor. CAL de RDS además de las de Windows Server." }
- { id: t6, frente: "Servidor de impresión", dorso: "Impresoras instaladas una vez, compartidas y distribuidas por GPO. Controladores del fabricante o el universal (IPP)." }
- { id: t7, frente: "PrintNightmare", dorso: "2021: la cola de impresión permitía ejecutar código con máximos privilegios. Spooler apagado donde no se imprime (DC primero) y restricciones de Point and Print." }
