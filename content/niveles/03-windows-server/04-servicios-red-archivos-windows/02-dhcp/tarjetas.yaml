- { id: t1, frente: "DORA", dorso: "Discover (broadcast), Offer, Request, Ack. Renueva a la mitad de la concesión." }
- { id: t2, frente: "APIPA", dorso: "169.254.x.x: nadie contestó al DHCP. Reintenta cada 5 minutos. No llega fuera de su cable." }
- { id: t3, frente: "Autorización", dorso: "En un dominio, un DHCP de Windows no entrega nada sin Add-DhcpServerInDC." }
- { id: t4, frente: "Opciones clave", dorso: "003 puerta de enlace, 006 DNS (los DC), 015 sufijo DNS. Set-DhcpServerv4OptionValue." }
- { id: t5, frente: "Exclusión y reserva", dorso: "Exclusión: saca direcciones del rango. Reserva: una dirección fija para una MAC, con las opciones del ámbito." }
- { id: t6, frente: "Conmutación por error", dorso: "Carga compartida (los dos atienden) o espera activa (uno atiende, el otro con 5% de reserva). La configuración se replica a mano." }
- { id: t7, frente: "Reenvío de DHCP", dorso: "El broadcast no cruza routers: ip helper-address en la VLAN, hacia los dos servidores." }
- { id: t8, frente: "Comandos de consulta", dorso: "Get-DhcpServerv4Scope, Get-DhcpServerv4Lease, Get-DhcpServerv4ScopeStatistics, Get-DhcpServerv4Failover." }
