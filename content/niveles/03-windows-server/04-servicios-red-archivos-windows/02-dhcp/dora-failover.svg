<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Cómo consigue dirección una PC, y qué pasa si se cae un servidor</text>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="10" y="40" width="120" height="200" rx="10" fill="var(--surface-2, #eef1f5)"/>
    <rect x="390" y="40" width="160" height="200" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="690" y="40" width="160" height="200" rx="10" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor">
    <text x="70" y="64" text-anchor="middle" font-weight="700">PC01</text>
    <text x="70" y="82" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">sin dirección</text>
    <text x="470" y="64" text-anchor="middle" font-weight="700">DC01 (DHCP)</text>
    <text x="470" y="82" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">autorizado en AD</text>
    <text x="770" y="64" text-anchor="middle" font-weight="700">DC02 (DHCP)</text>
    <text x="770" y="82" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">compañero</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#fh)" fill="none">
    <line x1="130" y1="104" x2="388" y2="104"/>
    <line x1="388" y1="140" x2="132" y2="140"/>
    <line x1="130" y1="176" x2="388" y2="176"/>
    <line x1="388" y1="212" x2="132" y2="212"/>
    <path d="M552,120 L688,120" stroke-dasharray="5 4"/>
    <path d="M688,150 L552,150" stroke-dasharray="5 4"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="140" y="98">1. Discover (a todos): ¿hay algún DHCP?</text>
    <text x="140" y="134">2. Offer: te ofrezco 192.168.10.110</text>
    <text x="140" y="170">3. Request: quiero la 192.168.10.110</text>
    <text x="140" y="206">4. Ack: es tuya por 8 días, con estas opciones</text>
    <text x="560" y="112" font-size="11.5">concesiones y</text>
    <text x="560" y="168" font-size="11.5">estado del ámbito</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="262" width="270" height="108" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="295" y="262" width="270" height="108" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="580" y="262" width="270" height="108" rx="10" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="currentColor">
    <text x="24" y="284" font-weight="700">Opciones que recibe</text>
    <text x="24" y="306" font-size="12">003 puerta de enlace: 192.168.10.1</text>
    <text x="24" y="324" font-size="12">006 DNS: 192.168.10.10, 192.168.10.11</text>
    <text x="24" y="342" font-size="12">015 dominio: empresa.local</text>
    <text x="24" y="360" font-size="12">Renueva a la mitad de la concesión.</text>
    <text x="309" y="284" font-weight="700">Conmutación por error</text>
    <text x="309" y="306" font-size="12">Carga compartida: los dos atienden</text>
    <text x="309" y="324" font-size="12">(50 y 50). Espera activa: uno atiende</text>
    <text x="309" y="342" font-size="12">y el otro guarda una reserva (5%).</text>
    <text x="309" y="360" font-size="12">Si uno se cae, el otro sigue.</text>
    <text x="594" y="284" font-weight="700">Si nadie contesta</text>
    <text x="594" y="306" font-size="12">La PC se pone una 169.254.x.x</text>
    <text x="594" y="324" font-size="12">(APIPA) y reintenta cada 5 minutos.</text>
    <text x="594" y="342" font-size="12">Con esa dirección no llega a nada</text>
    <text x="594" y="360" font-size="12">fuera de su cable.</text>
  </g>
</svg>
