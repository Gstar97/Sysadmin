tipo: emparejar
consigna: Uní cada necesidad con lo que hay que instalar (el nombre que acepta Install-WindowsFeature).
pares:
  - { a: "Que el servidor sea controlador de dominio", b: "AD-Domain-Services (rol)" }
  - { a: "Repartir direcciones IP a las PC de la oficina", b: "DHCP (rol)" }
  - { a: "Publicar la intranet", b: "Web-Server (rol IIS)" }
  - { a: "Publicar carpetas compartidas bajo un solo nombre aunque estén en varios servidores", b: "FS-DFS-Namespace (servicio de rol)" }
  - { a: "Hacer copias de seguridad del propio servidor", b: "Windows-Server-Backup (característica)" }
  - { a: "Administrar Active Directory desde este servidor sin que sea controlador", b: "RSAT-AD-Tools (característica)" }
explicacion: >-
  Los roles son el trabajo del servidor; los servicios de rol, partes de un rol (DFS es parte del
  rol de archivos), y las características, herramientas de apoyo. Para PowerShell, todos se
  instalan igual.
