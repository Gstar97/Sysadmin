<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Roles, servicios de rol y características</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="12" y="40" width="460" height="214" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="232" y="92" width="226" height="150" rx="8" fill="var(--surface, #fff)"/>
    <rect x="492" y="40" width="356" height="214" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="26" y="64" font-weight="700" font-size="14">Roles: el trabajo del servidor</text>
    <text x="26" y="94">AD-Domain-Services</text>
    <text x="26" y="114">DNS</text>
    <text x="26" y="134">DHCP</text>
    <text x="26" y="154">Web-Server (IIS)</text>
    <text x="26" y="174">Hyper-V</text>
    <text x="26" y="194">UpdateServices (WSUS)</text>
    <text x="26" y="214">FileAndStorage-Services →</text>
    <text x="244" y="112" font-weight="700">Servicios de rol (archivos)</text>
    <text x="244" y="136">FS-FileServer</text>
    <text x="244" y="156">FS-DFS-Namespace</text>
    <text x="244" y="176">FS-DFS-Replication</text>
    <text x="244" y="196">FS-Resource-Manager</text>
    <text x="244" y="216">FS-Data-Deduplication</text>
    <text x="506" y="64" font-weight="700" font-size="14">Características: herramientas de apoyo</text>
    <text x="506" y="94">Windows-Server-Backup</text>
    <text x="506" y="114">Failover-Clustering</text>
    <text x="506" y="134">RSAT-AD-Tools, RSAT-DNS-Server, GPMC</text>
    <text x="506" y="154">NET-Framework-45-Core</text>
    <text x="506" y="174">Telnet-Client</text>
    <text x="506" y="214" font-size="11.5" fill="var(--muted, #5b6675)">En PowerShell se instalan todos igual:</text>
    <text x="506" y="232" font-family="ui-monospace, monospace" font-size="11">Install-WindowsFeature &lt;Name&gt;</text>
  </g>
  <g stroke="var(--warn, #a16207)" stroke-width="1.5">
    <rect x="12" y="270" width="836" height="48" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <text x="26" y="292" font-weight="700" fill="currentColor">Instalar no es configurar:</text>
  <text x="200" y="292" fill="currentColor">AD DS hay que promoverlo, el DHCP necesita ámbito y autorización, IIS necesita sus sitios.</text>
  <text x="26" y="310" font-size="11.5" fill="currentColor">Siempre con -IncludeManagementTools, para tener la consola y el módulo de PowerShell del rol.</text>
</svg>
