- { id: t1, frente: "Rol", dorso: "La función principal del servidor para la red: AD-Domain-Services, DNS, DHCP, Web-Server, Hyper-V, UpdateServices, archivos." }
- { id: t2, frente: "Servicio de rol", dorso: "Una parte de un rol que se instala por separado, como FS-DFS-Namespace dentro del rol de archivos." }
- { id: t3, frente: "Característica", dorso: "Herramienta de apoyo: Windows-Server-Backup, Failover-Clustering, RSAT, .NET Framework." }
- { id: t4, frente: "Instalar con PowerShell", dorso: "Install-WindowsFeature <Name> -IncludeManagementTools [-Restart] [-ComputerName SRV] [-WhatIf]." }
- { id: t5, frente: "Instalar no es configurar", dorso: "AD DS hay que promoverlo; DHCP necesita ámbito y autorización; IIS, sus sitios." }
- { id: t6, frente: "Server Core y las consolas", dorso: "Con -IncludeManagementTools quedan los módulos de PowerShell; las consolas se usan desde tu estación con RSAT." }
