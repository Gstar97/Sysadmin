tipo: emparejar
consigna: Uní cada situación con la edición, la forma de instalar o la licencia que le corresponde.
pares:
  - { a: "Un estudio contable de 12 personas compra un servidor armado, con el sistema ya instalado", b: "Essentials" }
  - { a: "Un servidor físico que va a correr dos máquinas virtuales: archivos e impresión", b: "Standard" }
  - { a: "Un host de Hyper-V con 18 máquinas virtuales de Windows Server", b: "Datacenter" }
  - { a: "Un controlador de dominio que se administra desde otra computadora", b: "Server Core" }
  - { a: "Un programa contable que solo trae un instalador con ventanas y su propia consola gráfica", b: "Experiencia de escritorio" }
  - { a: "Un servidor que va a vivir tres meses y la empresa quiere pagarlo por mes, sin comprar núcleos ni CAL", b: "Pago por uso con Azure Arc" }
explicacion: >-
  Essentials sirve mientras la empresa sea chica; Standard cubre dos máquinas virtuales por cada vez
  que licenciás los núcleos, así que con muchas VM conviene Datacenter. Server Core es la opción
  para todo lo que no exija escritorio, y el pago por uso evita la compra cuando el servidor dura
  poco.
