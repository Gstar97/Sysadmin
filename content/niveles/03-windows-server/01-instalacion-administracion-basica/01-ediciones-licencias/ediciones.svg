<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Windows Server 2025: tres ediciones y dos formas de instalar</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="14" y="38" width="262" height="178" rx="10" fill="var(--surface, #fff)"/>
    <rect x="299" y="38" width="262" height="178" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="584" y="38" width="262" height="178" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="28" y="62" font-weight="700" font-size="14">Essentials</text>
    <text x="28" y="84">Para empresas chicas</text>
    <text x="28" y="104">• Viene instalada por el fabricante</text>
    <text x="28" y="124">• Hasta 25 usuarios y 50 dispositivos</text>
    <text x="28" y="144">• 1 procesador de hasta 10 núcleos</text>
    <text x="28" y="164">• No necesita CAL</text>
    <text x="28" y="196" font-size="11.5" fill="var(--muted, #5b6675)">Si la empresa crece, se pasa a Standard</text>

    <text x="313" y="62" font-weight="700" font-size="14">Standard</text>
    <text x="313" y="84">La más usada</text>
    <text x="313" y="104">• Todos los roles: AD, DNS, DHCP,</text>
    <text x="313" y="121">   archivos, Hyper-V…</text>
    <text x="313" y="141">• Licencia por núcleos + CAL</text>
    <text x="313" y="161">• 2 VM por cada vez que licenciás</text>
    <text x="313" y="178">   todos los núcleos</text>
    <text x="313" y="198">• Storage Replica limitado</text>

    <text x="598" y="62" font-weight="700" font-size="14">Datacenter</text>
    <text x="598" y="84">Todo lo de Standard, más:</text>
    <text x="598" y="104">• Máquinas virtuales ilimitadas</text>
    <text x="598" y="124">• Storage Spaces Direct</text>
    <text x="598" y="144">• Redes definidas por software</text>
    <text x="598" y="164">• Storage Replica sin límites</text>
    <text x="598" y="196" font-size="11.5" fill="var(--muted, #5b6675)">Conviene desde unas 11 VM por servidor</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="14" y="246" width="370" height="160" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="476" y="246" width="370" height="160" rx="10" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor">
    <text x="28" y="270" font-weight="700" font-size="14">Server Core (por defecto)</text>
    <text x="28" y="294">• Sin escritorio ni Explorador</text>
    <text x="28" y="314">• sconfig, PowerShell y administración remota</text>
    <text x="28" y="334">• Menos disco y RAM, menos parches y reinicios</text>
    <text x="28" y="354">• Menos superficie de ataque</text>
    <text x="28" y="384" font-size="11.5" fill="var(--muted, #5b6675)">DC, DNS, DHCP, archivos, Hyper-V</text>

    <text x="490" y="270" font-weight="700" font-size="14">Experiencia de escritorio</text>
    <text x="490" y="294">• Escritorio, Explorador y consolas gráficas</text>
    <text x="490" y="314">• Administrador del servidor en la pantalla</text>
    <text x="490" y="334">• Para programas que solo traen</text>
    <text x="490" y="351">   instalador gráfico</text>
    <text x="490" y="384" font-size="11.5" fill="var(--muted, #5b6675)">Más cómoda, más pesada</text>
  </g>
  <g stroke="var(--bad, #b42318)" stroke-width="2">
    <line x1="392" y1="326" x2="468" y2="326"/>
    <line x1="418" y1="312" x2="442" y2="340"/>
    <line x1="442" y1="312" x2="418" y2="340"/>
  </g>
  <text x="430" y="362" text-anchor="middle" font-size="11.5" fill="var(--bad, #b42318)">no se cambia</text>
  <text x="430" y="377" text-anchor="middle" font-size="11.5" fill="var(--bad, #b42318)">sin reinstalar</text>
</svg>
