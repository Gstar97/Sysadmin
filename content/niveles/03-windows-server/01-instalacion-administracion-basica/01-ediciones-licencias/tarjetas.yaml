- { id: t1, frente: "Soporte de Windows Server 2025", dorso: "Versión LTSC de noviembre de 2024. Soporte principal hasta el 13/11/2029 y extendido (solo seguridad) hasta el 14/11/2034." }
- { id: t2, frente: "Mínimos de la licencia por núcleo", dorso: "Se licencian todos los núcleos físicos: mínimo 8 por procesador y 16 por servidor. Paquetes de 2 y de 16 núcleos." }
- { id: t3, frente: "Standard y las máquinas virtuales", dorso: "Cada vez que licenciás todos los núcleos, cubrís 2 VM de Windows Server. Para 4 VM, dos veces; para 6, tres." }
- { id: t4, frente: "Datacenter", dorso: "VM ilimitadas con los núcleos licenciados una vez, más Storage Spaces Direct, SDN y Storage Replica sin límites." }
- { id: t5, frente: "Essentials", dorso: "Viene con el equipo del fabricante. Hasta 25 usuarios y 50 dispositivos, 1 procesador de hasta 10 núcleos, sin CAL." }
- { id: t6, frente: "CAL de usuario o de dispositivo", dorso: "Usuario: una por persona, entra desde cualquier equipo. Dispositivo: una por equipo compartido. Tienen que ser de 2025." }
- { id: t7, frente: "Pago por uso con Azure Arc", dorso: "El servidor se conecta a Azure Arc y se paga por mes según los núcleos, sin comprar núcleos ni CAL (salvo las de Escritorio remoto)." }
- { id: t8, frente: "Server Core o escritorio", dorso: "Se elige al instalar y no se puede cambiar sin reinstalar. Server Core: menos disco, parches y superficie de ataque; es el recomendado." }
