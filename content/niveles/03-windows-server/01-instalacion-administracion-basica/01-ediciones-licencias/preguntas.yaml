- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: Una empresa de 60 personas necesita un controlador de dominio y un servidor de archivos, cada uno en su máquina virtual, sobre un mismo servidor físico. ¿Qué edición le conviene?
  opciones:
    - { texto: "Standard: con licenciar los núcleos una vez cubre las dos VM", correcta: true, explicacion: "Standard da derecho a 2 VM por cada vez que licenciás todos los núcleos." }
    - { texto: "Essentials", explicacion: "Essentials admite hasta 25 usuarios y 50 dispositivos." }
    - { texto: "Datacenter", explicacion: "Funciona, pero para dos VM es mucho más cara que Standard." }
    - { texto: "Cualquiera: todas tienen VM ilimitadas", explicacion: "Solo Datacenter tiene VM ilimitadas." }
- id: p02
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Un servidor tiene dos procesadores de 6 núcleos y va a correr Windows Server 2025 Standard con 2 máquinas virtuales. ¿Cuántos núcleos de licencia hay que comprar?
  opciones:
    - { texto: "16", correcta: true, explicacion: "Tiene 12, pero el mínimo es 8 por procesador (2 × 8 = 16) y 16 por servidor. Con 2 VM alcanza con licenciarlos una vez." }
    - { texto: "12", explicacion: "Faltan los mínimos: 8 por procesador y 16 por servidor." }
    - { texto: "24", explicacion: "Con 2 VM no hace falta licenciar dos veces." }
    - { texto: "32", explicacion: "Eso cubriría 4 VM." }
- id: p03
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Un servidor con un procesador de 16 núcleos va a correr Standard con 5 máquinas virtuales de Windows Server. ¿Cuántos núcleos de licencia hay que comprar?
  opciones:
    - { texto: "48", correcta: true, explicacion: "Cada vez que licenciás los 16 núcleos cubrís 2 VM. Para 5 VM hacen falta 3 juegos: 16 × 3 = 48." }
    - { texto: "16", explicacion: "Eso cubre solo 2 VM." }
    - { texto: "40", explicacion: "No se licencia por VM sino por juegos completos de núcleos." }
    - { texto: "80", explicacion: "Serían 5 juegos; con 3 ya alcanza para 6 VM." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Instalaste un servidor con Server Core y ahora un proveedor te pide el escritorio para instalar su programa. ¿Qué hacés?
  opciones:
    - { texto: "Hay que reinstalar con experiencia de escritorio (o pedirle al proveedor una versión que se instale por línea de comandos)", correcta: true, explicacion: "Desde 2016 no se puede pasar de Core a escritorio sin reinstalar." }
    - { texto: "Instalar la característica de escritorio con Install-WindowsFeature", explicacion: "Eso existía en 2012; ya no." }
    - { texto: "Activar el escritorio con sconfig", explicacion: "sconfig configura el servidor, no agrega el escritorio." }
    - { texto: "Cambiar la edición a Datacenter", explicacion: "La edición no tiene nada que ver con el escritorio." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Un servidor 2025 lo usan 40 personas, cada una con su notebook y su celular (80 dispositivos). ¿Qué CAL conviene comprar?
  opciones:
    - { texto: "40 CAL de usuario de Windows Server 2025", correcta: true, explicacion: "Cada persona entra desde los equipos que quiera con su CAL de usuario: 40 en lugar de 80." }
    - { texto: "80 CAL de dispositivo", explicacion: "Funciona, pero son el doble." }
    - { texto: "40 CAL de usuario de Windows Server 2022, que son más baratas", explicacion: "Para un servidor 2025 las CAL tienen que ser de 2025." }
    - { texto: "Ninguna: las cubren los núcleos", explicacion: "Los núcleos licencian el servidor; las CAL, a quienes lo usan." }
- id: p06
  tipo: opcion_multiple
  dificultad: 1
  enunciado: Si una empresa tiene menos CAL que usuarios, ¿qué pasa?
  opciones:
    - { texto: "Windows deja entrar igual, pero la empresa está incumpliendo el contrato y se detecta en una auditoría", correcta: true, explicacion: "Las CAL no las controla el sistema: son una obligación de la licencia." }
    - { texto: "Los usuarios que sobran no pueden iniciar sesión", explicacion: "Windows no cuenta CAL al iniciar sesión." }
    - { texto: "El servidor se desactiva", explicacion: "La activación tiene que ver con la licencia del servidor, no con las CAL." }
    - { texto: "Nada, las CAL son opcionales", explicacion: "Son obligatorias, aunque nadie las controle en el momento." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Hoy (noviembre de 2026) te piden armar un servidor nuevo con Windows Server 2016 "porque es el que conocen". ¿Qué respondés?
  opciones:
    - { texto: "Que su soporte extendido termina en enero de 2027: para algo nuevo, Windows Server 2025, con soporte hasta 2034", correcta: true, explicacion: "Un 2016 dejaría de recibir parches de seguridad en dos meses." }
    - { texto: "Que está bien, porque 2016 todavía recibe mejoras", explicacion: "2016 está en soporte extendido: solo seguridad, y por poco tiempo." }
    - { texto: "Que conviene 2022, que tiene soporte principal hasta 2029", explicacion: "El soporte principal de 2022 terminó en octubre de 2026." }
    - { texto: "Que da igual la versión mientras esté actualizado", explicacion: "Cuando termina el soporte, ya no hay actualizaciones." }
- id: p08
  tipo: respuesta_multiple
  dificultad: 2
  enunciado: ¿Qué ventajas tiene Server Core frente a la experiencia de escritorio? (Marcá todas las correctas.)
  opciones:
    - { texto: "Ocupa menos disco y memoria", correcta: true, explicacion: "No tiene el escritorio ni sus componentes." }
    - { texto: "Necesita menos actualizaciones y reinicios", correcta: true, explicacion: "Menos componentes, menos parches." }
    - { texto: "Tiene menos superficie de ataque", correcta: true, explicacion: "Menos programas instalados, menos lugares por donde entrar." }
    - { texto: "Trae más roles", explicacion: "Los roles de Microsoft son los mismos; cambia la forma de administrarlos." }
    - { texto: "No necesita licencia", explicacion: "Se licencia igual que con escritorio." }
- id: p09
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Un host de Hyper-V con un procesador de 16 núcleos va a correr 14 máquinas virtuales de Windows Server. Con los precios sugeridos de Microsoft (16 núcleos Standard US$ 1.176, Datacenter US$ 6.771), ¿qué conviene?
  opciones:
    - { texto: "Datacenter: Standard necesitaría 7 juegos (US$ 8.232) y Datacenter uno solo (US$ 6.771)", correcta: true, explicacion: "14 VM / 2 = 7 juegos de Standard. Desde unas 11 VM, Datacenter es más barato." }
    - { texto: "Standard: siempre es más barato", explicacion: "Con muchas VM, la cuenta da al revés." }
    - { texto: "Essentials", explicacion: "Essentials no está pensada para hosts de virtualización." }
    - { texto: "Da lo mismo", explicacion: "Hay una diferencia de casi US$ 1.500." }
- id: p10
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué permite el pago por uso de Windows Server con Azure Arc?
  opciones:
    - { texto: "Pagar por mes según los núcleos que usa el servidor, sin comprar núcleos ni CAL (salvo las de Escritorio remoto)", correcta: true, explicacion: "Conviene para servidores que viven poco o para quien prefiere un gasto mensual." }
    - { texto: "Usar Windows Server gratis si el servidor está en Azure", explicacion: "En Azure la licencia se paga con la máquina virtual." }
    - { texto: "Tener VM ilimitadas con Standard", explicacion: "No cambia lo que permite cada edición." }
    - { texto: "Evitar las actualizaciones", explicacion: "No tiene relación." }
- id: p11
  tipo: opcion_multiple
  dificultad: 1
  enunciado: Querés practicar en tu casa con Windows Server 2025 sin comprar una licencia. ¿Qué usás?
  opciones:
    - { texto: "La versión de evaluación de 180 días del Centro de evaluación de Microsoft", correcta: true, explicacion: "Es oficial, gratuita y se puede convertir a licencia comprada sin reinstalar." }
    - { texto: "Una clave que circula por internet", explicacion: "No es legal y suele venir con sorpresas." }
    - { texto: "Essentials, que es gratis", explicacion: "Essentials se paga con el equipo del fabricante." }
    - { texto: "No se puede sin comprar", explicacion: "Para eso está la evaluación." }
- id: p12
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Un servidor chico tiene un procesador de 4 núcleos. ¿Cuántos núcleos se licencian?
  opciones:
    - { texto: "16, por el mínimo de 16 por servidor", correcta: true, explicacion: "Mínimo 8 por procesador y 16 por servidor, aunque tenga menos." }
    - { texto: "4", explicacion: "No alcanza el mínimo." }
    - { texto: "8", explicacion: "8 es el mínimo por procesador; además, hay un mínimo de 16 por servidor." }
    - { texto: "Ninguno: un servidor tan chico usa Essentials gratis", explicacion: "Essentials se paga con el equipo; Standard y Datacenter, por núcleos." }
