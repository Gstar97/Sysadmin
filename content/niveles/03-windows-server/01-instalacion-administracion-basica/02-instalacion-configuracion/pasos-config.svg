<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="pc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Primeros pasos con un servidor nuevo</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="10" y="40" width="112" height="150" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="132" y="40" width="112" height="150" rx="10" fill="var(--surface, #fff)"/>
    <rect x="254" y="40" width="112" height="150" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="376" y="40" width="112" height="150" rx="10" fill="var(--surface, #fff)"/>
    <rect x="498" y="40" width="112" height="150" rx="10" fill="var(--surface, #fff)"/>
    <rect x="620" y="40" width="112" height="150" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="742" y="40" width="108" height="150" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.8" marker-end="url(#pc-a)">
    <line x1="122" y1="115" x2="130" y2="115"/><line x1="244" y1="115" x2="252" y2="115"/><line x1="366" y1="115" x2="374" y2="115"/><line x1="488" y1="115" x2="496" y2="115"/><line x1="610" y1="115" x2="618" y2="115"/><line x1="732" y1="115" x2="740" y2="115"/>
  </g>
  <g fill="currentColor">
    <text x="20" y="62" font-weight="700">1. Red</text>
    <text x="20" y="80">IP fija, puerta</text>
    <text x="20" y="95">de enlace y DNS</text>
    <text x="20" y="124" font-size="11" fill="var(--muted, #5b6675)">sconfig 8</text>
    <text x="20" y="146" font-family="ui-monospace, monospace" font-size="10">New-NetIPAddress</text>
    <text x="20" y="161" font-family="ui-monospace, monospace" font-size="10">Set-DnsClient…</text>

    <text x="142" y="62" font-weight="700">2. Hora</text>
    <text x="142" y="80">Zona horaria</text>
    <text x="142" y="124" font-size="11" fill="var(--muted, #5b6675)">sconfig 9</text>
    <text x="142" y="146" font-family="ui-monospace, monospace" font-size="10">Set-TimeZone</text>

    <text x="264" y="62" font-weight="700">3. Nombre</text>
    <text x="264" y="80">Hasta 15</text>
    <text x="264" y="95">caracteres</text>
    <text x="264" y="124" font-size="11" fill="var(--muted, #5b6675)">sconfig 2</text>
    <text x="264" y="146" font-family="ui-monospace, monospace" font-size="10">Rename-Computer</text>
    <text x="264" y="176" font-size="11" fill="var(--warn, #a16207)">pide reiniciar</text>

    <text x="386" y="62" font-weight="700">4. Parches</text>
    <text x="386" y="80">Actualizaciones</text>
    <text x="386" y="95">pendientes</text>
    <text x="386" y="124" font-size="11" fill="var(--muted, #5b6675)">sconfig 6</text>
    <text x="386" y="146" font-size="11">Windows Update</text>

    <text x="508" y="62" font-weight="700">5. Remoto</text>
    <text x="508" y="80">WinRM y, si</text>
    <text x="508" y="95">hace falta, RDP</text>
    <text x="508" y="124" font-size="11" fill="var(--muted, #5b6675)">sconfig 4 y 7</text>
    <text x="508" y="146" font-family="ui-monospace, monospace" font-size="10">Enable-PSRemoting</text>

    <text x="630" y="62" font-weight="700">6. Dominio</text>
    <text x="630" y="80">Unirlo</text>
    <text x="630" y="95">(módulo 3.3)</text>
    <text x="630" y="124" font-size="11" fill="var(--muted, #5b6675)">sconfig 1</text>
    <text x="630" y="146" font-family="ui-monospace, monospace" font-size="10">Add-Computer</text>
    <text x="630" y="176" font-size="11" fill="var(--warn, #a16207)">pide reiniciar</text>

    <text x="752" y="62" font-weight="700">7. Cerrar</text>
    <text x="752" y="80">Instantánea y</text>
    <text x="752" y="95">documentación</text>
    <text x="752" y="124" font-size="11" fill="var(--muted, #5b6675)">cuaderno técnico</text>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="10" y="226">• El nombre va antes del dominio: la cuenta de equipo nace con el nombre correcto.</text>
    <text x="10" y="248">• La red va antes que todo: sin IP ni DNS no hay actualizaciones ni dominio.</text>
    <text x="10" y="270">• Si hay varios cambios que piden reiniciar, se hacen juntos y se reinicia una vez.</text>
  </g>
</svg>
