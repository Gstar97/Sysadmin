tipo: ordenar
consigna: Ordená los pasos para dejar listo un servidor recién instalado que después se va a unir al dominio.
pasos:
  - "Tomar una instantánea de la máquina virtual recién instalada"
  - "Poner la IP fija, la puerta de enlace y el DNS del controlador de dominio"
  - "Cambiar la zona horaria"
  - "Cambiar el nombre y reiniciar"
  - "Instalar las actualizaciones pendientes"
  - "Unir el servidor al dominio y reiniciar"
  - "Anotar nombre, IP, edición y fecha en el cuaderno técnico"
explicacion: >-
  La red va primero porque sin ella no hay actualizaciones ni dominio. El nombre va antes del
  dominio para que la cuenta de equipo nazca con el nombre definitivo, y el dominio va al final
  porque necesita todo lo anterior.
