- { id: t1, frente: "Imagen sin 'Desktop Experience'", dorso: "Es Server Core: sin escritorio, con sconfig y PowerShell. La que dice Desktop Experience trae el escritorio." }
- { id: t2, frente: "Orden de los primeros pasos", dorso: "Red (IP fija y DNS), zona horaria, nombre (reinicio), actualizaciones, administración remota y, al final, el dominio." }
- { id: t3, frente: "IP 169.254.x.x", dorso: "APIPA: la placa pidió DHCP y nadie le contestó. Un servidor lleva IP fija." }
- { id: t4, frente: "IP fija en PowerShell", dorso: "New-NetIPAddress -InterfaceAlias Ethernet -IPAddress … -PrefixLength 24 -DefaultGateway …; el DNS con Set-DnsClientServerAddress." }
- { id: t5, frente: "Cambiar el nombre", dorso: "Rename-Computer -NewName SRV-ARCH01 (-Restart). Hasta 15 caracteres, sin espacios ni puntos. Queda pendiente hasta reiniciar." }
- { id: t6, frente: "Perfil de red", dorso: "Sin dominio: Public (firewall estricto) o Private. Unido al dominio: DomainAuthenticated, que se pone solo." }
- { id: t7, frente: "sconfig", dorso: "Menú de configuración de Server Core: 1 dominio, 2 nombre, 4 remoto, 6 parches, 7 RDP, 8 red, 9 hora, 13 reiniciar." }
