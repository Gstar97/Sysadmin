- { id: t1, frente: "Estación de administración", dorso: "Tu computadora con RSAT o un servidor dedicado (SRV-ADMIN) desde donde manejás todos los demás, sin iniciar sesión en cada uno." }
- { id: t2, frente: "WinRM", dorso: "Administración remota de Windows (5985, o 5986 con HTTPS). La usan PowerShell remoto, el Administrador del servidor y Windows Admin Center." }
- { id: t3, frente: "Windows Admin Center", dorso: "Aplicación web (versión 2606). Puerta de enlace en un servidor de administración, se abre en el navegador y llega a los servidores por WinRM." }
- { id: t4, frente: "RSAT", dorso: "Consolas y módulos de PowerShell de cada rol en tu computadora. Windows 11: características opcionales (Add-WindowsCapability)." }
- { id: t5, frente: "Consolas MMC y firewall", dorso: "Usan RPC (135 + dinámicos). Grupos de reglas apagados: Remote Event Log Management, Remote Service Management, Remote Volume Management, WMI." }
- { id: t6, frente: "PowerShell remoto en un grupo de trabajo", dorso: "Sin Kerberos: el destino en TrustedHosts (Set-Item WSMan:\\localhost\\Client\\TrustedHosts) y -Credential del otro equipo." }
- { id: t7, frente: "Escritorio remoto", dorso: "RDP, puerto 3389, viene apagado. Dos sesiones de administración incluidas. Nunca publicado a internet: se entra por VPN." }
