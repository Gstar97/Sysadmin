tipo: emparejar
consigna: Uní cada tarea con la herramienta que más conviene.
pares:
  - { a: "Reiniciar el mismo servicio en 30 servidores", b: "PowerShell remoto (Invoke-Command)" }
  - { a: "Ver con el mouse el estado, los discos y los eventos de un Server Core desde el navegador", b: "Windows Admin Center" }
  - { a: "Crear usuarios con la consola de siempre desde tu notebook con Windows 11", b: "RSAT" }
  - { a: "Usar un programa gráfico que solo existe en un servidor con escritorio", b: "Escritorio remoto" }
  - { a: "Ver en una sola pantalla el estado de todos los servidores e instalar un rol en uno de ellos", b: "Administrador del servidor" }
explicacion: >-
  PowerShell es la única que escala a muchos servidores; Windows Admin Center y el Administrador
  del servidor son cómodos para mirar y para tareas puntuales; RSAT trae las consolas a tu
  computadora, y el Escritorio remoto queda para cuando no hay otra.
