<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="mh-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Herramientas de administración y por dónde se conectan</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="12" y="44" width="186" height="300" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="662" y="44" width="186" height="300" rx="10" fill="var(--surface, #fff)"/>
    <rect x="236" y="54" width="232" height="52" rx="8" fill="var(--surface, #fff)"/>
    <rect x="236" y="120" width="232" height="52" rx="8" fill="var(--surface, #fff)"/>
    <rect x="236" y="186" width="232" height="64" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="236" y="264" width="232" height="52" rx="8" fill="var(--surface, #fff)"/>
    <rect x="496" y="120" width="140" height="52" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="26" y="70" font-weight="700">Estación de administración</text>
    <text x="26" y="96">Windows 11 con RSAT</text>
    <text x="26" y="116">o un servidor con</text>
    <text x="26" y="134">escritorio (SRV-ADMIN)</text>
    <text x="26" y="170" font-size="11.5" fill="var(--muted, #5b6675)">Acá corren las consolas,</text>
    <text x="26" y="186" font-size="11.5" fill="var(--muted, #5b6675)">el navegador y PowerShell</text>

    <text x="676" y="70" font-weight="700">Servidores administrados</text>
    <text x="676" y="96">SRV-CORE01</text>
    <text x="676" y="116">DC01, DC02</text>
    <text x="676" y="136">SRV-ARCH01…</text>
    <text x="676" y="170" font-size="11.5" fill="var(--muted, #5b6675)">Muchos son Server Core:</text>
    <text x="676" y="186" font-size="11.5" fill="var(--muted, #5b6675)">no hace falta escritorio</text>

    <text x="248" y="75" font-weight="700">Administrador del servidor</text>
    <text x="248" y="94" font-size="11.5">y PowerShell remoto</text>
    <text x="248" y="141" font-weight="700">Windows Admin Center</text>
    <text x="248" y="160" font-size="11.5">navegador → puerta de enlace</text>
    <text x="248" y="207" font-weight="700">Consolas MMC (RSAT)</text>
    <text x="248" y="225" font-size="11.5">Eventos, Servicios, Discos…</text>
    <text x="248" y="241" font-size="11.5" fill="var(--warn, #a16207)">reglas de firewall apagadas</text>
    <text x="248" y="285" font-weight="700">Escritorio remoto</text>
    <text x="248" y="304" font-size="11.5">la pantalla completa</text>
    <text x="508" y="141" font-weight="700">Puerta de enlace</text>
    <text x="508" y="160" font-size="11.5">WAC en SRV-ADMIN</text>
  </g>
  <g stroke="currentColor" stroke-width="1.6" marker-end="url(#mh-a)">
    <line x1="198" y1="80" x2="234" y2="80"/>
    <line x1="468" y1="80" x2="660" y2="80"/>
    <line x1="198" y1="146" x2="234" y2="146"/>
    <line x1="468" y1="146" x2="494" y2="146"/>
    <line x1="636" y1="146" x2="660" y2="146"/>
    <line x1="198" y1="218" x2="234" y2="218"/>
    <line x1="468" y1="218" x2="660" y2="218"/>
    <line x1="198" y1="290" x2="234" y2="290"/>
    <line x1="468" y1="290" x2="660" y2="290"/>
  </g>
  <g font-size="11.5" fill="currentColor">
    <text x="564" y="72" text-anchor="middle">WinRM · 5985</text>
    <text x="481" y="114" text-anchor="middle">443</text>
    <text x="649" y="114" text-anchor="middle">5985</text>
    <text x="564" y="210" text-anchor="middle">RPC · 135 + dinámicos</text>
    <text x="564" y="282" text-anchor="middle">RDP · 3389</text>
  </g>
  <text x="430" y="368" text-anchor="middle" font-size="12" fill="currentColor">WinRM: Kerberos dentro del dominio; en un grupo de trabajo, TrustedHosts y credenciales del otro equipo.</text>
</svg>
