- { id: t1, frente: "Capas del almacenamiento", dorso: "Disco → estilo de partición (GPT/MBR) → partición → volumen (letra o carpeta) → sistema de archivos (NTFS/ReFS)." }
- { id: t2, frente: "Disco nuevo en un servidor", dorso: "Llega Offline y RAW. Set-Disk -IsOffline $false, Initialize-Disk -PartitionStyle GPT, New-Partition, Format-Volume." }
- { id: t3, frente: "GPT o MBR", dorso: "GPT: UEFI, más de 2 TB, hasta 128 particiones. MBR: lo antiguo, hasta 2 TB y 4 primarias." }
- { id: t4, frente: "Agrandar un volumen", dorso: "Get-PartitionSupportedSize da SizeMax; Resize-Partition -DriveLetter D -Size $max. Sin apagar." }
- { id: t5, frente: "NTFS o ReFS", dorso: "NTFS: sistema, carpetas de usuarios, cuotas, compresión, cifrado. ReFS: VM de Hyper-V y copias de seguridad; no arranca." }
- { id: t6, frente: "Espacios de almacenamiento", dorso: "Grupo de discos con discos virtuales Simple (sin protección), Mirror (copias) o Parity (paridad). S2D (varios servidores) es de Datacenter." }
- { id: t7, frente: "Disco del sistema", dorso: "EFI (100 MB, FAT32, arranque), MSR (16 MB), C: (NTFS) y Recovery al final. No se tocan." }
