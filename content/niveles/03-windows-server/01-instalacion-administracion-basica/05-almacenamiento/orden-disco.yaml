tipo: ordenar
consigna: Ordená los pasos para dejar en servicio un disco recién agregado a un servidor.
pasos:
  - "Mirar Get-Disk y anotar el número del disco nuevo"
  - "Ponerlo en línea con Set-Disk -IsOffline $false"
  - "Inicializarlo con el estilo GPT"
  - "Crear la partición con New-Partition y darle una letra"
  - "Formatearla con Format-Volume y una etiqueta"
  - "Comprobar el volumen con Get-Volume"
explicacion: >-
  Cada paso necesita el anterior: no se puede inicializar un disco fuera de línea, ni particionar
  uno sin estilo de partición, ni formatear lo que no es una partición. Mirar Get-Disk primero
  evita trabajar sobre el disco equivocado.
