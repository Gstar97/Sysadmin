<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Las capas del almacenamiento en Windows</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="12" y="40" width="300" height="46" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="12" y="94" width="300" height="46" rx="8" fill="var(--surface, #fff)"/>
    <rect x="12" y="148" width="300" height="46" rx="8" fill="var(--surface, #fff)"/>
    <rect x="12" y="202" width="300" height="46" rx="8" fill="var(--surface, #fff)"/>
    <rect x="12" y="256" width="300" height="46" rx="8" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor">
    <text x="24" y="60" font-weight="700">Sistema de archivos</text><text x="24" y="77" font-size="11.5">NTFS o ReFS</text>
    <text x="24" y="114" font-weight="700">Volumen</text><text x="24" y="131" font-size="11.5">letra (D:) o carpeta · Format-Volume, Get-Volume</text>
    <text x="24" y="168" font-weight="700">Partición</text><text x="24" y="185" font-size="11.5">un pedazo del disco · New-Partition</text>
    <text x="24" y="222" font-weight="700">Estilo de partición</text><text x="24" y="239" font-size="11.5">GPT o MBR · Initialize-Disk</text>
    <text x="24" y="276" font-weight="700">Disco</text><text x="24" y="293" font-size="11.5">físico o virtual, en línea o no · Get-Disk, Set-Disk</text>
  </g>
  <text x="352" y="58" font-weight="700" fill="currentColor">Disco 0 (sistema, GPT)</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="352" y="68" width="40" height="56" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="392" y="68" width="22" height="56" fill="var(--surface-2, #eef1f5)"/>
    <rect x="414" y="68" width="372" height="56" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="786" y="68" width="62" height="56" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="currentColor" font-size="11">
    <text x="372" y="92" text-anchor="middle">EFI</text><text x="372" y="108" text-anchor="middle">FAT32</text>
    <text x="403" y="100" text-anchor="middle">MSR</text>
    <text x="600" y="92" text-anchor="middle" font-size="12.5" font-weight="700">C:  NTFS</text><text x="600" y="110" text-anchor="middle">el sistema y los programas</text>
    <text x="817" y="92" text-anchor="middle">Recup.</text><text x="817" y="108" text-anchor="middle">~600 MB</text>
    <text x="372" y="140" text-anchor="middle">100 MB</text><text x="403" y="140" text-anchor="middle">16 MB</text>
  </g>
  <text x="352" y="186" font-weight="700" fill="currentColor">Disco 1 (recién agregado)</text>
  <g stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4">
    <rect x="352" y="196" width="496" height="56" fill="var(--surface, #fff)"/>
  </g>
  <text x="600" y="220" text-anchor="middle" fill="currentColor">Offline · RAW (sin estilo de partición)</text>
  <text x="600" y="238" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">en un servidor, los discos nuevos llegan fuera de línea</text>
  <text x="352" y="284" font-size="12" fill="currentColor">En línea → GPT → partición → formato:</text>
  <text x="352" y="302" font-size="11" font-family="ui-monospace, monospace" fill="currentColor">Set-Disk · Initialize-Disk · New-Partition · Format-Volume</text>
</svg>
