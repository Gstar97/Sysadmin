tipo: emparejar
consigna: Sin buscar, uní cada tarea con el cmdlet que la hace (todos existen).
pares:
  - { a: "Ver los procesos que están corriendo", b: "Get-Process" }
  - { a: "Detener un servicio", b: "Stop-Service" }
  - { a: "Crear una carpeta", b: "New-Item" }
  - { a: "Probar si llega a un servidor y a un puerto", b: "Test-NetConnection" }
  - { a: "Borrar una regla del firewall", b: "Remove-NetFirewallRule" }
  - { a: "Guardar una lista de objetos en un archivo CSV", b: "Export-Csv" }
  - { a: "Cambiar la zona horaria", b: "Set-TimeZone" }
explicacion: >-
  Verbo (qué) más sustantivo (sobre qué): Get para ver, Stop para detener, New para crear, Test
  para probar, Remove para borrar, Export para sacar datos y Set para cambiar.
