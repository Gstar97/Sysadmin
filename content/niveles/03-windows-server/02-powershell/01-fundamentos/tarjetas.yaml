- { id: t1, frente: "Forma de un cmdlet", dorso: "Verbo-Sustantivo en singular: Get-Service, New-Item, Remove-ADUser. Los verbos son una lista cerrada (Get-Verb)." }
- { id: t2, frente: "Encontrar un comando", dorso: "Get-Command -Noun Service, -Verb Test, *firewall*, -Module ActiveDirectory." }
- { id: t3, frente: "Get-Help", dorso: "Get-Help X (resumen), -Examples, -Parameter Nombre, -Online. Update-Help baja la ayuda completa." }
- { id: t4, frente: "Tipos de parámetro", dorso: "Con nombre (-Name X), posicional (el valor solo, en su lugar) y switch (-Force, sin valor)." }
- { id: t5, frente: "-WhatIf y -Confirm", dorso: "-WhatIf muestra qué haría sin hacerlo; -Confirm pregunta antes de cada cambio." }
- { id: t6, frente: "Alias", dorso: "gsv, gci, ls, dir, ?, %. Para la consola; en scripts, nombres completos. ls es Get-ChildItem, no el de Linux." }
- { id: t7, frente: "PowerShell 5.1 y 7", dorso: "5.1 viene con Windows (.NET Framework). 7.6 LTS se instala aparte (pwsh, .NET 10, multiplataforma). Conviven." }
