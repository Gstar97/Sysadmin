<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Cómo se lee un cmdlet</text>
  <g font-family="ui-monospace, monospace" font-size="16" fill="currentColor">
    <text x="24" y="78"><tspan fill="var(--info, #1d4ed8)" font-weight="700">Get</tspan>-<tspan fill="var(--ok, #15803d)" font-weight="700">Service</tspan> <tspan fill="var(--warn, #a16207)">-Name</tspan> Spooler <tspan fill="var(--warn, #a16207)">-ComputerName</tspan> SRV01</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2"><line x1="38" y1="86" x2="38" y2="106"/><line x1="96" y1="86" x2="96" y2="128"/><line x1="163" y1="86" x2="163" y2="106"/><line x1="230" y1="86" x2="230" y2="106"/><line x1="336" y1="86" x2="336" y2="106"/><line x1="432" y1="86" x2="432" y2="106"/></g>
  <g fill="currentColor" font-size="12"><text x="38" y="124" text-anchor="middle" font-weight="700">verbo (qué)</text><text x="96" y="142" text-anchor="middle" font-weight="700">sustantivo (sobre qué)</text><text x="163" y="124" text-anchor="middle" font-weight="700">parámetro</text><text x="230" y="124" text-anchor="middle" font-weight="700">valor</text><text x="336" y="124" text-anchor="middle" font-weight="700">parámetro</text><text x="432" y="124" text-anchor="middle" font-weight="700">valor</text></g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="14" y="164" width="520" height="122" rx="10" fill="var(--surface, #fff)"/>
    <rect x="552" y="40" width="296" height="246" rx="10" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor">
    <text x="28" y="188" font-weight="700">Tres tipos de parámetro</text>
    <text x="28" y="212">Con nombre:</text><text x="140" y="212" font-family="ui-monospace, monospace" font-size="12">Get-Service -Name Spooler</text>
    <text x="28" y="236">Posicional:</text><text x="140" y="236" font-family="ui-monospace, monospace" font-size="12">Get-Service Spooler</text>
    <text x="28" y="260">Switch:</text><text x="140" y="260" font-family="ui-monospace, monospace" font-size="12">Stop-Service Spooler -Force</text>
    <text x="566" y="64" font-weight="700">Verbos más usados</text>
    <text x="566" y="90">Get · Set · New · Remove</text><text x="566" y="106" font-size="11.5" fill="var(--muted, #5b6675)">ver, cambiar, crear, borrar</text>
    <text x="566" y="134">Start · Stop · Restart</text><text x="566" y="150" font-size="11.5" fill="var(--muted, #5b6675)">Enable · Disable: el ciclo de vida</text>
    <text x="566" y="178">Test · Measure</text><text x="566" y="194" font-size="11.5" fill="var(--muted, #5b6675)">diagnosticar y contar</text>
    <text x="566" y="222">Import · Export · ConvertTo</text><text x="566" y="238" font-size="11.5" fill="var(--muted, #5b6675)">entrar y sacar datos</text>
    <text x="566" y="268" font-size="11.5">Get-Verb muestra la lista completa</text>
  </g>
</svg>
