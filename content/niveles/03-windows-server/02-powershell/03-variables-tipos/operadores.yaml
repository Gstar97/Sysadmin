tipo: emparejar
consigna: Uní cada pregunta con el operador que la responde.
pares:
  - { a: "¿El nombre empieza con SRV-? (con un comodín)", b: "-like" }
  - { a: "¿El texto tiene tres dígitos seguidos? (con una expresión regular)", b: "-match" }
  - { a: "¿DC01 está en la lista $servidores? (el valor a la izquierda)", b: "-in" }
  - { a: "¿La lista $servidores tiene a DC01? (la lista a la izquierda)", b: "-contains" }
  - { a: "¿Quedan más de 20 GB libres?", b: "-gt" }
  - { a: "¿El estado es exactamente Running?", b: "-eq" }
explicacion: >-
  -like usa * y ?; -match, expresiones regulares. -in y -contains preguntan lo mismo con la lista
  en distinto lado. Para números, -gt, -lt y compañía; para igualdad, -eq. Ninguno distingue
  mayúsculas salvo las versiones con c adelante (-ceq, -clike).
