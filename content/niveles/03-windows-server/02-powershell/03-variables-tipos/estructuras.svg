<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Tres formas de ordenar datos</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="12" y="38" width="270" height="250" rx="10" fill="var(--surface, #fff)"/>
    <rect x="296" y="38" width="270" height="250" rx="10" fill="var(--surface, #fff)"/>
    <rect x="580" y="38" width="268" height="250" rx="10" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor">
    <text x="26" y="62" font-weight="700" font-size="14">Array: una lista</text>
    <text x="310" y="62" font-weight="700" font-size="14">Tabla hash: clave → valor</text>
    <text x="594" y="62" font-weight="700" font-size="14">[PSCustomObject]: una fila</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" fill="var(--info-soft, #e0e9fd)">
    <rect x="26" y="78" width="80" height="34"/><rect x="106" y="78" width="80" height="34"/><rect x="186" y="78" width="80" height="34"/>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="66" y="99" text-anchor="middle">DC01</text><text x="146" y="99" text-anchor="middle">SRV-ARCH01</text><text x="226" y="99" text-anchor="middle">SRV-WEB01</text>
    <text x="66" y="127" text-anchor="middle" fill="var(--muted, #5b6675)">[0]</text><text x="146" y="127" text-anchor="middle" fill="var(--muted, #5b6675)">[1]</text><text x="226" y="127" text-anchor="middle" fill="var(--muted, #5b6675)">[2] o [-1]</text>
  </g>
  <g fill="currentColor" font-size="11" font-family="ui-monospace, monospace">
    <text x="26" y="160">$s = @('DC01','SRV-ARCH01',</text>
    <text x="26" y="176">       'SRV-WEB01')</text>
    <text x="26" y="200">$s[0]       # DC01</text>
    <text x="26" y="216">$s.Count    # 3</text>
    <text x="26" y="232">$s += 'SRV-APP01'</text>
  </g>
  <text x="26" y="270" font-size="11.5" fill="var(--muted, #5b6675)">Se lee por posición, desde 0</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="310" y="78" width="110" height="28" fill="var(--warn-soft, #fbf0d0)"/><rect x="420" y="78" width="132" height="28" fill="var(--surface, #fff)"/>
    <rect x="310" y="106" width="110" height="28" fill="var(--warn-soft, #fbf0d0)"/><rect x="420" y="106" width="132" height="28" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="320" y="97">DC01</text><text x="430" y="97">192.168.10.10</text>
    <text x="320" y="125">SRV-WEB01</text><text x="430" y="125">192.168.10.30</text>
  </g>
  <g fill="currentColor" font-size="11" font-family="ui-monospace, monospace">
    <text x="310" y="160">$ips = @{ DC01 = '…10';</text>
    <text x="310" y="176">  'SRV-WEB01' = '…30' }</text>
    <text x="310" y="200">$ips['SRV-WEB01']</text>
    <text x="310" y="216">$ips.DC01</text>
    <text x="310" y="232">$ips.ContainsKey('DC02')</text>
  </g>
  <text x="310" y="270" font-size="11.5" fill="var(--muted, #5b6675)">Se lee por nombre, como un diccionario</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="594" y="78" width="80" height="24" fill="var(--ok-soft, #dcf5e4)"/><rect x="674" y="78" width="100" height="24" fill="var(--ok-soft, #dcf5e4)"/><rect x="774" y="78" width="60" height="24" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="594" y="102" width="80" height="24" fill="var(--surface, #fff)"/><rect x="674" y="102" width="100" height="24" fill="var(--surface, #fff)"/><rect x="774" y="102" width="60" height="24" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor" font-size="11">
    <text x="600" y="95" font-weight="700">Servidor</text><text x="680" y="95" font-weight="700">IP</text><text x="780" y="95" font-weight="700">Online</text>
    <text x="600" y="119">DC01</text><text x="680" y="119">192.168.10.10</text><text x="780" y="119">True</text>
  </g>
  <g fill="currentColor" font-size="11" font-family="ui-monospace, monospace">
    <text x="594" y="160">[PSCustomObject]@{</text>
    <text x="594" y="176">  Servidor = 'DC01'</text>
    <text x="594" y="192">  IP       = $ips['DC01']</text>
    <text x="594" y="208">  Online   = $true</text>
    <text x="594" y="224">}</text>
  </g>
  <text x="594" y="254" font-size="11.5" fill="var(--muted, #5b6675)">Una lista de estos se filtra, ordena</text>
  <text x="594" y="270" font-size="11.5" fill="var(--muted, #5b6675)">y exporta como cualquier objeto</text>
</svg>
