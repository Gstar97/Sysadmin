- { id: t1, frente: "Comillas simples y dobles", dorso: "Simples: literal. Dobles: reemplazan $variables; para propiedades o cuentas, $( ): \"Estado: $($s.Status)\"." }
- { id: t2, frente: "Operador -f", dorso: "'{0} tiene {1:N1} GB ({2:P0})' -f 'C:', 12.3, 0.21. Arma textos con formato." }
- { id: t3, frente: "Array", dorso: "@('a','b'); [0] el primero, [-1] el último, .Count, += agrega. @(comando) asegura que sea lista." }
- { id: t4, frente: "Tabla hash", dorso: "@{ clave = 'valor' }; $h['clave'] o $h.clave; .ContainsKey(); .Keys. [ordered]@{} mantiene el orden." }
- { id: t5, frente: "[PSCustomObject]", dorso: "[PSCustomObject]@{ Servidor = $s; IP = $ip }: un objeto propio, una fila de informe que se exporta con Export-Csv." }
- { id: t6, frente: "-like y -match", dorso: "-like: comodines * y ?. -match: expresión regular, guarda lo encontrado en $Matches. No distinguen mayúsculas." }
- { id: t7, frente: "-contains e -in", dorso: "$lista -contains 'x' y 'x' -in $lista preguntan lo mismo. Con una lista a la izquierda, los operadores filtran." }
- { id: t8, frente: "Fechas", dorso: "[datetime]'2026-11-01'; (Get-Date).AddDays(-30); fecha - fecha = TimeSpan con Days, TotalHours." }
