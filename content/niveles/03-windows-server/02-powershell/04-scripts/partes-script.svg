<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Las partes de un script de PowerShell</text>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="14" y="38" width="520" height="52" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="14" y="98" width="520" height="62" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="14" y="168" width="520" height="40" rx="8" fill="var(--surface, #fff)"/>
    <rect x="14" y="216" width="520" height="56" rx="8" fill="var(--surface, #fff)"/>
    <rect x="14" y="280" width="520" height="40" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="560" y="38" width="288" height="282" rx="10" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor">
    <text x="26" y="58" font-weight="700">1. Ayuda</text><text x="130" y="58" font-family="ui-monospace, monospace" font-size="11.5">&lt;# .SYNOPSIS … .EXAMPLE … #&gt;</text>
    <text x="26" y="78" font-size="11.5" fill="var(--muted, #5b6675)">Get-Help .\script.ps1 la muestra como la de un cmdlet</text>
    <text x="26" y="118" font-weight="700">2. Parámetros</text><text x="130" y="118" font-family="ui-monospace, monospace" font-size="11.5">param( [Parameter(Mandatory)][string]$Ruta,</text>
    <text x="130" y="134" font-family="ui-monospace, monospace" font-size="11.5">       [int]$Dias = 30, [switch]$Simular )</text>
    <text x="26" y="152" font-size="11.5" fill="var(--muted, #5b6675)">tipos, valores por defecto y validaciones ([ValidateSet()])</text>
    <text x="26" y="193" font-weight="700">3. Funciones</text><text x="130" y="193" font-family="ui-monospace, monospace" font-size="11.5">function Get-EspacioLibre { param(…) … }</text>
    <text x="26" y="236" font-weight="700">4. Cuerpo</text><text x="130" y="236" font-family="ui-monospace, monospace" font-size="11.5">foreach (…) { if (…) {…} switch (…) {…} }</text>
    <text x="130" y="256" font-family="ui-monospace, monospace" font-size="11.5">try { … -ErrorAction Stop } catch { … }</text>
    <text x="26" y="305" font-weight="700">5. Salida</text><text x="130" y="305" font-family="ui-monospace, monospace" font-size="11.5">[PSCustomObject]@{ Equipo = …; LibreGB = … }</text>
    <text x="574" y="62" font-weight="700">Cómo se ejecuta</text>
    <text x="574" y="88" font-family="ui-monospace, monospace" font-size="11.5">PS C:\Scripts&gt; .\Revisar.ps1 -Dias 60</text>
    <text x="574" y="112" font-size="11.5">• .\ adelante para la carpeta actual</text>
    <text x="574" y="132" font-size="11.5">• parámetros por nombre, con Tab</text>
    <text x="574" y="152" font-size="11.5">• la directiva de ejecución tiene que</text>
    <text x="574" y="168" font-size="11.5">   permitir scripts (RemoteSigned)</text>
    <text x="574" y="200" font-weight="700">Lo que devuelve</text>
    <text x="574" y="224" font-size="11.5">Todo lo que no se guarda en una</text>
    <text x="574" y="240" font-size="11.5">variable sale como resultado:</text>
    <text x="574" y="264" font-family="ui-monospace, monospace" font-size="11.5">.\Revisar.ps1 | Export-Csv …</text>
    <text x="574" y="296" font-size="11.5" fill="var(--warn, #a16207)">Write-Host solo muestra:</text>
    <text x="574" y="312" font-size="11.5" fill="var(--warn, #a16207)">no se puede exportar</text>
  </g>
</svg>
