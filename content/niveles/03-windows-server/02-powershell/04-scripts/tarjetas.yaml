- { id: t1, frente: "Ejecutar un script", dorso: ".\\script.ps1 -Parametro valor desde su carpeta. Get-Help .\\script.ps1 muestra su ayuda." }
- { id: t2, frente: "Bloque param()", dorso: "[Parameter(Mandatory)][string]$Ruta, [int]$Dias = 30, [ValidateSet('A','B')][string]$Area, [switch]$Simular." }
- { id: t3, frente: "Qué devuelve un script", dorso: "Todo lo que no se guarda en una variable. Write-Host solo muestra; $null = … o | Out-Null descarta." }
- { id: t4, frente: "try/catch", dorso: "Solo atrapa errores que cortan. -ErrorAction Stop en el comando; en el catch, $_.Exception.Message. finally siempre corre." }
- { id: t5, frente: "Directivas de ejecución", dorso: "Restricted, RemoteSigned (Windows Server), AllSigned, Unrestricted, Bypass. Ámbitos: MachinePolicy, UserPolicy, Process, CurrentUser, LocalMachine." }
- { id: t6, frente: "¿La directiva de ejecución es seguridad?", dorso: "No: se saltea con -ExecutionPolicy Bypass. Evita ejecuciones accidentales; la seguridad está en los permisos y en leer el script." }
- { id: t7, frente: "Unblock-File", dorso: "Saca la marca de 'bajado de internet' de un archivo para que RemoteSigned lo deje correr. Solo después de leerlo." }
