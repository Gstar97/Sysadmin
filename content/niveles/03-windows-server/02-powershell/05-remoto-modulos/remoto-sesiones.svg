<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="rs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Tres formas de trabajar en otro equipo</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="14" y="40" width="130" height="250" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="404" y="40" width="130" height="250" rx="10" fill="var(--surface, #fff)"/>
    <rect x="560" y="40" width="288" height="250" rx="10" fill="var(--surface, #fff)"/>
  </g>
  <g fill="currentColor">
    <text x="79" y="64" text-anchor="middle" font-weight="700">SRV-ADMIN</text>
    <text x="469" y="64" text-anchor="middle" font-weight="700">SRV01</text>
    <text x="160" y="82" font-weight="700">-ComputerName</text>
    <text x="160" y="98" font-size="11.5">abre, ejecuta, devuelve y cierra</text>
    <text x="160" y="170" font-weight="700">New-PSSession</text>
    <text x="160" y="186" font-size="11.5">la sesión queda viva; las variables</text>
    <text x="160" y="202" font-size="11.5">se mantienen entre llamadas</text>
  </g>
  <g stroke="currentColor" stroke-width="1.6" marker-end="url(#rs-a)">
    <line x1="144" y1="112" x2="402" y2="112"/>
    <line x1="402" y1="128" x2="146" y2="128"/>
    <line x1="144" y1="222" x2="402" y2="222"/>
    <line x1="144" y1="246" x2="402" y2="246"/>
  </g>
  <g fill="currentColor" font-size="11">
    <text x="270" y="142" text-anchor="middle" fill="var(--muted, #5b6675)">resultados con PSComputerName</text>
    <text x="270" y="238" text-anchor="middle" fill="var(--muted, #5b6675)">Invoke-Command -Session $s</text>
    <text x="270" y="262" text-anchor="middle" fill="var(--muted, #5b6675)">… otra vez, con lo de antes</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 3">
    <rect x="418" y="98" width="102" height="40" rx="6" fill="none"/>
    <rect x="418" y="208" width="102" height="56" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor" font-size="11">
    <text x="469" y="116" text-anchor="middle">conexión</text><text x="469" y="130" text-anchor="middle">temporal</text>
    <text x="469" y="228" text-anchor="middle">sesión viva</text><text x="469" y="244" text-anchor="middle">$inicio = …</text><text x="469" y="258" text-anchor="middle">(se recuerda)</text>
  </g>
  <g fill="currentColor">
    <text x="574" y="64" font-weight="700">Enter-PSSession SRV01</text>
    <text x="574" y="86" font-size="11.5">una consola en el otro equipo, como SSH:</text>
  </g>
  <rect x="574" y="98" width="260" height="96" rx="6" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1"/>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="11.5">
    <text x="584" y="120">PS C:\&gt; Enter-PSSession SRV01</text>
    <text x="584" y="140">[SRV01]: PS C:\&gt; hostname</text>
    <text x="584" y="160">SRV01</text>
    <text x="584" y="180">[SRV01]: PS C:\&gt; exit</text>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="574" y="222">$using:variable lleva una variable</text>
    <text x="574" y="238">local al bloque remoto.</text>
    <text x="574" y="262">Remove-PSSession cierra las sesiones</text>
    <text x="574" y="278">que abriste.</text>
  </g>
</svg>
