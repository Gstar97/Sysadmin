tipo: emparejar
consigna: Uní cada situación con la forma de trabajo remoto que conviene.
pares:
  - { a: "Revisar el espacio en disco de 40 servidores una vez", b: "Invoke-Command -ComputerName con la lista" }
  - { a: "Varios pasos seguidos en SRV01 que dependen de lo que guardaste antes", b: "New-PSSession e Invoke-Command -Session" }
  - { a: "Investigar a mano un problema en un servidor, comando por comando", b: "Enter-PSSession" }
  - { a: "Correr en los servidores un script que tenés en tu equipo, sin copiarlo", b: "Invoke-Command -FilePath" }
  - { a: "Administrar con PowerShell un servidor Linux", b: "PowerShell 7 sobre SSH (-HostName)" }
explicacion: >-
  -ComputerName para algo puntual en muchos; una sesión para varios pasos que comparten datos;
  Enter-PSSession para trabajar a mano; -FilePath para llevar un script local; SSH cuando el otro
  lado no es un Windows del dominio.
