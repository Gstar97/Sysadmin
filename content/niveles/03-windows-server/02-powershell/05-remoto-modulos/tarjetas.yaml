- { id: t1, frente: "Invoke-Command en muchos equipos", dorso: "En paralelo (hasta 32 por defecto), con PSComputerName en cada resultado. -FilePath lleva un script local." }
- { id: t2, frente: "$using:", dorso: "Lleva una variable local al bloque remoto: { Get-Service $using:servicio }." }
- { id: t3, frente: "Sesiones", dorso: "New-PSSession (queda viva y recuerda variables), Invoke-Command -Session, Enter-PSSession (interactiva), Remove-PSSession." }
- { id: t4, frente: "Objetos deserializados", dorso: "Lo que vuelve de otro equipo trae las propiedades, pero no los métodos." }
- { id: t5, frente: "Segundo salto", dorso: "Desde una sesión remota, tus credenciales no pasan a un tercer equipo. Trabajá desde tu equipo contra cada uno." }
- { id: t6, frente: "PowerShell sobre SSH", dorso: "PowerShell 7: Enter-PSSession -HostName -UserName. Para Linux y equipos fuera del dominio." }
- { id: t7, frente: "PowerShell Gallery", dorso: "Find-Module, Install-Module -Scope CurrentUser, Update-Module, Save-Module. Revisar autor, uso y código; fijar la versión." }
