<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="to-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Bash pasa texto; PowerShell pasa objetos</text>
  <text x="14" y="52" font-weight="700" fill="currentColor">Bash</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="70" y="36" width="140" height="44" rx="8" fill="var(--surface, #fff)"/>
    <rect x="260" y="36" width="140" height="44" rx="8" fill="var(--surface, #fff)"/>
    <rect x="450" y="36" width="200" height="44" rx="8" fill="var(--surface, #fff)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" marker-end="url(#to-a)"><line x1="210" y1="58" x2="258" y2="58"/><line x1="400" y1="58" x2="448" y2="58"/></g>
  <g font-family="ui-monospace, monospace" font-size="12" fill="currentColor">
    <text x="140" y="62" text-anchor="middle">ps aux</text><text x="330" y="62" text-anchor="middle">grep nginx</text><text x="550" y="62" text-anchor="middle">awk '{print $6}'</text>
  </g>
  <text x="234" y="94" text-anchor="middle" font-size="11" fill="var(--muted, #5b6675)">texto</text>
  <text x="424" y="94" text-anchor="middle" font-size="11" fill="var(--muted, #5b6675)">texto</text>
  <text x="670" y="52" font-size="11.5" fill="var(--warn, #a16207)">¿la columna 6 era</text>
  <text x="670" y="68" font-size="11.5" fill="var(--warn, #a16207)">la memoria?</text>

  <text x="14" y="148" font-weight="700" fill="currentColor">PowerShell</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="14" y="160" width="120" height="44" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="166" y="160" width="150" height="44" rx="8" fill="var(--surface, #fff)"/>
    <rect x="348" y="160" width="140" height="44" rx="8" fill="var(--surface, #fff)"/>
    <rect x="520" y="160" width="150" height="44" rx="8" fill="var(--surface, #fff)"/>
    <rect x="702" y="146" width="146" height="34" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="702" y="186" width="146" height="34" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" marker-end="url(#to-a)"><line x1="134" y1="182" x2="164" y2="182"/><line x1="316" y1="182" x2="346" y2="182"/><line x1="488" y1="182" x2="518" y2="182"/><line x1="670" y1="176" x2="700" y2="164"/><line x1="670" y1="188" x2="700" y2="202"/></g>
  <g font-family="ui-monospace, monospace" font-size="11.5" fill="currentColor">
    <text x="74" y="186" text-anchor="middle">Get-Process</text>
    <text x="241" y="180" text-anchor="middle">Where-Object</text><text x="241" y="196" text-anchor="middle" font-size="10.5">WorkingSet -gt 50MB</text>
    <text x="418" y="180" text-anchor="middle">Sort-Object</text><text x="418" y="196" text-anchor="middle" font-size="10.5">WorkingSet -Desc</text>
    <text x="595" y="180" text-anchor="middle">Select-Object</text><text x="595" y="196" text-anchor="middle" font-size="10.5">Name, MB</text>
    <text x="775" y="168" text-anchor="middle">Format-Table</text>
    <text x="775" y="208" text-anchor="middle">Export-Csv</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="14" y="230" width="300" height="86" rx="8" fill="var(--surface, #fff)" stroke-dasharray="5 3"/>
  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="26" y="250" font-weight="700">Cada objeto que pasa (un proceso):</text>
    <text x="26" y="270" font-family="ui-monospace, monospace">Name       : MsMpEng</text>
    <text x="26" y="286" font-family="ui-monospace, monospace">Id         : 2236</text>
    <text x="26" y="302" font-family="ui-monospace, monospace">WorkingSet : 220200960   CPU : 141,7</text>
  </g>
  <g fill="currentColor" font-size="12.5">
    <text x="340" y="252" font-weight="700">Filtrá a la izquierda:</text>
    <text x="340" y="270">cuanto antes descartes, menos trabajo para los que siguen.</text>
    <text x="340" y="296" font-weight="700">Formateá a la derecha:</text>
    <text x="340" y="314">Format-* convierte los objetos en texto para la pantalla.</text>
  </g>
</svg>
