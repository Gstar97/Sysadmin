- { id: t1, frente: "Objetos en la tubería", dorso: "PowerShell pasa objetos (con propiedades y métodos), no texto. La tabla en pantalla es solo una vista." }
- { id: t2, frente: "Get-Member", dorso: "Muestra el tipo (TypeName), las propiedades y los métodos de los objetos. Select-Object * muestra todos los valores." }
- { id: t3, frente: "Where-Object", dorso: "Filtra: Where-Object Status -eq Running, o { $_.A -eq 1 -and $_.B -gt 2 }. $_ es el objeto actual." }
- { id: t4, frente: "Filtrá a la izquierda", dorso: "Si el cmdlet tiene -Filter (Get-ChildItem, Get-ADUser), usalo: filtra al traer los datos." }
- { id: t5, frente: "Propiedad calculada", dorso: "Select-Object Name, @{Name='MB'; Expression={ $_.WorkingSet / 1MB }}. 1KB, 1MB, 1GB son números." }
- { id: t6, frente: "Sort, Group, Measure", dorso: "Sort-Object X -Descending; Group-Object X (cuenta por valor); Measure-Object X -Sum -Average -Maximum." }
- { id: t7, frente: "Formateá a la derecha", dorso: "Format-Table/List solo al final y para la pantalla. Para exportar: Select-Object y Export-Csv, ConvertTo-Html, ConvertTo-Json." }
