<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">El orden en que se aplican las directivas (LSDOU)</text>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="10" y="44" width="150" height="120" rx="10" fill="var(--surface-2, #eef1f5)"/>
    <rect x="180" y="44" width="150" height="120" rx="10" fill="var(--surface-2, #eef1f5)"/>
    <rect x="350" y="44" width="150" height="120" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="520" y="44" width="150" height="120" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="690" y="44" width="160" height="120" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="85" y="66" text-anchor="middle" font-weight="700">1. Local</text>
    <text x="85" y="90" text-anchor="middle" font-size="12">La directiva propia</text>
    <text x="85" y="106" text-anchor="middle" font-size="12">de cada equipo</text>
    <text x="85" y="140" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">gpedit.msc</text>
    <text x="255" y="66" text-anchor="middle" font-weight="700">2. Sitio</text>
    <text x="255" y="90" text-anchor="middle" font-size="12">Vinculadas al sitio</text>
    <text x="255" y="106" text-anchor="middle" font-size="12">de AD (la sede)</text>
    <text x="255" y="140" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">poco usadas</text>
    <text x="425" y="66" text-anchor="middle" font-weight="700">3. Dominio</text>
    <text x="425" y="90" text-anchor="middle" font-size="12">Default Domain Policy</text>
    <text x="425" y="106" text-anchor="middle" font-size="12">y otras del dominio</text>
    <text x="425" y="140" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">empresa.local</text>
    <text x="595" y="66" text-anchor="middle" font-weight="700">4. OU de arriba</text>
    <text x="595" y="90" text-anchor="middle" font-size="12">De la más general</text>
    <text x="595" y="106" text-anchor="middle" font-size="12">a la más cercana</text>
    <text x="595" y="140" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">Empresa, Usuarios…</text>
    <text x="770" y="66" text-anchor="middle" font-weight="700">5. OU del objeto</text>
    <text x="770" y="90" text-anchor="middle" font-size="12">Se procesa última:</text>
    <text x="770" y="106" text-anchor="middle" font-size="12" font-weight="700">si choca, gana</text>
    <text x="770" y="140" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">Ventas</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#fl)">
    <line x1="160" y1="104" x2="178" y2="104"/>
    <line x1="330" y1="104" x2="348" y2="104"/>
    <line x1="500" y1="104" x2="518" y2="104"/>
    <line x1="670" y1="104" x2="688" y2="104"/>
  </g>
  <line x1="20" y1="186" x2="830" y2="186" stroke="currentColor" stroke-width="2" marker-end="url(#fl)"/>
  <text x="20" y="206" fill="var(--muted, #5b6675)" font-size="12">se aplica primero</text>
  <text x="840" y="206" text-anchor="end" fill="var(--muted, #5b6675)" font-size="12">se aplica última y gana los empates</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="222" width="270" height="98" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="295" y="222" width="270" height="98" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="580" y="222" width="270" height="98" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g fill="currentColor">
    <text x="24" y="244" font-weight="700">Bloquear herencia (en una OU)</text>
    <text x="24" y="266" font-size="12">Corta lo que viene de arriba: la OU</text>
    <text x="24" y="282" font-size="12">recibe solo lo vinculado a ella y</text>
    <text x="24" y="298" font-size="12">a las OU de adentro.</text>
    <text x="309" y="244" font-weight="700">Exigido (en un vínculo)</text>
    <text x="309" y="266" font-size="12">Atraviesa el bloqueo y le gana a</text>
    <text x="309" y="282" font-size="12">todo lo de abajo. Entre dos exigidas,</text>
    <text x="309" y="298" font-size="12">gana la de más arriba.</text>
    <text x="594" y="244" font-weight="700">Filtros (en la GPO)</text>
    <text x="594" y="266" font-size="12">Seguridad: a qué grupos se aplica.</text>
    <text x="594" y="282" font-size="12">WMI: una condición que el equipo</text>
    <text x="594" y="298" font-size="12">evalúa (versión, tipo de equipo).</text>
  </g>
</svg>
