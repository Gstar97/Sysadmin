tipo: ordenar
consigna: >-
  María está en la OU Ventas, dentro de Usuarios, dentro de Empresa. Ordená las directivas que la
  afectan desde la que se procesa primero hasta la que se procesa última (la que gana los choques).
  Ninguna está exigida.
pasos:
  - "La directiva local de su PC"
  - "Una GPO vinculada al sitio de Rosario"
  - "Default Domain Policy, vinculada al dominio"
  - "Empresa - Escritorio, vinculada a la OU Empresa"
  - "Usuarios - Unidades, vinculada a la OU Usuarios"
  - "Ventas - Protector, vinculada a la OU Ventas"
explicacion: >-
  Local, sitio, dominio y después las OU de la más general a la más cercana. La última que se
  procesa (Ventas) pisa a las anteriores en lo que chocan. Si Empresa - Escritorio estuviera
  exigida, ganaría ella aunque se procese antes.
