- { id: t1, frente: "GPO", dorso: "Paquete de configuraciones de equipo (al arrancar) y de usuario (al iniciar sesión). Vive en AD y en SYSVOL; se aplica cuando se vincula." }
- { id: t2, frente: "LSDOU", dorso: "Local, Sitio, Dominio, OU (de la general a la cercana). La última procesada gana los choques; lo que no choca se suma." }
- { id: t3, frente: "Orden de vínculo", dorso: "Entre GPO vinculadas a la misma OU, la número 1 tiene la mayor precedencia. Set-GPLink -Order." }
- { id: t4, frente: "Bloquear herencia", dorso: "Se marca en la OU: corta las GPO de arriba. Set-GPInheritance -IsBlocked Yes." }
- { id: t5, frente: "Exigido (Enforced)", dorso: "Se marca en el vínculo: atraviesa el bloqueo y gana a lo de abajo. Entre exigidas, gana la de más arriba. Solo para lo que no se negocia." }
- { id: t6, frente: "Filtrado de seguridad", dorso: "GpoApply al grupo; a Authenticated Users dejale GpoRead (los equipos tienen que poder leer, MS16-072)." }
- { id: t7, frente: "Filtro WMI", dorso: "Condición que evalúa el equipo (versión, tipo, memoria). Suma tiempo al procesamiento." }
- { id: t8, frente: "Cuándo se aplican", dorso: "Equipo al arrancar, usuario al iniciar sesión, y en segundo plano cada 90 min (+0 a 30); DC cada 5 min. gpupdate /force." }
- { id: t9, frente: "Default Domain Policy", dorso: "Vinculada al dominio; solo contraseñas y bloqueo de cuentas. Lo demás, en GPO nuevas." }
