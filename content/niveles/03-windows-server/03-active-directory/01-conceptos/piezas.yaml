tipo: emparejar
consigna: Uní cada pieza de Active Directory con lo que es.
pares:
  - { a: "Bosque", b: "El límite de seguridad: uno o más dominios que confían entre sí y comparten el esquema" }
  - { a: "Dominio", b: "Usuarios, grupos y equipos que comparten una base y unas reglas, con un nombre DNS" }
  - { a: "Unidad organizativa", b: "Una carpeta dentro del dominio para ordenar objetos, aplicarles directivas y delegar" }
  - { a: "Controlador de dominio", b: "Un servidor con una copia de la base de AD que atiende los inicios de sesión" }
  - { a: "Catálogo global", b: "Un controlador que además guarda un resumen de todo el bosque" }
  - { a: "Esquema", b: "La definición de qué tipos de objetos y atributos pueden existir" }
explicacion: >-
  Del más grande al más chico: bosque, dominio, unidad organizativa, objeto. Los controladores de
  dominio guardan la base, y algunos (en un dominio único, todos) son además catálogo global.
