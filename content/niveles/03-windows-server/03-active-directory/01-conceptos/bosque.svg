<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12.5">
  <rect x="10" y="34" width="840" height="358" rx="14" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1.6"/>
  <text x="26" y="56" font-weight="700" font-size="14" fill="currentColor">Bosque empresa.local</text>
  <text x="834" y="56" text-anchor="end" font-size="11.5" fill="var(--muted, #5b6675)">el límite de seguridad: todo lo de adentro confía entre sí</text>
  <rect x="24" y="70" width="540" height="250" rx="12" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.5"/>
  <text x="38" y="90" font-weight="700" fill="currentColor">Dominio empresa.local (raíz del bosque)</text>
  <rect x="40" y="106" width="250" height="200" rx="8" fill="var(--surface, #fff)" stroke="currentColor" stroke-width="1.2"/>
  <g fill="currentColor" font-size="12">
    <text x="52" y="126" font-weight="700">Unidades organizativas</text>
    <text x="56" y="150">📁 Empresa</text>
    <text x="76" y="172">📁 Ventas  👤 mlopez  👥 GG-Ventas</text>
    <text x="76" y="194">📁 IT  👤 admin.it</text>
    <text x="76" y="216">📁 Equipos  💻 PC01, PC02</text>
    <text x="76" y="238">📁 Servidores  💻 SRV-ARCH01</text>
    <text x="56" y="262">📁 Domain Controllers</text>
    <text x="56" y="284" fill="var(--muted, #5b6675)">CN=Users y CN=Computers</text>
  </g>
  <rect x="306" y="106" width="244" height="200" rx="8" fill="var(--surface, #fff)" stroke="currentColor" stroke-width="1.2"/>
  <g fill="currentColor" font-size="12">
    <text x="318" y="126" font-weight="700">Controladores de dominio</text>
    <rect x="320" y="138" width="100" height="60" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
    <rect x="436" y="138" width="100" height="60" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
    <text x="370" y="162" text-anchor="middle" font-weight="700">DC01</text><text x="370" y="180" text-anchor="middle" font-size="11">DNS · GC ★</text>
    <text x="486" y="162" text-anchor="middle" font-weight="700">DC02</text><text x="486" y="180" text-anchor="middle" font-size="11">DNS · GC ★</text>
    <path d="M420 168 L436 168" stroke="currentColor" stroke-width="1.6"/>
    <text x="428" y="214" text-anchor="middle" font-size="11">↔ replicación</text>
    <text x="318" y="242" font-size="11.5">Cada DC tiene una copia completa</text>
    <text x="318" y="258" font-size="11.5">del dominio y se puede escribir en</text>
    <text x="318" y="274" font-size="11.5">cualquiera (multimaestro).</text>
    <text x="318" y="294" font-size="11.5">★ catálogo global</text>
  </g>
  <rect x="592" y="70" width="244" height="250" rx="12" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1.5"/>
  <text x="604" y="90" font-weight="700" fill="currentColor">Dominio hijo</text>
  <text x="604" y="108" font-size="12" fill="currentColor">cordoba.empresa.local</text>
  <rect x="604" y="124" width="100" height="56" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor"/>
  <text x="654" y="148" text-anchor="middle" font-weight="700" fill="currentColor">DC-CBA01</text><text x="654" y="166" text-anchor="middle" font-size="11" fill="currentColor">DNS · GC ★</text>
  <text x="604" y="206" font-size="11.5" fill="currentColor">Sus propios usuarios y su</text>
  <text x="604" y="222" font-size="11.5" fill="currentColor">administración; mismo esquema</text>
  <text x="604" y="238" font-size="11.5" fill="currentColor">y misma configuración del bosque.</text>
  <text x="604" y="266" font-size="11.5" fill="var(--muted, #5b6675)">En una PyME casi nunca hace falta:</text>
  <text x="604" y="282" font-size="11.5" fill="var(--muted, #5b6675)">un solo dominio alcanza.</text>
  <g stroke="currentColor" stroke-width="1.6"><line x1="566" y1="150" x2="590" y2="150"/><path d="M584 145 L590 150 L584 155 M572 145 L566 150 L572 155" fill="none"/></g>
  <text x="578" y="126" text-anchor="middle" font-size="10" fill="currentColor">confía</text>
  <rect x="24" y="330" width="812" height="50" rx="10" fill="var(--surface, #fff)" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="38" y="352" font-weight="700" fill="currentColor">Esquema y configuración</text>
  <text x="38" y="370" font-size="11.5" fill="currentColor">Compartidos por todos los dominios del bosque: qué tipos de objetos existen (esquema), los sitios y la topología de replicación (configuración).</text>
</svg>
