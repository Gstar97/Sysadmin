- { id: t1, frente: "Active Directory (AD DS)", dorso: "Base central de identidades (usuarios, grupos, equipos) de una red Windows. Los equipos del dominio le preguntan quién es quién." }
- { id: t2, frente: "Bosque, dominio y OU", dorso: "Bosque: límite de seguridad. Dominio: objetos con una base y reglas comunes. OU: carpeta para ordenar, aplicar GPO y delegar." }
- { id: t3, frente: "Controlador de dominio", dorso: "Servidor con la base de AD; todos son iguales y se replican (multimaestro). Siempre al menos dos." }
- { id: t4, frente: "Nombre distinguido (DN)", dorso: "CN=María López,OU=Ventas,OU=Empresa,DC=empresa,DC=local: de lo particular a lo general." }
- { id: t5, frente: "Formatos de inicio de sesión", dorso: "EMPRESA\\mlopez (NetBIOS + sAMAccountName) o mlopez@empresa.local (UPN)." }
- { id: t6, frente: "Kerberos", dorso: "Tickets para no repetir la contraseña. Depende del DNS del dominio (registros SRV) y de relojes con menos de 5 minutos de diferencia." }
- { id: t7, frente: "Registro SRV de los DC", dorso: "_ldap._tcp.dc._msdcs.empresa.local: así los equipos encuentran a los controladores. Solo lo tiene el DNS del dominio." }
- { id: t8, frente: "AD y Entra ID", dorso: "AD: en tus servidores, Kerberos, LDAP, OU, GPO. Entra ID: identidad en la nube (Microsoft 365). Se sincronizan con Entra Connect." }
