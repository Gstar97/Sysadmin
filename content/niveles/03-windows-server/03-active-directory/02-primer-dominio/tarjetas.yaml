- { id: t1, frente: "Nombre del dominio", dorso: "Mejor un subdominio de un dominio propio (ad.empresa.com.ar). Nunca de una sola palabra. .local choca con mDNS. NetBIOS: hasta 15 caracteres." }
- { id: t2, frente: "Nivel funcional", dorso: "El más alto que permitan todos los DC. Windows Server 2025 = nivel 10; un bosque nuevo con 2025 acepta mínimo 2016. Se sube, no se baja." }
- { id: t3, frente: "Promover el primer DC", dorso: "Install-WindowsFeature AD-Domain-Services -IncludeManagementTools; Install-ADDSForest -DomainName … -InstallDns -SafeModeAdministratorPassword $dsrm." }
- { id: t4, frente: "DSRM", dorso: "Contraseña del modo de restauración de servicios de directorio: cuenta local del DC para arrancar sin AD y restaurar. Guardala aparte." }
- { id: t5, frente: "Después de promover", dorso: "Get-ADDomain, servicios NTDS/DNS/Kdc/Netlogon/ADWS, Resolve-DnsName -Type SRV _ldap._tcp.dc._msdcs…, dcdiag y reenviadores DNS." }
- { id: t6, frente: "Zona integrada en AD", dorso: "La zona DNS del dominio se guarda en la base de AD y se replica sola a todos los DC con DNS." }
