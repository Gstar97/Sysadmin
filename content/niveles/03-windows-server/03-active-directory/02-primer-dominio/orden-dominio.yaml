tipo: ordenar
consigna: Ordená los pasos para crear el primer dominio de una empresa.
pasos:
  - "Elegir el nombre del dominio, el NetBIOS y el nivel funcional"
  - "Dejar el servidor con IP fija, nombre definitivo, DNS hacia sí mismo y actualizado"
  - "Instalar el rol AD-Domain-Services con sus herramientas"
  - "Promover con Install-ADDSForest, con -InstallDns y la contraseña DSRM"
  - "Esperar el reinicio e iniciar sesión como administrador del dominio"
  - "Comprobar con Get-ADDomain, el registro SRV y dcdiag"
  - "Configurar los reenviadores del DNS para los nombres de internet"
explicacion: >-
  Las decisiones van primero porque después cuestan mucho de cambiar. El rol se instala antes de
  promover, y la promoción reinicia sola. Las comprobaciones van antes de unir equipos, y los
  reenviadores, cuando el DNS ya existe.
