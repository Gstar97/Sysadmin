- { id: t1, frente: "Crear un usuario", dorso: "New-ADUser -Name … -SamAccountName … -UserPrincipalName …@empresa.local -Path 'OU=…' -AccountPassword $clave (SecureString) -ChangePasswordAtLogon $true -Enabled $true." }
- { id: t2, frente: "Alta masiva", dorso: "Import-Csv archivo.csv | ForEach-Object { $datos = @{ … }; New-ADUser @datos } (splatting)." }
- { id: t3, frente: "Bajas", dorso: "Disable-ADAccount, mover a una OU de bajas, sacar los grupos; borrar después de un plazo." }
- { id: t4, frente: "Ámbitos de grupo", dorso: "Global: personas por función. Local de dominio: permisos sobre un recurso. Universal: varios dominios del bosque." }
- { id: t5, frente: "AGDLP", dorso: "Cuentas → grupo Global (quiénes) → grupo local de Dominio (qué pueden) → Permiso solo al local. Nombres GG- y DL-." }
- { id: t6, frente: "Cuenta de equipo", dorso: "PC01$, con contraseña que cambia sola. Add-Computer -OUPath; New-ADComputer para crearla antes; Test-ComputerSecureChannel -Repair." }
- { id: t7, frente: "gMSA", dorso: "Add-KdsRootKey (una vez, 10 h), New-ADServiceAccount -PrincipalsAllowedToRetrieveManagedPassword, Install-ADServiceAccount, Test-ADServiceAccount." }
