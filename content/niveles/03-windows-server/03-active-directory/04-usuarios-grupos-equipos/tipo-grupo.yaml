tipo: emparejar
consigna: Uní cada necesidad con el grupo que corresponde, siguiendo AGDLP.
pares:
  - { a: "Juntar a todas las personas de Compras", b: "Un grupo global de seguridad (GG-Compras)" }
  - { a: "Dar permiso de modificar la carpeta \\\\SRV-ARCH01\\Compras", b: "Un grupo local de dominio de seguridad (DL-Compras-Modificar)" }
  - { a: "Mandar un correo a todo el equipo comercial, sin dar permisos", b: "Un grupo de distribución" }
  - { a: "Juntar personas de dos dominios del mismo bosque para un recurso común", b: "Un grupo universal" }
  - { a: "Que Compras pueda leer la carpeta de Ventas", b: "Sumar GG-Compras a DL-Ventas-Lectura" }
explicacion: >-
  Global para personas (quiénes), local de dominio para permisos (qué pueden), el global dentro
  del local. Distribución solo para correo, y universal cuando hay varios dominios.
