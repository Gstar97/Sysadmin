<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Los cinco roles FSMO: qué hace cada uno y qué pasa si su DC se cae</text>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="10" y="40" width="300" height="310" rx="12" fill="var(--surface-2, #eef1f5)"/>
    <rect x="325" y="40" width="525" height="310" rx="12" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="currentColor">
    <text x="24" y="62" font-weight="700">Uno por bosque</text>
    <text x="339" y="62" font-weight="700">Uno por dominio</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="22" y="74" width="276" height="122" rx="9" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="22" y="212" width="276" height="122" rx="9" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="337" y="74" width="501" height="98" rx="9" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="337" y="182" width="245" height="152" rx="9" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="593" y="182" width="245" height="152" rx="9" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="36" y="96" font-weight="700">Maestro de esquema</text>
    <text x="36" y="118" font-size="12">Aprueba los cambios al esquema</text>
    <text x="36" y="134" font-size="12">(al instalar Exchange, por ejemplo).</text>
    <text x="36" y="160" font-size="12" fill="var(--muted, #5b6675)">Si se cae: no se puede ampliar</text>
    <text x="36" y="176" font-size="12" fill="var(--muted, #5b6675)">el esquema. Casi nadie lo nota.</text>
    <text x="36" y="234" font-weight="700">Maestro de nombres de dominio</text>
    <text x="36" y="256" font-size="12">Aprueba agregar o quitar dominios</text>
    <text x="36" y="272" font-size="12">del bosque.</text>
    <text x="36" y="298" font-size="12" fill="var(--muted, #5b6675)">Si se cae: no se pueden crear</text>
    <text x="36" y="314" font-size="12" fill="var(--muted, #5b6675)">dominios. Casi nadie lo nota.</text>
    <text x="351" y="96" font-weight="700">Emulador de PDC: el que más se nota</text>
    <text x="351" y="118" font-size="12">Es el reloj de referencia del dominio, recibe enseguida los cambios de contraseña</text>
    <text x="351" y="134" font-size="12">y los bloqueos de cuenta, y es el DC que usa por defecto la consola de directivas.</text>
    <text x="351" y="158" font-size="12" fill="var(--muted, #5b6675)">Si se cae: la hora deriva y una contraseña recién cambiada puede fallar en otro DC.</text>
    <text x="351" y="204" font-weight="700">Maestro de RID</text>
    <text x="351" y="226" font-size="12">Reparte a cada DC bloques de</text>
    <text x="351" y="242" font-size="12">números (de a 500) para crear</text>
    <text x="351" y="258" font-size="12">objetos con un SID único.</text>
    <text x="351" y="284" font-size="12" fill="var(--muted, #5b6675)">Si se cae: se puede seguir</text>
    <text x="351" y="300" font-size="12" fill="var(--muted, #5b6675)">creando hasta que a un DC se</text>
    <text x="351" y="316" font-size="12" fill="var(--muted, #5b6675)">le acabe el bloque.</text>
    <text x="607" y="204" font-weight="700">Maestro de infraestructura</text>
    <text x="607" y="226" font-size="12">Actualiza referencias a objetos</text>
    <text x="607" y="242" font-size="12">de otros dominios del bosque.</text>
    <text x="607" y="284" font-size="12" fill="var(--muted, #5b6675)">Con un solo dominio (o todos</text>
    <text x="607" y="300" font-size="12" fill="var(--muted, #5b6675)">los DC con catálogo global),</text>
    <text x="607" y="316" font-size="12" fill="var(--muted, #5b6675)">no tiene trabajo.</text>
  </g>
</svg>
