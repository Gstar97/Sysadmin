- { id: t1, frente: "Segundo DC", dorso: "Install-ADDSDomainController -DomainName … -InstallDns -Credential …. DNS apuntando a un DC existente; después, sumarlo como DNS en el DHCP." }
- { id: t2, frente: "repadmin", dorso: "/replsummary: fails/total en 0 y largest delta en minutos. /showrepl: detalle. /syncall /AdeP: forzar." }
- { id: t3, frente: "Error 1722", dorso: "The RPC server is unavailable: el otro DC está apagado, con NTDS caído o bloqueado por un firewall." }
- { id: t4, frente: "Roles FSMO", dorso: "Por bosque: esquema y nombres de dominio. Por dominio: emulador de PDC, RID e infraestructura. netdom query fsmo." }
- { id: t5, frente: "Transferir frente a tomar", dorso: "Transferir: los dos DC vivos. Tomar (-Force): el dueño murió; ese DC no vuelve nunca a la red." }
- { id: t6, frente: "Emulador de PDC y la hora", dorso: "Es el reloj del dominio: w32tm /config /manualpeerlist:\"…\" /syncfromflags:manual /reliable:yes /update." }
- { id: t7, frente: "Papelera de AD", dorso: "Enable-ADOptionalFeature 'Recycle Bin Feature'. Una vez, irreversible, sin contras. Restore-ADObject devuelve el objeto entero por 180 días." }
- { id: t8, frente: "Respaldo de un DC", dorso: "wbadmin start systemstatebackup -backupTarget:E: -quiet. Diario, con copia afuera. Más de 180 días no sirve." }
- { id: t9, frente: "Revisión semanal", dorso: "dcdiag /q, repadmin /replsummary, w32tm /query /source, wbadmin get versions y el Visor de eventos." }
