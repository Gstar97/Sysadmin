tipo: emparejar
consigna: Uní cada pregunta con el comando que la responde.
pares:
  - { a: "¿Quiénes no iniciaron sesión en tres meses?", b: "Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00 -UsersOnly" }
  - { a: "¿Quiénes son administradores del dominio?", b: "Get-ADGroupMember 'Domain Admins' -Recursive" }
  - { a: "¿Qué servidores tiene el dominio?", b: "Get-ADComputer -Filter \"OperatingSystem -like '*Server*'\"" }
  - { a: "¿Qué cuentas están bloqueadas por intentos fallidos?", b: "Search-ADAccount -LockedOut" }
  - { a: "¿En qué grupos está mlopez?", b: "Get-ADPrincipalGroupMembership mlopez" }
  - { a: "¿Cuál es el puesto y el último inicio de sesión de mlopez?", b: "Get-ADUser mlopez -Properties Title, LastLogonDate" }
explicacion: >-
  Search-ADAccount resuelve las búsquedas de mantenimiento; Get-ADGroupMember -Recursive, quiénes
  terminan en un grupo; Get-ADPrincipalGroupMembership, al revés: en qué grupos está alguien.
