<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Las tres preguntas de una consulta a Active Directory</text>
  <rect x="10" y="38" width="840" height="56" rx="10" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1.2"/>
  <g font-family="ui-monospace, monospace" font-size="12.5" fill="currentColor">
    <text x="22" y="60">Get-ADUser <tspan fill="var(--info, #1d4ed8)" font-weight="700">-Filter</tspan> "Department -eq 'Ventas' -and Enabled -eq $true"</text>
    <text x="22" y="82">           <tspan fill="var(--ok, #15803d)" font-weight="700">-SearchBase</tspan> "OU=Usuarios,OU=Empresa,DC=empresa,DC=local" <tspan fill="var(--warn, #a16207)" font-weight="700">-Properties</tspan> Department, LastLogonDate</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="10" y="112" width="270" height="176" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="295" y="112" width="270" height="176" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="580" y="112" width="270" height="176" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g fill="currentColor">
    <text x="24" y="136" font-weight="700">¿A quiénes? -Filter</text>
    <text x="24" y="160" font-size="12">La condición la resuelve el</text>
    <text x="24" y="176" font-size="12">controlador: viajan solo los</text>
    <text x="24" y="192" font-size="12">resultados.</text>
    <text x="24" y="218" font-size="12">-Identity mlopez trae uno solo</text>
    <text x="24" y="234" font-size="12">(por nombre, DN, GUID o SID).</text>
    <text x="24" y="264" font-size="11.5" fill="var(--muted, #5b6675)">Evitá: -Filter * | Where-Object …</text>
    <text x="309" y="136" font-weight="700">¿Dónde? -SearchBase</text>
    <text x="309" y="160" font-size="12">Una OU y todo lo que tiene</text>
    <text x="309" y="176" font-size="12">adentro.</text>
    <text x="309" y="202" font-size="12">-SearchScope OneLevel: solo ese</text>
    <text x="309" y="218" font-size="12">nivel, sin las OU de adentro.</text>
    <text x="594" y="136" font-weight="700">¿Qué datos? -Properties</text>
    <text x="594" y="160" font-size="12">Por defecto vienen unas diez</text>
    <text x="594" y="176" font-size="12">(nombre, SamAccountName, DN,</text>
    <text x="594" y="192" font-size="12">Enabled…). Department, Title o</text>
    <text x="594" y="208" font-size="12">LastLogonDate hay que pedirlas.</text>
    <text x="594" y="234" font-size="12">-Properties * trae todas: para</text>
    <text x="594" y="250" font-size="12">explorar, no para miles.</text>
  </g>
</svg>
