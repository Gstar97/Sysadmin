- { id: t1, frente: "Las tres preguntas de un Get-AD*", dorso: "A quiénes (-Identity o -Filter), dónde (-SearchBase, -SearchScope) y qué datos (-Properties)." }
- { id: t2, frente: "-Filter frente a Where-Object", dorso: "-Filter lo resuelve el controlador y viajan solo los resultados; Where-Object trae todo y filtra en tu equipo." }
- { id: t3, frente: "-Properties", dorso: "Por defecto vienen unas diez propiedades. Department, Title, LastLogonDate y el resto se piden; -Properties * trae todas." }
- { id: t4, frente: "Cambios en masa", dorso: "Get-ADUser … | Set-ADUser -Department X -WhatIf; después sin -WhatIf. Atributos sin parámetro: -Replace @{ atributo = valor }." }
- { id: t5, frente: "Search-ADAccount", dorso: "-AccountInactive -TimeSpan 90.00:00:00, -AccountDisabled, -LockedOut, -PasswordNeverExpires, -AccountExpired. -UsersOnly para dejar afuera los equipos." }
- { id: t6, frente: "LastLogonDate", dorso: "Sale de lastLogonTimestamp: se replica pero se actualiza con un margen de unos 14 días. Para el dato exacto, lastLogon en cada DC." }
- { id: t7, frente: "Informe de administradores", dorso: "Get-ADGroupMember 'Domain Admins' -Recursive: pocos, con nombre y apellido, con cuentas separadas de las de uso diario." }
- { id: t8, frente: "Aprender el cmdlet de una acción", dorso: "Centro de administración de AD (dsac.exe), panel Historial de Windows PowerShell." }
