<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fl2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">“La directiva no se aplica”: qué revisar, en orden</text>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="10" y="40" width="270" height="92" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="295" y="40" width="270" height="92" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="580" y="40" width="270" height="92" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="10" y="158" width="270" height="92" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="295" y="158" width="270" height="92" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="580" y="158" width="270" height="92" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#fl2)">
    <line x1="280" y1="86" x2="293" y2="86"/>
    <line x1="565" y1="86" x2="578" y2="86"/>
    <path d="M715,132 L715,145 L145,145 L145,156" fill="none"/>
    <line x1="280" y1="204" x2="293" y2="204"/>
    <line x1="565" y1="204" x2="578" y2="204"/>
  </g>
  <g fill="currentColor">
    <text x="24" y="62" font-weight="700">1. ¿Dónde está el objeto?</text>
    <text x="24" y="84" font-size="12">Usuario: su OU. Equipo: la OU del</text>
    <text x="24" y="100" font-size="12">equipo. ¿Users o Computers? No</text>
    <text x="24" y="116" font-size="12">reciben directivas.</text>
    <text x="309" y="62" font-weight="700">2. ¿Está vinculada y activa?</text>
    <text x="309" y="84" font-size="12">Vínculo habilitado, GPO con la mitad</text>
    <text x="309" y="100" font-size="12">correcta habilitada (GpoStatus).</text>
    <text x="309" y="116" font-size="12">Get-GPInheritance en esa OU.</text>
    <text x="594" y="62" font-weight="700">3. ¿Le gana otra o la cortan?</text>
    <text x="594" y="84" font-size="12">Herencia bloqueada, una exigida</text>
    <text x="594" y="100" font-size="12">más arriba, otra con mejor orden</text>
    <text x="594" y="116" font-size="12">que configura lo mismo.</text>
    <text x="24" y="180" font-weight="700">4. ¿Los filtros la dejan afuera?</text>
    <text x="24" y="202" font-size="12">Denied (Security): ¿está en el grupo?</text>
    <text x="24" y="218" font-size="12">¿Inició sesión antes de que lo</text>
    <text x="24" y="234" font-size="12">agregaran? Denied (WMI Filter).</text>
    <text x="309" y="180" font-weight="700">5. ¿Ya la pidió?</text>
    <text x="309" y="202" font-size="12">gpupdate /force. Algunas solo al</text>
    <text x="309" y="218" font-size="12">reiniciar o al iniciar sesión</text>
    <text x="309" y="234" font-size="12">(software, carpetas redirigidas).</text>
    <text x="594" y="180" font-weight="700">6. ¿Llega al DC y a SYSVOL?</text>
    <text x="594" y="202" font-size="12">DNS del dominio, hora, red. Eventos</text>
    <text x="594" y="218" font-size="12">1058 y 1030 en el registro de</text>
    <text x="594" y="234" font-size="12">GroupPolicy de la PC.</text>
  </g>
  <rect x="10" y="276" width="840" height="94" rx="10" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1.2"/>
  <g fill="currentColor">
    <text x="24" y="298" font-weight="700">Las herramientas</text>
    <text x="24" y="320" font-size="12">gpresult /r (lo que llegó y lo filtrado, con el motivo) · gpresult /h informe.html (todo, con la GPO ganadora de cada valor)</text>
    <text x="24" y="338" font-size="12">Consola GPMC: Resultados de directivas de grupo (lo que pasó) y Modelado (lo que pasaría si…) · Get-GPResultantSetOfPolicy</text>
    <text x="24" y="356" font-size="12">Visor de eventos de la PC: Aplicaciones y servicios › Microsoft › Windows › GroupPolicy › Operational</text>
  </g>
</svg>
