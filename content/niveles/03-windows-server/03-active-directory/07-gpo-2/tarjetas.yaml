- { id: t1, frente: "Contraseñas del dominio", dorso: "Una sola directiva, la del dominio (Default Domain Policy). Set-ADDefaultDomainPasswordPolicy. Una GPO de contraseñas en una OU no afecta cuentas del dominio." }
- { id: t2, frente: "PSO", dorso: "Directiva de contraseñas específica para grupos o usuarios. New-ADFineGrainedPasswordPolicy, Add-ADFineGrainedPasswordPolicySubject, Get-ADUserResultantPasswordPolicy." }
- { id: t3, frente: "Directivas frente a preferencias", dorso: "Directivas: fijas y se retiran solas. Preferencias: valores iniciales que quedan, con segmentación por elemento." }
- { id: t4, frente: "Unidades de red", dorso: "Usuario › Preferencias › Configuración de Windows › Asignaciones de unidades. Acción Actualizar; segmentación por grupo." }
- { id: t5, frente: "Almacén central", dorso: "\\\\dominio\\SYSVOL\\dominio\\Policies\\PolicyDefinitions con las ADMX/ADML al día. Todos editan con las mismas plantillas." }
- { id: t6, frente: "gpresult", dorso: "/r: dónde está el objeto, aplicadas, filtradas con motivo, grupos. /scope computer (como administrador). /h informe.html: todo, con la ganadora." }
- { id: t7, frente: "Grupos nuevos y directivas", dorso: "Los grupos se leen al iniciar sesión (usuario) o al arrancar (equipo). Agregado recién: cerrar sesión o reiniciar." }
- { id: t8, frente: "Eventos de directivas", dorso: "GroupPolicy › Operational en la PC. 1058 (no pudo leer SYSVOL) y 1030 (falló el procesamiento): DNS, hora, red." }
- { id: t9, frente: "Resultados y Modelado", dorso: "En la consola GPMC. Resultados: lo que recibió (como gpresult, remoto). Modelado: lo que recibiría si…" }
