- { id: t1, frente: "¿Para qué sirve una OU?", dorso: "Para aplicar directivas de grupo y delegar tareas. No para copiar el organigrama." }
- { id: t2, frente: "Diseño de OU para una PyME", dorso: "OU raíz Empresa; adentro Usuarios, Equipos, Servidores, Grupos y Cuentas de servicio; Admin aparte. 3 o 4 niveles como máximo." }
- { id: t3, frente: "Users y Computers", dorso: "Contenedores, no OU: no admiten GPO. redircmp y redirusr mandan los objetos nuevos a una OU." }
- { id: t4, frente: "Protección contra el borrado", dorso: "Las OU nuevas vienen protegidas. Set-ADOrganizationalUnit … -ProtectedFromAccidentalDeletion $false antes de borrar a propósito." }
- { id: t5, frente: "Mover un objeto", dorso: "Get-ADUser mlopez | Move-ADObject -TargetPath 'OU=Ventas,OU=Usuarios,OU=Empresa,DC=…'. Al moverlo, cambian sus directivas." }
- { id: t6, frente: "Delegar restablecer contraseñas", dorso: "Asistente de delegación o dsacls 'OU=Usuarios,…' /G 'EMPRESA\\GG-MesaAyuda:CA;Reset Password;user'. A un grupo, sobre la OU más chica." }
