<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Una estructura de OU para una PyME</text>
  <rect x="10" y="36" width="600" height="294" rx="12" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1.4"/>
  <text x="24" y="58" font-weight="700" fill="currentColor">🌐 empresa.local</text>
  <rect x="30" y="70" width="420" height="250" rx="10" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.3"/>
  <text x="44" y="92" font-weight="700" fill="currentColor">📁 Empresa</text>
  <g fill="currentColor" font-size="12.5">
    <text x="64" y="120">📁 Usuarios</text>
    <text x="92" y="140" font-size="12">📁 Ventas · 📁 Compras · 📁 Administración</text>
    <text x="64" y="168">📁 Equipos</text>
    <text x="92" y="188" font-size="12">📁 Escritorio · 📁 Notebooks</text>
    <text x="64" y="216">📁 Servidores</text>
    <text x="64" y="244">📁 Grupos</text>
    <text x="64" y="272">📁 Cuentas de servicio</text>
  </g>
  <g fill="var(--muted, #5b6675)" font-size="11">
    <text x="300" y="120">directivas por área</text>
    <text x="300" y="168">notebooks ≠ escritorio</text>
    <text x="300" y="216">directivas de servidor</text>
    <text x="300" y="244">permisos (AGDLP)</text>
    <text x="300" y="272">gMSA y similares</text>
  </g>
  <rect x="468" y="70" width="136" height="80" rx="10" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1.3"/>
  <text x="480" y="92" font-weight="700" fill="currentColor">📁 Admin</text>
  <text x="480" y="112" font-size="10.5" fill="currentColor">cuentas administrativas,</text>
  <text x="480" y="126" font-size="11" fill="currentColor">directivas estrictas,</text>
  <text x="480" y="140" font-size="11" fill="currentColor">sin delegación</text>
  <rect x="468" y="166" width="136" height="50" rx="10" fill="var(--surface, #fff)" stroke="currentColor" stroke-width="1.1"/>
  <text x="480" y="188" font-size="12" fill="currentColor">📁 Domain</text>
  <text x="480" y="204" font-size="12" fill="currentColor">Controllers</text>
  <g fill="currentColor">
    <rect x="630" y="36" width="218" height="150" rx="12" fill="var(--bad-soft, #fde2e1)" stroke="currentColor" stroke-width="1.3"/>
    <text x="644" y="60" font-weight="700">Contenedores por defecto</text>
    <text x="644" y="86" text-decoration="line-through">CN=Users</text>
    <text x="644" y="106" text-decoration="line-through">CN=Computers</text>
    <text x="644" y="132" font-size="11.5">No son OU: no admiten GPO.</text>
    <text x="644" y="150" font-size="11.5">redircmp y redirusr mandan</text>
    <text x="644" y="166" font-size="11.5">lo nuevo a una OU.</text>
    <rect x="630" y="204" width="218" height="126" rx="12" fill="var(--surface, #fff)" stroke="currentColor" stroke-width="1.3"/>
    <text x="644" y="228" font-weight="700">Reglas</text>
    <text x="644" y="252" font-size="11.5">• Una OU = algo que se aplica</text>
    <text x="644" y="268" font-size="11.5">   o se delega distinto</text>
    <text x="644" y="290" font-size="11.5">• Primero por tipo de objeto</text>
    <text x="644" y="312" font-size="11.5">• 3 o 4 niveles como máximo</text>
  </g>
</svg>
