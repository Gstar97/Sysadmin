tipo: emparejar
consigna: Uní cada objeto con la OU donde conviene ubicarlo en la estructura de la lección.
pares:
  - { a: "La cuenta de María, vendedora", b: "Empresa/Usuarios/Ventas" }
  - { a: "La notebook que María se lleva a las visitas", b: "Empresa/Equipos/Notebooks" }
  - { a: "El servidor de archivos SRV-ARCH01", b: "Empresa/Servidores" }
  - { a: "El grupo GG-Ventas", b: "Empresa/Grupos" }
  - { a: "La cuenta admin.it con la que IT administra el dominio", b: "Admin" }
  - { a: "La cuenta con la que corre el sistema de stock", b: "Empresa/Cuentas de servicio" }
explicacion: >-
  Usuarios y equipos por separado (reciben directivas distintas), las notebooks aparte de las PC
  de escritorio (se configuran distinto), las cuentas administrativas fuera de Empresa para que
  nadie con permisos sobre Usuarios pueda tocarlas, y las cuentas de servicio en su propia OU.
