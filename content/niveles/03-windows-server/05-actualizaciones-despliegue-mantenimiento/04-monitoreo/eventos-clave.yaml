tipo: emparejar
consigna: Uní cada evento con lo que significa.
pares:
  - { a: "4624 (Security)", b: "Inicio de sesión correcto" }
  - { a: "4625 (Security)", b: "Inicio de sesión fallido" }
  - { a: "4740 (Security, en el DC)", b: "Una cuenta quedó bloqueada" }
  - { a: "7034 (System, Service Control Manager)", b: "Un servicio terminó de forma inesperada" }
  - { a: "41 (System, Kernel-Power)", b: "El equipo se reinició sin apagarse bien" }
  - { a: "6008 (System, EventLog)", b: "El apagado anterior fue inesperado" }
  - { a: "1074 (System, User32)", b: "Alguien o algo pidió reiniciar o apagar, con su motivo" }
  - { a: "1001 (System, BugCheck)", b: "El equipo se reinició por una pantalla azul" }
explicacion: >-
  Los de seguridad (4624, 4625, 4740) sirven para accesos y bloqueos. Los de System cuentan la
  vida del servidor: 1074 es un reinicio pedido (actualizaciones, una persona), mientras que 41
  y 6008 juntos dicen que se apagó sin avisar; si además hay un 1001, fue una pantalla azul.
