<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Cuatro preguntas, cuatro herramientas</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="40" width="203" height="160" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="225" y="40" width="203" height="160" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="440" y="40" width="203" height="160" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="655" y="40" width="195" height="160" rx="8" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="currentColor">
    <text x="111" y="62" text-anchor="middle" font-weight="700">¿Qué pasó?</text>
    <text x="111" y="80" text-anchor="middle" font-style="italic">Visor de eventos</text>
    <text x="20" y="104">System: Windows, servicios,</text>
    <text x="20" y="122">controladores, reinicios</text>
    <text x="20" y="140">Application: los programas</text>
    <text x="20" y="158">Security: inicios de sesión</text>
    <text x="20" y="176">y bloqueos (auditoría)</text>
    <text x="20" y="194">Get-WinEvent con filtros</text>
    <text x="326" y="62" text-anchor="middle" font-weight="700">¿Cómo está?</text>
    <text x="326" y="80" text-anchor="middle" font-style="italic">Monitor de rendimiento</text>
    <text x="235" y="104">contadores: procesador,</text>
    <text x="235" y="122">memoria, disco, red</text>
    <text x="235" y="140">en vivo, o grabados días</text>
    <text x="235" y="158">(recopiladores de datos)</text>
    <text x="235" y="176">para comparar con lo normal</text>
    <text x="235" y="194">Get-Counter</text>
    <text x="541" y="62" text-anchor="middle" font-weight="700">¿Desde cuándo?</text>
    <text x="541" y="80" text-anchor="middle" font-style="italic">Monitor de confiabilidad</text>
    <text x="450" y="104">una línea de tiempo por día:</text>
    <text x="450" y="122">fallas de programas,</text>
    <text x="450" y="140">apagados inesperados,</text>
    <text x="450" y="158">instalaciones y parches</text>
    <text x="450" y="176">"empezó el martes, justo</text>
    <text x="450" y="194">después de instalar X"</text>
    <text x="752" y="62" text-anchor="middle" font-weight="700">¿Quién, ahora?</text>
    <text x="752" y="80" text-anchor="middle" font-style="italic">Administrador de tareas</text>
    <text x="665" y="104">y Monitor de recursos:</text>
    <text x="665" y="122">qué proceso usa el</text>
    <text x="665" y="140">procesador, la memoria,</text>
    <text x="665" y="158">el disco o la red</text>
    <text x="665" y="176">en este momento</text>
    <text x="665" y="194">Get-Process</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="216" width="840" height="114" rx="8" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="currentColor">
    <text x="430" y="238" text-anchor="middle" font-weight="700">Valores que merecen una mirada (sostenidos, no un pico de un segundo)</text>
    <text x="22" y="262">Procesador: % Processor Time por encima de 85-90% durante minutos, o Processor Queue Length alta.</text>
    <text x="22" y="282">Memoria: Available MBytes por debajo del 10% de la memoria total; % Committed Bytes In Use cerca de 100%.</text>
    <text x="22" y="302">Disco: lecturas o escrituras que tardan más de 20 ms (Avg. Disk sec/Transfer) o una cola que no baja; menos de 10-15% libre.</text>
    <text x="22" y="322">Lo más útil: conocer los valores normales de tu servidor (la línea de base) y mirar qué cambió.</text>
  </g>
</svg>
