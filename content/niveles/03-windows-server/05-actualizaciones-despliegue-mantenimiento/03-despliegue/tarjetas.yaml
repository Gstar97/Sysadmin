- { id: t1, frente: "Tres formas de desplegar", dorso: "A mano, imagen (Sysprep + DISM) o aprovisionamiento (Autopilot)." }
- { id: t2, frente: "Modo auditoría", dorso: "Ctrl+Shift+F3 en la primera pantalla: sesión para preparar la referencia sin crear usuarios. Sin dominio." }
- { id: t3, frente: "Sysprep", dorso: "sysprep /generalize /oobe /shutdown. Si falla: Sysprep\\Panther\\setupact.log (apps de la Store, BitLocker)." }
- { id: t4, frente: "WinPE y DISM", dorso: "DISM /Capture-Image … /CaptureDir:C:\\ y DISM /Apply-Image … /Index:1 /ApplyDir:W:\\, luego bcdboot." }
- { id: t5, frente: "unattend.xml", dorso: "specialize: nombre (*), zona horaria, unión al dominio con OU. oobeSystem: configuración inicial." }
- { id: t6, frente: "Cuenta de unión", dorso: "Solo puede crear equipos en la OU destino: su contraseña queda en el archivo." }
- { id: t7, frente: "redircmp", dorso: "Cambia el contenedor por defecto de los equipos nuevos a una OU con GPO." }
- { id: t8, frente: "Herramientas 2026", dorso: "USB con WinPE (PyME), Configuration Manager, Autopilot + Intune. MDT retirado (enero de 2026); WDS obsoleto." }
