<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">De un equipo de referencia a cien PC iguales</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="44" width="156" height="128" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="181" y="44" width="156" height="128" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="352" y="44" width="156" height="128" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="523" y="44" width="156" height="128" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="694" y="44" width="156" height="128" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="currentColor">
    <line x1="166" y1="108" x2="177" y2="108"/><path d="M181 108 l-6 -4 v8 z"/>
    <line x1="337" y1="108" x2="348" y2="108"/><path d="M352 108 l-6 -4 v8 z"/>
    <line x1="508" y1="108" x2="519" y2="108"/><path d="M523 108 l-6 -4 v8 z"/>
    <line x1="679" y1="108" x2="690" y2="108"/><path d="M694 108 l-6 -4 v8 z"/>
  </g>
  <g fill="currentColor">
    <text x="88" y="66" text-anchor="middle" font-weight="700">1. Referencia</text>
    <text x="20" y="88">Windows 11 limpio</text>
    <text x="20" y="106">+ apps de toda la</text>
    <text x="20" y="124">empresa y ajustes</text>
    <text x="20" y="142">(en modo auditoría,</text>
    <text x="20" y="160">sin unir al dominio)</text>
    <text x="259" y="66" text-anchor="middle" font-weight="700">2. Sysprep</text>
    <text x="191" y="88">/generalize /oobe</text>
    <text x="191" y="106">/shutdown</text>
    <text x="191" y="124">borra lo que hace único</text>
    <text x="191" y="142">al equipo: SID, nombre,</text>
    <text x="191" y="160">IDs, controladores</text>
    <text x="430" y="66" text-anchor="middle" font-weight="700">3. Capturar</text>
    <text x="362" y="88">arrancar desde WinPE</text>
    <text x="362" y="106">DISM /Capture-Image</text>
    <text x="362" y="124">→ empresa.wim</text>
    <text x="362" y="142">(un archivo con el</text>
    <text x="362" y="160">disco entero)</text>
    <text x="601" y="66" text-anchor="middle" font-weight="700">4. Aplicar</text>
    <text x="533" y="88">en cada PC, desde</text>
    <text x="533" y="106">USB o la red:</text>
    <text x="533" y="124">particionar,</text>
    <text x="533" y="142">DISM /Apply-Image,</text>
    <text x="533" y="160">bcdboot</text>
    <text x="772" y="66" text-anchor="middle" font-weight="700">5. Primer arranque</text>
    <text x="704" y="88">OOBE lee</text>
    <text x="704" y="106">unattend.xml: idioma,</text>
    <text x="704" y="124">nombre, cuenta,</text>
    <text x="704" y="142">unirse al dominio;</text>
    <text x="704" y="160">después GPO y WSUS</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="196" width="412" height="122" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="438" y="196" width="412" height="122" rx="8" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="currentColor">
    <text x="216" y="218" text-anchor="middle" font-weight="700">Qué meter en la imagen</text>
    <text x="22" y="240">Delgada: Windows actualizado y poco más; las apps se</text>
    <text x="22" y="258">instalan después (GPO, script, Intune). Menos para rehacer.</text>
    <text x="22" y="282">Gruesa: todo adentro. Más rápida de aplicar, pero cada</text>
    <text x="22" y="300">cambio de una app obliga a rehacer la imagen.</text>
    <text x="644" y="218" text-anchor="middle" font-weight="700">Herramientas en 2026</text>
    <text x="450" y="240">Windows Autopilot: la PC nueva se prepara sola desde</text>
    <text x="450" y="258">internet, sin imagen propia (con Intune).</text>
    <text x="450" y="276">Configuration Manager: secuencias de tareas, red propia.</text>
    <text x="450" y="294">MDT: retirado en enero de 2026.</text>
    <text x="450" y="312">WDS: obsoleto, con límites para Windows 11.</text>
  </g>
</svg>
