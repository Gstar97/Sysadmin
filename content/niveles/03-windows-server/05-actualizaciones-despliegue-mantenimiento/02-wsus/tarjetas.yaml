- { id: t1, frente: "WSUS", dorso: "Rol de Windows Server que descarga una vez y reparte lo aprobado por grupo. Obsoleto desde 2024 pero con soporte en Windows Server 2025." }
- { id: t2, frente: "Instalar WSUS", dorso: "Install-WindowsFeature UpdateServices -IncludeManagementTools; wsusutil postinstall CONTENT_DIR=D:\\WSUS. Base WID, puerto 8530." }
- { id: t3, frente: "Qué sincronizar", dorso: "Solo tus productos e idiomas. Críticas, seguridad, definiciones y acumulativos; controladores no." }
- { id: t4, frente: "Segmentación del lado del cliente", dorso: "La GPO dice el grupo (TargetGroup). Una GPO general y una por OU." }
- { id: t5, frente: "Valores de la GPO", dorso: "WUServer y WUStatusServer (con :8530), TargetGroupEnabled, TargetGroup; en AU, UseWUServer = 1." }
- { id: t6, frente: "Aprobar", dorso: "Get-WsusUpdate -Classification Security -Approval Unapproved -Status FailedOrNeeded | Approve-WsusUpdate -Action Install -TargetGroupName Piloto" }
- { id: t7, frente: "En el equipo", dorso: "gpupdate /force, UsoClient StartScan, UsoClient StartInstall, Get-WindowsUpdateLog." }
- { id: t8, frente: "Mantenimiento", dorso: "Invoke-WsusServerCleanup -DeclineSupersededUpdates -CleanupUnneededContentFiles -CleanupObsoleteComputers, una vez por mes." }
- { id: t9, frente: "PC que no aparece", dorso: "GPO que no llega (OU), dirección sin puerto, firewall, clon sin Sysprep (SusClientId repetido)." }
