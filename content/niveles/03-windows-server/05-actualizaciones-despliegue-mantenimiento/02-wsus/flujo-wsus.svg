<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="fw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.4">
    <rect x="10" y="40" width="170" height="80" rx="10" fill="var(--surface-2, #eef1f5)"/>
    <rect x="250" y="40" width="200" height="120" rx="10" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="250" y="180" width="200" height="80" rx="10" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="520" y="40" width="330" height="80" rx="10" fill="var(--surface-2, #eef1f5)"/>
    <rect x="520" y="150" width="155" height="70" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="695" y="150" width="155" height="70" rx="10" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="520" y="250" width="330" height="70" rx="10" fill="var(--surface-2, #eef1f5)"/>
    <rect x="10" y="180" width="170" height="140" rx="10" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#fw)" fill="none">
    <line x1="180" y1="80" x2="248" y2="80"/>
    <line x1="350" y1="160" x2="350" y2="178"/>
    <line x1="450" y1="210" x2="518" y2="185"/>
    <line x1="685" y1="120" x2="685" y2="148"/>
    <line x1="600" y1="220" x2="600" y2="248"/>
    <path d="M520,285 L450,285 L450,262" />
  </g>
  <g fill="currentColor">
    <text x="95" y="28" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">internet</text>
    <text x="95" y="68" text-anchor="middle" font-weight="700">Microsoft Update</text>
    <text x="95" y="88" text-anchor="middle" font-size="12">catálogo de todas</text>
    <text x="95" y="104" text-anchor="middle" font-size="12">las actualizaciones</text>
    <text x="350" y="64" text-anchor="middle" font-weight="700">1. Sincronizar</text>
    <text x="350" y="86" text-anchor="middle" font-size="12">solo los productos y las</text>
    <text x="350" y="102" text-anchor="middle" font-size="12">clasificaciones elegidas;</text>
    <text x="350" y="118" text-anchor="middle" font-size="12">descarga lo aprobado</text>
    <text x="350" y="140" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">SRV-WSUS, D:\WSUS</text>
    <text x="350" y="204" text-anchor="middle" font-weight="700">2. Aprobar por grupo</text>
    <text x="350" y="226" text-anchor="middle" font-size="12">Piloto: instalar ya</text>
    <text x="350" y="244" text-anchor="middle" font-size="12">Producción: en una semana</text>
    <text x="685" y="64" text-anchor="middle" font-weight="700">3. GPO de Windows Update</text>
    <text x="685" y="86" text-anchor="middle" font-size="12">WUServer = http://srv-wsus:8530</text>
    <text x="685" y="104" text-anchor="middle" font-size="12">grupo del equipo (TargetGroup)</text>
    <text x="597" y="178" text-anchor="middle" font-weight="700">Piloto</text>
    <text x="597" y="198" text-anchor="middle" font-size="12">PC01, PC05…</text>
    <text x="772" y="178" text-anchor="middle" font-weight="700">Producción</text>
    <text x="772" y="198" text-anchor="middle" font-size="12">el resto</text>
    <text x="685" y="276" text-anchor="middle" font-weight="700">4. Instalar y reportar</text>
    <text x="685" y="296" text-anchor="middle" font-size="12">cada equipo busca, instala lo aprobado</text>
    <text x="685" y="312" text-anchor="middle" font-size="12">para su grupo y avisa cómo le fue</text>
    <text x="95" y="204" text-anchor="middle" font-weight="700">5. Mantenimiento</text>
    <text x="95" y="226" text-anchor="middle" font-size="12">rechazar reemplazadas,</text>
    <text x="95" y="242" text-anchor="middle" font-size="12">borrar lo que no hace</text>
    <text x="95" y="258" text-anchor="middle" font-size="12">falta, equipos viejos</text>
    <text x="95" y="282" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">si no se hace, WSUS</text>
    <text x="95" y="298" text-anchor="middle" font-size="11.5" fill="var(--muted, #5b6675)">se pone lento y se llena</text>
  </g>
</svg>
