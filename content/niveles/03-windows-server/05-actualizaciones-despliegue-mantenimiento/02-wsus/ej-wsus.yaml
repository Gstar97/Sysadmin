tipo: terminal
shell: powershell
titulo: WSUS de cero a la primera PC actualizada
descripcion: >-
  SRV-WSUS es un Windows Server 2025 del dominio con un disco D: para las actualizaciones. Las PC
  están en la OU Equipos, con dos OU adentro: Piloto (PC01) y Produccion (PC02). Estás en
  SRV-WSUS. Los números de KB del catálogo son de ejemplo.
estado_inicial:
  equipo: SRV-WSUS
  dominio: empresa.local
  red: { ip: 192.168.10.25, dns: [192.168.10.10] }
  discos:
    - { numero: 1, tamano_gb: 200, estilo: GPT, particiones: [{ letra: D, tamano_gb: 199, sistema: NTFS, etiqueta: WSUS }] }
  servidores:
    - equipo: DC01
      dominio: empresa.local
      red: { ip: 192.168.10.10, dns: [127.0.0.1] }
      ad:
        ous: [Empresa/Equipos/Piloto, Empresa/Equipos/Produccion]
        equipos:
          - { nombre: PC01, ou: Empresa/Equipos/Piloto, so: Windows 11 Pro }
          - { nombre: PC02, ou: Empresa/Equipos/Produccion, so: Windows 11 Pro }
    - { equipo: PC01, dominio: empresa.local, red: { ip: 192.168.10.51, dns: [192.168.10.10] } }
    - { equipo: PC02, dominio: empresa.local, red: { ip: 192.168.10.52, dns: [192.168.10.10] } }
pasos:
  - consigna: >-
      Instalá el rol de WSUS con sus herramientas y hacé la configuración posterior con el
      contenido en D:\WSUS (wsusutil.exe está en C:\Program Files\Update Services\Tools).
    verificar:
      - { caracteristica: UpdateServices }
      - { comando_usado: "wsusutil.*postinstall" }
    pistas:
      - "Install-WindowsFeature UpdateServices -IncludeManagementTools"
      - "& 'C:\\Program Files\\Update Services\\Tools\\wsusutil.exe' postinstall CONTENT_DIR=D:\\WSUS"
    solucion:
      - Install-WindowsFeature UpdateServices -IncludeManagementTools
      - "& 'C:\\Program Files\\Update Services\\Tools\\wsusutil.exe' postinstall CONTENT_DIR=D:\\WSUS"
  - consigna: >-
      Elegí qué sincronizar: los productos Windows Server 2025, Windows 11 y Microsoft Defender
      Antivirus, y las clasificaciones de fábrica más Update Rollups (sin controladores).
      Después sincronizá.
    verificar:
      - { wsus_producto: Windows 11 }
      - { wsus_producto: Windows Server 2025 }
      - { wsus_clasificacion: Update Rollups }
      - { wsus_clasificacion: Drivers, habilitada: false }
      - { wsus_listo: true }
    pistas:
      - "Get-WsusProduct | Where-Object { $_.Product.Title -in 'Windows Server 2025','Windows 11','Microsoft Defender Antivirus' } | Set-WsusProduct"
      - "Get-WsusClassification | Where-Object { $_.Classification.Title -eq 'Update Rollups' } | Set-WsusClassification"
      - "(Get-WsusServer).GetSubscription().StartSynchronization()"
    solucion:
      - "Get-WsusProduct | Where-Object { $_.Product.Title -in 'Windows Server 2025','Windows 11','Microsoft Defender Antivirus' } | Set-WsusProduct"
      - "Get-WsusClassification | Where-Object { $_.Classification.Title -eq 'Update Rollups' } | Set-WsusClassification"
      - "(Get-WsusServer).GetSubscription().StartSynchronization()"
      - Get-WsusUpdate -Approval Unapproved
  - consigna: >-
      Creá los grupos Piloto y Produccion y pasá el servidor a segmentación del lado del cliente
      (que cada equipo diga su grupo por GPO).
    verificar:
      - { wsus_grupo: Piloto }
      - { wsus_grupo: Produccion }
    pistas:
      - "$w = Get-WsusServer; $w.CreateComputerTargetGroup('Piloto')"
      - "$c = $w.GetConfiguration(); $c.TargetingMode = 'Client'; $c.Save()"
    solucion:
      - $w = Get-WsusServer
      - $w.CreateComputerTargetGroup('Piloto'); $w.CreateComputerTargetGroup('Produccion')
      - $c = $w.GetConfiguration(); $c.TargetingMode = 'Client'; $c.Save()
  - consigna: >-
      En DC01 (con Invoke-Command), la GPO "Equipos - Windows Update" vinculada a Equipos: WUServer
      y WUStatusServer = http://srv-wsus.empresa.local:8530 y TargetGroupEnabled = 1 en
      HKLM\Software\Policies\Microsoft\Windows\WindowsUpdate, y UseWUServer = 1 en la subclave AU.
      Y "Piloto - Grupo WSUS", vinculada a la OU Piloto, con TargetGroup = Piloto (igual para
      Produccion).
    verificar:
      - { en: DC01, verificar: { gpo: Equipos - Windows Update, vinculada_a: Empresa/Equipos } }
      - { en: DC01, verificar: { gpo: Piloto - Grupo WSUS, vinculada_a: Empresa/Equipos/Piloto } }
      - { en: DC01, verificar: { gpo: Produccion - Grupo WSUS, vinculada_a: Empresa/Equipos/Produccion } }
    pistas:
      - "Invoke-Command DC01 { $k = 'HKLM\\Software\\Policies\\Microsoft\\Windows\\WindowsUpdate'; New-GPO 'Equipos - Windows Update' | New-GPLink -Target 'OU=Equipos,OU=Empresa,DC=empresa,DC=local'; Set-GPRegistryValue 'Equipos - Windows Update' -Key $k -ValueName WUServer -Type String -Value 'http://srv-wsus.empresa.local:8530'; … }"
    solucion:
      - "Invoke-Command DC01 { $k = 'HKLM\\Software\\Policies\\Microsoft\\Windows\\WindowsUpdate'; New-GPO 'Equipos - Windows Update' | New-GPLink -Target 'OU=Equipos,OU=Empresa,DC=empresa,DC=local'; Set-GPRegistryValue 'Equipos - Windows Update' -Key $k -ValueName WUServer -Type String -Value 'http://srv-wsus.empresa.local:8530'; Set-GPRegistryValue 'Equipos - Windows Update' -Key $k -ValueName WUStatusServer -Type String -Value 'http://srv-wsus.empresa.local:8530'; Set-GPRegistryValue 'Equipos - Windows Update' -Key $k -ValueName TargetGroupEnabled -Type DWord -Value 1; Set-GPRegistryValue 'Equipos - Windows Update' -Key \"$k\\AU\" -ValueName UseWUServer -Type DWord -Value 1 }"
      - "Invoke-Command DC01 { $k = 'HKLM\\Software\\Policies\\Microsoft\\Windows\\WindowsUpdate'; foreach ($g in 'Piloto', 'Produccion') { New-GPO \"$g - Grupo WSUS\" | New-GPLink -Target \"OU=$g,OU=Equipos,OU=Empresa,DC=empresa,DC=local\"; Set-GPRegistryValue \"$g - Grupo WSUS\" -Key $k -ValueName TargetGroup -Type String -Value $g } }"
  - consigna: >-
      Hacé que PC01 y PC02 apliquen las directivas y busquen actualizaciones, y comprobá en qué
      grupo quedó cada una.
    verificar:
      - { wsus_equipo: PC01, grupo: Piloto }
      - { wsus_equipo: PC02, grupo: Produccion }
    pistas:
      - "Invoke-Command PC01, PC02 { gpupdate /force; UsoClient StartScan }"
    solucion:
      - Invoke-Command PC01, PC02 { gpupdate /force; UsoClient StartScan }
      - Get-WsusComputer
  - consigna: >-
      Aprobá para el grupo Piloto las actualizaciones de seguridad sin aprobar que hagan falta, y
      que PC01 las instale. PC02 todavía no tiene que recibir nada.
    verificar:
      - { wsus_aprobacion: KB5072031, grupo: Piloto }
      - { en: PC01, verificar: { actualizacion: KB5072031 } }
      - { en: PC02, verificar: { actualizacion: KB5072031, instalada: false } }
    pistas:
      - "Get-WsusUpdate -Classification Security -Approval Unapproved -Status FailedOrNeeded | Approve-WsusUpdate -Action Install -TargetGroupName Piloto"
      - "Invoke-Command PC01 { UsoClient StartInstall }"
    solucion:
      - Get-WsusUpdate -Classification Security -Approval Unapproved -Status FailedOrNeeded | Approve-WsusUpdate -Action Install -TargetGroupName Piloto
      - Invoke-Command PC01 { UsoClient StartInstall }
      - Invoke-Command PC02 { UsoClient StartInstall }
  - consigna: >-
      El mantenimiento del mes: rechazá las actualizaciones reemplazadas y borrá los archivos que no hacen falta.
    verificar:
      - { wsus_rechazada: KB5071950 }
      - { comando_usado: "invoke-wsusservercleanup" }
    pistas:
      - "Invoke-WsusServerCleanup -DeclineSupersededUpdates -CleanupUnneededContentFiles -CleanupObsoleteComputers"
    solucion: ["Invoke-WsusServerCleanup -DeclineSupersededUpdates -CleanupUnneededContentFiles -CleanupObsoleteComputers"]
