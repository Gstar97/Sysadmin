<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 332" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Qué se respalda y dónde se guarda</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="40" width="410" height="282" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="440" y="40" width="410" height="282" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="22" y="72" width="386" height="50" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="22" y="130" width="386" height="50" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="22" y="188" width="386" height="50" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="22" y="246" width="386" height="64" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="452" y="72" width="120" height="60" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="585" y="72" width="120" height="60" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="718" y="72" width="120" height="60" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="215" y="62" text-anchor="middle" font-weight="700">Windows Server Backup puede respaldar</text>
    <text x="34" y="93" font-weight="700">Archivos y carpetas</text>
    <text x="34" y="111">D:\Datos: para recuperar lo que alguien borró</text>
    <text x="34" y="151" font-weight="700">Volúmenes enteros</text>
    <text x="34" y="169">un disco de datos completo</text>
    <text x="34" y="209" font-weight="700">Estado del sistema</text>
    <text x="34" y="227">registro, arranque, AD y SYSVOL en un DC</text>
    <text x="34" y="267" font-weight="700">Recuperación completa (bare metal)</text>
    <text x="34" y="285">todo lo necesario para levantar el servidor</text>
    <text x="34" y="302">en un disco vacío (-allCritical)</text>
    <text x="645" y="62" text-anchor="middle" font-weight="700">La regla 3-2-1</text>
    <text x="512" y="96" text-anchor="middle" font-weight="700" font-size="20">3</text>
    <text x="512" y="118" text-anchor="middle">copias</text>
    <text x="645" y="96" text-anchor="middle" font-weight="700" font-size="20">2</text>
    <text x="645" y="118" text-anchor="middle">medios distintos</text>
    <text x="778" y="96" text-anchor="middle" font-weight="700" font-size="20">1</text>
    <text x="778" y="118" text-anchor="middle">fuera del lugar</text>
    <text x="452" y="160">Los datos originales, el disco de respaldo del</text>
    <text x="452" y="178">servidor y una copia en otro lado (la nube, otra</text>
    <text x="452" y="196">sede, un disco que se lleva alguien).</text>
    <text x="452" y="222" font-weight="700">Contra el ransomware, además:</text>
    <text x="452" y="240">una copia que no se pueda borrar ni cifrar desde</text>
    <text x="452" y="258">la red (desconectada o inmutable).</text>
    <text x="452" y="284" font-weight="700">Y lo que nunca se salta:</text>
    <text x="452" y="302">probar que se puede restaurar.</text>
  </g>
</svg>
