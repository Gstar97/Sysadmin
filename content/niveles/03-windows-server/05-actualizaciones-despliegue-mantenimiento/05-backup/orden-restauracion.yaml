tipo: ordenar
consigna: >-
  El disco del sistema de SRV-ARCH01 murió. Ya cambiaron el disco y el disco de respaldos E: está
  sano. Ordená la recuperación completa.
pasos:
  - Conectar el disco de respaldos al servidor (o tener a mano la carpeta de red donde está)
  - Arrancar desde el medio de instalación de Windows Server (USB o ISO)
  - Elegir Reparar el equipo, Solucionar problemas y Recuperación de imagen del sistema
  - Elegir el respaldo y la versión (fecha y hora) a recuperar
  - Aceptar que formatee y particione los discos de destino, y que no toque el disco de respaldos
  - Esperar la recuperación y reiniciar
  - Comprobar que arranca, que los servicios y recursos compartidos funcionan, y revisar los eventos
explicacion: >-
  La recuperación completa se hace desde el entorno de recuperación del medio de instalación,
  porque no hay Windows que arranque. Se elige la versión, se dejan afuera los discos que no hay
  que tocar (sobre todo el de respaldos) y, al terminar, se comprueba que todo anda, no solo que
  arrancó.
