- { id: t1, frente: "RPO y RTO", dorso: "RPO: cuántos datos se pueden perder. RTO: cuánto se puede tardar en volver." }
- { id: t2, frente: "Qué respalda Windows Server Backup", dorso: "Archivos y carpetas, volúmenes, estado del sistema y recuperación completa (-allCritical)." }
- { id: t3, frente: "Destinos", dorso: "Disco dedicado: muchas versiones. Carpeta de red: solo la última. Nunca el mismo disco." }
- { id: t4, frente: "Comandos", dorso: "wbadmin start backup, enable backup -schedule:HH:MM, get versions, start recovery -version: -items: [-recoveryTarget:]" }
- { id: t5, frente: "Recuperación completa", dorso: "Medio de instalación → Reparar el equipo → Solucionar problemas → Recuperación de imagen del sistema." }
- { id: t6, frente: "Versiones anteriores", dorso: "Instantáneas por volumen; la gente recupera sola. Mismo disco: no son un respaldo." }
- { id: t7, frente: "3-2-1 + ransomware", dorso: "Tres copias, dos medios, una fuera; al menos una desconectada o inmutable." }
- { id: t8, frente: "Probar", dorso: "Archivos todos los meses; recuperación completa una o dos veces por año; revisar cada mañana." }
