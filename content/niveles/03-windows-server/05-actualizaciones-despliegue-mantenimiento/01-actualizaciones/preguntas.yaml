- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Cuándo publica Microsoft las actualizaciones de seguridad de Windows?
  opciones:
    - { texto: "El segundo martes de cada mes", correcta: true, explicacion: "Patch Tuesday. Las de urgencia salen fuera de banda." }
    - { texto: "El primer día hábil de cada mes", explicacion: "Es el segundo martes." }
    - { texto: "Cada vez que hay una, sin calendario", explicacion: "Hay un calendario; las urgencias son la excepción." }
    - { texto: "Una vez por año", explicacion: "Eso son las actualizaciones de características de Windows 11." }
- id: p02
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Un servidor tiene instalado el acumulativo de noviembre pero no el de octubre. ¿Le falta algo?
  opciones:
    - { texto: "No: el acumulativo de noviembre incluye todo lo anterior", correcta: true, explicacion: "Por eso el de octubre queda reemplazado." }
    - { texto: "Sí: hay que instalar los dos", explicacion: "Los acumulativos incluyen lo anterior." }
    - { texto: "Sí: primero hay que desinstalar el de noviembre", explicacion: "No hace falta." }
    - { texto: "Depende del antivirus", explicacion: "No tiene relación." }
- id: p03
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Quiénes conviene que estén en el anillo piloto?
  opciones:
    - { texto: "Un 5 a 10% de las PC, con gente de todas las áreas que sepa que es piloto", correcta: true, explicacion: "Así se prueban las aplicaciones de cada área." }
    - { texto: "Solo las PC de IT", explicacion: "No usan las aplicaciones de las demás áreas." }
    - { texto: "Los servidores críticos", explicacion: "Van al final, no primero." }
    - { texto: "Las PC más viejas", explicacion: "No representan a la empresa." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Sale un parche para una vulnerabilidad que ya se está explotando en internet. Tu política dice tres semanas hasta producción. ¿Qué hacés?
  opciones:
    - { texto: "Acortar el calendario: pruebas y piloto en horas, y producción en días", correcta: true, explicacion: "La demora tiene techo." }
    - { texto: "Respetar las tres semanas", explicacion: "Es el escenario en que la demora es más peligrosa que el parche." }
    - { texto: "No instalarlo hasta el mes que viene", explicacion: "Lo dejás expuesto un mes." }
    - { texto: "Instalarlo solo en los servidores", explicacion: "Las PC también están expuestas." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Por qué los servidores críticos van al final y de a uno?
  opciones:
    - { texto: "Porque un problema ahí afecta a toda la empresa: se actualizan con lo ya probado, en la ventana de mantenimiento y con respaldo", correcta: true, explicacion: "Y de a uno para que nunca se caigan dos DC juntos." }
    - { texto: "Porque los servidores no necesitan parches", explicacion: "Los necesitan tanto o más." }
    - { texto: "Porque los parches de servidor salen después", explicacion: "Salen el mismo día." }
    - { texto: "Por una regla de licencias", explicacion: "No tiene relación." }
- id: p06
  tipo: respuesta_multiple
  dificultad: 2
  enunciado: ¿Qué conviene medir cada mes? (Elegí todas las correctas.)
  opciones:
    - { texto: "Qué equipos tienen el acumulativo del mes", correcta: true, explicacion: "Es el cumplimiento básico." }
    - { texto: "Qué equipos esperan un reinicio", correcta: true, explicacion: "Sin reinicio, no quedó aplicado." }
    - { texto: "Qué equipos no se reportan hace semanas", correcta: true, explicacion: "Pueden estar apagados, rotos o fuera de la red." }
    - { texto: "Cuántas actualizaciones publicó Microsoft", explicacion: "Lo que importa es lo que tienen tus equipos." }
- id: p07
  tipo: completar_comando
  dificultad: 2
  enunciado: Escribí el comando que comprueba si KB5072033 está instalada en SRV-APP01.
  aceptadas:
    - "Get-HotFix -Id KB5072033 -ComputerName SRV-APP01"
    - "Get-HotFix KB5072033 -ComputerName SRV-APP01"
    - "Get-HotFix -ComputerName SRV-APP01 -Id KB5072033"
  patrones: ["^get-hotfix\\s+(?=.*kb5072033)(?=.*-computername\\s+srv-app01).*$"]
  explicacion: "Si no está, Get-HotFix da un error de que no encontró la actualización."
- id: p08
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué es el hotpatch de Windows Server 2025?
  opciones:
    - { texto: "Parches que se aplican en memoria sin reiniciar, salvo en los meses de base; fuera de Azure necesita Azure Arc", correcta: true, explicacion: "Reduce reinicios, no los elimina." }
    - { texto: "Una actualización de urgencia fuera del calendario", explicacion: "Eso es fuera de banda." }
    - { texto: "Un parche que se instala solo sin aprobación", explicacion: "No tiene relación con las aprobaciones." }
    - { texto: "La vista previa opcional de fin de mes", explicacion: "Es otra cosa." }
- id: p09
  tipo: opcion_multiple
  dificultad: 1
  enunciado: ¿Qué actualizaciones no conviene demorar con los anillos?
  opciones:
    - { texto: "Las definiciones del antivirus", correcta: true, explicacion: "Salen varias veces por día y no piden reinicio." }
    - { texto: "Los acumulativos de seguridad", explicacion: "Esos van por anillos." }
    - { texto: "Las actualizaciones de características", explicacion: "Son proyectos que se planifican." }
    - { texto: "Los controladores", explicacion: "Se tratan con más cuidado todavía." }
- id: p10
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué es la "vista previa opcional" de fin de mes?
  opciones:
    - { texto: "Los arreglos que no son de seguridad que van a venir en el acumulativo del mes siguiente", correcta: true, explicacion: "En empresas, se dejan para los equipos de prueba." }
    - { texto: "El acumulativo de seguridad del mes", explicacion: "Ese sale el segundo martes." }
    - { texto: "Una versión nueva de Windows", explicacion: "Eso es una actualización de características." }
    - { texto: "Un parche de urgencia", explicacion: "Eso es fuera de banda." }
