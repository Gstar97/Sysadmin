<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12.5">
  <text x="430" y="22" text-anchor="middle" font-weight="700" fill="currentColor">Un mes de parches, por anillos</text>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="150" y1="50" x2="150" y2="290" stroke-dasharray="4 4"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="150" y="44" text-anchor="middle" font-weight="700">Segundo martes</text>
    <text x="240" y="44" text-anchor="middle">+2 días</text>
    <text x="400" y="44" text-anchor="middle">+1 semana</text>
    <text x="620" y="44" text-anchor="middle">+2 a 3 semanas</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="60" width="120" height="50" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="10" y="122" width="120" height="50" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="10" y="184" width="120" height="50" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="10" y="246" width="120" height="50" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="152" y="64" width="178" height="42" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="240" y="126" width="240" height="42" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="330" y="188" width="380" height="42" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="500" y="250" width="350" height="42" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="70" y="82" text-anchor="middle" font-weight="700">0. Pruebas</text>
    <text x="70" y="99" text-anchor="middle" font-size="11.5">laboratorio, IT</text>
    <text x="70" y="144" text-anchor="middle" font-weight="700">1. Piloto</text>
    <text x="70" y="161" text-anchor="middle" font-size="11.5">5-10% de cada área</text>
    <text x="70" y="206" text-anchor="middle" font-weight="700">2. Producción</text>
    <text x="70" y="223" text-anchor="middle" font-size="11.5">el resto de las PC</text>
    <text x="70" y="268" text-anchor="middle" font-weight="700">3. Críticos</text>
    <text x="70" y="285" text-anchor="middle" font-size="11.5">DC, facturación</text>
    <text x="164" y="90" font-size="12">¿arranca? ¿las apps abren?</text>
    <text x="252" y="152" font-size="12">gente real; esperar quejas y revisar</text>
    <text x="342" y="214" font-size="12">si el piloto anduvo bien, a todos (con ventana de reinicio)</text>
    <text x="512" y="276" font-size="12">de a uno, fuera de horario, con respaldo previo</text>
  </g>
  <text x="430" y="320" text-anchor="middle" fill="currentColor" font-size="12">Si algo sale mal en un anillo, se frena ahí: se rechaza o se desaprueba antes de que llegue al siguiente.</text>
</svg>
