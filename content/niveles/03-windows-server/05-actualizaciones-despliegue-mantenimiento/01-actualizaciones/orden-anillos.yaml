tipo: ordenar
consigna: Ordená cómo llega el acumulativo de noviembre a una empresa con anillos de despliegue.
pasos:
  - "Segundo martes: Microsoft publica las actualizaciones de seguridad"
  - "Se sincronizan en WSUS (o en la herramienta que se use)"
  - "Se aprueban para el grupo de pruebas y se revisan los equipos de IT"
  - "Se aprueban para el piloto: algunas personas de cada área"
  - "Una semana sin problemas: se aprueban para producción"
  - "Los servidores críticos, de a uno, en la ventana de mantenimiento y con respaldo previo"
  - "Informe de cumplimiento: quién la tiene y quién no"
explicacion: >-
  Cada anillo es una oportunidad de frenar un problema antes de que llegue a todos. Los servidores
  críticos van al final, de a uno y con respaldo, y el informe cierra el mes.
