id: n3
titulo: Windows Server
descripcion: 'Administración de Windows Server 2025 (versión LTSC vigente, con soporte hasta 2034): instalación,
  PowerShell, Active Directory, directivas de grupo, DNS, DHCP, servidor de archivos, actualizaciones
  y despliegue de equipos. PowerShell se enseña al principio del nivel porque es la herramienta con la
  que se administra todo lo demás.'
perfil_salida: Montar y operar un dominio de Active Directory completo para una empresa chica o mediana,
  administrarlo con PowerShell, aplicar directivas de grupo, publicar archivos con permisos correctos
  y mantener los equipos actualizados.
insignia:
  nombre: Windows Server
  color: '#0369a1'
proyecto_plan:
  titulo: Dominio para una PyME
  horas: 20
  entregables:
  - Dos controladores de dominio con DNS integrado y DHCP con conmutación por error.
  - Unidades organizativas, alta masiva de usuarios con PowerShell desde CSV y grupos AGDLP.
  - Directivas de seguridad, unidades de red y restricciones.
  - Servidor de archivos con permisos NTFS, recursos compartidos, cuotas y DFS.
  - WSUS con anillos, backup de AD y restauración probada.
  - Documentación y script de verificación de salud del dominio.
