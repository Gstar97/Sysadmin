- { id: t1, frente: "Instalar Samba", dorso: "Paquete samba; servicio smb en Rocky (smbd en Ubuntu, que arranca solo); firewall: servicio samba (445)." }
- { id: t2, frente: "Un recurso en smb.conf", dorso: "[nombre] con path, valid users = @grupo, writable = yes, create mask y directory mask. Después, testparm." }
- { id: t3, frente: "Cuentas de Samba", dorso: "smbpasswd -a (crea, atada a un usuario de Linux), -d (deshabilita), -x (borra); pdbedit -L las lista." }
- { id: t4, frente: "SELinux y Samba", dorso: "semanage fcontext -a -t samba_share_t '/srv/samba(/.*)?' y restorecon -Rv /srv/samba." }
- { id: t5, frente: "Probar", dorso: "smbclient -L //servidor -U usuario (recursos) y smbclient //servidor/recurso -U usuario -c ls." }
- { id: t6, frente: "Los cinco controles", dorso: "Red y firewall, cuenta, recurso (valid users, writable), SELinux (samba_share_t) y permisos de la carpeta." }
- { id: t7, frente: "Montar desde Linux", dorso: "mount -t cifs //servidor/recurso /punto -o credentials=archivo,uid=usuario,gid=grupo (paquete cifs-utils)." }
