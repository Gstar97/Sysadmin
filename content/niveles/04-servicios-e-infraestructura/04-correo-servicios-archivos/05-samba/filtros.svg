<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Para abrir un archivo de Samba hay que pasar cinco controles, en orden</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="44" width="158" height="120" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="182" y="44" width="158" height="120" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="354" y="44" width="158" height="120" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="526" y="44" width="158" height="120" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="698" y="44" width="152" height="120" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="currentColor">
    <line x1="168" y1="104" x2="176" y2="104"/><path d="M181 104 l-6 -4 v8 z"/>
    <line x1="340" y1="104" x2="348" y2="104"/><path d="M353 104 l-6 -4 v8 z"/>
    <line x1="512" y1="104" x2="520" y2="104"/><path d="M525 104 l-6 -4 v8 z"/>
    <line x1="684" y1="104" x2="692" y2="104"/><path d="M697 104 l-6 -4 v8 z"/>
  </g>
  <g fill="currentColor">
    <text x="89" y="66" text-anchor="middle" font-weight="700">1. La red</text>
    <text x="89" y="88" text-anchor="middle" font-size="11">smb corriendo y el</text>
    <text x="89" y="104" text-anchor="middle" font-size="11">firewall con el servicio</text>
    <text x="89" y="120" text-anchor="middle" font-size="11">samba (445)</text>
    <text x="261" y="66" text-anchor="middle" font-weight="700">2. La cuenta</text>
    <text x="261" y="88" text-anchor="middle" font-size="11">usuario y contraseña de</text>
    <text x="261" y="104" text-anchor="middle" font-size="11">Samba (smbpasswd), atada</text>
    <text x="261" y="120" text-anchor="middle" font-size="11">a un usuario de Linux</text>
    <text x="433" y="66" text-anchor="middle" font-weight="700">3. El recurso</text>
    <text x="433" y="88" text-anchor="middle" font-size="11">smb.conf: valid users,</text>
    <text x="433" y="104" text-anchor="middle" font-size="11">writable o read only,</text>
    <text x="433" y="120" text-anchor="middle" font-size="11">write list, hosts allow</text>
    <text x="605" y="66" text-anchor="middle" font-weight="700">4. SELinux (Rocky)</text>
    <text x="605" y="88" text-anchor="middle" font-size="11">la carpeta etiquetada</text>
    <text x="605" y="104" text-anchor="middle" font-size="11">samba_share_t</text>
    <text x="605" y="120" text-anchor="middle" font-size="11">(semanage fcontext)</text>
    <text x="774" y="66" text-anchor="middle" font-weight="700">5. La carpeta</text>
    <text x="774" y="88" text-anchor="middle" font-size="11">permisos de Linux del</text>
    <text x="774" y="104" text-anchor="middle" font-size="11">usuario (o force user),</text>
    <text x="774" y="120" text-anchor="middle" font-size="11">grupo y SGID</text>
    <text x="89" y="190" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace">HOST_UNREACHABLE</text>
    <text x="89" y="206" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace">o IO_TIMEOUT</text>
    <text x="261" y="190" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace">LOGON_FAILURE</text>
    <text x="433" y="190" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace">tree connect failed:</text>
    <text x="433" y="206" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace">ACCESS_DENIED</text>
    <text x="605" y="190" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace">ACCESS_DENIED</text>
    <text x="605" y="206" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace">listing \*</text>
    <text x="774" y="190" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace">ACCESS_DENIED</text>
    <text x="774" y="206" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace">opening remote file</text>
    <text x="430" y="246" text-anchor="middle">Abajo, lo que muestra smbclient cuando falla cada control. Desde Windows todo se ve casi igual</text>
    <text x="430" y="266" text-anchor="middle">("No tiene permiso"): por eso se prueba con smbclient en el servidor, de a un control por vez.</text>
  </g>
</svg>
