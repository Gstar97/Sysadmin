- { id: t1, frente: "Registro MX", dorso: "Qué servidores reciben el correo de un dominio, con prioridad (el número más bajo primero). dig MX dominio." }
- { id: t2, frente: "Puerto 25", dorso: "SMTP de servidor a servidor. Suele estar bloqueado para salir desde redes de usuarios y de la nube." }
- { id: t3, frente: "Puerto 587", dorso: "Submission: el programa de correo (o un servidor) entrega a su servidor de envío con STARTTLS y usuario y contraseña." }
- { id: t4, frente: "IMAP y POP3", dorso: "Para leer. IMAP (993) deja todo en el servidor y sincroniza los equipos; POP3 (995) descarga." }
- { id: t5, frente: "El sobre y la carta", dorso: "Sobre: MAIL FROM y RCPT TO (los usan los servidores). Carta: encabezados From, To, Subject y el cuerpo (lo que ve la persona)." }
- { id: t6, frente: "Relay abierto", dorso: "Un servidor que reenvía correo de cualquiera hacia cualquiera. Termina mandando spam y en listas negras." }
- { id: t7, frente: "Registro de Postfix", dorso: "/var/log/maillog (Rocky), /var/log/mail.log (Ubuntu) o journalctl -u postfix. Se sigue un mensaje por su ID de cola." }
