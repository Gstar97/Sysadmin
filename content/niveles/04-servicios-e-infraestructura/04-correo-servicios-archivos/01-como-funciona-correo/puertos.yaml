tipo: emparejar
consigna: Uní cada puerto con lo que viaja por él.
pares:
  - { a: "25 (SMTP)", b: "De servidor a servidor: el que manda entrega en el MX del destino" }
  - { a: "587 (submission)", b: "Del programa de correo a su servidor de envío, con STARTTLS y usuario y contraseña" }
  - { a: "465 (SMTPS)", b: "Lo mismo que el 587, pero cifrado desde el primer byte" }
  - { a: "993 (IMAPS)", b: "Leer el buzón desde el celular o la PC, dejando los mensajes en el servidor" }
  - { a: "995 (POP3S)", b: "Descargar los mensajes a un solo equipo (el protocolo viejo)" }
explicacion: >-
  25 es para que los servidores se pasen el correo entre ellos; 587 y 465, para que las personas
  (y los servidores de la empresa) manden con usuario y contraseña; 993 y 995, para leer. Los
  proveedores de internet y de la nube suelen bloquear la salida por el 25 para frenar el spam
  de equipos infectados: por eso un servidor de la empresa manda a través de un relay por el 587.
