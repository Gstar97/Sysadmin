<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Un correo tiene un sobre y una carta</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="42" width="370" height="200" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="430" y="42" width="410" height="200" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="20" y="258" width="820" height="62" rx="8" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor">
    <text x="205" y="66" text-anchor="middle" font-weight="700">El sobre (lo que usan los servidores)</text>
    <text x="36" y="96" font-family="ui-monospace, monospace" font-size="11.5">MAIL FROM:&lt;rebotes@proveedor.com&gt;</text>
    <text x="36" y="118" font-family="ui-monospace, monospace" font-size="11.5">RCPT TO:&lt;cliente@gmail.com&gt;</text>
    <text x="36" y="150">Se manda en la conversación SMTP, antes del</text>
    <text x="36" y="168">mensaje. Dice a quién entregar y adónde avisar</text>
    <text x="36" y="186">si rebota. La persona que lo recibe no lo ve</text>
    <text x="36" y="204">(queda como Return-Path).</text>
    <text x="36" y="228" font-size="11">SPF revisa el dominio del sobre.</text>
    <text x="635" y="66" text-anchor="middle" font-weight="700">La carta (lo que ve la persona)</text>
    <text x="446" y="96" font-family="ui-monospace, monospace" font-size="11.5">From: Ventas &lt;ventas@ejemplo.com.ar&gt;</text>
    <text x="446" y="114" font-family="ui-monospace, monospace" font-size="11.5">To: cliente@gmail.com</text>
    <text x="446" y="132" font-family="ui-monospace, monospace" font-size="11.5">Subject: Presupuesto 1043</text>
    <text x="446" y="150" font-family="ui-monospace, monospace" font-size="11.5">DKIM-Signature: d=ejemplo.com.ar; s=s1; …</text>
    <text x="446" y="174">Encabezados y cuerpo, dentro del DATA. El From</text>
    <text x="446" y="192">es lo que muestra el programa de correo, y no</text>
    <text x="446" y="210">tiene por qué coincidir con el sobre.</text>
    <text x="446" y="228" font-size="11">DKIM firma la carta; DMARC mira el From.</text>
    <text x="430" y="282" text-anchor="middle">Un estafador puede poner cualquier From. Por eso DMARC exige que el dominio del From coincida</text>
    <text x="430" y="302" text-anchor="middle">con el que validó SPF o DKIM: si no, el correo no es de quien dice ser.</text>
  </g>
</svg>
