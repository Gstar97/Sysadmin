- { id: t1, frente: "/etc/exports", dorso: "carpeta cliente(opciones), sin espacio antes del paréntesis. Ej.: /srv/compartido 192.168.10.0/24(rw,sync)." }
- { id: t2, frente: "Aplicar y ver", dorso: "sudo exportfs -ra aplica /etc/exports; sudo exportfs -v muestra lo exportado con todas las opciones." }
- { id: t3, frente: "root_squash", dorso: "De fábrica: root del cliente es nobody en el servidor. no_root_squash lo desactiva (solo casos puntuales); all_squash lo hace con todos." }
- { id: t4, frente: "Permisos en NFS", dorso: "El cliente manda números (uid y gid); el servidor aplica sus permisos. Tienen que coincidir en todos los equipos." }
- { id: t5, frente: "Montar", dorso: "mount -t nfs servidor:/carpeta /punto; en fstab con _netdev. Paquete: nfs-utils (Rocky) o nfs-common (Ubuntu)." }
- { id: t6, frente: "Firewall", dorso: "Servicio nfs (2049). showmount necesita además rpc-bind y mountd." }
- { id: t7, frente: "Bajo demanda", dorso: "x-systemd.automount en fstab (daemon-reload y restart remote-fs.target) o autofs con /etc/auto.master.d/*.autofs y un mapa." }
