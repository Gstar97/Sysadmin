<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">NFS no manda nombres: manda números de usuario</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="40" width="250" height="200" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="590" y="40" width="250" height="200" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="300" y="40" width="260" height="200" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="20" y="256" width="820" height="62" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="currentColor">
    <line x1="270" y1="94" x2="584" y2="94"/><path d="M589 94 l-8 -4 v8 z"/>
    <line x1="270" y1="148" x2="584" y2="148"/><path d="M589 148 l-8 -4 v8 z"/>
    <line x1="270" y1="202" x2="584" y2="202"/><path d="M589 202 l-8 -4 v8 z"/>
  </g>
  <g fill="currentColor">
    <text x="145" y="62" text-anchor="middle" font-weight="700">web01 (cliente)</text>
    <text x="36" y="90">root</text>
    <text x="36" y="106" font-size="11">uid 0</text>
    <text x="36" y="144">ana</text>
    <text x="36" y="160" font-size="11">uid 1001</text>
    <text x="36" y="198">juan</text>
    <text x="36" y="214" font-size="11">uid 1002</text>
    <text x="430" y="62" text-anchor="middle" font-weight="700">/etc/exports del servidor</text>
    <text x="430" y="86" text-anchor="middle" font-size="11">root_squash (de fábrica):</text>
    <text x="430" y="104" text-anchor="middle" font-size="11">root pasa a ser nobody (65534)</text>
    <text x="430" y="140" text-anchor="middle" font-size="11">los demás llegan con su número,</text>
    <text x="430" y="158" text-anchor="middle" font-size="11">tal cual</text>
    <text x="430" y="194" text-anchor="middle" font-size="11">juan llega como 1002</text>
    <text x="430" y="212" text-anchor="middle" font-size="11">(con all_squash, todos serían nobody)</text>
    <text x="715" y="62" text-anchor="middle" font-weight="700">files01 (servidor)</text>
    <text x="606" y="90">nobody</text>
    <text x="606" y="106" font-size="11">no puede escribir en una carpeta de root</text>
    <text x="606" y="144">uid 1001: ana también acá</text>
    <text x="606" y="160" font-size="11">bien, si las cuentas tienen el mismo uid</text>
    <text x="606" y="198">uid 1002: ¡acá es pedro!</text>
    <text x="606" y="214" font-size="11">juan escribe como si fuera pedro</text>
    <text x="430" y="280" text-anchor="middle">Con sec=sys (lo habitual), el servidor cree el número que dice el cliente. Por eso los uid tienen</text>
    <text x="430" y="300" text-anchor="middle">que coincidir en todos los equipos (FreeIPA o AD los centralizan) y solo se exporta a equipos de confianza.</text>
  </g>
</svg>
