- { id: t1, frente: "SPF", dorso: "TXT del dominio: v=spf1 (quiénes pueden mandar) -all. Uno solo por dominio, máximo diez consultas (include, a, mx)." }
- { id: t2, frente: "DKIM", dorso: "El que manda firma con su clave privada; la pública va en un TXT de selector._domainkey.dominio. Sobrevive a los reenvíos." }
- { id: t3, frente: "DMARC", dorso: "TXT de _dmarc.dominio: v=DMARC1; p=none|quarantine|reject; rua=mailto:... Exige que el From coincida con lo que pasó SPF o DKIM." }
- { id: t4, frente: "Camino a DMARC", dorso: "SPF y DKIM en todo lo que manda, p=none con informes, corregir, quarantine, reject." }
- { id: t5, frente: "PTR", dorso: "Registro inverso de la IP que manda; tiene que apuntar a un nombre que vuelva a esa IP. Lo carga el dueño de la IP." }
- { id: t6, frente: "Ver el resultado", dorso: "Encabezado Authentication-Results del correo recibido (en Gmail: Mostrar original): spf=, dkim=, dmarc=." }
- { id: t7, frente: "Requisitos de Gmail, Yahoo y Microsoft", dorso: "Masivos: SPF, DKIM, DMARC alineado, baja con un clic, menos de 0,3 % de quejas. Todos: SPF o DKIM, PTR válido y TLS." }
