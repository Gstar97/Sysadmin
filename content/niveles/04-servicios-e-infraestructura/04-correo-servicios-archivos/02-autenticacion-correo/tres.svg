<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Lo que revisa el servidor que recibe, con el DNS del dominio que manda</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="40" width="260" height="190" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="300" y="40" width="260" height="190" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="580" y="40" width="260" height="190" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="20" y="262" width="820" height="84" rx="8" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="currentColor">
    <line x1="150" y1="230" x2="150" y2="256"/><path d="M150 261 l-4 -7 h8 z"/>
    <line x1="430" y1="230" x2="430" y2="256"/><path d="M430 261 l-4 -7 h8 z"/>
    <line x1="710" y1="230" x2="710" y2="256"/><path d="M710 261 l-4 -7 h8 z"/>
  </g>
  <g fill="currentColor">
    <text x="150" y="62" text-anchor="middle" font-weight="700">SPF</text>
    <text x="34" y="86">¿Este servidor puede mandar correo</text>
    <text x="34" y="104">por el dominio del sobre?</text>
    <text x="34" y="132" font-size="11">TXT de ejemplo.com.ar:</text>
    <text x="34" y="150" font-family="ui-monospace, monospace" font-size="10.5">v=spf1 include:_spf.proveedor.com</text>
    <text x="34" y="166" font-family="ui-monospace, monospace" font-size="10.5">  ip4:203.0.113.40 -all</text>
    <text x="34" y="194" font-size="11">Una lista de quién puede mandar.</text>
    <text x="34" y="212" font-size="11">Se rompe con los reenvíos.</text>
    <text x="430" y="62" text-anchor="middle" font-weight="700">DKIM</text>
    <text x="314" y="86">¿La carta llegó sin cambios y la</text>
    <text x="314" y="104">firmó el dominio que dice?</text>
    <text x="314" y="132" font-size="11">TXT de s1._domainkey.ejemplo.com.ar:</text>
    <text x="314" y="150" font-family="ui-monospace, monospace" font-size="10.5">v=DKIM1; k=rsa; p=MIIBIjANBg…</text>
    <text x="314" y="178" font-size="11">El que manda firma con su clave</text>
    <text x="314" y="194" font-size="11">privada; el DNS publica la pública.</text>
    <text x="314" y="212" font-size="11">Sobrevive a los reenvíos.</text>
    <text x="710" y="62" text-anchor="middle" font-weight="700">DMARC</text>
    <text x="594" y="86">¿El From que ve la persona coincide</text>
    <text x="594" y="104">con un dominio que pasó SPF o DKIM?</text>
    <text x="594" y="132" font-size="11">TXT de _dmarc.ejemplo.com.ar:</text>
    <text x="594" y="150" font-family="ui-monospace, monospace" font-size="10.5">v=DMARC1; p=quarantine;</text>
    <text x="594" y="166" font-family="ui-monospace, monospace" font-size="10.5">  rua=mailto:dmarc@ejemplo.com.ar</text>
    <text x="594" y="194" font-size="11">Y qué hacer si no: nada (none),</text>
    <text x="594" y="212" font-size="11">a spam (quarantine) o rechazar (reject).</text>
    <text x="430" y="288" text-anchor="middle" font-weight="700">Resultado en los encabezados del mensaje recibido</text>
    <text x="430" y="312" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11">Authentication-Results: mx.google.com; dkim=pass header.i=@ejemplo.com.ar;</text>
    <text x="430" y="330" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11">spf=pass smtp.mailfrom=ejemplo.com.ar; dmarc=pass (p=QUARANTINE) header.from=ejemplo.com.ar</text>
  </g>
</svg>
