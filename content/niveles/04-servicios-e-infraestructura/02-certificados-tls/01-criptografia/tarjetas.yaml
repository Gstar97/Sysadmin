- { id: t1, frente: "Los tres problemas", dorso: "Confidencialidad (que no lo lean), integridad (que no lo cambien) y autenticidad (saber quién es)." }
- { id: t2, frente: "Hash", dorso: "Huella de tamaño fijo. SHA-256 sí; MD5 y SHA-1 rotos. Contraseñas: yescrypt, Argon2id o bcrypt." }
- { id: t3, frente: "Cifrado simétrico", dorso: "Una sola clave. AES-GCM o ChaCha20-Poly1305. Rápido: protege los datos." }
- { id: t4, frente: "Cifrado asimétrico", dorso: "Par de claves: la pública se reparte, la privada no sale nunca. RSA 3072, ECDSA P-256, Ed25519." }
- { id: t5, frente: "Firma digital", dorso: "Hash sellado con la privada; se verifica con la pública. Prueba integridad y autoría." }
- { id: t6, frente: "ECDHE", dorso: "Las dos partes calculan la misma clave sin mandarla. Efímero: secreto hacia adelante." }
- { id: t7, frente: "X25519MLKEM768", dorso: "Intercambio híbrido resistente a computadoras cuánticas. Por defecto en navegadores y OpenSSL 3.5." }
- { id: t8, frente: "TLS 1.3", dorso: "Una ida y vuelta: intercambio de claves, certificado, firma del servidor y datos cifrados. TLS 1.0 y 1.1 retirados." }
- { id: t9, frente: "Cadena de confianza", dorso: "Hoja firmada por la intermedia, firmada por la raíz del almacén del cliente. El servidor manda hoja + intermedia." }
