tipo: emparejar
consigna: Uní cada necesidad con la herramienta que la resuelve.
pares:
  - { a: "Comprobar que la ISO que bajaste es la que publicó el proyecto", b: "Un hash (SHA-256) comparado con la lista publicada" }
  - { a: "Que el proveedor sepa que el contrato lo mandaste vos y nadie lo tocó", b: "Una firma digital con tu clave privada" }
  - { a: "Guardar un respaldo que solo abre quien sabe la contraseña", b: "Cifrado simétrico (AES) con una clave derivada de la contraseña" }
  - { a: "Acordar una clave con un servidor que nunca viste, por una red que otros escuchan", b: "Intercambio de claves (ECDHE, X25519)" }
  - { a: "Guardar las contraseñas de los usuarios de una aplicación", b: "Un hash lento y con sal (Argon2id, bcrypt, yescrypt)" }
explicacion: >-
  El hash detecta cambios pero no dice quién hizo el archivo; la firma agrega quién. El cifrado
  simétrico es el que protege los datos (rápido), pero las dos partes necesitan la misma clave: el
  intercambio de claves resuelve cómo acordarla sin mandarla. Y las contraseñas no se cifran (se
  podrían descifrar): se guardan con un hash pensado para ser lento, así probar millones por
  segundo deja de ser posible.
