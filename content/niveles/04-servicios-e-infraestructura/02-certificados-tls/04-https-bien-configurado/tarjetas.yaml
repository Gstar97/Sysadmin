- { id: t1, frente: "Protocolos", dorso: "ssl_protocols TLSv1.2 TLSv1.3; Nada de SSLv3, TLS 1.0 ni 1.1." }
- { id: t2, frente: "Cifrados", dorso: "Los \"intermedios\" de ssl-config.mozilla.org: ECDHE con AES-GCM y CHACHA20. Solo afectan a TLS 1.2." }
- { id: t3, frente: "Redirección", dorso: "server del 80: return 301 https://$host$request_uri;" }
- { id: t4, frente: "HSTS", dorso: "add_header Strict-Transport-Security \"max-age=63072000\" always; Empezar con max-age corto; includeSubDomains y preload con cuidado." }
- { id: t5, frente: "HTTP/2 en nginx", dorso: "http2 on; (desde 1.25.1). HTTP/3: listen 443 quic, para más adelante." }
- { id: t6, frente: "add_header y las location", dorso: "Una location con algún add_header deja de heredar todos los del server." }
- { id: t7, frente: "Encabezados de seguridad", dorso: "nosniff, Referrer-Policy, Content-Security-Policy, frame-ancestors/X-Frame-Options." }
- { id: t8, frente: "Nota de testssl", dorso: "T: confianza. C: 3DES/RC4. B: TLS 1.0/1.1. A: sin HSTS. A+: todo bien y HSTS de 180 días o más." }
- { id: t9, frente: "Política criptográfica (Rocky)", dorso: "update-crypto-policies --show: DEFAULT. No pasar a LEGACY: afecta a todo el servidor." }
