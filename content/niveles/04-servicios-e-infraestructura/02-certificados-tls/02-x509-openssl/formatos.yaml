tipo: emparejar
consigna: Uní cada archivo con lo que tiene adentro.
pares:
  - { a: "tienda.crt (empieza con -----BEGIN CERTIFICATE-----)", b: "Un certificado en PEM: texto en base64, el formato de Linux" }
  - { a: "tienda.der o tienda.cer (no se lee con cat)", b: "Un certificado en DER: binario, común en Windows y Java" }
  - { a: "tienda.pfx o tienda.p12", b: "Certificado, intermedia y clave privada juntos, protegidos con contraseña" }
  - { a: "intranet.csr", b: "Un pedido de certificado: clave pública y datos, para mandar a la CA" }
  - { a: "tienda.key", b: "La clave privada: no se manda nunca y va con permisos 600" }
  - { a: "fullchain.pem", b: "El certificado del servidor seguido de la intermedia" }
explicacion: >-
  La extensión es una costumbre, no una garantía: .crt y .cer pueden ser PEM o DER. Para saberlo,
  file o head -1: si empieza con -----BEGIN, es PEM. openssl x509 -inform DER lee un DER, y
  -outform DER lo convierte.
