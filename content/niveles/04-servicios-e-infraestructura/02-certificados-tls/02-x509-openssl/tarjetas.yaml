- { id: t1, frente: "SAN", dorso: "Subject Alternative Name: los nombres para los que vale. El CN no se usa. *.ejemplo.com cubre un nivel." }
- { id: t2, frente: "Vida máxima de un certificado público", dorso: "200 días desde 15/3/2026, 100 desde 15/3/2027, 47 desde 15/3/2029." }
- { id: t3, frente: "Ver lo importante", dorso: "openssl x509 -in c.pem -noout -subject -issuer -dates -ext subjectAltName" }
- { id: t4, frente: "-checkend", dorso: "openssl x509 -checkend SEGUNDOS: código 1 si vence antes. 30 días = 2592000." }
- { id: t5, frente: "Lo que manda un servidor", dorso: "openssl s_client -connect sitio:443 -servername sitio < /dev/null. Verify return code: 0 (ok)." }
- { id: t6, frente: "¿Clave y certificado son pareja?", dorso: "Comparar openssl x509 -noout -modulus y openssl rsa -noout -modulus, cada uno con | openssl md5." }
- { id: t7, frente: "CSR", dorso: "openssl req -new -newkey rsa:3072 -noenc -keyout k.key -out p.csr -subj '/CN=...' -addext 'subjectAltName=DNS:...'" }
- { id: t8, frente: "Formatos", dorso: "PEM (texto, BEGIN), DER (binario), PFX/P12 (cert + clave + cadena con contraseña), CSR, .key (600)." }
- { id: t9, frente: "Revocación", dorso: "Invalidar un certificado antes de vencer (clave comprometida). CRL u OCSP; Let's Encrypt apagó OCSP en 2025." }
