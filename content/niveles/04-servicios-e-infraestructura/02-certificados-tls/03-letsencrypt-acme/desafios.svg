<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Tres formas de probar que el dominio es tuyo</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="40" width="270" height="250" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="295" y="40" width="270" height="250" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="580" y="40" width="270" height="250" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="10" y="302" width="840" height="30" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g fill="currentColor">
    <text x="145" y="62" text-anchor="middle" font-weight="700">HTTP-01 (el más común)</text>
    <text x="22" y="86">Let's Encrypt pide, desde internet:</text>
    <text x="22" y="104" font-family="ui-monospace, monospace" font-size="10.5">http://dominio/.well-known/</text>
    <text x="22" y="120" font-family="ui-monospace, monospace" font-size="10.5">  acme-challenge/TOKEN</text>
    <text x="22" y="144">Necesita: el DNS público apuntando</text>
    <text x="22" y="162">al servidor y el puerto 80 abierto</text>
    <text x="22" y="180">desde internet.</text>
    <text x="22" y="204">certbot --nginx o --webroot</text>
    <text x="22" y="228">No sirve para comodines</text>
    <text x="22" y="246">(*.ejemplo.com) ni para servidores</text>
    <text x="22" y="264">que no se ven desde internet.</text>
    <text x="430" y="62" text-anchor="middle" font-weight="700">DNS-01</text>
    <text x="307" y="86">Hay que publicar un registro TXT:</text>
    <text x="307" y="104" font-family="ui-monospace, monospace" font-size="10.5">_acme-challenge.dominio</text>
    <text x="307" y="128">Necesita: poder cambiar el DNS</text>
    <text x="307" y="146">automáticamente (la API del</text>
    <text x="307" y="164">proveedor de DNS y una clave).</text>
    <text x="307" y="188">Sirve para comodines y para</text>
    <text x="307" y="206">servidores internos, que no se</text>
    <text x="307" y="224">ven desde internet.</text>
    <text x="307" y="248">Cuidado: la clave del DNS puede</text>
    <text x="307" y="266">cambiar todo el dominio.</text>
    <text x="715" y="62" text-anchor="middle" font-weight="700">TLS-ALPN-01</text>
    <text x="592" y="86">La prueba va dentro de una</text>
    <text x="592" y="104">conexión TLS al puerto 443.</text>
    <text x="592" y="128">Necesita: el 443 abierto y un</text>
    <text x="592" y="146">programa que lo soporte (Caddy,</text>
    <text x="592" y="164">Traefik, mod_md de Apache).</text>
    <text x="592" y="188">Para cuando el 80 está cerrado.</text>
    <text x="592" y="212">certbot no lo usa: con certbot,</text>
    <text x="592" y="230">HTTP-01 o DNS-01.</text>
    <text x="430" y="322" text-anchor="middle">En todos los casos, después de validar: certbot manda el pedido (CSR), recibe el certificado y lo renueva solo.</text>
  </g>
</svg>
