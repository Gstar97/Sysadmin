- { id: t1, frente: "ACME", dorso: "Protocolo (RFC 8555) para pedir certificados automáticamente: cuenta, desafío, CSR, certificado, renovación." }
- { id: t2, frente: "HTTP-01", dorso: "Token en http://dominio/.well-known/acme-challenge/. DNS público y puerto 80 abiertos desde internet. Sin comodines." }
- { id: t3, frente: "DNS-01", dorso: "Registro TXT en _acme-challenge. Sirve para comodines y servidores internos. Necesita la API del DNS." }
- { id: t4, frente: "Staging", dorso: "certbot --staging: límites altos, raíz falsa. Ensayar ahí antes de producción." }
- { id: t5, frente: "certbot --nginx", dorso: "Valida, instala en nginx (listen 443, certificados, redirección) y recarga al renovar." }
- { id: t6, frente: "certbot certonly --webroot", dorso: "Solo obtiene el certificado dejando el token en la carpeta. Necesita deploy hook para recargar." }
- { id: t7, frente: "Archivos de certbot", dorso: "/etc/letsencrypt/live/NOMBRE/fullchain.pem y privkey.pem (enlaces a archive/)." }
- { id: t8, frente: "Renovación", dorso: "Temporizador de systemd (Rocky: certbot-renew.timer, apagado de fábrica). certbot renew --dry-run para ensayar." }
- { id: t9, frente: "Duración en Let's Encrypt", dorso: "90 días hoy (45 con tlsserver), 64 desde febrero de 2027, 45 desde febrero de 2028. Sin correos de aviso." }
