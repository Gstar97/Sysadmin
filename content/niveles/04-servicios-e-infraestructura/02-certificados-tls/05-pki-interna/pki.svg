<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Una PKI interna: quién firma y quién confía</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="40" width="250" height="80" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="10" y="150" width="250" height="80" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="10" y="260" width="250" height="80" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="330" y="40" width="520" height="300" rx="8" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="currentColor">
    <line x1="135" y1="120" x2="135" y2="144"/><path d="M135 149 l-4 -7 h8 z"/>
    <line x1="135" y1="230" x2="135" y2="254"/><path d="M135 259 l-4 -7 h8 z"/>
    <line x1="260" y1="80" x2="324" y2="80" stroke-dasharray="4 3"/><path d="M329 80 l-7 -4 v8 z"/>
  </g>
  <g fill="currentColor">
    <text x="135" y="62" text-anchor="middle" font-weight="700">CA raíz: Ejemplo Root CA</text>
    <text x="135" y="82" text-anchor="middle">10 a 20 años · CA:TRUE</text>
    <text x="135" y="102" text-anchor="middle">clave guardada fuera de línea</text>
    <text x="135" y="172" text-anchor="middle" font-weight="700">CA intermedia (en ca01)</text>
    <text x="135" y="192" text-anchor="middle">firma todos los días · 3 a 5 años</text>
    <text x="135" y="212" text-anchor="middle">openssl, step-ca (con ACME) o AD CS</text>
    <text x="135" y="282" text-anchor="middle" font-weight="700">Servidores internos</text>
    <text x="135" y="302" text-anchor="middle">intranet, wiki, impresoras, paneles</text>
    <text x="135" y="322" text-anchor="middle">un año o menos · renovación automática</text>
    <text x="290" y="72" text-anchor="middle" font-size="10.5">se reparte</text>
    <text x="344" y="62" font-weight="700">Dónde tiene que estar la raíz para que confíen</text>
    <text x="344" y="88" font-weight="700">Rocky</text>
    <text x="430" y="88" font-family="ui-monospace, monospace" font-size="10.5">/etc/pki/ca-trust/source/anchors/ + update-ca-trust</text>
    <text x="344" y="110" font-weight="700">Ubuntu</text>
    <text x="430" y="110" font-family="ui-monospace, monospace" font-size="10.5">/usr/local/share/ca-certificates/*.crt + update-ca-certificates</text>
    <text x="344" y="132" font-weight="700">Windows</text>
    <text x="446" y="132">GPO: Entidades de certificación raíz de confianza</text>
    <text x="344" y="154" font-weight="700">Firefox</text>
    <text x="446" y="154">tiene su propio almacén: política ImportEnterpriseRoots</text>
    <text x="344" y="176" font-weight="700">Java</text>
    <text x="446" y="176">su propio almacén (cacerts): keytool -importcert</text>
    <text x="344" y="198" font-weight="700">Python</text>
    <text x="446" y="198">requests usa certifi: REQUESTS_CA_BUNDLE o truststore</text>
    <text x="344" y="220" font-weight="700">Contenedores</text>
    <text x="446" y="220">cada imagen tiene su almacén: copiar la raíz al construirla</text>
    <text x="344" y="242" font-weight="700">Celulares</text>
    <text x="446" y="242">un perfil del sistema de gestión (MDM)</text>
    <text x="344" y="276" font-weight="700">La regla:</text>
    <text x="414" y="276">cada programa confía en su propio almacén. Si uno anda y otro no,</text>
    <text x="344" y="296">casi siempre es eso. Y cada equipo nuevo necesita la raíz antes de usar</text>
    <text x="344" y="316">cualquier servicio interno: va en la imagen o en la automatización.</text>
  </g>
</svg>
