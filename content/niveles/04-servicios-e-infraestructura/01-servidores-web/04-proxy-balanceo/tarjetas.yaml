- { id: t1, frente: "Proxy inverso", dorso: "Punto de entrada del lado de los servidores: HTTPS, balanceo, protección y estáticos. Las apps escuchan en 127.0.0.1." }
- { id: t2, frente: "proxy_pass y la barra", dorso: "Sin ruta: la URI pasa entera. Con ruta (aunque sea /): reemplaza el prefijo de la location." }
- { id: t3, frente: "Encabezados para la app", dorso: "Host $host, X-Real-IP $remote_addr, X-Forwarded-For $proxy_add_x_forwarded_for, X-Forwarded-Proto $scheme." }
- { id: t4, frente: "502 contra 504", dorso: "502: no pudo hablar con el upstream (caído, SELinux, socket). 504: tardó más que proxy_read_timeout." }
- { id: t5, frente: "upstream", dorso: "Round robin, least_conn, ip_hash, weight, backup, max_fails y fail_timeout (controles pasivos)." }
- { id: t6, frente: "WebSockets", dorso: "proxy_http_version 1.1; Upgrade $http_upgrade; Connection \"upgrade\"." }
- { id: t7, frente: "SELinux y el proxy", dorso: "setsebool -P httpd_can_network_connect 1. Sin eso: (13: Permission denied) y 502." }
- { id: t8, frente: "HAProxy", dorso: "Balanceador dedicado HTTP y TCP, con controles activos (check, httpchk) y estadísticas." }
