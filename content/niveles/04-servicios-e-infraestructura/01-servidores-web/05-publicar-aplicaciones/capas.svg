<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Tres aplicaciones, el mismo esquema</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="40" width="840" height="56" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="10" y="112" width="270" height="134" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="295" y="112" width="270" height="134" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="580" y="112" width="270" height="134" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="10" y="262" width="840" height="58" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g fill="currentColor">
    <text x="430" y="62" text-anchor="middle" font-weight="700">nginx (o Apache) adelante: HTTPS, archivos estáticos, límites</text>
    <text x="430" y="82" text-anchor="middle">PHP: fastcgi_pass al socket de PHP-FPM · Python y Node: proxy_pass a 127.0.0.1:puerto o a un socket</text>
    <text x="145" y="134" text-anchor="middle" font-weight="700">PHP con PHP-FPM</text>
    <text x="22" y="156">un pool de procesos PHP (www)</text>
    <text x="22" y="174">escucha en un socket:</text>
    <text x="22" y="192" font-family="ui-monospace, monospace" font-size="11">/run/php-fpm/www.sock (Rocky)</text>
    <text x="22" y="210" font-family="ui-monospace, monospace" font-size="11">/run/php/php8.5-fpm.sock (Ubuntu)</text>
    <text x="22" y="232">servicio: php-fpm / php8.5-fpm</text>
    <text x="430" y="134" text-anchor="middle" font-weight="700">Python con gunicorn</text>
    <text x="307" y="156">la aplicación en su venv</text>
    <text x="307" y="174">gunicorn (WSGI) o uvicorn (ASGI)</text>
    <text x="307" y="192" font-family="ui-monospace, monospace" font-size="11">--bind 127.0.0.1:8001</text>
    <text x="307" y="210">workers: 2 × núcleos + 1</text>
    <text x="307" y="232">servicio propio: pedidos.service</text>
    <text x="715" y="134" text-anchor="middle" font-weight="700">Node.js</text>
    <text x="592" y="156">node server.js</text>
    <text x="592" y="174">el puerto sale de una variable:</text>
    <text x="592" y="192" font-family="ui-monospace, monospace" font-size="11">Environment=PORT=3000</text>
    <text x="592" y="210" font-family="ui-monospace, monospace" font-size="11">Environment=NODE_ENV=production</text>
    <text x="592" y="232">servicio propio: intranet.service</text>
    <text x="430" y="284" text-anchor="middle" font-weight="700">systemd: un usuario propio, reinicio si se cae y logs en el journal</text>
    <text x="430" y="304" text-anchor="middle">User=, WorkingDirectory=, ExecStart=, Restart=on-failure · journalctl -u pedidos · nunca como root</text>
  </g>
</svg>
