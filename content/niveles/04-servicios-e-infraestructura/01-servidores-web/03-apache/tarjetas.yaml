- { id: t1, frente: "Apache en Rocky y en Ubuntu", dorso: "Rocky: httpd, conf.d, conf.modules.d. Ubuntu: apache2, sites-/mods-available y enabled, a2ensite, a2enmod." }
- { id: t2, frente: "VirtualHost", dorso: "Un sitio: ServerName, ServerAlias, DocumentRoot. Si nada coincide, contesta el primero del puerto." }
- { id: t3, frente: "Directory", dorso: "Require (quién entra), Options (-Indexes), AllowOverride (qué pueden cambiar los .htaccess)." }
- { id: t4, frente: ".htaccess", dorso: "Se lee en cada pedido, vale para las subcarpetas y solo si AllowOverride lo permite." }
- { id: t5, frente: "Invalid command ... module not included", dorso: "Falta cargar un módulo: apachectl -M, a2enmod y restart." }
- { id: t6, frente: "MPM", dorso: "prefork (procesos), worker (hilos), event (hilos y keep-alive barato, el de fábrica)." }
- { id: t7, frente: "Probar Apache", dorso: "apachectl configtest (o apache2ctl), apachectl -S para los hosts virtuales." }
