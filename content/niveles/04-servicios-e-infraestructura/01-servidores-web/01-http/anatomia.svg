<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Una solicitud y su respuesta, tal como viajan</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="40" width="410" height="250" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="440" y="40" width="410" height="250" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="22" y="66" width="386" height="26" rx="4" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="22" y="98" width="386" height="96" rx="4" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="22" y="214" width="386" height="44" rx="4" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="452" y="66" width="386" height="26" rx="4" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="452" y="98" width="386" height="96" rx="4" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="452" y="214" width="386" height="44" rx="4" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="215" y="58" text-anchor="middle" font-weight="700">Solicitud (el cliente pide)</text>
    <text x="645" y="58" text-anchor="middle" font-weight="700">Respuesta (el servidor contesta)</text>
  </g>
  <g fill="currentColor" font-family="ui-monospace, monospace" font-size="11.5">
    <text x="30" y="84">POST /productos HTTP/1.1</text>
    <text x="30" y="114">Host: tienda.ejemplo.com</text>
    <text x="30" y="131">User-Agent: curl/8.12.1</text>
    <text x="30" y="148">Content-Type: application/json</text>
    <text x="30" y="165">Authorization: Bearer abc123</text>
    <text x="30" y="182">Content-Length: 18</text>
    <text x="30" y="232">{"nombre":"Termo"}</text>
    <text x="460" y="84">HTTP/1.1 201 Created</text>
    <text x="460" y="114">Server: nginx</text>
    <text x="460" y="131">Content-Type: application/json</text>
    <text x="460" y="148">Location: /productos/10</text>
    <text x="460" y="165">Set-Cookie: sesion=7f2a; HttpOnly</text>
    <text x="460" y="182">Content-Length: 42</text>
    <text x="460" y="232">{"id":10,"nombre":"Termo"}</text>
  </g>
  <g fill="currentColor" font-size="11">
    <text x="30" y="208">(línea vacía: terminan los encabezados)</text>
    <text x="30" y="252">cuerpo (opcional: lo llevan POST y PUT)</text>
    <text x="460" y="208">(línea vacía)</text>
    <text x="460" y="252">cuerpo: la página, el JSON, el archivo</text>
    <text x="22" y="278">Línea 1: método, ruta y versión. Después, "Nombre: valor".</text>
    <text x="452" y="278">Línea 1: versión, código y su texto. Después, encabezados.</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="10" y="304" width="164" height="86" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="181" y="304" width="164" height="86" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="352" y="304" width="164" height="86" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="523" y="304" width="164" height="86" rx="8" fill="var(--bad-soft, #fde2e1)"/>
    <rect x="694" y="304" width="156" height="86" rx="8" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="currentColor">
    <text x="92" y="324" text-anchor="middle" font-weight="700">2xx: salió bien</text>
    <text x="92" y="344" text-anchor="middle">200 OK</text>
    <text x="92" y="362" text-anchor="middle">201 Created</text>
    <text x="92" y="380" text-anchor="middle">204 No Content</text>
    <text x="263" y="324" text-anchor="middle" font-weight="700">3xx: está en otro lado</text>
    <text x="263" y="344" text-anchor="middle">301 / 308 se mudó</text>
    <text x="263" y="362" text-anchor="middle">302 / 307 por ahora</text>
    <text x="263" y="380" text-anchor="middle">304 no cambió</text>
    <text x="434" y="324" text-anchor="middle" font-weight="700">4xx: error del pedido</text>
    <text x="434" y="344" text-anchor="middle">400 mal formado</text>
    <text x="434" y="362" text-anchor="middle">401 / 403 sin permiso</text>
    <text x="434" y="380" text-anchor="middle">404 no · 405 método</text>
    <text x="605" y="324" text-anchor="middle" font-weight="700">5xx: error del servidor</text>
    <text x="605" y="344" text-anchor="middle">500 falló la app</text>
    <text x="605" y="362" text-anchor="middle">502 / 504 el proxy</text>
    <text x="605" y="380" text-anchor="middle">503 no disponible</text>
    <text x="772" y="324" text-anchor="middle" font-weight="700">Para recordar</text>
    <text x="772" y="344" text-anchor="middle">4xx: mirá el pedido</text>
    <text x="772" y="362" text-anchor="middle">5xx: mirá los logs</text>
    <text x="772" y="380" text-anchor="middle">del servidor</text>
  </g>
</svg>
