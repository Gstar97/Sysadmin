- { id: t1, frente: "Partes de un pedido HTTP", dorso: "Primera línea (método, ruta, versión), encabezados, línea vacía y cuerpo (opcional)." }
- { id: t2, frente: "Familias de códigos", dorso: "2xx bien, 3xx en otro lado, 4xx error del pedido, 5xx error del servidor (mirá sus logs)." }
- { id: t3, frente: "401 contra 403", dorso: "401: faltan credenciales o no sirven. 403: hay permiso denegado aunque sepa quién sos." }
- { id: t4, frente: "Idempotente", dorso: "Repetirlo deja lo mismo que hacerlo una vez: GET, PUT, DELETE. POST no." }
- { id: t5, frente: "Host", dorso: "Qué sitio se pide. Permite muchos sitios en una IP. Obligatorio en HTTP/1.1." }
- { id: t6, frente: "Cookie de sesión", dorso: "Set-Cookie en la respuesta, Cookie en cada pedido. Con HttpOnly, Secure y SameSite." }
- { id: t7, frente: "HTTP/2 y HTTP/3", dorso: "HTTP/2: binario y multiplexado sobre TCP con TLS. HTTP/3: sobre QUIC, UDP 443." }
- { id: t8, frente: "curl para mirar", dorso: "-I encabezados, -i con cuerpo, -v conversación, -L sigue 3xx, -H encabezado, -d datos, -w tiempos." }
