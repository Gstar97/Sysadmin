tipo: emparejar
consigna: Con las cinco location del ejemplo de arriba, uní cada pedido con la location que lo atiende.
pares:
  - { a: "/", b: "A: location = /" }
  - { a: "/contacto", b: "B: location /" }
  - { a: "/api/clientes", b: "C: location /api/" }
  - { a: "/estaticos/logo.png", b: "D: location ^~ /estaticos/" }
  - { a: "/api/logo.PNG", b: "E: location ~* \\.(png|jpg)$" }
explicacion: >-
  "/" coincide exacto con A. "/contacto" solo coincide con el prefijo /. "/api/clientes" tiene
  como prefijo más largo /api/ y ninguna regex coincide. En "/estaticos/logo.png" el prefijo más
  largo es ^~ /estaticos/, así que gana sin probar las regex. En "/api/logo.PNG" el prefijo más
  largo es /api/ (sin ^~): se prueban las regex y ~* (sin distinguir mayúsculas) coincide.
