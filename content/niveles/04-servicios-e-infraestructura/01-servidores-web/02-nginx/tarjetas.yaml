- { id: t1, frente: "Contextos de nginx", dorso: "main, events, http, server, location. Lo de afuera se hereda adentro." }
- { id: t2, frente: "Dónde van los sitios", dorso: "Rocky: /etc/nginx/conf.d/*.conf. Ubuntu: sites-available + enlace en sites-enabled." }
- { id: t3, frente: "Elección del server", dorso: "Puerto (listen), después Host contra server_name; si nada coincide, default_server o el primero leído." }
- { id: t4, frente: "Elección de location", dorso: "= exacta; ^~ prefijo que corta; regex ~ y ~* en orden; si no, prefijo más largo." }
- { id: t5, frente: "Probar y aplicar", dorso: "nginx -t && systemctl reload nginx. nginx -T muestra todo lo cargado." }
- { id: t6, frente: "reload contra restart", dorso: "reload no corta y, si falla, deja la configuración vieja. restart corta." }
- { id: t7, frente: "try_files", dorso: "try_files $uri $uri/ =404; archivo, carpeta o 404. Para aplicaciones de una página: /index.html al final." }
- { id: t8, frente: "Logs de nginx", dorso: "access.log: qué pasó. error.log: por qué (Permission denied, No such file, connect() failed)." }
