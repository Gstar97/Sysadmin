<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Recuperar hasta un minuto antes del error: respaldo completo + binlog</text>
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="40" y1="120" x2="830" y2="120"/>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="40" y="140">00:00</text><text x="171" y="140">02:00</text><text x="303" y="140">04:00</text><text x="435" y="140">06:00</text><text x="566" y="140">08:00</text><text x="698" y="140">10:00</text><text x="830" y="140">12:00</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="170" y="36" width="70" height="46" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="40" y="88" width="767" height="18" rx="4" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="807" y="64" width="6" height="56" fill="var(--danger, #c0392b)" stroke="none"/>
  </g>
  <g fill="currentColor">
    <text x="205" y="55" text-anchor="middle" font-weight="700">respaldo</text>
    <text x="205" y="72" text-anchor="middle" font-size="11">02:30</text>
    <text x="520" y="101" text-anchor="middle" font-size="11">binlog: cada cambio, con su hora y su posición</text>
    <text x="790" y="56" text-anchor="middle" font-weight="700">11:42 DELETE</text>
    <line x1="205" y1="82" x2="205" y2="120" stroke="currentColor" stroke-dasharray="3 3"/><circle cx="380" cy="120" r="4"/><circle cx="520" cy="120" r="4"/><circle cx="650" cy="120" r="4"/><circle cx="740" cy="120" r="4"/>
    <text x="520" y="160" text-anchor="middle" font-size="11">pedidos, cambios de precios, clientes nuevos...</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="40" y="180" width="380" height="110" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="440" y="180" width="390" height="110" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g fill="currentColor">
    <text x="54" y="202" font-weight="700">Para recuperar</text>
    <text x="54" y="222">1. Cargar el respaldo de las 02:30.</text>
    <text x="54" y="240">2. Aplicar el binlog desde la posición que anotó</text>
    <text x="54" y="258">   el respaldo hasta justo antes del DELETE.</text>
    <text x="54" y="278" font-size="11">mysqlbinlog --start-position=… --stop-position=… | mysql</text>
    <text x="454" y="202" font-weight="700">Las dos preguntas del negocio</text>
    <text x="454" y="222">RPO: ¿cuántos datos podemos perder? Solo con el</text>
    <text x="454" y="240">respaldo, hasta un día; con el binlog, casi nada.</text>
    <text x="454" y="262">RTO: ¿cuánto podemos estar sin servicio? Lo que</text>
    <text x="454" y="280">tarda la restauración: se mide probándola.</text>
  </g>
</svg>
