tipo: troubleshooting
titulo: Se borró la tabla de productos a las 11:42
descripcion: >-
  Incidente simulado. La tienda online de una distribuidora de muebles usa MariaDB 10.11 en db01
  (Rocky Linux 10), con el binlog activado y un respaldo con mysqldump todas las noches a las
  02:30. db02 es el servidor de pruebas. Es jueves, el día de más pedidos de la semana. Cada
  decisión suma minutos.
inicio: n1
nodos:
  n1:
    situacion: >-
      Jueves, 11:47. Ventas avisa que la tienda muestra una página de error en el catálogo. El
      carrito y el registro de clientes siguen funcionando. Entrás a db01.
    evidencia:
      - titulo: tail -n 2 /var/log/tienda/app.log (en web01)
        contenido: |
          [2026-11-19 11:46:58] ERROR SQLSTATE[42S02]: Base table or view not found: 1146 Table 'tienda.productos' doesn't exist
          [2026-11-19 11:47:03] ERROR SQLSTATE[42S02]: Base table or view not found: 1146 Table 'tienda.productos' doesn't exist
      - titulo: sudo mysql tienda -e 'SHOW TABLES'
        contenido: |
          +------------------+
          | Tables_in_tienda |
          +------------------+
          | clientes         |
          | detalle_pedidos  |
          | pedidos          |
          +------------------+
      - titulo: Un mensaje en el chat del equipo
        contenido: |
          Juan (desarrollo), 11:45: ¿alguien tocó la base? Corrí la migración nueva y creo que me
          equivoqué de servidor 😬
    opciones:
      - texto: Poner la tienda en mantenimiento y buscar en el binlog exactamente qué pasó y cuándo
        ir_a: n_binlog
        minutos: 4
      - texto: Restaurar ya el respaldo de las 02:30 encima de la base tienda de producción
        ir_a: n1
        minutos: 3
        consecuencia: >-
          Te frena una compañera antes de dar Enter: el respaldo trae las cuatro tablas, así que
          pisaría también clientes y pedidos. Los 214 pedidos y 37 clientes nuevos de esta mañana
          desaparecerían, y la tabla borrada volvería como estaba a las 02:30, sin los cambios de
          precios y de stock de hoy.
      - texto: Crear la tabla productos vacía para que la tienda deje de dar error
        ir_a: n1
        minutos: 5
        consecuencia: >-
          La tienda deja de mostrar el error y pasa a mostrar un catálogo vacío. Peor: si alguien
          carga un producto, el binlog suma cambios que después vas a tener que separar. Primero
          se entiende qué pasó; después se recupera.
  n_binlog:
    situacion: >-
      La tienda está en mantenimiento desde las 11:51. En el binlog aparece el borrado con su hora
      y su posición, y justo antes, lo último que se hizo en la tabla.
    evidencia:
      - titulo: sudo mysqlbinlog /var/lib/mysql/mariadb-bin.000118 | grep -B6 'DROP TABLE'
        contenido: |
          # at 1849104
          #261119 11:42:01 server id 1  end_log_pos 1849302 CRC32 0x5c1e88a0  Query  thread_id=8790  exec_time=0  error_code=0
          SET TIMESTAMP=1795088521/*!*/;
          UPDATE productos SET stock = stock - 2 WHERE id = 412
          /*!*/;
          # at 1849302
          #261119 11:42:07 server id 1  end_log_pos 1849421 CRC32 0x0b7a51f3  Query  thread_id=8812  exec_time=0  error_code=0
          SET TIMESTAMP=1795088527/*!*/;
          DROP TABLE `productos` /* generated by server */
      - titulo: sudo ls -l /var/backups/db/ | tail -n 2
        contenido: |
          -rw-r-----. 1 root root 18402311 Nov 18 02:30 tienda-2026-11-18-0230.sql.gz
          -rw-r-----. 1 root root 18577904 Nov 19 02:30 tienda-2026-11-19-0230.sql.gz
    opciones:
      - texto: >-
          Restaurar el respaldo de hoy en db02 y aplicarle el binlog desde la posición que anotó
          el respaldo hasta 1849302, justo antes del DROP
        ir_a: n_restaurar
        minutos: 6
      - texto: Aplicar el binlog hasta --stop-datetime="2026-11-19 11:42:00", que es más fácil de escribir
        ir_a: n_binlog
        minutos: 3
        consecuencia: >-
          Te quedarías afuera el UPDATE de stock de las 11:42:01, que vino después de esa hora:
          un producto mostraría dos unidades más de las que hay. La posición (# at 1849302) corta
          exacto antes del DROP, sin perder ni repetir nada.
      - texto: Hacer todo en db01, para no perder tiempo copiando archivos
        ir_a: n_binlog
        minutos: 3
        consecuencia: >-
          Para restaurar en db01 habría que pisar las tablas que están bien, o armar una base
          paralela en el mismo servidor que atiende a la tienda, con riesgo de equivocarse otra
          vez de base. En otro servidor, producción no se toca hasta tener la tabla comprobada.
  n_restaurar:
    situacion: >-
      En db02 restaurás el respaldo de las 02:30 en una base nueva y le aplicás el binlog. La
      tabla productos aparece con sus 1284 productos y el último cambio de stock de las 11:42:01.
    evidencia:
      - titulo: Lo que hiciste en db02
        contenido: |
          $ zcat /tmp/tienda-2026-11-19-0230.sql.gz | grep 'CHANGE MASTER'
          -- CHANGE MASTER TO MASTER_LOG_FILE='mariadb-bin.000118', MASTER_LOG_POS=88231;
          $ sudo mysql -e 'CREATE DATABASE tienda_rescate'
          $ zcat /tmp/tienda-2026-11-19-0230.sql.gz | sudo mysql tienda_rescate
          $ mysqlbinlog --database=tienda --start-position=88231 --stop-position=1849302 /tmp/mariadb-bin.000118 | sudo mysql tienda_rescate
          $ sudo mysql tienda_rescate -e 'SELECT count(*), max(actualizado) FROM productos'
          +----------+---------------------+
          | count(*) | max(actualizado)    |
          +----------+---------------------+
          |     1284 | 2026-11-19 11:42:01 |
          +----------+---------------------+
    opciones:
      - texto: >-
          Exportar solo la tabla productos desde db02 (mysqldump tienda_rescate productos), cargarla
          en la base tienda de db01, comprobar y sacar la tienda de mantenimiento
        ir_a: n_despues
        minutos: 8
      - texto: Copiar el archivo productos.ibd de db02 a /var/lib/mysql/tienda/ de db01
        ir_a: n_restaurar
        minutos: 6
        consecuencia: >-
          MariaDB no reconoce una tabla InnoDB por copiar su archivo: cada tabla está registrada
          en el diccionario interno del servidor. Se puede hacer con ALTER TABLE ... IMPORT
          TABLESPACE, pero es un procedimiento delicado que queda para más adelante. Un mysqldump
          de una tabla son unos pocos MB y se carga en segundos.
      - texto: Apuntar la tienda a db02 mientras tanto
        ir_a: n_restaurar
        minutos: 7
        consecuencia: >-
          db02 es el servidor de pruebas: sin respaldos, sin monitoreo y con los pedidos de las
          11:42. Los pedidos que entraran ahí habría que pasarlos a mano a db01 después.
  n_despues:
    situacion: >-
      12:26. La tienda vuelve a funcionar, con el catálogo completo. Faltan las preguntas de
      siempre: por qué pasó y qué cambia para que no vuelva a pasar.
    evidencia:
      - titulo: sudo mysql -e "SHOW GRANTS FOR 'juan'@'192.168.10.%'"
        contenido: |
          GRANT ALL PRIVILEGES ON *.* TO `juan`@`192.168.10.%` IDENTIFIED BY PASSWORD '*7E1A...'
      - titulo: El archivo de configuración de la herramienta de migraciones, en la PC de Juan
        contenido: |
          # pruebas
          #DB_HOST=db02
          # produccion
          DB_HOST=db01
    opciones:
      - texto: >-
          Escribir el informe del incidente sin buscar culpables, dejar a los programadores con
          solo lectura en producción y hacer que las migraciones las corra una cuenta de
          despliegue, con aviso previo
        ir_a: n_ok
        minutos: 10
      - texto: Borrar la cuenta de Juan
        ir_a: n_despues
        minutos: 3
        consecuencia: >-
          El problema no es Juan: cualquiera con ALL PRIVILEGES en producción y un archivo que
          cambia de servidor con un comentario podía hacer lo mismo. Y la próxima vez, quien se
          equivoque va a tardar más en avisar. Juan avisó a los tres minutos, y eso ayudó.
      - texto: Agregar una réplica de db01 para que esto no vuelva a pasar
        ir_a: n_despues
        minutos: 3
        consecuencia: >-
          La réplica hubiera repetido el DROP TABLE en un segundo. Sirve si se rompe el servidor,
          no para volver atrás de un error. Lo que salvó el día fue el respaldo más el binlog.
  n_ok:
    final: exito
    resumen: >-
      Un DROP TABLE a las 11:42:07, desde la PC de un programador que creía estar en el servidor
      de pruebas, con una cuenta que tenía todos los permisos en producción. Se recuperó sin
      perder nada: se puso la tienda en mantenimiento, se buscó el borrado en el binlog (posición
      1849302), se restauró el respaldo de las 02:30 en otro servidor, se le aplicó el binlog desde
      la posición que anotó el respaldo hasta justo antes del DROP, y se trajo a producción solo la
      tabla borrada. Fueron 39 minutos de catálogo caído, y ningún pedido perdido. Sin binlog, se
      hubieran perdido los cambios de nueve horas. Lo que cambia: las cuentas personales tienen
      solo lectura en producción, los cambios de estructura los aplica una cuenta de despliegue
      con aviso y fuera de horario, y la prueba de restauración (que ya se hacía todos los meses)
      ahora incluye este procedimiento de recuperación al minuto, para tenerlo practicado.
