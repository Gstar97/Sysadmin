- { id: t1, frente: "Base relacional", dorso: "Tablas con filas y columnas tipadas, relacionadas por claves. MariaDB, PostgreSQL, SQL Server, Oracle." }
- { id: t2, frente: "Clave primaria y foránea", dorso: "Primaria: identifica cada fila, no se repite. Foránea: apunta a la primaria de otra tabla." }
- { id: t3, frente: "SELECT", dorso: "SELECT columnas FROM tabla WHERE condición ORDER BY columna DESC LIMIT n;" }
- { id: t4, frente: "JOIN y GROUP BY", dorso: "JOIN ... ON une tablas por su relación. GROUP BY agrupa para count(), sum(), avg()." }
- { id: t5, frente: "UPDATE y DELETE", dorso: "Siempre con WHERE. Antes, un SELECT con el mismo WHERE." }
- { id: t6, frente: "Transacción", dorso: "START TRANSACTION (o BEGIN) ... COMMIT para confirmar, ROLLBACK para deshacer." }
- { id: t7, frente: "ACID", dorso: "Atomicidad, Consistencia, aIslamiento y Durabilidad: lo confirmado queda, lo cortado se deshace." }
- { id: t8, frente: "Familias de SQL", dorso: "DDL (CREATE, ALTER, DROP), DML (SELECT, INSERT, UPDATE, DELETE), DCL (GRANT, REVOKE), transacciones." }
