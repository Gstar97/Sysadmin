tipo: emparejar
consigna: Uní cada sentencia con lo que hace.
pares:
  - { a: "CREATE TABLE / ALTER TABLE / DROP TABLE", b: "Crear, cambiar o borrar la estructura (DDL)" }
  - { a: "SELECT", b: "Leer datos, sin cambiar nada" }
  - { a: "INSERT / UPDATE / DELETE", b: "Agregar, cambiar o borrar filas (DML)" }
  - { a: "GRANT / REVOKE", b: "Dar o quitar permisos a un usuario (DCL)" }
  - { a: "START TRANSACTION / COMMIT / ROLLBACK", b: "Agrupar cambios y confirmarlos o deshacerlos juntos" }
explicacion: >-
  Como administrador vas a usar mucho SELECT (para mirar), GRANT y REVOKE (para los usuarios de
  las aplicaciones) y las transacciones (para tocar datos a mano sin miedo). El DDL lo suelen
  escribir los programadores, en scripts de "migración" que vos ejecutás en cada versión.
