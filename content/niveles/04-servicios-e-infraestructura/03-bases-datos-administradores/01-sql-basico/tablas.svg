<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Base de datos tienda: dos tablas relacionadas</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="44" width="330" height="170" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="20" y="44" width="330" height="26" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="460" y="44" width="380" height="170" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="460" y="44" width="380" height="26" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="20" y="236" width="820" height="84" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g stroke="currentColor" stroke-width="0.6" opacity="0.6">
    <line x1="20" y1="98" x2="350" y2="98"/><line x1="20" y1="126" x2="350" y2="126"/><line x1="20" y1="154" x2="350" y2="154"/><line x1="20" y1="182" x2="350" y2="182"/>
    <line x1="70" y1="70" x2="70" y2="214"/><line x1="230" y1="70" x2="230" y2="214"/>
    <line x1="460" y1="98" x2="840" y2="98"/><line x1="460" y1="126" x2="840" y2="126"/><line x1="460" y1="154" x2="840" y2="154"/><line x1="460" y1="182" x2="840" y2="182"/>
    <line x1="510" y1="70" x2="510" y2="214"/><line x1="610" y1="70" x2="610" y2="214"/><line x1="720" y1="70" x2="720" y2="214"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <path d="M 458 112 L 360 112"/>
  </g>
  <path d="M 350 112 l 9 -5 v 10 z" fill="currentColor"/>
  <g fill="currentColor">
    <text x="185" y="62" text-anchor="middle" font-weight="700">clientes</text>
    <text x="30" y="89" font-weight="700">id 🔑</text><text x="80" y="89" font-weight="700">nombre</text><text x="240" y="89" font-weight="700">email</text>
    <text x="30" y="117">1</text><text x="80" y="117">Muebles del Sur</text><text x="240" y="117">compras@mds…</text>
    <text x="30" y="145">2</text><text x="80" y="145">Oficinas Norte</text><text x="240" y="145">pagos@on…</text>
    <text x="30" y="173">3</text><text x="80" y="173">Estudio Ríos</text><text x="240" y="173">admin@er…</text>
    <text x="30" y="201" opacity="0.6">…</text>
    <text x="650" y="62" text-anchor="middle" font-weight="700">pedidos</text>
    <text x="470" y="89" font-weight="700">id 🔑</text><text x="520" y="89" font-weight="700">cliente_id</text><text x="620" y="89" font-weight="700">fecha</text><text x="730" y="89" font-weight="700">total</text>
    <text x="470" y="117">101</text><text x="520" y="117">2</text><text x="620" y="117">2026-11-02</text><text x="730" y="117">185000.00</text>
    <text x="470" y="145">102</text><text x="520" y="145">1</text><text x="620" y="145">2026-11-03</text><text x="730" y="145">42500.00</text>
    <text x="470" y="173">103</text><text x="520" y="173">2</text><text x="620" y="173">2026-11-10</text><text x="730" y="173">96000.00</text>
    <text x="470" y="201" opacity="0.6">…</text>
    <text x="405" y="92" text-anchor="middle" font-size="11">cliente_id</text>
    <text x="405" y="105" text-anchor="middle" font-size="11">apunta a id</text>
    <text x="34" y="258" font-weight="700">SELECT c.nombre, count(*) AS pedidos, sum(p.total) AS total</text>
    <text x="34" y="276" font-weight="700">FROM pedidos p JOIN clientes c ON c.id = p.cliente_id</text>
    <text x="34" y="294" font-weight="700">GROUP BY c.nombre ORDER BY total DESC;</text>
    <text x="520" y="276">→ Oficinas Norte | 2 | 281000.00</text>
    <text x="520" y="294">→ Muebles del Sur | 1 | 42500.00</text>
  </g>
</svg>
