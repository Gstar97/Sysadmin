tipo: emparejar
consigna: Uní cada cosa de MariaDB con su equivalente en PostgreSQL.
pares:
  - { a: "sudo mysql", b: "sudo -u postgres psql" }
  - { a: "SHOW DATABASES;", b: "\\l" }
  - { a: "USE tienda;", b: "\\c tienda" }
  - { a: "SHOW TABLES;", b: "\\dt" }
  - { a: "DESCRIBE clientes;", b: "\\d clientes" }
  - { a: "SELECT user, host FROM mysql.user;", b: "\\du" }
  - { a: "Cuentas usuario@host con contraseña", b: "Roles con LOGIN, y pg_hba.conf para el origen y el método" }
explicacion: >-
  Los comandos con barra invertida son propios de psql (no son SQL) y no llevan punto y coma. La
  diferencia de fondo está en el último par: en MariaDB el origen es parte de la cuenta; en
  PostgreSQL, el rol es uno solo y desde dónde puede entrar lo decide pg_hba.conf.
