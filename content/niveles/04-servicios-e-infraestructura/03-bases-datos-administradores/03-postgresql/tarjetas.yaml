- { id: t1, frente: "Instalar PostgreSQL", dorso: "Rocky: dnf install postgresql-server, postgresql-setup --initdb, enable --now. Ubuntu: apt install postgresql (arranca solo)." }
- { id: t2, frente: "Entrar a administrar", dorso: "sudo -u postgres psql (regla peer)." }
- { id: t3, frente: "psql", dorso: "\\l bases, \\c base, \\dt tablas, \\d tabla, \\du roles, \\q salir." }
- { id: t4, frente: "Rol y base de una aplicación", dorso: "CREATE ROLE app WITH LOGIN PASSWORD '...'; CREATE DATABASE app OWNER app;" }
- { id: t5, frente: "Esquema public (PostgreSQL 15+)", dorso: "Solo el dueño de la base crea tablas. permission denied for schema public = base de otro dueño." }
- { id: t6, frente: "Solo lectura", dorso: "GRANT SELECT ON ALL TABLES IN SCHEMA public + ALTER DEFAULT PRIVILEGES para las tablas futuras." }
- { id: t7, frente: "pg_hba.conf", dorso: "TYPE DATABASE USER ADDRESS METHOD; gana la primera que coincide; reload. Rocky: cambiar ident por scram-sha-256." }
- { id: t8, frente: "listen_addresses", dorso: "En postgresql.conf; de fábrica localhost; cambiarla necesita restart." }
- { id: t9, frente: "~/.pgpass", dorso: "servidor:puerto:base:rol:contraseña, con permisos 600 (si no, se ignora)." }
