<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <rect x="6" y="6" width="848" height="192" rx="8" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1"/>
  <text x="20" y="42" fill="currentColor" xml:space="preserve" opacity="0.7"># /var/lib/pgsql/data/pg_hba.conf (Rocky) · /etc/postgresql/18/main/pg_hba.conf (Ubuntu)</text>
  <text x="20" y="62" fill="currentColor" xml:space="preserve" opacity="0.7" font-weight="700"># TYPE  DATABASE        USER            ADDRESS                 METHOD</text>
  <text x="20" y="82" fill="currentColor" xml:space="preserve">local   all             postgres                                peer</text>
  <text x="20" y="102" fill="currentColor" xml:space="preserve">local   all             all                                     peer</text>
  <text x="20" y="122" fill="currentColor" xml:space="preserve">host    all             all             127.0.0.1/32            scram-sha-256</text>
  <text x="20" y="142" fill="currentColor" xml:space="preserve">host    inventario      inventario_app  192.168.10.0/24         scram-sha-256</text>
  <text x="20" y="162" fill="currentColor" xml:space="preserve">host    all             all             0.0.0.0/0               reject</text>
  <text x="20" y="182" fill="currentColor" xml:space="preserve" opacity="0.7"># Para que un cambio valga:  sudo systemctl reload postgresql</text>
</svg>
