- { id: t1, frente: "Registro de consultas lentas", dorso: "slow_query_log = 1, slow_query_log_file, long_query_time = 1. En PostgreSQL, log_min_duration_statement = 1000." }
- { id: t2, frente: "La pista de un índice que falta", dorso: "Rows_examined mucho más grande que Rows_sent; EXPLAIN con type ALL o Seq Scan." }
- { id: t3, frente: "Qué está pasando ahora", dorso: "SHOW FULL PROCESSLIST (KILL id) en MariaDB; pg_stat_activity (pg_cancel_backend(pid)) en PostgreSQL." }
- { id: t4, frente: "Crear un índice", dorso: "CREATE INDEX idx_tabla_columna ON tabla (columna); fuera de horario y avisando a desarrollo." }
- { id: t5, frente: "Memoria de la base", dorso: "innodb_buffer_pool_size 50 a 70 % de la RAM (dedicado); shared_buffers alrededor del 25 %. Nunca hasta la swap." }
- { id: t6, frente: "Too many connections", dorso: "Es un síntoma: mirar la lista de procesos y qué traba a las demás antes de subir max_connections." }
- { id: t7, frente: "Estado de una réplica", dorso: "SHOW REPLICA STATUS\\G: Slave_IO_Running y Slave_SQL_Running en Yes; Seconds_Behind_Master es el atraso; Last_SQL_Error, el porqué." }
- { id: t8, frente: "Reglas de las réplicas", dorso: "read_only = 1; los informes van contra ellas; no son un respaldo." }
