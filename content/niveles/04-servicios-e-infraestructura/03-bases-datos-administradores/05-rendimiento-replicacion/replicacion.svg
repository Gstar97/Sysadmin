<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Replicación: un primario que escribe, réplicas que copian</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="50" width="160" height="70" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="20" y="170" width="160" height="70" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="300" y="80" width="230" height="130" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="640" y="40" width="200" height="90" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="640" y="160" width="200" height="90" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="20" y="262" width="820" height="40" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="currentColor">
    <line x1="180" y1="85" x2="294" y2="120"/><path d="M299 122 l-8 -6 l-1 8 z"/>
    <line x1="180" y1="205" x2="294" y2="175"/><path d="M299 173 l-9 1 l3 7 z"/>
    <line x1="530" y1="120" x2="634" y2="90"/><path d="M639 88 l-9 0 l3 7 z"/>
    <line x1="530" y1="170" x2="634" y2="200"/><path d="M639 202 l-8 -6 l-1 8 z"/>
    <line x1="180" y1="225" x2="634" y2="225" stroke-dasharray="5 4"/><path d="M639 225 l-7 -4 v8 z"/>
  </g>
  <g fill="currentColor">
    <text x="100" y="80" text-anchor="middle" font-weight="700">Tienda (app)</text>
    <text x="100" y="100" text-anchor="middle" font-size="11">escribe y lee</text>
    <text x="100" y="200" text-anchor="middle" font-weight="700">Informes</text>
    <text x="100" y="220" text-anchor="middle" font-size="11">solo lee</text>
    <text x="415" y="104" text-anchor="middle" font-weight="700">db01 · primario</text>
    <text x="312" y="128">recibe todas las escrituras</text>
    <text x="312" y="148">las anota en el binlog (MariaDB)</text>
    <text x="312" y="166">o en el WAL (PostgreSQL)</text>
    <text x="312" y="190" font-size="11">las réplicas lo leen y lo repiten</text>
    <text x="740" y="64" text-anchor="middle" font-weight="700">db02 · réplica</text>
    <text x="652" y="86">copia con unos segundos</text>
    <text x="652" y="104">de atraso (lag)</text>
    <text x="652" y="122" font-size="11">Seconds_Behind_Master: 0</text>
    <text x="740" y="184" text-anchor="middle" font-weight="700">db03 · réplica</text>
    <text x="652" y="206">atiende las consultas pesadas</text>
    <text x="652" y="224">sin cargar al primario</text>
    <text x="652" y="242" font-size="11">si db01 se rompe, se promueve</text>
    <text x="410" y="240" text-anchor="middle" font-size="11">los informes leen de una réplica</text>
    <text x="430" y="286" text-anchor="middle">No es un respaldo: un DELETE equivocado en el primario llega a las réplicas en segundos.</text>
  </g>
</svg>
