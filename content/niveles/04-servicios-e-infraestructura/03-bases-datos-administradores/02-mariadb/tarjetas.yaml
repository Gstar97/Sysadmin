- { id: t1, frente: "MariaDB y MySQL", dorso: "MariaDB nació del código de MySQL y es casi totalmente compatible. Rocky 10: 10.11; Ubuntu 26.04: 11.8." }
- { id: t2, frente: "Entrar como administrador", dorso: "sudo mysql: root usa unix_socket, sin contraseña." }
- { id: t3, frente: "Configuración", dorso: "Rocky: /etc/my.cnf.d/mariadb-server.cnf. Ubuntu: /etc/mysql/mariadb.conf.d/50-server.cnf. Se lee al arrancar." }
- { id: t4, frente: "Cuenta", dorso: "usuario@host: 'app'@'localhost' y 'app'@'192.168.10.%' son cuentas distintas." }
- { id: t5, frente: "Mínimo privilegio", dorso: "GRANT SELECT, INSERT, UPDATE, DELETE ON base.* TO 'app'@'red.%'; nunca ALL ON *.* ni root." }
- { id: t6, frente: "Conexiones remotas", dorso: "bind-address (Ubuntu: 127.0.0.1), firewall (servicio mysql, solo desde las apps) y cuenta para ese origen." }
- { id: t7, frente: "Errores de conexión", dorso: "2002 no llega, 1130 sin cuenta para ese origen, 1045/1698 identidad, 1142 permisos." }
- { id: t8, frente: "~/.my.cnf", dorso: "[client] host, user, password, database; permisos 600. La clave no queda en el historial ni en ps." }
