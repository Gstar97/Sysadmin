- { id: t1, frente: "Placa de gestión", dorso: "iDRAC (Dell), iLO (HPE), XClarity (Lenovo), IPMI. Funciona con el servidor colgado o apagado." }
- { id: t2, frente: "Qué se hace desde la gestión", dorso: "Prender y apagar, consola remota, ISO virtual, sensores, registro de eventos, alertas y firmware." }
- { id: t3, frente: "ipmitool por la red", dorso: "ipmitool -I lanplus -H ip -U usuario -E (clave en IPMI_PASSWORD): chassis power status|soft|cycle, sdr, sel elist." }
- { id: t4, frente: "soft o cycle", dorso: "power soft: apagado ordenado. power cycle: cortar y prender, solo si está colgado." }
- { id: t5, frente: "Redfish", dorso: "API HTTPS y JSON para administrar servidores; reemplaza a IPMI. curl, scripts, Ansible." }
- { id: t6, frente: "Proteger la gestión", dorso: "Red propia, nunca en internet, entrada por equipo de salto con doble factor, claves propias, firmware al día." }
