- { id: t1, frente: "Formatos de servidor", dorso: "Torre (oficina chica), rack 1U y 2U (lo común), blade (centros de datos grandes). 1U = 4,45 cm; un rack típico, 42U." }
- { id: t2, frente: "Redundancia", dorso: "Dos fuentes (a circuitos distintos), ventiladores y discos en caliente, RAID, memoria ECC." }
- { id: t3, frente: "smartctl", dorso: "-H salud, -A atributos, -i serie, -t short prueba, -l selftest resultado. Paquete smartmontools." }
- { id: t4, frente: "Atributos SMART que importan", dorso: "5 Reallocated_Sector_Ct y 197 Current_Pending_Sector: si crecen, el disco se cambia aunque diga PASSED." }
- { id: t5, frente: "Cambiar un disco sin equivocarse", dorso: "Número de serie (smartctl -i), bahía y luz de identificación." }
- { id: t6, frente: "SMART en VM o detrás de RAID por hardware", dorso: "En una VM no hay; detrás de la controladora, su herramienta, -d megaraid,N o la placa de gestión." }
