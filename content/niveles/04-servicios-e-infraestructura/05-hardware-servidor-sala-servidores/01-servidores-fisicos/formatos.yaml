tipo: emparejar
consigna: Uní cada formato de servidor con el lugar donde tiene sentido.
pares:
  - { a: "Torre", b: "Una oficina chica sin rack, con uno o dos servidores debajo de un escritorio o en un armario" }
  - { a: "Rack de 1U", b: "Muchos servidores iguales en poco espacio: servidores web, nodos de un clúster" }
  - { a: "Rack de 2U", b: "Más discos y placas: el servidor de virtualización o de archivos de una empresa mediana" }
  - { a: "Blade", b: "Decenas de servidores en un chasis que comparte fuentes, ventiladores y red: centros de datos grandes" }
  - { a: "Hiperconvergente (varios nodos 1U o 2U)", b: "Cómputo y almacenamiento repartidos entre nodos iguales, con un software que los une" }
explicacion: >-
  La "U" es la unidad de altura de un rack: 1,75 pulgadas (4,45 cm). Un rack común tiene 42U. Más
  alto el servidor, más lugar para discos, ventiladores más grandes (menos ruido) y placas de
  expansión; más bajo, más servidores por rack.
