tipo: emparejar
consigna: Uní cada tipo de UPS con lo que hace y dónde se usa.
pares:
  - { a: "Offline (standby)", b: "Deja pasar la corriente de la red y recién cuando se corta pasa a batería, con un microcorte de unos milisegundos: una PC de escritorio" }
  - { a: "Interactiva (line-interactive)", b: "Como la offline, pero corrige las subidas y bajadas de tensión sin usar la batería: servidores de una oficina, un rack chico" }
  - { a: "Online (doble conversión)", b: "Los equipos siempre se alimentan desde el inversor, sin ningún corte al pasar a batería y con la tensión perfecta: la sala de servidores" }
  - { a: "Generador con transferencia automática", b: "Arranca en segundos y da energía por horas mientras dure el combustible; la UPS cubre el tiempo hasta que toma la carga" }
explicacion: >-
  Cuanto más protege, más cuesta y más energía gasta: una online convierte toda la corriente dos
  veces todo el tiempo. Para servidores se usa, como mínimo, una interactiva con salida de onda
  senoidal; las fuentes de servidor actuales pueden funcionar mal con la onda "escalonada" de
  las UPS más baratas.
