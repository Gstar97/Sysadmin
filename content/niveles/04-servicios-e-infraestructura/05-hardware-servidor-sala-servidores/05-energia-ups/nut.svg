<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Una UPS, tres servidores: cómo se apagan todos a tiempo con NUT</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="150" width="150" height="100" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="250" y="70" width="270" height="250" rx="8" fill="var(--surface, #fff)"/>
    <rect x="266" y="110" width="238" height="44" rx="5" fill="var(--surface-2, #eef1f5)"/>
    <rect x="266" y="172" width="238" height="44" rx="5" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="266" y="234" width="238" height="70" rx="5" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="620" y="90" width="220" height="80" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="620" y="220" width="220" height="80" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M170 200 L262 132" marker-end="url(#na)"/>
    <path d="M385 154 L385 168" marker-end="url(#na)"/>
    <path d="M385 216 L385 230" marker-end="url(#na)"/>
    <path d="M504 194 L616 130" marker-end="url(#na)" stroke-dasharray="6 4"/>
    <path d="M504 194 L616 260" marker-end="url(#na)" stroke-dasharray="6 4"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="95" y="182" font-weight="700">UPS</text>
    <text x="95" y="200" font-size="11">OL: con corriente</text>
    <text x="95" y="216" font-size="11">OB: a batería</text>
    <text x="95" y="232" font-size="11">LB: batería baja</text>
    <text x="205" y="150" font-size="11">USB</text>
    <text x="385" y="92" font-weight="700">srv01 (primary)</text>
    <text x="385" y="128" font-weight="700" font-size="11.5">driver (usbhid-ups)</text>
    <text x="385" y="144" font-size="11">habla con la UPS: ups.conf</text>
    <text x="385" y="190" font-weight="700" font-size="11.5">upsd (nut-server)</text>
    <text x="385" y="206" font-size="11">publica el estado por la red</text>
    <text x="385" y="252" font-weight="700" font-size="11.5">upsmon (nut-monitor) primary</text>
    <text x="385" y="268" font-size="11">mira el estado y, con OB LB, avisa a los</text>
    <text x="385" y="283" font-size="11">secondary, espera que se apaguen, se apaga</text>
    <text x="385" y="298" font-size="11">y por último apaga la UPS</text>
    <text x="730" y="118" font-weight="700">srv02</text>
    <text x="730" y="136" font-size="11">upsmon secondary</text>
    <text x="730" y="152" font-size="11">MONITOR rack1@srv01 ... secondary</text>
    <text x="730" y="248" font-weight="700">srv03</text>
    <text x="730" y="266" font-size="11">upsmon secondary</text>
    <text x="730" y="282" font-size="11">se apaga cuando avisa el primary</text>
    <text x="540" y="199" font-size="11" text-anchor="start">red, puerto 3493</text>
  </g>
  <text x="430" y="352" text-anchor="middle" font-size="11" fill="currentColor">Solo un equipo lee la UPS por USB; los demás le preguntan a su upsd por la red. Todos se apagan ordenados antes de que se acabe la batería.</text>
</svg>
