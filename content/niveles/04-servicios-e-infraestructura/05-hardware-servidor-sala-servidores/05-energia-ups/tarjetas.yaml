- { id: t1, frente: "Tipos de UPS", dorso: "Offline (microcorte), interactiva (corrige tensión), online (doble conversión, sin corte)." }
- { id: t2, frente: "VA y W", dorso: "Manda el número en W; hasta el 80 % del consumo real medido." }
- { id: t3, frente: "Autonomía", dorso: "La que hace falta para apagar todo ordenado (o hasta que arranque el generador), con margen." }
- { id: t4, frente: "Las partes de NUT", dorso: "Driver (ups.conf), upsd/nut-server (upsd.users, upsd.conf), upsmon/nut-monitor (upsmon.conf); MODE en nut.conf." }
- { id: t5, frente: "Estados de upsc", dorso: "OL con corriente, OB a batería, LB batería baja; OB LB → upsmon apaga." }
- { id: t6, frente: "primary y secondary", dorso: "primary tiene el USB y se apaga último; secondary pregunta por la red (puerto 3493)." }
- { id: t7, frente: "Mantenimiento", dorso: "Baterías cada 3 a 5 años, autoprueba con alertas y un corte de prueba al año." }
