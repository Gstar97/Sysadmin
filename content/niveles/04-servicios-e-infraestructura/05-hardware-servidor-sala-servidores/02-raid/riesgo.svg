<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">La vida de un RAID 5 cuando falla un disco</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="60" width="150" height="64" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="170" y="60" width="300" height="64" fill="var(--bad-soft, #fde2e2)"/>
    <rect x="470" y="60" width="230" height="64" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="700" y="60" width="140" height="64" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor">
    <text x="95" y="88" text-anchor="middle" font-weight="700">Sano</text>
    <text x="95" y="106" text-anchor="middle" font-size="11">[UUUU]</text>
    <text x="320" y="88" text-anchor="middle" font-weight="700">Degradado, sin protección</text>
    <text x="320" y="106" text-anchor="middle" font-size="11">[UU_U] · hasta que alguien se entera y cambia el disco</text>
    <text x="585" y="88" text-anchor="middle" font-weight="700">Reconstruyendo</text>
    <text x="585" y="106" text-anchor="middle" font-size="11">lee todos los discos: horas o días</text>
    <text x="770" y="88" text-anchor="middle" font-weight="700">Sano otra vez</text>
    <text x="770" y="106" text-anchor="middle" font-size="11">[UUUU]</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="currentColor">
    <line x1="170" y1="44" x2="170" y2="140"/>
    <line x1="470" y1="44" x2="470" y2="140"/>
    <line x1="700" y1="44" x2="700" y2="140"/>
    <line x1="170" y1="150" x2="700" y2="150"/><path d="M170 150 l8 -4 v8 z"/><path d="M700 150 l-8 -4 v8 z"/>
  </g>
  <g fill="currentColor">
    <text x="170" y="40" text-anchor="middle" font-size="11">falla un disco</text>
    <text x="470" y="40" text-anchor="middle" font-size="11">disco nuevo (--add)</text>
    <text x="700" y="40" text-anchor="middle" font-size="11">termina</text>
    <text x="435" y="170" text-anchor="middle" font-weight="700">Ventana de riesgo: otra falla o un sector ilegible acá, y se pierde todo</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="190" width="400" height="96" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="440" y="190" width="400" height="96" rx="8" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g fill="currentColor">
    <text x="36" y="212" font-weight="700">Achicar la parte roja</text>
    <text x="36" y="232">Aviso inmediato: MAILADDR y mdmonitor, o el monitoreo.</text>
    <text x="36" y="250">Un disco de repuesto ya instalado: empieza solo.</text>
    <text x="36" y="268">Discos de repuesto comprados, no "cuando falle".</text>
    <text x="456" y="212" font-weight="700">Sobrevivir a la parte amarilla</text>
    <text x="456" y="232">RAID 6 o RAID 10 con discos grandes.</text>
    <text x="456" y="250">Discos de lotes distintos (fallan juntos los del mismo lote).</text>
    <text x="456" y="268">Y siempre, el respaldo en otro lado.</text>
  </g>
</svg>
