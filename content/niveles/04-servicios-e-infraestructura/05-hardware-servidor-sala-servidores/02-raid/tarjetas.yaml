- { id: t1, frente: "Niveles de RAID", dorso: "0 reparto (sin protección), 1 espejo, 5 una paridad (soporta 1), 6 dos paridades (soporta 2), 10 espejos repartidos (1 por par)." }
- { id: t2, frente: "Capacidad útil", dorso: "RAID 1: un disco. RAID 5: n-1. RAID 6: n-2. RAID 10: n/2. RAID 0: todos." }
- { id: t3, frente: "/proc/mdstat", dorso: "[UU] sano; [U_] degradado; (F) fallado; (S) repuesto; recovery = % reconstruyendo." }
- { id: t4, frente: "Reemplazar un disco con mdadm", dorso: "mdadm /dev/md0 --fail X, --remove X, cambiar el disco, --add Y y seguir la reconstrucción." }
- { id: t5, frente: "Que avise", dorso: "MAILADDR en mdadm.conf (Rocky /etc/mdadm.conf, Ubuntu /etc/mdadm/mdadm.conf) y mdmonitor activo." }
- { id: t6, frente: "Discos grandes", dorso: "RAID 6 o 10, un disco de repuesto y aviso: la reconstrucción tarda horas o días." }
- { id: t7, frente: "La regla", dorso: "RAID no es un respaldo: el borrado y el ransomware llegan a todos los discos." }
