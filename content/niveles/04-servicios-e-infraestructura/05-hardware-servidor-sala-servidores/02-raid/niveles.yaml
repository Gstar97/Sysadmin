tipo: emparejar
consigna: Uní cada nivel de RAID con lo que lo caracteriza.
pares:
  - { a: "RAID 0", b: "Reparte los datos entre todos los discos: máxima velocidad y capacidad, y si falla uno se pierde todo" }
  - { a: "RAID 1", b: "Cada disco es una copia completa: se usa la mitad del espacio y sigue con un solo disco vivo" }
  - { a: "RAID 5", b: "Datos y una paridad repartidos: se pierde un disco de espacio y soporta que falle uno" }
  - { a: "RAID 6", b: "Datos y dos paridades: se pierden dos discos de espacio y soporta que fallen dos cualesquiera" }
  - { a: "RAID 10", b: "Pares de espejos repartidos: la mitad del espacio, rápido para escribir, y soporta uno por par" }
explicacion: >-
  Para bases de datos y máquinas virtuales (muchas escrituras chicas) se prefiere RAID 10. Para
  archivos y respaldos (mucha capacidad), RAID 6. RAID 5 con discos grandes es riesgoso por el
  tiempo que tarda la reconstrucción. RAID 0 solo para datos que no importa perder.
