- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: Un servidor tiene dos fuentes. ¿Cómo se conectan?
  opciones:
    - { texto: "Una a la PDU A y otra a la PDU B, de circuitos eléctricos distintos", correcta: true, explicacion: "Si se corta un circuito, la otra fuente sigue." }
    - { texto: "Las dos a la misma PDU, para ordenar los cables", explicacion: "Si esa PDU se corta, se apaga igual." }
    - { texto: "Una sola: la otra queda de repuesto", explicacion: "Desconectada no protege." }
    - { texto: "Las dos a la misma toma con un adaptador", explicacion: "Es el peor caso." }
- id: p02
  tipo: opcion_multiple
  dificultad: 1
  enunciado: ¿Dónde van las UPS y los equipos más pesados en un rack?
  opciones:
    - { texto: "Abajo", correcta: true, explicacion: "El rack no se vuelca, el peso queda sobre el piso y es más fácil levantarlos." }
    - { texto: "Arriba", explicacion: "El rack queda inestable." }
    - { texto: "En el medio", explicacion: "Abajo." }
    - { texto: "Da igual", explicacion: "No da igual: es seguridad." }
- id: p03
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Para qué sirve un panel ciego?
  opciones:
    - { texto: "Para tapar unidades vacías y que el aire caliente de atrás no vuelva al frente", correcta: true, explicacion: "Los equipos de arriba toman aire más fresco." }
    - { texto: "Para que no se vean los equipos", explicacion: "No es estético." }
    - { texto: "Para reservar unidades", explicacion: "No." }
    - { texto: "Para aislar el ruido", explicacion: "No." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: En una sala con dos filas de racks, ¿cómo se ubican?
  opciones:
    - { texto: "Frente con frente (pasillo frío) y espalda con espalda (pasillo caliente)", correcta: true, explicacion: "Así ningún equipo toma el aire caliente de otro." }
    - { texto: "Todas mirando para el mismo lado", explicacion: "La segunda fila tomaría el aire caliente de la primera." }
    - { texto: "Espalda con frente, para que el aire circule", explicacion: "Es el problema, no la solución." }
    - { texto: "Da igual con buen aire acondicionado", explicacion: "Mezclar los aires obliga a enfriar de más." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué temperatura del aire que entra a los servidores recomienda ASHRAE?
  opciones:
    - { texto: "Entre 18 y 27 °C", correcta: true, explicacion: "Enfriar más gasta energía sin beneficio." }
    - { texto: "Menos de 15 °C", explicacion: "Es frío de más." }
    - { texto: "Entre 30 y 40 °C", explicacion: "Esa es la del pasillo caliente." }
    - { texto: "Lo más fría posible", explicacion: "No hace falta." }
- id: p06
  tipo: respuesta_multiple
  dificultad: 2
  enunciado: ¿Qué buenas costumbres de cableado corresponden? (Elegí todas las correctas.)
  opciones:
    - { texto: "Rotular el cable en las dos puntas con el otro extremo", correcta: true, explicacion: "En un corte se sigue sin adivinar." }
    - { texto: "Usar el largo justo", correcta: true, explicacion: "Sin rollos que tapan el aire." }
    - { texto: "Colores por función, siempre los mismos y escritos", correcta: true, explicacion: "Se reconoce de un vistazo." }
    - { texto: "Dejar cables de 3 m por si se mueve el equipo", explicacion: "Los rollos tapan el aire y los rieles." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Con qué se apaga un incendio en una sala de servidores?
  opciones:
    - { texto: "Con gas (agentes limpios o gas inerte), que no daña los equipos", correcta: true, explicacion: "Y matafuegos de CO2 a mano." }
    - { texto: "Con rociadores de agua sobre los racks", explicacion: "Se evitan: dañan todo." }
    - { texto: "Con matafuegos de polvo", explicacion: "El polvo arruina los equipos." }
    - { texto: "No hace falta: los servidores no se prenden fuego", explicacion: "Pueden, sobre todo baterías y fuentes." }
- id: p08
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Un switch nuevo está montado con la salida de aire hacia el pasillo frío. ¿Qué pasa?
  opciones:
    - { texto: "Tira aire caliente al frente de los equipos vecinos, que se calientan", correcta: true, explicacion: "Hay switches con flujo de aire elegible: se pide el correcto o se monta del otro lado." }
    - { texto: "Nada", explicacion: "Mezcla los aires." }
    - { texto: "El switch no arranca", explicacion: "Arranca, pero calienta a los demás." }
    - { texto: "Se enfría mejor", explicacion: "Toma aire caliente del pasillo caliente." }
- id: p09
  tipo: opcion_multiple
  dificultad: 3
  enunciado: La UPS de un rack es de 3000 VA (2700 W). ¿Hasta cuánta carga conviene ponerle?
  opciones:
    - { texto: "Hasta unos 2160 W: el 80 %", correcta: true, explicacion: "El margen evita que se sobrecargue cuando los servidores arrancan o trabajan más." }
    - { texto: "3000 W", explicacion: "VA no son W, y además hay que dejar margen." }
    - { texto: "2700 W justos", explicacion: "Sin margen, un pico la sobrecarga." }
    - { texto: "No importa: si no alcanza, avisa", explicacion: "Si se sobrecarga, corta." }
- id: p10
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Por qué se controla quién entra a la sala aunque los servidores tengan claves?
  opciones:
    - { texto: "Con acceso físico se puede sacar un disco, conectar algo o apagar un equipo: ninguna clave lo frena", correcta: true, explicacion: "Llave o tarjeta, registro, cámaras y visitas acompañadas." }
    - { texto: "Por el ruido", explicacion: "No." }
    - { texto: "Para que no se vaya el frío", explicacion: "No es el motivo." }
    - { texto: "No hace falta con claves fuertes", explicacion: "La seguridad física es la base." }
