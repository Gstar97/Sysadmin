<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker>
    <marker id="pc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6452f"/></marker>
  </defs>
  <text x="430" y="20" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Una sala vista de costado: pasillo frío y pasillo caliente</text>
  <!-- techo y piso -->
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="20" y1="44" x2="840" y2="44"/>
    <rect x="20" y="310" width="820" height="50" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="30" y="110" width="100" height="200" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="250" y="120" width="110" height="190" fill="var(--surface, #fff)"/>
    <rect x="500" y="120" width="110" height="190" fill="var(--surface, #fff)"/>
    <rect x="390" y="304" width="80" height="6" fill="var(--info-soft, #e0e9fd)" stroke-dasharray="3 2"/>
  </g>
  <!-- unidades de los racks -->
  <g stroke="currentColor" stroke-width="0.6" fill="var(--surface-2, #eef1f5)">
    <rect x="258" y="130" width="94" height="18"/><rect x="258" y="152" width="94" height="18"/>
    <rect x="258" y="196" width="94" height="30"/><rect x="258" y="230" width="94" height="30"/><rect x="258" y="264" width="94" height="38"/>
    <rect x="508" y="130" width="94" height="18"/><rect x="508" y="152" width="94" height="18"/><rect x="508" y="174" width="94" height="18"/>
    <rect x="508" y="196" width="94" height="30"/><rect x="508" y="230" width="94" height="30"/><rect x="508" y="264" width="94" height="38"/>
  </g>
  <rect x="258" y="174" width="94" height="18" fill="none" stroke="#d6452f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="305" y="187" text-anchor="middle" font-size="10" fill="#d6452f">hueco sin panel</text>
  <!-- contención -->
  <line x1="360" y1="112" x2="500" y2="112" stroke="#2f6fd6" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="430" y="104" text-anchor="middle" font-size="11" fill="currentColor">contención (techo y puertas)</text>
  <!-- aire frío -->
  <g stroke="#2f6fd6" stroke-width="2" fill="none">
    <path d="M80 300 L80 335 L410 335" marker-end="url(#pf)"/>
    <path d="M430 330 L430 260" marker-end="url(#pf)"/>
    <path d="M398 245 L364 245" marker-end="url(#pf)"/>
    <path d="M462 245 L496 245" marker-end="url(#pf)"/>
  </g>
  <!-- aire caliente -->
  <g stroke="#d6452f" stroke-width="2" fill="none">
    <path d="M246 245 L200 245 L200 70" marker-end="url(#pc)"/>
    <path d="M614 245 L680 245 L680 70" marker-end="url(#pc)"/>
    <path d="M680 60 L150 60 L110 100" marker-end="url(#pc)" stroke-dasharray="6 4"/>
    <path d="M305 182 Q330 160 372 168" marker-end="url(#pc)" stroke-width="1.5"/>
  </g>
  <!-- textos -->
  <g fill="currentColor" text-anchor="middle">
    <text x="80" y="200" font-weight="700">Aire</text>
    <text x="80" y="216" font-weight="700">acondicionado</text>
    <text x="80" y="234" font-size="11">de precisión</text>
    <text x="80" y="250" font-size="11">(CRAC)</text>
    <text x="305" y="140" font-size="10">switch</text>
    <text x="555" y="140" font-size="10">switch</text>
    <text x="305" y="115" font-weight="700" font-size="11">Rack fila A</text>
    <text x="555" y="115" font-weight="700" font-size="11">Rack fila B</text>
    <text x="365" y="300" font-size="10" text-anchor="start">frente</text>
    <text x="495" y="300" font-size="10" text-anchor="end">frente</text>
    <text x="244" y="300" font-size="10" text-anchor="end">atrás</text>
    <text x="616" y="300" font-size="10" text-anchor="start">atrás</text>
    <text x="430" y="150" font-weight="700" fill="#2f6fd6">Pasillo frío</text>
    <text x="430" y="166" font-size="11">18 a 27 °C</text>
    <text x="430" y="182" font-size="11">entra por el frente</text>
    <text x="165" y="275" font-weight="700" fill="#d6452f">Pasillo</text>
    <text x="165" y="290" font-weight="700" fill="#d6452f">caliente</text>
    <text x="745" y="200" font-weight="700" fill="#d6452f">Pasillo caliente</text>
    <text x="745" y="216" font-size="11">sale por atrás,</text>
    <text x="745" y="232" font-size="11">35 a 45 °C</text>
    <text x="430" y="354" font-size="11">Piso técnico: el aire frío llega a presión y sube por las baldosas perforadas</text>
    <text x="420" y="78" font-size="11">el aire caliente vuelve por arriba al equipo de aire</text>
  </g>
  <text x="430" y="388" text-anchor="middle" font-size="11" fill="currentColor">Todos los equipos miran el frente al pasillo frío: nunca el aire caliente de uno entra en otro.</text>
</svg>
