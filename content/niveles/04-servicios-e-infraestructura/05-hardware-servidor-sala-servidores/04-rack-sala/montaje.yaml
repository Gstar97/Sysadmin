tipo: ordenar
consigna: Ordená los pasos para instalar un servidor nuevo en el rack.
pasos:
  - Revisar en el plano del rack las unidades libres, el peso y la potencia disponibles
  - Montar los rieles a la altura elegida y deslizar el servidor (entre dos personas si pesa más de 20 kg)
  - Conectar cada fuente a una PDU distinta (A y B)
  - Conectar la red y la placa de gestión, con cables del largo justo y rotulados en las dos puntas
  - Ordenar los cables en los organizadores, sin tapar la salida de aire
  - Prender, revisar que no haya alertas en la gestión y probar desconectar una fuente
  - Anotar el equipo, su ubicación y sus conexiones en la documentación
explicacion: >-
  Probar que una fuente sola alcanza (desconectando la otra) es la única forma de saber que la
  redundancia funciona antes de que haga falta.
