tipo: diagrama
titulo: Pasillo frío y pasillo caliente
puntos:
  - id: crac
    titulo: El aire acondicionado de precisión
    area: { x: 3.5, y: 27.5, ancho: 11.6, alto: 50 }
    texto: >-
      No es un aire de oficina: funciona todo el año, controla también la humedad y está pensado
      para sacar mucho calor de forma pareja. En una sala chica puede ser un split común, pero
      siempre hay dos (si uno falla o entra en mantenimiento, el otro alcanza) y una alarma de
      temperatura que avisa antes de que los servidores empiecen a apagarse solos.
  - id: piso
    titulo: El piso técnico
    area: { x: 2.3, y: 77.5, ancho: 95.3, alto: 12.5 }
    texto: >-
      Un piso elevado de baldosas removibles. Abajo circula el aire frío a presión, que sube
      solo por las baldosas perforadas del pasillo frío. Muchas salas chicas no lo tienen y
      soplan el aire desde arriba o desde un costado: la idea de separar frío y caliente es la
      misma.
  - id: frio
    titulo: El pasillo frío
    area: { x: 41.9, y: 30, ancho: 16.3, alto: 45 }
    texto: >-
      Los dos racks se miran de frente y toman el aire de este pasillo. La temperatura que
      importa es la del aire que entra a los equipos: la recomendación de ASHRAE (la referencia
      de la industria) es entre 18 y 27 °C. Enfriar la sala a 16 °C "por las dudas" gasta mucha
      energía y no ayuda.
  - id: contencion
    titulo: La contención
    area: { x: 41.9, y: 23, ancho: 16.3, alto: 6.5 }
    texto: >-
      Un techo y puertas en las puntas del pasillo frío (o del caliente) para que los dos aires
      no se mezclen. Es una de las mejoras más baratas en una sala que ya existe.
  - id: hueco
    titulo: Un hueco sin panel ciego
    area: { x: 30, y: 43.5, ancho: 10.9, alto: 4.5 }
    texto: >-
      Una unidad vacía en el rack deja que el aire caliente de atrás vuelva al frente, y los
      equipos de arriba toman aire más caliente. Se tapa con un panel ciego: una tapa de plástico
      o chapa de 1U que cuesta muy poco.
  - id: caliente
    titulo: El pasillo caliente
    area: { x: 72, y: 15, ancho: 27, alto: 60 }
    texto: >-
      Los equipos tiran el aire caliente por atrás: acá puede haber 35 a 45 °C, y es normal. El
      aire sube y vuelve por arriba al equipo de aire. El error clásico es girar un rack o
      montar un equipo al revés: su aire caliente entra en el frente de otro.
  - id: retorno
    titulo: El retorno
    area: { x: 15, y: 12.5, ancho: 70, alto: 9 }
    texto: >-
      El aire caliente vuelve al equipo de aire, que lo enfría y lo manda otra vez al piso. Si en
      el camino se mezcla con el frío, el equipo de aire trabaja de más y los racks reciben aire
      más tibio.
