tipo: pasos
titulo: RAID 5 y NUT en tu máquina virtual
descripcion: >-
  Lo mismo que en la parte 1, en ubuntu01, con discos virtuales de verdad y un apagado de
  verdad. Calculá unas dos horas.
pasos:
  - titulo: Instantánea y discos nuevos
    detalle: >-
      Con ubuntu01 apagada, sacale una instantánea y agregale cinco discos virtuales de 2 GB en
      el mismo controlador SATA que el disco del sistema (en VirtualBox: Configuración,
      Almacenamiento, el controlador SATA, Agregar disco duro, Crear).
    comprobar: Al prenderla, lsblk muestra sdb, sdc, sdd, sde y sdf de 2G, sin particiones.
    si_falla: Si aparecen con otros nombres (por ejemplo vdb), usá esos en todos los comandos.
  - titulo: El RAID 5 con un repuesto
    comandos:
      - sudo apt install -y mdadm
      - sudo mdadm --create /dev/md0 --level=5 --raid-devices=3 --spare-devices=1 /dev/sdb /dev/sdc /dev/sdd /dev/sde
      - watch -n1 cat /proc/mdstat
    comprobar: Al terminar la sincronización (Ctrl+C para salir de watch), /proc/mdstat muestra [3/3] [UUU] y sde con (S).
  - titulo: Sistema de archivos y arranque
    comandos:
      - sudo mkfs.ext4 /dev/md0 && sudo mkdir -p /datos
      - echo "UUID=$(sudo blkid -s UUID -o value /dev/md0) /datos ext4 defaults 0 2" | sudo tee -a /etc/fstab
      - sudo systemctl daemon-reload && sudo mount -a
      - sudo mdadm --detail --scan | sudo tee -a /etc/mdadm/mdadm.conf
      - sudo update-initramfs -u
      - sudo reboot
    comprobar: Después de reiniciar, el arreglo sigue siendo /dev/md0 (no md127) y df -h /datos muestra unos 4 GB.
  - titulo: Datos de prueba
    detalle: Unos archivos con su suma de verificación, para comprobar que nada se pierde en la falla.
    comandos:
      - sudo cp -r /usr/share/doc /datos/
      - sudo find /datos/doc -type f -exec sha256sum {} + | sudo tee /root/sumas.txt > /dev/null
    comprobar: /root/sumas.txt tiene una línea por archivo.
  - titulo: Falla y reconstrucción
    comandos:
      - sudo mdadm /dev/md0 --fail /dev/sdc
      - cat /proc/mdstat
      - sudo journalctl -u mdmonitor --since "5 min ago"
      - sudo mdadm --wait /dev/md0
      - sudo mdadm /dev/md0 --remove /dev/sdc
      - sudo mdadm /dev/md0 --add /dev/sdf
      - sudo sha256sum --quiet -c /root/sumas.txt
    comprobar: >-
      Apenas falla sdc, el repuesto entra solo (recovery). Al final, mdadm --detail /dev/md0
      muestra State clean, tres discos activos y sdf como spare, y sha256sum no muestra ningún
      error.
    si_falla: >-
      Si mdmonitor no registró el evento, revisá que esté activo (systemctl status mdmonitor). El
      correo a root solo sale si Postfix está configurado, como en el laboratorio del módulo 4.4.
  - titulo: "Opcional: una falla de verdad"
    detalle: >-
      Apagá la VM, quitale un disco del arreglo en el hipervisor (no el del sistema) y prendela.
      Así se ve una falla sin avisar, como cuando un disco muere.
    comprobar: El arreglo arranca degradado ([UU_] o parecido), /datos funciona y el repuesto empieza a reconstruir.
  - titulo: NUT con una UPS simulada
    detalle: Igual que en la parte 1.
    comandos:
      - sudo apt install -y nut
      - "printf '[simulada]\\n\\tdriver = dummy-ups\\n\\tport = simulada.dev\\n' | sudo tee -a /etc/nut/ups.conf"
      - "printf 'ups.status: OL\\nbattery.charge: 100\\nbattery.runtime: 1200\\n' | sudo tee /etc/nut/simulada.dev"
      - sudo sed -i 's/^MODE=none/MODE=standalone/' /etc/nut/nut.conf
      - "printf '[monuser]\\n\\tpassword = Ups-2026\\n\\tupsmon primary\\n' | sudo tee -a /etc/nut/upsd.users"
      - "echo 'MONITOR simulada@localhost 1 monuser Ups-2026 primary' | sudo tee -a /etc/nut/upsmon.conf"
      - sudo systemctl restart nut-driver-enumerator nut-server nut-monitor
      - upsc simulada
    comprobar: upsc muestra ups.status OL y driver.name dummy-ups.
    si_falla: >-
      Si upsc dice "Driver not connected", mirá sudo journalctl -u 'nut-driver@*': suele ser un
      error de escritura en ups.conf o en la ruta del archivo .dev.
  - titulo: El corte
    detalle: Cambiá el archivo como si se cortara y volviera la luz. Tené abierta otra sesión SSH para ver los avisos.
    comandos:
      - "sudo sed -i 's/ups.status: OL/ups.status: OB/' /etc/nut/simulada.dev"
      - sudo journalctl -u nut-monitor -f
      - "sudo sed -i 's/ups.status: OB/ups.status: OL/' /etc/nut/simulada.dev"
    comprobar: >-
      Unos segundos después del primer cambio aparece "on battery" en el registro y un aviso en
      las sesiones abiertas; con el segundo, "on line power".
    si_falla: >-
      Si no ve el cambio, tu versión de dummy-ups puede no releer el archivo: reiniciá el driver
      con sudo upsdrvctl stop simulada && sudo upsdrvctl start simulada.
  - titulo: El apagado
    detalle: >-
      upsmon -c fsd fuerza lo mismo que pasa cuando la batería se agota: avisa y apaga. Se usa
      este comando en vez de poner OB LB en el archivo porque, si no, al volver a arrancar la VM
      la UPS seguiría con la batería agotada y se volvería a apagar enseguida.
    comandos:
      - sudo upsmon -c fsd
    comprobar: >-
      La VM se apaga sola, ordenada. Al prenderla, el arranque es normal, /datos se monta y
      /proc/mdstat muestra el arreglo limpio, sin resincronizar.
  - titulo: Documentar
    detalle: >-
      Anotá cómo está armado el RAID (nivel, discos, repuesto, dónde se monta), cómo te enterás
      de una falla, el paso a paso para cambiar un disco, y cómo está configurado NUT (qué UPS,
      qué equipos apaga y en qué orden).
    comprobar: Alguien que no hizo el laboratorio podría cambiar un disco siguiendo tu documento.
