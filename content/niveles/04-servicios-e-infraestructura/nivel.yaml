id: n4
titulo: Servicios e infraestructura
descripcion: 'Los servicios que sostienen una empresa: servidores web y proxies inversos, certificados
  TLS, bases de datos desde el punto de vista de la administración, correo, recursos compartidos con NFS
  y Samba, y el hardware físico donde todo corre (servidores, RAID, gestión fuera de banda, rack, energía
  y UPS).'
perfil_salida: Publicar aplicaciones web con HTTPS correctamente configurado, administrar y respaldar
  bases de datos MySQL/MariaDB y PostgreSQL, operar servicios de correo y de archivos, y planificar el
  hardware físico de una sala de servidores.
insignia:
  nombre: Servicios e infraestructura
  color: '#b45309'
proyecto_plan:
  titulo: Plataforma web de producción
  horas: 20
  entregables:
  - Nginx como proxy inverso con HTTPS bien configurado, balanceo y aplicación detrás.
  - Base de datos con backup automático y restauración probada.
  - Almacenamiento compartido con NFS y correo de alertas con Postfix.
  - Diseño físico documentado (rack, energía y UPS calculados).
