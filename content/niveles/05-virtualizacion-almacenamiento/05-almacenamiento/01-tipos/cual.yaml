tipo: emparejar
consigna: Uní cada necesidad con el tipo de almacenamiento que mejor la resuelve.
pares:
  - { a: "Una carpeta de documentos que usan 40 PC con Windows", b: "NAS (SMB)" }
  - { a: "Discos de VM compartidos entre los nodos de un clúster, sin presupuesto para una SAN", b: "NAS (NFS) o Ceph con los discos de los nodos" }
  - { a: "Una base de datos que necesita la menor latencia posible en un solo servidor", b: "DAS con NVMe" }
  - { a: "Copias de respaldo fuera de la empresa, con versiones y bloqueo contra borrado", b: "Almacenamiento de objetos (S3)" }
  - { a: "Un clúster de Hyper-V con un almacenamiento central de la empresa", b: "SAN (iSCSI o Fibre Channel)" }
explicacion: >-
  No hay uno mejor: cada tipo resuelve un problema distinto, y en una empresa conviven varios. Lo
  que hay que evitar es usar uno para lo que no es, como un recurso compartido SMB para los discos
  de una base de datos.
