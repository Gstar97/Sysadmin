<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Cuatro formas de darle disco a un servidor</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="40" width="195" height="330" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="232" y="40" width="195" height="330" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="444" y="40" width="195" height="330" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="656" y="40" width="184" height="330" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g fill="var(--surface, #fff)" stroke="currentColor" stroke-width="0.9">
    <rect x="50" y="95" width="135" height="40" rx="5"/><rect x="50" y="165" width="135" height="40" rx="5"/>
    <rect x="262" y="95" width="135" height="40" rx="5"/><rect x="262" y="185" width="135" height="40" rx="5"/>
    <rect x="474" y="95" width="135" height="40" rx="5"/><rect x="474" y="185" width="135" height="40" rx="5"/>
    <rect x="681" y="95" width="135" height="40" rx="5"/><rect x="681" y="185" width="135" height="40" rx="5"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <path d="M117 135 L117 165"/>
    <path d="M330 135 L330 185" stroke-dasharray="5 4"/><path d="M542 135 L542 185" stroke-dasharray="5 4"/><path d="M748 135 L748 185" stroke-dasharray="5 4"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="117" y="66" font-weight="700">DAS</text><text x="117" y="82" font-size="10.5">disco conectado directo</text>
    <text x="117" y="119">servidor</text><text x="117" y="189">discos propios</text>
    <text x="117" y="150" font-size="10" text-anchor="start" dx="8">SATA, SAS, NVMe</text>
    <g font-size="10.5"><text x="117" y="236">lo ve un solo servidor</text><text x="117" y="254">el más rápido y simple</text><text x="117" y="282" font-weight="700">ve: un disco</text><text x="117" y="310">ej.: los discos de un</text><text x="117" y="326">nodo, con ZFS o RAID</text></g>
    <text x="330" y="66" font-weight="700">NAS</text><text x="330" y="82" font-size="10.5">archivos por la red</text>
    <text x="330" y="119">servidor</text><text x="330" y="209">servidor de archivos</text>
    <text x="338" y="164" font-size="10" text-anchor="start">NFS, SMB</text>
    <g font-size="10.5"><text x="330" y="256">muchos clientes a la vez</text><text x="330" y="274">el NAS maneja el</text><text x="330" y="290">sistema de archivos</text><text x="330" y="318" font-weight="700">ve: una carpeta</text><text x="330" y="346">ej.: un NFS para VM</text></g>
    <text x="542" y="66" font-weight="700">SAN</text><text x="542" y="82" font-size="10.5">bloques por la red</text>
    <text x="542" y="119">servidor</text><text x="542" y="209">almacenamiento (LUN)</text>
    <text x="550" y="164" font-size="10" text-anchor="start">iSCSI, FC</text>
    <g font-size="10.5"><text x="542" y="256">red propia y rápida</text><text x="542" y="274">el servidor formatea:</text><text x="542" y="290">para compartir entre varios,</text><text x="542" y="306">algo que lo coordine</text><text x="542" y="334" font-weight="700">ve: un disco</text></g>
    <text x="748" y="66" font-weight="700">Objetos</text><text x="748" y="82" font-size="10.5">por HTTP (S3)</text>
    <text x="748" y="119">programa o servidor</text><text x="748" y="209">buckets con objetos</text>
    <text x="756" y="164" font-size="10" text-anchor="start">API S3 (HTTPS)</text>
    <g font-size="10.5"><text x="748" y="256">casi sin límite de tamaño</text><text x="748" y="274">objetos enteros, con</text><text x="748" y="290">metadatos y versiones</text><text x="748" y="318" font-weight="700">ve: una URL</text><text x="748" y="346">ej.: copias de respaldo</text></g>
  </g>
</svg>
