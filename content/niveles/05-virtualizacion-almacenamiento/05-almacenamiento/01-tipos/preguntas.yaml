- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Qué ve un servidor cuando usa un LUN de una SAN por iSCSI?
  opciones:
    - { texto: "Un disco más, que tiene que particionar y formatear él", correcta: true, explicacion: "Es almacenamiento de bloques." }
    - { texto: "Una carpeta compartida", explicacion: "Eso es un NAS." }
    - { texto: "Una URL", explicacion: "Eso es almacenamiento de objetos." }
    - { texto: "Un archivo .vhdx", explicacion: "No." }
- id: p02
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Dos nodos de Proxmox montan el mismo LUN formateado con ext4, cada uno en /mnt/san. ¿Qué pasa?
  opciones:
    - { texto: "Cada uno escribe sin saber del otro y el sistema de archivos se corrompe", correcta: true, explicacion: "Hace falta LVM compartido o algo que coordine." }
    - { texto: "Funciona como un NFS", explicacion: "ext4 no sabe compartir." }
    - { texto: "El segundo no lo puede montar", explicacion: "Lo monta: ahí está el problema." }
    - { texto: "Es más rápido", explicacion: "Y se rompe." }
- id: p03
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Para qué es especialmente bueno el almacenamiento de objetos (S3)?
  opciones:
    - { texto: "Para guardar copias de respaldo y archivos grandes, con versiones y bloqueo contra borrado", correcta: true, explicacion: "Lo vas a usar en el módulo 5.6." }
    - { texto: "Para el disco de una base de datos", explicacion: "Para eso, bloques." }
    - { texto: "Para el sistema operativo de una VM", explicacion: "No." }
    - { texto: "Para compartir una carpeta con Windows", explicacion: "Para eso, SMB." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué es la hiperconvergencia?
  opciones:
    - { texto: "Que los discos de los nodos del clúster formen un almacenamiento compartido entre todos, sin SAN aparte", correcta: true, explicacion: "Ceph, vSAN, Storage Spaces Direct." }
    - { texto: "Una SAN muy rápida", explicacion: "Es justamente no tener SAN." }
    - { texto: "Juntar varias VM en una", explicacion: "No." }
    - { texto: "Un tipo de RAID", explicacion: "No." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Por qué el almacenamiento en red pide 10 Gbps o más?
  opciones:
    - { texto: "Porque 1 Gbps mueve unos 110 MB/s, menos que un solo SSD: la red sería el cuello de botella", correcta: true, explicacion: "Y además conviene una red propia." }
    - { texto: "Porque iSCSI no funciona en 1 Gbps", explicacion: "Funciona, pero lento." }
    - { texto: "Por seguridad", explicacion: "No es el motivo." }
    - { texto: "No hace falta", explicacion: "Sí hace falta." }
- id: p06
  tipo: respuesta_multiple
  dificultad: 2
  enunciado: ¿Cuáles de estos son protocolos para usar almacenamiento de bloques por la red? (Elegí todas las correctas.)
  opciones:
    - { texto: "iSCSI", correcta: true, explicacion: "Sobre Ethernet común." }
    - { texto: "Fibre Channel", correcta: true, explicacion: "Una red propia de SAN." }
    - { texto: "NVMe over Fabrics", correcta: true, explicacion: "Lo más nuevo y rápido." }
    - { texto: "NFS", explicacion: "Es de archivos." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Para muchas VM con bases de datos, ¿qué número conviene mirar primero en un almacenamiento?
  opciones:
    - { texto: "Las IOPS y la latencia", correcta: true, explicacion: "Operaciones chicas al azar." }
    - { texto: "Los TB", explicacion: "Importan, pero no alcanza." }
    - { texto: "El ancho de banda en lecturas grandes", explicacion: "Eso importa para respaldos." }
    - { texto: "La marca", explicacion: "No." }
- id: p08
  tipo: opcion_multiple
  dificultad: 1
  enunciado: ¿Qué es un LUN?
  opciones:
    - { texto: "Un disco lógico que una SAN presenta por la red", correcta: true, explicacion: "Logical Unit Number." }
    - { texto: "Una carpeta compartida", explicacion: "No." }
    - { texto: "Un tipo de cable", explicacion: "No." }
    - { texto: "Un objeto de S3", explicacion: "No." }
- id: p09
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Una empresa quiere almacenamiento compartido para tres nodos de Proxmox y no puede comprar una SAN. ¿Qué opciones tiene?
  opciones:
    - { texto: "Un NFS en otro servidor, o Ceph con los discos de los tres nodos (con red rápida)", correcta: true, explicacion: "O ZFS con réplica, si acepta perder unos minutos." }
    - { texto: "Ninguna: sin SAN no hay clúster", explicacion: "Hay alternativas." }
    - { texto: "Un bucket S3 para los discos de las VM", explicacion: "No sirve para eso." }
    - { texto: "Compartir un disco USB", explicacion: "No." }
- id: p10
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Cuántas operaciones por segundo hace, más o menos, un disco mecánico?
  opciones:
    - { texto: "Unas 150", correcta: true, explicacion: "Un NVMe, cientos de miles." }
    - { texto: "Unas 15.000", explicacion: "Mucho menos." }
    - { texto: "Un millón", explicacion: "Eso es un NVMe muy bueno." }
    - { texto: "Depende solo de la marca", explicacion: "Depende de que tenga partes que se mueven." }
