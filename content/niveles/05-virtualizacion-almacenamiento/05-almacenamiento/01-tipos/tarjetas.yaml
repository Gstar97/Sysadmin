- { id: t1, frente: "DAS, NAS, SAN, objetos", dorso: "Discos propios; carpeta por NFS o SMB; disco (LUN) por iSCSI o FC; objetos por S3." }
- { id: t2, frente: "Bloques, archivos, objetos", dorso: "Bloques: el servidor formatea. Archivos: el NAS maneja el sistema de archivos. Objetos: se guardan y piden enteros." }
- { id: t3, frente: "LUN compartido", dorso: "Si dos servidores lo formatean con ext4 o NTFS, lo rompen. Hace falta LVM compartido, VMFS o CSV." }
- { id: t4, frente: "Hiperconvergencia", dorso: "Los discos de los nodos forman el almacenamiento compartido: Ceph, vSAN, Storage Spaces Direct." }
- { id: t5, frente: "Latencia, IOPS, ancho de banda", dorso: "HDD: 5-10 ms y ~150 IOPS. NVMe: 0,02 ms y cientos de miles. 1 Gbps ≈ 110 MB/s." }
