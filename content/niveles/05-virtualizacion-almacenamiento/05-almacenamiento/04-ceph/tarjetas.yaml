- { id: t1, frente: "MON, MGR, OSD", dorso: "MON: mapa y quórum (3 o 5). MGR: métricas y panel. OSD: un servicio por disco que guarda los datos." }
- { id: t2, frente: "PG y CRUSH", dorso: "Los objetos van en grupos (PG); CRUSH calcula en qué OSD va cada copia, cada una en un host distinto." }
- { id: t3, frente: "size y min_size", dorso: "size 3: copias que guarda. min_size 2: copias necesarias para aceptar escrituras." }
- { id: t4, frente: "Cuando falla un OSD", dorso: "down y degraded; a los 10 minutos out y recovery; después active+clean." }
- { id: t5, frente: "noout", dorso: "Antes de un reinicio planificado: los OSD no pasan a out. Sacarlo al terminar." }
- { id: t6, frente: "Comandos de diagnóstico", dorso: "ceph -s, ceph health detail, ceph osd tree, ceph df, ceph-volume lvm list." }
- { id: t7, frente: "Lo que pide Ceph", dorso: "3 nodos o más (mejor 4), red propia de 10-25 Gbps, SSD de centro de datos, unos 4 GB de RAM por OSD." }
