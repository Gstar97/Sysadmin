<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="fl-ceph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Ceph en tres nodos de Proxmox: el pool "vms" con 3 copias</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="190" height="84" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="236" y="40" width="388" height="84" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="650" y="40" width="190" height="84" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="20" y="146" width="820" height="34" rx="6" fill="var(--surface, #fff)" stroke-dasharray="4 3"/>
    <rect x="20" y="200" width="256" height="184" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="302" y="200" width="256" height="184" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="584" y="200" width="256" height="184" rx="8" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g stroke="currentColor" stroke-width="0.9">
    <rect x="40" y="244" width="100" height="72" rx="5" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="156" y="244" width="100" height="72" rx="5" fill="var(--surface, #fff)"/>
    <rect x="322" y="244" width="100" height="72" rx="5" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="438" y="244" width="100" height="72" rx="5" fill="var(--surface, #fff)"/>
    <rect x="604" y="244" width="100" height="72" rx="5" fill="var(--surface, #fff)"/>
    <rect x="720" y="244" width="100" height="72" rx="5" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none" marker-end="url(#fl-ceph)">
    <path d="M90 124 L90 242"/>
    <path d="M90 316 L90 352 L372 352 L372 318"/>
    <path d="M372 352 L770 352 L770 318"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="115" y="62" font-weight="700">web01 (VM)</text>
    <g font-size="10.5"><text x="115" y="82">su disco está en el pool vms</text><text x="115" y="98">y le habla directo a los OSD</text><text x="115" y="114">(sin pasar por un servidor)</text></g>
    <text x="430" y="62" font-weight="700">monitores (MON) en pve01, pve02 y pve03</text>
    <g font-size="10.5"><text x="430" y="82">guardan el mapa del clúster: qué OSD hay y cuáles andan</text><text x="430" y="98">votan como corosync: con 2 de 3 alcanza</text><text x="430" y="114">sin quórum de monitores, no se lee ni se escribe nada</text></g>
    <text x="745" y="62" font-weight="700">manager (MGR)</text>
    <g font-size="10.5"><text x="745" y="82">métricas y panel</text><text x="745" y="98">uno activo,</text><text x="745" y="114">los otros de reserva</text></g>
    <text x="430" y="168" font-size="11">cada objeto de 4 MiB cae en un grupo (PG), y CRUSH elige 3 OSD en 3 hosts distintos para ese grupo</text>
    <text x="148" y="224" font-weight="700">pve01</text><text x="430" y="224" font-weight="700">pve02</text><text x="712" y="224" font-weight="700">pve03</text>
    <text x="90" y="272" font-weight="700">osd.0</text><g font-size="10"><text x="90" y="290">sdb</text><text x="90" y="306">copia principal</text></g>
    <text x="206" y="272" font-weight="700">osd.1</text><g font-size="10"><text x="206" y="290">sdc</text></g>
    <text x="372" y="272" font-weight="700">osd.2</text><g font-size="10"><text x="372" y="290">sdb</text><text x="372" y="306">copia</text></g>
    <text x="488" y="272" font-weight="700">osd.3</text><g font-size="10"><text x="488" y="290">sdc</text></g>
    <text x="654" y="272" font-weight="700">osd.4</text><g font-size="10"><text x="654" y="290">sdb</text></g>
    <text x="770" y="272" font-weight="700">osd.5</text><g font-size="10"><text x="770" y="290">sdc</text><text x="770" y="306">copia</text></g>
    <text x="148" y="372" font-size="10.5">la principal copia a las otras</text>
  </g>
</svg>
