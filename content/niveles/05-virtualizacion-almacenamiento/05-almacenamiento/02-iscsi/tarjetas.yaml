- { id: t1, frente: "Destino e iniciador", dorso: "El destino presenta discos (LUN); el iniciador es el cliente que los usa." }
- { id: t2, frente: "IQN", dorso: "Nombre único: iqn.2026-11.lan.empresa:san01. Los iniciadores lo tienen en /etc/iscsi/initiatorname.iscsi." }
- { id: t3, frente: "targetcli", dorso: "backstores (de dónde salen los datos), iscsi (destinos), tpg1/luns, tpg1/acls, saveconfig." }
- { id: t4, frente: "iscsiadm", dorso: "-m discovery -t sendtargets -p IP; -m node -T IQN --login; -m session." }
- { id: t5, frente: "iSCSI en Proxmox", dorso: "pvesm add iscsi (--content none) y pvesm add lvm --shared 1 encima." }
- { id: t6, frente: "Errores típicos", dorso: "Falta la ACL de un nodo, no se guardó la configuración, red compartida, un solo camino." }
