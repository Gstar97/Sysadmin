<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="fl-iscsi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Un disco de san01 usado por dos nodos, por iSCSI</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="40" width="290" height="320" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="540" y="40" width="300" height="320" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="var(--surface, #fff)" stroke="currentColor" stroke-width="0.9">
    <rect x="50" y="78" width="230" height="38" rx="5"/>
    <rect x="50" y="146" width="230" height="38" rx="5"/>
    <rect x="40" y="214" width="250" height="128" rx="5"/>
    <rect x="560" y="70" width="125" height="92" rx="5"/>
    <rect x="700" y="70" width="125" height="92" rx="5"/>
    <rect x="560" y="236" width="265" height="106" rx="5"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none" marker-end="url(#fl-iscsi)">
    <path d="M165 116 L165 144"/>
    <path d="M165 184 L165 212"/>
    <path d="M622 162 L660 234"/>
    <path d="M762 162 L720 234"/>
  </g>
  <g stroke="currentColor" stroke-width="2.4" fill="none">
    <path d="M290 278 L425 278 L425 116 L558 116"/>
    <path d="M425 116 L425 34 L762 34 L762 68"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="165" y="62" font-weight="700">san01: el destino (target)</text>
    <text x="165" y="102">disco /dev/sdb, 500 GB</text>
    <text x="165" y="170">backstore block "lun0"</text>
    <text x="165" y="236" font-weight="700">destino iqn.2026-11.lan.empresa:san01</text>
    <g font-size="11"><text x="165" y="262">LUN 0 → lun0</text><text x="165" y="284">ACL: el iniciador de pve01</text><text x="165" y="300">y el de pve02</text><text x="165" y="326">portal 0.0.0.0, puerto 3260</text></g>
    <text x="433" y="190" font-weight="700" font-size="11" text-anchor="start">red de</text>
    <text x="433" y="204" font-weight="700" font-size="11" text-anchor="start">almacenamiento</text>
    <g font-size="10.5"><text x="425" y="304">TCP 3260</text><text x="425" y="320">red propia</text><text x="425" y="336">10 Gbps o más</text></g>
    <text x="556" y="58" font-weight="700" text-anchor="start">los iniciadores</text>
    <text x="622" y="92" font-weight="700">pve01</text>
    <g font-size="10.5"><text x="622" y="112">iniciador</text><text x="622" y="126">iqn.1993-08…:4f2a</text><text x="622" y="150">ve: /dev/sdb</text></g>
    <text x="762" y="92" font-weight="700">pve02</text>
    <g font-size="10.5"><text x="762" y="112">iniciador</text><text x="762" y="126">iqn.1993-08…:9c1e</text><text x="762" y="150">ve: /dev/sdb</text></g>
    <text x="692" y="260" font-weight="700">LVM compartido "vg_san"</text>
    <g font-size="10.5"><text x="692" y="282">cada disco de VM es un volumen lógico</text><text x="692" y="300">Proxmox decide qué nodo usa cada uno</text><text x="692" y="326">(nada de ext4 montado en los dos)</text></g>
  </g>
</svg>
