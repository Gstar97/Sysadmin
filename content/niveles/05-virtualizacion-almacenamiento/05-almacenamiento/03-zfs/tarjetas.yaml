- { id: t1, frente: "Pool, vdev, dataset, zvol", dorso: "El pool junta vdevs (espejos o RAIDZ); los datasets son sistemas de archivos y los zvols, discos virtuales." }
- { id: t2, frente: "Dónde está la protección en ZFS", dorso: "En cada vdev. Si se pierde un vdev entero, se pierde el pool." }
- { id: t3, frente: "Copy-on-write y sumas de verificación", dorso: "Nunca pisa datos (instantáneas gratis) y detecta y arregla datos dañados." }
- { id: t4, frente: "Recuperar un archivo", dorso: "zfs clone de la instantánea o .zfs/snapshot. rollback vuelve todo atrás." }
- { id: t5, frente: "send y receive", dorso: "zfs send pool/ds@snap | ssh otro zfs receive destino; con -i ANTERIOR, solo lo que cambió." }
- { id: t6, frente: "Cuidados", dorso: "ashift=12, HBA sin RAID, scrub mensual, zed, menos del 80 %, ARC limitado en servidores de VM." }
