<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Un pool de ZFS por dentro</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="38" width="820" height="160" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="20" y="236" width="820" height="150" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="var(--surface, #fff)" stroke="currentColor" stroke-width="0.9">
    <rect x="44" y="78" width="350" height="104" rx="6"/>
    <rect x="466" y="78" width="350" height="104" rx="6"/>
    <rect x="44" y="268" width="240" height="104" rx="6"/>
    <rect x="310" y="268" width="240" height="104" rx="6" stroke-dasharray="5 3"/>
    <rect x="576" y="268" width="240" height="104" rx="6"/>
  </g>
  <g fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="0.9">
    <rect x="70" y="118" width="130" height="50" rx="4"/><rect x="238" y="118" width="130" height="50" rx="4"/>
    <rect x="492" y="118" width="130" height="50" rx="4"/><rect x="660" y="118" width="130" height="50" rx="4"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <path d="M200 143 L238 143" stroke-dasharray="3 3"/><path d="M622 143 L660 143" stroke-dasharray="3 3"/>
    <path d="M430 198 L430 236" stroke-width="2"/>
    <path d="M284 320 L308 320" stroke-dasharray="4 3"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="430" y="60" font-weight="700">pool "tank": 2 TB útiles de 4 discos de 1 TB</text>
    <text x="219" y="100" font-weight="700">vdev mirror-0</text>
    <text x="641" y="100" font-weight="700">vdev mirror-1</text>
    <text x="135" y="140">sdb</text><text x="135" y="157" font-size="10">1 TB</text>
    <text x="303" y="140">sdc</text><text x="303" y="157" font-size="10">copia de sdb</text>
    <text x="557" y="140">sdd</text><text x="557" y="157" font-size="10">1 TB</text>
    <text x="725" y="140">sde</text><text x="725" y="157" font-size="10">copia de sdd</text>
    <text x="430" y="94" font-size="10.5">los datos</text><text x="430" y="108" font-size="10.5">se reparten</text><text x="430" y="122" font-size="10.5">entre los</text><text x="430" y="136" font-size="10.5">dos vdevs</text>
    <text x="440" y="222" font-size="10.5" text-anchor="start">todos comparten el espacio libre del pool</text>
    <text x="164" y="290" font-weight="700">tank/compartido</text>
    <g font-size="10.5"><text x="164" y="310">dataset (sistema de archivos)</text><text x="164" y="328">montado en /tank/compartido</text><text x="164" y="350">compression=lz4, quota=500G</text></g>
    <text x="696" y="290" font-weight="700">tank/vms/vm-100-disk-0</text>
    <g font-size="10.5"><text x="696" y="310">zvol (un disco virtual)</text><text x="696" y="328">/dev/zvol/tank/vms/…</text><text x="696" y="350">lo usa Proxmox para las VM</text></g>
    <text x="430" y="290" font-weight="700">tank/compartido@lunes</text>
    <g font-size="10.5"><text x="430" y="310">instantánea: solo lectura</text><text x="430" y="328">ocupa solo lo que cambió</text><text x="430" y="350">rollback, clone, send</text></g>
  </g>
</svg>
