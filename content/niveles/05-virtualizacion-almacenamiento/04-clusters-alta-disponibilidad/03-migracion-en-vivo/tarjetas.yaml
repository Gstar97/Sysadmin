- { id: t1, frente: "Migración en vivo", dorso: "Memoria en vueltas mientras la VM sigue andando; pausa final de milisegundos. Con disco compartido, el disco no viaja." }
- { id: t2, frente: "Qué la impide", dorso: "ISO o dispositivo local montado, disco local (--with-local-disks), CPU incompatible." }
- { id: t3, frente: "Tipo de CPU", dorso: "x86-64-v2-AES (por defecto) migra a cualquier nodo; host solo entre procesadores iguales." }
- { id: t4, frente: "Contenedores", dorso: "pct migrate ID NODO --restart: se apagan, se copian y arrancan. Unos segundos de corte." }
- { id: t5, frente: "Comandos", dorso: "qm migrate ID NODO --online [--with-local-disks]; qm disk move ID scsi0 ALMACENAMIENTO." }
