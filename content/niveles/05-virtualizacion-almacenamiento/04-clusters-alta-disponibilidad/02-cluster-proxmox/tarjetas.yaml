- { id: t1, frente: "Armar un clúster de Proxmox", dorso: "pvecm create NOMBRE en el primero; pvecm add IP en cada nodo que se une (vacío). pvecm status y pvecm nodes." }
- { id: t2, frente: "/etc/pve en un clúster", dorso: "Compartido entre los nodos (pmxcfs). Sin quórum, de solo lectura." }
- { id: t3, frente: "ha-manager", dorso: "add vm:ID, status, set --state, migrate. Estados: started, stopped, disabled, ignored." }
- { id: t4, frente: "Reglas de HA (PVE 9)", dorso: "node-affinity --nodes pve03:2,pve02:1 [--strict 1]; resource-affinity positive o negative." }
- { id: t5, frente: "Recuperación tras la caída de un nodo", dorso: "Unos 2 minutos (cercado con watchdog) más el arranque de la VM." }
- { id: t6, frente: "Dos nodos", dorso: "QDevice: corosync-qnetd en otro equipo, corosync-qdevice en los nodos, pvecm qdevice setup IP." }
- { id: t7, frente: "Mantenimiento de un nodo", dorso: "ha-manager crm-command node-maintenance enable NODO; migrar a mano las VM sin HA; después disable." }
