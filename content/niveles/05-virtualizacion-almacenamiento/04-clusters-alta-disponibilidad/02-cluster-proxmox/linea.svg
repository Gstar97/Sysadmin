<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Qué pasa cuando se cae un nodo con VM bajo alta disponibilidad</text>
  <g stroke="currentColor" stroke-width="2" fill="none"><path d="M40 120 L820 120"/><path d="M812 114 L822 120 L812 126"/></g>
  <g stroke="currentColor" stroke-width="1.2">
    <circle cx="60" cy="120" r="7" fill="var(--bad-soft, #fde2e2)"/>
    <circle cx="210" cy="120" r="7" fill="var(--warn-soft, #fbf0d0)"/>
    <circle cx="400" cy="120" r="7" fill="var(--warn-soft, #fbf0d0)"/>
    <circle cx="590" cy="120" r="7" fill="var(--ok-soft, #dcf5e4)"/>
    <circle cx="760" cy="120" r="7" fill="var(--ok-soft, #dcf5e4)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="60" y="100" font-weight="700">0 s</text>
    <text x="210" y="100" font-weight="700">unos segundos</text>
    <text x="400" y="100" font-weight="700">1 minuto</text>
    <text x="590" y="100" font-weight="700">unos 2 minutos</text>
    <text x="760" y="100" font-weight="700">+ arranque</text>
    <g font-size="10.5">
      <text x="60" y="148">pve03 se apaga:</text><text x="60" y="163">sus VM se cortan</text><text x="60" y="178">de golpe</text>
      <text x="210" y="148">corosync deja de verlo;</text><text x="210" y="163">pve01 y pve02 siguen</text><text x="210" y="178">con quórum (2 de 3)</text><text x="210" y="193">ha-manager: "fence"</text>
      <text x="400" y="148">si pve03 no estaba muerto</text><text x="400" y="163">sino aislado, su watchdog</text><text x="400" y="178">ya lo reinició: ahora sí</text><text x="400" y="193">se sabe que está apagado</text>
      <text x="590" y="148">el administrador de HA</text><text x="590" y="163">arranca las VM en otro</text><text x="590" y="178">nodo, según las reglas</text><text x="590" y="193">(ha-manager: "started")</text>
      <text x="760" y="148">lo que tarde el sistema</text><text x="760" y="163">de la VM en arrancar</text><text x="760" y="178">y la aplicación en</text><text x="760" y="193">estar lista</text>
    </g>
    <text x="430" y="232" font-size="11">Las VM sin alta disponibilidad, o con el disco en el almacenamiento local de pve03, quedan apagadas hasta que vuelva.</text>
  </g>
</svg>
