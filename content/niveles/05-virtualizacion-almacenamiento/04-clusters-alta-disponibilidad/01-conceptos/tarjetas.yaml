- { id: t1, frente: "Nueves", dorso: "99 %: 3,65 días/año. 99,9 %: 8,8 h. 99,99 %: 53 min. 99,999 %: 5 min. Los cortes planificados cuentan." }
- { id: t2, frente: "Alta disponibilidad", dorso: "Si se cae un nodo, sus VM arrancan en otro en minutos. Acorta el corte; no es tolerancia a fallos ni respaldo." }
- { id: t3, frente: "Quórum", dorso: "Decide solo la parte con más de la mitad de los votos. Evita el split brain. Dos nodos necesitan un tercer voto." }
- { id: t4, frente: "Split brain", dorso: "Dos partes del clúster deciden a la vez y arrancan la misma VM sobre el mismo disco: se rompen los datos." }
- { id: t5, frente: "Cercado (fencing)", dorso: "Asegurarse de que el nodo perdido está apagado antes de arrancar sus VM en otro: watchdog (Proxmox) o IPMI." }
- { id: t6, frente: "Requisitos de un clúster", dorso: "3 votos, N+1, red del clúster dedicada, almacenamiento compartido, nodos iguales, pruebas." }
