<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Un clúster de alta disponibilidad de tres nodos</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="36" width="820" height="40" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="40" y="110" width="230" height="130" rx="8" fill="var(--surface, #fff)"/>
    <rect x="315" y="110" width="230" height="130" rx="8" fill="var(--surface, #fff)"/>
    <rect x="590" y="110" width="230" height="130" rx="8" fill="var(--surface-2, #eef1f5)" stroke-dasharray="6 4"/>
    <rect x="20" y="262" width="820" height="40" rx="8" fill="var(--accent-soft, #ede4fd)"/>
    <rect x="20" y="330" width="390" height="90" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="430" y="330" width="190" height="90" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="640" y="330" width="200" height="90" rx="8" fill="var(--bad-soft, #fde2e2)"/>
  </g>
  <g fill="var(--surface, #fff)" stroke="currentColor" stroke-width="0.8">
    <rect x="55" y="165" width="95" height="28" rx="4"/><rect x="160" y="165" width="95" height="28" rx="4"/>
    <rect x="330" y="165" width="95" height="28" rx="4"/><rect x="435" y="165" width="95" height="28" rx="4"/><rect x="330" y="200" width="95" height="28" rx="4"/>
    <rect x="605" y="165" width="95" height="28" rx="4" stroke-dasharray="4 3"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <path d="M155 76 L155 110"/><path d="M430 76 L430 110"/><path d="M705 76 L705 110"/>
    <path d="M155 240 L155 262"/><path d="M430 240 L430 262"/><path d="M705 240 L705 262" stroke-dasharray="5 4"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="430" y="61"><tspan font-weight="700">Red de servicio</tspan>: los usuarios llegan a las VM (vmbr0)</text>
    <text x="155" y="134" font-weight="700">pve01</text><text x="155" y="152" font-size="10.5">en línea · 1 voto</text>
    <text x="430" y="134" font-weight="700">pve02</text><text x="430" y="152" font-size="10.5">en línea · 1 voto</text>
    <text x="705" y="134" font-weight="700">pve03</text><text x="705" y="152" font-size="10.5">se cayó · sin voto</text>
    <g font-size="10.5"><text x="102" y="183">web01</text><text x="207" y="183">dc01</text><text x="377" y="183">db01</text><text x="482" y="183">erp01</text><text x="377" y="218">app02</text><text x="652" y="183">app02</text></g>
    <text x="705" y="222" font-size="10.5">su VM arranca en pve02</text>
    <text x="430" y="287"><tspan font-weight="700">Red del clúster (corosync)</tspan>: dedicada y de baja latencia, para que los nodos se vean entre sí</text>
    <text x="215" y="355" font-weight="700">Almacenamiento compartido</text>
    <g font-size="10.5"><text x="215" y="374">los discos de las VM, visibles desde todos los nodos</text><text x="215" y="391">NFS, iSCSI, Ceph (o ZFS con réplica)</text><text x="215" y="408">sin esto, otro nodo no puede arrancar la VM</text></g>
    <text x="525" y="355" font-weight="700">Quórum</text>
    <g font-size="10.5"><text x="525" y="374">mayoría de votos: 2 de 3</text><text x="525" y="391">con 2 nodos, un QDevice</text><text x="525" y="408">o un testigo da el tercero</text></g>
    <text x="740" y="355" font-weight="700">Cercado (fencing)</text>
    <g font-size="10.5"><text x="740" y="374">antes de arrancar la VM en otro,</text><text x="740" y="391">asegurarse de que el nodo caído</text><text x="740" y="408">está apagado de verdad</text></g>
  </g>
</svg>
