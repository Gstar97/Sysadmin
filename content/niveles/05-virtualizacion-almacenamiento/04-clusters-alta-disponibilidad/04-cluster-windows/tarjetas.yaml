- { id: t1, frente: "Clúster de Windows con Hyper-V", dorso: "Nodos del mismo dominio, CSV en C:\\ClusterStorage, VM como roles, testigo." }
- { id: t2, frente: "Crear el clúster", dorso: "Install-WindowsFeature Failover-Clustering; Test-Cluster -Node; New-Cluster -Name -Node -StaticAddress." }
- { id: t3, frente: "Testigo", dorso: "Set-ClusterQuorum -FileShareWitness \\\\SRV\\Recurso | -CloudWitness | -DiskWitness. Fuera de los nodos." }
- { id: t4, frente: "Quórum dinámico", dorso: "Windows saca votos a los nodos que se apagan ordenadamente. Con 2 nodos sin testigo, uno queda sin voto." }
- { id: t5, frente: "VM en el clúster", dorso: "Archivos en el CSV; Add-ClusterVirtualMachineRole; Move-ClusterVirtualMachineRole -MigrationType Live." }
- { id: t6, frente: "Mantenimiento", dorso: "Suspend-ClusterNode -Drain; Resume-ClusterNode -Failback Immediate; Cluster-Aware Updating." }
