<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Un clúster de conmutación por error con Hyper-V</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="300" y="38" width="260" height="56" rx="8" fill="var(--accent-soft, #ede4fd)"/>
    <rect x="40" y="120" width="250" height="140" rx="8" fill="var(--surface, #fff)"/>
    <rect x="570" y="120" width="250" height="140" rx="8" fill="var(--surface, #fff)"/>
    <rect x="320" y="140" width="220" height="100" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="40" y="290" width="400" height="120" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="460" y="290" width="170" height="120" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="650" y="290" width="190" height="120" rx="8" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="var(--surface, #fff)" stroke="currentColor" stroke-width="0.8">
    <rect x="60" y="180" width="100" height="28" rx="4"/><rect x="170" y="180" width="100" height="28" rx="4"/>
    <rect x="590" y="180" width="100" height="28" rx="4"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <path d="M290 170 L320 170"/><path d="M540 170 L570 170"/><path d="M290 210 L320 210"/><path d="M540 210 L570 210"/>
    <path d="M165 260 L165 290"/><path d="M695 260 L695 290" stroke-dasharray="5 4"/><path d="M430 94 L430 140"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="430" y="60" font-weight="700">CLU01 · 192.168.10.30</text>
    <text x="430" y="78" font-size="10.5">el nombre del clúster: una cuenta de equipo en AD</text>
    <text x="165" y="144" font-weight="700">HV01</text><text x="165" y="162" font-size="10.5">Windows Server + Hyper-V</text>
    <text x="695" y="144" font-weight="700">HV02</text><text x="695" y="162" font-size="10.5">Windows Server + Hyper-V</text>
    <g font-size="10.5"><text x="110" y="198">web01</text><text x="220" y="198">sql01</text><text x="640" y="198">app01</text></g>
    <text x="165" y="236" font-size="10.5">roles del clúster: cada VM</text><text x="695" y="236" font-size="10.5">se mueve en vivo de un nodo a otro</text>
    <text x="430" y="164" font-weight="700">Redes</text>
    <g font-size="10.5"><text x="430" y="184">administración y clientes</text><text x="430" y="200">clúster (latido entre nodos)</text><text x="430" y="216">migración en vivo</text><text x="430" y="232">almacenamiento (iSCSI)</text></g>
    <text x="240" y="314" font-weight="700">Volúmenes compartidos del clúster (CSV)</text>
    <g font-size="10.5"><text x="240" y="336">un disco de la SAN (iSCSI o SAS) que ven los dos nodos</text><text x="240" y="354">a la vez, montado en C:\ClusterStorage\Volume1</text><text x="240" y="372">ahí van los .vhdx y la configuración de las VM</text><text x="240" y="390">una VM con archivos en un disco local no se puede mover</text></g>
    <text x="545" y="314" font-weight="700">Testigo</text>
    <g font-size="10.5"><text x="545" y="336">el tercer voto:</text><text x="545" y="354">un recurso compartido</text><text x="545" y="372">(\\FS01\Testigo),</text><text x="545" y="390">un disco o Azure</text></g>
    <text x="745" y="314" font-weight="700">Mantenimiento</text>
    <g font-size="10.5"><text x="745" y="336">drenar un nodo:</text><text x="745" y="354">sus VM se van en vivo;</text><text x="745" y="372">Cluster-Aware Updating</text><text x="745" y="390">actualiza de a uno</text></g>
  </g>
</svg>
