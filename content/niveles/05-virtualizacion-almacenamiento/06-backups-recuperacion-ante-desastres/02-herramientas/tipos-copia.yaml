tipo: diagrama
titulo: Tipos de copia
puntos:
  - id: completa
    titulo: Completa cada vez
    area: { x: 2.3, y: 17.5, ancho: 95.4, alto: 18 }
    texto: >-
      La más simple y la más fácil de restaurar (una sola copia), pero ocupa muchísimo y tarda
      cada noche lo mismo. Es lo que hace vzdump a una carpeta común: cada archivo .vma.zst tiene
      la VM entera.
  - id: incremental
    titulo: Incremental
    area: { x: 2.3, y: 38.1, ancho: 95.4, alto: 18 }
    texto: >-
      Cada copia guarda solo lo que cambió desde la anterior. Rápida y chica, pero para restaurar
      el jueves hacen falta la completa y todas las incrementales: si una se daña, las siguientes
      no sirven.
  - id: diferencial
    titulo: Diferencial
    area: { x: 2.3, y: 58.8, ancho: 95.4, alto: 18 }
    texto: >-
      Cada copia guarda todo lo que cambió desde la última completa: crece día a día, pero para
      restaurar alcanzan dos (la completa y la del día). Es el esquema clásico de las cintas.
  - id: dedup
    titulo: Deduplicada (incremental para siempre)
    area: { x: 2.3, y: 79.4, ancho: 95.4, alto: 18 }
    texto: >-
      Lo que hacen Proxmox Backup Server, restic, Borg o Kopia: los datos se parten en pedazos
      y cada pedazo se guarda una sola vez. Cada copia es una lista completa de pedazos, así que
      se restaura de una sola vez y se puede borrar cualquiera sin romper las otras; y cada noche
      solo viaja y se guarda lo nuevo. Por eso es el esquema de casi todas las herramientas
      actuales.
