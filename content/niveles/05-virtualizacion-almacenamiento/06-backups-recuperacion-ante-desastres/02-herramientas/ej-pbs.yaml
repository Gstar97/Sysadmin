pasos:
  - consigna: Mirá cuántas copias de web01 hay en pbs01 y de qué fechas.
    verificar:
      - { comando_usado: "pvesm list" }
    pistas:
      - "pvesm list pbs01 --vmid 100"
    solucion:
      - pvesm list pbs01 --vmid 100
    explicacion: >-
      Una por noche desde hace 45 días, más la protegida del cierre. En PBS cada copia es completa
      para restaurar pero se guarda deduplicada, así que 45 copias no ocupan 45 veces el disco;
      igual, sin retención, el datastore crece hasta llenarse.
  - consigna: >-
      Probá primero sin borrar nada (--dry-run 1) qué quedaría con 7 diarias, 4 semanales y 6
      mensuales, y después aplicalo de verdad.
    verificar:
      - { pve_respaldo: 100, almacenamiento: pbs01, cantidad: 11 }
      - { pve_respaldo: 101, almacenamiento: pbs01, cantidad: 10 }
    pistas:
      - "pvesm prune-backups pbs01 --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --dry-run 1"
      - "El mismo comando sin --dry-run lo aplica."
    solucion:
      - pvesm prune-backups pbs01 --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --dry-run 1
      - pvesm prune-backups pbs01 --keep-daily 7 --keep-weekly 4 --keep-monthly 6
      - pvesm list pbs01 --vmid 100
    explicacion: >-
      Con --dry-run se ve qué haría sin tocar nada: conviene siempre antes de borrar copias. La
      protegida quedó aunque no entra en ninguna regla. Ojo: en PBS, borrar una copia no libera
      el espacio enseguida, porque los pedazos pueden ser de otras copias; lo libera la "garbage
      collection" del datastore, que se programa en el PBS. En producción, la retención se
      configura una vez (en la tarea de respaldo o como "prune job" del PBS) y no a mano.
  - consigna: >-
      Antes de actualizar erp01, hacé una copia que no se borre con la retención, con una nota
      que diga para qué es ("erp01 antes de actualizar"). Comprobá que la retención no la toca.
    verificar:
      - { comando_usado: "--protected 1" }
      - { pve_respaldo: 101, almacenamiento: pbs01, cantidad: 11 }
    pistas:
      - "vzdump 101 --storage pbs01 --mode snapshot --protected 1 --notes-template '{{guestname}} antes de actualizar'"
      - "Después, volvé a correr la retención y mirá la lista."
    solucion:
      - vzdump 101 --storage pbs01 --mode snapshot --protected 1 --notes-template '{{guestname}} antes de actualizar'
      - pvesm prune-backups pbs01 --keep-daily 7 --keep-weekly 4 --keep-monthly 6
      - pvesm list pbs01 --vmid 101
    explicacion: >-
      Como erp01 tiene el agente de invitado, el respaldo congeló el sistema de archivos un
      instante (fs-freeze) para que la copia sea consistente, y como ya había copias anteriores,
      solo leyó lo que cambió (dirty-bitmap). La protegida queda hasta que alguien le saque la
      protección, que es lo que querés para el "por si acaso" de un cambio grande. Pero una copia
      protegida no es inmutable: un administrador (o quien robe su clave) se la puede sacar.
