tipo: terminal
shell: bash
titulo: Retención y copias protegidas en Proxmox Backup Server
descripcion: >-
  pve01 respalda todas las noches sus dos VM, web01 (100) y erp01 (101), en el almacenamiento
  pbs01, un Proxmox Backup Server. Nadie configuró la retención: hay 45 días de copias de cada
  una y el datastore está al 87 %. La copia de web01 de hace 44 días es la del cierre de año y
  está protegida. Esta noche hay que actualizar erp01.
estado_inicial:
  distro: ubuntu
  hostname: pve01
  usuario: root
  equipo: { cpus: 16, memoria_gb: 64, fisico: true }
  red:
    interfaces:
      - { nombre: eno1, ip: 192.168.10.21/24, estado: UP }
    puerta_enlace: 192.168.10.1
  proxmox:
    repos: no-subscription
    almacenamientos:
      - { id: local, tipo: dir, contenido: [iso, vztmpl, backup], ruta: /var/lib/vz }
      - { id: local-lvm, tipo: lvmthin, contenido: [images, rootdir] }
      - { id: pbs01, tipo: pbs, contenido: [backup], servidor: 192.168.10.75, datastore: principal, usuario: "backup@pbs", huella: "a3:9f:12:7c:5e:0b:44:d1:8e:2a:6f:93:c4:17:b8:05:e6:3d:72:aa:19:5c:80:fe:4b:21:d9:6a:37:c0:8b:5f" }
    vms:
      - { id: 100, nombre: web01, estado: running, discos: { scsi0: "local-lvm:vm-100-disk-0,size=32G" }, red: { net0: "virtio,bridge=vmbr0" } }
      - { id: 101, nombre: erp01, estado: running, agente: true, discos: { scsi0: "local-lvm:vm-101-disk-0,size=80G" }, red: { net0: "virtio,bridge=vmbr0" } }
    respaldos:
