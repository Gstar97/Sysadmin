- { id: t1, frente: "Completa, incremental, diferencial", dorso: "Incremental: desde la anterior (hacen falta todas). Diferencial: desde la completa (hacen falta dos)." }
- { id: t2, frente: "Deduplicada", dorso: "Pedazos guardados una vez; cada copia completa para restaurar. PBS, restic, Borg, Kopia." }
- { id: t3, frente: "restic, lo básico", dorso: "init, backup --tag --exclude, snapshots, diff, forget --keep-* --prune, restore ID --target." }
- { id: t4, frente: "rest-server --append-only", dorso: "El cliente agrega copias pero no borra (403). La retención se hace en el servidor." }
- { id: t5, frente: "Tareas de PBS", dorso: "Prune, garbage collection (libera espacio), verify, sync a otro PBS." }
- { id: t6, frente: "Protegida no es inmutable", dorso: "La protección evita la retención automática, pero un administrador se la puede sacar." }
