<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12">
<text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Instantánea, réplica y respaldo no son lo mismo</text>
<rect x="180" y="38" width="215" height="282" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-width="1.1"/>
<text x="287.5" y="62" text-anchor="middle" font-weight="700" fill="currentColor">Instantánea</text>
<text x="287.5" y="78" text-anchor="middle" font-size="10.5" fill="currentColor">ZFS, LVM, Proxmox, Hyper-V</text>
<rect x="405" y="38" width="215" height="282" rx="8" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.1"/>
<text x="512.5" y="62" text-anchor="middle" font-weight="700" fill="currentColor">Réplica o espejo</text>
<text x="512.5" y="78" text-anchor="middle" font-size="10.5" fill="currentColor">pvesr, zfs send, rsync --delete, DFS-R</text>
<rect x="630" y="38" width="215" height="282" rx="8" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1.1"/>
<text x="737.5" y="62" text-anchor="middle" font-weight="700" fill="currentColor">Respaldo</text>
<text x="737.5" y="78" text-anchor="middle" font-size="10.5" fill="currentColor">PBS, restic, Veeam</text>
<text x="20" y="112" font-weight="700" fill="currentColor">Dónde está</text>
<text x="287.5" y="112" text-anchor="middle" fill="currentColor">en los mismos discos</text>
<text x="512.5" y="112" text-anchor="middle" fill="currentColor">en otro equipo</text>
<text x="737.5" y="112" text-anchor="middle" fill="currentColor">en otro equipo y medio</text>
<text x="20" y="152" font-weight="700" fill="currentColor">Si se borra o cifra algo</text>
<text x="287.5" y="152" text-anchor="middle" fill="currentColor">la foto anterior sigue</text>
<text x="512.5" y="152" text-anchor="middle" fill="currentColor">el daño se copia en la</text>
<text x="737.5" y="152" text-anchor="middle" fill="currentColor">queda la copia de antes</text>
<text x="287.5" y="168" text-anchor="middle" fill="currentColor">(hasta que se borre)</text>
<text x="512.5" y="168" text-anchor="middle" fill="currentColor">próxima pasada</text>
<text x="737.5" y="168" text-anchor="middle" fill="currentColor">con su historia</text>
<text x="20" y="208" font-weight="700" fill="currentColor">Si se pierde el equipo</text>
<text x="287.5" y="208" text-anchor="middle" fill="currentColor">se pierde con él</text>
<text x="512.5" y="208" text-anchor="middle" fill="currentColor">sobrevive</text>
<text x="737.5" y="208" text-anchor="middle" fill="currentColor">sobrevive</text>
<text x="20" y="248" font-weight="700" fill="currentColor">Hacia atrás</text>
<text x="287.5" y="248" text-anchor="middle" fill="currentColor">horas o días</text>
<text x="512.5" y="248" text-anchor="middle" fill="currentColor">solo el último estado</text>
<text x="737.5" y="248" text-anchor="middle" fill="currentColor">meses o años</text>
<text x="20" y="288" font-weight="700" fill="currentColor">Sirve para</text>
<text x="287.5" y="288" text-anchor="middle" fill="currentColor">volver atrás un cambio</text>
<text x="512.5" y="288" text-anchor="middle" fill="currentColor">seguir andando rápido</text>
<text x="737.5" y="288" text-anchor="middle" fill="currentColor">recuperarse de casi todo</text>
<path d="M20 126 L840 126" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2 3" fill="none"/>
<path d="M20 186 L840 186" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2 3" fill="none"/>
<path d="M20 226 L840 226" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2 3" fill="none"/>
<path d="M20 266 L840 266" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2 3" fill="none"/>
</svg>