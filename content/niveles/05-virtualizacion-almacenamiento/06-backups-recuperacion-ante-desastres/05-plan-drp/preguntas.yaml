- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Qué es un plan de recuperación ante desastres?
  opciones:
    - { texto: "Un documento que dice quién hace qué, en qué orden y con qué copias para volver a funcionar después de un desastre", correcta: true, explicacion: "Se escribe y se prueba antes." }
    - { texto: "La política de respaldos", explicacion: "Es una parte, no todo." }
    - { texto: "Un seguro contra incendios", explicacion: "No." }
    - { texto: "El contrato con el proveedor de internet", explicacion: "No." }
- id: p02
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Después de perder todo, ¿qué conviene restaurar antes que el ERP?
  opciones:
    - { texto: "DNS y un controlador de dominio, y antes la red y la plataforma", correcta: true, explicacion: "Sin ellos, el ERP no anda aunque arranque." }
    - { texto: "Los puestos de trabajo", explicacion: "Van al final." }
    - { texto: "El sitio web", explicacion: "Depende de lo crítico, pero nunca antes que la identidad." }
    - { texto: "Nada: el ERP primero", explicacion: "Depende de otras cosas." }
- id: p03
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Después de un ransomware, ¿por qué no conviene restaurar directamente la copia de anoche?
  opciones:
    - { texto: "Porque el atacante pudo estar adentro desde antes y la copia puede incluir su puerta trasera", correcta: true, explicacion: "Hay que averiguar desde cuándo y restaurar de antes." }
    - { texto: "Porque está cifrada", explicacion: "Si es inmutable, no." }
    - { texto: "Porque es muy grande", explicacion: "No es el motivo." }
    - { texto: "Porque es ilegal", explicacion: "No." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Dónde tiene que estar el plan de recuperación?
  opciones:
    - { texto: "Impreso y en un lugar fuera de la infraestructura, además de la wiki", correcta: true, explicacion: "La wiki puede estar caída con todo lo demás." }
    - { texto: "Solo en la wiki interna", explicacion: "Se cae con el resto." }
    - { texto: "En la cabeza del sysadmin", explicacion: "Las personas no están siempre." }
    - { texto: "En el servidor de archivos", explicacion: "Puede estar cifrado." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué es un análisis de impacto (BIA)?
  opciones:
    - { texto: "Calcular, con quien usa cada servicio, cuánto cuesta tenerlo parado o perder sus datos", correcta: true, explicacion: "De ahí salen el RPO, el RTO y el orden." }
    - { texto: "Medir el rendimiento de los servidores", explicacion: "No." }
    - { texto: "Un escaneo de vulnerabilidades", explicacion: "No." }
    - { texto: "El presupuesto anual de IT", explicacion: "No." }
- id: p06
  tipo: respuesta_multiple
  dificultad: 2
  enunciado: Ante un ransomware, ¿qué es correcto? (Elegí todas las correctas.)
  opciones:
    - { texto: "Contener primero: aislar de internet y los equipos afectados", correcta: true, explicacion: "Para que no siga." }
    - { texto: "Restaurar en un entorno limpio, reinstalando los hipervisores", correcta: true, explicacion: "No encima de lo infectado." }
    - { texto: "Cambiar todas las credenciales", correcta: true, explicacion: "Las viejas las tiene el atacante." }
    - { texto: "Pagar enseguida para ahorrar tiempo", explicacion: "No garantiza nada y financia el próximo ataque." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué es un ejercicio de mesa?
  opciones:
    - { texto: "El equipo recorre el plan ante un desastre imaginario, diciendo qué haría cada uno, sin tocar nada", correcta: true, explicacion: "Barato y muy útil para encontrar huecos." }
    - { texto: "Restaurar todos los servidores", explicacion: "Eso es un simulacro técnico." }
    - { texto: "Una reunión de presupuesto", explicacion: "No." }
    - { texto: "Ordenar el escritorio", explicacion: "No." }
- id: p08
  tipo: opcion_multiple
  dificultad: 3
  enunciado: El plan dice "restaurar el ERP desde el PBS". El PBS estaba en la misma sala que se incendió. ¿Qué falta en el plan?
  opciones:
    - { texto: "El paso de levantar un PBS nuevo y traer las copias desde la copia de afuera, con lo que tarda", correcta: true, explicacion: "Puede llevar horas o días y cambia el RTO real." }
    - { texto: "Nada", explicacion: "Falta lo principal." }
    - { texto: "Comprar un ERP nuevo", explicacion: "No." }
    - { texto: "El número del proveedor de internet", explicacion: "Puede faltar, pero no es lo principal." }
- id: p09
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Por qué los contactos del plan tienen que estar fuera de los sistemas de la empresa?
  opciones:
    - { texto: "Porque el correo y la central telefónica pueden estar caídos justo en el desastre", correcta: true, explicacion: "Teléfonos personales y una lista impresa." }
    - { texto: "Por privacidad", explicacion: "No es el motivo." }
    - { texto: "Porque cambian seguido", explicacion: "Igual hay que actualizarlos." }
    - { texto: "No hace falta", explicacion: "Sí hace falta." }
- id: p10
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Una pyme con RTO de 8 horas para su ERP y poco presupuesto. ¿Qué sitio alternativo tiene sentido?
  opciones:
    - { texto: "Un sitio tibio (otro Proxmox en otra sede con respaldos recientes) o recuperación en la nube", correcta: true, explicacion: "Cumple el RTO sin pagar todo doble." }
    - { texto: "Un sitio caliente con todo replicado", explicacion: "Carísimo para ese RTO." }
    - { texto: "Un sitio frío", explicacion: "Tarda días." }
    - { texto: "Ninguno", explicacion: "Si la sala se pierde, no cumple." }
- id: p11
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Quién declara el desastre según un buen plan?
  opciones:
    - { texto: "Un rol definido en el plan (con reemplazo), según un criterio escrito de antemano", correcta: true, explicacion: "Para no perder horas discutiendo." }
    - { texto: "Cualquiera que vea el problema", explicacion: "Genera caos." }
    - { texto: "El proveedor", explicacion: "No." }
    - { texto: "Nadie: se ve solo", explicacion: "Hay que decidirlo." }
