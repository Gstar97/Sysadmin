- { id: t1, frente: "Qué tiene un DRP", dorso: "Alcance (BIA, RPO, RTO), roles, inventario y dependencias, procedimientos, dónde están copias y claves, sitio alternativo, comunicación, pruebas." }
- { id: t2, frente: "Orden de recuperación", dorso: "Red y plataforma, identidad (DNS, dominio, DHCP), datos, aplicaciones, personas." }
- { id: t3, frente: "Ransomware", dorso: "Contener, restaurar en limpio desde antes del ataque, cambiar todas las credenciales. Pagar no garantiza nada." }
- { id: t4, frente: "Sitios alternativos", dorso: "Caliente (minutos, todo doble), tibio (horas), frío (días), nube (horas, pagás al usarla)." }
- { id: t5, frente: "Probar el plan", dorso: "Ejercicio de mesa y simulacro técnico; corregir el plan después de cada uno." }
