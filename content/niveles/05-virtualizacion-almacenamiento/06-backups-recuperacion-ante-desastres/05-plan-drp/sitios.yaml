tipo: emparejar
consigna: Uní cada tipo de sitio alternativo con lo que permite.
pares:
  - { a: "Sitio caliente: otro centro de datos con todo replicado y encendido", b: "Volver en minutos u horas, pagando todo doble" }
  - { a: "Sitio tibio: equipos instalados en otra sede, con respaldos recientes", b: "Volver en horas o un día, restaurando" }
  - { a: "Sitio frío: un lugar con energía y red, sin equipos listos", b: "Volver en días o semanas, comprando y armando" }
  - { a: "Recuperación en la nube: VM que se crean en un proveedor desde los respaldos", b: "Volver en horas, pagando solo cuando se usa" }
explicacion: >-
  La elección sale del RTO de los servicios más críticos y de cuánto se puede gastar. Muchas
  pymes combinan: un sitio tibio para lo crítico (otro Proxmox en otra sede con el PBS de afuera)
  y el resto, cuando se pueda.
