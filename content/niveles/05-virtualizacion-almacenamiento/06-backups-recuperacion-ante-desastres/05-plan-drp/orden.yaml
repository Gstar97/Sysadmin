tipo: ordenar
consigna: Un ransomware cifró todos los servidores de la empresa. Ya está contenido. Ordená la recuperación.
pasos:
  - Aislar la red de la sede de internet y verificar que el atacante no sigue adentro
  - Reinstalar los hipervisores desde cero y levantar un servidor de respaldo limpio
  - Restaurar DNS y un controlador de dominio desde una copia de antes del ataque, y cambiar todas las claves
  - Restaurar las bases de datos y el servidor de archivos
  - Restaurar el ERP y comprobar que emite una factura de prueba
  - Habilitar los puestos de trabajo y el acceso remoto, y avisar que se puede volver a trabajar
explicacion: >-
  De abajo hacia arriba en las capas, con dos cosas propias del ransomware: restaurar desde una
  copia de antes de que entrara el atacante (no la de anoche, que puede tener su puerta trasera) y
  cambiar todas las credenciales, porque las viejas las tiene él.
