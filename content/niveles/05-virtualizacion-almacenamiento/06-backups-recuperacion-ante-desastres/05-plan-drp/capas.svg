<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12">
<defs><marker id="fl-drp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
<text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">El orden de recuperación sale de las dependencias: cada capa necesita la de abajo</text>
<rect x="60" y="330" width="620" height="46" rx="6" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1"/>
<text x="76" y="350" font-weight="700" fill="currentColor">1. Lo físico y la red</text>
<text x="76" y="367" font-size="10.5" fill="currentColor">energía, internet, firewall, switches</text>
<rect x="78" y="276" width="584" height="46" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1"/>
<text x="94" y="296" font-weight="700" fill="currentColor">2. La plataforma</text>
<text x="94" y="313" font-size="10.5" fill="currentColor">hipervisores, almacenamiento, PBS</text>
<rect x="96" y="222" width="548" height="46" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1"/>
<text x="112" y="242" font-weight="700" fill="currentColor">3. Identidad y nombres</text>
<text x="112" y="259" font-size="10.5" fill="currentColor">DNS, controladores de dominio, DHCP</text>
<rect x="114" y="168" width="512" height="46" rx="6" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-width="1"/>
<text x="130" y="188" font-weight="700" fill="currentColor">4. Los datos</text>
<text x="130" y="205" font-size="10.5" fill="currentColor">bases de datos, servidor de archivos</text>
<rect x="132" y="114" width="476" height="46" rx="6" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-width="1"/>
<text x="148" y="134" font-weight="700" fill="currentColor">5. Las aplicaciones</text>
<text x="148" y="151" font-size="10.5" fill="currentColor">ERP, correo, sitio web, sistemas internos</text>
<rect x="150" y="60" width="440" height="46" rx="6" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1"/>
<text x="166" y="80" font-weight="700" fill="currentColor">6. Las personas</text>
<text x="166" y="97" font-size="10.5" fill="currentColor">puestos, VPN, teléfonos, avisos</text>
<path d="M730 360 L730 60" stroke="currentColor" stroke-width="2" fill="none" marker-end="url(#fl-drp)"/>
<g fill="currentColor" font-size="10.5"><text x="745" y="345">se recupera</text><text x="745" y="359">primero</text><text x="745" y="70">se recupera</text><text x="745" y="84">al final</text><text x="745" y="200">sin DNS ni</text><text x="745" y="214">dominio, nada</text><text x="745" y="228">más arranca</text><text x="745" y="242">bien</text></g>
</svg>