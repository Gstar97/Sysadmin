<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12">
<defs><marker id="fl-esc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
<text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Escalera de verificación: cada escalón prueba más que el anterior</text>
<rect x="20" y="250" width="134" height="90" rx="6" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1"/>
<text x="87.0" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">1</text>
<text x="87.0" y="290" text-anchor="middle" font-weight="700" font-size="11" fill="currentColor">La tarea terminó</text>
<text x="87.0" y="304" text-anchor="middle" font-weight="700" font-size="11" fill="currentColor">bien</text>
<text x="87.0" y="332" text-anchor="middle" font-size="10" fill="currentColor">cada noche</text>
<rect x="159" y="212" width="134" height="128" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1"/>
<text x="226.0" y="234" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">2</text>
<text x="226.0" y="252" text-anchor="middle" font-weight="700" font-size="11" fill="currentColor">La estructura está</text>
<text x="226.0" y="266" text-anchor="middle" font-weight="700" font-size="11" fill="currentColor">sana</text>
<text x="226.0" y="332" text-anchor="middle" font-size="10" fill="currentColor">cada semana</text>
<rect x="298" y="174" width="134" height="166" rx="6" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1"/>
<text x="365.0" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">3</text>
<text x="365.0" y="214" text-anchor="middle" font-weight="700" font-size="11" fill="currentColor">Los datos se pueden</text>
<text x="365.0" y="228" text-anchor="middle" font-weight="700" font-size="11" fill="currentColor">leer</text>
<text x="365.0" y="332" text-anchor="middle" font-size="10" fill="currentColor">cada semana, rotando</text>
<rect x="437" y="136" width="134" height="204" rx="6" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-width="1"/>
<text x="504.0" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">4</text>
<text x="504.0" y="176" text-anchor="middle" font-weight="700" font-size="11" fill="currentColor">Restaurar archivos y</text>
<text x="504.0" y="190" text-anchor="middle" font-weight="700" font-size="11" fill="currentColor">comparar</text>
<text x="504.0" y="332" text-anchor="middle" font-size="10" fill="currentColor">cada mes</text>
<rect x="576" y="98" width="134" height="242" rx="6" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-width="1"/>
<text x="643.0" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">5</text>
<text x="643.0" y="138" text-anchor="middle" font-weight="700" font-size="11" fill="currentColor">Restaurar la VM</text>
<text x="643.0" y="152" text-anchor="middle" font-weight="700" font-size="11" fill="currentColor">aislada y probarla</text>
<text x="643.0" y="332" text-anchor="middle" font-size="10" fill="currentColor">cada mes o trimestre</text>
<rect x="715" y="60" width="134" height="280" rx="6" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1"/>
<text x="782.0" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">6</text>
<text x="782.0" y="100" text-anchor="middle" font-weight="700" font-size="11" fill="currentColor">Simulacro completo,</text>
<text x="782.0" y="114" text-anchor="middle" font-weight="700" font-size="11" fill="currentColor">cronometrado</text>
<text x="782.0" y="332" text-anchor="middle" font-size="10" fill="currentColor">una o dos veces por año</text>
<text x="30" y="70" font-size="10.5" fill="currentColor">más trabajo, más certeza</text>
<path d="M30 78 L360 78" stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#fl-esc)"/>
