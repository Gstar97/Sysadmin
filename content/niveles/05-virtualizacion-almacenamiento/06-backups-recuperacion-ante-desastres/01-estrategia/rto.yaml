tipo: emparejar
consigna: Uní cada servicio con el RPO y el RTO que tiene sentido pedirle en una empresa de 80 personas.
pares:
  - { a: "El sistema de facturación, que usan todo el día", b: "RPO de 15 minutos, RTO de 1 hora" }
  - { a: "Las carpetas compartidas de la oficina", b: "RPO de 1 día, RTO de 4 horas" }
  - { a: "El servidor de pruebas de los desarrolladores", b: "RPO de 1 semana, RTO de 3 días" }
  - { a: "El archivo histórico de contratos (solo se consulta)", b: "RPO de 1 mes, RTO de 1 semana" }
explicacion: >-
  No los decide el sysadmin solo: se acuerdan con quien usa cada servicio, preguntando cuánto le
  cuesta una hora parado o un día de trabajo perdido. Cuanto más chicos, más caros (copias más
  seguidas, réplicas, servidores de reserva), así que no tiene sentido pedir lo mismo para todo.
