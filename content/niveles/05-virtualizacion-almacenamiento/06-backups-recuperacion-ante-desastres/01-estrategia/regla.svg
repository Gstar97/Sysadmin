<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">La regla 3-2-1-1-0, con un ejemplo de una oficina</text>
  <g stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="40" width="156" height="276" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="186" y="40" width="156" height="276" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="352" y="40" width="156" height="276" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="518" y="40" width="156" height="276" rx="8" fill="var(--bad-soft, #fbe0e0)"/>
    <rect x="684" y="40" width="156" height="276" rx="8" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="98" y="84" font-size="34" font-weight="700">3</text><text x="98" y="108" font-weight="700">copias de los datos</text>
    <g font-size="10.5"><text x="98" y="140">los datos de trabajo</text><text x="98" y="156">y dos copias más</text><text x="98" y="190" font-weight="700">ej.:</text><text x="98" y="206">el servidor de archivos,</text><text x="98" y="222">el Proxmox Backup Server</text><text x="98" y="238">y una copia en otra sede</text><text x="98" y="272">una sola copia es</text><text x="98" y="288">ninguna copia</text></g>
    <text x="264" y="84" font-size="34" font-weight="700">2</text><text x="264" y="108" font-weight="700">tipos de medio</text>
    <g font-size="10.5"><text x="264" y="140">que no fallen por</text><text x="264" y="156">la misma causa</text><text x="264" y="190" font-weight="700">ej.:</text><text x="264" y="206">discos del PBS y</text><text x="264" y="222">almacenamiento de objetos</text><text x="264" y="238">(o cinta, o un NAS aparte)</text><text x="264" y="272">no dos carpetas en</text><text x="264" y="288">el mismo disco</text></g>
    <text x="430" y="84" font-size="34" font-weight="700">1</text><text x="430" y="108" font-weight="700">fuera del sitio</text>
    <g font-size="10.5"><text x="430" y="140">lejos de un incendio,</text><text x="430" y="156">una inundación o un robo</text><text x="430" y="190" font-weight="700">ej.:</text><text x="430" y="206">rest-server en otra</text><text x="430" y="222">sede, o un bucket S3</text><text x="430" y="238">de un proveedor</text><text x="430" y="272">otra sala del mismo</text><text x="430" y="288">edificio no alcanza</text></g>
    <text x="596" y="84" font-size="34" font-weight="700">1</text><text x="596" y="108" font-weight="700">inmutable o aislada</text>
    <g font-size="10.5"><text x="596" y="140">que nadie pueda borrar,</text><text x="596" y="156">ni con la clave de admin</text><text x="596" y="190" font-weight="700">ej.:</text><text x="596" y="206">bucket con bloqueo de</text><text x="596" y="222">objetos por 30 días, o</text><text x="596" y="238">rest-server solo agregar</text><text x="596" y="272">la que sobrevive a</text><text x="596" y="288">un ransomware</text></g>
    <text x="762" y="84" font-size="34" font-weight="700">0</text><text x="762" y="108" font-weight="700">errores al verificar</text>
    <g font-size="10.5"><text x="762" y="140">copias revisadas y</text><text x="762" y="156">restauraciones probadas</text><text x="762" y="190" font-weight="700">ej.:</text><text x="762" y="206">verificación semanal</text><text x="762" y="222">y un simulacro de</text><text x="762" y="238">restauración por mes</text><text x="762" y="272">una copia que nunca se</text><text x="762" y="288">probó es una esperanza</text></g>
  </g>
</svg>
