- { id: t1, frente: "3-2-1-1-0", dorso: "3 copias, 2 medios, 1 afuera, 1 inmutable o aislada, 0 errores al verificar." }
- { id: t2, frente: "Lo que no es un respaldo", dorso: "RAID, copias de Ceph, réplicas, carpetas sincronizadas: copian el desastre al instante." }
- { id: t3, frente: "RPO y RTO", dorso: "RPO: cuánto se puede perder (frecuencia). RTO: cuánto se tarda en volver (forma y lugar de restaurar)." }
- { id: t4, frente: "Lo que se olvida respaldar", dorso: "Configuración (/etc/pve, switches, firewall), bases consistentes, claves de los respaldos, nube, documentación." }
- { id: t5, frente: "Retención GFS", dorso: "Muchas copias recientes y pocas viejas: por ejemplo 7 diarias, 4 semanales, 12 mensuales." }
