tipo: diagrama
titulo: La regla 3-2-1-1-0
puntos:
  - id: tres
    titulo: 3 copias
    area: { x: 2.3, y: 12.1, ancho: 18.1, alto: 83.6 }
    texto: >-
      Los datos con los que se trabaja más dos copias. Con una sola copia, el día que la necesitás
      puede estar dañada, incompleta o haberse dejado de hacer hace semanas sin que nadie se dé
      cuenta. El RAID, el espejo de ZFS y las tres copias de Ceph no cuentan: protegen contra un
      disco roto, no contra un borrado o un cifrado, que se copian solos a todas partes.
  - id: dos
    titulo: 2 tipos de medio
    area: { x: 21.6, y: 12.1, ancho: 18.1, alto: 83.6 }
    texto: >-
      Que las copias no puedan fallar por la misma causa: un servidor de respaldos con sus discos y
      un almacenamiento de objetos, o cinta, o un NAS de otra marca. Dos carpetas en el mismo
      servidor caen juntas.
  - id: fuera
    titulo: 1 fuera del sitio
    area: { x: 40.9, y: 12.1, ancho: 18.1, alto: 83.6 }
    texto: >-
      Un incendio, una inundación o un robo se llevan todo lo que está en el mismo edificio. La
      copia de afuera puede estar en otra sede de la empresa, en la casa de un socio (con cifrado)
      o en un proveedor de almacenamiento de objetos.
  - id: inmutable
    titulo: 1 inmutable o aislada
    area: { x: 60.2, y: 12.1, ancho: 18.1, alto: 83.6 }
    texto: >-
      El ransomware de hoy primero busca los respaldos y los borra, usando las claves de
      administrador que robó. Una copia inmutable (bloqueo de objetos, rest-server solo agregar,
      un PBS remoto que solo acepta copias nuevas) o desconectada (un disco que se lleva a casa,
      una cinta) es la que queda en pie. Es la pieza que más se olvida y la que más salva.
  - id: cero
    titulo: 0 errores
    area: { x: 79.5, y: 12.1, ancho: 18.1, alto: 83.6 }
    texto: >-
      Revisar que las copias estén enteras (verificación) y probar que se pueden restaurar
      (simulacro). Lo vas a hacer en la lección 5.6.4. Un respaldo que nunca se restauró es una
      esperanza, no un respaldo.
