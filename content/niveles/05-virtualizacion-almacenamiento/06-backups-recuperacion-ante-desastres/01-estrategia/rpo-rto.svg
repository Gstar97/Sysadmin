<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="fl-rr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">RPO y RTO en la línea del tiempo</text>
  <rect x="200" y="92" width="230" height="36" fill="var(--bad-soft, #fbe0e0)" stroke="none"/>
  <rect x="430" y="92" width="290" height="36" fill="var(--warn-soft, #fbf0d0)" stroke="none"/>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <path d="M40 110 L820 110" marker-end="url(#fl-rr)"/>
    <path d="M200 70 L200 150"/>
    <path d="M430 60 L430 160" stroke-width="3"/>
    <path d="M720 70 L720 150"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" fill="none" marker-start="url(#fl-rr)" marker-end="url(#fl-rr)">
    <path d="M204 176 L426 176"/>
    <path d="M434 176 L716 176"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="200" y="60">última copia buena</text>
    <text x="430" y="50" font-weight="700">el desastre</text>
    <text x="720" y="60">todo anda de nuevo</text>
    <text x="315" y="86" font-size="11">datos que se pierden</text>
    <text x="575" y="86" font-size="11">tiempo sin servicio</text>
    <text x="315" y="198" font-weight="700">RPO: cuánto se puede perder</text>
    <text x="315" y="213" font-size="10.5">lo decide la frecuencia de las copias</text>
    <text x="575" y="198" font-weight="700">RTO: cuánto se puede tardar en volver</text>
    <text x="575" y="213" font-size="10.5">lo decide cómo y desde dónde se restaura</text>
  </g>
</svg>
