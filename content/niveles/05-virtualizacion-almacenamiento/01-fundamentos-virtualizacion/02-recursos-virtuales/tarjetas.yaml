- { id: t1, frente: "vCPU", dorso: "Un turno en un hilo real, no un núcleo reservado. 3 o 4 por hilo en servidores comunes; cerca de 1 a 1 en bases de datos." }
- { id: t2, frente: "CPU ready / steal", dorso: "Tiempo que la VM esperó turno. En Linux, columna st de top y vmstat. VM lenta con CPU baja: mirá esto." }
- { id: t3, frente: "Recuperar memoria", dorso: "Globo (ballooning), memoria dinámica (Hyper-V) y páginas compartidas (KSM, TPS). Lo peor: la swap del host." }
- { id: t4, frente: "Thin o thick", dorso: "Dinámico: ocupa lo escrito (vigilar el espacio real). Preasignado: todo desde el principio." }
- { id: t5, frente: "Formatos de disco", dorso: "qcow2 (KVM), raw (todos), vmdk (VMware), vhdx (Hyper-V), vdi (VirtualBox). qemu-img convert entre ellos." }
- { id: t6, frente: "Modos de red", dorso: "Puente (en la red de la empresa), NAT (detrás del host, laboratorio) y aislada (solo entre VM)." }
