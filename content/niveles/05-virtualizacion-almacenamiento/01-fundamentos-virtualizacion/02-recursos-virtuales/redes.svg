<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Tres formas de conectar una VM a la red</text>
  <g fill="currentColor" text-anchor="middle" font-weight="700">
    <text x="145" y="50">Puente</text>
    <text x="430" y="50">NAT</text>
    <text x="715" y="50">Aislada (interna)</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="30" y="70" width="230" height="44" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="30" y="250" width="230" height="80" rx="8" fill="var(--surface, #fff)"/>
    <rect x="45" y="200" width="200" height="34" rx="5" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="45" y="138" width="90" height="40" rx="5" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="155" y="138" width="90" height="40" rx="5" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="315" y="70" width="230" height="44" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="315" y="250" width="230" height="80" rx="8" fill="var(--surface, #fff)"/>
    <rect x="330" y="200" width="200" height="34" rx="5" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="330" y="138" width="90" height="40" rx="5" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="440" y="138" width="90" height="40" rx="5" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="600" y="70" width="230" height="44" rx="6" fill="var(--surface-2, #eef1f5)" stroke-dasharray="5 4"/>
    <rect x="600" y="250" width="230" height="80" rx="8" fill="var(--surface, #fff)"/>
    <rect x="615" y="200" width="200" height="34" rx="5" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="615" y="138" width="90" height="40" rx="5" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="725" y="138" width="90" height="40" rx="5" fill="var(--info-soft, #e0e9fd)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="145" y1="114" x2="145" y2="200"/>
    <line x1="90" y1="178" x2="90" y2="200"/><line x1="200" y1="178" x2="200" y2="200"/>
    <line x1="430" y1="114" x2="430" y2="200"/>
    <line x1="375" y1="178" x2="375" y2="200"/><line x1="485" y1="178" x2="485" y2="200"/>
    <line x1="660" y1="178" x2="660" y2="200"/><line x1="770" y1="178" x2="770" y2="200"/>
    <line x1="715" y1="114" x2="715" y2="200" stroke-dasharray="4 4" stroke="#d6452f"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="11.5">
    <text x="145" y="90" font-weight="700">Red de la empresa</text><text x="145" y="106" font-size="10.5">192.168.10.0/24 (switch y router)</text>
    <text x="90" y="155" font-weight="700">VM 1</text><text x="90" y="170" font-size="10.5">192.168.10.51</text>
    <text x="200" y="155" font-weight="700">VM 2</text><text x="200" y="170" font-size="10.5">192.168.10.52</text>
    <text x="145" y="222">puente: vmbr0, br0, virbr</text>
    <text x="145" y="275" font-weight="700">El hipervisor</text><text x="145" y="292" font-size="10.5">su placa física es un puerto más</text><text x="145" y="307" font-size="10.5">del puente</text>
    <text x="430" y="90" font-weight="700">Red de la empresa</text><text x="430" y="106" font-size="10.5">solo ve al hipervisor (192.168.10.21)</text>
    <text x="375" y="155" font-weight="700">VM 1</text><text x="375" y="170" font-size="10.5">192.168.122.51</text>
    <text x="485" y="155" font-weight="700">VM 2</text><text x="485" y="170" font-size="10.5">192.168.122.52</text>
    <text x="430" y="222">red interna con DHCP (virbr0)</text>
    <text x="430" y="275" font-weight="700">El hipervisor</text><text x="430" y="292" font-size="10.5">traduce las direcciones (NAT)</text><text x="430" y="307" font-size="10.5">y reparte IP por DHCP</text>
    <text x="715" y="90" font-weight="700">Sin salida</text><text x="715" y="106" font-size="10.5">ni hacia la red ni desde ella</text>
    <text x="660" y="155" font-weight="700">VM 1</text><text x="660" y="170" font-size="10.5">10.0.0.1</text>
    <text x="770" y="155" font-weight="700">VM 2</text><text x="770" y="170" font-size="10.5">10.0.0.2</text>
    <text x="715" y="222">puente sin placa física</text>
    <text x="715" y="275" font-weight="700">El hipervisor</text><text x="715" y="292" font-size="10.5">las VM se ven entre ellas</text><text x="715" y="307" font-size="10.5">(y con el host, si es interna)</text>
  </g>
</svg>
