<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Tres formas de repartir un servidor</text>
  <g fill="currentColor" text-anchor="middle" font-weight="700">
    <text x="145" y="50">Hipervisor tipo 1</text>
    <text x="430" y="50">Hipervisor tipo 2</text>
    <text x="715" y="50">Contenedores</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <!-- tipo 1 -->
    <rect x="30" y="330" width="230" height="40" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="30" y="280" width="230" height="40" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="30" y="70" width="70" height="200" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="110" y="70" width="70" height="200" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="190" y="70" width="70" height="200" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <!-- tipo 2 -->
    <rect x="315" y="330" width="230" height="40" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="315" y="280" width="230" height="40" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="315" y="230" width="140" height="40" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="465" y="230" width="80" height="40" rx="6" fill="var(--surface, #fff)"/>
    <rect x="315" y="70" width="65" height="150" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="390" y="70" width="65" height="150" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <!-- contenedores -->
    <rect x="600" y="330" width="230" height="40" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="600" y="280" width="230" height="40" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="600" y="230" width="230" height="40" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="600" y="130" width="70" height="90" rx="6" fill="var(--accent-soft, #ede4fd)"/>
    <rect x="680" y="130" width="70" height="90" rx="6" fill="var(--accent-soft, #ede4fd)"/>
    <rect x="760" y="130" width="70" height="90" rx="6" fill="var(--accent-soft, #ede4fd)"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="11.5">
    <text x="145" y="355">Hardware (CPU con VT-x / AMD-V)</text>
    <text x="145" y="305" font-weight="700">Hipervisor</text>
    <text x="65" y="95" font-weight="700">VM 1</text><text x="65" y="215">Apps</text><text x="65" y="245">SO propio</text><text x="65" y="260" font-size="10">y su kernel</text>
    <text x="145" y="95" font-weight="700">VM 2</text><text x="145" y="215">Apps</text><text x="145" y="245">SO propio</text><text x="145" y="260" font-size="10">y su kernel</text>
    <text x="225" y="95" font-weight="700">VM 3</text><text x="225" y="215">Apps</text><text x="225" y="245">SO propio</text><text x="225" y="260" font-size="10">y su kernel</text>
    <text x="430" y="355">Hardware (una PC o notebook)</text>
    <text x="430" y="298" font-weight="700">Sistema anfitrión</text><text x="430" y="313" font-size="10.5">Windows, macOS o Linux</text>
    <text x="385" y="255" font-weight="700">Hipervisor (programa)</text>
    <text x="505" y="250">Otros</text><text x="505" y="263">programas</text>
    <text x="347" y="95" font-weight="700">VM 1</text><text x="347" y="180">Apps</text><text x="347" y="205">SO</text>
    <text x="422" y="95" font-weight="700">VM 2</text><text x="422" y="180">Apps</text><text x="422" y="205">SO</text>
    <text x="715" y="355">Hardware</text>
    <text x="715" y="305" font-weight="700">Un solo sistema y un solo kernel</text>
    <text x="715" y="255" font-weight="700">Motor de contenedores</text>
    <text x="635" y="160" font-weight="700">App 1</text><text x="635" y="185" font-size="10.5">bibliotecas</text>
    <text x="715" y="160" font-weight="700">App 2</text><text x="715" y="185" font-size="10.5">bibliotecas</text>
    <text x="795" y="160" font-weight="700">App 3</text><text x="795" y="185" font-size="10.5">bibliotecas</text>
  </g>
  <g fill="currentColor" font-size="10.5" text-anchor="middle">
    <text x="145" y="390">ESXi, Hyper-V, Proxmox (KVM), XCP-ng</text>
    <text x="430" y="390">VirtualBox, VMware Workstation, UTM</text>
    <text x="715" y="390">LXC, Docker, Podman</text>
  </g>
</svg>
