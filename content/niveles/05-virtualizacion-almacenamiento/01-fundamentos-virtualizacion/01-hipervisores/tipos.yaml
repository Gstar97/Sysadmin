tipo: emparejar
consigna: Uní cada producto con lo que es.
pares:
  - { a: "VMware ESXi", b: "Hipervisor de tipo 1 con sistema propio, el de vSphere" }
  - { a: "Proxmox VE", b: "Debian con KVM y QEMU: tipo 1 de código abierto, con VM y contenedores" }
  - { a: "Hyper-V", b: "Tipo 1 de Microsoft: Windows Server pasa a correr arriba del hipervisor" }
  - { a: "VirtualBox", b: "Tipo 2: un programa sobre Windows, macOS o Linux, para laboratorios" }
  - { a: "LXC", b: "Contenedores de sistema: comparten el kernel del equipo" }
explicacion: >-
  KVM es parte del kernel de Linux: cuando se carga el módulo, el propio Linux hace de hipervisor.
  QEMU pone los dispositivos virtuales (disco, red, placa de video) y libvirt o Proxmox los
  administran. La gran mayoría de las nubes públicas corren sobre KVM o sobre Hyper-V.
