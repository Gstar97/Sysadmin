- { id: t1, frente: "VT-x / AMD-V", dorso: "Extensiones de la CPU para que el código de la VM corra directo; EPT o NPT hacen lo mismo con la memoria." }
- { id: t2, frente: "Tipo 1 y tipo 2", dorso: "Tipo 1 sobre el hardware (ESXi, Hyper-V, Proxmox); tipo 2 como programa (VirtualBox, Workstation)." }
- { id: t3, frente: "KVM, QEMU, libvirt", dorso: "KVM: módulo del kernel (hipervisor). QEMU: los dispositivos. libvirt: la administración (virsh)." }
- { id: t4, frente: "virtio", dorso: "Disco y red pensados para VM: mucho más rápidos que imitar hardware. Windows necesita virtio-win." }
- { id: t5, frente: "Contenedor o VM", dorso: "El contenedor comparte el kernel (liviano, aísla menos); la VM tiene su sistema y su kernel." }
- { id: t6, frente: "¿Puede ser hipervisor?", dorso: "grep -cE 'vmx|svm' /proc/cpuinfo, lsmod | grep kvm, ls -l /dev/kvm, virt-host-validate." }
- { id: t7, frente: "Virtualización anidada", dorso: "VM que crea VM: para laboratorios. Se activa en el hipervisor de abajo." }
