- { id: t1, frente: "Imagen de la nube", dorso: "Sistema ya instalado y mínimo, sin usuarios ni nombre: lo pone cloud-init al primer arranque." }
- { id: t2, frente: "Generalizar", dorso: "Borrar lo único de cada servidor (machine-id, claves SSH, nombre): cloud-init clean, virt-sysprep, sysprep." }
- { id: t3, frente: "user-data", dorso: "#cloud-config, hostname, users con ssh_authorized_keys, packages, runcmd. Corre solo la primera vez." }
- { id: t4, frente: "Instantánea", dorso: "Para volver atrás en un cambio; se borra después; no es respaldo." }
- { id: t5, frente: "Clon completo o enlazado", dorso: "Completo: copia todo, independiente. Enlazado: solo diferencias, depende de la plantilla." }
- { id: t6, frente: "En caliente", dorso: "Agrandar disco, bajar memoria con el globo, agregar placa de red. vCPU y máximo de memoria: en general, al reiniciar." }
- { id: t7, frente: "Dar de baja", dorso: "Confirmar, apagar unos días, respaldo final, borrar con discos, sacar de DNS, monitoreo, respaldo y documentación." }
