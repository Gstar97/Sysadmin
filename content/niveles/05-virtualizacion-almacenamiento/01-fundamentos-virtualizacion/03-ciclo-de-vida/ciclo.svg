<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="12">
  <defs><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">La vida de una máquina virtual</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="45" width="150" height="110" rx="8" fill="var(--surface-2, #eef1f5)"/>
    <rect x="200" y="45" width="150" height="110" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="380" y="45" width="190" height="110" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="600" y="45" width="110" height="110" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="730" y="45" width="110" height="110" rx="8" fill="var(--bad-soft, #fde2e2)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M170 100 L196 100" marker-end="url(#ca)"/>
    <path d="M350 100 L376 100" marker-end="url(#ca)"/>
    <path d="M570 100 L596 100" marker-end="url(#ca)"/>
    <path d="M710 100 L726 100" marker-end="url(#ca)"/>
    <path d="M655 155 C 655 185, 475 185, 475 160" marker-end="url(#ca)" stroke-dasharray="5 4"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="95" y="68" font-weight="700">1. La plantilla</text>
    <text x="95" y="88" font-size="11">imagen de la nube o</text><text x="95" y="103" font-size="11">VM generalizada</text><text x="95" y="118" font-size="11">(sin nombre, claves</text><text x="95" y="133" font-size="11">ni machine-id)</text>
    <text x="275" y="68" font-weight="700">2. Crear</text>
    <text x="275" y="88" font-size="11">clon completo o enlazado</text><text x="275" y="103" font-size="11">+ cloud-init en el</text><text x="275" y="118" font-size="11">primer arranque: nombre,</text><text x="275" y="133" font-size="11">usuarios, red, paquetes</text>
    <text x="475" y="68" font-weight="700">3. Operar</text>
    <text x="475" y="88" font-size="11">parchear y respaldar</text><text x="475" y="103" font-size="11">instantánea antes de un cambio</text><text x="475" y="118" font-size="11">(y borrarla después)</text><text x="475" y="133" font-size="11">ajustar CPU, memoria y disco</text>
    <text x="655" y="68" font-weight="700">4. Mover</text>
    <text x="655" y="88" font-size="11">a otro host,</text><text x="655" y="103" font-size="11">en frío o</text><text x="655" y="118" font-size="11">en vivo</text><text x="655" y="133" font-size="11">(módulo 5.4)</text>
    <text x="785" y="68" font-weight="700">5. Dar de baja</text>
    <text x="785" y="88" font-size="11">respaldo final,</text><text x="785" y="103" font-size="11">borrar discos,</text><text x="785" y="118" font-size="11">DNS, monitoreo</text><text x="785" y="133" font-size="11">y documentación</text>
  </g>
  <text x="430" y="205" text-anchor="middle" font-weight="700" fill="currentColor">Los discos de un clon enlazado con una instantánea</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="70" y="225" width="200" height="60" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="330" y="225" width="200" height="60" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="590" y="225" width="200" height="60" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M330 255 L274 255" marker-end="url(#ca)"/>
    <path d="M590 255 L534 255" marker-end="url(#ca)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="170" y="248" font-weight="700">base (plantilla)</text><text x="170" y="266" font-size="11">solo lectura: no se toca</text><text x="170" y="280" font-size="11">ni se borra</text>
    <text x="430" y="248" font-weight="700">web01: las diferencias</text><text x="430" y="266" font-size="11">lo que web01 cambió</text><text x="430" y="280" font-size="11">respecto de la base</text>
    <text x="690" y="248" font-weight="700">después de la instantánea</text><text x="690" y="266" font-size="11">lo nuevo va acá; cada capa</text><text x="690" y="280" font-size="11">más hace leer un poco más</text>
  </g>
  <text x="430" y="318" text-anchor="middle" font-size="11" fill="currentColor">Cada flecha es "lo que no tengo, buscalo en el anterior". Si falla un archivo de la cadena, falla la VM: por eso una instantánea no es un respaldo.</text>
</svg>
