tipo: ordenar
consigna: Ordená los pasos para dar de baja una máquina virtual que ya no se usa.
pasos:
  - Confirmar con el dueño del servicio que nadie la usa (y anotar quién lo confirmó)
  - Apagarla y esperar unos días por si alguien reclama
  - Hacer un respaldo final y guardarlo el tiempo que diga la política
  - Borrar la VM con sus discos e instantáneas
  - Sacarla del DNS, del monitoreo, del respaldo programado y de la documentación
explicacion: >-
  Apagar antes de borrar es la forma más barata de descubrir que alguien la usaba. Y una VM que
  se borró pero sigue en el monitoreo o en el respaldo programado genera alertas y errores
  todas las noches.
