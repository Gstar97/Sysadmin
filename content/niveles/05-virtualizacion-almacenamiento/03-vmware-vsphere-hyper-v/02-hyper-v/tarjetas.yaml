- { id: t1, frente: "Cómo está armado Hyper-V", dorso: "Tipo 1: hipervisor, partición raíz (el Windows que ves, con los drivers reales) y particiones hijas (las VM), unidas por VMBus." }
- { id: t2, frente: "Tipos de conmutador", dorso: "Externo: con la red física. Interno: VM y host. Privado: solo VM." }
- { id: t3, frente: "Linux de generación 2", dorso: "Set-VMFirmware -SecureBootTemplate MicrosoftUEFICertificateAuthority, con la VM apagada." }
- { id: t4, frente: "Discos .vhdx", dorso: "Dinámico (crece), fijo (reservado), diferencial (cambios sobre un padre). Hasta 64 TB." }
- { id: t5, frente: "Puntos de control", dorso: "De producción: VSS, sin memoria (por defecto). Estándar: con memoria. Ninguno es respaldo." }
- { id: t6, frente: "Licencias con Hyper-V", dorso: "Hyper-V viene con Windows Server. Standard: 2 VM Windows por licencia completa del host. Datacenter: ilimitadas. Linux: no paga." }
- { id: t7, frente: "Antes de la primera VM", dorso: "Set-VMHost con las rutas en D:, conmutador externo creado desde la consola física." }
