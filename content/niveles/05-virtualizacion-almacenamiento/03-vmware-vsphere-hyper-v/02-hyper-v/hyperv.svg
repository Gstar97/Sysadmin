<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="system-ui, sans-serif" font-size="12">
  <text x="250" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Cómo está armado Hyper-V</text>
  <text x="670" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Los tres tipos de conmutador</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="40" width="175" height="222" rx="8" fill="var(--accent-soft, #ede4fd)"/>
    <rect x="210" y="40" width="130" height="222" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="355" y="40" width="130" height="222" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="20" y="272" width="465" height="30" rx="6" fill="var(--surface, #fff)"/>
    <rect x="20" y="315" width="465" height="44" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="20" y="370" width="465" height="44" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="510" y="40" width="330" height="100" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="510" y="152" width="330" height="80" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="510" y="244" width="330" height="80" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="510" y="336" width="330" height="78" rx="8" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="var(--surface, #fff)" stroke="currentColor" stroke-width="0.8">
    <rect x="35" y="215" width="145" height="26" rx="3"/>
    <rect x="222" y="215" width="106" height="26" rx="3"/>
    <rect x="367" y="215" width="106" height="26" rx="3"/>
    <rect x="525" y="90" width="58" height="24" rx="3"/><rect x="595" y="90" width="58" height="24" rx="3"/><rect x="665" y="90" width="58" height="24" rx="3"/><rect x="745" y="90" width="80" height="24" rx="3"/>
    <rect x="525" y="196" width="58" height="24" rx="3"/><rect x="595" y="196" width="58" height="24" rx="3"/><rect x="665" y="196" width="58" height="24" rx="3"/>
    <rect x="525" y="288" width="58" height="24" rx="3"/><rect x="595" y="288" width="58" height="24" rx="3"/>
  </g>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <path d="M107 241 L107 272"/><path d="M275 241 L275 272"/><path d="M420 241 L420 272"/>
    <path d="M252 302 L252 315"/>
    <path d="M745 102 L723 102"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="107" y="62" font-weight="700">Partición raíz</text>
    <text x="107" y="78" font-size="10.5">el Windows Server que ves</text>
    <g font-size="10.5"><text x="107" y="104">administración: Hyper-V</text><text x="107" y="118">Manager, PowerShell, WAC</text><text x="107" y="142">los drivers reales del</text><text x="107" y="156">disco y de la red</text><text x="107" y="180">atiende el disco y la red</text><text x="107" y="194">de las VM</text></g>
    <text x="107" y="232" font-size="10.5">VSP (proveedor)</text>
    <text x="275" y="62" font-weight="700">VM 1</text>
    <text x="275" y="78" font-size="10.5">Windows Server</text>
    <g font-size="10.5"><text x="275" y="104">partición hija</text><text x="275" y="128">servicios de</text><text x="275" y="142">integración</text><text x="275" y="156">incluidos en Windows</text></g>
    <text x="275" y="232" font-size="10.5">VSC (cliente)</text>
    <text x="420" y="62" font-weight="700">VM 2</text>
    <text x="420" y="78" font-size="10.5">Ubuntu Server</text>
    <g font-size="10.5"><text x="420" y="104">partición hija</text><text x="420" y="128">drivers hv_*</text><text x="420" y="142">incluidos en el kernel</text><text x="420" y="156">(y hyperv-daemons)</text></g>
    <text x="420" y="232" font-size="10.5">VSC (cliente)</text>
    <text x="252" y="291" font-size="11"><tspan font-weight="700">VMBus</tspan>: el canal rápido por el que las VM (VSC) le piden disco y red a la raíz (VSP)</text>
    <text x="252" y="334" font-weight="700">Hipervisor Hyper-V (tipo 1)</text>
    <text x="252" y="350" font-size="10.5">corre directo sobre el hardware, debajo de todo, incluso del Windows del host</text>
    <text x="252" y="389" font-weight="700">Hardware del servidor</text>
    <text x="252" y="405" font-size="10.5">CPU con virtualización (Intel VT-x o AMD-V) y SLAT</text>
    <text x="675" y="60" font-weight="700">Externo</text>
    <text x="675" y="76" font-size="10.5">une las VM con la red física (como un puente de Proxmox)</text>
    <g font-size="10.5"><text x="554" y="106">VM</text><text x="624" y="106">VM</text><text x="694" y="106">host</text><text x="785" y="106">placa física</text></g>
    <text x="675" y="132" font-size="10">el host comparte la placa si se crea con -AllowManagementOS</text>
    <text x="675" y="172" font-weight="700">Interno</text>
    <text x="675" y="188" font-size="10.5">VM entre sí y con el host, sin salir a la red</text>
    <g font-size="10.5"><text x="554" y="212">VM</text><text x="624" y="212">VM</text><text x="694" y="212">host</text></g>
    <text x="675" y="264" font-weight="700">Privado</text>
    <text x="675" y="280" font-size="10.5">solo las VM entre sí: ni el host las ve</text>
    <g font-size="10.5"><text x="554" y="304">VM</text><text x="624" y="304">VM</text></g>
    <text x="675" y="356" font-weight="700">En cada VM</text>
    <g font-size="10.5"><text x="675" y="373">discos .vhdx: dinámico, fijo o diferencial</text><text x="675" y="389">generación 1 (BIOS) o 2 (UEFI, arranque seguro)</text><text x="675" y="405">puntos de control: de producción o estándar</text></g>
  </g>
</svg>
