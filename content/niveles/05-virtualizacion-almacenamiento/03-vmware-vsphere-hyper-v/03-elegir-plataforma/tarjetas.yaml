- { id: t1, frente: "Criterios para elegir", dorso: "Costo (hipervisor + Windows de las VM), lo que sabe el equipo, respaldos, soporte, integración, escala." }
- { id: t2, frente: "Tres formas de llevar una VM a Proxmox", dorso: "Asistente de ESXi (desde 8.2), copiar el disco e importarlo con qm, restaurar desde el respaldo." }
- { id: t3, frente: "Firmware al migrar", dorso: "Igual que antes: BIOS → SeaBIOS; UEFI (generación 2) → OVMF con efidisk0." }
- { id: t4, frente: "INACCESSIBLE_BOOT_DEVICE", dorso: "Windows sin drivers VirtIO en un disco SCSI. Arrancar con sata0, instalar virtio-win y pasar a scsi0." }
- { id: t5, frente: "Linux migrado sin red", dorso: "Cambió el nombre de la placa (ens192 → ens18): corregir Netplan. Cambiar open-vm-tools por qemu-guest-agent." }
- { id: t6, frente: "La VM original", dorso: "Queda apagada y respaldada hasta que la nueva anduvo bien un tiempo." }
