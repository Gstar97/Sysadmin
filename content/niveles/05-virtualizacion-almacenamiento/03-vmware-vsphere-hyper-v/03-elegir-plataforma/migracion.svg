<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Migrar una VM a Proxmox, paso a paso</text>
  <rect x="20" y="44" width="152" height="180" rx="8" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1.2"/>
  <text x="96" y="68" text-anchor="middle" font-weight="700" fill="currentColor">1. Preparar</text>
  <text x="96" y="84" text-anchor="middle" font-size="10.5" fill="currentColor" font-style="italic">en el hipervisor viejo</text>
  <text x="96" y="114" text-anchor="middle" font-size="10.5" fill="currentColor">inventario de CPU,</text>
  <text x="96" y="134" text-anchor="middle" font-size="10.5" fill="currentColor">memoria, discos, red</text>
  <text x="96" y="154" text-anchor="middle" font-size="10.5" fill="currentColor">e IP, y el firmware</text>
  <text x="96" y="174" text-anchor="middle" font-size="10.5" fill="currentColor">Windows: virtio-win</text>
  <text x="96" y="194" text-anchor="middle" font-size="10.5" fill="currentColor">sin instantáneas</text>
  <path d="M174 134 L185 134" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M179 129 L185 134 L179 139" stroke="currentColor" stroke-width="1.6" fill="none"/>
  <rect x="187" y="44" width="152" height="180" rx="8" fill="var(--info-soft, #e0e9fd)" stroke="currentColor" stroke-width="1.2"/>
  <text x="263" y="68" text-anchor="middle" font-weight="700" fill="currentColor">2. Copiar</text>
  <text x="263" y="84" text-anchor="middle" font-size="10.5" fill="currentColor" font-style="italic">con la VM apagada</text>
  <text x="263" y="114" text-anchor="middle" font-size="10.5" fill="currentColor">exportar el disco:</text>
  <text x="263" y="134" text-anchor="middle" font-size="10.5" fill="currentColor">.vmdk de VMware</text>
  <text x="263" y="154" text-anchor="middle" font-size="10.5" fill="currentColor">.vhdx de Hyper-V</text>
  <text x="263" y="174" text-anchor="middle" font-size="10.5" fill="currentColor">o usar el asistente</text>
  <text x="263" y="194" text-anchor="middle" font-size="10.5" fill="currentColor">de importación de ESXi</text>
  <path d="M341 134 L352 134" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M346 129 L352 134 L346 139" stroke="currentColor" stroke-width="1.6" fill="none"/>
  <rect x="354" y="44" width="152" height="180" rx="8" fill="var(--accent-soft, #ede4fd)" stroke="currentColor" stroke-width="1.2"/>
  <text x="430" y="68" text-anchor="middle" font-weight="700" fill="currentColor">3. Importar</text>
  <text x="430" y="84" text-anchor="middle" font-size="10.5" fill="currentColor" font-style="italic">en Proxmox</text>
  <text x="430" y="114" text-anchor="middle" font-size="10.5" fill="currentColor">qm disk import</text>
  <text x="430" y="134" text-anchor="middle" font-size="10.5" fill="currentColor">o qm create</text>
  <text x="430" y="154" text-anchor="middle" font-size="10.5" fill="currentColor">con import-from</text>
  <text x="430" y="174" text-anchor="middle" font-size="10.5" fill="currentColor">(lee vmdk y vhdx;</text>
  <text x="430" y="194" text-anchor="middle" font-size="10.5" fill="currentColor">si no, qemu-img)</text>
  <path d="M508 134 L519 134" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M513 129 L519 134 L513 139" stroke="currentColor" stroke-width="1.6" fill="none"/>
  <rect x="521" y="44" width="152" height="180" rx="8" fill="var(--warn-soft, #fbf0d0)" stroke="currentColor" stroke-width="1.2"/>
  <text x="597" y="68" text-anchor="middle" font-weight="700" fill="currentColor">4. Ajustar</text>
  <text x="597" y="84" text-anchor="middle" font-size="10.5" fill="currentColor" font-style="italic">antes de encender</text>
  <text x="597" y="114" text-anchor="middle" font-size="10.5" fill="currentColor">firmware:</text>
  <text x="597" y="134" text-anchor="middle" font-size="10.5" fill="currentColor">SeaBIOS u OVMF</text>
  <text x="597" y="154" text-anchor="middle" font-size="10.5" fill="currentColor">disco: SATA primero,</text>
  <text x="597" y="174" text-anchor="middle" font-size="10.5" fill="currentColor">SCSI con drivers</text>
  <text x="597" y="194" text-anchor="middle" font-size="10.5" fill="currentColor">red virtio y agente</text>
  <path d="M675 134 L686 134" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M680 129 L686 134 L680 139" stroke="currentColor" stroke-width="1.6" fill="none"/>
  <rect x="688" y="44" width="152" height="180" rx="8" fill="var(--ok-soft, #dcf5e4)" stroke="currentColor" stroke-width="1.2"/>
  <text x="764" y="68" text-anchor="middle" font-weight="700" fill="currentColor">5. Probar</text>
  <text x="764" y="84" text-anchor="middle" font-size="10.5" fill="currentColor" font-style="italic">y recién después</text>
  <text x="764" y="114" text-anchor="middle" font-size="10.5" fill="currentColor">arranca y tiene red</text>
  <text x="764" y="134" text-anchor="middle" font-size="10.5" fill="currentColor">la aplicación anda</text>
  <text x="764" y="154" text-anchor="middle" font-size="10.5" fill="currentColor">el respaldo funciona</text>
  <text x="764" y="174" text-anchor="middle" font-size="10.5" fill="currentColor">la vieja queda</text>
  <text x="764" y="194" text-anchor="middle" font-size="10.5" fill="currentColor">apagada un tiempo</text>
  <text x="430" y="252" text-anchor="middle" font-size="11" fill="currentColor">Si algo falla en el paso 5, la VM vieja sigue ahí: se vuelve a encender y no se perdió nada.</text>
</svg>
