- { id: t1, frente: "ESXi y vCenter", dorso: "ESXi: el hipervisor en cada host. vCenter: la VM que administra todo (clúster, vMotion, HA, DRS, plantillas)." }
- { id: t2, frente: "Datastores", dorso: "VMFS sobre SAN (iSCSI, FC), NFS o vSAN (los discos de los hosts)." }
- { id: t3, frente: "Red en vSphere", dorso: "Standard Switch (por host) o Distributed Switch (desde vCenter); grupos de puertos con VLAN." }
- { id: t4, frente: "VMware Tools", dorso: "Drivers (vmxnet3, paravirtual), apagado ordenado e información. En Linux: open-vm-tools." }
- { id: t5, frente: "Licencias (2026)", dorso: "Suscripción, paquetes VCF o VVF, por núcleo con mínimo 16 por procesador. vSphere 8: soporte hasta octubre de 2027." }
- { id: t6, frente: "Al heredar vSphere", dorso: "Versiones, vencimiento de la suscripción, respaldos y su prueba, instantáneas viejas, capacidad, VMware Tools." }
