<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Las piezas de VMware vSphere</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="300" y="40" width="260" height="60" rx="8" fill="var(--accent-soft, #ede4fd)"/>
    <rect x="20" y="130" width="820" height="170" rx="10" fill="var(--surface, #fff)"/>
    <rect x="40" y="165" width="180" height="120" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="240" y="165" width="180" height="120" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="440" y="165" width="180" height="120" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="640" y="150" width="185" height="140" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="20" y="320" width="400" height="80" rx="8" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="440" y="320" width="400" height="80" rx="8" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="var(--surface, #fff)" stroke="currentColor" stroke-width="0.8">
    <rect x="55" y="215" width="70" height="26" rx="3"/><rect x="135" y="215" width="70" height="26" rx="3"/><rect x="55" y="248" width="70" height="26" rx="3"/>
    <rect x="255" y="215" width="70" height="26" rx="3"/><rect x="335" y="215" width="70" height="26" rx="3"/>
    <rect x="455" y="215" width="70" height="26" rx="3"/><rect x="535" y="215" width="70" height="26" rx="3"/><rect x="455" y="248" width="70" height="26" rx="3"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none" stroke-dasharray="5 4">
    <path d="M430 100 L430 130"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="430" y="63" font-weight="700">vCenter Server</text><text x="430" y="81" font-size="11">una VM (appliance) que administra todo</text><text x="430" y="95" font-size="11">clúster, vMotion, HA, DRS, plantillas, permisos</text>
    <text x="60" y="148" text-anchor="start" font-weight="700">Datacenter · Clúster (HA y DRS)</text>
    <text x="130" y="188" font-weight="700">ESXi 1</text><text x="130" y="204" font-size="10.5">hipervisor en el hardware</text>
    <text x="330" y="188" font-weight="700">ESXi 2</text><text x="330" y="204" font-size="10.5">hipervisor en el hardware</text>
    <text x="530" y="188" font-weight="700">ESXi 3</text><text x="530" y="204" font-size="10.5">hipervisor en el hardware</text>
    <g font-size="10.5"><text x="90" y="232">VM</text><text x="170" y="232">VM</text><text x="90" y="265">VM</text><text x="290" y="232">VM</text><text x="370" y="232">VM</text><text x="490" y="232">VM</text><text x="570" y="232">VM</text><text x="490" y="265">VM</text></g>
    <text x="732" y="172" font-weight="700">Datastores</text><text x="732" y="192" font-size="11">VMFS sobre una SAN</text><text x="732" y="208" font-size="11">(iSCSI, Fibre Channel)</text><text x="732" y="224" font-size="11">NFS de un NAS</text><text x="732" y="240" font-size="11">vSAN: los discos</text><text x="732" y="256" font-size="11">de los propios hosts</text><text x="732" y="276" font-size="10.5">compartidos por todos</text>
    <text x="220" y="342" font-weight="700">Red: switches virtuales</text><text x="220" y="360" font-size="11">vSphere Standard Switch: uno por host, a mano</text><text x="220" y="376" font-size="11">Distributed Switch: uno para todos, desde vCenter</text><text x="220" y="392" font-size="11">grupos de puertos con su VLAN para las VM</text>
    <text x="640" y="342" font-weight="700">En cada VM</text><text x="640" y="360" font-size="11">archivos .vmx (configuración) y .vmdk (discos)</text><text x="640" y="376" font-size="11">VMware Tools (drivers, agente, apagado)</text><text x="640" y="392" font-size="11">instantáneas, plantillas, Content Library</text>
  </g>
