tipo: emparejar
consigna: Uní cada pieza de vSphere con su equivalente en Proxmox VE.
pares:
  - { a: "vCenter Server", b: "La web y la API del clúster de Proxmox (no hace falta una VM aparte)" }
  - { a: "Host ESXi", b: "Un nodo de Proxmox" }
  - { a: "vMotion", b: "Migración en vivo (qm migrate --online)" }
  - { a: "Grupo de puertos con VLAN en un Distributed Switch", b: "Puente vlan-aware con tag en cada VM (o una VNet de SDN)" }
  - { a: "VMware Tools", b: "Drivers virtio y el agente de QEMU" }
  - { a: "vSAN", b: "Ceph" }
explicacion: >-
  Las ideas son las mismas en todos los hipervisores; cambian los nombres y dónde se configuran.
  Por eso pasar de uno a otro es más fácil de lo que parece: lo difícil es mover las VM, no
  aprender la plataforma.
