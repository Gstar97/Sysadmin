- id: p01
  tipo: opcion_multiple
  diagnostico: true
  dificultad: 1
  enunciado: ¿Qué es vCenter Server?
  opciones:
    - { texto: "La administración central de vSphere: una VM que maneja todos los hosts ESXi, el clúster, vMotion y las plantillas", correcta: true, explicacion: "Sin vCenter, cada host se maneja suelto." }
    - { texto: "El hipervisor de VMware", explicacion: "Ese es ESXi." }
    - { texto: "Un tipo de datastore", explicacion: "No." }
    - { texto: "El driver de red de las VM", explicacion: "Ese es vmxnet3, de las VMware Tools." }
- id: p02
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Si se cae vCenter, ¿qué pasa con las VM?
  opciones:
    - { texto: "Siguen funcionando, pero no se puede administrar el conjunto (vMotion, plantillas, permisos)", correcta: true, explicacion: "Igual se respalda como un servidor crítico." }
    - { texto: "Se apagan todas", explicacion: "Corren en los hosts." }
    - { texto: "Se mueven a otro host", explicacion: "No." }
    - { texto: "Se borran", explicacion: "No." }
- id: p03
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué es VMFS?
  opciones:
    - { texto: "El sistema de archivos de VMware para que varios hosts usen a la vez el mismo disco de una SAN", correcta: true, explicacion: "Los datastores compartidos." }
    - { texto: "El formato de los discos de las VM", explicacion: "Ese es vmdk." }
    - { texto: "Un protocolo de red", explicacion: "No." }
    - { texto: "El nombre de vSAN en Proxmox", explicacion: "No." }
- id: p04
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Cuál es el equivalente de las VMware Tools en Proxmox?
  opciones:
    - { texto: "Los drivers virtio y el agente de QEMU", correcta: true, explicacion: "Drivers de disco y red, apagado ordenado e información para el hipervisor." }
    - { texto: "vCenter", explicacion: "No." }
    - { texto: "Proxmox Backup Server", explicacion: "No." }
    - { texto: "No tiene", explicacion: "Sí tiene." }
- id: p05
  tipo: opcion_multiple
  dificultad: 2
  enunciado: Un servidor tiene dos procesadores de 12 núcleos. ¿Cuántos núcleos se licencian de vSphere?
  opciones:
    - { texto: "32: mínimo 16 por procesador", correcta: true, explicacion: "Aunque tenga 12, se pagan 16 por procesador." }
    - { texto: "24", explicacion: "Se aplica el mínimo de 16 por procesador." }
    - { texto: "2: se licencia por procesador", explicacion: "Ahora es por núcleo." }
    - { texto: "16 en total", explicacion: "Es 16 por procesador." }
- id: p06
  tipo: respuesta_multiple
  dificultad: 2
  enunciado: ¿Qué cambió en el licenciamiento de VMware desde la compra de Broadcom? (Elegí todas las correctas.)
  opciones:
    - { texto: "Se terminaron las licencias perpetuas: todo es suscripción", correcta: true, explicacion: "Se paga año a año." }
    - { texto: "Se vende en paquetes (VCF y VVF)", correcta: true, explicacion: "Las ediciones sueltas casi desaparecieron." }
    - { texto: "Se paga por núcleo con mínimo de 16 por procesador", correcta: true, explicacion: "Antes era por procesador." }
    - { texto: "vSphere 9 se puede usar gratis en producción", explicacion: "No: el ESXi gratuito es la versión 8, limitada y para pruebas." }
- id: p07
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué es vMotion?
  opciones:
    - { texto: "Mover una VM en marcha de un host a otro sin cortarla", correcta: true, explicacion: "Storage vMotion mueve sus discos de datastore." }
    - { texto: "Hacer una instantánea", explicacion: "No." }
    - { texto: "Respaldar una VM", explicacion: "No." }
    - { texto: "Reiniciar una VM en otro host cuando el suyo se cae", explicacion: "Eso es HA." }
- id: p08
  tipo: opcion_multiple
  dificultad: 3
  enunciado: Heredás un clúster de vSphere. ¿Qué revisás primero?
  opciones:
    - { texto: "Versiones y soporte, vencimiento de la suscripción, respaldos (y su última prueba) e instantáneas viejas", correcta: true, explicacion: "Antes de tocar nada." }
    - { texto: "Actualizar todo a la última versión", explicacion: "Sin saber qué hay, es arriesgado." }
    - { texto: "Migrar a Proxmox", explicacion: "Primero se entiende lo que hay." }
    - { texto: "Borrar las instantáneas sin mirar", explicacion: "Puede haber una que alguien necesita." }
- id: p09
  tipo: opcion_multiple
  dificultad: 2
  enunciado: ¿Qué diferencia hay entre un Standard Switch y un Distributed Switch?
  opciones:
    - { texto: "El Standard se configura en cada host; el Distributed se define una vez en vCenter para todos", correcta: true, explicacion: "Con muchos hosts, el Distributed evita errores." }
    - { texto: "El Distributed no tiene VLAN", explicacion: "Las tiene, en los grupos de puertos." }
    - { texto: "Son lo mismo", explicacion: "Se administran distinto." }
    - { texto: "El Standard es solo para vSAN", explicacion: "No." }
- id: p10
  tipo: opcion_multiple
  dificultad: 1
  enunciado: ¿Con qué se automatiza vSphere?
  opciones:
    - { texto: "Con PowerCLI, un módulo de PowerShell (Get-VM, New-VM, Move-VM)", correcta: true, explicacion: "También con la API y con Ansible o Terraform." }
    - { texto: "Solo a mano", explicacion: "Se automatiza mucho." }
    - { texto: "Con qm", explicacion: "qm es de Proxmox." }
    - { texto: "Con virsh", explicacion: "virsh es de libvirt." }
