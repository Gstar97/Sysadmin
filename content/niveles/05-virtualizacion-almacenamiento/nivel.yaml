id: n5
titulo: Virtualización y almacenamiento
descripcion: 'Cómo se consolidan servidores en pocos equipos físicos y cómo se protege todo: hipervisores
  (Proxmox VE, VMware vSphere, Hyper-V), clusters con alta disponibilidad y migración en vivo, almacenamiento
  en red (NAS, SAN, iSCSI, ZFS, Ceph) y una estrategia de backup y recuperación ante desastres que funcione
  de verdad.'
perfil_salida: Diseñar y operar una plataforma de virtualización en cluster con almacenamiento compartido,
  alta disponibilidad, backups verificados y un plan de recuperación ante desastres probado con simulacros.
insignia:
  nombre: Virtualización y almacenamiento
  color: '#be123c'
proyecto_plan:
  titulo: Cluster de virtualización con recuperación ante desastres
  horas: 24
  entregables:
  - Tres nodos Proxmox (pueden ser anidados) con almacenamiento compartido (Ceph, o ZFS con replicación).
  - Alta disponibilidad probada con migración en vivo y caída de nodo.
  - Proxmox Backup Server con copia inmutable y copia fuera del sitio.
  - Plan de recuperación ante desastres escrito y simulacro de restauración medido contra RPO y RTO.
