- { id: t1, frente: "Disco recomendado", dorso: "SCSI, VirtIO SCSI single, IO thread, discard (y SSD emulation)." }
- { id: t2, frente: "Agente de QEMU", dorso: "Activado en la VM e instalado adentro (qemu-guest-agent): apagado ordenado, IP, respaldos coherentes." }
- { id: t3, frente: "Tipo de CPU", dorso: "De fábrica (x86-64-v2-AES) para mover entre nodos distintos; host para todo el rendimiento en nodos iguales." }
- { id: t4, frente: "Windows en Proxmox", dorso: "OVMF + disco EFI + TPM, y los drivers virtio-win (ISO como segunda lectora)." }
- { id: t5, frente: "Plantilla cloud-init", dorso: "qm create con import-from, ide2 cloudinit, --ciuser --sshkeys --ipconfig0, qm template, qm clone." }
- { id: t6, frente: "Contenedor LXC", dorso: "Linux con el kernel del nodo. pveam download, pct create --unprivileged 1. Para servicios Linux simples." }
