tipo: emparejar
consigna: ¿Máquina virtual o contenedor? Uní cada caso con la mejor opción y el porqué.
pares:
  - { a: "Un controlador de dominio con Windows Server", b: "VM: los contenedores solo pueden ser Linux" }
  - { a: "Un servidor DNS interno con Unbound", b: "Contenedor sin privilegios: un servicio Linux chico, arranca en segundos" }
  - { a: "Un servidor que corre Docker en producción", b: "VM: Proxmox recomienda Docker en una VM, no en un contenedor LXC" }
  - { a: "Un firewall (OPNsense) con su propio kernel", b: "VM: necesita su propio sistema y sus módulos de red" }
  - { a: "Un servidor web de un cliente externo, aislado del resto", b: "VM: el aislamiento de un contenedor es más débil" }
explicacion: >-
  Regla práctica: servicio Linux simple, de confianza, que no necesita su propio kernel ni
  módulos, en un contenedor sin privilegios; todo lo demás, en una VM.
