<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-size="13">
<rect x="10" y="10" width="840" height="360" rx="8" fill="var(--surface-2, #eef1f5)" stroke="currentColor" stroke-width="1"/>
<text x="30" y="40" font-family="ui-monospace, monospace" fill="var(--muted, #6b7280)"># /etc/pve/qemu-server/100.conf</text>
<text x="30" y="59" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">agent:</tspan> 1</text>
<text x="30" y="78" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">balloon:</tspan> 2048</text>
<text x="30" y="97" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">bios:</tspan> ovmf</text>
<text x="30" y="116" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">boot:</tspan> order=scsi0;ide2;net0</text>
<text x="30" y="135" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">cores:</tspan> 4</text>
<text x="30" y="154" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">cpu:</tspan> x86-64-v2-AES</text>
<text x="30" y="173" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">efidisk0:</tspan> local-lvm:vm-100-disk-1,efitype=4m,pre-enrolled-keys=1,size=4M</text>
<text x="30" y="192" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">ide2:</tspan> local:iso/debian-13.2.0-amd64-netinst.iso,media=cdrom</text>
<text x="30" y="211" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">machine:</tspan> q35</text>
<text x="30" y="230" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">memory:</tspan> 4096</text>
<text x="30" y="249" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">name:</tspan> web01</text>
<text x="30" y="268" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">net0:</tspan> virtio=BC:24:11:5A:1C:3E,bridge=vmbr0,firewall=1,tag=10</text>
<text x="30" y="287" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">onboot:</tspan> 1</text>
<text x="30" y="306" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">ostype:</tspan> l26</text>
<text x="30" y="325" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">scsi0:</tspan> local-lvm:vm-100-disk-0,discard=on,iothread=1,size=32G,ssd=1</text>
<text x="30" y="344" font-family="ui-monospace, monospace" fill="currentColor"><tspan font-weight="700">scsihw:</tspan> virtio-scsi-single</text>
</svg>
