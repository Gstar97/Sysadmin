- { id: t1, frente: "Red del nodo", dorso: "/etc/network/interfaces (ifupdown2) y ifreload -a, o Aplicar configuración en la web." }
- { id: t2, frente: "Bond", dorso: "bond-slaves, bond-mode active-backup (sin tocar el switch) o 802.3ad (LACP, con el switch configurado)." }
- { id: t3, frente: "Puente vlan-aware", dorso: "bridge-vlan-aware yes y bridge-vids 2-4094; cada VM con tag=N." }
- { id: t4, frente: "Diseño", dorso: "Administración aparte; VM en un bond con VLAN; clúster y almacenamiento en redes propias." }
- { id: t5, frente: "Antes de tocar vmbr0", dorso: "Acceso fuera de banda a mano: un error deja el nodo sin web ni SSH." }
- { id: t6, frente: "Firewall de Proxmox", dorso: "Datacenter, nodo y VM; en la VM, también firewall=1 en la placa. Segunda barrera, no reemplaza al de la red." }
