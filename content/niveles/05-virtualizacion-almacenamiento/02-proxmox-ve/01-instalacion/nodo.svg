<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, sans-serif" font-size="12">
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Qué hay adentro de un nodo de Proxmox VE</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="340" width="820" height="44" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="20" y="280" width="820" height="50" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="20" y="170" width="395" height="100" rx="6" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="425" y="170" width="200" height="100" rx="6" fill="var(--surface, #fff)"/>
    <rect x="635" y="170" width="205" height="100" rx="6" fill="var(--surface, #fff)"/>
    <rect x="20" y="50" width="250" height="110" rx="6" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="280" y="50" width="250" height="110" rx="6" fill="var(--accent-soft, #ede4fd)"/>
    <rect x="540" y="50" width="300" height="110" rx="6" fill="var(--surface-2, #eef1f5)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="430" y="360" font-weight="700">Hardware</text><text x="430" y="376" font-size="11">CPU con VT-x o AMD-V, memoria ECC, discos (SSD para el sistema), placas de red</text>
    <text x="430" y="300" font-weight="700">Debian 13 con el kernel de Proxmox</text><text x="430" y="318" font-size="11">KVM, contenedores (LXC), ZFS, LVM, Ceph; se actualiza con apt</text>
    <text x="217" y="192" font-weight="700">Servicios de Proxmox</text>
    <text x="217" y="212" font-size="11">pveproxy: la interfaz web y la API (puerto 8006)</text>
    <text x="217" y="228" font-size="11">pve-cluster: /etc/pve, la configuración (compartida en un clúster)</text>
    <text x="217" y="244" font-size="11">pvestatd, pve-firewall, pve-ha (alta disponibilidad)</text>
    <text x="217" y="260" font-size="11">qm, pct, pvesm, pveum, vzdump: lo mismo por terminal</text>
    <text x="525" y="192" font-weight="700">local</text><text x="525" y="210" font-size="11">carpeta /var/lib/vz</text><text x="525" y="226" font-size="11">ISO, plantillas de</text><text x="525" y="242" font-size="11">contenedores, respaldos</text>
    <text x="737" y="192" font-weight="700">local-lvm</text><text x="737" y="210" font-size="11">LVM-thin (o ZFS)</text><text x="737" y="226" font-size="11">los discos de las VM</text><text x="737" y="242" font-size="11">y de los contenedores</text>
    <text x="145" y="75" font-weight="700">Máquinas virtuales</text><text x="145" y="95" font-size="11">QEMU con KVM: cualquier sistema</text><text x="145" y="111" font-size="11">(Linux, Windows, BSD)</text><text x="145" y="127" font-size="11">qm, ID 100 en adelante</text><text x="145" y="143" font-size="11">/etc/pve/qemu-server/100.conf</text>
    <text x="405" y="75" font-weight="700">Contenedores LXC</text><text x="405" y="95" font-size="11">comparten el kernel: solo Linux</text><text x="405" y="111" font-size="11">livianos y rápidos de crear</text><text x="405" y="127" font-size="11">pct, mismos números de ID</text><text x="405" y="143" font-size="11">/etc/pve/lxc/101.conf</text>
    <text x="690" y="75" font-weight="700">Cómo se administra</text><text x="690" y="95" font-size="11">el navegador: https://IP:8006</text><text x="690" y="111" font-size="11">la terminal del nodo (SSH o desde la web)</text><text x="690" y="127" font-size="11">la API (pvesh, Ansible, Terraform)</text><text x="690" y="143" font-size="11">usuarios: Linux PAM o Proxmox VE</text>
  </g>
</svg>
