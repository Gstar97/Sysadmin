- { id: t1, frente: "Proxmox VE 9", dorso: "Debian 13 + KVM/QEMU + LXC + ZFS + Ceph. Web y API en https://IP:8006." }
- { id: t2, frente: "Disco del sistema", dorso: "ZFS RAID1 en dos SSD (o ext4 con LVM-thin). ZFS sin controladora RAID abajo." }
- { id: t3, frente: "Repositorios sin suscripción", dorso: "Enabled: no en pve-enterprise.sources y ceph.sources; agregar pve-no-subscription (trixie)." }
- { id: t4, frente: "Actualizar", dorso: "apt update && apt full-upgrade. Nunca apt upgrade solo. Kernel nuevo: reiniciar en una ventana." }
- { id: t5, frente: "Usuarios y permisos", dorso: "@pam (Linux) o @pve (Proxmox). pveum acl modify RUTA --users U --roles ROL. Doble factor." }
- { id: t6, frente: "Almacenamientos de fábrica", dorso: "local: ISO, plantillas, respaldos. local-lvm (o local-zfs): discos de VM y contenedores." }
