<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="12">
  <defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="430" y="22" text-anchor="middle" font-weight="700" font-size="12.5" fill="currentColor">Respaldos con Proxmox Backup Server</text>
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="50" width="190" height="130" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="20" y="200" width="190" height="80" rx="8" fill="var(--info-soft, #e0e9fd)"/>
    <rect x="290" y="50" width="300" height="250" rx="8" fill="var(--surface, #fff)"/>
    <rect x="310" y="90" width="260" height="80" rx="6" fill="var(--ok-soft, #dcf5e4)"/>
    <rect x="310" y="185" width="125" height="100" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="445" y="185" width="125" height="100" rx="6" fill="var(--surface-2, #eef1f5)"/>
    <rect x="660" y="50" width="180" height="110" rx="8" fill="var(--warn-soft, #fbf0d0)"/>
    <rect x="660" y="190" width="180" height="110" rx="8" fill="var(--surface-2, #eef1f5)" stroke-dasharray="5 4"/>
  </g>
  <g fill="var(--accent, #6d28d9)" opacity="0.75">
    <rect x="325" y="135" width="14" height="14" rx="2"/><rect x="343" y="135" width="14" height="14" rx="2"/><rect x="361" y="135" width="14" height="14" rx="2"/><rect x="379" y="135" width="14" height="14" rx="2"/>
    <rect x="397" y="135" width="14" height="14" rx="2"/><rect x="415" y="135" width="14" height="14" rx="2"/><rect x="433" y="135" width="14" height="14" rx="2"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <path d="M210 115 L306 125" marker-end="url(#pa)"/>
    <path d="M306 160 L214 238" marker-end="url(#pa)"/>
    <path d="M590 110 L656 105" marker-end="url(#pa)"/>
    <path d="M590 250 L656 245" marker-end="url(#pa)" stroke-dasharray="5 4"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="115" y="72" font-weight="700">Nodos de Proxmox VE</text>
    <text x="115" y="92" font-size="11">vzdump o un trabajo programado</text><text x="115" y="108" font-size="11">(Datacenter, Respaldo)</text>
    <text x="115" y="128" font-size="11">solo manda lo que cambió</text><text x="115" y="144" font-size="11">(dirty bitmap de QEMU)</text><text x="115" y="164" font-size="11">el agente congela los archivos</text>
    <text x="115" y="222" font-weight="700">Restaurar</text><text x="115" y="242" font-size="11">la VM entera, en vivo</text><text x="115" y="258" font-size="11">o un archivo suelto</text>
    <text x="440" y="74" font-weight="700">Proxmox Backup Server</text>
    <text x="440" y="110" font-weight="700" font-size="11.5">Datastore: trozos (chunks)</text><text x="440" y="126" font-size="11">cada trozo se guarda una sola vez</text>
    <text x="372" y="207" font-weight="700" font-size="11.5">Retención</text><text x="372" y="225" font-size="11">prune: qué copias</text><text x="372" y="241" font-size="11">quedan (7 diarias,</text><text x="372" y="257" font-size="11">4 semanales...)</text><text x="372" y="273" font-size="11">GC: libera trozos</text>
    <text x="507" y="207" font-weight="700" font-size="11.5">Verificación</text><text x="507" y="225" font-size="11">relee los trozos</text><text x="507" y="241" font-size="11">y avisa si alguno</text><text x="507" y="257" font-size="11">se dañó</text>
    <text x="750" y="72" font-weight="700">Otro PBS fuera de</text><text x="750" y="88" font-weight="700">la empresa</text><text x="750" y="110" font-size="11">trabajo de sincronización:</text><text x="750" y="126" font-size="11">la copia fuera del lugar</text><text x="750" y="142" font-size="11">(con cifrado del cliente)</text>
    <text x="750" y="215" font-weight="700">Cinta u objetos (S3)</text><text x="750" y="237" font-size="11">otra copia, otro medio</text><text x="750" y="253" font-size="11">(módulo 5.6)</text>
  </g>
  <text x="430" y="345" text-anchor="middle" font-size="11" fill="currentColor">El PBS va en otro equipo (y otros discos) que los nodos: si se pierde un nodo, los respaldos siguen ahí.</text>
</svg>
