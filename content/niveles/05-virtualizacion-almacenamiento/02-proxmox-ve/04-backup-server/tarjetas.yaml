- { id: t1, frente: "Modos de vzdump", dorso: "snapshot (normal, con el agente congelando los archivos), suspend, stop (el más limpio, con corte)." }
- { id: t2, frente: "Qué agrega PBS", dorso: "Incrementales, deduplicación en trozos, compresión, cifrado en el cliente, verificación y sincronización." }
- { id: t3, frente: "Retención", dorso: "keep-last, keep-daily, keep-weekly, keep-monthly; prune decide, GC libera el espacio; protegidos no se borran." }
- { id: t4, frente: "Agregar un PBS", dorso: "pvesm add pbs ID --server --datastore --username --password --fingerprint (o Datacenter, Almacenamiento)." }
- { id: t5, frente: "Restaurar", dorso: "qmrestore ARCHIVO ID --unique 1 (VM), pct restore (contenedor), live restore, o un archivo desde la web." }
- { id: t6, frente: "Prueba de restauración", dorso: "Todos los meses, con otro número y MAC nuevas, en una red aislada, anotando cuánto tardó." }
