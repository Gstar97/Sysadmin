tipo: emparejar
consigna: Empareja cada servicio con el puerto que usa por defecto.
pares:
  - { a: "SSH (administración remota de Linux)", b: "TCP 22" }
  - { a: "DNS (resolución de nombres)", b: "UDP y TCP 53" }
  - { a: "HTTP (web sin cifrar)", b: "TCP 80" }
  - { a: "HTTPS (web cifrada)", b: "TCP 443" }
  - { a: "RDP (escritorio remoto de Windows)", b: "TCP 3389" }
  - { a: "SMTP entre servidores de correo", b: "TCP 25" }
explicacion: >-
  Conocer los puertos por defecto acelera el diagnóstico: si un usuario no entra por escritorio
  remoto, lo primero es ver si el 3389 está abierto en el firewall. Ojo: son valores por defecto
  y se pueden cambiar (por ejemplo, SSH en otro puerto).
