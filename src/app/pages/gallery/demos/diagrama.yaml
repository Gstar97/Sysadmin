tipo: diagrama
titulo: El modelo TCP/IP, capa por capa
puntos:
  - id: aplicacion
    titulo: Aplicación
    area: { x: 3.3, y: 5.5, ancho: 93.4, alto: 20 }
    texto: >-
      Es donde viven los programas que usa la gente y los servicios del servidor: el navegador
      habla HTTP o HTTPS, el cliente de correo SMTP, la terminal remota SSH. Cuando un usuario
      dice "la página no carga", el problema puede estar aquí (el servicio web caído) o en
      cualquiera de las capas de abajo.
  - id: transporte
    titulo: Transporte
    area: { x: 3.3, y: 28.8, ancho: 93.4, alto: 20 }
    texto: >-
      Lleva los datos de un programa a otro usando puertos: 443 para HTTPS, 22 para SSH, 53 para
      DNS. TCP confirma que todo llegue y en orden (web, correo, SSH); UDP no espera
      confirmaciones y es más ligero (DNS, video, VoIP). Un firewall que bloquea un puerto corta
      la comunicación en esta capa.
  - id: internet
    titulo: Internet (red)
    area: { x: 3.3, y: 52.2, ancho: 93.4, alto: 20 }
    texto: >-
      Se ocupa de que el paquete llegue de una red a otra usando direcciones IP. Los routers
      trabajan en esta capa: miran la IP de destino y deciden por dónde mandarlo. Ping (ICMP)
      sirve justamente para probar que esta capa funciona de punta a punta.
  - id: acceso
    titulo: Acceso a la red
    area: { x: 3.3, y: 75.5, ancho: 93.4, alto: 20 }
    texto: >-
      Mueve las tramas dentro de una misma red local, de una placa de red a otra, usando
      direcciones MAC. Aquí están los cables, el Wi-Fi y los switches. Un cable desenchufado o un
      puerto de switch en la VLAN equivocada rompe todo lo de arriba, aunque la configuración de
      IP esté perfecta.
