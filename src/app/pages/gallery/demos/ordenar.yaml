tipo: ordenar
consigna: >-
  Un usuario dice que "no tiene internet". Ordena los pasos de diagnóstico de abajo hacia arriba,
  como se hace en el trabajo (del más básico al más específico).
pasos:
  - "Verificar que la interfaz esté conectada y activa (ip link o el ícono de red)"
  - "Revisar que tenga IP, máscara y puerta de enlace (ip addr, ip route)"
  - "Hacer ping a la puerta de enlace"
  - "Hacer ping a una IP pública conocida, como 1.1.1.1"
  - "Probar la resolución de nombres (dig o nslookup a un dominio)"
  - "Probar el servicio concreto (abrir la página o usar curl)"
explicacion: >-
  Cada paso depende del anterior: si no hay enlace, no sirve revisar la IP; si no llega a la
  puerta de enlace, no tiene sentido probar internet. Si el ping a 1.1.1.1 funciona pero los
  nombres no resuelven, el problema está en DNS y no en "internet".
