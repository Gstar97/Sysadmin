<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Carrera completa de administración de servidores e infraestructura, con práctica interactiva." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Carrera Sysadmin</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un parpadeo al cargar.
      try {
        var tema = localStorage.getItem('tema')
        if (tema === 'claro' || tema === 'oscuro') {
          document.documentElement.dataset.theme = tema === 'oscuro' ? 'dark' : 'light'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
