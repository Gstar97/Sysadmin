name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Validar contenido
        run: npm run validar
      - name: Pruebas unitarias
        run: npm test
      - name: Compilar
        run: npm run build
      - name: Instalar navegador para las pruebas de punta a punta
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: test-results/
          retention-days: 7
