- id: puerto
  termino: Puerto
  alias: [puerto TCP, puerto UDP]
  definicion: Número de 0 a 65535 que identifica a qué programa va dirigido el tráfico dentro de un equipo.
  leccion: n0-m1-l1
- id: tcp
  termino: TCP
  definicion: Protocolo de transporte que confirma la entrega y mantiene el orden de los datos.
  leccion: n0-m1-l1
- id: udp
  termino: UDP
  definicion: Protocolo de transporte sin confirmaciones, más ligero; lo usan DNS, video y voz.
  leccion: n0-m1-l1
