id: '9'
titulo: Profesional
descripcion: >-
  Lo que separa a alguien que sabe de alguien a quien le confían la infraestructura:
  documentación, inventario, gestión de cambios, ITIL, tickets y acuerdos de nivel de
  servicio, comunicación con personas usuarias y con la gerencia, guardias, incidentes
  mayores, y la preparación para certificaciones y entrevistas laborales.
perfil_salida: >-
  Documentar y operar la infraestructura con procesos profesionales, comunicar con
  claridad bajo presión y presentarse al mercado laboral con un portfolio demostrable y
  un plan de certificaciones.
modulos:
  - id: '9.1'
    titulo: Documentación e inventario
    requiere: []
    lecciones:
      - t: Documentación que sirve
        h: 2
        obj:
          - Diferenciar procedimientos operativos, documentos de arquitectura y base de conocimiento.
          - Escribir documentación clara con plantillas, ya sea como código (Markdown en Git) o en una wiki.
        ui: Encontrar lo que le falta a un procedimiento.
      - t: Diagramas
        h: 2
        obj:
          - Diferenciar diagramas lógicos, físicos, de red y de rack.
          - Usar convenciones y herramientas (draw.io, Mermaid).
        ui: Armar un diagrama arrastrando elementos.
      - t: Inventario y CMDB
        h: 2
        obj:
          - Mantener un inventario de activos y sus relaciones (CMDB) con NetBox o GLPI.
          - Gestionar direcciones IP (IPAM) y el ciclo de vida del hardware (garantías y fin de soporte).
        ui: Emparejar activos con sus relaciones.
    lab:
      t: Documentar la infraestructura del laboratorio en NetBox y escribir tres procedimientos operativos.
      h: 3
    caso:
      t: Renunció la única persona que sabía cómo funcionaba un sistema (reconstruir la documentación).
      h: 1.5

  - id: '9.2'
    titulo: Cambios y mantenimiento
    requiere: []
    lecciones:
      - t: Gestión de cambios
        h: 2
        obj:
          - Clasificar cambios (estándar, normal y de emergencia) y escribir una solicitud de cambio.
          - Evaluar riesgo e impacto y presentar el cambio ante un comité de cambios.
        ui: Clasificar cambios.
      - t: Ventanas de mantenimiento y vuelta atrás
        h: 2
        obj:
          - Planificar una ventana (comunicación, lista de verificación y criterios para seguir o abortar).
          - Escribir y ensayar un plan de vuelta atrás.
        ui: Ordenar los pasos de una ventana de mantenimiento.
      - t: Análisis posteriores sin culpables
        h: 1.5
        obj:
          - Escribir un análisis posterior a un incidente (línea de tiempo, causas y acciones).
          - Usar los cinco porqués sin buscar culpables.
        ui: Escenario guiado.
    lab:
      t: Plan de cambio completo para migrar el servidor de archivos, con vuelta atrás ensayada.
      h: 2.5
    caso:
      t: La actualización del firewall se complicó a las 2 de la mañana (decidir la vuelta atrás).
      h: 1.5

  - id: '9.3'
    titulo: ITIL y operación de servicios
    requiere: []
    lecciones:
      - t: ITIL 4 básico
        h: 2
        obj:
          - Entender servicio y valor según ITIL 4.
          - Diferenciar las prácticas principales (incidentes, problemas, cambios y solicitudes).
        ui: Emparejar situación con práctica.
      - t: Tickets
        h: 2
        obj:
          - Priorizar por impacto y urgencia y escribir buenas notas en los tickets.
          - Conocer herramientas (GLPI, Zammad, Jira Service Management).
        ui: Bandeja de tickets simulada para priorizar.
      - t: SLA, SLO y métricas
        h: 1.5
        obj:
          - Diferenciar SLA, SLO y OLA.
          - Medir MTTR, MTBF y cumplimiento.
        ui: Calculadora de cumplimiento de SLA.
    lab:
      t: Montar GLPI o Zammad, definir categorías y SLA y procesar una bandeja de 20 tickets simulados.
      h: 2.5
    caso:
      t: Tres incidentes al mismo tiempo y una sola persona de guardia (priorización).
      h: 1.5

  - id: '9.4'
    titulo: Comunicación y trabajo bajo presión
    requiere: []
    lecciones:
      - t: Comunicación con usuarios
        h: 1.5
        obj:
          - Explicar problemas técnicos en lenguaje simple y manejar expectativas.
          - Escribir correos y avisos de mantenimiento claros.
        ui: Elegir la mejor respuesta entre varias.
      - t: Comunicación con la gerencia
        h: 2
        obj:
          - Traducir lo técnico a riesgo, costo e impacto.
          - Presentar propuestas y presupuestos.
        ui: Reescritura guiada de un informe técnico.
      - t: Guardias
        h: 1.5
        obj:
          - Organizar rotaciones de guardia, escalamiento y traspaso de turno.
          - Cuidar la salud y evitar el agotamiento.
        ui: Escenarios de decisión.
      - t: Incidentes mayores
        h: 2
        obj:
          - Organizar roles (coordinación del incidente, comunicaciones y equipo técnico).
          - Mantener actualizaciones de estado periódicas y una sala de crisis ordenada.
        ui: Simulacro interactivo con reloj.
    lab:
      t: Simulacro de incidente mayor con roles, actualizaciones de estado escritas y análisis posterior.
      h: 2.5
    caso:
      t: La gerencia pregunta cada cinco minutos cuándo vuelve el sistema (comunicación bajo presión).
      h: 1.5

  - id: '9.5'
    titulo: Certificaciones y búsqueda laboral
    requiere: []
    lecciones:
      - t: Mapa de certificaciones
        h: 2
        obj:
          - Conocer las certificaciones más pedidas y un orden lógico para rendirlas (CompTIA A+, Network+, Security+ y Linux+; CCNA; RHCSA y LPIC-1; Microsoft AZ-900, AZ-104 y AZ-802; AWS Cloud Practitioner, Solutions Architect Associate y CloudOps Engineer Associate; CKA; Terraform Associate).
          - Elegir según el objetivo laboral y armar un plan de estudio, verificando siempre la versión vigente de cada examen.
        ui: Asistente "¿qué certificación conviene?".
      - t: Simulacros por certificación
        h: 4
        obj:
          - Rendir simulacros armados con el banco de preguntas de la carrera, agrupado por dominio de cada examen.
          - Identificar los dominios flojos y repasarlos.
        ui: Motor de exámenes en modo simulacro.
      - t: CV y portfolio
        h: 2
        obj:
          - Convertir los proyectos de la carrera en un portfolio (repositorio, diagramas y documentación).
          - Escribir un CV técnico y un perfil profesional orientados a logros.
        ui: Lista de verificación guiada.
      - t: Entrevistas técnicas
        h: 2.5
        obj:
          - Responder preguntas técnicas típicas y resolver troubleshooting en vivo explicando el razonamiento.
          - Preparar respuestas sobre experiencias con el método STAR.
        ui: Entrevista simulada con preguntas al azar.
    lab:
      t: Portfolio publicado con los proyectos de la carrera.
      h: 4
    caso:
      t: 'Entrevista técnica en vivo: el sitio está caído y hay 20 minutos para encontrar la causa explicando cada paso.'
      h: 1.5

proyecto:
  t: Carpeta profesional
  h: 16
  entregables:
    - Documentación completa (arquitectura, inventario y procedimientos) de la infraestructura construida en la carrera.
    - Plan de cambio con vuelta atrás y análisis posterior de un incidente simulado.
    - CV, portfolio publicado y plan de certificaciones.
    - Entrevista técnica simulada completa.
